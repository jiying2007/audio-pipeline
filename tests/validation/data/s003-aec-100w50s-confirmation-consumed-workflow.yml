name: Research S003 AEC 100w-50s Geometry Confirmation v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1.json'
      - 'docs/program/iterations/S003-aec-recovery-window-geometry-decomposition-v1-result.json'
      - 'validation/tools/build_aec_stage_recovery_corpus.py'
      - 'validation/tools/aec_recovery_window_geometry.py'
      - 'validation/tools/aec_recovery_100w50s_confirmation.py'
      - 'validation/policies/validation-s003-aec-stage-recovery.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-100w50s-geometry-confirmation-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1.json'
      - 'docs/program/iterations/S003-aec-recovery-window-geometry-decomposition-v1-result.json'
      - 'validation/tools/build_aec_stage_recovery_corpus.py'
      - 'validation/tools/aec_recovery_window_geometry.py'
      - 'validation/tools/aec_recovery_100w50s_confirmation.py'
      - 'validation/policies/validation-s003-aec-stage-recovery.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-100w50s-geometry-confirmation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-s003-aec-100w50s-confirmation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-100w50s-confirmation

      - name: Validate candidate-zero confirmation contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1.json >/dev/null
          python3 -m py_compile             validation/tools/build_aec_stage_recovery_corpus.py             validation/tools/aec_recovery_window_geometry.py             validation/tools/aec_recovery_100w50s_confirmation.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_recovery_100w50s_confirmation.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-recovery-window-geometry-decomposition-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_MEASUREMENT_METHOD_CONFIRMATION_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['promotion_allowed'] is False and c['shipping_change_allowed'] is False
          assert c['corpus']['fresh_seeds']==[12307,12407,12507,12607]
          assert c['hypothesis']['compared_geometries']==['100w-100s','100w-50s']
          rule=c['hypothesis']['confirmation_rule']
          assert rule['minimum_non_worse_case_profiles']==13
          assert rule['total_case_profiles']==15
          assert rule['total_cross_seed_range_rule']=='sum(range_100w50s) < sum(range_100w100s)'
          assert rule['censoring_rule']=='zero censored observations under both geometries'
          assert c['preregistered_rules']['either_outcome_is_valid_evidence'] is True
          assert c['preregistered_rules']['no_geometry_sweep'] is True
          assert c['preregistered_rules']['no_parameter_search'] is True
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['reviewed_validity']['measurement_default_change_authority'] is False
          print('S003 100w-50s confirmation authority: PASS')
          PY

      - name: Build fixed diagnostic stage-prefix processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-aec-100w50s             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-aec-100w50s --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-aec-100w50s/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-aec-100w50s/libaudio_pipeline.a -lm             -o build-s003-aec-100w50s/stage_prefix_process_pcm

      - name: Run independent fresh confirmation
        run: |
          set -euo pipefail
          out=s003-aec-100w50s-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1.json

          for seed in 12307 12407 12507 12607; do
            corpus="/tmp/s003-aec-100w50s-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            python3 validation/tools/build_aec_stage_recovery_corpus.py               --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools             python3 validation/tools/stage_interaction_run.py               --source-revision '${{ github.sha }}'               --corpus "$corpus/corpus.json"               --policy validation/policies/validation-s003-aec-stage-recovery.json               --dataset-lock validation/datasets.lock.json               --processor build-s003-aec-100w50s/stage_prefix_process_pcm               --output "$seed_out/canonical-report.json"               --evidence-manifest "$seed_out/evidence-manifest.json"               --enforce

            PYTHONPATH=validation/tools             python3 validation/tools/aec_recovery_100w50s_confirmation.py run               --corpus "$corpus/corpus.json"               --report "$seed_out/canonical-report.json"               --processor build-s003-aec-100w50s/stage_prefix_process_pcm               --contract "$contract"               --output "$seed_out/confirmation.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools           python3 validation/tools/aec_recovery_100w50s_confirmation.py aggregate             --contract "$contract"             --input "$out/12307/confirmation.json"             --input "$out/12407/confirmation.json"             --input "$out/12507/confirmation.json"             --input "$out/12607/confirmation.json"             --output "$out/cross-seed-confirmation.json"

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish confirmation outcome
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-100w50s-out/cross-seed-confirmation.json').read_text())
          m=r['mechanical_result']
          print('## S003 AEC 100w-50s geometry confirmation')
          print('')
          print('- Authority: candidate-zero measurement-method confirmation only')
          print(f"- Outcome: {r['outcome']}")
          print(f"- Non-worse case/profile ranges: {m['non_worse_case_profiles']}/{m['total_case_profiles']}")
          print(f"- Summed ranges: {m['summed_cross_seed_range_ms']}")
          print(f"- Censored observations: {m['censored_observations']}")
          print(f"- Research measurement geometry authority: {r['research_measurement_geometry_authority']}")
          print('- DSP candidate authority: none')
          PY

      - name: Upload hash-bound confirmation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s003-aec-100w50s-confirmation-${{ github.run_id }}
          path: s003-aec-100w50s-out/
          if-no-files-found: error
          retention-days: 30
