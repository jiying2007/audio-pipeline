name: Research I016 VAD Local-Evidence Gated Blend v1
run-name: "i016-vad-gated-blend-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i016-vad-local-evidence-gated-blend-v1.json'
      - 'tests/validation/i016_vad_local_evidence_gated_blend_probe.c'
      - 'tests/validation/i016_vad_local_evidence_gated_blend.py'
      - 'tests/validation/test_i016_one_shot_guard.py'
      - '.github/workflows/research-i016-vad-local-evidence-gated-blend-v1.yml'
      - 'tests/validation/data/i016-consumed-workflow.yml'
      - 'tests/validation/test_i016_retirement.py'
      - '.github/research/continuous-optimization/development-v4/i016-vad-local-evidence-gated-blend-v1-result.json'
      - 'validation/research/evidence/i016-36245702675/**'

permissions:
  contents: read

concurrency:
  group: research-i016-vad-gated-blend-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i016-vad-local-evidence-gated-blend-v1.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I016 frozen single-candidate contract
        run: |
          set -euo pipefail
          python3 tests/validation/test_i016_retirement.py
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i016_vad_local_evidence_gated_blend.py
          python3 tests/validation/i016_vad_local_evidence_gated_blend.py --self-test
          python3 tests/validation/test_i016_one_shot_guard.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i016-vad-local-evidence-gated-blend-v1.json').read_text())
          assert c['authority']=='RESEARCH_SELECTION_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          assert c['budget']=={
            'candidate_limit':1,'confirmation_limit':0,'development_execution_limit':1}
          assert c['fresh_development']['seeds']==[311123,321123,331123]
          assert c['output_authority']['maximum_status']=='FROZEN_RESEARCH_CANDIDATE'
          assert c['output_authority']['automatic_main_mutation'] is False
          prior=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i015-vad-upstream-consumption-decomposition-v1-result.json').read_text())
          assert prior['status']=='CLOSED_DIAGNOSTIC_ONLY'
          assert prior['reviewed_decision']=='VAD_UPSTREAM_RECALL_FALSE_ACTIVATION_TRADEOFF_NO_LANE_SELECTION'
          PY
          git cat-file -e "57e4c64adc1cf06819e46e24e275ecd746d5f17f^{commit}"
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i016-vad-gated-blend-contract
      - name: Compile I016 probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i016-contract -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i016-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i016-contract/generated             tests/validation/i016_vad_local_evidence_gated_blend_probe.c             build-i016-contract/libaudio_pipeline.a -lm             -o build-i016-contract/i016-vad-gated-blend-probe
