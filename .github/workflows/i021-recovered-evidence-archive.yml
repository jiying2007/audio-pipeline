name: I021 Recovered Evidence Archive
run-name: "i021-recovered-evidence-archive / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/program/i021_archive_recovery.py'
      - '.github/workflows/i021-recovered-evidence-archive.yml'
      - 'tests/validation/test_i021_archive_recovery.py'
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1-result.json'
      - 'validation/research/evidence/i021-recovery-36419466840/**'
  push:
    branches: [main]
    paths:
      - '.github/program/i021_archive_recovery.py'
      - '.github/workflows/i021-recovered-evidence-archive.yml'
      - 'tests/validation/test_i021_archive_recovery.py'
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1-result.json'
      - 'validation/research/evidence/i021-recovery-36419466840/**'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: i021-recovered-evidence-archive-trusted-main
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate copy-only recovered-evidence archive contract
        run: |
          set -euo pipefail
          python3 -m py_compile .github/program/i021_archive_recovery.py
          python3 .github/program/i021_archive_recovery.py --self-test
          python3 .github/program/i021_archive_recovery.py --check
          python3 tests/validation/test_i021_archive_recovery.py

  publish:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Reverify recovery artifact and publish exact-byte archive PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ secrets.RESEARCH_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/program/i021_archive_recovery.py             --publish             --output i021-archive-out
      - name: Publish bounded archive status
        if: always()
        run: |
          if test -f i021-archive-out/status.json; then
            cat i021-archive-out/status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve archive publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i021-archive-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: i021-archive-out/
          retention-days: 90
          if-no-files-found: warn
