name: Research S003 AEC Metric-Safe Evidence v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-metric-safe-evidence-v1.json'
      - 'docs/program/iterations/S003-mic-mismatch-hpf-aware-reference-oracle-v1-result.json'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/aec_metric_safe_evidence.py'
      - 'validation/policies/validation-aec-transition-development.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-metric-safe-evidence-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-metric-safe-evidence-v1.json'
      - 'docs/program/iterations/S003-mic-mismatch-hpf-aware-reference-oracle-v1-result.json'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/aec_metric_safe_evidence.py'
      - 'validation/policies/validation-aec-transition-development.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-metric-safe-evidence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-s003-aec-metric-safe-evidence-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-metric-safe

      - name: Validate candidate-zero metric contract
        run: |
          set -euo pipefail
          python3 -m json.tool docs/program/iterations/S003-aec-metric-safe-evidence-v1.json >/dev/null
          python3 -m py_compile             validation/tools/build_aec_transition_corpus.py             validation/tools/aec_metric_safe_evidence.py
          PYTHONPATH=validation/tools python3 validation/tools/aec_metric_safe_evidence.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-metric-safe-evidence-v1.json').read_text())
          prior=json.loads(Path('docs/program/iterations/S003-mic-mismatch-hpf-aware-reference-oracle-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_DIAGNOSTIC_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['promotion_allowed'] is False and c['shipping_change_allowed'] is False
          assert c['corpus']['fresh_seeds']==[10307,10407]
          assert c['corpus']['case_count']==8
          assert c['preregistered_rules']['reject_raw_clean_si_sdr_as_primary_near_end_only_metric'] is True
          assert c['preregistered_rules']['no_performance_threshold_search'] is True
          assert c['preregistered_rules']['no_aec_parameter_search'] is True
          assert c['authority_boundary']['may_open_s004'] is False
          assert prior['status']==c['predecessor']['required_status']
          assert prior['candidate_line_review']['status']=='TERMINAL_REJECTED_METRIC_REFERENCE_ARTIFACT'
          assert c['metric_applicability']['near-end-only']['forbidden_primary_metrics']==['near_si_sdr_improvement_db']
          print('S003 AEC metric-safe authority: PASS')
          PY

      - name: Build fixed full-pipeline and HPF-reference processors
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-aec-metric             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-aec-metric --target ap_process_pcm audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-aec-metric/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-aec-metric/libaudio_pipeline.a -lm             -o build-s003-aec-metric/stage_prefix_process_pcm

      - name: Run fresh canonical AEC transition evidence
        run: |
          set -euo pipefail
          out=s003-aec-metric-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-metric-safe-evidence-v1.json

          for seed in 10307 10407; do
            corpus="/tmp/s003-aec-metric-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            python3 validation/tools/build_aec_transition_corpus.py               --output "$corpus" --seed "$seed" --seconds 6

            python3 validation/tools/run_validation.py               --source-revision '${{ github.sha }}'               --corpus "$corpus/corpus.json"               --policy validation/policies/validation-aec-transition-development.json               --dataset-lock validation/datasets.lock.json               --processor build-s003-aec-metric/ap_process_pcm               --output "$seed_out/canonical-report.json"               --evidence-manifest "$seed_out/evidence-manifest.json"

            PYTHONPATH=validation/tools             python3 validation/tools/aec_metric_safe_evidence.py run               --corpus "$corpus/corpus.json"               --report "$seed_out/canonical-report.json"               --full-processor build-s003-aec-metric/ap_process_pcm               --hpf-processor build-s003-aec-metric/stage_prefix_process_pcm               --contract "$contract"               --output "$seed_out/aec-metric-safe-report.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools           python3 validation/tools/aec_metric_safe_evidence.py aggregate             --contract "$contract"             --input "$out/10307/aec-metric-safe-report.json"             --input "$out/10407/aec-metric-safe-report.json"             --output "$out/cross-seed-metric-consistency.json"

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish metric-safe outcome
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root=Path('s003-aec-metric-out')
          agg=json.loads((root/'cross-seed-metric-consistency.json').read_text())
          print('## S003 AEC metric-safe evidence')
          print('')
          print('- Authority: **candidate-zero / metric applicability only / non-shipping**')
          print(f"- Fresh seeds: `{agg['fresh_seeds']}`")
          print(f"- Metric applicability map complete: `{agg['metric_applicability_map_complete']}`")
          print('- near-end-only raw-clean SI-SDR improvement primary metric: **rejected**')
          print('- Algorithm performance verdict: **NOT_AUTHORIZED**')
          for seed in (10307,10407):
              report=json.loads((root/str(seed)/'aec-metric-safe-report.json').read_text())
              by={x['case_id']:x for x in report['cases']}
              print(f"- seed `{seed}`:")
              print(
                  f"  - far-end-static ERLE: "
                  f"`{by['far-end-static-a']['canonical_metrics']['erle_db']:.3f} dB`"
              )
              print(
                  f"  - double-talk render-corr reduction: "
                  f"`{by['double-talk']['canonical_metrics']['output_render_corr_reduction']:.6f}`"
              )
              print(
                  f"  - near-end-only HPF-aware SI-SDR: "
                  f"`{by['near-end-only']['derived_metrics']['hpf_aware_near_si_sdr_db']:.3f} dB`"
              )
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound metric evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s003-aec-metric-safe-evidence-${{ github.run_id }}
          path: s003-aec-metric-out/
          if-no-files-found: error
          retention-days: 30
