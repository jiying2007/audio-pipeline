name: Research dEchorate Ground-Truth Diagnostic V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/dechorate-ground-truth-diagnostic-v1.json'
      - '.github/research/continuous-optimization/dechorate_ground_truth_diagnostic_v1.py'
      - '.github/workflows/research-dechorate-ground-truth-diagnostic-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/dechorate-ground-truth-diagnostic-v1.json'
      - '.github/research/continuous-optimization/dechorate_ground_truth_diagnostic_v1.py'
      - '.github/workflows/research-dechorate-ground-truth-diagnostic-v1.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: research-dechorate-ground-truth-diagnostic-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maintenance:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      skip_measurement: ${{ steps.scope.outputs.skip_measurement }}
    steps:
      - name: Check out the exact protected PR base
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: trusted-policy
      - name: Qualify direct PR maintenance from protected source
        id: scope
        working-directory: trusted-policy
        shell: bash
        run: |
          set -euo pipefail
          mkdir ../pin-maintenance
          python3 .github/program/workflow_pin_pr_consumer.py \
            --workflow .github/workflows/research-dechorate-ground-truth-diagnostic-v1.yml \
            --event-file "$GITHUB_EVENT_PATH" \
            --receipt ../pin-maintenance/maintenance.json \
            --github-output "$GITHUB_OUTPUT" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Preserve the nonmeasurement decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-pin-maintenance-research-dechorate-ground-truth-diagnostic-v1-${{ github.run_id }}
          path: pin-maintenance/maintenance.json
          if-no-files-found: error
          retention-days: 30

  diagnostic:
    needs: maintenance
    if: ${{ !cancelled() && !(needs.maintenance.result == 'success' && needs.maintenance.outputs.skip_measurement == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind diagnostic to exact source and research-only scope
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -c "safe.directory=$PWD" rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json,os,re,subprocess,sys
          from pathlib import Path
          event_file=Path(os.environ['GITHUB_EVENT_PATH']).resolve()
          event=json.loads(event_file.read_text())
          kind=os.environ['GITHUB_EVENT_NAME']
          assert kind in ('pull_request','push')
          base=event['pull_request']['base']['sha'] if kind=='pull_request' else event['before']
          assert type(base) is str and re.fullmatch(r'[0-9a-f]{40}',base) and base!='0'*40
          run_id=os.environ['GITHUB_RUN_ID']
          attempt=os.environ['GITHUB_RUN_ATTEMPT']
          assert re.fullmatch(r'[1-9][0-9]{0,18}',run_id) and re.fullmatch(r'[1-9][0-9]{0,18}',attempt)
          policy=Path(os.environ['RUNNER_TEMP'])/('dechorate-source-policy-'+run_id+'-'+attempt)
          assert not policy.exists() and not policy.is_symlink()
          subprocess.run(['git','-c','safe.directory='+str(Path.cwd()),'-c','core.hooksPath=/dev/null',
              'worktree','add','--detach',str(policy),base],check=True)
          receipt=Path.cwd()/'dechorate-ground-truth-v1-out'/'source-range.json'
          subprocess.run([sys.executable,str(policy/'.github/program/dechorate_governance_v2.py'),'consumer',
              '--event-file',str(event_file),'--output',str(receipt)],check=True)
          PY

      - name: Preserve the independent source-range decision
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dechorate-event-source-range-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dechorate-ground-truth-v1-out/source-range.json
            dechorate-ground-truth-v1-out/source-range.json.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Validate code provenance and diagnostic authority
        run: |
          set -euo pipefail
          python3 -m py_compile .github/research/continuous-optimization/dechorate_ground_truth_diagnostic_v1.py
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          m=json.loads(Path('.github/research/continuous-optimization/development-v3/dechorate-ground-truth-diagnostic-v1.json').read_text())
          q=json.loads(Path(m['source']['qualification_manifest']).read_text())
          assert q['authority']=='SOURCE_QUALIFICATION_ONLY' and q['candidate_budget']==0
          assert q['inventory_protocol']['inventory_frozen'] is True
          assert q['inventory_protocol']['expected_unique_room_count']==11
          assert q['inventory_protocol']['expected_selected_fingerprint_sha256']==m['frozen_microset']['expected_qualification_fingerprint_sha256']
          assert m['diagnostic_contract']['run_activity_or_dtd'] is False
          assert m['diagnostic_contract']['synthesize_audio'] is False
          assert m['diagnostic_contract']['modify_or_normalize_rir'] is False
          rev=m['source']['official_code_revision']
          paths={
            'main_build_sofa_database.py':'dechorate/main_build_sofa_database.py',
            'main_estimate_rirs.py':'dechorate/main_estimate_rirs.py',
            'stimulus.py':'dechorate/stimulus.py',
            '__init__.py':'dechorate/__init__.py',
          }
          for key,path in paths.items():
              url=f'https://raw.githubusercontent.com/Chutlhu/dEchorate/{rev}/{path}'
              req=urllib.request.Request(url,headers={'User-Agent':'audio-pipeline-dechorate-diagnostic/1'})
              with urllib.request.urlopen(req,timeout=60) as r: data=r.read()
              blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert blob==m['source']['official_code_blobs'][key],(key,blob,m['source']['official_code_blobs'][key])
          print('dEchorate code provenance and diagnostic authority: PASS')
          PY

      - name: Materialize exact frozen SOFA microset
        run: |
          set -euo pipefail
          mkdir -p dechorate-ground-truth-v1-out/source
          python3 - <<'PY'
          import hashlib,json,urllib.request
          from pathlib import Path
          from urllib.parse import urljoin
          m=json.loads(Path('.github/research/continuous-optimization/development-v3/dechorate-ground-truth-diagnostic-v1.json').read_text())
          q=json.loads(Path(m['source']['qualification_manifest']).read_text())
          base=q['source']['sofa_mirror_index']
          sofas=[o for o in q['inventory_protocol']['expected_selected_objects'] if o['name'].endswith('.sofa')]
          assert len(sofas)==11
          out=Path('dechorate-ground-truth-v1-out/source')
          for obj in sofas:
              req=urllib.request.Request(urljoin(base,obj['name']),headers={'User-Agent':'audio-pipeline-dechorate-diagnostic/1'})
              with urllib.request.urlopen(req,timeout=120) as r: data=r.read()
              assert len(data)==obj['size_bytes'],obj['name']
              assert hashlib.sha256(data).hexdigest()==obj['sha256'],obj['name']
              (out/obj['name']).write_bytes(data)
          print({'sofa_objects':len(sofas),'bytes':sum(o['size_bytes'] for o in sofas)})
          PY

      - name: Install pinned schema reader and run self-test
        run: |
          set -euo pipefail
          python3 -m venv /tmp/dechorate-ground-truth-venv
          /tmp/dechorate-ground-truth-venv/bin/python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'h5py==3.14.0'
          /tmp/dechorate-ground-truth-venv/bin/python .github/research/continuous-optimization/dechorate_ground_truth_diagnostic_v1.py --self-test

      - name: Run fixed-geometry RIR ground-truth diagnostic
        run: |
          set -euo pipefail
          /tmp/dechorate-ground-truth-venv/bin/python .github/research/continuous-optimization/dechorate_ground_truth_diagnostic_v1.py \
            --input-dir dechorate-ground-truth-v1-out/source \
            --qualification-manifest .github/research/continuous-optimization/development-v3/dechorate-source-qualification-v1.json \
            --output dechorate-ground-truth-v1-out/dechorate-ground-truth-result.json

      - name: Enforce evidence shape without deriving a boundary
        run: |
          set -euo pipefail
          /tmp/dechorate-ground-truth-venv/bin/python - <<'PY'
          import json,math
          from pathlib import Path
          p=json.loads(Path('dechorate-ground-truth-v1-out/dechorate-ground-truth-result.json').read_text())
          a=p['aggregate']
          assert p['schema_version']==1 and p['investigation']=='dechorate-ground-truth-diagnostic-v1'
          assert a['room_count']==11 and a['sampling_rate_hz']==48000 and a['reference_room']=='000000'
          assert a['geometry_invariant'] is True
          assert a['activity_or_dtd_executed'] is False and a['audio_synthesized'] is False
          assert a['rir_normalized_or_modified'] is False and a['absolute_spl_or_device_gain_claimed'] is False
          assert a['selection_threshold_derived'] is False and a['candidate_authority'] is False
          assert len(p['cases'])==11
          assert all(c['data_delay_all_zero'] for c in p['cases'])
          numeric=[
            a['median_per_mic_total_energy_span_db'],a['room_median_total_energy_relative_db_min'],
            a['room_median_total_energy_relative_db_max'],a['room_median_total_energy_relative_db_span'],
            a['median_per_mic_peak_span_db'],a['room_median_peak_relative_db_min'],
            a['room_median_peak_relative_db_max'],a['room_median_peak_relative_db_span'],
          ]+a['per_mic_total_energy_span_db']+a['per_mic_peak_span_db']
          assert all(math.isfinite(float(v)) for v in numeric)
          assert all(float(v)>=0 for v in a['per_mic_total_energy_span_db']+a['per_mic_peak_span_db'])
          print(json.dumps(a,indent=2,sort_keys=True))
          PY

      - name: Seal research evidence
        run: |
          set -euo pipefail
          cp .github/research/continuous-optimization/development-v3/dechorate-ground-truth-diagnostic-v1.json dechorate-ground-truth-v1-out/manifest.json
          git rev-parse HEAD > dechorate-ground-truth-v1-out/source-sha.txt
          find dechorate-ground-truth-v1-out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > dechorate-ground-truth-v1-out/SHA256SUMS

      - name: Upload research evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dechorate-ground-truth-diagnostic-v1-${{ github.run_id }}
          path: dechorate-ground-truth-v1-out/
          if-no-files-found: error
          retention-days: 30
