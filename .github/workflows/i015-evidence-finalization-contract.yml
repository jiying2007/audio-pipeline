name: I015 Evidence Finalization Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/program/i015-finalization.json'
      - '.github/program/i015_finalize.py'
      - '.github/program/i015_archive_recovery.py'
      - 'scripts/ci_impact.py'
      - 'tests/validation/test_ci_archive_receipts.py'
      - 'tests/validation/test_i015_archive_recovery.py'
      - 'tests/validation/test_i015_finalize.py'
      - '.github/workflows/i015-evidence-finalization*.yml'
      - '.github/research/continuous-optimization/development-v4/i015-vad-upstream-consumption-decomposition-v1-result.json'
      - 'validation/research/evidence/i015-35994848668/**'
      - 'docs/program/I015-FINALIZATION.md'
  push:
    branches: [main]
    paths:
      - '.github/program/i015-finalization.json'
      - '.github/program/i015_finalize.py'
      - '.github/program/i015_archive_recovery.py'
      - 'scripts/ci_impact.py'
      - 'tests/validation/test_ci_archive_receipts.py'
      - 'tests/validation/test_i015_archive_recovery.py'
      - 'tests/validation/test_i015_finalize.py'
      - '.github/workflows/i015-evidence-finalization*.yml'
      - '.github/research/continuous-optimization/development-v4/i015-vad-upstream-consumption-decomposition-v1-result.json'
      - 'validation/research/evidence/i015-35994848668/**'
      - 'docs/program/I015-FINALIZATION.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate offline finalizer contracts and any committed archive
        run: |
          set -euo pipefail
          python3 -m py_compile .github/program/i015_finalize.py .github/program/i015_archive_recovery.py
          python3 tests/validation/test_i015_finalize.py
          python3 tests/validation/test_ci_archive_receipts.py
          python3 tests/validation/test_i015_archive_recovery.py
      - name: Keep publishing credentials separate from governance
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          text = Path('.github/workflows/i015-evidence-finalization.yml').read_text()
          # Build test literals at runtime: Actions must not expand secret expressions.
          def binding(value):
              return 'GH_WRITE_TOKEN: $' + '{{ ' + value + ' }}'

          expected = binding('secrets.RESEARCH_AUTOMATION_TOKEN')

          def dedicated_writer(source):
              bindings = [line.strip() for line in source.splitlines()
                          if line.strip().startswith('GH_WRITE_TOKEN:')]
              secrets = set(re.findall(r'secrets\.([A-Za-z0-9_]+)', source))
              return (bindings == [expected]
                      and secrets == {'RESEARCH_AUTOMATION_TOKEN'})

          assert dedicated_writer(text), 'publishing identity must be explicit and dedicated'
          for invalid in (
              binding('secrets.RESEARCH_AUTOMATION_TOKEN || secrets.REPOSITORY_ADMIN_TOKEN'),
              binding('secrets.REPOSITORY_GOVERNANCE_TOKEN'),
              binding('secrets.RESEARCH_AUTOMATION_TOKEN || github.token'),
              '',
          ):
              assert not dedicated_writer(text.replace(expected, invalid))
          print('dedicated writer binding: PASS; 4 negative cases: PASS')
          PYCODE
