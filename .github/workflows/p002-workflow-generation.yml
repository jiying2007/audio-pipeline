name: P002 Workflow Generation

on:
  push:
    branches: [governance/p002-governance-fix-v1]
    paths:
      - .github/program/p002_generate_workflows.py
      - .github/workflows/p002-workflow-generation.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: governance/p002-governance-fix-v1
          fetch-depth: 0
      - name: Generate and validate replacement workflows
        run: |
          set -euo pipefail
          python3 .github/program/p002_generate_workflows.py
          ruby -e 'require "yaml"; ARGV.each { |p| abort("invalid YAML: #{p}") unless Psych.parse_file(p) }' .github/program/generated-p002/*.yml
          grep -q 'Verify existing immutable release identity' .github/program/generated-p002/release.yml
          test "$(grep -c "docs/program/iterations/I007-closure.json" .github/program/generated-p002/i007-closure.yml)" -ge 2
          test "$(grep -c "docs/program/iterations/I009-closure.json" .github/program/generated-p002/i009-closure.yml)" -ge 2
          git diff --check
      - name: Commit generated non-workflow blobs only
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/program/generated-p002
          git diff --cached --quiet && exit 0
          git commit -m 'governance: materialize verified P002 workflow blobs'
          git push origin HEAD:governance/p002-governance-fix-v1
