name: Research Matched Gain-Chain Factor Plan Lab Binding V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.schema.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.template.json'
      - '.github/workflows/research-matched-gain-chain-factor-plan-lab-binding-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.schema.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.template.json'
      - '.github/workflows/research-matched-gain-chain-factor-plan-lab-binding-v1.yml'

permissions:
  contents: read

jobs:
  validate-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Validate immutable binding contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, subprocess
          from pathlib import Path

          root = Path('.github/research/continuous-optimization/development-v3')
          resolution = root / 'matched-gain-chain-factor-plan-resolution-v1.json'
          schema = root / 'matched-gain-chain-factor-plan-lab-binding-v1.schema.json'
          template = root / 'matched-gain-chain-factor-plan-lab-binding-v1.template.json'
          binding = root / 'matched-gain-chain-factor-plan-lab-binding-v1.json'

          predecessor = json.loads(resolution.read_text())
          assert predecessor['authority'] == 'PRECAPTURE_RESOLUTION_ONLY'
          assert predecessor['candidate_budget'] == 0
          assert predecessor['state']['repository_resolution_complete'] is True
          assert predecessor['state']['lab_resolution_complete'] is False
          assert predecessor['state']['freeze_complete'] is False
          assert predecessor['state']['hardware_execution_authorized'] is False
          assert predecessor['next_authorized_step']['name'] == 'matched-gain-chain-factor-plan-lab-binding-v1'
          assert predecessor['next_authorized_step']['scope'] == 'supply_exact_lab_values_and_provenance_only'
          assert predecessor['next_authorized_step']['may_execute_hardware'] is False
          assert predecessor['next_authorized_step']['may_run_audio_pipeline'] is False
          assert predecessor['next_authorized_step']['may_compute_dtd_or_quality_result'] is False
          assert predecessor['next_authorized_step']['may_create_algorithm_candidate'] is False

          assert subprocess.check_output(['git','hash-object',str(resolution)], text=True).strip() == '4ed9b2c84e3e0e83b29245cefdeb73b082dd837d'

          schema_json = json.loads(schema.read_text())
          template_json = json.loads(template.read_text())
          assert schema_json['$id'].endswith('matched-gain-chain-factor-plan-lab-binding-v1.schema.json')
          assert template_json['investigation'] == 'matched-gain-chain-factor-plan-lab-binding-v1'
          assert template_json['authority'] == 'LAB_METADATA_BINDING_ONLY'
          assert template_json['predecessor'] == {
              'manifest': str(resolution),
              'blob_sha': '4ed9b2c84e3e0e83b29245cefdeb73b082dd837d',
          }

          required = set(predecessor['lab_resolution_required'])
          assert set(template_json['lab_values']) == required
          assert all(v['value'] == 'LAB_VALUE_REQUIRED' and v['provenance'] == 'LAB_VALUE_REQUIRED'
                     for v in template_json['lab_values'].values())

          if '${{ github.event_name }}' == 'pull_request':
              base = '${{ github.event.pull_request.base.sha }}'
              head = '${{ github.event.pull_request.head.sha }}'
              changed = set(subprocess.check_output(['git','diff','--name-only',base,head], text=True).splitlines())
              allowed = {
                  str(schema),
                  str(template),
                  str(binding),
                  '.github/workflows/research-matched-gain-chain-factor-plan-lab-binding-v1.yml',
              }
              assert changed and changed <= allowed, sorted(changed)
              if str(binding) in changed:
                  assert changed == {str(binding)}, (
                      'A real lab binding PR may change only the binding manifest; '
                      'validator/schema/template changes must be reviewed separately'
                  )

          if not binding.exists():
              print(json.dumps({
                  'result': 'CONTRACT_READY',
                  'binding_present': False,
                  'hardware_execution_authorized': False,
                  'candidate_budget': 0,
              }, sort_keys=True))
              raise SystemExit(0)

          m = json.loads(binding.read_text())
          assert m['schema_version'] == 1
          assert m['investigation'] == 'matched-gain-chain-factor-plan-lab-binding-v1'
          assert m['authority'] == 'LAB_METADATA_BINDING_ONLY'
          assert m['predecessor'] == template_json['predecessor']
          assert m['shipping_immutable'] == {'version':'v2.3.16','sha':'57e4c64adc1cf06819e46e24e275ecd746d5f17f'}
          assert m['state'] == {
              'lab_resolution_complete': True,
              'freeze_complete': True,
              'hardware_execution_authorized': False,
              'candidate_budget': 0,
          }
          assert set(m['lab_values']) == required

          banned = {'', 'unknown', 'default', 'auto', 'tbd', 'n/a',
                    'same as current', 'same as device', 'lab_value_required'}

          def reject_placeholders(value, path='value'):
              if value is None:
                  raise AssertionError(f'{path} must not be null')
              if isinstance(value, str):
                  if value.strip().lower() in banned:
                      raise AssertionError(f'{path} contains placeholder {value!r}')
                  if not value.strip():
                      raise AssertionError(f'{path} is blank')
              elif isinstance(value, list):
                  if not value:
                      raise AssertionError(f'{path} must not be empty')
                  for i, item in enumerate(value):
                      reject_placeholders(item, f'{path}[{i}]')
              elif isinstance(value, dict):
                  if not value:
                      raise AssertionError(f'{path} must not be empty')
                  for k, item in value.items():
                      reject_placeholders(item, f'{path}.{k}')

          for key, item in m['lab_values'].items():
              assert set(item) == {'value','provenance'}, key
              reject_placeholders(item['value'], f'lab_values.{key}.value')
              reject_placeholders(item['provenance'], f'lab_values.{key}.provenance')

          reject_placeholders(m['coordinate_frame'], 'coordinate_frame')

          for key in ('source_position_xyz_m','microphone_position_xyz_m'):
              value = m['lab_values'][key]['value']
              assert isinstance(value, list) and len(value) == 3, key
              assert all(isinstance(x, (int,float)) and not isinstance(x, bool) for x in value), key

          render_hash = m['lab_values']['render_source_hash']['value']
          assert isinstance(render_hash, str)
          assert re.fullmatch(r'(?:sha256:)?[0-9a-fA-F]{64}', render_hash), render_hash

          for key in ('playback_analog_gain_db_or_exact_setting','capture_analog_gain_db_or_exact_setting'):
              value = m['lab_values'][key]['value']
              assert isinstance(value, (int,float,str)) and not isinstance(value, bool), key

          print(json.dumps({
              'result': 'LAB_BINDING_COMPLETE',
              'binding_present': True,
              'manifest_blob_sha': subprocess.check_output(['git','hash-object',str(binding)], text=True).strip(),
              'hardware_execution_authorized': False,
              'candidate_budget': 0,
          }, sort_keys=True))
          PY

      - name: Publish authority boundary
        shell: bash
        run: |
          {
            echo '## Matched gain-chain lab binding'
            echo '- Scope: exact lab metadata and provenance only.'
            echo '- Hardware execution: **not authorized**.'
            echo '- Audio-pipeline execution / DTD / quality computation: **not authorized**.'
            echo '- Algorithm or tuning candidate creation: **not authorized**.'
            echo '- Shipping / HIL / Product Certification authority: **unchanged**.'
          } >> "$GITHUB_STEP_SUMMARY"
