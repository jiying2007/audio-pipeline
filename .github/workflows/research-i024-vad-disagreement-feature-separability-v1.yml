name: Research I024 VAD Disagreement Feature Separability v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i024-vad-disagreement-feature-separability-v1.json'
      - '.github/research/continuous-optimization/development-v4/i024-vad-disagreement-feature-separability-v1-result.json'
      - 'tests/validation/i024_vad_disagreement_feature_separability.py'
      - 'tests/validation/test_i024_one_shot_guard.py'
      - 'tests/validation/test_i024_retirement.py'
      - 'tests/validation/data/i024-consumed-workflow.yml'
      - 'validation/research/evidence/i024-36499446662/**'
      - '.github/workflows/research-i024-vad-disagreement-feature-separability-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I024 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 tests/validation/i024_vad_disagreement_feature_separability.py --self-test
          python3 tests/validation/test_i024_one_shot_guard.py
          python3 tests/validation/test_i024_retirement.py
