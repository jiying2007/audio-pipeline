name: Research Source Candidate v2 Authority Preflight

on:
  workflow_call:
    inputs:
      candidate_contract:
        description: 'Repo-relative schema-v2 source candidate contract'
        required: true
        type: string
    outputs:
      candidate_execution_allowed:
        description: 'True only when the committed qualified authority lock validates'
        value: ${{ jobs.authority.outputs.candidate_execution_allowed }}
      candidate_id:
        description: 'Frozen candidate identity'
        value: ${{ jobs.authority.outputs.candidate_id }}
      source_base_sha:
        description: 'Frozen exact source base'
        value: ${{ jobs.authority.outputs.source_base_sha }}
      qualification_profile:
        description: 'Authority qualification profile'
        value: ${{ jobs.authority.outputs.qualification_profile }}
      authority_lock_path:
        description: 'Committed authority lock path'
        value: ${{ jobs.authority.outputs.authority_lock_path }}
      authority_lock_sha256:
        description: 'Committed authority lock SHA-256'
        value: ${{ jobs.authority.outputs.authority_lock_sha256 }}
      selected_authority_json:
        description: 'Exact selected seed/corpus identities'
        value: ${{ jobs.authority.outputs.selected_authority_json }}

permissions:
  contents: read

jobs:
  authority:
    runs-on: ubuntu-latest
    outputs:
      candidate_execution_allowed: ${{ steps.bind.outputs.candidate_execution_allowed }}
      candidate_id: ${{ steps.bind.outputs.candidate_id }}
      source_base_sha: ${{ steps.bind.outputs.source_base_sha }}
      qualification_profile: ${{ steps.bind.outputs.qualification_profile }}
      authority_lock_path: ${{ steps.bind.outputs.authority_lock_path }}
      authority_lock_sha256: ${{ steps.bind.outputs.authority_lock_sha256 }}
      selected_authority_json: ${{ steps.bind.outputs.selected_authority_json }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Validate committed source authority lock before candidate execution
        id: bind
        env:
          CONTRACT_INPUT: ${{ inputs.candidate_contract }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          contract = Path(os.environ['CONTRACT_INPUT'])
          root = Path('.github/research/continuous-optimization/source-candidates')
          if contract.is_absolute() or '..' in contract.parts or contract.suffix != '.json':
              raise SystemExit('candidate_contract must be a safe repo-relative JSON path')
          try:
              contract.relative_to(root)
          except ValueError as exc:
              raise SystemExit(
                  'candidate_contract must remain under canonical source-candidates root'
              ) from exc
          if not contract.is_file():
              raise SystemExit(f'candidate contract not found: {contract}')

          describe = subprocess.run([
              'python3',
              '.github/research/continuous-optimization/source_candidate_authority_v2.py',
              '--describe-contract',
              '--candidate-contract', str(contract),
              '--policy',
              '.github/research/continuous-optimization/source-candidate-authority-v2.json',
          ], check=True, text=True, capture_output=True)
          binding = json.loads(describe.stdout)
          lock = Path(binding['authority_lock_path'])
          if not lock.is_file():
              raise SystemExit(
                  f'qualified authority lock must be committed before candidate execution: {lock}'
              )

          validated = subprocess.run([
              'python3',
              '.github/research/continuous-optimization/source_candidate_authority_v2.py',
              '--validate-lock',
              '--candidate-contract', str(contract),
              '--authority-lock', str(lock),
              '--policy',
              '.github/research/continuous-optimization/source-candidate-authority-v2.json',
          ], check=True, text=True, capture_output=True)
          result = json.loads(validated.stdout)
          lock_payload = json.loads(lock.read_text())
          if result.get('result') != 'PASS':
              raise SystemExit('authority lock validation did not PASS')
          if lock_payload.get('candidate_execution_allowed') is not True:
              raise SystemExit('authority lock does not authorize candidate execution')

          values = {
              'candidate_execution_allowed': 'true',
              'candidate_id': binding['candidate_id'],
              'source_base_sha': binding['source_base_sha'],
              'qualification_profile': binding['qualification_profile'],
              'authority_lock_path': binding['authority_lock_path'],
              'authority_lock_sha256': result['authority_lock_sha256'],
              'selected_authority_json': json.dumps(
                  lock_payload['selected_authority'], separators=(',', ':')
              ),
          }
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as out:
              for key, value in values.items():
                  print(f'{key}={value}', file=out)
          print(json.dumps(values, sort_keys=True))
          PY
