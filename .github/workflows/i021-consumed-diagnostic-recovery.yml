name: I021 Consumed Diagnostic Recovery

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1-recovery.json'
      - '.github/workflows/i021-consumed-diagnostic-recovery.yml'
      - 'tests/validation/test_i021_recovery_contract.py'
      - 'tests/validation/i021_vad_public_development_transfer_gap_probe.c'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1-recovery.json'
      - '.github/workflows/i021-consumed-diagnostic-recovery.yml'
      - 'tests/validation/test_i021_recovery_contract.py'
      - 'tests/validation/i021_vad_public_development_transfer_gap_probe.c'

permissions:
  contents: read
  actions: read

concurrency:
  group: i021-consumed-diagnostic-recovery
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1.json
  RECOVERY: .github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1-recovery.json
  DEV_LOCK: .github/research/continuous-optimization/development-data-v3/development.lock.json
  DEV_ROOT: /tmp/audio-pipeline-i021-recovery-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3
  SOURCE_BASE: 57e4c64adc1cf06819e46e24e275ecd746d5f17f
  SOURCE_RUN_SHA: d6e8c145d66aef119c0e9d166e52de9af1f54202
  SOURCE_RUN_ID: '36417062971'
  SOURCE_JOB_ID: '108910684840'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate deterministic recovery contract
        run: |
          set -euo pipefail
          python3 tests/validation/test_i021_recovery_contract.py
          python3 -m json.tool "$RECOVERY" >/dev/null
          cmake -S . -B build-i021-recovery-contract -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i021-recovery-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i021-recovery-contract/generated             tests/validation/i021_vad_public_development_transfer_gap_probe.c             build-i021-recovery-contract/libaudio_pipeline.a -lm             -o build-i021-recovery-contract/i021-probe
          python3 - <<'PY'
          from pathlib import Path
          Path('/tmp/i021-tail.pcm').write_bytes(b'\0' * (161 * 2))
          PY
          test "$(build-i021-recovery-contract/i021-probe /tmp/i021-tail.pcm | wc -l)" -eq 1

  recover:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Bind recovery to the consumed failed execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^1)" = "$SOURCE_RUN_SHA"
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          recovery=json.loads(Path(os.environ['RECOVERY']).read_text())
          contract=json.loads(Path(os.environ['CONTRACT']).read_text())
          assert recovery['source_run']['run_id']==int(os.environ['SOURCE_RUN_ID'])
          assert recovery['source_run']['head_sha']==os.environ['SOURCE_RUN_SHA']
          assert recovery['fixed_seeds']==contract['fresh_diagnostic_authority']['seeds']
          assert recovery['invariants']['new_diagnostic_authority'] is False
          assert recovery['invariants']['candidate_budget']==0
          assert recovery['invariants']['confirmation_budget']==0
          repo=os.environ['GITHUB_REPOSITORY']
          run=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/actions/runs/{os.environ["SOURCE_RUN_ID"]}'],text=True))
          assert run['head_sha']==os.environ['SOURCE_RUN_SHA']
          assert run['conclusion']=='failure' and int(run['run_attempt'])==1
          jobs=json.loads(subprocess.check_output(
              ['gh','api',f'repos/{repo}/actions/runs/{os.environ["SOURCE_RUN_ID"]}/jobs?per_page=100'],text=True))
          job=next(j for j in jobs['jobs'] if int(j['id'])==int(os.environ['SOURCE_JOB_ID']))
          steps={s['name']:s['conclusion'] for s in job['steps']}
          assert steps['Materialize fresh public-development-v3 partitions']=='success'
          assert steps['Evaluate candidate-zero public-development VAD transfer gap']=='failure'
          PY
          git diff --exit-code "$SOURCE_RUN_SHA"...HEAD --             .github/research/continuous-optimization/development-data-v3             tests/validation/i021_vad_public_development_transfer_gap.py             src/enhance/ap_vad.c src/modules/ap_vad_module.c src/modules/ap_ns_module.c             include/audio_pipeline/audio_modules.h src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Build repaired probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i021-recovery -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i021-recovery --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i021-recovery/generated             tests/validation/i021_vad_public_development_transfer_gap_probe.c             build-i021-recovery/libaudio_pipeline.a -lm             -o build-i021-recovery/i021-probe
      - name: Reconstruct exact consumed public-development partitions
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py             --lock "$DEV_LOCK" --root "$DEV_ROOT"             --output /tmp/i021-recovery-materialization.json
          for seed in 501307 511307 521307; do
            python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py               --lock "$DEV_LOCK"               --materialization /tmp/i021-recovery-materialization.json               --data-root "$DEV_ROOT"               --output "/tmp/i021-recovery-$seed"               --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
          done
      - name: Evaluate recovered consumed authority
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i021-recovery-out
          mkdir -p i021-recovery-out/evidence
          cp "$CONTRACT" i021-recovery-out/evidence/contract.json
          cp "$RECOVERY" i021-recovery-out/evidence/recovery.json
          cp /tmp/i021-recovery-materialization.json i021-recovery-out/evidence/materialization.json
          printf 'source_run_id=%s\nsource_run_sha=%s\nrecovery_main_sha=%s\n'             "$SOURCE_RUN_ID" "$SOURCE_RUN_SHA" "$GITHUB_SHA"             > i021-recovery-out/evidence/build-info.txt
          sha256sum build-i021-recovery/i021-probe | awk '{print $1}'             > i021-recovery-out/evidence/probe.sha256
          for seed in 501307 511307 521307; do
            sha256sum "/tmp/i021-recovery-$seed/corpus.json"
          done > i021-recovery-out/evidence/corpora.sha256
          set +e
          python3 tests/validation/i021_vad_public_development_transfer_gap.py             --probe build-i021-recovery/i021-probe             --contract "$CONTRACT"             --corpus /tmp/i021-recovery-501307/corpus.json             --corpus /tmp/i021-recovery-511307/corpus.json             --corpus /tmp/i021-recovery-521307/corpus.json             --output i021-recovery-out/evidence/result.json             > i021-recovery-out/evidence/evaluate.stdout 2> i021-recovery-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > i021-recovery-out/evidence/evaluate.exit-code
          if test -f i021-recovery-out/evidence/result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i021-recovery-out/evidence/result.json').read_text())
          Path('i021-recovery-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_seeds':r['fresh_diagnostic_seeds'],
                  'global':r['global'],
                  'reference_absolute_min_vad_f1':r['reference_absolute_min_vad_f1'],
                  'below_reference_slice_count':len(r['below_reference_slices']),
                  'worst_development_slices':r['worst_development_slices'],
                  'shipping_mirror':r['shipping_mirror'],
              },indent=2,sort_keys=True)+'\n')
          PY
          fi
          (
            cd i021-recovery-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort |               while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          exit "$rc"
      - name: Enforce recovered diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i021-recovery-out/evidence/result.json').read_text())
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Upload recovery evidence even on failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i021-consumed-recovery-${{ github.run_id }}
          path: i021-recovery-out/
          retention-days: 90
          if-no-files-found: error
