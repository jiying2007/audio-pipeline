name: Extended Validation Runner Preflight One-Time Migration

on:
  push:
    branches: [feat/extended-real-validation-v2.1.0]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: feat/extended-real-validation-v2.1.0
      - name: Apply and verify preflight extension
        run: |
          set -euo pipefail
          python3 tools/migrate_extended_runner_preflight.py
          python3 -m py_compile tools/runner_preflight.py
          python3 tools/runner_preflight.py --self-test
          sh scripts/check-architecture.sh
          git diff --check
      - name: Commit verified preflight extension
        run: |
          set -euo pipefail
          rm tools/migrate_extended_runner_preflight.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/runner_preflight.py tools/migrate_extended_runner_preflight.py
          git diff --cached --check
          git commit -m 'validation: support extended-real runner readiness'
          git push origin HEAD:feat/extended-real-validation-v2.1.0
