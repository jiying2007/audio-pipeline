name: Quality

on:
  workflow_call:
    inputs:
      run_abi:
        type: boolean
        required: false
        default: true
      run_extended:
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi-contract:
    if: inputs.run_abi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Prove missing public ABI baseline fails closed
        run: |
          set -euo pipefail
          set +e
          sh scripts/check-abi-contract.sh v0.0.0-missing-contract-baseline > /tmp/missing-abi-baseline.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 6
          grep -q 'unable to fetch required baseline tag' /tmp/missing-abi-baseline.log
      - name: Enforce public API/ABI contract
        run: sh scripts/check-abi-contract.sh

  sdk-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: quality-sdk
      - name: Build and install SDK
        run: |
          cmake -S . -B build-sdk -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sdk --parallel
          cmake --install build-sdk --prefix "$PWD/stage"
      - name: Consume with find_package
        run: |
          cmake -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel
          ./build-consumer/audio_pipeline_consumer
      - name: Consume with pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig:$PWD/stage/lib64/pkgconfig"
          cc tests/consumer/consumer.c -o /tmp/audio-pipeline-pc $(pkg-config --cflags --libs audio-pipeline)
          /tmp/audio-pipeline-pc

  sku-memory-rom:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: quality-size
      - name: Verify SKU pipeline RAM pruning
        run: |
          cmake --preset composition-full
          cmake --preset composition-low
          cmake --preset composition-tiny
          cmake --preset composition-raw
          for p in full low tiny raw; do cmake --build "build/composition-$p" --target ap_state_size --parallel; done
          full=$(./build/composition-full/ap_state_size)
          low=$(./build/composition-low/ap_state_size)
          tiny=$(./build/composition-tiny/ap_state_size)
          raw=$(./build/composition-raw/ap_state_size)
          echo "pipeline_state_bytes full=$full low=$low tiny=$tiny raw=$raw"
          test "$low" -lt "$full"
          test "$tiny" -lt "$low"
          test "$raw" -lt "$tiny"
      - name: Verify final consumer ELF pruning
        run: |
          common="-DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-ffunction-sections\ -fdata-sections -DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections"
          eval cmake -S . -B build/elf-full $common -DAP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          eval cmake -S . -B build/elf-voice $common -DAP_MODULES=RESAMPLER,HPF,BF,NS,AGC,VAD
          eval cmake -S . -B build/elf-raw $common -DAP_MODULES=RESAMPLER
          for p in full voice raw; do cmake --build "build/elf-$p" --target ap_consumer_smoke --parallel; done
          elf_bytes() { size "$1" | awk 'NR==2 {print $1+$2+$3}'; }
          full=$(elf_bytes build/elf-full/ap_consumer_smoke)
          voice=$(elf_bytes build/elf-voice/ap_consumer_smoke)
          raw=$(elf_bytes build/elf-raw/ap_consumer_smoke)
          echo "consumer_elf_bytes full=$full voice=$voice raw=$raw"
          test "$voice" -lt "$full"
          test "$raw" -lt "$voice"
      - name: Verify runtime queue/envelope RAM pruning
        run: |
          cmake -S . -B build/rt-full -DCMAKE_BUILD_TYPE=Release -DAP_RUNTIME_QUEUE_DEPTH=8
          cmake -S . -B build/rt-tiny -DCMAKE_BUILD_TYPE=Release \
            -DAP_RUNTIME_QUEUE_DEPTH=4 -DAP_BUILD_MAX_IO_RATE_HZ=16000 \
            -DAP_BUILD_MAX_INTERNAL_RATE_HZ=8000 -DAP_BUILD_MAX_MIC_CHANNELS=1 \
            -DAP_BUILD_MAX_DELAY_MS=120 -DAP_BUILD_MAX_AEC_TAIL_MS=48 \
            -DAP_MODULES=RESAMPLER,HPF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          cmake --build build/rt-full --parallel
          cmake --build build/rt-tiny --parallel
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-full/generated \
            build/rt-full/libaudio_pipeline_runtime.a build/rt-full/libaudio_pipeline.a -lm -pthread -o /tmp/rt-full
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-tiny/generated \
            build/rt-tiny/libaudio_pipeline_runtime.a build/rt-tiny/libaudio_pipeline.a -lm -pthread -o /tmp/rt-tiny
          full=$(/tmp/rt-full)
          tiny=$(/tmp/rt-tiny)
          echo "runtime_state_bytes full=$full tiny=$tiny"
          test "$tiny" -lt "$full"

  thread-sanitizer:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: tsan
      - name: Configure TSan runtime contract
        env:
          CC: clang
        run: >-
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF
          -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -O1'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'
      - name: Build runtime tests
        run: cmake --build build-tsan --target ap_runtime_tests --parallel
      - name: Race-check worker/control-plane metrics
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build-tsan/ap_runtime_tests

  qemu-exec:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cortex-a7-neon
            compiler: arm-linux-gnueabihf-gcc
            toolchain: cmake/toolchains/arm-linux-gnueabihf.cmake
            cflags: -O2 -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard
            simd: NEON
            qemu: qemu-arm -cpu cortex-a7 -L /usr/arm-linux-gnueabihf
          - name: aarch64-neon
            compiler: aarch64-linux-gnu-gcc
            toolchain: cmake/toolchains/aarch64-linux-gnu.cmake
            cflags: -O2 -march=armv8-a
            simd: NEON
            qemu: qemu-aarch64 -cpu cortex-a53 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: qemu-${{ matrix.name }}
      - name: Configure executable contract
        env:
          CC: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build/qemu-${{ matrix.name }}
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS='${{ matrix.cflags }}' -DAP_SIMD_BACKEND=${{ matrix.simd }}
          -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DAP_BUILD_TESTS=ON
      - name: Build executable contracts
        run: >-
          cmake --build build/qemu-${{ matrix.name }} --parallel
          --target ap_module_tests ap_contract_tests ap_fft_tests ap_resampler_tests ap_runtime_tests
      - name: Execute under QEMU
        run: |
          Q='${{ matrix.qemu }}'
          $Q ./build/qemu-${{ matrix.name }}/ap_module_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_contract_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_fft_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_resampler_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_runtime_tests

  coverage:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: coverage
      - name: Configure coverage build
        env:
          CC: gcc
        run: >-
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DAP_BUILD_BENCH=OFF
          -DCMAKE_C_FLAGS='--coverage -O0 -g' -DCMAKE_EXE_LINKER_FLAGS='--coverage'
      - name: Run tests and enforce coverage
        run: |
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
          gcovr --root . --filter 'src/' --exclude 'tests/' --fail-under-line 90 --print-summary

  static-analysis:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: scan-build
      - name: Configure
        env:
          CC: clang
        run: >-
          cmake -S . -B build-analysis -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_TESTS=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF
      - name: Scan build
        run: scan-build --status-bugs cmake --build build-analysis --parallel

  acoustic-validation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate canonical acoustic validation contracts
        run: |
          python3 validation/tools/authority.py --self-test
          python3 validation/tools/run_validation.py --self-test
          python3 validation/tools/tuning_iteration.py --self-test

  frontend-reference:
    if: inputs.run_extended
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: xiph/speexdsp
          ref: 7a158783df74efe7c2d1c6ee8363c1e695c71226
          path: .fe-speexdsp
          persist-credentials: false
      - name: Verify pristine SpeexDSP source bytes without executing them
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/speexdsp_source.py \
            --source .fe-speexdsp --output fe-speex-source
          python3 tests/validation/frontend_evolution/speexdsp_source.py \
            --output fe-speex-source --verify
          python3 tests/validation/frontend_evolution/speexdsp_source.py \
            --output fe-speex-source --negative-evidence
      - name: Preserve SpeexDSP source-preflight bytes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-speex-source-${{ github.run_id }}
          path: fe-speex-source/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dpirch/libfvad
          ref: 532ab666c20d3cfda38bca63abbb0f152706c369
          path: .fe-libfvad
          persist-credentials: false
      - name: Qualify actual pinned VAD reference without shipping promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/test_libfvad_reference.py
          baseline="$RUNNER_TEMP/fe-b0-${{ github.run_id }}"
          mkdir "$baseline"
          git -c safe.directory="$PWD" archive 37a1792861a89c815bec462f819f3deac7d29b09 | tar -x -C "$baseline"
          python3 tests/validation/frontend_evolution/libfvad_reference.py compare \
            --source .fe-libfvad --baseline "$baseline" --output fe-reference --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/libfvad_reference.py verify \
            --output fe-reference --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/test_libfvad_reference.py --evidence fe-reference
      - name: Qualify first-party native 1/2/4-mic research array
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/array_qualification.py --self-test
          python3 tests/validation/frontend_evolution/array_qualification.py \
            --output fe-array --execution-source "$GITHUB_SHA" --require-arm
          python3 tests/validation/frontend_evolution/array_qualification.py \
            --output fe-array --execution-source "$GITHUB_SHA" --verify --require-arm
          python3 tests/validation/frontend_evolution/array_qualification.py \
            --output fe-array --execution-source "$GITHUB_SHA" --negative-evidence
      - name: Preserve native-array engineering evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-array-${{ github.run_id }}
          path: fe-array/
          if-no-files-found: error
          retention-days: 30
      - name: Preserve reference evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reference-${{ github.run_id }}
          path: fe-reference/
          if-no-files-found: error
          retention-days: 30

  frontend-speech:
    if: inputs.run_extended
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Acquire and measure fixed recorded speech without promotion
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/test_speech_spatial.py
          mkdir fe-speech
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 tests/validation/frontend_evolution/speech_source.py --output fe-speech/source
          python3 tests/validation/frontend_evolution/speech_spatial.py \
            --source fe-speech/source --output fe-speech/effects --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/speech_spatial.py \
            --output fe-speech/effects --execution-source "$GITHUB_SHA" --verify
          python3 tests/validation/frontend_evolution/test_speech_spatial.py --evidence fe-speech/effects
          # Source bytes are already sealed inside the complete effect receipt.
          # Retain the first copy only on a failure before that complete receipt.
          rm -rf -- fe-speech/source
      - name: Compare fixed FIR structures on disclosed speech without promotion
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/speech_fir.py --self-test
          python3 tests/validation/frontend_evolution/speech_fir.py \
            --base-evidence fe-speech/effects --output fe-speech/fir --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/speech_fir.py \
            --base-evidence fe-speech/effects --output fe-speech/fir --execution-source "$GITHUB_SHA" --verify
          python3 tests/validation/frontend_evolution/speech_fir.py \
            --base-evidence fe-speech/effects --output fe-speech/fir --execution-source "$GITHUB_SHA" --negative-evidence
      - name: Preserve recorded speech provenance and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-speech-${{ github.run_id }}
          path: fe-speech/
          if-no-files-found: error
          retention-days: 30


  frontend-spatial-effects:
    if: inputs.run_extended
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Qualify admitted speech and fixed spatial weights
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
          # Keep source acquisition + fixed spatial-weight evidence in its own
          # bounded job so hosted-runner/network variance cannot consume the
          # BF/AEC-order + Activity validation budget.
          mkdir -p fe-spatial/toolchain
          cat > fe-spatial/toolchain/arm-preflight.c <<'C'
          #include <math.h>
          #include <stdlib.h>
          int main(void) {
              volatile double x = 0.5;
              double y = sin(x);
              return isfinite(y) && y > 0.0 && y < 1.0 ? EXIT_SUCCESS : EXIT_FAILURE;
          }
          C
          dpkg-query -W gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user > fe-spatial/toolchain/packages.txt
          arm-linux-gnueabihf-gcc --version > fe-spatial/toolchain/compiler.txt
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror \
            fe-spatial/toolchain/arm-preflight.c -lm -o fe-spatial/toolchain/arm-preflight \
            > fe-spatial/toolchain/link.log 2>&1
          arm-linux-gnueabihf-readelf -h fe-spatial/toolchain/arm-preflight > fe-spatial/toolchain/elf-header.txt
          qemu-arm -L /usr/arm-linux-gnueabihf fe-spatial/toolchain/arm-preflight \
            > fe-spatial/toolchain/execution.log 2>&1
          echo 'ARM_LINK_AND_QEMU_PASS' >> fe-spatial/toolchain/execution.log
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py --self-test
          python3 tests/validation/frontend_evolution/speech_source.py --speaker-offset 8 --output fe-spatial/source
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py \
            --source fe-spatial/source --output fe-spatial/effects --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py \
            --output fe-spatial/effects --execution-source "$GITHUB_SHA" --verify
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py \
            --output fe-spatial/effects --execution-source "$GITHUB_SHA" --negative-evidence
          # Sealed spatial evidence retains the admitted source bytes/notices.
          rm -rf -- fe-spatial/source
      - name: Preserve spatial-effect predecessor and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-spatial-effects-${{ github.run_id }}
          path: |
            fe-spatial/effects/
            fe-spatial/toolchain/
          if-no-files-found: error
          retention-days: 30

  frontend-spatial:
    if: inputs.run_extended
    needs: frontend-spatial-effects
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-spatial-effects-${{ github.run_id }}
          path: fe-spatial
      - name: Qualify BF/AEC order from exact-run spatial evidence
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
          python3 tests/validation/frontend_evolution/bf_aec_order.py --self-test
          python3 tests/validation/frontend_evolution/bf_aec_order.py \
            --source fe-spatial/effects/data --output fe-spatial/order --execution-source "$GITHUB_SHA" --require-arm
          python3 tests/validation/frontend_evolution/bf_aec_order.py \
            --output fe-spatial/order --execution-source "$GITHUB_SHA" --verify --require-arm
          python3 tests/validation/frontend_evolution/bf_aec_order.py \
            --output fe-spatial/order --execution-source "$GITHUB_SHA" --negative-evidence
      - name: Compare actual Activity gates without shadow decomposition
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/activity_gates.py --self-test
          python3 tests/validation/frontend_evolution/activity_gates.py \
            --base-evidence fe-spatial/order --output fe-spatial/activity --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/activity_gates.py \
            --base-evidence fe-spatial/order --output fe-spatial/activity --execution-source "$GITHUB_SHA" --verify
          python3 tests/validation/frontend_evolution/activity_gates.py \
            --base-evidence fe-spatial/order --output fe-spatial/activity --execution-source "$GITHUB_SHA" --negative-evidence
      - name: Preserve spatial speech, coefficients and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-spatial-${{ github.run_id }}
          path: fe-spatial/
          if-no-files-found: error
          retention-days: 30

  frontend-speex-aec:
    if: inputs.run_extended
    needs: [frontend-reference, frontend-gate-guard]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-speex-source-${{ github.run_id }}
          path: fe-speex-source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-spatial-${{ github.run_id }}
          path: fe-spatial
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-correlation-${{ github.run_id }}
          path: fe-correlation
      - name: Execute admitted pristine SpeexDSP AEC reference
        run: |
          set -euo pipefail
          sudo apt-get update -qq
