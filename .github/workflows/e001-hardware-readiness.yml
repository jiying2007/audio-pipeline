name: E001 Hardware Activation Readiness

on:
  pull_request:
    paths:
      - '.github/workflows/e001-hardware-readiness.yml'
      - 'docs/program/iterations/E001-readiness.json'
      - '.github/program/e001_hardware_readiness.py'
      - '.github/workflows/hil-soak.yml'
      - '.github/workflows/extended-real-automation.yml'
      - '.github/workflows/validation-extended-real.yml'
      - '.github/workflows/trusted-runner-readiness.yml'
      - '.github/workflows/product-certification.yml'
      - 'certification/policies/**'
      - 'scripts/post_release_status.py'
      - 'docs/program/plan.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/e001-hardware-readiness.yml'
      - 'docs/program/iterations/E001-readiness.json'
      - '.github/program/e001_hardware_readiness.py'
      - '.github/workflows/hil-soak.yml'
      - '.github/workflows/extended-real-automation.yml'
      - '.github/workflows/validation-extended-real.yml'
      - '.github/workflows/trusted-runner-readiness.yml'
      - '.github/workflows/product-certification.yml'
      - 'certification/policies/**'
      - 'scripts/post_release_status.py'
      - 'docs/program/plan.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Self-test fail-closed readiness validator
        run: python3 .github/program/e001_hardware_readiness.py --self-test
      - name: Evaluate software-side activation prerequisites
        env:
          HIL_ENABLED: ${{ vars.HIL_ENABLED }}
          EXTENDED_REAL_ENABLED: ${{ vars.EXTENDED_REAL_ENABLED }}
        run: |
          set -euo pipefail
          python3 .github/program/e001_hardware_readiness.py \
            --output e001-hardware-readiness.json
          python3 - <<'PY'
          import json
          result = json.load(open('e001-hardware-readiness.json'))
          allowed = {
              'E001_DEFERRED_INFRASTRUCTURE_DISABLED',
              'E001_PARTIAL_CONFIGURATION_REQUIRES_COMPLETION',
              'E001_CONFIGURED_REQUIRES_TRUSTED_RUNNER_READINESS',
          }
          assert result['result'] in allowed
          assert result['static']['static_contracts'] == 'PASS'
          assert result['authority']['hardware_test_executed'] is False
          assert result['authority']['product_certification_executed'] is False
          assert result['authority']['product_qualification'] == 'DEFERRED_BY_SCOPE'
          assert result['authority']['dut_hil'] == 'DEFERRED_BY_SCOPE'
          rendered = json.dumps(result, sort_keys=True)
          for forbidden in ('PRODUCT_CERTIFIED', 'PRODUCT_QUALIFICATION_PASS', 'DUT_HIL_PASS', 'HARDWARE_VALIDATED'):
              assert forbidden not in rendered
          PY
          cat e001-hardware-readiness.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload E001 readiness evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e001-hardware-readiness-${{ github.run_id }}
          path: |
            e001-hardware-readiness.json
            docs/program/iterations/E001-readiness.json
          retention-days: 90
          if-no-files-found: error
