name: Research Real Double-Talk Rating V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json'
      - '.github/research/continuous-optimization/real_doubletalk_rating_v1.py'
      - '.github/workflows/research-real-doubletalk-rating-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json'
      - '.github/research/continuous-optimization/real_doubletalk_rating_v1.py'
      - '.github/workflows/research-real-doubletalk-rating-v1.yml'

permissions:
  contents: read

concurrency:
  group: research-real-doubletalk-rating-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind diagnostic to exact source and research-only scope
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json'
          ).read_text())
          base = manifest['governance_base_sha']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines()
          allowed = {
              '.github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json',
              '.github/research/continuous-optimization/real_doubletalk_rating_v1.py',
              '.github/workflows/research-real-doubletalk-rating-v1.yml',
          }
          assert changed and set(changed) <= allowed, changed
          print({'base': base, 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                 'changed': changed})
          PY

      - name: Validate candidate-zero authority and predecessor closure
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/research/continuous-optimization/doubletalk_temporal_route_v2.py \
            .github/research/continuous-optimization/real_doubletalk_rating_v1.py
          python3 .github/research/continuous-optimization/real_doubletalk_rating_v1.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json'
          ).read_text())
          predecessor = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/doubletalk-temporal-route-v2.json'
          ).read_text())
          closure = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/doubletalk-onset-admission-v1-closure.json'
          ).read_text())
          assert manifest['status'] == 'DIAGNOSTIC_ONLY'
          assert manifest['candidate_budget'] == 0
          assert manifest['governance_base_sha'] == 'acc8b46dc2ef59f701befd9399616ddd2167dd2f'
          pred = manifest['predecessor']
          assert pred['investigation_id'] == 'doubletalk-temporal-route-disambiguation-v2'
          assert pred['pr'] == 231
          assert pred['fresh_main_sha'] == 'acc8b46dc2ef59f701befd9399616ddd2167dd2f'
          assert pred['diagnostic_run_id'] == 35098158767 and pred['diagnostic_run_number'] == 2
          assert pred['diagnostic_artifact_id'] == 10447162412
          assert pred['diagnostic_artifact_digest'] == 'sha256:c49cd6610d7643923fe577117b7fd1882544bcfdf629cc90b7c47d03ad3431b1'
          assert pred['hosted_real_aec_run_id'] == 35098158752 and pred['hosted_real_aec_run_number'] == 765
          assert pred['hosted_real_audio_run_id'] == 35098158742 and pred['hosted_real_audio_run_number'] == 770
          assert pred['verify_run_id'] == 35098159062 and pred['verify_run_number'] == 971
          assert pred['release_run_id'] == 35098680175 and pred['release_run_number'] == 956
          assert pred['fresh_main_closed'] is True
          assert predecessor['candidate_budget'] == 0
          assert predecessor['status'] == 'DIAGNOSTIC_ONLY'
          assert closure['status'] == 'CLOSED_KEEP_BASELINE'
          assert closure['candidate']['budget_remaining'] == 0
          assert closure['shipping'] == {
              'version': 'v2.3.16',
              'commit_sha': '57e4c64adc1cf06819e46e24e275ecd746d5f17f',
              'changed_by_candidate': False,
          }
          assert manifest['observation_geometry']['selection_threshold'] is None
          assert manifest['selection']['optimized'] is False
          assert manifest['output_authority'] == {
              'research_diagnostic_only': True,
              'candidate_selection': False,
              'tuning': False,
              'automatic_main_mutation': False,
              'shipping': False,
              'hil': False,
              'product_certification': False,
          }
          print('real double-talk rating candidate-zero authority: PASS')
          PY

      - name: Build unchanged baseline processor
        run: |
          set -euo pipefail
          cmake -S . -B build-real-doubletalk-rating \
            -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF \
            -DAP_STRICT_WARNINGS=ON
          cmake --build build-real-doubletalk-rating --target ap_process_pcm ap_build_info_dump --parallel
          mkdir -p real-doubletalk-rating-v1-out/evidence
          build-real-doubletalk-rating/ap_build_info_dump > real-doubletalk-rating-v1-out/build-info.txt
          sha256sum build-real-doubletalk-rating/ap_process_pcm > real-doubletalk-rating-v1-out/processor.sha256

      - name: Materialize exact upstream double-talk microset
        run: |
          set -euo pipefail
          rm -rf /tmp/audio-pipeline-aec-challenge-real-dt
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/AEC-Challenge.git \
            /tmp/audio-pipeline-aec-challenge-real-dt
          cd /tmp/audio-pipeline-aec-challenge-real-dt
          git -c advice.detachedHead=false checkout --detach 6c633d0a9d2a143a0e364899b91b06f127315b18
          test "$(git rev-parse HEAD)" = "6c633d0a9d2a143a0e364899b91b06f127315b18"
          test "$(git rev-parse HEAD:AECMOS/aecmos.py)" = "7423983e6da8515ec81b58a4e905c4b7bcd6fdff"
          python3 - "$GITHUB_WORKSPACE/.github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          manifest = json.load(open(sys.argv[1]))
          directory = manifest['source']['dataset_directory']
          names = subprocess.check_output(
              ['git', 'ls-tree', '-r', '--name-only', 'HEAD', directory], text=True
          ).splitlines()
          suffixes = {
              'doubletalk_lpb.wav': ('doubletalk', 'lpb'),
              'doubletalk_mic.wav': ('doubletalk', 'mic'),
              'doubletalk_with_movement_lpb.wav': ('doubletalk_with_movement', 'lpb'),
              'doubletalk_with_movement_mic.wav': ('doubletalk_with_movement', 'mic'),
          }
          found = {}
          for path in names:
              name = Path(path).name
              for suffix, key in suffixes.items():
                  token = '_' + suffix
                  if name.endswith(token):
                      guid = name[:-len(token)]
                      found.setdefault(guid, set()).add(key)
                      break
          required = set(suffixes.values())
          complete = sorted(guid for guid, items in found.items() if items == required)
          selected = complete[:2]
          assert selected == manifest['selection']['selected_guids'], (selected, manifest['selection']['selected_guids'])

          source = Path('AECMOS/aecmos.py').read_text(encoding='utf-8')
          assert "silence_duration = 15 * SAMPLE_RATE" in source
          assert "rating_dt_length = int((len(enh_sig) - silence_duration) / 2)" in source
          assert "lpb_sig = lpb_sig[-rating_dt_length:]" in source
          assert "mic_sig = mic_sig[-rating_dt_length:]" in source
          print({'selection_rule': 'PASS', 'selected_guids': selected, 'rating_logic_blob': manifest['source']['rating_logic_blob_sha']})
          PY
          include=$(python3 - "$GITHUB_WORKSPACE/.github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          print(','.join(case[role]['path'] for case in manifest['selection']['cases'] for role in ('lpb', 'mic')))
          PY
          )
          unset GIT_LFS_SKIP_SMUDGE
          git lfs pull --include="$include" --exclude=""

      - name: Run official-rating-interval diagnostic
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/real_doubletalk_rating_v1.py \
            --processor build-real-doubletalk-rating/ap_process_pcm \
            --manifest .github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json \
            --source-root /tmp/audio-pipeline-aec-challenge-real-dt \
            --output real-doubletalk-rating-v1-out/evidence

      - name: Enforce evidence shape without selecting a boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(
              'real-doubletalk-rating-v1-out/evidence/real-doubletalk-rating-result.json'
          ).read_text())
          assert result['status'] == 'DIAGNOSTIC_ONLY'
          assert result['authority'] == 'research-diagnostic-only'
          assert result['candidate_budget'] == 0
          assert result['selection_performed'] is False
          assert result['tuning_performed'] is False
          assert result['rating_interval_is_exact_onset_label'] is False
          assert result['source_revision'] == '6c633d0a9d2a143a0e364899b91b06f127315b18'
          assert len(result['cases']) == 4
          assert sum(bool(case['movement']) for case in result['cases']) == 2
          assert sum(not bool(case['movement']) for case in result['cases']) == 2
          assert {case['guid'] for case in result['cases']} == {
              '49IIo03GZ0CYQOmeA3A0BA', '7GTxyTksSUqCnP5y0ILG4A'
          }
          for case in result['cases']:
              assert case['official_interval_is_exact_onset_label'] is False
              assert case['official_rating_duration_seconds'] > 0
              assert case['analysis_duration_seconds'] > 0
              metrics = case['metrics']
              assert 0.0 <= metrics['double_talk_fraction'] <= 1.0
              assert 0.0 <= metrics['far_end_fraction'] <= 1.0
              assert 0.0 <= metrics['aec_converged_fraction'] <= 1.0
              assert len(case['route']['windows']) >= 2
          summary = Path('real-doubletalk-rating-v1-out/summary.md')
          with summary.open('w', encoding='utf-8') as fh:
              fh.write('## Real double-talk official rating interval v1\n\n')
              fh.write('- Authority: `research-diagnostic-only`\n')
              fh.write('- Candidate budget: `0`\n')
              fh.write('- Exact onset label: `false`\n')
              fh.write('- Case selection: first two lexicographic complete matched GUIDs; no optimization\n')
              for case in result['cases']:
                  fh.write(f"\n### {case['case_id']}\n")
                  fh.write(f"- official_rating_start_seconds: `{case['official_rating_start_seconds']}`\n")
                  fh.write(f"- official_rating_duration_seconds: `{case['official_rating_duration_seconds']}`\n")
                  for key, value in case['metrics'].items():
                      fh.write(f'- {key}: `{value}`\n')
                  shape = case['route']['shape']
                  for key in ('lag_range_ms', 'lag_total_variation_ms', 'peak_score_median', 'peak_score_total_variation', 'peak_ratio_median'):
                      fh.write(f'- route_{key}: `{shape[key]}`\n')
              for group, values in result['aggregate'].items():
                  fh.write(f'\n### aggregate_{group}\n')
                  for key, value in values.items():
                      fh.write(f'- {key}: `{value}`\n')
          print(json.dumps(result['aggregate'], indent=2, sort_keys=True))
          PY
          cat real-doubletalk-rating-v1-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Seal research diagnostic evidence
        run: |
          set -euo pipefail
          cp .github/research/continuous-optimization/development-v3/real-doubletalk-rating-v1.json \
            real-doubletalk-rating-v1-out/manifest.json
          git rev-parse HEAD > real-doubletalk-rating-v1-out/source-sha.txt
          (
            cd /tmp/audio-pipeline-aec-challenge-real-dt
            git rev-parse HEAD
            git rev-parse HEAD:AECMOS/aecmos.py
          ) > real-doubletalk-rating-v1-out/upstream-source.txt
          find real-doubletalk-rating-v1-out -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > real-doubletalk-rating-v1-out/SHA256SUMS

      - name: Upload research diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-doubletalk-rating-v1-${{ github.run_id }}
          path: real-doubletalk-rating-v1-out/
          if-no-files-found: error
          retention-days: 30
