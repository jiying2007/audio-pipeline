name: Research I034 NS VAD Noise State Temporal Response Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i034-ns-vad-noise-state-temporal-response-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i034-ns-vad-noise-state-temporal-response-decomposition-v1-result.json'
      - 'tests/validation/i033_ns_vad_causal_noise_delta_probe.c'
      - 'tests/validation/i033_ns_vad_causal_noise_delta_alignment.py'
      - 'tests/validation/i034_ns_vad_noise_state_temporal_response_decomposition.py'
      - 'tests/validation/test_i034_one_shot_guard.py'
      - 'tests/validation/test_i034_retirement.py'
      - 'tests/validation/data/i034-consumed-workflow.yml'
      - 'validation/research/evidence/i034-36784701187/**'
      - '.github/workflows/research-i034-ns-vad-noise-state-temporal-response-decomposition-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I034 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i034-ns-vad-noise-state-temporal-response-decomposition-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i033_ns_vad_causal_noise_delta_alignment.py \
            tests/validation/i034_ns_vad_noise_state_temporal_response_decomposition.py \
            tests/validation/test_i034_one_shot_guard.py \
            tests/validation/test_i034_retirement.py
          python3 tests/validation/i033_ns_vad_causal_noise_delta_alignment.py --self-test
          python3 tests/validation/i034_ns_vad_noise_state_temporal_response_decomposition.py --self-test
          python3 tests/validation/test_i034_one_shot_guard.py
          python3 tests/validation/test_i034_retirement.py
