name: GitHub Hosted Holdout Secret Probe

on:
  push:
    branches:
      - codex/github-hosted-dns5-probe
    paths:
      - .github/workflows/github-hosted-holdout-secret-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      AP_VALIDATION_HOLDOUT_KEY: ${{ secrets.AP_VALIDATION_HOLDOUT_KEY }}
    steps:
      - name: Require configured blind holdout key without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AP_VALIDATION_HOLDOUT_KEY" || {
            echo 'AP_VALIDATION_HOLDOUT_KEY=ABSENT' >&2
            exit 2
          }
          echo 'AP_VALIDATION_HOLDOUT_KEY=PRESENT'
