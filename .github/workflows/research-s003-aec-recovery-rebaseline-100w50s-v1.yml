name: Research S003 AEC Recovery Rebaseline 100w-50s v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1.json'
      - 'docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1-result.json'
      - 'validation/tools/build_aec_stage_recovery_corpus.py'
      - 'validation/tools/aec_recovery_window_geometry.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/policies/validation-s003-aec-stage-recovery.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-recovery-rebaseline-100w50s-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1.json'
      - 'docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1-result.json'
      - 'validation/tools/build_aec_stage_recovery_corpus.py'
      - 'validation/tools/aec_recovery_window_geometry.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/policies/validation-s003-aec-stage-recovery.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-recovery-rebaseline-100w50s-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-s003-aec-recovery-rebaseline-100w50s-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-rebaseline-100w50s

      - name: Validate candidate-zero rebaseline contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1.json >/dev/null
          python3 -m py_compile             validation/tools/build_aec_stage_recovery_corpus.py             validation/tools/aec_recovery_window_geometry.py             validation/tools/aec_recovery_rebaseline_100w50s.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_recovery_rebaseline_100w50s.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-recovery-100w50s-geometry-confirmation-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_REBASELINE_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['promotion_allowed'] is False and c['shipping_change_allowed'] is False
          assert c['corpus']['fresh_seeds']==[12707,12807,12907,13007]
          assert c['corpus']['cases_per_seed']==15
          assert c['measurement']['geometry_id']=='100w-50s'
          assert c['measurement']['post_window_ms']==100
          assert c['measurement']['post_stride_ms']==50
          assert c['measurement']['required_windows_for_300ms_coverage']==5
          assert c['retention_rule']['minimum_nonzero_delta_ms']==50
          assert c['preregistered_rules']['rejected_ns_hypothesis_remains_rejected'] is True
          assert c['preregistered_rules']['no_parameter_search'] is True
          assert c['authority_boundary']['may_claim_causal_stage'] is False
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['research_default_geometry']['id']=='100w-50s'
          assert p['reviewed_validity']['research_measurement_geometry_authorized']=='100w-50s'
          print('S003 100w-50s recovery rebaseline authority: PASS')
          PY

      - name: Build fixed diagnostic stage-prefix processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-aec-rebaseline             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-aec-rebaseline --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-aec-rebaseline/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-aec-rebaseline/libaudio_pipeline.a -lm             -o build-s003-aec-rebaseline/stage_prefix_process_pcm

      - name: Run fresh 100w-50s recovery rebaseline
        run: |
          set -euo pipefail
          out=s003-aec-rebaseline-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1.json

          for seed in 12707 12807 12907 13007; do
            corpus="/tmp/s003-aec-rebaseline-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            python3 validation/tools/build_aec_stage_recovery_corpus.py               --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools             python3 validation/tools/stage_interaction_run.py               --source-revision '${{ github.sha }}'               --corpus "$corpus/corpus.json"               --policy validation/policies/validation-s003-aec-stage-recovery.json               --dataset-lock validation/datasets.lock.json               --processor build-s003-aec-rebaseline/stage_prefix_process_pcm               --output "$seed_out/canonical-report.json"               --evidence-manifest "$seed_out/evidence-manifest.json"               --enforce

            PYTHONPATH=validation/tools             python3 validation/tools/aec_recovery_rebaseline_100w50s.py run               --corpus "$corpus/corpus.json"               --report "$seed_out/canonical-report.json"               --processor build-s003-aec-rebaseline/stage_prefix_process_pcm               --contract "$contract"               --output "$seed_out/rebaseline.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools           python3 validation/tools/aec_recovery_rebaseline_100w50s.py aggregate             --contract "$contract"             --input "$out/12707/rebaseline.json"             --input "$out/12807/rebaseline.json"             --input "$out/12907/rebaseline.json"             --input "$out/13007/rebaseline.json"             --output "$out/cross-seed-rebaseline-summary.json"

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish rebaseline outcome
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-rebaseline-out/cross-seed-rebaseline-summary.json').read_text())
          print('## S003 AEC recovery rebaseline — 100w-50s')
          print('')
          print('- Authority: **candidate-zero rebaseline only / non-shipping**')
          print(f"- Fresh seeds: `{r['fresh_seeds']}`")
          print(f"- Retained non-zero phenomena: `{r['retained_nonzero_phenomenon_count']}`")
          for item in r['retained_nonzero_phenomena']:
              print(
                  f"- `{item['base_case_id']} {item['from_stage']}→{item['to_stage']}`: "
                  f"`{item['classification']}`, deltas=`{item['delta_ms']}`"
              )
          print(f"- Full-pipeline cross-seed ranges: `{r['full_pipeline_cross_seed_range_ms']}`")
          print('- Causal attribution: **NOT_AUTHORIZED**')
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound rebaseline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s003-aec-recovery-rebaseline-100w50s-${{ github.run_id }}
          path: s003-aec-rebaseline-out/
          if-no-files-found: error
          retention-days: 30
