name: Repository Governance Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-bootstrap
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Require repository administration credential
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "REPOSITORY_ADMIN_TOKEN is required with repository Administration: write." >&2
            exit 1
          }
      - name: Install idempotent main/tag rulesets and immutable releases
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
        run: >-
          python3 scripts/bootstrap_github_governance.py
          --repository "$GITHUB_REPOSITORY"
          --output /tmp/governance-bootstrap.json
      - name: Verify resulting live governance
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_ADMIN_TOKEN }}
        run: >-
          python3 scripts/github_governance.py
          --repository "$GITHUB_REPOSITORY"
          --output /tmp/repository-governance.json
      - name: Publish audit summary
        run: |
          cat /tmp/governance-bootstrap.json
          cat /tmp/repository-governance.json
