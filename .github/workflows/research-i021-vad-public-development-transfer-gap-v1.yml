name: Research I021 VAD Public Development Transfer Gap v1
run-name: "i021-vad-public-development-transfer-gap / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1.json'
      - 'tests/validation/i021_vad_public_development_transfer_gap_probe.c'
      - 'tests/validation/i021_vad_public_development_transfer_gap.py'
      - 'tests/validation/test_i021_one_shot_guard.py'
      - '.github/workflows/research-i021-vad-public-development-transfer-gap-v1.yml'
      - '.github/program/maintenance_workflow_contract.py'
      - '.github/workflows/program-iteration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i021-vad-public-development-transfer-gap-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1.json
  DEV_LOCK: .github/research/continuous-optimization/development-data-v3/development.lock.json
  DEV_ROOT: /tmp/audio-pipeline-i021-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3
  SOURCE_BASE: 57e4c64adc1cf06819e46e24e275ecd746d5f17f

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I021 candidate-zero diagnostic contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i021_vad_public_development_transfer_gap.py
          python3 tests/validation/i021_vad_public_development_transfer_gap.py --self-test
          python3 tests/validation/test_i021_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='RESEARCH_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          assert c['diagnostic_infrastructure_base_sha']=='aae3affeca0c5e2e4b00dc7350128d29284775ac'
          assert c['fresh_diagnostic_authority']['seeds']==[5307,5407,5507]
          assert c['fresh_diagnostic_authority']['diagnostic_execution_limit']==1
          assert c['fresh_diagnostic_authority']['candidate_limit']==0
          assert c['fresh_diagnostic_authority']['confirmation_limit']==0
          assert c['dataset_authority']['dataset_id']=='public-development-diverse'
          assert c['dataset_authority']['role']=='development'
          assert c['dataset_authority']['validation_holdout_consumed'] is False
          assert all(value is False for value in c['authority_boundary'].values())

          registry=json.loads(Path(c['dataset_authority']['registry_path']).read_text())
          dataset=next(x for x in registry['datasets'] if x['id']=='public-development-diverse')
          assert dataset['identity_value']=='audio-pipeline-public-development-v3'
          assert dataset['selection_roles']==['development']
          assert dataset['evaluation_roles']==[]
          assert dataset['frozen_holdout'] is False
          assert dataset['may_promote_shipping'] is False

          prior=json.loads(Path(c['predecessor']['i020_blind_review']).read_text())
          assert prior['status']==c['predecessor']['required_i020_status']
          scope=json.loads(Path(c['predecessor']['candidate_quality_scope_review']).read_text())
          assert scope['status']==c['predecessor']['required_scope_status']

          for seed in c['fresh_diagnostic_authority']['seeds']:
              result=subprocess.run(
                  ['git','grep','-n',str(seed),'--',':!'+str(path)],
                  stdout=subprocess.PIPE, text=True, check=False)
              assert result.returncode==1, (
                  f'I021 seed is not fresh: {seed}\n{result.stdout}')
          PY
          git cat-file -e "$SOURCE_BASE^{commit}"
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i021-vad-public-development-transfer-gap-contract
      - name: Compile I021 shipping-mirror probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i021-contract -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i021-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i021-contract/generated             tests/validation/i021_vad_public_development_transfer_gap_probe.c             build-i021-contract/libaudio_pipeline.a -lm             -o build-i021-contract/i021-vad-public-development-transfer-gap-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I021 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i021-vad-public-development-transfer-gap-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I021 diagnostic requires first-attempt trusted main dispatch')

          def pages(endpoint):
              raw=subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint], text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value

          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I021 run not visible; fail closed')

          consuming={
              'Materialize fresh public-development-v3 partitions',
              'Evaluate candidate-zero public-development VAD transfer gap',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts < 1:
                  raise SystemExit('invalid prior I021 attempt count')
              for run_attempt in range(1, attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs'
                      '?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if step.get('name') in consuming and step.get('conclusion') != 'skipped':
                                  raise SystemExit(
                                      f'I021 one-shot authority already consumed by run {run_id}')
          print('I021 one-shot authority: fresh')
          PY
      - name: Bind exact shipping source and trusted diagnostic infrastructure
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD --             src/enhance/ap_vad.c             src/modules/ap_vad_module.c             src/modules/ap_ns_module.c             include/audio_pipeline/audio_modules.h             src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i021-vad-public-development-transfer-gap
      - name: Build exact shipping source and I021 probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i021 -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i021 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i021/generated             tests/validation/i021_vad_public_development_transfer_gap_probe.c             build-i021/libaudio_pipeline.a -lm             -o build-i021/i021-vad-public-development-transfer-gap-probe
      - name: Materialize fresh public-development-v3 partitions
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py             --lock "$DEV_LOCK" --root "$DEV_ROOT"             --output /tmp/i021-development-v3-materialization.json
          for seed in 5307 5407 5507; do
            python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py               --lock "$DEV_LOCK"               --materialization /tmp/i021-development-v3-materialization.json               --data-root "$DEV_ROOT"               --output "/tmp/i021-public-dev-$seed"               --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
          done
      - name: Evaluate candidate-zero public-development VAD transfer gap
        run: |
          set -euo pipefail
          rm -rf i021-out
          mkdir -p i021-out/evidence
          python3 tests/validation/i021_vad_public_development_transfer_gap.py             --probe build-i021/i021-vad-public-development-transfer-gap-probe             --contract "$CONTRACT"             --corpus /tmp/i021-public-dev-5307/corpus.json             --corpus /tmp/i021-public-dev-5407/corpus.json             --corpus /tmp/i021-public-dev-5507/corpus.json             --output i021-out/evidence/result.json
          cp "$CONTRACT" i021-out/evidence/contract.json
          cp /tmp/i021-development-v3-materialization.json i021-out/evidence/materialization.json
          sha256sum build-i021/i021-vad-public-development-transfer-gap-probe             | awk '{print $1}' > i021-out/evidence/probe.sha256
          printf 'source_base_sha=%s\nmain_sha=%s\n'             "$SOURCE_BASE" "$GITHUB_SHA" > i021-out/evidence/build-info.txt
          for seed in 5307 5407 5507; do
            sha256sum "/tmp/i021-public-dev-$seed/corpus.json"
          done > i021-out/evidence/corpora.sha256
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i021-out/evidence/result.json').read_text())
          summary={
              'decision':r['decision'],
              'invalid_reasons':r['invalid_reasons'],
              'fresh_diagnostic_seeds':r['fresh_diagnostic_seeds'],
              'global':r['global'],
              'reference_absolute_min_vad_f1':r['reference_absolute_min_vad_f1'],
              'below_reference_slice_count':len(r['below_reference_slices']),
              'worst_development_slices':r['worst_development_slices'],
              'shipping_mirror':r['shipping_mirror'],
          }
          Path('i021-out/evidence/summary.json').write_text(
              json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY
          (
            cd i021-out/evidence
            sha256sum build-info.txt contract.json corpora.sha256 materialization.json               probe.sha256 result.json summary.json > SHA256SUMS
          )
      - name: Enforce diagnostic-only authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i021-out/evidence/result.json').read_text())
          assert r['decision'] in {
              'PUBLIC_DEVELOPMENT_VAD_TRANSFER_GAP_DECOMPOSED_REVIEW_REQUIRED',
              'PUBLIC_DEVELOPMENT_VAD_BASELINE_ADEQUATE_REVIEW_REQUIRED',
          }
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert all(value is False for value in r['authority_boundary'].values())
          print(json.dumps({
              'decision':r['decision'],
              'global_f1':r['global']['f1'],
              'below_reference_slices':len(r['below_reference_slices']),
              'fn_mechanisms':r['global']['false_negative_mechanisms'],
              'fp_origins':r['global']['false_positive_origins'],
          },sort_keys=True))
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i021-out/evidence/summary.json; then
            cat i021-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I021 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i021-vad-public-development-transfer-gap-${{ github.run_id }}
          path: i021-out/
          retention-days: 90
          if-no-files-found: error
