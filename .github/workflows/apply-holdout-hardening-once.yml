name: Apply Holdout Hardening Once

on:
  push:
    branches:
      - codex/github-hosted-blind
    paths:
      - .github/workflows/apply-holdout-hardening-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/github-hosted-blind
          fetch-depth: 0
      - name: Apply holdout lifecycle patch
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/hosted-validation/patch_holdout_once.py
          rm .github/research/continuous-optimization/hosted-validation/patch_holdout_once.py
          rm .github/workflows/apply-holdout-hardening-once.yml
          git diff --check
      - name: Commit hardening and retire scaffold
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): harden ephemeral blind holdout lifecycle'
          git push origin HEAD:codex/github-hosted-blind
