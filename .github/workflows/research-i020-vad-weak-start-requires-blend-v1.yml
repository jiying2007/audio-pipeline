name: Research I020 VAD Weak Start Requires Blend v1
run-name: "i020-vad-weak-start-requires-blend-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1.json'
      - 'tests/validation/i020_vad_weak_start_requires_blend_probe.c'
      - 'tests/validation/i020_vad_weak_start_requires_blend.py'
      - 'tests/validation/test_i020_one_shot_guard.py'
      - '.github/workflows/research-i020-vad-weak-start-requires-blend-v1.yml'
      - 'tests/validation/data/i020-consumed-workflow.yml'
      - 'tests/validation/test_i020_retirement.py'
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1-result.json'
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json'
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.patch'

permissions:
  contents: read

concurrency:
  group: research-i020-vad-weak-start-requires-blend-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I020 frozen single-candidate contract
        run: |
          set -euo pipefail
          python3 tests/validation/test_i020_retirement.py
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i020_vad_weak_start_requires_blend.py
          python3 tests/validation/i020_vad_weak_start_requires_blend.py --self-test
          python3 tests/validation/test_i020_one_shot_guard.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i020-vad-weak-start-requires-blend-v1.json').read_text())
          assert c['authority']=='RESEARCH_SELECTION_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          assert c['budget']=={
            'candidate_limit':1,'confirmation_limit':0,'development_execution_limit':1}
          assert c['fresh_development']['seeds']==[461123,471123,481123]
          assert c['candidate']['parameter_search_allowed'] is False
          assert c['candidate']['threshold_tuning_allowed'] is False
          assert c['candidate']['hold_length_tuning_allowed'] is False
          assert c['output_authority']['maximum_status']=='FROZEN_RESEARCH_CANDIDATE'
          assert c['output_authority']['automatic_main_mutation'] is False
          prior=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i019-vad-weak-start-evidence-decomposition-v1-result.json').read_text())
          assert prior['status']=='CLOSED_DIAGNOSTIC_ONLY'
          assert prior['reviewed_decision']==(
            'VAD_WEAK_START_BLEND_APPLIED_SEPARATES_NONSTATIONARY_NOISE_WITH_'
            'STATIONARY_NEAR_ALL_SPEECH_NO_CHANGE_SELECTED')
          PY
          git cat-file -e "57e4c64adc1cf06819e46e24e275ecd746d5f17f^{commit}"

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i020-vad-weak-start-requires-blend-contract

      - name: Compile I020 state-only probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i020-contract -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i020-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i020-contract/generated             tests/validation/i020_vad_weak_start_requires_blend_probe.c             build-i020-contract/libaudio_pipeline.a -lm             -o build-i020-contract/i020-vad-weak-start-requires-blend-probe
