name: Retry Validation Corr V236

on:
  push:
    branches: [validation/refine-render-correlation-search-v2.3.6]

permissions:
  contents: write

jobs:
  retry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Reuse anchored patch after removing temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/_apply-validation-corr-v236.yml /tmp/original-patch.yml
          ruby -e 'require "yaml"; y=YAML.load_file(ARGV[0]); puts y.fetch("jobs").fetch("apply").fetch("steps").find { |s| s["run"] }.fetch("run")' /tmp/original-patch.yml > /tmp/apply.sh
          git rm .github/workflows/_apply-validation-corr-v236.yml .github/workflows/_apply-validation-corr-v236-retry.yml
          sed -i '/git rm \.github\/workflows\/_apply-validation-corr-v236\.yml/d' /tmp/apply.sh
          bash /tmp/apply.sh
