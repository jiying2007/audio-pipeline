name: Research I017 VAD State Persistence Decomposition v1
run-name: "i017-vad-state-persistence-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i017-vad-state-persistence-decomposition-v1.json'
      - 'tests/validation/i017_vad_state_persistence_probe.c'
      - 'tests/validation/i017_vad_state_persistence_decomposition.py'
      - 'tests/validation/test_i017_one_shot_guard.py'
      - '.github/workflows/research-i017-vad-state-persistence-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-i017-vad-state-persistence-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i017-vad-state-persistence-decomposition-v1.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I017 frozen diagnostic contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i017_vad_state_persistence_decomposition.py
          python3 tests/validation/i017_vad_state_persistence_decomposition.py --self-test
          python3 tests/validation/test_i017_one_shot_guard.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i017-vad-state-persistence-decomposition-v1.json').read_text())
          assert c['authority']=='RESEARCH_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          assert c['budget']=={
            'candidate_limit':0,'confirmation_limit':0,'diagnostic_execution_limit':1}
          assert c['fresh_diagnostic_authority']['seeds']==[371123,381123,391123]
          assert all(value is False for value in c['authority_boundary'].values())
          prior=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i016-vad-local-evidence-gated-blend-v1-result.json').read_text())
          assert prior['status']=='CLOSED_REJECTED_DEVELOPMENT_ONLY'
          assert prior['reviewed_decision']==(
            'LOCAL_EVIDENCE_GATED_BLEND_REJECTED_NO_ACTIVE_REDUCTION_AUC_REGRESSION')
          PY
          git cat-file -e "57e4c64adc1cf06819e46e24e275ecd746d5f17f^{commit}"
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i017-vad-state-persistence-contract
      - name: Compile I017 diagnostic probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i017-contract -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i017-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i017-contract/generated             tests/validation/i017_vad_state_persistence_probe.c             build-i017-contract/libaudio_pipeline.a -lm             -o build-i017-contract/i017-vad-state-persistence-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce one-shot I017 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PY'
          import json
          import os
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          current = int(os.environ['GITHUB_RUN_ID'])
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise SystemExit('I017 rerun forbidden; preserve the first diagnostic result')
          workflow = 'research-i017-vad-state-persistence-decomposition-v1.yml'

          def collection(endpoint, key):
              pages = json.loads(subprocess.check_output([
                  'gh', 'api', '--paginate', '--slurp', endpoint,
              ], text=True))
              return [item for page in pages for item in page[key]]

          runs = collection(
              f'repos/{repo}/actions/workflows/{workflow}/runs'
              '?event=workflow_dispatch&branch=main&per_page=100',
              'workflow_runs',
          )
          if not any(int(item['id']) == current for item in runs):
              raise SystemExit('I017 current run not visible; stop before fresh generation')

          fresh_steps = {
              'Generate preregistered fresh I017 partitions',
              'Run fresh I017 VAD state-persistence decomposition',
          }
          consumed = set()
          for item in runs:
              run_id = int(item['id'])
              if run_id == current:
                  continue
              attempts = int(item['run_attempt'])
              if attempts < 1:
                  raise SystemExit('I017 invalid historical attempt count')
              for attempt in range(1, attempts + 1):
                  jobs = collection(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{attempt}'
                      '/jobs?per_page=100',
                      'jobs',
                  )
                  for job in jobs:
                      if job.get('conclusion') == 'skipped':
                          continue
                      steps = job.get('steps')
                      if not isinstance(steps, list):
                          raise SystemExit('I017 missing historical step collection')
                      for step in steps:
                          if (
                              step.get('name') in fresh_steps
                              and step.get('conclusion') != 'skipped'
                              and step.get('status') not in {'queued','pending','waiting'}
                          ):
                              consumed.add(run_id)
                  if run_id in consumed:
                      break
          if consumed:
              raise SystemExit(
                  'I017 fresh authority already touched by run(s): '
                  + ','.join(str(x) for x in sorted(consumed))
              )
          print('one-shot I017 guard: PASS')
          PY

      - name: Bind exact shipping source
        run: |
          set -euo pipefail
          source_sha=$(jq -r .source_base_sha "$CONTRACT")
          test "$source_sha" = 57e4c64adc1cf06819e46e24e275ecd746d5f17f
          git cat-file -e "$source_sha^{commit}"
          git worktree add --detach /tmp/i017-source "$source_sha"

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i017-vad-state-persistence

      - name: Build exact source and diagnostic probe
        run: |
          set -euo pipefail
          mkdir -p i017-out
          cmake -S /tmp/i017-source -B /tmp/i017-build             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON             -DAP_BUILD_SOURCE_REVISION=57e4c64adc1cf06819e46e24e275ecd746d5f17f
          cmake --build /tmp/i017-build --target audio_pipeline ap_build_info_dump --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -I/tmp/i017-source/include -I/tmp/i017-source/src -I/tmp/i017-build/generated             tests/validation/i017_vad_state_persistence_probe.c             /tmp/i017-build/libaudio_pipeline.a -lm -o /tmp/i017-probe
          /tmp/i017-build/ap_build_info_dump > i017-out/build-info.txt
          sha256sum /tmp/i017-probe > i017-out/probe.sha256
          cp "$CONTRACT" i017-out/contract.json

      - name: Generate preregistered fresh I017 partitions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          c=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i017-vad-state-persistence-decomposition-v1.json').read_text())
          manifests=[]
          for seed in c['fresh_diagnostic_authority']['seeds']:
              out=Path(f'/tmp/i017-{seed}')
              subprocess.run([
                'python3','/tmp/i017-source/'+c['fresh_diagnostic_authority']['generator'],
                '--output',str(out),'--seed',str(seed),
                '--seconds',str(c['fresh_diagnostic_authority']['seconds'])
              ],check=True,cwd='/tmp/i017-source')
              corpus=out/'corpus.json'
              payload=json.loads(corpus.read_text())
              assert payload['generator']['seed']==seed
              selected=[row for row in payload['cases']
                if row.get('processor_profile')=='ns-isolated'
                and row.get('vad_labels')
                and row.get('render_audio') is None
                and row.get('case_id') in {'stage-ns-stationary','stage-ns-nonstationary'}]
              assert len(selected)==2
              manifests.append(str(corpus))
          Path('i017-out/corpora.txt').write_text('\n'.join(manifests)+'\n')
          PY

      - name: Run fresh I017 VAD state-persistence decomposition
        run: |
          set -euo pipefail
          mapfile -t corpora < i017-out/corpora.txt
          args=()
          for corpus in "${corpora[@]}"; do args+=(--corpus "$corpus"); done
          python3 tests/validation/i017_vad_state_persistence_decomposition.py             --probe /tmp/i017-probe --contract "$CONTRACT" "${args[@]}"             --output i017-out/result.json | tee i017-out/summary.json

      - name: Enforce diagnostic-only authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          r=json.load(open('i017-out/result.json'))
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['diagnostic_execution_consumed']==1
          assert r['decision'] in {
            'VAD_STATE_PERSISTENCE_DECOMPOSED_REVIEW_REQUIRED',
            'I017_INPUT_INVALID_REVIEW_REQUIRED'}
          assert all(value is False for value in r['authority_boundary'].values())
          PY

      - name: Seal I017 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p i017-out
          (cd i017-out && find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
            sort -z | xargs -0 -r sha256sum > SHA256SUMS)

      - name: Upload I017 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i017-vad-state-persistence-${{ github.run_id }}
          path: i017-out/
          retention-days: 90
          if-no-files-found: error
