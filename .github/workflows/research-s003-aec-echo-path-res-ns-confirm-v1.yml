name: Research S003 AEC Echo-Path RES-NS Recovery Confirmation v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1.json'
      - 'docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1-result.json'
      - 'validation/tools/aec_echo_path_res_ns_confirmation.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/policies/validation-s003-echo-path-res-ns-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-echo-path-res-ns-confirm-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1.json'
      - 'docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1-result.json'
      - 'validation/tools/aec_echo_path_res_ns_confirmation.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/policies/validation-s003-echo-path-res-ns-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-echo-path-res-ns-confirm-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s003-aec-echo-path-res-ns-confirm-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-echo-res-ns-confirm

      - name: Validate candidate-zero confirmation contract
        run: |
          set -euo pipefail
          python3 -m json.tool docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1.json >/dev/null
          python3 -m py_compile validation/tools/aec_echo_path_res_ns_confirmation.py
          PYTHONPATH=validation/tools python3 validation/tools/aec_echo_path_res_ns_confirmation.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-recovery-rebaseline-100w50s-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_SINGLE_HYPOTHESIS_CONFIRMATION'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['corpus']['fresh_seeds']==[13107,13207,13307,13407]
          assert c['corpus']['profiles']==['prefix-res','prefix-ns','default']
          assert c['hypothesis']['gate']=='ns_recovery_time_ms - res_recovery_time_ms >= 50'
          assert c['measurement']['geometry_id']=='100w-50s'
          assert c['preregistered_rules']['either_outcome_is_valid_evidence'] is True
          assert c['preregistered_rules']['no_ns_internal_parameter_search'] is True
          assert c['authority_boundary']['may_claim_ns_root_cause'] is False
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['mechanical_result']['retained_nonzero_phenomenon_count']==1
          print('S003 echo-path RES-NS confirmation authority: PASS')
          PY

      - name: Build fixed diagnostic stage-prefix processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-echo-res-ns -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-echo-res-ns --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-echo-res-ns/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-echo-res-ns/libaudio_pipeline.a -lm             -o build-s003-echo-res-ns/stage_prefix_process_pcm

      - name: Run independent fresh confirmation
        run: |
          set -euo pipefail
          out=s003-echo-res-ns-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1.json
          for seed in 13107 13207 13307 13407; do
            corpus="/tmp/s003-echo-res-ns-$seed"; seed_out="$out/$seed"; mkdir -p "$seed_out"
            PYTHONPATH=validation/tools python3 validation/tools/aec_echo_path_res_ns_confirmation.py build --output "$corpus" --seed "$seed" --seconds 6
            PYTHONPATH=validation/tools python3 validation/tools/stage_interaction_run.py               --source-revision '${{ github.sha }}'               --corpus "$corpus/corpus.json"               --policy validation/policies/validation-s003-echo-path-res-ns-confirm.json               --dataset-lock validation/datasets.lock.json               --processor build-s003-echo-res-ns/stage_prefix_process_pcm               --output "$seed_out/canonical-report.json"               --evidence-manifest "$seed_out/evidence-manifest.json" --enforce
            PYTHONPATH=validation/tools python3 validation/tools/aec_echo_path_res_ns_confirmation.py run               --corpus "$corpus/corpus.json" --report "$seed_out/canonical-report.json"               --processor build-s003-echo-res-ns/stage_prefix_process_pcm               --contract "$contract" --output "$seed_out/confirmation.json"
            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done
          PYTHONPATH=validation/tools python3 validation/tools/aec_echo_path_res_ns_confirmation.py aggregate             --contract "$contract"             --input "$out/13107/confirmation.json" --input "$out/13207/confirmation.json"             --input "$out/13307/confirmation.json" --input "$out/13407/confirmation.json"             --output "$out/cross-seed-confirmation.json"
          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish confirmation outcome
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-echo-res-ns-out/cross-seed-confirmation.json').read_text())
          print('## S003 echo-path RES→NS recovery confirmation')
          print(f"- Outcome: **{r['outcome']}**")
          for o in r['observations']:
              print(f"- seed {o['seed']}: RES={o['res_recovery_time_ms']} ms, NS={o['ns_recovery_time_ms']} ms, Δ={o['ns_minus_res_ms']} ms, confirmed={o['confirmed_on_seed']}")
          print('- NS root-cause authority: none')
          print('- Candidate authority: none')
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s003-aec-echo-path-res-ns-confirm-${{ github.run_id }}
          path: s003-echo-res-ns-out/
          if-no-files-found: error
          retention-days: 30
