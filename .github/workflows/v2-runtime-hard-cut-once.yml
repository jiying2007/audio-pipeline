name: V2 Runtime Hard Cut Once

on:
  push:
    branches: [feat/v2-hard-cut-cleanup]

permissions:
  contents: write

concurrency:
  group: v2-runtime-hard-cut-once
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.head_commit.message != 'refactor!: physically remove v1 runtime compatibility bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: feat/v2-hard-cut-cleanup
      - name: Rewrite runtime to the v2 terminal surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('src/platform/linux/ap_runtime.c')
          shadow = Path('src/platform/linux/audio_pipeline/audio_runtime.h')
          workflow = Path('.github/workflows/v2-runtime-hard-cut-once.yml')
          text = path.read_text(encoding='utf-8')
          expected = '7c8923b8c3a47fd4d4f33324cf83b45748945c0c43406f40730e2684dfa889cb'
          actual = hashlib.sha256(text.encode('utf-8')).hexdigest()
          if actual != expected:
              raise SystemExit(f'unexpected ap_runtime.c SHA-256: {actual}')

          text = text.replace('AP_RUNTIME_CONTROL_API_VERSION', 'AP_RUNTIME_API_VERSION')
          text = text.replace('AP_RUNTIME_METRICS_V3_API_VERSION', 'AP_RUNTIME_API_VERSION')
          text = text.replace('AP_RUNTIME_CRITICAL_STATE_API_VERSION', 'AP_RUNTIME_API_VERSION')
          text = text.replace(
              'ap_status_t ap_runtime_init_ex(void *memory,',
              'ap_status_t ap_runtime_open(void *memory,', 1)

          start = text.index('ap_status_t ap_runtime_init(void *memory,')
          end = text.index('\nstatic void runtime_latch_critical', start)
          text = text[:start] + text[end + 1:]

          text = text.replace(
              'ap_status_t ap_runtime_submit_ex(ap_runtime_t *runtime,',
              'ap_status_t ap_runtime_submit_frame(ap_runtime_t *runtime,', 1)
          start = text.index('ap_status_t ap_runtime_submit(ap_runtime_t *runtime,')
          end = text.index('\nstatic ap_status_t runtime_validate_command', start)
          text = text[:start] + text[end + 1:]

          start = text.index('void ap_runtime_get_metrics(const ap_runtime_t *runtime,')
          end = text.index('\nap_status_t ap_runtime_get_critical_state', start)
          current_metrics = r'''static uint32_t percentile_us(const ap_runtime_t *runtime,
                                        uint32_t numerator,
                                        uint32_t denominator) {
              uint64_t total = 0u;
              uint64_t target;
              uint64_t cumulative = 0u;
              uint32_t i;
              for (i = 0u; i < AP_RUNTIME_LATENCY_BUCKETS; ++i)
                  total += atomic_load_explicit(&runtime->latency_hist[i],
                                                memory_order_relaxed);
              if (!total) return 0u;
              target = (total * numerator + denominator - 1u) / denominator;
              for (i = 0u; i < AP_RUNTIME_LATENCY_BUCKETS; ++i) {
                  cumulative += atomic_load_explicit(&runtime->latency_hist[i],
                                                     memory_order_relaxed);
                  if (cumulative >= target) return latency_bucket_upper(i);
              }
              return UINT32_MAX;
          }

          ap_status_t ap_runtime_read_metrics(const ap_runtime_t *runtime,
                                              ap_runtime_metrics_t *metrics) {
              if (!runtime || !metrics || metrics->struct_size < sizeof(*metrics) ||
                  metrics->api_version != AP_RUNTIME_API_VERSION)
                  return AP_EINVAL;
              metrics->submitted_frames = counter64_read(&runtime->submitted_frames);
              metrics->processed_frames = counter64_read(&runtime->processed_frames);
              metrics->failed_frames =
                  (uint64_t)atomic_load_explicit(&runtime->failed_frames,
                                                 memory_order_acquire);
              metrics->input_full_events = counter64_read(&runtime->input_full_events);
              metrics->output_drop_events = counter64_read(&runtime->output_drop_events);
              metrics->dsp_overruns = counter64_read(&runtime->dsp_overruns);
              metrics->command_full_events = counter64_read(&runtime->command_full_events);
              metrics->event_drop_events = counter64_read(&runtime->event_drop_events);
              metrics->stream_discontinuities =
                  counter64_read(&runtime->stream_discontinuities);
              metrics->capture_gap_frames = counter64_read(&runtime->capture_gap_frames);
              metrics->render_gap_frames = counter64_read(&runtime->render_gap_frames);
              metrics->timestamp_frames = counter64_read(&runtime->timestamp_frames);
              metrics->scheduler_bind_failures =
                  counter64_read(&runtime->scheduler_bind_failures);
              metrics->memory_lock_failures =
                  counter64_read(&runtime->memory_lock_failures);
              metrics->render_push_failures =
                  (uint64_t)atomic_load_explicit(&runtime->render_push_failures,
                                                 memory_order_acquire);
              metrics->capture_process_failures =
                  (uint64_t)atomic_load_explicit(&runtime->capture_process_failures,
                                                 memory_order_acquire);
              metrics->observed_cpu_changes =
                  (uint64_t)atomic_load_explicit(&runtime->observed_cpu_changes,
                                                 memory_order_acquire);
              metrics->critical_events =
                  (uint64_t)atomic_load_explicit(&runtime->critical_events,
                                                 memory_order_acquire);
              metrics->input_queue_high_water =
                  atomic_load_explicit(&runtime->input_queue_high_water,
                                       memory_order_relaxed);
              metrics->output_queue_high_water =
                  atomic_load_explicit(&runtime->output_queue_high_water,
                                       memory_order_relaxed);
              metrics->last_dsp_us =
                  atomic_load_explicit(&runtime->last_dsp_us, memory_order_relaxed);
              metrics->max_dsp_us =
                  atomic_load_explicit(&runtime->max_dsp_us, memory_order_relaxed);
              metrics->p50_dsp_us = percentile_us(runtime, 50u, 100u);
              metrics->p95_dsp_us = percentile_us(runtime, 95u, 100u);
              metrics->p99_dsp_us = percentile_us(runtime, 99u, 100u);
              metrics->actual_cpu =
                  atomic_load_explicit(&runtime->actual_cpu, memory_order_acquire);
              metrics->actual_policy =
                  atomic_load_explicit(&runtime->actual_policy, memory_order_acquire);
              metrics->actual_priority =
                  atomic_load_explicit(&runtime->actual_priority, memory_order_acquire);
              metrics->last_pipeline_error =
                  atomic_load_explicit(&runtime->last_pipeline_error,
                                       memory_order_acquire);
              metrics->quality =
                  (ap_quality_t)atomic_load_explicit(&runtime->quality,
                                                     memory_order_acquire);
              return AP_OK;
          }
          '''
          text = text[:start] + current_metrics + text[end + 1:]

          removed = (
              'ap_runtime_init_ex', 'ap_runtime_submit_ex',
              'ap_runtime_get_metrics_v2', 'ap_runtime_get_metrics_v3',
              'ap_runtime_metrics_v2_t', 'ap_runtime_metrics_v3_t',
              'AP_RUNTIME_CONTROL_API_VERSION',
              'AP_RUNTIME_METRICS_V3_API_VERSION',
              'AP_RUNTIME_CRITICAL_STATE_API_VERSION',
          )
          leftovers = [token for token in removed if token in text]
          if leftovers:
              raise SystemExit('legacy runtime identifiers remain: ' + ', '.join(leftovers))
          for token in ('ap_runtime_open', 'ap_runtime_submit_frame', 'ap_runtime_read_metrics'):
              if token not in text:
                  raise SystemExit(f'missing v2 runtime identifier: {token}')

          path.write_text(text, encoding='utf-8')
          if not shadow.is_file():
              raise SystemExit('expected private runtime compatibility bridge is missing')
          shadow.unlink()
          workflow.unlink()
          print('runtime_v2_sha256=' + hashlib.sha256(text.encode('utf-8')).hexdigest())
          PY
          git diff --check
          ! grep -R -n -E 'ap_runtime_(init_ex|submit_ex|get_metrics_v2|get_metrics_v3)|ap_runtime_metrics_v[23]_t|AP_RUNTIME_(CONTROL|METRICS_V3|CRITICAL_STATE)_API_VERSION' \
            src/platform/linux include/audio_pipeline tests bench examples fuzz
      - name: Commit physical hard cut and remove migrator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor!: physically remove v1 runtime compatibility bridge'
          git push origin HEAD:feat/v2-hard-cut-cleanup
