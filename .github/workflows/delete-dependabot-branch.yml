name: Delete deferred Dependabot branch

on:
  push:
    branches:
      - dependabot/github_actions/actions/attest-build-provenance-4.2.2

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete deferred branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/dependabot/github_actions/actions/attest-build-provenance-4.2.2"
