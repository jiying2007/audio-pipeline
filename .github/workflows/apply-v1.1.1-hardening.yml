          Path('certification/validate_record.py').write_text(r'''#!/usr/bin/env python3
"""Validate audio-pipeline SKU certification evidence and product policy."""
from __future__ import annotations
import argparse
import json
import re
from pathlib import Path

PRODUCT_PERF_REQUIRED = {"active_cpu_percent", "p95_us", "p99_us", "deadline_misses", "rss_kib", "xruns", "overruns", "input_full_events", "output_drop_events"}
PRODUCT_ACOUSTIC_REQUIRED = {"corpus_revision", "cases_total", "cases_passed", "far_end_erle_db", "aec_convergence_ms", "double_talk_near_si_sdr_db", "noise_si_sdr_improvement_db", "vad_f1", "threshold_report"}
POLICY_REQUIRED = {"policy_id", "max_active_cpu_percent", "max_rss_kib", "max_p95_us", "max_p99_us", "max_soc_c", "max_average_power_w", "min_far_end_erle_db", "max_aec_convergence_ms", "min_double_talk_near_si_sdr_db", "min_noise_si_sdr_improvement_db", "min_vad_f1", "min_soak_hours"}

def require_keys(obj, keys, where, errors):
    missing = sorted(k for k in keys if k not in obj)
    if missing: errors.append(f"{where}: missing {', '.join(missing)}")

def validate(record: dict, policy: dict | None = None) -> list[str]:
    errors: list[str] = []
    require_keys(record, {"sku", "status", "build", "platform", "audio_route", "performance", "acoustic", "soak", "artifacts"}, "record", errors)
    if errors: return errors
    status = record["status"]
    if status not in {"pending", "board-validated", "product-certified", "failed"}: errors.append(f"status: unsupported value {status!r}")
    require_keys(record["build"], {"commit", "version", "fingerprint", "compiler", "abi"}, "build", errors)
    require_keys(record["platform"], {"soc", "kernel", "governor", "cpuset"}, "platform", errors)
    require_keys(record["audio_route"], {"capture_device", "playback_device", "sample_rate_hz", "mic_channels"}, "audio_route", errors)
    require_keys(record["soak"], {"hours", "passed"}, "soak", errors)
    if record["audio_route"].get("sample_rate_hz") not in {8000,16000,24000,32000,48000}: errors.append("audio_route.sample_rate_hz: unsupported rate")
    if record["audio_route"].get("mic_channels") not in {1,2}: errors.append("audio_route.mic_channels: must be 1 or 2")
    if status != "product-certified": return errors
    if policy is None:
        errors.append("policy: product-certified requires an explicit --policy")
        return errors
    require_keys(policy, POLICY_REQUIRED, "policy", errors)
    if errors: return errors
    if record.get("policy") != policy.get("policy_id"):
        errors.append("policy: record policy id must match supplied policy")
    perf, acoustic, soak, artifacts = record["performance"], record["acoustic"], record["soak"], record["artifacts"]
    thermal = record.get("thermal_power", {})
    require_keys(perf, PRODUCT_PERF_REQUIRED, "performance", errors)
    require_keys(acoustic, PRODUCT_ACOUSTIC_REQUIRED, "acoustic", errors)
    require_keys(thermal, {"ambient_c", "max_soc_c", "average_power_w"}, "thermal_power", errors)
    require_keys(soak, {"hours", "passed", "xruns", "deadline_misses", "output_drop_events"}, "soak", errors)
    require_keys(artifacts, {"result_json", "benchmark_json", "sha256"}, "artifacts", errors)
    if errors: return errors
    zero_keys = {"deadline_misses", "xruns", "overruns", "input_full_events", "output_drop_events"}
    for key in zero_keys:
        if int(perf[key]) != 0: errors.append(f"performance.{key}: nominal gate requires 0")
    for key in {"xruns", "deadline_misses", "output_drop_events"}:
        if int(soak[key]) != 0: errors.append(f"soak.{key}: nominal gate requires 0")
    checks = [
        (float(perf["active_cpu_percent"]) <= float(policy["max_active_cpu_percent"]), "performance.active_cpu_percent"),
        (int(perf["rss_kib"]) <= int(policy["max_rss_kib"]), "performance.rss_kib"),
        (float(perf["p95_us"]) <= float(policy["max_p95_us"]), "performance.p95_us"),
        (float(perf["p99_us"]) <= float(policy["max_p99_us"]), "performance.p99_us"),
        (float(thermal["max_soc_c"]) <= float(policy["max_soc_c"]), "thermal_power.max_soc_c"),
        (float(thermal["average_power_w"]) <= float(policy["max_average_power_w"]), "thermal_power.average_power_w"),
        (float(acoustic["far_end_erle_db"]) >= float(policy["min_far_end_erle_db"]), "acoustic.far_end_erle_db"),
        (float(acoustic["aec_convergence_ms"]) <= float(policy["max_aec_convergence_ms"]), "acoustic.aec_convergence_ms"),
        (float(acoustic["double_talk_near_si_sdr_db"]) >= float(policy["min_double_talk_near_si_sdr_db"]), "acoustic.double_talk_near_si_sdr_db"),
        (float(acoustic["noise_si_sdr_improvement_db"]) >= float(policy["min_noise_si_sdr_improvement_db"]), "acoustic.noise_si_sdr_improvement_db"),
        (float(acoustic["vad_f1"]) >= float(policy["min_vad_f1"]), "acoustic.vad_f1"),
        (float(soak["hours"]) >= float(policy["min_soak_hours"]), "soak.hours"),
    ]
    for passed, name in checks:
        if not passed: errors.append(f"{name}: violates certification policy")
    if soak.get("passed") is not True: errors.append("soak.passed: product-certified requires true")
    if int(acoustic["cases_passed"]) != int(acoustic["cases_total"]): errors.append("acoustic: every certification corpus case must pass")
    if not re.fullmatch(r"[0-9a-fA-F]{64}", str(artifacts.get("sha256", ""))): errors.append("artifacts.sha256: must be exactly 64 hexadecimal characters")
    return errors

