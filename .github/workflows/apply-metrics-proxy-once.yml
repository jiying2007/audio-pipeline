name: Apply Metrics Proxy Once

on:
  push:
    branches: [codex/blind-resume-metrics-fix]
    paths:
      - '.github/workflows/apply-metrics-proxy-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/blind-resume-metrics-fix
          fetch-depth: 0
      - name: Patch blind qualification
        run: |
          set -euo pipefail
          python3 -m py_compile \
            .github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py \
            .github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py
          python3 .github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py --self-test
          python3 .github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py --self-test
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/research-candidate-blind-qualification.yml')
          t=p.read_text()
          anchor='''      - name: Build full public validation corpus\n'''
          step='''      - name: Create strict metrics JSON qualification proxy\n        run: |\n          set -euo pipefail\n          cat > candidate-out/candidate-processor-json <<'PYPROXY'\n          #!/usr/bin/env python3\n          import os, sys\n          helper = os.path.abspath('infra/.github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py')\n          processor = os.path.abspath('candidate-out/candidate-processor')\n          audit = os.path.abspath('candidate-out/metrics-jsonl-canonicalization.jsonl')\n          os.execv(sys.executable, [sys.executable, helper, '--processor', processor, '--audit', audit, '--', *sys.argv[1:]])\n          PYPROXY\n          chmod 700 candidate-out/candidate-processor-json\n          python3 infra/.github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py --self-test\n'''
          if t.count(anchor)!=1:
              raise SystemExit(f'build-corpus anchor count={t.count(anchor)}')
          if 'candidate-processor-json' in t:
              raise SystemExit('proxy already present')
          t=t.replace(anchor,step+anchor)
          old='--processor ../candidate-out/candidate-processor \\\n'
          new='--processor ../candidate-out/candidate-processor-json \\\n'
          if t.count(old)!=2:
              raise SystemExit(f'processor invocation count={t.count(old)}')
          t=t.replace(old,new)
          marker="              'prepare_full_validation.py',\n"
          if t.count(marker)!=1:
              raise SystemExit('contract marker anchor drift')
          t=t.replace(marker, marker+"              'metrics_jsonl_proxy.py', 'candidate-processor-json',\n")
          p.write_text(t)
          PY
          python3 .github/research/continuous-optimization/research_candidate_blind.py --self-test
          grep -F "candidate-processor-json" .github/workflows/research-candidate-blind-qualification.yml >/dev/null
      - name: Commit clean patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-metrics-proxy-once.yml
          git add .github/workflows/research-candidate-blind-qualification.yml \
            .github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py \
            .github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py
          git diff --cached --check
          git commit -m 'fix(validation): preserve blind evidence across non-finite telemetry'
          git rev-parse HEAD
          git push origin HEAD:codex/blind-resume-metrics-fix
