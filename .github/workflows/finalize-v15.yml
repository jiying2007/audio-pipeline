name: Finalize v1.5 candidate

on:
  push:
    branches: [feat/test-intelligence-v1.5.0]
    paths:
      - .github/workflows/finalize-v15.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Finalize docs digests and temporary scaffolding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          final_digest = 'sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c'
          old_digest = 'sha256:4106ce8c0aa63d87ad233d87a51d23b2098dc526e9604ae6fd9d08ec5c3069db'
          for path in Path('.github').rglob('*.yml'):
              text = path.read_text(encoding='utf-8')
              if old_digest in text:
                  path.write_text(text.replace(old_digest, final_digest), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Quality and release gates\n'
          section = (
              '## Test intelligence and HIL automation\n\n'
              'PR verification now uses a mandatory Fast Gate before expensive matrices expand. `scripts/ci_impact.py` conservatively selects affected composition/Arm/backend/performance domains; unknown/public/build/test-infrastructure changes expand to FULL, and every `main` push always runs full verification. Heavy ARM/QEMU/ALSA/static-analysis jobs use the reviewed GHCR toolchain image by immutable digest and share only `ccache` compiler objects, never test results or certification evidence.\n\n'
              'Nightly adds explicit flaky detection and revision-bound historical trend analysis. Acoustic validation failures preserve a self-contained reproducer artifact. Metamorphic/property contracts cover deterministic reset/replay, silence stability and topology invariants.\n\n'
              'Real-board HIL remains evidence-separated from hosted/QEMU CI. Trusted `[self-hosted, linux, audio-target]` runners use board-local metadata/preflight/cleanup and tiered 10 min / 1 h / 8 h / 24 h / 72 h soak. Scheduled and post-release HIL are disabled until repository variable `HIL_ENABLED=true`; untrusted public PR code is never automatically executed on product hardware. See `docs/TESTING.md` and `hil/README.md`.\n\n'
          )
          if section not in text:
              if marker not in text:
                  raise SystemExit('README quality marker not found')
              text = text.replace(marker, section + marker, 1)
          docs_marker = '- `docs/DEVELOPMENT.md` — contribution and hard-cut rules\n'
          testing_link = '- `docs/TESTING.md` — Fast/Full CI, impact routing, cache, failure, flaky/trend and HIL policy\n'
          if testing_link not in text:
              if docs_marker not in text:
                  raise SystemExit('README documentation marker not found')
              text = text.replace(docs_marker, testing_link + docs_marker, 1)
          readme.write_text(text, encoding='utf-8')

          readme_zh = Path('README.zh-CN.md')
          text = readme_zh.read_text(encoding='utf-8')
          marker = '## Quality / Release Gate\n'
          section = (
              '## 测试智能化与 HIL 自动化\n\n'
              'PR 先通过强制 Fast Gate，再展开高成本矩阵。`scripts/ci_impact.py` 按显式依赖保守选择 composition/Arm/backend/performance 域；未知路径、公开头文件、构建/测试基础设施改动直接回退 FULL，所有 `main` push 无条件完整 Verify。ARM/QEMU/ALSA/static-analysis 等重任务统一使用按 immutable digest 固定的 GHCR toolchain image，只复用 `ccache` 编译对象，不缓存测试结论或认证 evidence。\n\n'
              'Nightly 增加显式 flaky 检测和 revision-bound 历史趋势分析；声学 validation 失败会保留可一键重放的 reproducer artifact；metamorphic/property contracts 覆盖 reset deterministic replay、silence 稳定性和拓扑不变量。\n\n'
              '真实板 HIL 与 hosted/QEMU 证据严格分离。可信 `[self-hosted, linux, audio-target]` runner 使用板卡本地 metadata/preflight/cleanup，并支持 10 分钟 / 1 小时 / 8 小时 / 24 小时 / 72 小时分层 soak。只有仓库变量 `HIL_ENABLED=true` 后才启用定时和 Release 后 HIL；public 仓库的外部 PR 不会自动在产品板执行。详见 `docs/TESTING.zh-CN.md` 和 `hil/README.md`。\n\n'
          )
          if section not in text:
              if marker not in text:
                  raise SystemExit('Chinese README quality marker not found')
              text = text.replace(marker, section + marker, 1)
          docs_marker = '- `docs/DEVELOPMENT.md`：开发与 hard-cut 规范\n'
          testing_link = '- `docs/TESTING.zh-CN.md`：Fast/Full CI、impact、cache、失败分类、flaky/trend 与 HIL 策略\n'
          if testing_link not in text:
              if docs_marker not in text:
                  raise SystemExit('Chinese README documentation marker not found')
              text = text.replace(docs_marker, testing_link + docs_marker, 1)
          readme_zh.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          release = (
              '# 1.5.0\n\n'
              '- Rework PR verification into mandatory Fast Gate -> impact-aware Full Gate while forcing every `main` push through the complete release verification graph.\n'
              '- Add conservative `ci_impact.py` dependency routing with unknown/public/build/test-infrastructure changes expanding to FULL, plus dynamic composition, Arm, backend, performance, ALSA, ABI and extended matrices.\n'
              '- Replace repeated ARM/QEMU/ALSA/static-analysis package installation with a smoke-tested GHCR toolchain image pinned by immutable digest; add content-addressed `ccache` reuse without caching test or certification results.\n'
              '- Add stable CI failure taxonomy, acoustic failure reproducer bundles, Nightly 100-run flaky sentinel and median/MAD historical CPU/latency/acoustic trend gates.\n'
              '- Add metamorphic/property DSP contracts for deterministic reset/replay, silence stability and topology invariants.\n'
              '- Add real-route accelerated fault injection for codec/PCM restart, render gaps and CPU stalls while keeping nominal certification evidence fault-free.\n'
              '- Add HIL board metadata, preflight, cleanup and SHA-256 evidence sealing with `INFRA_FAILURE` separated from product/HIL failures.\n'
              '- Add tiered trusted-hardware soak: accelerated PR 10 min, Nightly 1 h, Release 8 h, Weekly 24 h and Certification 72 h. Scheduled/post-release HIL is explicitly gated by `HIL_ENABLED=true`, and untrusted public PR code never auto-runs on self-hosted product boards.\n'
              '- Add permanent CI toolchain-image rebuild workflow and formal English/Chinese testing/HIL operations documentation.\n'
              '- No hosted, cross-build or QEMU result is promoted to a real product-board certification claim; shipping certification still requires real target evidence.\n\n'
          )
          if not text.startswith('# 1.5.0\n'):
              changelog.write_text(release + text, encoding='utf-8')
          PY
          git rm .github/workflows/apply-v15-test-intelligence.yml
          git rm .github/workflows/ci-image-bootstrap.yml
          git rm .github/workflows/finalize-v15.yml
          python3 -m py_compile scripts/*.py tools/*.py validation/tools/*.py
          python3 scripts/ci_impact.py --self-test
          python3 scripts/ci_failure.py --self-test
          python3 scripts/flaky_guard.py --self-test
          python3 scripts/test_history.py --self-test
          python3 scripts/validation_reproducer.py --self-test
          python3 tools/hil_board.py --self-test
          python3 tools/target_evidence.py --self-test
          if grep -R '4106ce8c0aa63d87ad233d87a51d23b2098dc526e9604ae6fd9d08ec5c3069db' .github --include='*.yml'; then
            echo 'stale CI image digest remains' >&2
            exit 3
          fi
          git diff --check
      - name: Commit final v1.5 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'release: finalize v1.5 test intelligence and HIL automation'
          git push origin HEAD:feat/test-intelligence-v1.5.0
