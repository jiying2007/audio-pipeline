name: I006 AGC Root-Cause Differential

on:
  pull_request:
    paths:
      - 'docs/program/iterations/I006-root-cause-differential.json'
      - 'tests/validation/i006_agc_root_cause_probe.c'
      - 'tests/validation/i006_agc_root_cause_differential.py'
      - '.github/workflows/i006-agc-root-cause-differential.yml'

permissions:
  contents: read

concurrency:
  group: i006-agc-root-cause-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 54a6c60b17d6a910843b5e23e6eb7f2976953cb5
      PYTHONPATH: tests/validation:validation/tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate frozen candidate-zero root-cause contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i006_agc_root_cause_differential.py
          PYTHONPATH=tests/validation:validation/tools \
            python3 tests/validation/i006_agc_root_cause_differential.py --self-test
          python3 -m json.tool docs/program/iterations/I006-root-cause-differential.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/program/iterations/I006-root-cause-differential.json').read_text())
          assert c['schema_version'] == 1 and c['iteration_id'] == 'I006'
          assert c['phase'] == 'root-cause-differential'
          assert c['root_cause_id'] == 'agc-noise-floor-and-activity-control-dependency'
          assert c['base_sha'] == '54a6c60b17d6a910843b5e23e6eb7f2976953cb5'
          assert c['source_authority'] == 'exposed-regression-root-cause-context-only'
          assert c['candidate_limit'] == 0 and c['confirmation_limit'] == 0
          assert c['promotion_allowed'] is False and c['shipping_source_change_allowed'] is False
          assert c['seeds'] == [16107, 26107, 36107]
          assert c['scenarios'] == [
              'noise-floor-low', 'noise-floor-step',
              'near-far-doubletalk', 'near-far-weak-near']
          assert all(value is False for value in c['authority'].values())
          assert c['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(docs/program/iterations/I006-root-cause-differential\.json|tests/validation/i006_agc_root_cause_probe\.c|tests/validation/i006_agc_root_cause_differential\.py|\.github/workflows/i006-agc-root-cause-differential\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          for path in \
            docs/program/iterations/I006-root-cause-differential.json \
            tests/validation/i006_agc_root_cause_probe.c \
            tests/validation/i006_agc_root_cause_differential.py \
            .github/workflows/i006-agc-root-cause-differential.yml; do
            printf '%s\n' "$changed" | grep -Fx "$path"
          done

      - name: Prepare exact reviewed-main worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exact-base
          git worktree add --detach exact-base "$BASE_SHA"
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p exact-base/docs/program/iterations exact-base/tests/validation
          cp docs/program/iterations/I006-root-cause-differential.json \
             exact-base/docs/program/iterations/I006-root-cause-differential.json
          cp tests/validation/i006_agc_root_cause_probe.c \
             exact-base/tests/validation/i006_agc_root_cause_probe.c
          cp tests/validation/i006_agc_root_cause_differential.py \
             exact-base/tests/validation/i006_agc_root_cause_differential.py
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"

      - name: Execute exact-main candidate-zero root-cause differential
        working-directory: exact-base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf i006-root-cause-evidence
          PYTHONPATH=tests/validation:validation/tools \
          python3 tests/validation/i006_agc_root_cause_differential.py \
            --contract docs/program/iterations/I006-root-cause-differential.json \
            --baseline-contract docs/program/iterations/I006-baseline.json \
            --output i006-root-cause-evidence \
            | tee i006-root-cause-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('i006-root-cause-evidence/root-cause-result.json').read_text())
          assert r['schema_version'] == 1 and r['iteration_id'] == 'I006'
          assert r['phase'] == 'root-cause-differential'
          assert r['source_sha'] == '54a6c60b17d6a910843b5e23e6eb7f2976953cb5'
          assert r['authority'] == 'candidate-zero-exposed-regression-root-cause-only'
          assert r['candidate_limit'] == 0 and r['confirmation_limit'] == 0
          assert r['candidate_search_performed'] is False
          assert r['shipping_source_changed'] is False
          assert r['parameter_tuning_performed'] is False
          assert r['promotion_allowed'] is False
          assert r['decision'] == 'ROOT_CAUSE_DIFFERENTIAL_REVIEW_REQUIRED'
          assert r['candidate_decision'] == 'NOT_AN_ACOUSTIC_CANDIDATE'
          assert len(r['cases']) == 12
          assert r['aggregate']['noise_floor_cases'] == 6
          assert r['aggregate']['double_talk_cases'] == 6
          assert r['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY
          cp ../docs/program/iterations/I006-root-cause-differential.json \
             i006-root-cause-evidence/contract.json
          cp ../tests/validation/i006_agc_root_cause_probe.c \
             i006-root-cause-evidence/probe.c
          cp ../tests/validation/i006_agc_root_cause_differential.py \
             i006-root-cause-evidence/evaluator.py
          printf '%s\n' "$BASE_SHA" > i006-root-cause-evidence/base-sha.txt
          git -C .. rev-parse HEAD > i006-root-cause-evidence/research-head.txt
          cp i006-root-cause-summary.json i006-root-cause-evidence/execution-summary.json
          find i006-root-cause-evidence -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > i006-root-cause-evidence/SHA256SUMS

      - name: Publish root-cause summary
        if: always()
        shell: bash
        run: |
          result='exact-base/i006-root-cause-evidence/root-cause-result.json'
          if test -f "$result"; then
            RESULT="$result" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT']).read_text())
          print('## I006 candidate-zero AGC root-cause differential')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Exact reviewed main: `{r['source_sha']}`")
          print(f"- Noise-floor max-gain hypothesis confirmed: `{r['aggregate']['noise_floor_max_gain_hypothesis_confirmed']}/6`")
          print(f"- Double-talk classifications: `{r['aggregate']['double_talk_classification_distribution']}`")
          print('- Candidate/confirmation budget consumed: `0/0`.')
          print('- Shipping source/parameters changed: `false/false`.')
          print('- Product qualification: `DEFERRED_BY_SCOPE`.')
          PY
          fi

      - name: Upload I006 root-cause evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i006-agc-root-cause-${{ github.run_id }}
          path: exact-base/i006-root-cause-evidence/
          retention-days: 90
          if-no-files-found: error
