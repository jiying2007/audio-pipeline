all:
  vars:
    audio_pipeline_repo_url: "https://github.com/jiying2007/audio-pipeline"
    github_runner_version: "2.336.0"
    github_runner_arch: "x64"
    github_runner_sha256: "04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d"
    # Default is ordinary-user mode: no sudo/become and no /opt,/var,/etc writes.
    lab_system_mode: false
  children:
    audio_validation:
      hosts:
        validation01:
          ansible_host: 192.0.2.10
          ansible_user: ubuntu
          github_runner_name: audio-validation-01
          github_runner_labels: "audio-validation"
    audio_target:
      hosts:
        target01:
          ansible_host: 192.0.2.20
          ansible_user: ubuntu
          github_runner_name: audio-target-ssc305-01
          github_runner_labels: "audio-target"
          audio_target_board_manifest_src: ""
    audio_builder:
      hosts:
        builder01:
          ansible_host: 192.0.2.30
          ansible_user: ubuntu
          github_runner_name: audio-builder-ssc305-01
          github_runner_labels: "audio-builder"
          # Product-specific shipping assets stay operator-managed and outside Git.
          # Replace every placeholder with an absolute path readable by this user.
          audio_builder_shipping_cc: "/path/to/shipping-toolchain/bin/arm-linux-gnueabihf-gcc"
          audio_builder_shipping_sysroot: "/path/to/shipping-toolchain/sysroot"
          audio_builder_shipping_toolchain_root: "/path/to/shipping-toolchain"
    certification_archive:
      hosts:
        archive01:
          ansible_host: 192.0.2.40
          ansible_user: ubuntu
          github_runner_name: certification-archive-01
          github_runner_labels: "certification-archive"
          # Must match the Product Certification immutable lifecycle backend path.
          certification_archive_command: "/usr/local/bin/audio-pipeline-cert-archive"
# Dedicated system mode is opt-in per host/group:
# lab_system_mode: true
# lab_service_user: audio-ci   # or audio-hil
# validation_data_root: /opt/audio-validation-extended
