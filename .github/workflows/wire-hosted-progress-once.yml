name: Wire Hosted Progress Once

on:
  push:
    branches:
      - codex/github-hosted-blind
    paths:
      - .github/workflows/wire-hosted-progress-once.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/github-hosted-blind
          fetch-depth: 0
      - name: Wire compact progress evidence into formal blind qualification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/research-candidate-blind-qualification.yml')
          text = path.read_text(encoding='utf-8')
          anchor = '            --aec-limit "$AEC_LIMIT" \\\n            --output candidate-out/github-hosted-cache.json'
          replacement = '            --aec-limit "$AEC_LIMIT" \\\n            --progress-output candidate-out/github-hosted-progress.json \\\n            --output candidate-out/github-hosted-cache.json'
          if anchor not in text:
              raise SystemExit('formal hosted bootstrap short anchor not found')
          text = text.replace(anchor, replacement, 1)
          marker = "              'trap cleanup EXIT', 'v >= 100 and b >= 16',\n"
          if marker not in text:
              raise SystemExit('contract marker insertion point not found')
          text = text.replace(marker, marker + "              'candidate-out/github-hosted-progress.json',\n", 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/wire-hosted-progress-once.yml
          git diff --check
      - name: Commit wiring and retire one-shot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(validation): retain hosted bootstrap progress evidence'
          git push origin HEAD:codex/github-hosted-blind
