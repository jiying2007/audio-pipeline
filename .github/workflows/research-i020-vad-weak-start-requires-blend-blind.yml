name: Research I020 Source-Patch Blind Qualification
run-name: "i020-source-patch-blind / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json'
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.patch'
      - '.github/research/continuous-optimization/research_code_candidate_blind.py'
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1-result.json'
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1-blind-review.json'
      - 'tests/validation/test_i020_code_candidate_blind_one_shot.py'
      - 'tests/validation/test_i020_blind_retirement.py'
      - 'tests/validation/data/i020-consumed-blind-workflow.yml'
      - 'tests/validation/data/i020-consumed-blind-resume-workflow.yml'
      - 'validation/research/evidence/i020-blind-baseline-invalid-36304120808-36324803945/**'
      - '.github/workflows/research-i020-vad-weak-start-requires-blend-blind.yml'
      - '.github/workflows/research-i020-vad-weak-start-requires-blend-blind-resume.yml'
      - 'validation/authority.json'
      - 'validation/datasets.lock.json'
      - 'validation/policies/validation-full-partition.json'
      - 'validation/policies/validation-full-blind.json'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate retired I020 blind review contract
        run: |
          set -euo pipefail
          python3 tests/validation/test_i020_blind_retirement.py
          python3 .github/research/continuous-optimization/research_code_candidate_blind.py --self-test
          python3 tests/validation/test_i020_code_candidate_blind_one_shot.py
          python3 .github/research/continuous-optimization/research_code_candidate_blind.py             --manifest .github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json             --registry .github/research/continuous-optimization/dataset-registry.json             --repo-root . --check
