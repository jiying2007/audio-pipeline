name: Research I025 NS Upstream Disagreement Noise Source Decomposition v1
run-name: "i025-ns-upstream-disagreement-noise / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i025-ns-upstream-disagreement-noise-source-decomposition-v1.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_decomposition.py'
      - 'tests/validation/test_i025_one_shot_guard.py'
      - '.github/workflows/research-i025-ns-upstream-disagreement-noise-source-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i025-ns-upstream-disagreement-noise-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i025-ns-upstream-disagreement-noise-source-decomposition-v1.json
  DEV_ROOT: /tmp/audio-pipeline-i025-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I025 candidate-zero upstream-source contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i025_ns_upstream_disagreement_noise_source_decomposition.py
          python3 tests/validation/i025_ns_upstream_disagreement_noise_source_decomposition.py --self-test
          python3 tests/validation/test_i025_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i025-ns-upstream-disagreement-noise-source-decomposition-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='RESEARCH_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          seeds=c['fresh_diagnostic_authority']['seeds']
          assert len(seeds)==3 and len(set(seeds))==3
          assert all(type(seed) is int and seed > 0 for seed in seeds)
          assert c['fresh_diagnostic_authority']['diagnostic_execution_limit']==1
          assert c['fresh_diagnostic_authority']['candidate_limit']==0
          assert c['fresh_diagnostic_authority']['confirmation_limit']==0
          assert c['dataset_authority']['role']=='development'
          assert c['dataset_authority']['validation_holdout_consumed'] is False
          assert c['comparisons']['feature_selection'] is False
          assert c['comparisons']['threshold_search'] is False
          assert c['comparisons']['component_reweighting'] is False
          assert c['comparisons']['mapping_selection'] is False
          assert c['diagnostic_feature_registry']['temporal_context']['future_frames_used'] is False
          assert c['diagnostic_feature_registry']['temporal_context']['learned_weights'] is False
          assert all(value is False for value in c['authority_boundary'].values())

          i024=Path(c['predecessors']['i024_closure'])
          prior=json.loads(i024.read_text())
          assert prior['status']==c['predecessors']['required_i024_status']
          assert prior['reviewed_decision']==c['predecessors']['required_i024_reviewed_decision']
          i014=Path(c['predecessors']['i014_context'])
          prior014=json.loads(i014.read_text())
          assert prior014['reviewed_decision']==c['predecessors']['required_i014_reviewed_decision']

          def blob(p):
              return subprocess.check_output(['git','rev-parse','HEAD:'+str(p)],text=True).strip()

          assert blob(i024)==c['predecessors']['i024_closure_blob_sha']
          assert blob(i014)==c['predecessors']['i014_context_blob_sha']
          assert blob(Path(c['dataset_authority']['lock_path']))==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(Path(c['dataset_authority']['builder_path']))==c['dataset_authority']['builder_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['probe_path']))==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['evaluator_path']))==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']

          for seed in seeds:
              pattern=rf'(^|[^0-9]){seed}([^0-9]|$)'
              result=subprocess.run(
                  ['git','grep','-n','-E',pattern,'--','.github','tests','validation','docs'],
                  stdout=subprocess.PIPE,text=True,check=False)
              assert result.returncode in (0,1)
              matches=[
                  line for line in result.stdout.splitlines()
                  if line and line.split(':',1)[0] != str(path)
              ]
              assert not matches, (
                  f'I025 seed is not fresh: {seed}\n'+'\n'.join(matches))
          PY
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i025-ns-upstream-source-contract
      - name: Compile I025 dual-mirror probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i025-contract             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i025-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i025-contract/generated             tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c             build-i025-contract/libaudio_pipeline.a -lm             -o build-i025-contract/i025-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I025 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i025-ns-upstream-disagreement-noise-source-decomposition-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I025 diagnostic requires first-attempt trusted main dispatch')

          def pages(endpoint):
              raw=subprocess.check_output(['gh','api','--paginate','--slurp',endpoint],text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value

          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I025 run not visible; fail closed')

          consuming={
              'Materialize fresh public-development-v3 partitions',
              'Evaluate candidate-zero upstream source decomposition',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts < 1:
                  raise SystemExit('invalid prior I025 attempt count')
              for run_attempt in range(1,attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if step.get('name') in consuming and step.get('conclusion') != 'skipped':
                                  raise SystemExit(
                                      f'I025 one-shot authority already consumed by run {run_id}')
          print('I025 one-shot authority: fresh')
          PY
      - name: Bind frozen upstream inputs and unchanged shipping source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.loads(Path('.github/research/continuous-optimization/development-v4/i025-ns-upstream-disagreement-noise-source-decomposition-v1.json').read_text())
          def blob(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          assert blob(c['predecessors']['i024_closure'])==c['predecessors']['i024_closure_blob_sha']
          assert blob(c['predecessors']['i014_context'])==c['predecessors']['i014_context_blob_sha']
          assert blob(c['dataset_authority']['lock_path'])==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(c['dataset_authority']['builder_path'])==c['dataset_authority']['builder_git_blob_sha']
          assert blob(c['diagnostic_inputs']['probe_path'])==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(c['diagnostic_inputs']['evaluator_path'])==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']
          PY
          SOURCE_BASE="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["source_base_sha"])')"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD --             src/enhance/ap_noise_tracker.c             src/enhance/ap_noise_tracker.h             src/enhance/ap_ns.c             src/enhance/ap_vad.c             src/modules/ap_vad_module.c             src/modules/ap_ns_module.c             include/audio_pipeline/audio_modules.h             src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i025-ns-upstream-source
      - name: Build exact shipping source and I025 probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i025             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i025 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i025/generated             tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c             build-i025/libaudio_pipeline.a -lm             -o build-i025/i025-probe
      - name: Materialize fresh public-development-v3 partitions
        run: |
          set -euo pipefail
          LOCK="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["lock_path"])')"
          BUILDER="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["builder_path"])')"
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py             --lock "$LOCK" --root "$DEV_ROOT"             --output /tmp/i025-development-v3-materialization.json
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["seeds"])'); do
            python3 "$BUILDER"               --lock "$LOCK"               --materialization /tmp/i025-development-v3-materialization.json               --data-root "$DEV_ROOT"               --output "/tmp/i025-public-dev-$seed"               --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
          done
      - name: Evaluate candidate-zero upstream source decomposition
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i025-out
          mkdir -p i025-out/evidence
          corpus_args=()
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["seeds"])'); do
            corpus_args+=(--corpus "/tmp/i025-public-dev-$seed/corpus.json")
          done
          set +e
          python3 tests/validation/i025_ns_upstream_disagreement_noise_source_decomposition.py             --probe build-i025/i025-probe             --contract "$CONTRACT"             "${corpus_args[@]}"             --output i025-out/evidence/result.json             > i025-out/evidence/evaluate.stdout             2> i025-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > i025-out/evidence/evaluate.exit-code
          cp "$CONTRACT" i025-out/evidence/contract.json
          cp /tmp/i025-development-v3-materialization.json i025-out/evidence/materialization.json
          sha256sum build-i025/i025-probe | awk '{print $1}' > i025-out/evidence/probe.sha256
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["seeds"])'); do
            sha256sum "/tmp/i025-public-dev-$seed/corpus.json"
          done > i025-out/evidence/corpora.sha256
          printf 'main_sha=%s\n' "$GITHUB_SHA" > i025-out/evidence/build-info.txt
          if test -f i025-out/evidence/result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i025-out/evidence/result.json').read_text())
          source={}
          cls={}
          for name,value in r['noise_disagreement_vs_noise_reference'].items():
              source[name]={
                  'signed_auc':value['signed_auc'],
                  'separability_auc':value['separability_auc'],
                  'direction':value['direction'],
                  'cross_domain_floor':r['cross_domain_noise_source']['numeric_features'][name]['separability_auc_min'],
                  'cross_domain_median':r['cross_domain_noise_source']['numeric_features'][name]['separability_auc_median'],
              }
          for name,value in r['speech_disagreement_vs_noise_disagreement'].items():
              cls[name]={
                  'signed_auc':value['signed_auc'],
                  'separability_auc':value['separability_auc'],
                  'direction':value['direction'],
              }
          Path('i025-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_seeds':r['fresh_diagnostic_seeds'],
                  'shipping_mirror':r['shipping_mirror'],
                  'population_counts':r['population_counts'],
                  'noise_source_features':source,
                  'disagreement_class_features':cls,
                  'interpretation_boundary':r['interpretation_boundary'],
              },indent=2,sort_keys=True)+'\n')
          PY
          fi
          (
            cd i025-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort |               while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          exit "$rc"
      - name: Enforce diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i025-out/evidence/result.json').read_text())
          assert r['decision'] in {
              'NS_UPSTREAM_DISAGREEMENT_NOISE_SOURCE_DECOMPOSED_REVIEW_REQUIRED',
              'NS_UPSTREAM_DISAGREEMENT_NOISE_NOT_REPRODUCED_REVIEW_REQUIRED',
          }
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['shipping_mirror']['vad_active_mismatch_frames']==0
          assert r['interpretation_boundary']['no_component_reweighting'] is True
          assert r['interpretation_boundary']['no_mapping_selection'] is True
          assert r['interpretation_boundary']['no_threshold_search'] is True
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i025-out/evidence/summary.json; then
            cat i025-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I025 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i025-ns-upstream-disagreement-noise-${{ github.run_id }}
          path: i025-out/
          retention-days: 90
          if-no-files-found: error
