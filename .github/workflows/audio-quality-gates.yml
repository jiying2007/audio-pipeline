name: Audio Quality Gates

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: audio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandlimited-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure bandlimited default
        run: >-
          cmake -S . -B build-audio -DCMAKE_BUILD_TYPE=Release
          -DAP_RESAMPLER_MODE=BANDLIMITED -DAP_ENABLE_LINUX_RUNTIME=OFF
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build quality contracts
        run: cmake --build build-audio --parallel
      - name: Run resampler and acoustic-path contracts
        run: |
          ctest --test-dir build-audio --output-on-failure -R 'ap_resampler_tests|ap_contract_tests|ap_drift_res_tests'
      - name: Verify acoustic evaluation harness
        run: python3 eval/run_eval.py --self-test
      - name: Verify certification evidence validator
        run: python3 certification/validate_record.py --self-test

  validation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate validation tooling and pinned public source contract
        run: |
          python3 -m py_compile validation/tools/*.py
          python3 validation/tools/dataset_lock.py self-test
          python3 validation/tools/dataset_lock.py validate --lock validation/datasets.lock.json
          python3 validation/tools/run_validation.py --self-test
      - name: Configure offline validation processor
        run: >-
          cmake -S . -B build-validation-smoke -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build offline validation processor
        run: cmake --build build-validation-smoke --target ap_process_pcm --parallel
      - name: Build deterministic validation corpus twice
        run: |
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-validation-a --seed 1307
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-validation-b --seed 1307
          diff -u /tmp/ap-validation-a/corpus.json /tmp/ap-validation-b/corpus.json
          (cd /tmp/ap-validation-a && find cases -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/a.sha256
          (cd /tmp/ap-validation-b && find cases -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/b.sha256
          diff -u /tmp/a.sha256 /tmp/b.sha256
      - name: Enforce self-validation regression policy
        run: |
          python3 validation/tools/run_validation.py \
            --corpus /tmp/ap-validation-a/corpus.json \
            --policy validation/policies/validation-smoke.json \
            --dataset-lock validation/datasets.lock.json \
            --processor ./build-validation-smoke/ap_process_pcm \
            --output /tmp/ap-validation-a/report.json \
            --evidence-manifest /tmp/ap-validation-a/evidence-manifest.json \
            --enforce
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/ap-validation-a/report.json').read_text())
          assert report['tier'] == 'regression'
          assert report['validation_result'] == 'PASS'
          assert report['summary']['cases'] >= 6
          print(json.dumps(report['summary'], sort_keys=True))
          PY

  diagnostics-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure realtime diagnostics build
        run: >-
          cmake -S . -B build-diag -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build runtime and offline processor
        run: cmake --build build-diag --parallel
      - name: Build deterministic APD fixture generator
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            tests/generate_diag_dump.c \
            -Iinclude -Ibuild-diag/generated \
            build-diag/libaudio_pipeline_runtime.a build-diag/libaudio_pipeline.a \
            -lm -pthread -o /tmp/ap_diag_dump_fixture
      - name: Generate inspect extract and replay dump
        run: |
          /tmp/ap_diag_dump_fixture /tmp/test.apd
          python3 tools/apdump.py info /tmp/test.apd > /tmp/dump-info.json
          python3 tools/apdump.py extract /tmp/test.apd --output-dir /tmp/apd-extract
          python3 tools/apreplay.py /tmp/test.apd \
            --processor ./build-diag/ap_process_pcm --require-bit-exact
      - name: Run runtime continuity and diagnostics contracts
        run: ctest --test-dir build-diag --output-on-failure -R 'ap_runtime_tests'

  fast-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure explicit FAST fallback
        run: >-
          cmake -S . -B build-fast -DCMAKE_BUILD_TYPE=Release
          -DAP_RESAMPLER_MODE=FAST -DAP_ENABLE_LINUX_RUNTIME=OFF
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build and run fixed-ratio regression contracts
        run: |
          cmake --build build-fast --parallel
          ctest --test-dir build-fast --output-on-failure -R 'ap_resampler_tests|ap_contract_tests'

  timestamp-route-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure full sync/AEC graph
        run: cmake -S . -B build-sync -DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build and validate synchronization/reset semantics
        run: |
          cmake --build build-sync --parallel
          ctest --test-dir build-sync --output-on-failure -R 'ap_contract_tests|ap_realtime_tests|ap_drift_res_tests'
