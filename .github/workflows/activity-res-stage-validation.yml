name: Activity RES Stage Validation

on:
  pull_request:
    paths:
      - 'src/activity/**'
      - 'src/enhance/ap_res.c'
      - 'src/enhance/ap_ns.c'
      - 'src/enhance/ap_enhance.h'
      - 'tests/validation/activity_res_probe.c'
      - 'tests/validation/activity_res_handoff_probe.c'
      - 'tests/validation/frequency_res_handoff_probe.c'
      - '.github/workflows/activity-res-stage-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Run ./.github/actions/setup-ccache
        uses: ./.github/actions/setup-ccache
        with:
          namespace: activity-res-stage-validation

      - name: Build strict standalone Activity RES probes
        shell: bash
        run: |
          set -euo pipefail
          common=(
            -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror
            -DAP_BUILD_STAGE_RES=1 -Isrc
            src/activity/ap_activity.c src/enhance/ap_res.c -lm
          )
          cc tests/validation/activity_res_probe.c "${common[@]}" -o activity-res-probe
          cc tests/validation/activity_res_handoff_probe.c "${common[@]}" -o activity-res-handoff-probe

          cmake -S . -B build-frequency-res \
            -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_PIPELINE=OFF \
            -DAP_MODULES=NS,RES \
            -DAP_BUILD_TESTS=OFF \
            -DAP_BUILD_BENCH=OFF \
            -DAP_BUILD_EXAMPLES=OFF \
            -DAP_ENABLE_LINUX_RUNTIME=OFF \
            -DAP_NS_ESTIMATOR=EMA \
            -DAP_STRICT_WARNINGS=ON
          cmake --build build-frequency-res --target audio_pipeline --parallel
          cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_NS_EMA=1 \
            -Ibuild-frequency-res/generated -Isrc \
            tests/validation/frequency_res_handoff_probe.c \
            build-frequency-res/libaudio_pipeline.a -lm \
            -o frequency-res-handoff-probe

      - name: Run all independent Activity RES partitions
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p activity-res-out
          failed=0
          for seed in 1307 2307 3307; do
            if ! ./activity-res-probe "$seed" | tee "activity-res-out/${seed}.txt"; then
              failed=1
            fi
            if ! ./activity-res-handoff-probe "$seed" | tee "activity-res-out/${seed}-handoff.txt"; then
              failed=1
            fi
            if ! ./frequency-res-handoff-probe "$seed" | tee "activity-res-out/${seed}-frequency-res.txt"; then
              failed=1
            fi
          done
          {
            echo '## Activity / DTD / RES stage evidence'
            echo '```text'
            cat activity-res-out/*.txt
            echo '```'
            echo
            echo 'The HANDOFF and FREQ_RES_HANDOFF recovery metrics are discovery evidence: they quantify near-end onset preservation before any product tuning decision.'
            echo 'All seeds run even after an earlier failure; no product defaults or acceptance gates are changed by this regression-only workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Upload Activity RES evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: activity-res-stage-validation-${{ github.run_id }}
          path: activity-res-out/
          if-no-files-found: warn
          retention-days: 30
