name: Port SSC305 Hardening V2 Once

on:
  push:
    branches: [feat/v2-hard-cut-cleanup]

permissions:
  contents: write

concurrency:
  group: port-ssc305-hardening-v2-once
  cancel-in-progress: false

jobs:
  port:
    if: "${{ github.event.head_commit.message != 'fix!: integrate validated SSC305 realtime hardening into v2' }}"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: feat/v2-hard-cut-cleanup
      - name: Port reviewed hardening into current v2 surface
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          git fetch origin main codex/ssc305-audio-hardening-r1
          git diff origin/main...origin/codex/ssc305-audio-hardening-r1 -- \
            CMakeLists.txt CMakePresets.json \
            include/audio_pipeline/audio_diag.h include/audio_pipeline/audio_runtime.h \
            scripts/check-architecture.sh \
            src/core/ap_pipeline.c src/core/ap_pipeline_query.c \
            src/sync/ap_sync.c src/sync/ap_sync.h \
            tests/test_drift_res.c tests/test_metamorphic.c > /tmp/ssc305-hardening.patch
          test -s /tmp/ssc305-hardening.patch
          git apply --3way /tmp/ssc305-hardening.patch

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime = 'src/platform/linux/ap_runtime.c'
          replace_once(runtime,
              '    uint8_t last_aec_converged;\n    uint8_t uses_render;\n};',
              '    uint8_t last_aec_converged;\n    uint8_t uses_render;\n    uint8_t memory_locked;\n};')
          replace_once(runtime,
              '''    } else {\n        runtime_emit_event(runtime,\n                           AP_EVENT_QUALITY_RECOVERED,\n                           AP_EVENT_INFO,\n                           (int32_t)old,\n                           (int32_t)next,\n                           1u);\n    }\n}\n\nstatic void adjust_quality''',
              '''    } else if (next < old) {\n        runtime_emit_event(runtime,\n                           AP_EVENT_QUALITY_DEGRADED,\n                           next == AP_QUALITY_SAFE ? AP_EVENT_ERROR : AP_EVENT_WARN,\n                           (int32_t)old,\n                           (int32_t)next,\n                           1u);\n    } else {\n        runtime_emit_event(runtime,\n                           AP_EVENT_QUALITY_RECOVERED,\n                           AP_EVENT_INFO,\n                           (int32_t)old,\n                           (int32_t)next,\n                           1u);\n    }\n}\n\nstatic void adjust_quality''')
          replace_once(runtime,
              'static void runtime_setup_thread(ap_runtime_t *runtime) {',
              '''static int runtime_lock_state_memory(ap_runtime_t *runtime) {\n    int error;\n    if (mlock(runtime, sizeof(*runtime)) != 0) return errno;\n    if (mlock(runtime->pipeline, ap_pipeline_state_size()) != 0) {\n        error = errno;\n        (void)munlock(runtime, sizeof(*runtime));\n        return error;\n    }\n    runtime->memory_locked = 1u;\n    return 0;\n}\n\nstatic void runtime_unlock_state_memory(ap_runtime_t *runtime) {\n    if (!runtime->memory_locked) return;\n    (void)munlock(runtime->pipeline, ap_pipeline_state_size());\n    (void)munlock(runtime, sizeof(*runtime));\n    runtime->memory_locked = 0u;\n}\n\nstatic void runtime_setup_thread(ap_runtime_t *runtime) {''')
          replace_once(runtime,
              '''    if (runtime->options.lock_memory && mlockall(MCL_CURRENT | MCL_FUTURE) != 0) {\n        counter64_add(&runtime->memory_lock_failures, 1u);\n        runtime_emit_event(runtime,\n                           AP_EVENT_RT_MLOCK_FAILED,\n                           AP_EVENT_WARN,\n                           errno,\n                           0,\n                           1u);\n    }''',
              '''    if (runtime->options.lock_memory) {\n        const int lock_error = runtime_lock_state_memory(runtime);\n        if (lock_error != 0) {\n            counter64_add(&runtime->memory_lock_failures, 1u);\n            runtime_emit_event(runtime,\n                               AP_EVENT_RT_MLOCK_FAILED,\n                               AP_EVENT_WARN,\n                               lock_error,\n                               0,\n                               1u);\n        }\n    }''')
          replace_once(runtime,
              '''        (void)sem_post(&runtime->wake);\n        (void)pthread_join(runtime->thread, NULL);\n    }\n}\n\nvoid ap_runtime_deinit''',
              '''        (void)sem_post(&runtime->wake);\n        (void)pthread_join(runtime->thread, NULL);\n        runtime_unlock_state_memory(runtime);\n    }\n}\n\nvoid ap_runtime_deinit''')

          # Make the BF direction policy an explicit generated/build-info capability.
          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          fast_block = '''if(AP_ENABLE_FAST_MATH)\n    set(AP_HAVE_FAST_MATH 1)\nelse()\n    set(AP_HAVE_FAST_MATH 0)\nendif()\n'''
          if 'set(AP_HAVE_BF_DIRECTION_TRACKING 1)' not in text:
              if text.count(fast_block) != 1:
                  raise SystemExit('CMake fast-math capability anchor mismatch')
              text = text.replace(fast_block, fast_block + '''if(AP_HAVE_BF AND AP_ENABLE_BF_DIRECTION_TRACKING)\n    set(AP_HAVE_BF_DIRECTION_TRACKING 1)\nelse()\n    set(AP_HAVE_BF_DIRECTION_TRACKING 0)\nendif()\n''', 1)
          text = text.replace('bf_direction_tracking=${AP_ENABLE_BF_DIRECTION_TRACKING}',
                              'bf_direction_tracking=${AP_HAVE_BF_DIRECTION_TRACKING}')
          text = text.replace('AP_BUILD_BF_DIRECTION_TRACKING=$<BOOL:${AP_ENABLE_BF_DIRECTION_TRACKING}>',
                              'AP_BUILD_BF_DIRECTION_TRACKING=${AP_HAVE_BF_DIRECTION_TRACKING}')
          cmake.write_text(text, encoding='utf-8')

          build_h = Path('cmake/audio_pipeline_build.h.in')
          text = build_h.read_text(encoding='utf-8')
          anchor = '#define AP_HAVE_MODULE_BF @AP_HAVE_BF@\n'
          if 'AP_BUILD_BF_DIRECTION_TRACKING' not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('generated build header BF anchor mismatch')
              text = text.replace(anchor, anchor + '#define AP_BUILD_BF_DIRECTION_TRACKING @AP_HAVE_BF_DIRECTION_TRACKING@\n', 1)
          build_h.write_text(text, encoding='utf-8')

          types = Path('include/audio_pipeline/audio_types.h')
          text = types.read_text(encoding='utf-8')
          text = text.replace('    uint8_t fast_math;\n    uint8_t reserved8;\n',
                              '    uint8_t fast_math;\n    uint8_t bf_direction_tracking;\n', 1)
          types.write_text(text, encoding='utf-8')

          info = Path('src/ap_build_info.c')
          text = info.read_text(encoding='utf-8')
          text = text.replace('        AP_HAVE_PIPELINE, AP_HAVE_LINUX_RUNTIME, AP_BUILD_FAST_MATH, 0u,\n',
                              '        AP_HAVE_PIPELINE, AP_HAVE_LINUX_RUNTIME, AP_BUILD_FAST_MATH,\n        AP_BUILD_BF_DIRECTION_TRACKING,\n', 1)
          info.write_text(text, encoding='utf-8')

          bi_test = Path('tests/test_build_info.c')
          text = bi_test.read_text(encoding='utf-8')
          anchor = '    assert(info->fast_math == AP_BUILD_FAST_MATH);\n'
          if 'info->bf_direction_tracking' not in text:
              text = text.replace(anchor, anchor + '    assert(info->bf_direction_tracking == AP_BUILD_BF_DIRECTION_TRACKING);\n', 1)
          bi_test.write_text(text, encoding='utf-8')

          # Cover the new runtime behaviors on the current v2 API.
          ext = Path('tests/test_runtime_extended.c')
          text = ext.read_text(encoding='utf-8')
          marker = '\nstatic void test_recorder_validation_record_and_export(void) {'
          if 'test_direct_quality_degradation_event' not in text:
              extra = r'''
          static void test_direct_quality_degradation_event(void) {
              ap_config_t pcfg = ap_config_default(AP_PROFILE_CALL);
              ap_runtime_config_t rcfg = ap_runtime_config_default();
              ap_pipeline_t *pipeline = NULL;
              ap_runtime_t *runtime;
              ap_runtime_command_t command;
              ap_event_t event;
              ap_metrics_t pm;
              int16_t mic[AP_MAX_IO_FRAME_SAMPLES * AP_MAX_MIC_CHANNELS] = {0};
              int16_t render[AP_MAX_IO_FRAME_SAMPLES] = {0};
              int16_t out[AP_MAX_IO_FRAME_SAMPLES] = {0};
              unsigned i;
              int saw_degraded = 0;

              assert(ap_pipeline_init(pipeline_state, sizeof(pipeline_state), &pcfg, &pipeline) == AP_OK);
              runtime = open_default(pipeline, &rcfg);
              assert(ap_runtime_start(runtime) == AP_OK);
              memset(&command, 0, sizeof(command));
              command.struct_size = sizeof(command);
              command.api_version = AP_RUNTIME_API_VERSION;
              command.kind = AP_RUNTIME_COMMAND_SET_QUALITY;
              command.data.set_quality.quality = AP_QUALITY_SAFE;
              assert(ap_runtime_command(runtime, &command) == AP_OK);
              pm = process_one(runtime, mic, render, out);
              assert(pm.quality == AP_QUALITY_SAFE);
              for (i = 0u; i < 16u && ap_runtime_receive_event(runtime, &event) == AP_OK; ++i) {
                  if (event.kind == AP_EVENT_QUALITY_DEGRADED &&
                      event.arg0 == AP_QUALITY_FULL && event.arg1 == AP_QUALITY_SAFE)
                      saw_degraded = 1;
              }
              assert(saw_degraded);
              ap_runtime_deinit(runtime);
          }

          static void test_bounded_memory_lock_path(void) {
              ap_config_t pcfg = ap_config_default(AP_PROFILE_CALL);
              ap_runtime_config_t rcfg = ap_runtime_config_default();
              ap_runtime_options_t options = ap_runtime_options_default();
              ap_pipeline_t *pipeline = NULL;
              ap_runtime_t *runtime = NULL;
              ap_runtime_metrics_t rm;
              int16_t mic[AP_MAX_IO_FRAME_SAMPLES * AP_MAX_MIC_CHANNELS] = {0};
              int16_t render[AP_MAX_IO_FRAME_SAMPLES] = {0};
              int16_t out[AP_MAX_IO_FRAME_SAMPLES] = {0};

              options.lock_memory = 1u;
              assert(ap_pipeline_init(pipeline_state, sizeof(pipeline_state), &pcfg, &pipeline) == AP_OK);
              assert(ap_runtime_open(runtime_state, sizeof(runtime_state), pipeline,
                                     &rcfg, &options, &runtime) == AP_OK);
              assert(ap_runtime_start(runtime) == AP_OK);
              (void)process_one(runtime, mic, render, out);
              rm = metrics(runtime);
              assert(rm.processed_frames == 1u);
              assert(rm.memory_lock_failures <= 1u);
              ap_runtime_deinit(runtime);
          }
          '''
              if text.count(marker) != 1:
                  raise SystemExit('runtime extended insertion marker mismatch')
              text = text.replace(marker, '\n' + extra + marker, 1)
              text = text.replace('    test_automatic_quality_degrade_and_recovery();\n',
                                  '    test_automatic_quality_degrade_and_recovery();\n    test_direct_quality_degradation_event();\n    test_bounded_memory_lock_path();\n', 1)
          ext.write_text(text, encoding='utf-8')
          PY

          git diff --check
          ! grep -R -n -E '\bmlockall[[:space:]]*\(' src
          grep -q 'AP_BUILD_BF_DIRECTION_TRACKING' cmake/audio_pipeline_build.h.in
          grep -q 'bf_direction_tracking' include/audio_pipeline/audio_types.h
      - name: Validate full port before committing
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/check-architecture.sh
          cmake -S . -B build-port-strict -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-port-strict --parallel
          ctest --test-dir build-port-strict --output-on-failure
          cmake -S . -B build-port-coverage -DCMAKE_BUILD_TYPE=Debug -DAP_BUILD_BENCH=OFF \
            -DCMAKE_C_FLAGS='--coverage -O0 -g' -DCMAKE_EXE_LINKER_FLAGS='--coverage'
          cmake --build build-port-coverage --parallel
          ctest --test-dir build-port-coverage --output-on-failure
          gcovr --root . --filter 'src/' --exclude 'tests/' --fail-under-line 90 --print-summary
          cmake --preset ssc305-cortex-a32-low
          cmake --build build/ssc305-cortex-a32-low --parallel
          sh scripts/check-abi-contract.sh
      - name: Commit validated hardening and remove migrator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/port-ssc305-hardening-v2-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix!: integrate validated SSC305 realtime hardening into v2'
          git push origin HEAD:feat/v2-hard-cut-cleanup
