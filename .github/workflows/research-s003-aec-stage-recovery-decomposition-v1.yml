name: Research S003 AEC Stage Recovery Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-transition-recovery-latency-v1-result.json'
      - 'validation/tools/build_aec_stage_recovery_corpus.py'
      - 'validation/tools/aec_stage_recovery_decomposition.py'
      - 'validation/tools/aec_transition_recovery_latency.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'validation/policies/validation-s003-aec-stage-recovery.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-stage-recovery-decomposition-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-transition-recovery-latency-v1-result.json'
      - 'validation/tools/build_aec_stage_recovery_corpus.py'
      - 'validation/tools/aec_stage_recovery_decomposition.py'
      - 'validation/tools/aec_transition_recovery_latency.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'validation/policies/validation-s003-aec-stage-recovery.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-aec-stage-recovery-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-s003-aec-stage-recovery-decomposition-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-stage-recovery

      - name: Validate candidate-zero stage-recovery contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1.json >/dev/null
          python3 -m json.tool             validation/policies/validation-s003-aec-stage-recovery.json >/dev/null
          python3 -m py_compile             validation/tools/build_aec_stage_recovery_corpus.py             validation/tools/aec_stage_recovery_decomposition.py
          PYTHONPATH=validation/tools             python3 validation/tools/build_aec_stage_recovery_corpus.py --self-test
          PYTHONPATH=validation/tools             python3 validation/tools/aec_stage_recovery_decomposition.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-transition-recovery-latency-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_STAGE_MEASUREMENT_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['promotion_allowed'] is False and c['shipping_change_allowed'] is False
          assert c['corpus']['fresh_seeds']==[10707,10807]
          assert c['corpus']['target_cases']==[
              'echo-path-change','speaker-acoustic-gain-step','render-level-step'
          ]
          assert c['corpus']['stage_profiles']==[
              'prefix-aec','prefix-res','prefix-ns','prefix-agc','default'
          ]
          assert c['corpus']['cases_per_seed']==15
          assert c['preregistered_rules']['no_stage_recovery_pass_fail_threshold'] is True
          assert c['preregistered_rules']['no_parameter_search'] is True
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['reviewed_validity']['performance_requirement_established'] is False
          assert p['reviewed_validity']['algorithm_pass_fail_verdict']=='NOT_AUTHORIZED'
          print('S003 AEC stage-recovery authority: PASS')
          PY

      - name: Build test-only stage-prefix processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-aec-stage-recovery             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-aec-stage-recovery --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-aec-stage-recovery/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-aec-stage-recovery/libaudio_pipeline.a -lm             -o build-s003-aec-stage-recovery/stage_prefix_process_pcm

      - name: Run fresh stage-prefix recovery decomposition
        run: |
          set -euo pipefail
          out=s003-aec-stage-recovery-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1.json

          for seed in 10707 10807; do
            corpus="/tmp/s003-aec-stage-recovery-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            PYTHONPATH=validation/tools               python3 validation/tools/build_aec_stage_recovery_corpus.py                 --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools               python3 validation/tools/stage_interaction_run.py                 --source-revision '${{ github.sha }}'                 --corpus "$corpus/corpus.json"                 --policy validation/policies/validation-s003-aec-stage-recovery.json                 --dataset-lock validation/datasets.lock.json                 --processor build-s003-aec-stage-recovery/stage_prefix_process_pcm                 --output "$seed_out/canonical-stage-report.json"                 --evidence-manifest "$seed_out/evidence-manifest.json"                 --enforce

            PYTHONPATH=validation/tools               python3 validation/tools/aec_stage_recovery_decomposition.py run                 --corpus "$corpus/corpus.json"                 --report "$seed_out/canonical-stage-report.json"                 --processor build-s003-aec-stage-recovery/stage_prefix_process_pcm                 --contract "$contract"                 --output "$seed_out/stage-recovery-decomposition.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools             python3 validation/tools/aec_stage_recovery_decomposition.py aggregate               --contract "$contract"               --input "$out/10707/stage-recovery-decomposition.json"               --input "$out/10807/stage-recovery-decomposition.json"               --output "$out/cross-seed-stage-recovery-summary.json"

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish stage-recovery evidence
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-stage-recovery-out/cross-seed-stage-recovery-summary.json').read_text())
          print('## S003 AEC stage-prefix recovery decomposition')
          print('')
          print('- Authority: **candidate-zero stage measurement only / non-shipping**')
          print(f"- Fresh seeds: `{r['fresh_seeds']}`")
          for case in r['cases']:
              parts=[]
              for profile in case['profiles']:
                  values=[
                      'censored' if obs['censored'] else f"{obs['recovery_time_ms']} ms"
                      for obs in profile['observations']
                  ]
                  deltas=[
                      obs['delta_vs_prefix_aec_ms']
                      for obs in profile['observations']
                  ]
                  parts.append(f"{profile['stage_label']}={values} ΔAEC={deltas}")
              print(f"- `{case['base_case_id']}`: " + '; '.join(parts))
          print('- Stage recovery performance threshold: **none**')
          print('- Algorithm performance verdict: **NOT_AUTHORIZED**')
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound stage recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s003-aec-stage-recovery-decomposition-${{ github.run_id }}
          path: s003-aec-stage-recovery-out/
          if-no-files-found: error
          retention-days: 30
