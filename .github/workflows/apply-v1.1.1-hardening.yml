            (AP_TUNING_AGC_TARGET | AP_TUNING_LIMITER) &&
            t->agc_target_dbfs >= t->limiter_dbfs)
            return AP_EINVAL;
        return AP_OK;
    }
    default:
        return AP_EINVAL;
    }
}

'''
