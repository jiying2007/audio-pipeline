name: Extended Real Automation
run-name: ${{ github.event_name == 'repository_dispatch' && format('extended-real-post-release {0}', github.event.client_payload.tag) || format('Extended Real Automation {0}', github.event_name) }}

on:
  repository_dispatch:
    types: [extended-real-post-release]
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: extended-real-automation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Resolve exact source and automation profile
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.event.client_payload.release_ref }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          EXTENDED_REAL_ENABLED: ${{ vars.EXTENDED_REAL_ENABLED }}
          EXTENDED_REAL_DATA_ROOT: ${{ vars.EXTENDED_REAL_DATA_ROOT }}
        run: |
          set -euo pipefail
          if [ "$EXTENDED_REAL_ENABLED" != true ]; then
            echo 'EXTENDED_REAL_REQUIRED_BUT_DISABLED: enable only after audio-validation runner and materialized cache are genuinely ready.' >&2
            exit 1
          fi
          data_root=${EXTENDED_REAL_DATA_ROOT:-}
          post_release_tag=
          case "$EVENT_NAME" in
            repository_dispatch)
              source_sha=$RELEASE_REF
              profile=commercial-core
              post_release_tag=$RELEASE_TAG
              [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_ref must be exact 40-hex SHA' >&2; exit 2; }
              case "$RELEASE_TAG" in v*) ;; *) echo 'invalid post-release tag' >&2; exit 2 ;; esac
              git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
              test "$(git rev-list -n1 "$RELEASE_TAG")" = "$source_sha"
              ;;
            schedule|workflow_dispatch)
              git fetch origin main
              source_sha=$(git rev-parse origin/main)
              profile=commercial-plus
              ;;
            *) echo "unsupported automation event: $EVENT_NAME" >&2; exit 2 ;;
          esac
          git cat-file -e "$source_sha^{commit}"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "data_root=$data_root" >> "$GITHUB_OUTPUT"
          echo "post_release_tag=$post_release_tag" >> "$GITHUB_OUTPUT"
          if [ -n "$data_root" ]; then
            echo "extended-real automation: event=$EVENT_NAME profile=$profile source=$source_sha root=$data_root"
          else
            echo "extended-real automation: event=$EVENT_NAME profile=$profile source=$source_sha root=<runner-user-default>"
          fi
      - name: Dispatch canonical extended-real workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          PROFILE: ${{ steps.request.outputs.profile }}
          DATA_ROOT: ${{ steps.request.outputs.data_root }}
          POST_RELEASE_TAG: ${{ steps.request.outputs.post_release_tag }}
        run: |
          set -euo pipefail
          gh workflow run validation-extended-real.yml \
            --ref main \
            -f "source_sha=$SOURCE_SHA" \
            -f "profile=$PROFILE" \
            -f "data_root=$DATA_ROOT" \
            -f "post_release_tag=$POST_RELEASE_TAG" \
            -f limit_per_dataset=48 \
            -f direct_limit=24 \
            -f derived_limit=16 \
            -f holdout_percent=20
          echo "EXTENDED_REAL_DISPATCHED profile=$PROFILE source=$SOURCE_SHA tag=${POST_RELEASE_TAG:-none}"

  notify-post-release:
    needs: dispatch
    if: ${{ always() && github.event_name == 'repository_dispatch' && github.event.action == 'extended-real-post-release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Notify post-release qualification aggregator
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.event.client_payload.release_ref }}
          RELEASE_TAG: ${{ github.event.client_payload.tag }}
          CONTROL_RESULT: ${{ needs.dispatch.result }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'invalid post-release SHA' >&2; exit 1; }
          case "$RELEASE_TAG" in v*) ;; *) echo 'invalid post-release tag' >&2; exit 1 ;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=post-release-qualification \
            -f "client_payload[release_ref]=$RELEASE_REF" \
            -f "client_payload[tag]=$RELEASE_TAG" \
            -f 'client_payload[component]=extended-automation' \
            -f "client_payload[source_run_id]=$GITHUB_RUN_ID" \
            -f "client_payload[result]=$CONTROL_RESULT"
