name: BF Hard Mic Fault Base Replay

on:
  pull_request:
    paths:
      - 'src/frontend/ap_beamformer.c'
      - 'tests/validation/build_bf_hard_fault_sweep.py'
      - 'tests/validation/bf_hard_fault_evaluate.py'
      - '.github/workflows/bf-hard-mic-fault-base-replay.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bf-hard-mic-fault-base-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: b68b862f98d8b3aa1ba77e384a5dd60d955c1f23
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Materialize exact pre-candidate base
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          rm -rf /tmp/audio-pipeline-bf-base
          git worktree add --detach /tmp/audio-pipeline-bf-base "$BASE_SHA"
          test "$(git -C /tmp/audio-pipeline-bf-base rev-parse HEAD)" = "$BASE_SHA"

      - name: Build exact base HPF to BF probe
        run: |
          set -euo pipefail
          mkdir -p build-bf-base-replay
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            -I/tmp/audio-pipeline-bf-base/src \
            /tmp/audio-pipeline-bf-base/tests/validation/bf_hard_fault_probe.c \
            /tmp/audio-pipeline-bf-base/src/frontend/ap_hpf.c \
            /tmp/audio-pipeline-bf-base/src/frontend/ap_beamformer.c \
            -lm -o build-bf-base-replay/bf_hard_fault_probe

      - name: Build identical unseen PCM partitions with candidate generator
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          for seed in 4307 5307 6307; do
            root="/tmp/ap-bf-base-replay-${seed}"
            python3 tests/validation/build_bf_hard_fault_sweep.py \
              --output "$root" --seed "$seed"
          done

      - name: Replay exact base on unseen partitions
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          mkdir -p bf-base-replay-out
          for seed in 4307 5307 6307; do
            root="/tmp/ap-bf-base-replay-${seed}"
            out="bf-base-replay-out/${seed}"
            mkdir -p "$out"
            python3 tests/validation/bf_hard_fault_evaluate.py \
              --probe build-bf-base-replay/bf_hard_fault_probe \
              --frontend hpf-bf \
              --corpus "$root/corpus.json" \
              --output "$out/report.json" | tee "$out/measurement.txt"
          done

      - name: Aggregate exact-base replay
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          python3 tests/validation/bf_hard_fault_summary.py \
            --report bf-base-replay-out/4307/report.json \
            --report bf-base-replay-out/5307/report.json \
            --report bf-base-replay-out/6307/report.json \
            --output bf-base-replay-out/summary.json \
            | tee bf-base-replay-out/summary.txt
          {
            echo '## Exact base hard-fault replay'
            echo
            echo "Base SHA: ${BASE_SHA}"
            echo 'The PCM inputs are generated by the candidate branch generator so candidate/base comparisons use identical hard-fault samples. This job is diagnostic only and does not alter the frozen confirmation result.'
            echo
            echo '```text'
            cat bf-base-replay-out/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact-base replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bf-hard-mic-fault-base-replay-${{ github.run_id }}
          path: bf-base-replay-out/
          if-no-files-found: warn
          retention-days: 30
