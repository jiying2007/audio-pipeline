name: Temporary v2314 trend patch

on:
  push:
    branches:
      - fix/nightly-trend-json-evidence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/nightly-trend-json-evidence
          fetch-depth: 0
      - name: Apply exact release metadata patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_history.py --self-test

          if grep -qx 'project(audio_pipeline VERSION 2.3.13 LANGUAGES C)' <(grep '^project(audio_pipeline VERSION ' CMakeLists.txt); then
            sed -i 's/project(audio_pipeline VERSION 2\.3\.13 LANGUAGES C)/project(audio_pipeline VERSION 2.3.14 LANGUAGES C)/' CMakeLists.txt
          elif grep -qx 'project(audio_pipeline VERSION 2.3.14 LANGUAGES C)' <(grep '^project(audio_pipeline VERSION ' CMakeLists.txt); then
            :
          else
            echo 'unexpected CMake project version anchor' >&2
            exit 1
          fi

          first_line="$(head -n 1 CHANGELOG.md)"
          if [ "$first_line" = '# 2.3.13' ]; then
            tmp="$(mktemp)"
            {
              printf '%s\n\n' '# 2.3.14'
              printf '%s\n' '- Repair Nightly historical-trend handling for zero-MAD baselines: an undefined robust z-score is retained as explicit `zero_mad` diagnostic evidence instead of being represented as infinite statistical significance.'
              printf '%s\n' '- Preserve the existing fail-closed thresholds unchanged: bad-direction deltas above 15% still fail through the percentage gate, and finite robust z-scores above 4.0 still fail independently when historical dispersion exists. Zero-MAD deltas below the percentage limit may enter the success-only history so the baseline can converge instead of deadlocking permanently.'
              printf '%s\n\n' '- Emit strict JSON trend evidence (`allow_nan=False`) with explicit robust-z availability state, triggers and diagnostics. This maintenance release changes historical measurement/evidence behavior only; realtime DSP, public API/ABI, acoustic thresholds, shipping defaults and Product Qualification authority are unchanged.'
              cat CHANGELOG.md
            } > "$tmp"
            mv "$tmp" CHANGELOG.md
          elif [ "$first_line" = '# 2.3.14' ]; then
            :
          else
            echo "unexpected CHANGELOG head: $first_line" >&2
            exit 1
          fi

          git diff --check
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'release metadata already applied'
            exit 0
          fi
          git commit -m 'release: prepare v2.3.14 trend evidence repair'
          git push origin HEAD:fix/nightly-trend-json-evidence
