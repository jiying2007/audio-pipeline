name: I005 VAD Public Source Admission

on:
  pull_request:
    paths:
      - 'docs/program/iterations/I005-source-admission.json'
      - 'docs/program/iterations/I005-source-admission-result.json'
      - 'tests/validation/discover_i005_ami_vad_source.py'
      - 'tests/validation/data/i005_ami_vad_development_es2005b.lock.json'
      - '.github/workflows/i005-vad-source-admission.yml'

permissions:
  contents: read

concurrency:
  group: i005-vad-source-admission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  admit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: tests/validation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate frozen source-admission contract and research-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='1cd72790f5ecaf841de83ed367cadffb970a0a9a'
          python3 -m py_compile tests/validation/discover_i005_ami_vad_source.py
          python3 tests/validation/discover_i005_ami_vad_source.py --self-test
          python3 -m json.tool docs/program/iterations/I005-source-admission.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/program/iterations/I005-source-admission.json').read_text())
          assert c['schema_version'] == 1 and c['iteration_id'] == 'I005'
          assert c['phase'] == 'public-source-admission'
          assert c['root_cause_id'] == 'vad-event-onset-release-baseline'
          assert c['base_sha'] == '1cd72790f5ecaf841de83ed367cadffb970a0a9a'
          assert c['requested_data_role'] == 'development'
          assert c['selected_source']['meeting'] == 'ES2005b'
          assert c['selected_source']['license'] == 'CC-BY-4.0'
          assert c['candidate_limit'] == 0 and c['confirmation_limit'] == 0
          assert c['promotion_allowed'] is False
          assert [x['meeting'] for x in c['prohibited_reuse']] == ['ES2003a', 'ES2004a']
          assert all(value is False for value in c['authority'].values())
          assert c['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/i005-vad-source-admission\.yml|docs/program/iterations/I005-source-admission\.json|docs/program/iterations/I005-source-admission-result\.json|tests/validation/discover_i005_ami_vad_source\.py|tests/validation/data/i005_ami_vad_development_es2005b\.lock\.json)$'
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          test "$count" -eq 3 -o "$count" -eq 5
          printf '%s\n' "$changed" | grep -Fx 'docs/program/iterations/I005-source-admission.json'
          printf '%s\n' "$changed" | grep -Fx 'tests/validation/discover_i005_ami_vad_source.py'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/i005-vad-source-admission.yml'
          if test "$count" -eq 5; then
            printf '%s\n' "$changed" | grep -Fx 'docs/program/iterations/I005-source-admission-result.json'
            printf '%s\n' "$changed" | grep -Fx 'tests/validation/data/i005_ami_vad_development_es2005b.lock.json'
          fi

      - name: Discover exact ES2005b source identities and bounded windows
        shell: bash
        run: |
          set -euo pipefail
          rm -rf i005-source-admission-evidence
          mkdir -p i005-source-admission-evidence
          python3 tests/validation/discover_i005_ami_vad_source.py \
            --meeting ES2005b \
            --output i005-source-admission-evidence/discovery.json \
            | tee i005-source-admission-evidence/discovery-summary.json

      - name: Enforce source admission without acoustic authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('i005-source-admission-evidence/discovery.json').read_text())
          c = json.loads(Path('docs/program/iterations/I005-source-admission.json').read_text())
          assert r['schema_version'] == 1 and r['iteration_id'] == 'I005'
          assert r['authority'] == 'public-source-admission-discovery-only'
          assert r['candidate_limit'] == 0 and r['confirmation_limit'] == 0
          assert r['promotion_allowed'] is False and r['selected_role'] == 'development'
          assert r['prohibited_meetings'] == ['ES2003a', 'ES2004a']
          assert r['candidate_decision'] == 'NOT_AN_ACOUSTIC_CANDIDATE'
          assert r['product_qualification'] == 'DEFERRED_BY_SCOPE'
          d = r['discovery']
          assert d['authority'] == 'research-discovery-only'
          assert d['dataset']['meeting'] == c['selected_source']['meeting'] == 'ES2005b'
          assert d['dataset']['license'] == c['selected_source']['license'] == 'CC-BY-4.0'
          assert d['transport_mirror']['repository'] == c['selected_source']['transport_mirror_repository']
          assert d['transport_mirror']['revision'] == c['selected_source']['transport_mirror_revision']
          a, req = d['audio'], c['source_admission_requirements']
          assert a['wav']['sample_rate_hz'] == req['sample_rate_hz'] == 16000
          assert a['wav']['channels'] == req['channels'] == 1
          assert a['wav']['bits_per_sample'] == req['bits_per_sample'] == 16
          assert a['range_supported'] is True
          assert any((a.get(key) or '') for key in ('lfs_sha256', 'tree_object_id', 'xet_hash'))
          assert len(d['annotations']['files']) == req['annotation_files'] == 4
          assert all(len(x['sha256']) == 64 for x in d['annotations']['files'])
          assert len(d['window_plan']) == req['window_count'] == 3
          assert [x['target_activity_fraction'] for x in d['window_plan']] == req['activity_targets']
          assert all(x['audio_range']['status'] == 206 for x in d['window_plan'])
          assert all(len(x['audio_range']['sha256']) == 64 for x in d['window_plan'])
          assert all(abs((x['end_s'] - x['start_s']) - req['window_seconds']) < 1e-9 for x in d['window_plan'])
          PY

      - name: Reconcile discovery with pinned exposed Development lock
        if: hashFiles('tests/validation/data/i005_ami_vad_development_es2005b.lock.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('i005-source-admission-evidence/discovery.json').read_text())
          d = r['discovery']
          lock = json.loads(Path('tests/validation/data/i005_ami_vad_development_es2005b.lock.json').read_text())
          result = json.loads(Path('docs/program/iterations/I005-source-admission-result.json').read_text())
          assert lock['schema_version'] == 1
          assert lock['authority'] == 'i005-exposed-development-source'
          assert lock['dataset']['meeting'] == d['dataset']['meeting'] == 'ES2005b'
          assert lock['dataset']['license'] == d['dataset']['license'] == 'CC-BY-4.0'
          assert lock['transport_mirror'] == d['transport_mirror']
          for key in ('path','size_bytes','tree_object_id','lfs_sha256','xet_hash'):
              assert lock['audio'][key] == d['audio'][key]
          assert lock['audio']['wav'] == d['audio']['wav']
          assert abs(lock['audio']['duration_s'] - d['audio']['duration_s']) < 1e-9
          by_speaker = {x['speaker']: x for x in d['annotations']['files']}
          for item in lock['annotations']:
              cur = by_speaker[item['speaker']]
              for key in ('path','sha256','size_bytes','segments'):
                  assert item[key] == cur[key]
          by_window = {x['window_id']: x for x in d['window_plan']}
          for item in lock['windows']:
              cur = by_window[item['window_id']]
              assert item['start_s'] == cur['start_s'] and item['end_s'] == cur['end_s']
              assert abs(item['activity_fraction'] - cur['activity_fraction']) < 1e-9
              assert item['target_activity_fraction'] == cur['target_activity_fraction']
              for key in ('start_byte','end_byte','length_bytes','sha256'):
                  assert item['audio_range'][key] == cur['audio_range'][key]
          assert lock['future_roles']['independent_confirmation'] is False
          assert lock['future_roles']['promotion'] is False
          assert result['decision'] == 'ADMIT_DEVELOPMENT_SOURCE'
          assert result['authoritative_discovery']['workflow_run_id'] == 34006320407
          assert result['authoritative_discovery']['artifact_id'] == 9981037918
          assert result['authoritative_discovery']['artifact_digest'] == 'sha256:538da994f521eb52aa3e5ed7440ec5bf1b98fa730e7473b40435ff7021e3d584'
          assert result['authoritative_discovery']['internal_sha256s_verified'] == 6
          assert result['candidate_limit_consumed'] == 0
          assert result['confirmation_limit_consumed'] == 0
          assert result['promotion_allowed'] is False
          PY

      - name: Seal source-admission evidence
        shell: bash
        run: |
          set -euo pipefail
          cp docs/program/iterations/I005-source-admission.json i005-source-admission-evidence/contract.json
          git rev-parse HEAD > i005-source-admission-evidence/research-head.txt
          printf '%s\n' '1cd72790f5ecaf841de83ed367cadffb970a0a9a' > i005-source-admission-evidence/base-sha.txt
          printf '%s\n' 'ADMIT_DEVELOPMENT_SOURCE' > i005-source-admission-evidence/decision.txt
          if test -f tests/validation/data/i005_ami_vad_development_es2005b.lock.json; then
            cp tests/validation/data/i005_ami_vad_development_es2005b.lock.json i005-source-admission-evidence/pinned-lock.json
            cp docs/program/iterations/I005-source-admission-result.json i005-source-admission-evidence/admission-result.json
          fi
          find i005-source-admission-evidence -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > i005-source-admission-evidence/SHA256SUMS

      - name: Publish source-admission summary
        if: always()
        shell: bash
        run: |
          if test -f i005-source-admission-evidence/discovery.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('i005-source-admission-evidence/discovery.json').read_text())
          d = r['discovery']
          print('## I005 public VAD source admission')
          print(f"- Meeting: `{d['dataset']['meeting']}`")
          print(f"- License: `{d['dataset']['license']}`")
          print(f"- Duration: `{d['audio']['duration_s']:.3f}s`")
          print(f"- Annotation files: `{len(d['annotations']['files'])}`")
          for w in d['window_plan']:
              print(f"- {w['window_id']}: activity `{w['activity_fraction']:.3f}`, sha256 `{w['audio_range']['sha256'][:16]}...`")
          print('- Decision: `ADMIT_DEVELOPMENT_SOURCE`.')
          print('- Candidate/confirmation budget consumed: `0/0`.')
          print('- Once pinned, this source is exposed Development and cannot become fresh confirmation.')
          print('- Product qualification: `DEFERRED_BY_SCOPE`.')
          PY
          fi

      - name: Upload sealed source-admission evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i005-vad-source-admission-${{ github.run_id }}
          path: i005-source-admission-evidence/
          retention-days: 90
          if-no-files-found: error
