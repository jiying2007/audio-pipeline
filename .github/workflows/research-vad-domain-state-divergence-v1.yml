name: Research VAD Domain State Divergence v1
run-name: "vad-state-divergence-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/vad-domain-state-divergence-v1.json'
      - '.github/research/continuous-optimization/development-v4/vad-domain-state-divergence-v1-result.json'
      - 'tests/validation/vad_domain_state_divergence_probe.c'
      - 'tests/validation/vad_domain_state_divergence.py'
      - '.github/workflows/research-vad-domain-state-divergence-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-vad-domain-state-divergence-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/vad-domain-state-divergence-v1.json
  RESULT: .github/research/continuous-optimization/development-v4/vad-domain-state-divergence-v1-result.json

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate consumed diagnostic contract, tooling and reviewed result
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/vad_domain_state_divergence.py
          python3 tests/validation/vad_domain_state_divergence.py --self-test
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m json.tool "$RESULT" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'vad-domain-state-divergence-v1.json'
          ).read_text())
          result = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'vad-domain-state-divergence-v1-result.json'
          ).read_text())

          assert contract['authority'] == 'DIAGNOSTIC_ONLY_VAD_STATE_DECOMPOSITION'
          assert contract['source_base_sha'] == 'd5bd0f6d72574b6af9631dc10d7903cd43a269c3'
          assert contract['fresh_diagnostic_authority']['seeds'] == [131123, 141123, 151123]
          assert contract['budget'] == {
              'candidate_limit': 0,
              'confirmation_limit': 0,
              'diagnostic_execution_limit': 1,
          }
          assert all(value is False for value in contract['authority_boundary'].values())

          assert result['status'] == 'CLOSED_DIAGNOSTIC_ONLY'
          assert result['authority'] == contract['authority']
          assert result['source_base_sha'] == contract['source_base_sha']
          assert result['decision'] == 'VAD_STATE_DIVERGENCE_CONFIRMED_REVIEW_REQUIRED'
          assert result['reviewed_decision'] == (
              'LOCAL_NOISE_STATE_REFRESH_HANGOVER_CHAIN_CONFIRMED_NO_CANDIDATE'
          )
          assert result['authoritative_execution']['workflow_run_id'] == 35944510213
          assert result['authoritative_execution']['artifact_id'] == 10786012888
          assert result['authoritative_execution']['artifact_digest'] == (
              'sha256:d35209a71491847fb56750cae1258c3df792d24d773403489f9e8f6f4e25f8ef'
          )
          fresh = result['fresh_authority']
          assert fresh['seeds'] == [131123, 141123, 151123]
          assert fresh['diagnostic_execution_limit'] == 1
          assert fresh['diagnostic_execution_consumed'] == 1
          assert fresh['candidate_limit_consumed'] == 0
          assert fresh['confirmation_limit_consumed'] == 0
          assert result['mirror_identity'] == {
              'probability_mismatch_frames': 0,
              'active_mismatch_frames': 0,
              'max_probability_delta': 0.0,
              'conclusion': 'PUBLIC_VAD_MIRROR_EXACT_ON_FRESH_DIAGNOSTIC',
          }
          aggregate = result['aggregate']
          assert aggregate['lost_speech_frames'] == 105
          assert aggregate['gained_speech_frames'] == 48
          assert aggregate['shipping_recall'] == 0.8308641975308642
          assert aggregate['pre_ns_recall'] == 0.7956790123456791
          attribution = result['lost_speech_attribution']
          assert attribution['pre_final_below_decision']['frames'] == 105
          assert attribution['pre_noise_rms_higher']['frames'] == 105
          assert attribution['hangover_history_lower']['frames'] == 91
          assert attribution['refresh_changed']['frames'] == 85
          assert attribution['transient_cap_added']['frames'] == 0
          assert attribution['upstream_guard_lost']['frames'] == 3
          assert all(value is False for value in result['authority_boundary'].values())
          PY
          git cat-file -e "d5bd0f6d72574b6af9631dc10d7903cd43a269c3^{commit}"
