name: Hosted Real AEC Validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Optional exact 40-hex source SHA; defaults to event SHA'
        required: false
        default: ''
        type: string
      qualification_mode:
        description: 'normal or one-way'
        required: false
        default: normal
        type: choice
        options: [normal, one-way]
  workflow_call:
    inputs:
      source_sha:
        required: false
        default: ''
        type: string
      qualification_mode:
        required: false
        default: normal
        type: string

permissions:
  contents: read

concurrency:
  group: hosted-real-aec-${{ inputs.source_sha || github.ref }}
  cancel-in-progress: true

jobs:
  aec-real-microset:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AEC_REVISION: 6c633d0a9d2a143a0e364899b91b06f127315b18
      SOURCE_REVISION: ${{ inputs.source_sha || github.sha }}
      QUALIFICATION_MODE: ${{ inputs.qualification_mode || 'normal' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0
      - name: Enforce exact qualification source when supplied
        if: inputs.source_sha != ''
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be exact 40-hex' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: hosted-real-aec

      - name: Validate hosted AEC dataset and policy contracts
        run: |
          set -euo pipefail
          mkdir -p hosted-aec-out
          python3 validation/tools/build_hosted_aec_corpus.py self-test
          python3 validation/tools/build_hosted_aec_corpus.py validate \
            --lock validation/hosted_aec.datasets.lock.json
          python3 validation/tools/run_validation.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          lock = json.loads(Path('validation/hosted_aec.datasets.lock.json').read_text())
          policy = json.loads(Path('validation/policies/validation-hosted-aec-smoke.json').read_text())
          assert lock['source_revision'] == '6c633d0a9d2a143a0e364899b91b06f127315b18'
          assert len(lock['cases']) == 4
          assert sum(not case['movement'] for case in lock['cases']) == 2
          assert sum(case['movement'] for case in lock['cases']) == 2
          assert policy['minimum_cases'] == 4
          assert policy['aggregate']['min_median_output_render_corr_reduction'] >= 0.0
          PY

      - name: Materialize exact Git LFS real AEC fixtures
        shell: bash
        run: |
          set -euo pipefail
          git lfs version
          rm -rf /tmp/audio-pipeline-aec-challenge
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/AEC-Challenge.git /tmp/audio-pipeline-aec-challenge
          cd /tmp/audio-pipeline-aec-challenge
          git -c advice.detachedHead=false checkout --detach "$AEC_REVISION"
          test "$(git rev-parse HEAD)" = "$AEC_REVISION"
          include=$(python3 - "$GITHUB_WORKSPACE/validation/hosted_aec.datasets.lock.json" <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1]))
          print(','.join(item[role]['path'] for item in lock['cases'] for role in ('mic', 'render')))
          PY
          )
          unset GIT_LFS_SKIP_SMUDGE
          git lfs pull --include="$include" --exclude=""

      - name: Build hash-bound real AEC corpus
        run: |
          set -euo pipefail
          python3 validation/tools/build_hosted_aec_corpus.py build \
            --lock validation/hosted_aec.datasets.lock.json \
            --source-root /tmp/audio-pipeline-aec-challenge \
            --output hosted-aec-out/corpus \
            | tee hosted-aec-out/corpus-build.json

      - name: Build exact offline validation processor
        run: |
          set -euo pipefail
          cmake -S . -B build-hosted-aec -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-hosted-aec --target ap_process_pcm ap_build_info_dump --parallel
          sha256sum build-hosted-aec/ap_process_pcm > hosted-aec-out/processor.sha256
          build-hosted-aec/ap_build_info_dump > hosted-aec-out/build-info.txt
          ${CC:-cc} --version | head -n 1 > hosted-aec-out/compiler.txt

      - name: Enforce real AEC regression policy
        run: |
          set -euo pipefail
          python3 validation/tools/run_validation.py \
            --source-revision "$SOURCE_REVISION" \
            --corpus hosted-aec-out/corpus/corpus.json \
            --policy validation/policies/validation-hosted-aec-smoke.json \
            --dataset-lock validation/hosted_aec.datasets.lock.json \
            --source-manifest hosted-aec-out/corpus/source-manifest.json \
            --processor build-hosted-aec/ap_process_pcm \
            --output hosted-aec-out/report.json \
            --evidence-manifest hosted-aec-out/evidence-manifest.json \
            --enforce
          python3 - <<'PY'
          import json, os, statistics
          from collections import defaultdict
          from pathlib import Path
          report = json.loads(Path('hosted-aec-out/report.json').read_text())
          assert report['validation_result'] == 'PASS'
          assert report['summary']['cases'] == 4
          assert report['summary']['pass_rate'] == 1.0
          assert report['summary']['median_output_render_corr_reduction'] is not None
          if os.environ.get('QUALIFICATION_MODE') == 'one-way':
              print(json.dumps({
                  'result': report['validation_result'],
                  'cases': report['summary']['cases'],
                  'median_output_render_corr_reduction': report['summary']['median_output_render_corr_reduction'],
                  'details': 'redacted-one-way',
              }, sort_keys=True))
              raise SystemExit(0)
          groups = defaultdict(list)
          for case in report['cases']:
              groups[case['scenario']].append(case['metrics']['output_render_corr_reduction'])
          scenario_medians = {name: statistics.median(values) for name, values in sorted(groups.items())}
          print(json.dumps({
              'result': report['validation_result'],
              'median_output_render_corr_reduction': report['summary']['median_output_render_corr_reduction'],
              'scenario_medians': scenario_medians,
              'cases': [
                  {
                      'case_id': case['case_id'],
                      'scenario': case['scenario'],
                      'input_render_corr': case['metrics'].get('input_render_max_abs_corr'),
                      'output_render_corr': case['metrics'].get('output_render_max_abs_corr'),
                      'corr_reduction': case['metrics'].get('output_render_corr_reduction'),
                      'output_rms_delta_db': case['metrics'].get('output_rms_delta_db')
                  }
                  for case in report['cases']
              ]
          }, sort_keys=True))
          PY

      - name: Seal hosted AEC evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d hosted-aec-out ]; then
            cp validation/hosted_aec.datasets.lock.json hosted-aec-out/
            cp validation/policies/validation-hosted-aec-smoke.json hosted-aec-out/
            find hosted-aec-out -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 sha256sum > /tmp/hosted-aec-SHA256SUMS
            mv /tmp/hosted-aec-SHA256SUMS hosted-aec-out/SHA256SUMS
          fi

      - name: Publish real AEC summary
        if: always()
        shell: bash
        run: |
          if [ -f hosted-aec-out/report.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os, statistics
          from collections import defaultdict
          from pathlib import Path
          report = json.loads(Path('hosted-aec-out/report.json').read_text())
          print('## Hosted real AEC validation')
          print('- Source: `microsoft/AEC-Challenge` ICASSP 2022 real test set, exact commit + Git LFS SHA-256')
          if os.environ.get('QUALIFICATION_MODE') == 'one-way':
              print(f"- Result: `{report['validation_result']}`")
              print(f"- Cases: `{report['summary']['cases']}` (details redacted for one-way qualification)")
              print(f"- Overall median render-correlation reduction: `{report['summary']['median_output_render_corr_reduction']:.6f}`")
              print('- Authority: one-way real AEC qualification; do not tune from this result.')
              raise SystemExit(0)
          print(f"- Result: `{report['validation_result']}`")
          print(f"- Cases: `{report['summary']['cases']}` (2 static + 2 movement)")
          print(f"- Overall median render-correlation reduction: `{report['summary']['median_output_render_corr_reduction']:.6f}`")
          groups = defaultdict(list)
          for case in report['cases']:
              m = case['metrics']
              groups[case['scenario']].append(m.get('output_render_corr_reduction'))
              print(f"- `{case['case_id']}`: input_corr={m.get('input_render_max_abs_corr'):.6f}, output_corr={m.get('output_render_max_abs_corr'):.6f}, reduction={m.get('output_render_corr_reduction'):.6f}, rms_delta={m.get('output_rms_delta_db'):.3f} dB")
          for name, values in sorted(groups.items()):
              print(f"- Scenario median `{name}`: `{statistics.median(values):.6f}`")
          print('- Authority: real AEC regression only; blind/full public, target/HIL and certification remain mandatory for shipping.')
          PY
          fi

      - name: Upload hash-bound hosted AEC evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-real-aec-${{ github.run_id }}
          path: hosted-aec-out/
          retention-days: 30
          if-no-files-found: error
