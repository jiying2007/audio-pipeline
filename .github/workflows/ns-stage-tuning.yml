name: NS Stage Tuning

on:
  schedule:
    - cron: '41 20 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ns-stage-tuning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEARCH_SPACE: validation/tuning/search-spaces/ns-stage-v1.json
      EXPECTED_MAX_CANDIDATES: '9'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: ns-stage-tuning
      - name: Validate tuning contracts
        run: |
          set -euo pipefail
          python3 -m py_compile validation/tools/*.py
          python3 validation/tools/authority.py --self-test
          python3 validation/tools/run_validation.py --self-test
          python3 validation/tools/tuning_iteration.py --self-test
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          space = json.loads(Path(os.environ['SEARCH_SPACE']).read_text())
          assert space['schema_version'] == 1
          assert space['strategy'] == 'one-at-a-time'
          assert set(space['parameters']) == {'ns_floor'}
          assert space['max_candidates'] <= int(os.environ['EXPECTED_MAX_CANDIDATES'])
          PY
      - name: Configure tuning processor
        run: >-
          cmake -S . -B build-ns-tuning -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build tuning processor
        run: cmake --build build-ns-tuning --target ap_process_pcm --parallel
      - name: Build independent stage partitions
        run: |
          set -euo pipefail
          python3 validation/tools/build_stage_validation_corpus.py --output /tmp/ap-ns-stage-1307 --seed 1307
          python3 validation/tools/build_stage_validation_corpus.py --output /tmp/ap-ns-stage-2307 --seed 2307
          python3 validation/tools/build_stage_validation_corpus.py --output /tmp/ap-ns-stage-3307 --seed 3307
          python3 validation/tools/authority.py \
            --development-corpus /tmp/ap-ns-stage-1307/corpus.json \
            --validation-corpus /tmp/ap-ns-stage-2307/corpus.json \
            --shadow-corpus /tmp/ap-ns-stage-3307/corpus.json
      - name: Search development and replay validation plus shadow
        run: |
          set -euo pipefail
          python3 validation/tools/tuning_iteration.py \
            --processor build-ns-tuning/ap_process_pcm \
            --development-corpus /tmp/ap-ns-stage-1307/corpus.json \
            --validation-corpus /tmp/ap-ns-stage-2307/corpus.json \
            --shadow-corpus /tmp/ap-ns-stage-3307/corpus.json \
            --policy validation/policies/validation-smoke.json \
            --dataset-lock validation/datasets.lock.json \
            --search-space "$SEARCH_SPACE" \
            --output-dir ns-stage-tuning-out
      - name: Enforce non-shipping candidate authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('ns-stage-tuning-out/iteration-result.json').read_text())
          assert result['authority'] == 'non-shipping-acoustic-iteration'
          assert result['decision'] in {'KEEP_BASELINE', 'REJECT_CANDIDATE', 'ACOUSTIC_CANDIDATE'}
          assert result['search_space']['candidate_count'] <= int(os.environ['EXPECTED_MAX_CANDIDATES'])
          assert result['bindings']['partitions']['development']['generator_seed'] == 1307
          assert result['bindings']['partitions']['validation']['generator_seed'] == 2307
          assert result['bindings']['partitions']['shadow']['generator_seed'] == 3307
          baseline = next(item for item in result['development_ranking'] if item['label'] == 'baseline')
          assert baseline['validation_result'] == 'PASS'
          assert result['validation']['baseline']['validation_result'] == 'PASS'
          assert result['shadow']['baseline']['validation_result'] == 'PASS'
          if result['decision'] == 'ACOUSTIC_CANDIDATE':
              assert not result['validation']['regression_violations']
              assert not result['shadow']['regression_violations']
          PY
      - name: Publish tuning summary
        if: always()
        run: |
          if [ -f ns-stage-tuning-out/iteration-result.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('ns-stage-tuning-out/iteration-result.json').read_text())
          print('## NS stage tuning')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Iteration: `{r['iteration_id']}`")
          print(f"- Selected: `{r['selected']['label']}`")
          print(f"- Development score: `{r['selected']['development_score']:.4f}`")
          print('- Authority: acoustic candidate only; no shipping default is mutated automatically.')
          PY
          fi
      - name: Upload tuning evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ns-stage-tuning-${{ github.run_id }}
          path: ns-stage-tuning-out/
          if-no-files-found: warn
          retention-days: 30
