name: Research I023 VAD Upstream Local Disagreement Risk v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i023-vad-upstream-local-disagreement-risk-v1.json'
      - '.github/research/continuous-optimization/development-v4/i023-vad-upstream-local-disagreement-risk-v1-result.json'
      - 'tests/validation/i023_vad_upstream_local_disagreement_risk_probe.c'
      - 'tests/validation/i023_vad_upstream_local_disagreement_risk.py'
      - 'tests/validation/test_i023_one_shot_guard.py'
      - 'tests/validation/test_i023_retirement.py'
      - 'tests/validation/data/i023-consumed-workflow.yml'
      - 'validation/research/evidence/i023-36441887773/**'
      - '.github/workflows/research-i023-vad-upstream-local-disagreement-risk-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I023 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 tests/validation/i023_vad_upstream_local_disagreement_risk.py --self-test
          python3 tests/validation/test_i023_one_shot_guard.py
          python3 tests/validation/test_i023_retirement.py
