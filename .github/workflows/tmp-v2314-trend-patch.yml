name: Temporary v2.3.14 trend patch

on:
  push:
    branches:
      - fix/nightly-trend-json-evidence

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: fix/nightly-trend-json-evidence
          fetch-depth: 0
      - name: Apply exact release metadata patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test_history.py --self-test
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          old = 'project(audio_pipeline VERSION 2.3.13 LANGUAGES C)'
          new = 'project(audio_pipeline VERSION 2.3.14 LANGUAGES C)'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one version anchor, got {text.count(old)}')
          cmake.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          body = changelog.read_text(encoding='utf-8')
          if not body.startswith('# 2.3.13\n'):
              raise SystemExit('CHANGELOG head drifted from 2.3.13')
          entry = '''# 2.3.14

- Repair Nightly historical-trend handling for zero-MAD baselines: an undefined robust z-score is now retained as explicit `zero_mad` diagnostic evidence instead of being represented as infinite statistical significance.
- Preserve the existing fail-closed thresholds unchanged: bad-direction deltas above 15% still fail through the percentage gate, and finite robust z-scores above 4.0 still fail independently when historical dispersion exists. Zero-MAD deltas below the percentage limit may enter the success-only history so the baseline can converge instead of deadlocking permanently.
- Emit strict JSON trend evidence (`allow_nan=False`) with explicit robust-z availability state, triggers and diagnostics. This maintenance release changes historical measurement/evidence behavior only; realtime DSP, public API/ABI, acoustic thresholds, shipping defaults and Product Qualification authority are unchanged.

'''
          changelog.write_text(entry + body, encoding='utf-8')
          PY
          git diff --check
          git diff -- CMakeLists.txt CHANGELOG.md scripts/test_history.py
      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'release metadata already applied'
            exit 0
          fi
          git commit -m 'release: prepare v2.3.14 trend evidence repair'
          git push origin HEAD:fix/nightly-trend-json-evidence
