name: Temporary Materialize 2.3.4 AEC Motion

on:
  push:
    branches: [test/aec-motion-development-harness]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: test/aec-motion-development-harness
          fetch-depth: 0
      - name: Materialize release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text()
          old = 'project(audio_pipeline VERSION 2.3.3 LANGUAGES C)'
          new = 'project(audio_pipeline VERSION 2.3.4 LANGUAGES C)'
          assert text.count(old) == 1
          assert 'VERSION 2.3.4 LANGUAGES C' not in text
          cmake.write_text(text.replace(old, new, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          assert text.startswith('# 2.3.3\n')
          entry = (
              '# 2.3.4\n\n'
              '- Add a deterministic continuous-motion AEC development corpus with multi-seed smooth delay/gain/multipath variation, explicitly limited to regression/development authority.\n'
              '- Add a dedicated GitHub-hosted three-seed motion regression workflow using the canonical validation evaluator and sealed evidence artifacts.\n'
              '- Preserve DSP defaults, public API/ABI, real-data holdouts and shipping authority unchanged; hosted real AEC remains a one-way promotion gate and is never used as tuning input.\n\n'
          )
          changelog.write_text(entry + text)

          workflow = Path('.github/workflows/tmp-materialize-2.3.4-aec-motion.yml')
          assert workflow.exists()
          workflow.unlink()
          PY

          git diff --check
          grep -q 'project(audio_pipeline VERSION 2.3.4 LANGUAGES C)' CMakeLists.txt
          head -1 CHANGELOG.md | grep -qx '# 2.3.4'
          test ! -e .github/workflows/tmp-materialize-2.3.4-aec-motion.yml
          git diff --stat

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt CHANGELOG.md .github/workflows/tmp-materialize-2.3.4-aec-motion.yml
          git commit -m 'release: version AEC motion validation as 2.3.4'
          git push origin HEAD:test/aec-motion-development-harness
