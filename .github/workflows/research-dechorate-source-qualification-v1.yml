name: Research dEchorate Source Qualification V1

on:
  pull_request:
    paths:
      - '.github/research/continuous-optimization/development-v3/dechorate-source-qualification-v1.json'
      - '.github/workflows/research-dechorate-source-qualification-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/dechorate-source-qualification-v1.json'
      - '.github/workflows/research-dechorate-source-qualification-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2

      - name: Enforce research-only scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$BASE" HEAD)
          [[ ${#files[@]} -eq 2 ]]
          printf '%s\n' "${files[@]}" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
          .github/research/continuous-optimization/development-v3/dechorate-source-qualification-v1.json
          .github/workflows/research-dechorate-source-qualification-v1.yml
          EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Validate candidate-zero authority and predecessor closure
        shell: python
        run: |
          import json
          from pathlib import Path
          m = json.loads(Path('.github/research/continuous-optimization/development-v3/dechorate-source-qualification-v1.json').read_text())
          assert m['state'] == 'SOURCE_QUALIFIED_METADATA_ONLY'
          assert m['authority'] == 'DIAGNOSTIC_ONLY'
          assert m['candidate_budget'] == 0
          assert m['base_main_sha'] == 'b9ea9e5518198f302a457531d1380472a35f3153'
          c = m['predecessor_closure']
          assert c['state'] == 'CLOSED_DIAGNOSTIC_PLATEAU'
          assert c['fresh_main_sha'] == m['base_main_sha']
          assert c['closure_run'] == 35193807050
          assert c['verify_run'] == 35193807409
          assert c['release_run'] == 35194095674
          assert c['release_number'] == 999
          d = m['distribution']
          assert d['mutable_mirror'] is True
          assert d['inventory_frozen'] is False
          assert d['payload_authorized_in_this_step'] is False
          n = m['next_authorized_step']
          assert n['scope'] == 'primary_license_and_distribution_metadata_only'
          assert n['must_freeze_complete_inventory_before_any_future_materialization'] is True
          assert n['must_record_expected_checksums_before_any_future_materialization'] is True
          assert n['must_verify_primary_dataset_license'] is True
          assert n['may_run_audio_pipeline'] is False
          assert n['may_compute_dtd_or_quality_result'] is False
          assert n['may_derive_detector_threshold'] is False
          assert n['may_create_source_candidate'] is False
          assert m['shipping_immutability'] == {
              'version': 'v2.3.16',
              'sha': '57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          }

      - name: Verify exact upstream source blobs and schema contract
        shell: bash
        run: |
          set -euo pipefail
          REV=d3e664f1e7a7d46241d7f7b3b3761448686b9537
          ROOT=https://raw.githubusercontent.com/Chutlhu/dEchorate/$REV
          curl -fsSL "$ROOT/README.md" -o /tmp/dechorate-README.md
          curl -fsSL "$ROOT/dechorate/dataset.py" -o /tmp/dechorate-dataset.py
          curl -fsSL "$ROOT/dechorate/main_build_sofa_database.py" -o /tmp/dechorate-sofa.py
          curl -fsSL "$ROOT/LICENSE" -o /tmp/dechorate-LICENSE
          [[ "$(git hash-object /tmp/dechorate-README.md)" == "26817ec088573b5522689ec9231f882616afc21d" ]]
          [[ "$(git hash-object /tmp/dechorate-dataset.py)" == "0d4bc88722702d136d39aea291165adc37ee6696" ]]
          [[ "$(git hash-object /tmp/dechorate-sofa.py)" == "cd03ca06621e64f217599a811e56ac0701b98760" ]]
          [[ "$(git hash-object /tmp/dechorate-LICENSE)" == "37bb2d403bacc8c4b0ffd1a78fe847839c988360" ]]
          grep -Fq 'early echo timings' /tmp/dechorate-README.md
          grep -Fq '3D positions of microphones, real sources and image sources' /tmp/dechorate-README.md
          grep -Fq "path_to_note must be the csv file" /tmp/dechorate-dataset.py
          grep -Fq "path_to_mic_src_note must be the pkl file" /tmp/dechorate-dataset.py
          for token in Data_IR SourcePosition ReceiverPosition RoomCornerA RoomCornerB ReflectiveSurfacesCode EchoTimings EchoWall; do
            grep -Fq "$token" /tmp/dechorate-sofa.py
          done
          grep -Fq 'The MIT License (MIT)' /tmp/dechorate-sofa.py
          grep -Fq 'The MIT License' /tmp/dechorate-LICENSE

      - name: Verify public SOFA distribution index without downloading payload
        shell: python
        run: |
          import json, re, urllib.request
          from pathlib import Path
          m = json.loads(Path('.github/research/continuous-optimization/development-v3/dechorate-source-qualification-v1.json').read_text())
          url = m['distribution']['index_url']
          with urllib.request.urlopen(url, timeout=30) as r:
              html = r.read().decode('utf-8', errors='strict')
          assert 'dEchorate_annotations.h5' in html
          names = sorted(set(re.findall(r'dEchorate_room[^"<> ]+\.sofa', html)))
          assert names, 'SOFA distribution has no discoverable files'
          assert all(name.startswith('dEchorate_room') for name in names)
          print(f'qualification index visible: {len(names)} SOFA filenames; payload not downloaded')

      - name: Enforce qualification-only boundary
        shell: python
        run: |
          import json
          from pathlib import Path
          m = json.loads(Path('.github/research/continuous-optimization/development-v3/dechorate-source-qualification-v1.json').read_text())
          prohibited = set(m['prohibited'])
          required = {
              'modify_activity_or_dtd',
              'derive_or_tune_gain_normalization',
              'derive_or_tune_thresholds',
              'change_public_double_talk_semantics',
              'create_source_candidate',
              'grant_hil_authority',
              'grant_product_certification_authority',
              'grant_release_or_shipping_authority',
              'use_unfrozen_dechorate_payload_for_acoustic_conclusions'
          }
          assert required <= prohibited
          assert m['zenodo_provenance_only']['not_execution_source'] is True
          assert m['distribution']['license_evidence']['distribution_license_must_be_verified_per_file_before_acoustic_use'] is True
          assert m['distribution']['license_evidence']['primary_dataset_license_verified'] is False
          assert m['distribution']['license_evidence']['secondary_reports_are_authority'] is False
          assert m['distribution']['license_evidence']['materialization_requires_primary_license_evidence'] is True
          assert m['next_authorized_step']['may_download_annotation_sidecar'] is False
          assert m['next_authorized_step']['may_download_sofa_files'] is False
          assert m['next_authorized_step']['may_download_zenodo_payload'] is False
