name: NS quality sweep

on:
  push:
    branches: [validation/v1.3.0]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Ablate capture-only stages
        shell: bash
        run: |
          set -euo pipefail
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-validation --seed 1307 >/dev/null
          for variant in default no_ns no_hpf no_agc ns_only hpf_only none; do
            git checkout -- examples/process_pcm.c
            python3 - "$variant" <<'PY'
          from pathlib import Path
          import sys

          variant = sys.argv[1]
          path = Path('examples/process_pcm.c')
          text = path.read_text()
          anchor = '''    if (capture_only) {\n        cfg.stages &= ~(AP_STAGE_SYNC | AP_STAGE_AEC | AP_STAGE_RES);\n        cfg.enable_delay_tracking = 0u;\n        cfg.enable_clock_drift_compensation = 0u;\n    }\n'''
          extra = {
              'default': '',
              'no_ns': '    if (capture_only) cfg.stages &= ~AP_STAGE_NS;\n',
              'no_hpf': '    if (capture_only) cfg.stages &= ~AP_STAGE_HPF;\n',
              'no_agc': '    if (capture_only) cfg.stages &= ~AP_STAGE_AGC;\n',
              'ns_only': '    if (capture_only) cfg.stages = AP_STAGE_NS;\n',
              'hpf_only': '    if (capture_only) cfg.stages = AP_STAGE_HPF;\n',
              'none': '    if (capture_only) cfg.stages = 0u;\n',
          }[variant]
          if anchor not in text:
              raise SystemExit('capture-only anchor not found')
          path.write_text(text.replace(anchor, anchor + extra, 1))
          PY
            rm -rf "build-sweep-$variant"
            cmake -S . -B "build-sweep-$variant" -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_BUILD_TESTS=OFF >/dev/null
            cmake --build "build-sweep-$variant" --target ap_process_pcm --parallel >/dev/null
            python3 validation/tools/run_validation.py \
              --corpus /tmp/ap-validation/corpus.json \
              --policy validation/policies/validation-smoke.json \
              --dataset-lock validation/datasets.lock.json \
              --processor "./build-sweep-$variant/ap_process_pcm" \
              --output "/tmp/report-$variant.json" >/dev/null
            python3 - "$variant" <<'PY'
          import json, sys
          report = json.load(open('/tmp/report-' + sys.argv[1] + '.json'))
          case = next(x for x in report['cases'] if x['case_id'] == 'ns-stationary')
          print(json.dumps({
              'variant': sys.argv[1],
              'validation_result': report['validation_result'],
              'passed_cases': report['summary']['passed_cases'],
              'ns_metrics': case['metrics'],
              'ns_violations': case['violations'],
          }, sort_keys=True))
          PY
          done
