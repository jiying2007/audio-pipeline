name: Frontend Research

on:
  pull_request:
    paths:
      - 'tests/validation/frontend_evolution/dualmic_stages*'
      - 'tests/validation/frontend_evolution/test_dualmic_stages*'
      - 'tests/validation/frontend_evolution/dualmic_gain_d2*'
      - 'tests/validation/frontend_evolution/test_dualmic_gain_d2*'
      - 'tools/codex_assets/dualmic_stages_build.py'
      - 'docs/research/frontend-evolution-v1/DUALMIC_STAGES_D1_PLAN.zh-CN.md'
      - 'docs/research/frontend-evolution-v1/dualmic-stages-d1-source-lock.json'
      - 'docs/research/frontend-evolution-v1/DUALMIC_GAIN_D2_PLAN.zh-CN.md'
      - 'docs/research/frontend-evolution-v1/dualmic-gain-d2-input-lock.json'
      - 'tests/validation/frontend_evolution/dualmic_zero_d3*'
      - 'tests/validation/frontend_evolution/test_dualmic_zero_d3*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_ZERO_D3*'
      - 'docs/research/frontend-evolution-v1/dualmic-zero-d3*'
      - 'tests/validation/frontend_evolution/dualmic_window_d4*'
      - 'tests/validation/frontend_evolution/test_dualmic_window_d4*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_WINDOW_D4*'
      - 'docs/research/frontend-evolution-v1/dualmic-window-d4*'
      - 'tests/validation/frontend_evolution/dualmic_target_gate_d5*'
      - 'tests/validation/frontend_evolution/test_dualmic_target_gate_d5*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_TARGET_GATE_D5*'
      - 'docs/research/frontend-evolution-v1/dualmic-target-gate-d5*'
      - 'tests/validation/frontend_evolution/dualmic_gain_ramp_d6*'
      - 'tests/validation/frontend_evolution/test_dualmic_gain_ramp_d6*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_GAIN_RAMP_D6*'
      - 'docs/research/frontend-evolution-v1/dualmic-gain-ramp-d6*'
      - 'tests/validation/frontend_evolution/dualmic_upstream_d7*'
      - 'tests/validation/frontend_evolution/test_dualmic_upstream_d7*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_UPSTREAM_D7*'
      - 'docs/research/frontend-evolution-v1/dualmic-upstream-d7*'
      - 'tests/validation/frontend_evolution/dualmic_broadside_output_d8*'
      - 'tests/validation/frontend_evolution/test_dualmic_broadside_output_d8*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_BROADSIDE_OUTPUT_D8*'
      - 'docs/research/frontend-evolution-v1/dualmic-broadside-output-d8*'
      - '.github/workflows/frontend-research.yml'
  push:
    branches: [main]
    paths:
      - 'tests/validation/frontend_evolution/dualmic_stages*'
      - 'tests/validation/frontend_evolution/test_dualmic_stages*'
      - 'tests/validation/frontend_evolution/dualmic_gain_d2*'
      - 'tests/validation/frontend_evolution/test_dualmic_gain_d2*'
      - 'tools/codex_assets/dualmic_stages_build.py'
      - 'docs/research/frontend-evolution-v1/DUALMIC_STAGES_D1_PLAN.zh-CN.md'
      - 'docs/research/frontend-evolution-v1/dualmic-stages-d1-source-lock.json'
      - 'docs/research/frontend-evolution-v1/DUALMIC_GAIN_D2_PLAN.zh-CN.md'
      - 'docs/research/frontend-evolution-v1/dualmic-gain-d2-input-lock.json'
      - 'tests/validation/frontend_evolution/dualmic_zero_d3*'
      - 'tests/validation/frontend_evolution/test_dualmic_zero_d3*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_ZERO_D3*'
      - 'docs/research/frontend-evolution-v1/dualmic-zero-d3*'
      - 'tests/validation/frontend_evolution/dualmic_window_d4*'
      - 'tests/validation/frontend_evolution/test_dualmic_window_d4*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_WINDOW_D4*'
      - 'docs/research/frontend-evolution-v1/dualmic-window-d4*'
      - 'tests/validation/frontend_evolution/dualmic_target_gate_d5*'
      - 'tests/validation/frontend_evolution/test_dualmic_target_gate_d5*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_TARGET_GATE_D5*'
      - 'docs/research/frontend-evolution-v1/dualmic-target-gate-d5*'
      - 'tests/validation/frontend_evolution/dualmic_gain_ramp_d6*'
      - 'tests/validation/frontend_evolution/test_dualmic_gain_ramp_d6*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_GAIN_RAMP_D6*'
      - 'docs/research/frontend-evolution-v1/dualmic-gain-ramp-d6*'
      - 'tests/validation/frontend_evolution/dualmic_upstream_d7*'
      - 'tests/validation/frontend_evolution/test_dualmic_upstream_d7*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_UPSTREAM_D7*'
      - 'docs/research/frontend-evolution-v1/dualmic-upstream-d7*'
      - 'tests/validation/frontend_evolution/dualmic_broadside_output_d8*'
      - 'tests/validation/frontend_evolution/test_dualmic_broadside_output_d8*'
      - 'docs/research/frontend-evolution-v1/DUALMIC_BROADSIDE_OUTPUT_D8*'
      - 'docs/research/frontend-evolution-v1/dualmic-broadside-output-d8*'
      - '.github/workflows/frontend-research.yml'
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        options: [dualmic-stages-d1, dualmic-zero-d3-input, dualmic-zero-d3, dualmic-window-d4, dualmic-target-gate-d5, dualmic-gain-ramp-d6, dualmic-upstream-d7, dualmic-broadside-output-d8]
        default: dualmic-stages-d1
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: frontend-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      d1: ${{ steps.select.outputs.d1 }}
      d3: ${{ steps.select.outputs.d3 }}
      d3_execute: ${{ steps.select.outputs.d3_execute }}
      d4: ${{ steps.select.outputs.d4 }}
      d5: ${{ steps.select.outputs.d5 }}
      d6: ${{ steps.select.outputs.d6 }}
      d7: ${{ steps.select.outputs.d7 }}
      d8: ${{ steps.select.outputs.d8 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: select
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          event = os.environ['EVENT_NAME']
          # D8-only selection exits before historical selectors see the appended lane.
          import time
          d8_scope_start = time.monotonic()
          def d8_git(*args):
              remaining = 300 - (time.monotonic() - d8_scope_start)
              if remaining <= 0:
                  raise SystemExit('D8_SCOPE_TIMEOUT')
              env = dict(os.environ, GIT_OPTIONAL_LOCKS='0')
              return subprocess.check_output(['git', '-c', 'core.fsmonitor=false',
                  '-c', 'core.untrackedCache=false', *args], env=env, timeout=min(30, remaining)).decode()
          d8_tokens = ('dualmic_broadside_output_d8', 'DUALMIC_BROADSIDE_OUTPUT_D8',
                       'dualmic-broadside-output-d8')
          d8 = event == 'workflow_dispatch' and os.environ['SELECTED_EXPERIMENT'] == 'dualmic-broadside-output-d8'
          d8_marker = '\n  dualmic-broadside-output-d8:\n'
          if event != 'workflow_dispatch':
              d8_paths = d8_git('diff', '--name-only', os.environ['BASE_SHA'], 'HEAD').splitlines()
              d8 = any(any(token in p for token in d8_tokens) for p in d8_paths)
              if '.github/workflows/frontend-research.yml' in d8_paths:
                  d8_prior = d8_git('show', os.environ['BASE_SHA'] + ':.github/workflows/frontend-research.yml')
                  d8_current = Path('.github/workflows/frontend-research.yml').read_text()
                  if d8_marker in d8_current and (d8_marker not in d8_prior or
                          d8_current.split(d8_marker, 1)[-1] != d8_prior.split(d8_marker, 1)[-1]):
                      d8 = True
              if d8 and any(not (any(token in p for token in d8_tokens) or p == '.github/workflows/frontend-research.yml')
                            for p in d8_paths):
                  raise SystemExit('D8_REQUIRES_SEPARATE_RESEARCH_CHANGE')
          if d8:
              d8_frozen = d8_git('show', '1b5b01e0f2580ec9e05dfacff2ee1d292c438172:.github/workflows/frontend-research.yml')
              d8_current = Path('.github/workflows/frontend-research.yml').read_text()
              if d8_current.count(d8_marker) != 1 or d8_current.split('  matrix:\n', 1)[1].split(d8_marker, 1)[0] != d8_frozen.split('  matrix:\n', 1)[1]:
                  raise SystemExit('D8_HISTORICAL_JOBS_CHANGED')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('d1=false\nd3=false\nd3_execute=false\nd4=false\nd5=false\nd6=false\nd7=false\nd8=true\n')
              raise SystemExit(0)
          # D7-only selection exits before historical selectors inspect appended jobs.
          # Historical jobs below matrix remain byte-identical to e348843.
          import time
          scope_start = time.monotonic()
          def d7_git(*args):
              left = 300 - (time.monotonic() - scope_start)
              if left <= 0:
                  raise SystemExit('D7_SCOPE_TIMEOUT')
              return subprocess.check_output(['git', *args], timeout=min(30, left)).decode()
          d7 = event == 'workflow_dispatch' and os.environ['SELECTED_EXPERIMENT'] == 'dualmic-upstream-d7'
          if event != 'workflow_dispatch':
              d7_paths = d7_git('diff', '--name-only', os.environ['BASE_SHA'], 'HEAD').splitlines()
              d7 = any('dualmic_upstream_d7' in p or 'DUALMIC_UPSTREAM_D7' in p or 'dualmic-upstream-d7' in p for p in d7_paths)
              if '.github/workflows/frontend-research.yml' in d7_paths:
                  d7_prior = d7_git('show', os.environ['BASE_SHA'] + ':.github/workflows/frontend-research.yml')
                  d7_current = Path('.github/workflows/frontend-research.yml').read_text()
                  d7_marker = '\n  dualmic-upstream-d7:\n'
                  if d7_current.split(d7_marker, 1)[-1] != d7_prior.split(d7_marker, 1)[-1]:
                      d7 = True
              if d7 and any(not ('dualmic_upstream_d7' in p or 'DUALMIC_UPSTREAM_D7' in p or 'dualmic-upstream-d7' in p or p in (
                      '.github/workflows/frontend-research.yml', 'docs/research/frontend-evolution-v1/README.md')) for p in d7_paths):
                  raise SystemExit('D7_REQUIRES_SEPARATE_RESEARCH_CHANGE')
          if d7:
              frozen_workflow = d7_git('show', 'e348843a570503728930f06451633262b2546fa5:.github/workflows/frontend-research.yml')
              current_workflow = Path('.github/workflows/frontend-research.yml').read_text()
              marker = '\n  dualmic-upstream-d7:\n'
              if current_workflow.count(marker) != 1 or current_workflow.split('  matrix:\n', 1)[1].split(marker, 1)[0] != frozen_workflow.split('  matrix:\n', 1)[1]:
                  raise SystemExit('D7_HISTORICAL_JOBS_CHANGED')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write('d1=false\nd3=false\nd3_execute=false\nd4=false\nd5=false\nd6=false\nd7=true\n')
              raise SystemExit(0)
          if event == 'workflow_dispatch':
              d1 = os.environ['SELECTED_EXPERIMENT'] == 'dualmic-stages-d1'
              d3 = os.environ['SELECTED_EXPERIMENT'] in ('dualmic-zero-d3-input', 'dualmic-zero-d3')
              d3_execute = os.environ['SELECTED_EXPERIMENT'] == 'dualmic-zero-d3'
              d4 = os.environ['SELECTED_EXPERIMENT'] == 'dualmic-window-d4'
              d5 = os.environ['SELECTED_EXPERIMENT'] == 'dualmic-target-gate-d5'
              d6 = os.environ['SELECTED_EXPERIMENT'] == 'dualmic-gain-ramp-d6'
              if not (d1 or d3 or d4 or d5 or d6):
                  raise SystemExit('unknown experiment')
          else:
              paths = subprocess.check_output(['git','diff','--name-only',os.environ['BASE_SHA'],'HEAD']).decode().splitlines()
              d3 = any('dualmic_zero_d3' in p or 'DUALMIC_ZERO_D3' in p or 'dualmic-zero-d3' in p for p in paths)
              d4 = any('dualmic_window_d4' in p or 'DUALMIC_WINDOW_D4' in p or 'dualmic-window-d4' in p for p in paths)
              d5 = any('dualmic_target_gate_d5' in p or 'DUALMIC_TARGET_GATE_D5' in p or 'dualmic-target-gate-d5' in p for p in paths)
              d6 = any('dualmic_gain_ramp_d6' in p or 'DUALMIC_GAIN_RAMP_D6' in p or 'dualmic-gain-ramp-d6' in p for p in paths)
              d3_execute = d3 and Path('tests/validation/frontend_evolution/dualmic_zero_d3.c').is_file()
              d1 = any(('dualmic_stages' in p or 'dualmic_gain_d2' in p or
                        'DUALMIC_STAGES_D1' in p or 'DUALMIC_GAIN_D2' in p or
                        'dualmic-stages-d1' in p or 'dualmic-gain-d2' in p) for p in paths)
              if '.github/workflows/frontend-research.yml' in paths:
                  prior_workflow = subprocess.check_output(['git','show',os.environ['BASE_SHA']+':.github/workflows/frontend-research.yml']).decode()
                  current_workflow = Path('.github/workflows/frontend-research.yml').read_text()
                  d6_marker = '\n  dualmic-gain-ramp-d6:\n'
                  if current_workflow.split(d6_marker,1)[-1] != prior_workflow.split(d6_marker,1)[-1]:
                      d6 = True
                  if d6 and not (d1 or d3 or d4 or d5):
                      if current_workflow.count(d6_marker) != 1:
                          raise SystemExit('D6_JOB_MISSING_OR_DUPLICATE')
                      frozen = subprocess.check_output(['git','show','6c7752800838f2c7fd707593c658f250a071e98c:.github/workflows/frontend-research.yml']).decode()
                      original_jobs = frozen.split('  matrix:\n',1)[1]
                      current_jobs = current_workflow.split('  matrix:\n',1)[1].split(d6_marker,1)[0]
                      if current_jobs != original_jobs:
                          raise SystemExit('D6_ONLY_CHANGE_MODIFIED_HISTORICAL_JOBS')
                  else:
                      marker = '\n  dualmic-target-gate-d5:\n'
                      if current_workflow.split(marker,1)[-1] != prior_workflow.split(marker,1)[-1]:
                          d5 = True
                      if d5 and not (d1 or d3 or d4):
                          if current_workflow.count(marker) != 1:
                              raise SystemExit('D5_JOB_MISSING_OR_DUPLICATE')
                          old = subprocess.check_output(['git','show','e0f2be9bf6273baa46149062ec7ea700cd76387e:.github/workflows/frontend-research.yml']).decode()
                          new = Path('.github/workflows/frontend-research.yml').read_text()
                          original = old.split('  matrix:\n',1)[1]
                          current = new.split('  matrix:\n',1)[1].split('\n  dualmic-target-gate-d5:\n',1)[0]
                          if current != original:
                              raise SystemExit('D5_ONLY_CHANGE_MODIFIED_HISTORICAL_JOBS')
                      elif (d3 or d4) and not d1:
                          # D3/D4-only additions must not change the existing D1 job.
                          old = subprocess.check_output(['git','show','8310359974a84407630e0e5c502e24f3f1c76b56:.github/workflows/frontend-research.yml']).decode()
                          new = Path('.github/workflows/frontend-research.yml').read_text()
                          original = old.split('  matrix:\n',1)[1]
                          current = new.split('  matrix:\n',1)[1].split('\n  dualmic-zero-d3-input:\n',1)[0]
                          current = current.replace("    needs: scope\n    if: needs.scope.outputs.d1 == 'true'\n", '', 1)
                          if current.rstrip() != original.rstrip():
                              raise SystemExit('D3_ONLY_CHANGE_MODIFIED_ORIGINAL_D1_JOB')
                          if d4 and not d3:
                              base = subprocess.check_output(['git','show','dec7bf7c94f0e2a99d415eb497357e2ea44a5dcc:.github/workflows/frontend-research.yml']).decode()
                              original_d3 = base.split('\n  dualmic-zero-d3-input:\n',1)[1]
                              current_d3 = new.split('\n  dualmic-zero-d3-input:\n',1)[1].split('\n  dualmic-window-d4:\n',1)[0]
                              if original_d3.rstrip() != current_d3.rstrip():
                                  raise SystemExit('D4_ONLY_CHANGE_MODIFIED_ORIGINAL_D3_JOB')
                      else:
                          d1 = True
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('d7=false\n')
              out.write('d1='+str(d1).lower()+'\nd3='+str(d3).lower()+'\nd3_execute='+str(d3_execute).lower()+'\nd4='+str(d4).lower()+'\nd5='+str(d5).lower()+'\nd6='+str(d6).lower()+'\n')
          PY
  matrix:
    needs: scope
    if: needs.scope.outputs.d1 == 'true'
    name: ${{ matrix.experiment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXECUTION_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    strategy:
      fail-fast: false
      matrix:
        experiment: [dualmic-stages-d1]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check source reader boundaries and exact execution checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/ap-dualmic-d1
          timeout 300s python3 tests/validation/frontend_evolution/test_dualmic_stages_source.py \
            2>&1 | tee /tmp/ap-dualmic-d1/source-tests.log
          timeout 300s python3 tests/validation/frontend_evolution/test_dualmic_gain_d2_integrity.py \
            --output /tmp/ap-dualmic-d1/gain-integrity-tests.json \
            2>&1 | tee /tmp/ap-dualmic-d1/gain-integrity-tests.log
          git status --porcelain > /tmp/ap-dualmic-d1/checkout-status.txt
          test ! -s /tmp/ap-dualmic-d1/checkout-status.txt
          git rev-parse HEAD > /tmp/ap-dualmic-d1/source-revision.txt
          test "$(git rev-parse HEAD)" = "$EXECUTION_SHA"
      - name: Acquire the two hash-locked original artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          timeout 300s python3 tests/validation/frontend_evolution/dualmic_stages_source.py \
            --output /tmp/ap-dualmic-d1/originals \
            2>&1 | tee /tmp/ap-dualmic-d1/source.log
      - name: Reject omitted or altered original bindings after resealing
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s python3 tests/validation/frontend_evolution/test_dualmic_stages_d1_integrity.py \
            --original-a /tmp/ap-dualmic-d1/originals/A \
            --original-c /tmp/ap-dualmic-d1/originals/C \
            --output /tmp/ap-dualmic-d1/integrity-tests.json \
            2>&1 | tee /tmp/ap-dualmic-d1/integrity-tests.log
      - name: Build exact ordinary and neutral observer processors
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s python3 tools/codex_assets/dualmic_stages_build.py \
            --source "$PWD" --source-revision "$EXECUTION_SHA" \
            --output /tmp/ap-dualmic-d1/build \
            2>&1 | tee /tmp/ap-dualmic-d1/build.log
      - name: Execute all 60 original views and analyze fixed stage spans
        shell: bash
        run: |
          set -euo pipefail
          timeout 600s python3 tests/validation/frontend_evolution/dualmic_stages_d1.py run \
            --original-a /tmp/ap-dualmic-d1/originals/A \
            --original-c /tmp/ap-dualmic-d1/originals/C \
            --build-dir /tmp/ap-dualmic-d1/build --output /tmp/ap-dualmic-d1/result \
            2>&1 | tee /tmp/ap-dualmic-d1/run.log
      - name: Reread the complete neutral evidence without DSP
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s python3 tests/validation/frontend_evolution/dualmic_stages_d1.py verify \
            --output /tmp/ap-dualmic-d1/result \
            2>&1 | tee /tmp/ap-dualmic-d1/verify.log
      - name: Replay exact original AGC and decompose ordered gain views
        shell: bash
        run: |
          set -euo pipefail
          timeout 900s python3 tests/validation/frontend_evolution/dualmic_gain_d2.py run \
            --parent-result /tmp/ap-dualmic-d1/result \
            --build-dir /tmp/ap-dualmic-d1/build --output /tmp/ap-dualmic-d1/gain-d2 \
            2>&1 | tee /tmp/ap-dualmic-d1/gain-run.log
      - name: Reread complete gain decomposition without DSP
        shell: bash
        run: |
          set -euo pipefail
          timeout 300s python3 tests/validation/frontend_evolution/dualmic_gain_d2.py verify \
            --parent-result /tmp/ap-dualmic-d1/result --output /tmp/ap-dualmic-d1/gain-d2 \
            2>&1 | tee /tmp/ap-dualmic-d1/gain-verify.log
      - name: Preserve original bytes, diagnostics and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-research-${{ matrix.experiment }}-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: |
            /tmp/ap-dualmic-d1/*.log
            /tmp/ap-dualmic-d1/*.txt
            /tmp/ap-dualmic-d1/*.json
            /tmp/ap-dualmic-d1/originals/
            /tmp/ap-dualmic-d1/build/*.json
            /tmp/ap-dualmic-d1/build/*.log
            /tmp/ap-dualmic-d1/build/exact-source.tar
            /tmp/ap-dualmic-d1/build/logs/
            /tmp/ap-dualmic-d1/build/baseline-build/ap_process_pcm
            /tmp/ap-dualmic-d1/build/baseline-build/ap_build_info_dump
            /tmp/ap-dualmic-d1/build/baseline-build/libaudio_pipeline.a
            /tmp/ap-dualmic-d1/build/baseline-build/generated/audio_pipeline/audio_pipeline_build.h
            /tmp/ap-dualmic-d1/build/baseline-build/CMakeFiles/audio_pipeline.dir/flags.make
            /tmp/ap-dualmic-d1/build/observer-build/ap_process_pcm_observer
            /tmp/ap-dualmic-d1/build/observer-build/libaudio_pipeline.a
            /tmp/ap-dualmic-d1/build/observer-build/generated/audio_pipeline/audio_pipeline_build.h
            /tmp/ap-dualmic-d1/build/observer-build/CMakeFiles/audio_pipeline.dir/flags.make
            /tmp/ap-dualmic-d1/build/observer-source/src/activity/ap_activity.c
            /tmp/ap-dualmic-d1/build/observer-source/src/aec/ap_aec_mdf.c
            /tmp/ap-dualmic-d1/build/observer-source/src/enhance/ap_ns.c
            /tmp/ap-dualmic-d1/build/observer-source/src/enhance/ap_agc.c
            /tmp/ap-dualmic-d1/build/observer-source/src/enhance/ap_res.c
