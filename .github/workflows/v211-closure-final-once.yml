name: V2.1.1 Closure Final One-Time

on:
  push:
    branches: [feat/v2.1.1-auto-real-closure]
    paths: [.github/workflows/v211-closure-final-once.yml]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/v2.1.1-auto-real-closure
          fetch-depth: 0
      - name: Materialize final v2.1.1 product tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          def gha(body): return '$' + '{{ ' + body + ' }}'

          p=Path('CMakeLists.txt'); t=p.read_text(); t=t.replace('project(audio_pipeline VERSION 2.1.0 LANGUAGES C)','project(audio_pipeline VERSION 2.1.1 LANGUAGES C)',1); p.write_text(t)
          p=Path('CHANGELOG.md'); t=p.read_text()
          if not t.startswith('# 2.1.1'):
              p.write_text('# 2.1.1\n\n- Make post-release Extended Real automation reliable through the explicit `extended-real-post-release` repository-dispatch channel.\n- Add a required hosted real-audio smoke using four exact-revision SHA-256-pinned CC-BY-4.0 Microsoft P.808 clips.\n- Verify upstream SHA-256/Git blob identity, WAV geometry, stereo-to-mono materialization, 48 kHz boundary resampling, processor safety and hash-bound evidence on every PR/main Verify.\n- Hosted real smoke remains validation evidence only; Extended Real, DUT HIL and 72 h Product Certification remain separate higher-trust gates.\n\n'+t)

          auto='''name: Extended Real Automation\n\non:\n  repository_dispatch:\n    types: [extended-real-post-release]\n  schedule:\n    - cron: '17 3 * * 0'\n  workflow_dispatch:\n\npermissions:\n  actions: write\n  contents: read\n\nconcurrency:\n  group: extended-real-automation\n  cancel-in-progress: false\n\njobs:\n  dispatch:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5\n        with:\n          fetch-depth: 0\n      - name: Resolve exact source and automation profile\n        id: request\n        env:\n          EVENT_NAME: @@EVENT@@\n          RELEASE_REF: @@REF@@\n          RELEASE_TAG: @@TAG@@\n          EXTENDED_REAL_ENABLED: @@ENABLED@@\n          EXTENDED_REAL_DATA_ROOT: @@ROOT@@\n        run: |\n          set -euo pipefail\n          if [ "$EXTENDED_REAL_ENABLED" != true ]; then\n            echo 'EXTENDED_REAL_REQUIRED_BUT_DISABLED: enable only after audio-validation runner and materialized cache are genuinely ready.' >&2\n            exit 1\n          fi\n          data_root=${EXTENDED_REAL_DATA_ROOT:-/opt/audio-validation-extended}\n          case "$EVENT_NAME" in\n            repository_dispatch)\n              source_sha=$RELEASE_REF\n              profile=commercial-core\n              [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'release_ref must be exact 40-hex SHA' >&2; exit 2; }\n              test -n "$RELEASE_TAG"\n              git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"\n              test "$(git rev-list -n1 "$RELEASE_TAG")" = "$source_sha"\n              ;;\n            schedule|workflow_dispatch)\n              git fetch origin main\n              source_sha=$(git rev-parse origin/main)\n              profile=commercial-plus\n              ;;\n            *) echo "unsupported automation event: $EVENT_NAME" >&2; exit 2 ;;\n          esac\n          git cat-file -e "$source_sha^{commit}"\n          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"\n          echo "profile=$profile" >> "$GITHUB_OUTPUT"\n          echo "data_root=$data_root" >> "$GITHUB_OUTPUT"\n      - name: Dispatch canonical extended-real workflow\n        env:\n          GH_TOKEN: @@TOKEN@@\n          SOURCE_SHA: @@SOURCE@@\n          PROFILE: @@PROFILE@@\n          DATA_ROOT: @@DATAROOT@@\n        run: |\n          set -euo pipefail\n          gh workflow run validation-extended-real.yml --ref main \\\n            -f "source_sha=$SOURCE_SHA" -f "profile=$PROFILE" -f "data_root=$DATA_ROOT" \\\n            -f limit_per_dataset=48 -f direct_limit=24 -f derived_limit=16 -f holdout_percent=20\n          echo "EXTENDED_REAL_DISPATCHED profile=$PROFILE source=$SOURCE_SHA"\n'''
          rep={'@@EVENT@@':gha('github.event_name'),'@@REF@@':gha('github.event.client_payload.release_ref'),'@@TAG@@':gha('github.event.client_payload.tag'),'@@ENABLED@@':gha('vars.EXTENDED_REAL_ENABLED'),'@@ROOT@@':gha('vars.EXTENDED_REAL_DATA_ROOT'),'@@TOKEN@@':gha('github.token'),'@@SOURCE@@':gha('steps.request.outputs.source_sha'),'@@PROFILE@@':gha('steps.request.outputs.profile'),'@@DATAROOT@@':gha('steps.request.outputs.data_root')}
          for a,b in rep.items(): auto=auto.replace(a,b)
          Path('.github/workflows/extended-real-automation.yml').write_text(auto)

          p=Path('.github/workflows/release.yml'); t=p.read_text()
          if 'event_type=extended-real-post-release' not in t:
              t=t.rstrip()+'''\n      - name: Trigger exact-SHA post-release Extended Real validation\n        if: steps.existing.outputs.release != 'true'\n        env:\n          GH_TOKEN: '''+gha('github.token')+'''\n          TAG: '''+gha('steps.version.outputs.tag')+'''\n          VERIFIED_SHA: '''+gha('github.event.workflow_run.head_sha')+'''\n        run: |\n          set -euo pipefail\n          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \\\n            -f event_type=extended-real-post-release \\\n            -f "client_payload[release_ref]=$VERIFIED_SHA" \\\n            -f "client_payload[tag]=$TAG"\n'''
              p.write_text(t)

          p=Path('.github/workflows/verify.yml'); t=p.read_text()
          if '  hosted-real-smoke:' not in t:
              head=gha('needs.impact.outputs.head_sha'); runid=gha('github.run_id')
              job=f'''\n  hosted-real-smoke:\n    needs: [impact, fast-gate]\n    if: always() && needs.fast-gate.result == 'success'\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5\n        with:\n          ref: {head}\n          fetch-depth: 0\n      - uses: ./.github/actions/setup-ccache\n        with:\n          namespace: hosted-real-smoke\n      - name: Validate hosted real-data contract\n        run: |\n          python3 validation/tools/build_hosted_real_corpus.py self-test\n          python3 validation/tools/build_hosted_real_corpus.py validate --lock validation/hosted_real.datasets.lock.json\n      - name: Build exact hosted-real processor\n        run: |\n          revision=$(git rev-parse HEAD)\n          test "$revision" = '{head}'\n          cmake -S . -B build-hosted-real -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON\n          cmake --build build-hosted-real --target ap_process_pcm ap_build_info_dump --parallel\n      - name: Download, hash-bind and enforce P.808 real-audio smoke\n        run: |\n          set -euo pipefail\n          root=/tmp/ap-hosted-real\n          revision=$(git rev-parse HEAD)\n          python3 validation/tools/build_hosted_real_corpus.py build --lock validation/hosted_real.datasets.lock.json --output "$root"\n          python3 validation/tools/run_validation.py --corpus "$root/corpus.json" --policy validation/policies/validation-hosted-real-smoke.json --dataset-lock validation/hosted_real.datasets.lock.json --source-manifest "$root/source-manifest.json" --processor ./build-hosted-real/ap_process_pcm --source-revision "$revision" --output "$root/report.json" --evidence-manifest "$root/evidence-manifest.json" --enforce\n          cp validation/hosted_real.datasets.lock.json "$root/"\n          build-hosted-real/ap_build_info_dump > "$root/build-info.txt"\n          sha256sum build-hosted-real/ap_process_pcm > "$root/processor.sha256"\n          find "$root" -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$root/SHA256SUMS"\n      - name: Upload hosted real-data evidence\n        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1\n        with:\n          name: hosted-real-smoke-{runid}\n          path: |\n            /tmp/ap-hosted-real/corpus.json\n            /tmp/ap-hosted-real/source-manifest.json\n            /tmp/ap-hosted-real/DATASET_ATTRIBUTION.md\n            /tmp/ap-hosted-real/report.json\n            /tmp/ap-hosted-real/evidence-manifest.json\n            /tmp/ap-hosted-real/hosted_real.datasets.lock.json\n            /tmp/ap-hosted-real/build-info.txt\n            /tmp/ap-hosted-real/processor.sha256\n            /tmp/ap-hosted-real/SHA256SUMS\n          if-no-files-found: error\n          retention-days: 30\n\n'''
              t=t.replace('\n  ci:\n',job+'  ci:\n',1)
              t=t.replace('needs: [impact, fast-gate, ci, quality, audio-quality, resource-gates, codeql]','needs: [impact, fast-gate, hosted-real-smoke, ci, quality, audio-quality, resource-gates, codeql]',1)
              fast=gha('needs.fast-gate.result'); hosted=gha('needs.hosted-real-smoke.result')
              t=t.replace(f'          FAST_RESULT: {fast}\n',f'          FAST_RESULT: {fast}\n          HOSTED_REAL_RESULT: {hosted}\n',1)
              t=t.replace('          test "$FAST_RESULT" = success\n','          test "$FAST_RESULT" = success\n          test "$HOSTED_REAL_RESULT" = success\n',1)
              p.write_text(t)

          p=Path('scripts/check-architecture.sh'); t=p.read_text()
          marker='\n# hosted-real-and-post-release-automation-contract-v1\n'
          if marker in t: t=t.split(marker,1)[0].rstrip()
          block='''\n\n# hosted-real-and-post-release-automation-contract-v1\npython3 validation/tools/build_hosted_real_corpus.py self-test\npython3 validation/tools/build_hosted_real_corpus.py validate --lock validation/hosted_real.datasets.lock.json\npython3 - <<'PYHOSTED'\nimport json\nfrom pathlib import Path\ndef require(value, message):\n    if not value:\n        raise SystemExit('hosted-real contract failed: ' + message)\nlock=json.loads(Path('validation/hosted_real.datasets.lock.json').read_text())\nrequire(lock['source_repository']=='microsoft/P.808', 'source repository')\nrequire(len(lock['source_revision'])==40, 'revision')\nrequire(lock['license']=='CC-BY-4.0' and lock['usage_class']=='commercial-validation', 'license isolation')\nrequire(len(lock['clips'])>=4 and all(len(x['sha256'])==64 for x in lock['clips']), 'clip hashes')\npolicy=json.loads(Path('validation/policies/validation-hosted-real-smoke.json').read_text())\nrequire(policy['minimum_cases']>=4 and float(policy['aggregate']['min_pass_rate'])==1.0, 'policy')\nauto=Path('.github/workflows/extended-real-automation.yml').read_text(); release=Path('.github/workflows/release.yml').read_text(); verify=Path('.github/workflows/verify.yml').read_text()\nrequire('repository_dispatch:' in auto and 'types: [extended-real-post-release]' in auto, 'dispatch listener')\nrequire('types: [published]' not in auto, 'unreliable release trigger residue')\nrequire('event_type=extended-real-post-release' in release, 'release dispatch sender')\nrequire('hosted-real-smoke:' in verify and 'HOSTED_REAL_RESULT' in verify, 'required hosted real gate')\nprint('hosted real and post-release automation contracts: OK')\nPYHOSTED\n'''
          p.write_text(t+block)

          sections={'README.md':'Hosted CI also runs a required **Microsoft P.808 real-audio smoke** on four exact-revision CC-BY-4.0 clips. Inputs are SHA-256/Git-blob pinned, never stored in Git, and exercise stereo-to-mono materialization plus 48 kHz boundary resampling. This is validation-grade safety evidence, not far-field or product-certified evidence.','README.zh-CN.md':'Hosted CI 还会强制运行 **Microsoft P.808 真实音频 smoke**：4 个 CC-BY-4.0 clip 固定到 exact revision，并校验 SHA-256/Git blob；不把音频提交进 Git，同时覆盖 stereo-to-mono materialization 与 48 kHz 边界重采样。这只是 validation-grade safety evidence，不代表远场或 product-certified 证据。','docs/TESTING.md':'## Hosted real-audio smoke\n\nEvery PR and `main` Verify runs four SHA-pinned CC-BY-4.0 Microsoft P.808 clips on GitHub-hosted Linux. The gate verifies upstream bytes, WAV geometry, materialization, processor identity, clipping/DC/RMS safety and hash-bound evidence. It is required by `summary` but does not replace Extended Real, DUT HIL or Product Certification.','docs/TESTING.zh-CN.md':'## Hosted 真实音频 smoke\n\n每个 PR 与 `main` Verify 都在 GitHub-hosted Linux 上处理 4 个 SHA 固定的 CC-BY-4.0 Microsoft P.808 clip，验证上游字节、WAV 几何、materialization、processor identity、clipping/DC/RMS safety 与 hash-bound evidence。该 gate 是 required `summary` 的一部分，但不能替代 Extended Real、DUT HIL 或 Product Certification。','validation/README.md':'## Hosted real-audio smoke\n\n`hosted_real.datasets.lock.json` pins four small CC-BY-4.0 Microsoft P.808 WAVs to an exact upstream revision and SHA-256. `Verify` downloads them on GitHub-hosted Linux, rechecks SHA-256 and Git blob identity, materializes mono PCM, and enforces `validation-hosted-real-smoke.json` through the canonical evaluator. Raw third-party audio remains outside this repository.'}
          for name,section in sections.items():
              p=Path(name); text=p.read_text(); marker=section.splitlines()[0]
              if marker not in text: p.write_text(text.rstrip()+"\n\n"+section+"\n")
          PY
      - name: Re-run real audio and all repository contracts
        run: |
          set -euo pipefail
          python3 -m py_compile validation/tools/*.py
          cmake -S . -B build-v211 -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-v211 --target ap_process_pcm ap_build_info_dump --parallel
          root=/tmp/ap-hosted-real-final
          python3 validation/tools/build_hosted_real_corpus.py build --lock validation/hosted_real.datasets.lock.json --output "$root"
          python3 validation/tools/run_validation.py --corpus "$root/corpus.json" --policy validation/policies/validation-hosted-real-smoke.json --dataset-lock validation/hosted_real.datasets.lock.json --source-manifest "$root/source-manifest.json" --processor ./build-v211/ap_process_pcm --source-revision "$(git rev-parse HEAD)" --output "$root/report.json" --evidence-manifest "$root/evidence.json" --enforce
          ruby -e 'require "yaml"; ARGV.each { |p| Psych.parse_file(p) or abort(p) }' .github/workflows/*.yml
          sh scripts/check-architecture.sh
          python3 scripts/docs_consistency.py
          git diff --check
      - name: Commit verified closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt CHANGELOG.md README.md README.zh-CN.md docs/TESTING.md docs/TESTING.zh-CN.md validation/README.md scripts/check-architecture.sh .github/workflows/extended-real-automation.yml .github/workflows/release.yml .github/workflows/verify.yml
          git commit -m 'release: close v2.1.1 automatic real-data validation'
          git push origin HEAD:feat/v2.1.1-auto-real-closure
