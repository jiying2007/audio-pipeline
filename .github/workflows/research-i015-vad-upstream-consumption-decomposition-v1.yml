name: Research I015 VAD Upstream Consumption Decomposition v1
run-name: "i015-vad-upstream-consumption-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i015-vad-upstream-consumption-decomposition-v1.json'
      - 'tests/validation/i015_vad_upstream_consumption_probe.c'
      - 'tests/validation/i015_vad_upstream_consumption_decomposition.py'
      - 'tests/validation/test_i015_one_shot_guard.py'
      - '.github/workflows/research-i015-vad-upstream-consumption-decomposition-v1.yml'
      - 'tests/validation/data/i015-consumed-workflow.yml'
      - 'tests/validation/test_i015_retirement.py'
      - '.github/research/continuous-optimization/development-v4/i015-vad-upstream-consumption-decomposition-v1-result.json'

permissions:
  contents: read

concurrency:
  group: research-i015-vad-upstream-consumption-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i015-vad-upstream-consumption-decomposition-v1.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate I015 contract and evaluator
        run: |
          set -euo pipefail
          python3 tests/validation/test_i015_retirement.py
          python3 -m py_compile tests/validation/i015_vad_upstream_consumption_decomposition.py
          python3 tests/validation/i015_vad_upstream_consumption_decomposition.py --self-test
          python3 tests/validation/test_i015_one_shot_guard.py
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          c = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i015-vad-upstream-consumption-decomposition-v1.json'
          ).read_text())
          assert c['investigation_id'] == 'i015-vad-upstream-consumption-decomposition-v1'
          assert c['authority'] == 'RESEARCH_DIAGNOSTIC_ONLY'
          assert c['source_base_sha'] == '1e08e892b29515b384265e50d9fd809ea7e06bb8'
          assert c['fresh_diagnostic_authority']['seeds'] == [281123, 291123, 301123]
          assert c['budget'] == {
              'candidate_limit': 0,
              'confirmation_limit': 0,
              'diagnostic_execution_limit': 1,
          }
          assert c['parameter_search_allowed'] is False
          assert c['threshold_tuning_allowed'] is False
          assert c['promotion_allowed'] is False
          assert c['shipping_source_change_allowed'] is False
          assert all(value is False for value in c['authority_boundary'].values())

          lanes = c['fixed_lanes']
          assert lanes['shipping'] == {
              'upstream_guard': True,
              'upstream_blend': True,
              'decision_threshold': 0.35,
          }
          assert lanes['no_upstream_evidence'] == {
              'upstream_guard': False,
              'upstream_blend': False,
              'decision_threshold': 0.35,
          }
          assert lanes['blend_only'] == {
              'upstream_guard': False,
              'upstream_blend': True,
              'decision_threshold': 0.35,
          }
          assert lanes['guard_only'] == {
              'upstream_guard': True,
              'upstream_blend': False,
              'decision_threshold': 0.35,
          }

          prior = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i014-ns-upstream-component-decomposition-v1-result.json'
          ).read_text())
          assert prior['status'] == 'CLOSED_DIAGNOSTIC_ONLY'
          assert prior['reviewed_decision'] == (
              'NONSTATIONARY_UPSTREAM_COMPONENT_SYNERGY_SUPPORTED_NO_MAPPING'
          )
          assert prior['summary']['all_synergy_gates_pass'] is True
          PY
          git cat-file -e "1e08e892b29515b384265e50d9fd809ea7e06bb8^{commit}"

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i015-vad-upstream-consumption-contract

      - name: Compile test-only I015 causal probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i015-contract             -DCMAKE_BUILD_TYPE=Release             -DAP_BUILD_BENCH=OFF             -DAP_STRICT_WARNINGS=ON
          cmake --build build-i015-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i015-contract/generated             tests/validation/i015_vad_upstream_consumption_probe.c             build-i015-contract/libaudio_pipeline.a -lm             -o build-i015-contract/i015_vad_upstream_consumption_probe
