name: Research I020 Source-Patch Blind Same-Partition Resume
run-name: "i020-source-patch-blind-resume-contract / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json'
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.patch'
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1-result.json'
      - '.github/research/continuous-optimization/qualifications/i020-vad-weak-start-requires-blend-blind-v1-result.json'
      - '.github/research/continuous-optimization/research_code_candidate_blind.py'
      - '.github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py'
      - '.github/research/continuous-optimization/hosted-validation/resume_code_candidate_blind.py'
      - 'tests/validation/test_i020_code_candidate_blind_one_shot.py'
      - 'tests/validation/test_i020_blind_retirement.py'
      - 'tests/validation/data/i020-consumed-blind-workflow.yml'
      - 'tests/validation/data/i020-consumed-blind-resume-workflow.yml'
      - 'validation/research/evidence/i020-blind-resume-36324803945/**'
      - '.github/workflows/research-i020-vad-weak-start-requires-blend-blind-resume.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate retired I020 same-partition resume contract
        run: |
          set -euo pipefail
          python3 -m py_compile             .github/research/continuous-optimization/research_code_candidate_blind.py             .github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py             .github/research/continuous-optimization/hosted-validation/resume_code_candidate_blind.py             tests/validation/test_i020_blind_retirement.py
          python3 .github/research/continuous-optimization/research_code_candidate_blind.py --self-test
          python3 .github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py --self-test
          python3 .github/research/continuous-optimization/hosted-validation/resume_code_candidate_blind.py --self-test
          python3 tests/validation/test_i020_blind_retirement.py --self-test
          python3 -m json.tool             .github/research/continuous-optimization/qualifications/i020-vad-weak-start-requires-blend-blind-v1-result.json             >/dev/null
