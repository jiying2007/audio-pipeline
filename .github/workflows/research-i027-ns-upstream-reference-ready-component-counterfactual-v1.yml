name: Research I027 NS Upstream Reference-Ready Component Counterfactual v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i027-ns-upstream-reference-ready-component-counterfactual-v1.json'
      - '.github/research/continuous-optimization/development-v4/i027-ns-upstream-reference-ready-component-counterfactual-v1-result.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i027_ns_upstream_reference_ready_component_counterfactual.py'
      - 'tests/validation/test_i027_one_shot_guard.py'
      - 'tests/validation/test_i027_retirement.py'
      - 'tests/validation/data/i027-consumed-workflow.yml'
      - 'validation/research/evidence/i027-36570600341/**'
      - '.github/workflows/research-i027-ns-upstream-reference-ready-component-counterfactual-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed invalid I027 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool             .github/research/continuous-optimization/development-v4/i027-ns-upstream-reference-ready-component-counterfactual-v1-result.json >/dev/null
          python3 -m py_compile             tests/validation/i027_ns_upstream_reference_ready_component_counterfactual.py             tests/validation/test_i027_one_shot_guard.py             tests/validation/test_i027_retirement.py
          python3 tests/validation/i027_ns_upstream_reference_ready_component_counterfactual.py --self-test
          python3 tests/validation/test_i027_one_shot_guard.py
          python3 tests/validation/test_i027_retirement.py
