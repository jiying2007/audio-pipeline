name: Research I039 NS Suppression Transfer Path Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i039-ns-suppression-transfer-path-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i039-ns-suppression-transfer-path-decomposition-v1-result.json'
      - 'tests/validation/i039_ns_suppression_transfer_path_probe.c'
      - 'tests/validation/i039_ns_suppression_transfer_path_decomposition.py'
      - 'tests/validation/test_i039_one_shot_guard.py'
      - 'tests/validation/test_i039_retirement.py'
      - 'tests/validation/data/i039-consumed-workflow.yml'
      - 'validation/research/evidence/i039-36861549133/**'
      - '.github/workflows/research-i039-ns-suppression-transfer-path-decomposition-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I039 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i039-ns-suppression-transfer-path-decomposition-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i039_ns_suppression_transfer_path_decomposition.py \
            tests/validation/test_i039_one_shot_guard.py \
            tests/validation/test_i039_retirement.py
          python3 tests/validation/i039_ns_suppression_transfer_path_decomposition.py --self-test
          python3 tests/validation/test_i039_one_shot_guard.py
          python3 tests/validation/test_i039_retirement.py
