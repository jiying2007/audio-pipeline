name: Resource Gates

on:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: resource-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sku-hard-ceilings:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: resource-sku
      - name: Build representative pipeline SKUs
        run: |
          cmake --preset composition-full
          cmake --preset composition-low
          cmake --preset composition-tiny
          cmake --preset composition-raw
          for p in full low tiny raw; do cmake --build "build/composition-$p" --target ap_state_size --parallel; done
      - name: Enforce absolute pipeline RAM ceilings
        run: |
          set -euo pipefail
          full=$(./build/composition-full/ap_state_size)
          low=$(./build/composition-low/ap_state_size)
          tiny=$(./build/composition-tiny/ap_state_size)
          raw=$(./build/composition-raw/ap_state_size)
          echo "pipeline_state_bytes full=$full low=$low tiny=$tiny raw=$raw"
          test "$full" -le 80000
          test "$low" -le 50000
          test "$tiny" -le 28000
          test "$raw" -le 2048
          test "$low" -lt "$full"
          test "$tiny" -lt "$low"
          test "$raw" -lt "$tiny"
          printf 'P_FULL=%s\nP_LOW=%s\nP_TINY=%s\nP_RAW=%s\n' \
            "$full" "$low" "$tiny" "$raw" > /tmp/resource-pipeline.env
      - name: Enforce runtime RAM ceilings
        run: |
          set -euo pipefail
          cmake -S . -B build/rt-full -DCMAKE_BUILD_TYPE=Release -DAP_RUNTIME_QUEUE_DEPTH=8
          cmake -S . -B build/rt-tiny -DCMAKE_BUILD_TYPE=Release \
            -DAP_RUNTIME_QUEUE_DEPTH=4 -DAP_BUILD_MAX_IO_RATE_HZ=16000 \
            -DAP_BUILD_MAX_INTERNAL_RATE_HZ=8000 -DAP_BUILD_MAX_MIC_CHANNELS=1 \
            -DAP_BUILD_MAX_DELAY_MS=120 -DAP_BUILD_MAX_AEC_TAIL_MS=48 \
            -DAP_MODULES=RESAMPLER,HPF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          cmake --build build/rt-full --parallel
          cmake --build build/rt-tiny --parallel
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-full/generated \
            build/rt-full/libaudio_pipeline_runtime.a build/rt-full/libaudio_pipeline.a -lm -pthread -o /tmp/rt-full
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-tiny/generated \
            build/rt-tiny/libaudio_pipeline_runtime.a build/rt-tiny/libaudio_pipeline.a -lm -pthread -o /tmp/rt-tiny
          full=$(/tmp/rt-full)
          tiny=$(/tmp/rt-tiny)
          echo "runtime_state_bytes full=$full tiny=$tiny"
          test "$full" -le 32768
          test "$tiny" -le 8192
          test "$tiny" -lt "$full"
          printf 'R_FULL=%s\nR_TINY=%s\n' "$full" "$tiny" > /tmp/resource-runtime.env
      - name: Enforce resource baseline single source
        run: |
          set -euo pipefail
          python3 scripts/resource_baseline.py --self-test
          . /tmp/resource-pipeline.env
          . /tmp/resource-runtime.env
          python3 scripts/resource_baseline.py \
            --full "$P_FULL" --low "$P_LOW" --tiny "$P_TINY" --raw "$P_RAW" \
            --runtime-full "$R_FULL" --runtime-tiny "$R_TINY" \
            --json-output /tmp/resource-baseline.json \
            --markdown-output /tmp/RESOURCE_BASELINE.md
          diff -u ci/resource-baseline.json /tmp/resource-baseline.json
          diff -u docs/generated/RESOURCE_BASELINE.md /tmp/RESOURCE_BASELINE.md
      - name: Enforce final consumer ELF pruning
        run: |
          common="-DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-ffunction-sections\ -fdata-sections -DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections"
          eval cmake -S . -B build/elf-full $common -DAP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          eval cmake -S . -B build/elf-voice $common -DAP_MODULES=RESAMPLER,HPF,BF,NS,AGC,VAD
          eval cmake -S . -B build/elf-raw $common -DAP_MODULES=RESAMPLER
          for p in full voice raw; do cmake --build "build/elf-$p" --target ap_consumer_smoke --parallel; done
          elf_bytes() { size "$1" | awk 'NR==2 {print $1+$2+$3}'; }
          full=$(elf_bytes build/elf-full/ap_consumer_smoke)
          voice=$(elf_bytes build/elf-voice/ap_consumer_smoke)
          raw=$(elf_bytes build/elf-raw/ap_consumer_smoke)
          echo "consumer_elf_bytes full=$full voice=$voice raw=$raw"
          test "$voice" -lt "$full"
          test "$raw" -lt "$voice"
          test $((full - voice)) -ge 64
          test $((voice - raw)) -ge 64

  cortex-a32-rom:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: cortex-a32-rom
      - name: Build Cortex-A32 full and tiny pipeline libraries
        run: |
          common="-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-linux-gnueabihf.cmake -DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_TESTS=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-O2\ -mcpu=cortex-a32\ -mfpu=neon-vfpv4\ -mfloat-abi=hard\ -ffunction-sections\ -fdata-sections"
          eval cmake -S . -B build/arm-full $common -DAP_SIMD_BACKEND=NEON \
            -DAP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          eval cmake -S . -B build/arm-tiny $common -DAP_SIMD_BACKEND=NEON \
            -DAP_BUILD_MAX_IO_RATE_HZ=16000 -DAP_BUILD_MAX_INTERNAL_RATE_HZ=8000 \
            -DAP_BUILD_MAX_MIC_CHANNELS=1 -DAP_BUILD_MAX_DELAY_MS=120 \
            -DAP_BUILD_MAX_AEC_TAIL_MS=48 \
            -DAP_MODULES=RESAMPLER,HPF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          cmake --build build/arm-full --target audio_pipeline --parallel
          cmake --build build/arm-tiny --target audio_pipeline --parallel
      - name: Link representative Cortex-A32 pipeline graphs
        run: |
          common="-O2 -mcpu=cortex-a32 -mfpu=neon-vfpv4 -mfloat-abi=hard -ffunction-sections -fdata-sections -Wl,--gc-sections"
          # shellcheck disable=SC2086
          arm-linux-gnueabihf-gcc $common -Iinclude -Ibuild/arm-full/generated \
            tests/rom_probe.c build/arm-full/libaudio_pipeline.a -lm -o /tmp/rom-full
          # shellcheck disable=SC2086
          arm-linux-gnueabihf-gcc $common -Iinclude -Ibuild/arm-tiny/generated \
            tests/rom_probe.c build/arm-tiny/libaudio_pipeline.a -lm -o /tmp/rom-tiny
      - name: Enforce Cortex-A32 ROM envelopes and physical module pruning
        run: |
          rom_bytes() { arm-linux-gnueabihf-size "$1" | awk 'NR==2 {print $1+$2}'; }
          full=$(rom_bytes /tmp/rom-full)
          tiny=$(rom_bytes /tmp/rom-tiny)
          echo "cortex_a32_pipeline_rom_bytes full=$full tiny=$tiny"
          test "$full" -le 40960
          test "$tiny" -le 40960
          arm-linux-gnueabihf-nm /tmp/rom-full | grep -q 'ap_beamformer'
          if arm-linux-gnueabihf-nm /tmp/rom-tiny | grep -q 'ap_beamformer'; then
            echo "TINY Cortex-A32 ROM unexpectedly retains beamformer symbols" >&2
            exit 3
          fi
          ccache --show-stats

  ssc305-delivery-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: ssc305-delivery-profiles

      - name: Validate delivery-profile qualification contracts
        run: |
          set -euo pipefail
          python3 -m json.tool ci/ssc305-resource-profiles.json >/dev/null
          python3 -m py_compile tests/validation/resource_profile_qualification.py
          python3 tests/validation/resource_profile_qualification.py self-test
          python3 scripts/ssc305_delivery.py self-test

      - name: Build exact conservative and effect-first AArch32 profiles
        run: |
          set -euo pipefail
          cmake --preset ssc305-cortex-a32-low \
            -DAP_BUILD_SOURCE_REVISION='${{ github.sha }}'
          cmake --build build/ssc305-cortex-a32-low --parallel
          cmake --preset cortex-a32-neon \
            -DAP_BUILD_SOURCE_REVISION='${{ github.sha }}'
          cmake --build build/cortex-a32-neon --parallel

      - name: Collect exact AArch32 resource evidence
        run: |
          set -euo pipefail
          mkdir -p resource-profile-out
          cflags='-O3 -mcpu=cortex-a32 -mfpu=neon-fp-armv8 -mfloat-abi=hard -ffunction-sections -fdata-sections'
          ldflags='-Wl,--gc-sections'

          collect_profile() {
            profile_id="$1"
            preset="$2"
            build_dir="$3"
            probe="/tmp/resource-probe-$profile_id"
            rom="/tmp/resource-rom-$profile_id"

            # shellcheck disable=SC2086
            arm-linux-gnueabihf-gcc $cflags $ldflags \
              -Iinclude -I"$build_dir/generated" \
              tests/validation/resource_profile_probe.c \
              "$build_dir/libaudio_pipeline_runtime.a" \
              "$build_dir/libaudio_pipeline.a" \
              -lm -pthread -o "$probe"

            # Keep the selected DSP graph resident in the ROM measurement.
            # shellcheck disable=SC2086
            arm-linux-gnueabihf-gcc $cflags $ldflags \
              -Iinclude -I"$build_dir/generated" \
              tests/rom_probe.c "$build_dir/libaudio_pipeline.a" \
              -lm -o "$rom"

            qemu-arm -cpu max -L /usr/arm-linux-gnueabihf "$probe" \
              > "resource-profile-out/$profile_id-probe.json"
            qemu-arm -cpu max -L /usr/arm-linux-gnueabihf "$probe" \
              > "resource-profile-out/$profile_id-probe-repeat.json"

            python3 tests/validation/resource_profile_qualification.py collect \
              --profile-id "$profile_id" \
              --preset "$preset" \
              --probe "resource-profile-out/$profile_id-probe.json" \
              --probe-repeat "resource-profile-out/$profile_id-probe-repeat.json" \
              --elf "$rom" \
              --library "$build_dir/libaudio_pipeline.a" \
              --library "$build_dir/libaudio_pipeline_runtime.a" \
              --output "resource-profile-out/$profile_id-metrics.json"
          }

          collect_profile conservative ssc305-cortex-a32-low build/ssc305-cortex-a32-low
          collect_profile effect-first cortex-a32-neon build/cortex-a32-neon

      - name: Enforce delivery-profile qualification without target timing claims
        run: |
          set -euo pipefail
          python3 tests/validation/resource_profile_qualification.py qualify \
            --spec ci/ssc305-resource-profiles.json \
            --metrics conservative=resource-profile-out/conservative-metrics.json \
            --metrics effect-first=resource-profile-out/effect-first-metrics.json \
            --source-revision '${{ github.sha }}' \
            --output resource-profile-out/qualification.json

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          q=json.loads(Path("resource-profile-out/qualification.json").read_text())
          print("## SSC305 delivery profiles")
          print(f"- Qualification: {q['status']}")
          for name, item in q["profiles"].items():
              m=item["measured"]
              p=m["probe"]
              rom=m["rom"]
              print(
                  f"- {name}: state={p['pipeline_state_bytes']} B, "
                  f"runtime={p['runtime_state_bytes']} B, "
                  f"text+rodata={rom['text_rodata_bytes']} B, "
                  f"ELF={rom['linked_elf_file_bytes']} B, "
                  f"latency={p['algorithmic_latency_ms']} ms, "
                  f"heap-refs={len(m['direct_heap_allocator_symbol_references'])}, "
                  f"QEMU-probe-repeat-identical={m['qemu_probe_repeat_identical']}"
              )
          print(
              f"- Silicon metrics still calibration-required: "
              f"{len(q['silicon_calibration'])}"
          )
          print("- S004 candidate authority: none")
          print("- Product certification authority: none")
          PY

          find resource-profile-out -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > resource-profile-out/SHA256SUMS

      - name: Package and qualify installed conservative SDK with canonical acoustic replay
        run: |
          set -euo pipefail
          python3 scripts/ssc305_delivery.py reference \
            --source-revision '${{ github.sha }}' \
            --build build/ssc305-cortex-a32-low \
            --resource-qualification resource-profile-out/qualification.json \
            --output resource-profile-out/reference \
            --toolchain-image 'ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c'
          (cd resource-profile-out && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)

      - name: Upload delivery-profile evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssc305-delivery-profiles-${{ github.run_id }}
          path: resource-profile-out/
          if-no-files-found: error
          retention-days: 30


  non-dut-engineering-endurance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build native conservative-envelope engineering test with sanitizers
        run: |
          set -euo pipefail
          python3 scripts/ssc305_delivery.py configure-endurance \
            --build build/engineering-endurance --output engineering-endurance-out \
            --source-revision '${{ github.sha }}'
          cmake --build build/engineering-endurance --parallel 4
      - name: Exercise two million frames, lifecycle and existing fault contracts
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          # This SKU caps delay at 60 ms; generic 100 ms route fixtures stay in normal full CI.
          ctest --test-dir build/engineering-endurance --output-on-failure \
            -R '^ap_(runtime(_extended)?|realtime|pipeline_control|build_info)_tests$' > engineering-endurance-out/ctest.txt 2>&1
          binary=build/engineering-endurance/ap_runtime_extended_tests
          for invalid in '0 64' '2000000 0' '2049 2' '2000000 129' 'abc 64'; do
            read -r frames cycles <<< "$invalid"
            set +e
            "$binary" --endurance "$frames" "$cycles" >/dev/null 2>&1
            status=$?
            set -e
            test "$status" -eq 2
          done
          "$binary" --endurance 2000000 64 > engineering-endurance-out/result.json 2> engineering-endurance-out/sanitizer.log
          cp "$binary" engineering-endurance-out/runtime-extended-tests
          cp build/engineering-endurance/generated/audio_pipeline/audio_pipeline_build.h engineering-endurance-out/
          ldd "$binary" > engineering-endurance-out/linked-libraries.txt
          grep -q libasan engineering-endurance-out/linked-libraries.txt
          grep -q libubsan engineering-endurance-out/linked-libraries.txt
          python3 scripts/ssc305_delivery.py seal-endurance \
            --output engineering-endurance-out --source-revision '${{ github.sha }}'
          cat engineering-endurance-out/result.json >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve engineering evidence and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: non-dut-engineering-endurance-${{ github.run_id }}
          path: engineering-endurance-out/
          if-no-files-found: error
          retention-days: 30
