name: Fix Hosted Resolve Digest Once

on:
  push:
    branches:
      - codex/github-hosted-blind
    paths:
      - .github/workflows/fix-hosted-resolve-digest-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/github-hosted-blind
          fetch-depth: 0
      - name: Restore resolve-stage artifact digest source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/research-candidate-blind-qualification.yml')
          text = path.read_text(encoding='utf-8')
          old = "test \"$(jq -r .digest candidate-out/research-artifact-metadata.json 2>/dev/null || jq -r .digest /tmp/research-artifact.json)\" = \"$ARTIFACT_DIGEST\""
          new = "test \"$(jq -r .digest /tmp/research-artifact.json)\" = \"$ARTIFACT_DIGEST\""
          if old not in text:
              raise SystemExit('expected incorrect resolve digest expression not found')
          text = text.replace(old, new, 1)
          marker = "              'public-minimal.lock.json', 'RUNNER_TEMP/audio-validation-data',\n"
          replacement = marker + "              'jq -r .digest /tmp/research-artifact.json',\n"
          if marker not in text:
              raise SystemExit('contract marker insertion point not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-hosted-resolve-digest-once.yml
          git diff --check
      - name: Commit fix and retire one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): restore resolve artifact digest check'
          git push origin HEAD:codex/github-hosted-blind
