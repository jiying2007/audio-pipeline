name: Terminal Branch GC

on:
  pull_request:
    paths:
      - '.github/workflows/terminal-branch-gc.yml'
      - 'docs/program/terminal-branch-gc.json'
      - '.github/program/terminal_branch_gc.py'
      - 'docs/program/plan.json'
      - 'docs/program/iterations/**'
      - '.github/research/evidence-index.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/terminal-branch-gc.yml'
      - 'docs/program/terminal-branch-gc.json'
      - '.github/program/terminal_branch_gc.py'
      - 'docs/program/plan.json'
      - 'docs/program/iterations/**'
      - '.github/research/evidence-index.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: terminal-branch-gc
  cancel-in-progress: false

jobs:
  audit-and-gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate fail-closed terminal ref contract
        run: |
          set -euo pipefail
          python3 .github/program/terminal_branch_gc.py --self-test
          python3 -m json.tool docs/program/terminal-branch-gc.json >/dev/null
      - name: Audit or apply exact terminal refs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          main_sha=$(git rev-parse origin/main)
          args=(
            --contract docs/program/terminal-branch-gc.json
            --repository "$GITHUB_REPOSITORY"
            --main-sha "$main_sha"
            --output terminal-branch-gc-result.json
          )
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            args+=(--apply --confirmation DELETE_TERMINAL_REFS)
          fi
          python3 .github/program/terminal_branch_gc.py "${args[@]}"
      - name: Publish terminal ref audit
        if: always()
        run: |
          if [ -f terminal-branch-gc-result.json ]; then
            echo '## Terminal branch GC' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat terminal-branch-gc-result.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload terminal ref evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-branch-gc-${{ github.run_id }}
          path: |
            terminal-branch-gc-result.json
            docs/program/terminal-branch-gc.json
          retention-days: 90
          if-no-files-found: error
