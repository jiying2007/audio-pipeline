name: Apply v1.1.1 hardening

on:
  push:
    branches: [hardening/v1.1.1]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply hardening patch
        run: python3 .github/apply_v111.py
      - name: Commit hardening result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "release: harden v1.1.1 product gates"
          git push origin HEAD:hardening/v1.1.1
