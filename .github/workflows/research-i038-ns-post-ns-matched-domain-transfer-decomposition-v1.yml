name: Research I038 NS Post-NS Matched Domain Transfer Decomposition v1
run-name: "i038-matched-domain-transfer / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i037-ns-noise-estimate-aggregation-exact-order-recovery-v1-result.json'
      - '.github/research/continuous-optimization/development-v4/i038-ns-post-ns-matched-domain-transfer-decomposition-v1.json'
      - 'tests/validation/i038_ns_post_ns_matched_domain_transfer_probe.c'
      - 'tests/validation/i038_ns_post_ns_matched_domain_transfer_decomposition.py'
      - 'tests/validation/test_i038_one_shot_guard.py'
      - '.github/workflows/research-i038-ns-post-ns-matched-domain-transfer-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i038-matched-domain-transfer-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i038-ns-post-ns-matched-domain-transfer-decomposition-v1.json
  DEV_ROOT: /tmp/audio-pipeline-i038-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I038 matched-domain transfer contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile \
            tests/validation/i038_ns_post_ns_matched_domain_transfer_decomposition.py \
            tests/validation/test_i038_one_shot_guard.py
          python3 tests/validation/i038_ns_post_ns_matched_domain_transfer_decomposition.py --self-test
          python3 tests/validation/test_i038_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i038-ns-post-ns-matched-domain-transfer-decomposition-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='CANDIDATE_ZERO_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'

          a=c['fresh_diagnostic_authority']
          seeds=a['target_seeds']
          assert len(seeds)==6 and len(set(seeds))==6
          assert all(type(seed) is int and seed>0 for seed in seeds)
          assert a['diagnostic_execution_limit']==1
          assert a['candidate_limit']==0
          assert a['confirmation_limit']==0

          reconstruction=c['exact_order_reconstruction']
          assert reconstruction['post_hoc_tolerance_not_allowed'] is True
          assert 'k=0..256' in reconstruction['accumulation_order']
          assert c['diagnostic_gates']['noise_rms_bitwise_mismatch_frames']==0
          assert c['fixed_horizons']==[1,2,4,8]

          p=c['fixed_spectral_partitions']
          assert p['low_bins']=={'first':0,'last':8,'count':9}
          assert p['speech_bins']=={'first':9,'last':223,'count':215}
          assert p['high_bins']=={'first':224,'last':256,'count':33}
          assert p['boundaries_are_fixed_not_searched'] is True

          predecessor=Path(c['predecessor']['i037_closure'])
          prior=json.loads(predecessor.read_text())
          assert prior['status']==c['predecessor']['required_status']
          assert prior['decision']==c['predecessor']['required_decision']
          assert prior['reviewed_decision']==c['predecessor']['required_reviewed_decision']
          assert prior['proposed_followup_hypothesis']['id']==c['predecessor']['required_followup_id']
          assert prior['proposed_followup_hypothesis']['authority']==c['predecessor']['required_followup_authority']

          def blob(p):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+str(p)],text=True).strip()

          assert blob(predecessor)==c['predecessor']['i037_closure_blob_sha']
          assert blob(Path(c['dataset_authority']['lock_path']))==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(Path(c['dataset_authority']['builder_path']))==c['dataset_authority']['builder_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['probe_path']))==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['evaluator_path']))==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']

          probe=Path(c['diagnostic_inputs']['probe_path']).read_text()
          for token in (
              'float all_noise_sum = 1.0e-18f',
              'all_noise_sum += noise_result.noise',
              'all_noise_rms_bits',
              'ns_noise_rms_bits',
              'noise_rms_bitwise_match',
              'post_ns_previous',
              'post_ns_spectrum',
              'measure_post_ns_components',
              'post_ns_speech_mean_power_dbfs',
          ):
              assert token in probe
          mirror=probe.split('static void mirror_upstream_components',1)[1].split('static void process_vad_diagnostic',1)[0]
          assert mirror.index('all_noise_sum += noise_result.noise') < mirror.index('if (k <= low_last)')
          observation=c['post_ns_matched_domain_observation']
          assert observation['selection_or_tuning_allowed'] is False
          assert observation['domains']==['all','low','speech','high']
          assert c['diagnostic_gates']['max_post_ns_partition_energy_share_gap']==2e-05

          for seed in seeds:
              pattern=rf'(^|[^0-9]){seed}([^0-9]|$)'
              result=subprocess.run(
                  ['git','grep','-n','-E',pattern,'--','.github','tests','validation','docs'],
                  stdout=subprocess.PIPE,text=True,check=False)
              assert result.returncode in (0,1)
              matches=[
                  line for line in result.stdout.splitlines()
                  if line and line.split(':',1)[0] != str(path)
              ]
              assert not matches, (
                  f'I038 seed is not fresh: {seed}\n'+'\n'.join(matches))
          PY
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i038-matched-domain-contract
      - name: Compile I038 matched-domain transfer probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i038-contract \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i038-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i038-contract/generated \
            tests/validation/i038_ns_post_ns_matched_domain_transfer_probe.c \
            build-i038-contract/libaudio_pipeline.a -lm \
            -o build-i038-contract/i038-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I038 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i038-ns-post-ns-matched-domain-transfer-decomposition-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I038 diagnostic requires first-attempt trusted main dispatch')
          def pages(endpoint):
              raw=subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint],text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value
          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I038 run not visible; fail closed')
          consuming={
              'Materialize fresh I038 target public-development-v3 partitions',
              'Evaluate candidate-zero post-NS matched-domain transfer',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts<1:
                  raise SystemExit('invalid prior I038 attempt count')
              for run_attempt in range(1,attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs'
                      '?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if (
                                  step.get('name') in consuming
                                  and step.get('conclusion')!='skipped'
                              ):
                                  raise SystemExit(
                                      f'I038 one-shot authority already consumed by run {run_id}')
          print('I038 one-shot authority: fresh')
          PY
      - name: Bind frozen I038 inputs and unchanged shipping source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.loads(Path('.github/research/continuous-optimization/development-v4/i038-ns-post-ns-matched-domain-transfer-decomposition-v1.json').read_text())
          def blob(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          assert blob(c['predecessor']['i037_closure'])==c['predecessor']['i037_closure_blob_sha']
          assert blob(c['dataset_authority']['lock_path'])==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(c['dataset_authority']['builder_path'])==c['dataset_authority']['builder_git_blob_sha']
          assert blob(c['diagnostic_inputs']['probe_path'])==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(c['diagnostic_inputs']['evaluator_path'])==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']
          PY
          SOURCE_BASE="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["source_base_sha"])')"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD -- \
            src/enhance/ap_noise_tracker.c \
            src/enhance/ap_noise_tracker.h \
            src/enhance/ap_ns.c \
            src/enhance/ap_vad.c \
            src/modules/ap_vad_module.c \
            src/modules/ap_ns_module.c \
            include/audio_pipeline/audio_modules.h \
            src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i038-matched-domain
      - name: Build I038 matched-domain transfer probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i038 \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i038 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i038/generated \
            tests/validation/i038_ns_post_ns_matched_domain_transfer_probe.c \
            build-i038/libaudio_pipeline.a -lm \
            -o build-i038/i038-probe
      - name: Materialize fresh I038 target public-development-v3 partitions
        run: |
          set -euo pipefail
          LOCK="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["lock_path"])')"
          BUILDER="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["builder_path"])')"
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py \
            --lock "$LOCK" --root "$DEV_ROOT" \
            --output /tmp/i038-development-v3-materialization.json
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            python3 "$BUILDER" \
              --lock "$LOCK" \
              --materialization /tmp/i038-development-v3-materialization.json \
              --data-root "$DEV_ROOT" \
              --output "/tmp/i038-target-$seed" \
              --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
          done
      - name: Evaluate candidate-zero post-NS matched-domain transfer
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i038-out
          mkdir -p i038-out/evidence
          target_args=()
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            target_args+=(--target-corpus "/tmp/i038-target-$seed/corpus.json")
          done
          set +e
          python3 tests/validation/i038_ns_post_ns_matched_domain_transfer_decomposition.py \
            --probe build-i038/i038-probe \
            --contract "$CONTRACT" \
            "${target_args[@]}" \
            --output i038-out/evidence/result.json \
            > i038-out/evidence/evaluate.stdout \
            2> i038-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > i038-out/evidence/evaluate.exit-code
          cp "$CONTRACT" i038-out/evidence/contract.json
          cp /tmp/i038-development-v3-materialization.json i038-out/evidence/materialization.json
          sha256sum build-i038/i038-probe | awk '{print $1}' > i038-out/evidence/probe.sha256
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            sha256sum "/tmp/i038-target-$seed/corpus.json"
          done > i038-out/evidence/corpora.sha256
          printf 'main_sha=%s\n' "$GITHUB_SHA" > i038-out/evidence/build-info.txt
          if test -f i038-out/evidence/result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i038-out/evidence/result.json').read_text())
          Path('i038-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_authority':r['fresh_diagnostic_authority'],
                  'shipping_mirror':r['shipping_mirror'],
                  'coverage':r['coverage'],
                  'aggregation_domain':r['aggregation_domain'],
                  'interpretation_boundary':r['interpretation_boundary'],
              },indent=2,sort_keys=True)+'\n')
          PY
          fi
          (
            cd i038-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | \
              while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          exit "$rc"
      - name: Enforce matched-domain-transfer-diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i038-out/evidence/result.json').read_text())
          assert r['decision']=='NS_POST_NS_MATCHED_DOMAIN_TRANSFER_DECOMPOSED_REVIEW_REQUIRED'
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['shipping_mirror']['vad_active_mismatch_frames']==0
          assert r['shipping_mirror']['noise_rms_bitwise_mismatch_frames']==0
          assert r['shipping_mirror']['max_noise_rms_reconstruction_gap_db']==0
          assert r['shipping_mirror']['max_post_ns_partition_energy_share_gap'] <= 2e-05
          assert list(r['matched_domain_transfer']['global_fixed_horizons'])==['1','2','4','8']
          b=r['interpretation_boundary']
          assert b['exact_shipping_order_all_bin_accumulation'] is True
          assert b['bitwise_noise_rms_reconstruction_required'] is True
          assert b['fixed_low_speech_high_partitions_only'] is True
          assert b['post_ns_reanalysis_uses_same_fixed_spectral_partitions'] is True
          assert b['tracker_and_post_ns_compared_within_identical_domains'] is True
          assert b['post_ns_reanalysis_is_observation_only'] is True
          assert b['no_spectral_band_search'] is True
          assert b['no_estimator_selection'] is True
          assert b['no_source_candidate'] is True
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i038-out/evidence/summary.json; then
            cat i038-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I038 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i038-ns-post-ns-matched-domain-transfer-${{ github.run_id }}
          path: i038-out/
          retention-days: 90
          if-no-files-found: error
