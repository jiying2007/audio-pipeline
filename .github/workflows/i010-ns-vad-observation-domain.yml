name: I010 NS VAD Observation Domain Root Cause

on:
  pull_request:
    paths:
      - 'src/core/ap_pipeline.c'
      - 'src/enhance/ap_ns.c'
      - 'src/enhance/ap_vad.c'
      - 'src/modules/ap_ns_module.c'
      - 'src/modules/ap_agc_module.c'
      - 'src/modules/ap_vad_module.c'
      - 'include/audio_pipeline/audio_modules.h'
      - 'tests/validation/i010_ns_vad_observation_probe.c'
      - 'tests/validation/i010_ns_vad_observation.py'
      - 'docs/program/iterations/I010-ns-vad-observation-domain.json'
      - '.github/workflows/i010-ns-vad-observation-domain.yml'
  push:
    branches: [main]
    paths:
      - 'src/core/ap_pipeline.c'
      - 'src/enhance/ap_ns.c'
      - 'src/enhance/ap_vad.c'
      - 'src/modules/ap_ns_module.c'
      - 'src/modules/ap_agc_module.c'
      - 'src/modules/ap_vad_module.c'
      - 'include/audio_pipeline/audio_modules.h'
      - 'tests/validation/i010_ns_vad_observation_probe.c'
      - 'tests/validation/i010_ns_vad_observation.py'
      - 'docs/program/iterations/I010-ns-vad-observation-domain.json'
      - '.github/workflows/i010-ns-vad-observation-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i010-ns-vad-observation-domain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i010-ns-vad-observation-domain

      - name: Validate I010 candidate-zero contracts
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i010_ns_vad_observation.py
          python3 tests/validation/i010_ns_vad_observation.py --self-test
          python3 -m json.tool docs/program/iterations/I010-ns-vad-observation-domain.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/program/iterations/I010-ns-vad-observation-domain.json')
          c = json.loads(p.read_text())
          assert c['authority'] == 'CANDIDATE_ZERO_ROOT_CAUSE_ONLY'
          assert c['candidate_limit'] == 0
          assert c['confirmation_limit'] == 0
          assert c['promotion_allowed'] is False
          assert c['shipping_source_change_allowed'] is False
          assert c['fresh_seeds'] == [48123, 58123, 68123]
          assert c['cross_route_probe']['parameter_search'] is False
          assert c['cross_route_probe']['threshold_tuning'] is False
          PY

      - name: Build exact-source public module library
        run: |
          set -euo pipefail
          cmake -S . -B build-i010 -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i010 --target audio_pipeline ap_build_info_dump --parallel
          mkdir -p i010-out
          build-i010/ap_build_info_dump > i010-out/build-info.txt
          ${CC:-cc} --version | head -n 1 > i010-out/compiler.txt

      - name: Build I010 public-module probe
        run: |
          set -euo pipefail
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -Iinclude -Ibuild-i010/generated \
            tests/validation/i010_ns_vad_observation_probe.c \
            build-i010/libaudio_pipeline.a -lm \
            -o build-i010/i010_ns_vad_observation_probe
          sha256sum build-i010/i010_ns_vad_observation_probe > i010-out/probe.sha256

      - name: Run fresh candidate-zero observation-domain diagnostic
        run: |
          set -euo pipefail
          python3 tests/validation/i010_ns_vad_observation.py \
            --probe build-i010/i010_ns_vad_observation_probe \
            --contract docs/program/iterations/I010-ns-vad-observation-domain.json \
            --seed 48123 --seed 58123 --seed 68123 \
            --output i010-out/result.json \
            --enforce-input-valid
          cp docs/program/iterations/I010-ns-vad-observation-domain.json i010-out/contract.json
          printf '%s\n' "$GITHUB_SHA" > i010-out/source-revision.txt

      - name: Seal I010 root-cause evidence
        if: always()
        run: |
          set -euo pipefail
          find i010-out -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > i010-out/SHA256SUMS

      - name: Publish I010 summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('i010-out/result.json')
          print('## I010 NS/VAD observation-domain root cause')
          if not path.exists():
              print('- Result: evidence incomplete')
              raise SystemExit(0)
          r = json.loads(path.read_text())
          s = r['summary']
          print(f"- Decision: `{r['decision']}`")
          print(f"- Seeds: `{r['seeds']}`")
          print(f"- NS upstream max delta: `{s['max_upstream_probability_delta']}`")
          print(f"- Post-NS/AGC changed frames: `{s['waveform_changed_frames']}`")
          print(f"- VAD probability-different frames: `{s['vad_probability_diff_frames']}`")
          print(f"- VAD active-different frames: `{s['vad_active_diff_frames']}`")
          print('- Authority: candidate-zero root-cause only; no candidate, threshold tuning, confirmation, HIL or shipping authority.')
          PY

      - name: Upload I010 diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i010-ns-vad-observation-domain-${{ github.run_id }}
          path: i010-out/
          retention-days: 90
          if-no-files-found: error
