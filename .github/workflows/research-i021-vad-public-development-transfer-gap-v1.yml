name: Research I021 VAD Public Development Transfer Gap v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1.json'
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1-recovery.json'
      - '.github/research/continuous-optimization/development-v4/i021-vad-public-development-transfer-gap-v1-result.json'
      - 'tests/validation/data/i021-consumed-recovery-workflow.yml'
      - 'validation/research/evidence/i021-recovery-36419466840/**'
      - 'tests/validation/i021_vad_public_development_transfer_gap_probe.c'
      - 'tests/validation/i021_vad_public_development_transfer_gap.py'
      - 'tests/validation/test_i021_one_shot_guard.py'
      - 'tests/validation/test_i021_recovery_contract.py'
      - 'tests/validation/test_i021_retirement.py'
      - 'tests/validation/data/i021-consumed-workflow.yml'
      - '.github/workflows/research-i021-vad-public-development-transfer-gap-v1.yml'
      - '.github/workflows/i021-consumed-diagnostic-recovery.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I021 authority and recovery contract
        run: |
          set -euo pipefail
          python3 tests/validation/i021_vad_public_development_transfer_gap.py --self-test
          python3 tests/validation/test_i021_one_shot_guard.py
          python3 tests/validation/test_i021_recovery_contract.py
          python3 tests/validation/test_i021_retirement.py
