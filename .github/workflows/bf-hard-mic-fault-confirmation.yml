name: BF Hard Mic Fault Confirmation

on:
  pull_request:
    paths:
      - 'src/frontend/ap_beamformer.c'
      - 'src/frontend/ap_frontend.h'
      - 'src/frontend/ap_hpf.c'
      - 'tests/validation/bf_hard_fault_probe.c'
      - 'tests/validation/build_bf_hard_fault_sweep.py'
      - 'tests/validation/bf_hard_fault_evaluate.py'
      - 'tests/validation/bf_hard_fault_summary.py'
      - 'tests/validation/bf_hard_fault_candidate_gate.py'
      - '.github/workflows/bf-hard-mic-fault-confirmation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bf-hard-mic-fault-confirmation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate frozen confirmation contracts
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tests/validation/build_bf_hard_fault_sweep.py \
            tests/validation/bf_hard_fault_evaluate.py \
            tests/validation/bf_hard_fault_summary.py \
            tests/validation/bf_hard_fault_candidate_gate.py
          python3 tests/validation/build_bf_hard_fault_sweep.py --self-test
          python3 tests/validation/bf_hard_fault_evaluate.py --self-test
          python3 tests/validation/bf_hard_fault_summary.py --self-test
          python3 tests/validation/bf_hard_fault_candidate_gate.py --self-test

      - name: Build exact-source shipping-frontend probe
        run: |
          set -euo pipefail
          mkdir -p build-bf-hard-confirm
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            tests/validation/bf_hard_fault_probe.c \
            src/frontend/ap_hpf.c \
            src/frontend/ap_beamformer.c \
            -lm -o build-bf-hard-confirm/bf_hard_fault_probe

      - name: Build unseen confirmation partitions
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          for seed in 4307 5307 6307; do
            root="/tmp/ap-bf-hard-confirm-${seed}"
            python3 tests/validation/build_bf_hard_fault_sweep.py \
              --output "$root" --seed "$seed"
          done

      - name: Measure unseen HPF to BF confirmation
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          mkdir -p bf-hard-confirm-out
          for seed in 4307 5307 6307; do
            root="/tmp/ap-bf-hard-confirm-${seed}"
            out="bf-hard-confirm-out/${seed}"
            mkdir -p "$out"
            python3 tests/validation/bf_hard_fault_evaluate.py \
              --probe build-bf-hard-confirm/bf_hard_fault_probe \
              --frontend hpf-bf \
              --corpus "$root/corpus.json" \
              --output "$out/report.json" | tee "$out/measurement.txt"
          done

      - name: Aggregate unseen confirmation evidence
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          python3 tests/validation/bf_hard_fault_summary.py \
            --report bf-hard-confirm-out/4307/report.json \
            --report bf-hard-confirm-out/5307/report.json \
            --report bf-hard-confirm-out/6307/report.json \
            --output bf-hard-confirm-out/summary.json \
            | tee bf-hard-confirm-out/summary.txt

      - name: Enforce frozen product-candidate gate on unseen seeds
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          python3 tests/validation/bf_hard_fault_candidate_gate.py \
            --report bf-hard-confirm-out/4307/report.json \
            --report bf-hard-confirm-out/5307/report.json \
            --report bf-hard-confirm-out/6307/report.json \
            --output bf-hard-confirm-out/candidate-gate.json \
            | tee bf-hard-confirm-out/candidate-gate.txt

      - name: Publish confirmation summary
        if: always()
        run: |
          {
            echo '## BF hard microphone fault unseen confirmation'
            echo
            echo 'Frozen seeds: 4307 / 5307 / 6307. These partitions were introduced only after the 0.08–0.28 arm ratio, 0.18 roughness ratio and 0.60 recovery roughness ratio were fixed on the development evidence.'
            echo
            echo '```text'
            cat bf-hard-confirm-out/summary.txt 2>/dev/null || true
            echo '```'
            echo
            echo '### Frozen candidate gate'
            echo '```text'
            cat bf-hard-confirm-out/candidate-gate.txt 2>/dev/null || true
            echo '```'
            echo
            echo 'This remains deterministic regression confirmation, not DUT/HIL or product certification.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unseen confirmation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bf-hard-mic-fault-confirmation-${{ github.run_id }}
          path: bf-hard-confirm-out/
          if-no-files-found: warn
          retention-days: 30
