name: I027 Invalid Evidence Archive
run-name: "i027-invalid-readiness-evidence-archive / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/program/i027_archive.py'
      - '.github/workflows/i027-evidence-archive.yml'
      - 'tests/validation/test_i027_archive.py'
      - '.github/research/continuous-optimization/development-v4/i027-ns-upstream-reference-ready-component-counterfactual-v1-result.json'
      - 'validation/research/evidence/i027-36570600341/**'
  push:
    branches: [main]
    paths:
      - '.github/program/i027_archive.py'
      - '.github/workflows/i027-evidence-archive.yml'
      - 'tests/validation/test_i027_archive.py'
      - '.github/research/continuous-optimization/development-v4/i027-ns-upstream-reference-ready-component-counterfactual-v1-result.json'
      - 'validation/research/evidence/i027-36570600341/**'

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: i027-invalid-readiness-evidence-archive-trusted-main
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate copy-only invalid I027 evidence archive contract
        run: |
          set -euo pipefail
          python3 -m py_compile .github/program/i027_archive.py
          python3 .github/program/i027_archive.py --self-test
          python3 .github/program/i027_archive.py --check
          python3 tests/validation/test_i027_archive.py

  publish:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Reverify invalid-readiness I027 artifact and publish exact-byte archive PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ secrets.RESEARCH_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/program/i027_archive.py             --publish             --output i027-archive-out
      - name: Publish bounded archive status
        if: always()
        run: |
          if test -f i027-archive-out/status.json; then
            cat i027-archive-out/status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve archive publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i027-archive-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: i027-archive-out/
          retention-days: 90
          if-no-files-found: warn
