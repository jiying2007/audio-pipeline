name: I009 Closure Migration

on:
  push:
    branches:
      - governance/i009-close-keep-baseline
    paths:
      - '.github/workflows/i009-closure-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/i009-close-keep-baseline
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact I009 terminal migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          plan=Path('docs/program/plan.json')
          s=plan.read_text()
          old='''    {
      "id": "I009", "priority": 75, "status": "PLANNED", "lane": "acoustic",
      "title": "Activity double-talk admission root cause after I006 handoff",
      "depends_on": ["I006", "P001"], "handler": null, "contract": "docs/program/iterations/I009-inherited-double-talk-evidence.json",
      "exit": "Use I006 observations only as regression/root-cause context; any Activity candidate requires a new bounded contract and independent confirmation source",
      "evidence": []
    },
'''
          new='''    {
      "id": "I009", "priority": 75, "status": "CLOSED", "lane": "acoustic",
      "title": "Activity double-talk admission root cause after I006 handoff",
      "depends_on": ["I006", "P001"], "handler": null, "contract": "docs/program/iterations/I009-closure.json",
      "exit": "Fresh Activity gap and signal-domain root cause are archived; the only authorized residual/echo source candidate is rejected by frozen fresh pure-far and Hosted Real AEC movement regressions; confirmation remains unused and v2.3.12 stays shipping",
      "evidence": [
        {"source_sha": "e61b2998bde4902159eed07c8befc9703f014c1d", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34031305098", "meaning": "Fresh I009 Development baseline: artifact 9988691434/digest ab6f36bc... independently verified 284/284; 5/6 partitions fail the frozen double-talk activity gate with the inherited 3 smoothed-limit + 3 both-gates mechanism reproduced on new seeds."},
        {"source_sha": "317756d9feb17de5f7065b619e08dd7a77b9f166", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34031731756", "meaning": "Candidate-zero direct echo-normalization differential: artifact 9988834254/digest 3111f6ac... independently verified 301/301; 6/6 near/far repaired but 0/3 pure-far protected, so direct mic/echo normalization was rejected without source candidate authority."},
        {"source_sha": "497c3ca3a6be0a4e319a3493e256eac7391a7f18", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34033842566", "meaning": "Candidate-zero residual/echo rescue differential: artifact 9989499865/digest 1965a49e... independently verified 301/301; frozen 6/6 near/far + 3/3 pure-far support gates all pass with no Activity numeric threshold changes, authorizing exactly one structural source candidate."},
        {"source_sha": "7acd0a3a944573f35a4c60644f9d94e7aa20cf29", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34034482037", "meaning": "Only authorized I009 source candidate consumed 1/1 candidate and 0 confirmation. Artifact 9989713478/digest 51e5023b... independently verified 8/8; fresh near/far improves 0/6 to 6/6 but pure-far is only 2/3 with seed 18109 at 5.3521% false double-talk. Final decision KEEP_BASELINE_CANDIDATE_REJECTED; PR #119 closed unmerged."},
        {"source_sha": "7acd0a3a944573f35a4c60644f9d94e7aa20cf29", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34034482048", "meaning": "Independent Hosted Real AEC regression for the same frozen candidate: artifact 9989725745/digest ec24563f... independently verified 18/18; only 2/4 cases pass, static 2/2 but movement 0/2 with correlation-reduction regressions. Confirmation is not executed and shipping remains v2.3.12."}
      ]
    },
'''
          assert s.count(old)==1, s.count(old)
          plan.write_text(s.replace(old,new))

          program=Path('scripts/program.py')
          p=program.read_text()
          old_i009='''    i009 = by_id["I009"]
    require(i009["status"] == "PLANNED" and i009["handler"] is None and
            i009["contract"] == "docs/program/iterations/I009-inherited-double-talk-evidence.json" and
            not i009["evidence"],
            "I006 CLOSED must register I009 as non-executable inherited context")
'''
          new_i009='''    i009 = by_id["I009"]
    require(i009["handler"] is None and (
                (i009["status"] == "PLANNED" and
                 i009["contract"] == "docs/program/iterations/I009-inherited-double-talk-evidence.json" and
                 not i009["evidence"]) or
                (i009["status"] == "CLOSED" and
                 i009["contract"] == "docs/program/iterations/I009-closure.json" and
                 bool(i009["evidence"]))),
            "I006 CLOSED permits only inherited-context PLANNED or evidence-backed CLOSED I009")
'''
          assert p.count(old_i009)==1, p.count(old_i009)
          p=p.replace(old_i009,new_i009)

          marker='''\ndef validate(plan: dict, root: Path | None = None) -> None:\n'''
          validator='''
def validate_i009_closed(plan: dict, root: Path) -> None:
    by_id = {task["id"]: task for task in plan["tasks"]}
    i009 = by_id["I009"]
    if i009["status"] != "CLOSED":
        return
    require(i009["handler"] is None and
            i009["contract"] == "docs/program/iterations/I009-closure.json" and
            len(i009["evidence"]) == 5,
            "I009 CLOSED must be terminal, evidence-backed and bound to closure")
    c = json.loads(repo_file(root, "docs/program/iterations/I009-closure.json").read_text())
    require(c["schema_version"] == 1 and c["iteration_id"] == "I009" and
            c["state"] == "CLOSED_KEEP_BASELINE" and c["lane"] == "acoustic" and
            c["root_cause_id"] == "activity-double-talk-energy-domain-ambiguity" and
            c["closed_from_main_sha"] == "497c3ca3a6be0a4e319a3493e256eac7391a7f18",
            "I009 CLOSED requires exact reviewed closure identity")
    shipping = c["shipping_baseline"]
    require(shipping["release"] == plan["baseline"]["software_release"] == "v2.3.12" and
            shipping["source_sha"] == plan["baseline"]["source_sha"] and
            shipping["unchanged"] is True,
            "I009 closure must keep immutable shipping baseline")
    e = c["evidence_chain"]
    b = e["fresh_baseline"]
    require(b["run_id"] == 34031305098 and b["artifact_id"] == 9988691434 and
            b["artifact_digest"] == "sha256:ab6f36bc7252a988ff5228230137436bf75ea500c6d9a884c8f8ddf5f5299229" and
            b["internal_sha256s_verified"] == 284 and b["seeds"] == [17109, 27109, 37109] and
            b["partitions"] == 6 and b["gate_failure_partitions"] == 5 and
            b["failure_classification"] == {"smoothed_gate_limit": 3, "both_gates_limit": 3} and
            b["data_role_after_review"] == "regression-root-cause-only",
            "I009 CLOSED requires exact fresh baseline evidence")
    d = e["rejected_echo_normalized_differential"]
    require(d["run_id"] == 34031731756 and d["artifact_id"] == 9988834254 and
            d["artifact_digest"] == "sha256:3111f6acc2e851cd94d59520dad58f07d5aaf4c4ac7070621e083fe58e766a2e" and
            d["internal_sha256s_verified"] == 301 and d["near_far_passed"] == 6 and
            d["pure_far_passed"] == 0 and
            d["decision"] == "ECHO_NORMALIZED_STRUCTURE_NOT_SUPPORTED_REVIEW_REQUIRED" and
            d["candidate_consumed"] == 0 and d["confirmation_consumed"] == 0,
            "I009 CLOSED requires rejected direct echo-normalization evidence")
    r = e["supported_residual_echo_differential"]
    require(r["run_id"] == 34033842566 and r["artifact_id"] == 9989499865 and
            r["artifact_digest"] == "sha256:1965a49e87016994d57cc119d2dd11f0d1523dc1a32a3701904fbf0776efd238" and
            r["internal_sha256s_verified"] == 301 and r["near_far_passed"] == 6 and
            r["pure_far_passed"] == 3 and
            r["decision"] == "RESIDUAL_ECHO_RESCUE_SUPPORTED_REVIEW_REQUIRED" and
            r["candidate_consumed"] == 0 and r["confirmation_consumed"] == 0 and
            r["authorized_next_candidate"] == "activity-residual-echo-rescue-v1",
            "I009 CLOSED requires supported residual/echo root-cause evidence")
    s = e["bounded_source_candidate"]
    require(s["candidate_id"] == "activity-residual-echo-rescue-v1" and
            s["pr"] == 119 and s["pr_closed"] is True and s["pr_merged"] is False and
            s["head_sha"] == "7acd0a3a944573f35a4c60644f9d94e7aa20cf29" and
            s["run_id"] == 34034482037 and s["artifact_id"] == 9989713478 and
            s["artifact_digest"] == "sha256:51e5023be5bfbcf4246da49f07bf50a2f8d35c12ebb3e72b52ae636fa360936b" and
            s["internal_sha256s_verified"] == 8 and
            s["fresh_development_seeds"] == [18109, 28109, 38109] and
            s["base_fresh_near_far_passed"] == 0 and s["base_fresh_pure_far_passed"] == 3 and
            s["candidate_fresh_near_far_passed"] == 6 and s["candidate_fresh_pure_far_passed"] == 2 and
            s["failing_pure_far_seed"] == 18109 and
            abs(s["failing_pure_far_false_double_talk_fraction"] - 0.05352112676056338) < 1e-15 and
            s["regression_only_near_far_passed"] == 6 and s["regression_only_pure_far_passed"] == 3 and
            s["ctest_passed"] is True and s["decision"] == "KEEP_BASELINE_CANDIDATE_REJECTED" and
            s["candidate_limit"] == s["candidate_limit_consumed"] == 1 and
            s["confirmation_limit_consumed"] == 0 and s["reserved_confirmation_executed"] is False,
            "I009 CLOSED requires exact rejected source-candidate evidence")
    h = e["hosted_real_aec_regression"]
    require(h["run_id"] == 34034482048 and h["artifact_id"] == 9989725745 and
            h["artifact_digest"] == "sha256:ec24563fa182f13beb83c74086ecb77cf5c37036150a4151080d5ae454789937" and
            h["internal_sha256s_verified"] == 18 and h["cases"] == 4 and h["passed_cases"] == 2 and
            h["pass_rate"] == 0.5 and h["static_passed"] == h["static_cases"] == 2 and
            h["movement_passed"] == 0 and h["movement_cases"] == 2 and
            h["movement_corr_reduction"] == [-0.0016180328069426986, -0.03955294463793517] and
            abs(h["worst_movement_output_rms_delta_db"] - 9.935877991664285) < 1e-12 and
            h["decision"] == "REGRESSION_FAIL",
            "I009 CLOSED requires exact Hosted Real AEC regression evidence")
    require(c["candidate_budget"] == {
                "limit": 1, "consumed": 1, "remaining": 0,
                "second_candidate_authorized": False,
                "post_result_candidate_change_authorized": False,
            }, "I009 CLOSED must seal the single candidate budget")
    require(c["confirmation"] == {
                "consumed": 0, "reserved_source_executed": False,
                "reserved_seeds": [19109, 29109, 39109],
                "may_rescue_rejected_candidate": False,
                "may_be_used_for_post_result_candidate_change": False,
            }, "I009 CLOSED must keep confirmation unused")
    require(c["closure_decision"] == {
                "keep_baseline": True, "merge_shipping_candidate": False,
                "create_release": False, "consume_confirmation": False,
                "allow_second_candidate": False,
                "allow_post_result_candidate_change": False,
                "future_I009_candidate_requires_new_root_cause_and_budget_decision": True,
            }, "I009 closure decision must be terminal KEEP_BASELINE")
    require(c["authority_boundary"] == {
                "shipping_source_changed": False, "software_candidate_promoted": False,
                "release_created": False, "product_qualification": "DEFERRED_BY_SCOPE",
                "hardware_collection": False, "dut_hil": "DEFERRED_BY_SCOPE",
            }, "I009 CLOSED cannot claim shipping/product authority")

'''
          assert p.count(marker)==1, p.count(marker)
          p=p.replace(marker,'\n'+validator+'def validate(plan: dict, root: Path | None = None) -> None:\n')
          old_calls='''        validate_i006_review_required(plan, root)
        validate_i006_closed(plan, root)
'''
          new_calls='''        validate_i006_review_required(plan, root)
        validate_i006_closed(plan, root)
        validate_i009_closed(plan, root)
'''
          assert p.count(old_calls)==1, p.count(old_calls)
          p=p.replace(old_calls,new_calls)
          program.write_text(p)
          PY
          python3 -m json.tool docs/program/plan.json >/dev/null
          python3 -m json.tool docs/program/iterations/I009-closure.json >/dev/null
          python3 scripts/program.py --self-test
          python3 scripts/program.py check >/dev/null
          git diff --check
          rm .github/workflows/i009-closure-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/program/plan.json scripts/program.py .github/workflows/i009-closure-migration.yml
          git commit -m 'program: close I009 after bounded Activity candidate rejection'
          git push origin HEAD:governance/i009-close-keep-baseline
