name: I009 Candidate Pipeline Bootstrap

on:
  push:
    branches:
      - candidate/i009-residual-echo-rescue-v1
    paths:
      - '.github/workflows/i009-candidate-pipeline-bootstrap.yml'
      - 'scripts/i009_candidate_bootstrap_patch.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: candidate/i009-residual-echo-rescue-v1
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact causal pipeline patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/i009_candidate_bootstrap_patch.py
          git diff --check
          test "$(git diff --name-only)" = 'src/core/ap_pipeline.c'
          grep -q 'previous_residual_echo_valid = pipeline->metrics.aec_converged != 0u;' src/core/ap_pipeline.c
          grep -q 'ap_activity_process_with_residual_echo' src/core/ap_pipeline.c
          rm .github/workflows/i009-candidate-pipeline-bootstrap.yml scripts/i009_candidate_bootstrap_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/core/ap_pipeline.c .github/workflows/i009-candidate-pipeline-bootstrap.yml scripts/i009_candidate_bootstrap_patch.py
          git commit -m 'candidate: wire causal residual-echo Activity rescue'
          git push origin HEAD:candidate/i009-residual-echo-rescue-v1
