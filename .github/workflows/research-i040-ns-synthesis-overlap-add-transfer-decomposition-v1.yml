name: Research I040 NS Synthesis Overlap-Add Transfer Decomposition v1
run-name: "i040-synthesis-ola-transfer / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i039-ns-suppression-transfer-path-decomposition-v1-result.json'
      - '.github/research/continuous-optimization/development-v4/i040-ns-synthesis-overlap-add-transfer-decomposition-v1.json'
      - 'tests/validation/i040_ns_synthesis_overlap_add_transfer_probe.c'
      - 'tests/validation/i040_ns_synthesis_overlap_add_transfer_decomposition.py'
      - 'tests/validation/test_i040_one_shot_guard.py'
      - '.github/workflows/research-i040-ns-synthesis-overlap-add-transfer-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i040-synthesis-ola-transfer-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i040-ns-synthesis-overlap-add-transfer-decomposition-v1.json
  DEV_ROOT: /tmp/audio-pipeline-i040-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I040 synthesis-overlap-add transfer contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile \
            tests/validation/i040_ns_synthesis_overlap_add_transfer_decomposition.py \
            tests/validation/test_i040_one_shot_guard.py
          python3 tests/validation/i040_ns_synthesis_overlap_add_transfer_decomposition.py --self-test
          python3 tests/validation/test_i040_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i040-ns-synthesis-overlap-add-transfer-decomposition-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='CANDIDATE_ZERO_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'

          a=c['fresh_diagnostic_authority']
          seeds=a['target_seeds']
          assert len(seeds)==6 and len(set(seeds))==6
          assert all(type(seed) is int and seed>0 for seed in seeds)
          assert a['diagnostic_execution_limit']==1
          assert a['candidate_limit']==0
          assert a['confirmation_limit']==0

          reconstruction=c['exact_order_reconstruction']
          assert reconstruction['post_hoc_tolerance_not_allowed'] is True
          assert 'k=0..256' in reconstruction['accumulation_order']
          assert c['diagnostic_gates']['noise_rms_bitwise_mismatch_frames']==0
          assert c['fixed_horizons']==[1,2,4,8]

          p=c['fixed_spectral_partitions']
          assert p['low_bins']=={'first':0,'last':8,'count':9}
          assert p['speech_bins']=={'first':9,'last':223,'count':215}
          assert p['high_bins']=={'first':224,'last':256,'count':33}
          assert p['boundaries_are_fixed_not_searched'] is True

          predecessor=Path(c['predecessor']['i039_closure'])
          prior=json.loads(predecessor.read_text())
          assert prior['status']==c['predecessor']['required_status']
          assert prior['decision']==c['predecessor']['required_decision']
          assert prior['reviewed_decision']==c['predecessor']['required_reviewed_decision']
          assert prior['proposed_followup_hypothesis']['id']==c['predecessor']['required_followup_id']
          assert prior['proposed_followup_hypothesis']['authority']==c['predecessor']['required_followup_authority']

          def blob(p):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+str(p)],text=True).strip()

          assert blob(predecessor)==c['predecessor']['i039_closure_blob_sha']
          assert blob(Path(c['dataset_authority']['lock_path']))==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(Path(c['dataset_authority']['builder_path']))==c['dataset_authority']['builder_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['probe_path']))==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['evaluator_path']))==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert blob(Path(c['shipping_synthesis_reference']['path']))==c['shipping_synthesis_reference']['git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']

          probe=Path(c['diagnostic_inputs']['probe_path']).read_text()
          for token in (
              'float all_noise_sum = 1.0e-18f',
              'all_noise_sum += noise_result.noise',
              'all_noise_rms_bits',
              'ns_noise_rms_bits',
              'noise_rms_bitwise_match',
              'suppression_post = power / (noise_result.noise + 1.0e-12f)',
              'sqrtf((suppression_post - 1.0f) / suppression_post)',
              'clampf_local(suppression_gain, NS_FLOOR, 1.0f)',
              'predicted_suppressed_power',
              'suppression_speech_floor_fraction',
              'synthesize_suppressed_spectrum',
              'ap_fft(synthesis_spectrum, nfft, 1)',
              'predicted_ns_output',
              'synthesis_overlap',
              'predicted_post_ns_speech_mean_power_dbfs',
              'synthesis_max_abs_sample_delta',
              'post_ns_speech_mean_power_dbfs',
          ):
              assert token in probe
          mirror=probe.split('static void mirror_upstream_components',1)[1].split('static void process_vad_diagnostic',1)[0]
          assert mirror.index('all_noise_sum += noise_result.noise') < mirror.index('if (k <= low_last)')
          observation=c['synthesis_overlap_add_observation']
          assert observation['selection_or_tuning_allowed'] is False
          assert observation['domains']==['all','low','speech','high']
          assert observation['fixed_ns_floor']==0.12
          assert c['shipping_synthesis_reference']['selection_or_tuning_allowed'] is False
          assert c['diagnostic_gates']['max_post_ns_partition_energy_share_gap']==2e-05
          assert c['diagnostic_gates']['max_predicted_post_ns_partition_energy_share_gap']==2e-05
          assert c['diagnostic_gates']['max_suppression_attenuation_identity_gap_db']==2e-05
          assert c['diagnostic_gates']['max_predicted_suppressed_power_excess_db']==2e-05
          assert c['diagnostic_gates']['max_synthesis_output_abs_sample_delta']==2e-05
          assert c['diagnostic_gates']['max_synthesis_output_rmse']==5e-06

          for seed in seeds:
              pattern=rf'(^|[^0-9]){seed}([^0-9]|$)'
              result=subprocess.run(
                  ['git','grep','-n','-E',pattern,'--','.github','tests','validation','docs'],
                  stdout=subprocess.PIPE,text=True,check=False)
              assert result.returncode in (0,1)
              matches=[
                  line for line in result.stdout.splitlines()
                  if line and line.split(':',1)[0] != str(path)
              ]
              assert not matches, (
                  f'I040 seed is not fresh: {seed}\n'+'\n'.join(matches))
          PY
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i040-synthesis-ola-contract
      - name: Compile I040 synthesis-overlap-add probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i040-contract \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i040-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i040-contract/generated \
            tests/validation/i040_ns_synthesis_overlap_add_transfer_probe.c \
            build-i040-contract/libaudio_pipeline.a -lm \
            -o build-i040-contract/i040-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I040 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i040-ns-synthesis-overlap-add-transfer-decomposition-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I040 diagnostic requires first-attempt trusted main dispatch')
          def pages(endpoint):
              raw=subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint],text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value
          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I040 run not visible; fail closed')
          consuming={
              'Materialize fresh I040 target public-development-v3 partitions',
              'Evaluate candidate-zero synthesis-overlap-add transfer',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts<1:
                  raise SystemExit('invalid prior I040 attempt count')
              for run_attempt in range(1,attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs'
                      '?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if (
                                  step.get('name') in consuming
                                  and step.get('conclusion')!='skipped'
                              ):
                                  raise SystemExit(
                                      f'I040 one-shot authority already consumed by run {run_id}')
          print('I040 one-shot authority: fresh')
          PY
      - name: Bind frozen I040 inputs and unchanged shipping source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.loads(Path('.github/research/continuous-optimization/development-v4/i040-ns-synthesis-overlap-add-transfer-decomposition-v1.json').read_text())
          def blob(path):
              return subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()
          assert blob(c['predecessor']['i039_closure'])==c['predecessor']['i039_closure_blob_sha']
          assert blob(c['dataset_authority']['lock_path'])==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(c['dataset_authority']['builder_path'])==c['dataset_authority']['builder_git_blob_sha']
          assert blob(c['diagnostic_inputs']['probe_path'])==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(c['diagnostic_inputs']['evaluator_path'])==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert blob(c['shipping_synthesis_reference']['path'])==c['shipping_synthesis_reference']['git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']
          PY
          SOURCE_BASE="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["source_base_sha"])')"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD -- \
            src/enhance/ap_noise_tracker.c \
            src/enhance/ap_noise_tracker.h \
            src/enhance/ap_ns.c \
            src/enhance/ap_vad.c \
            src/modules/ap_vad_module.c \
            src/modules/ap_ns_module.c \
            include/audio_pipeline/audio_modules.h \
            src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i040-synthesis-ola-transfer
      - name: Build I040 synthesis-overlap-add probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i040 \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i040 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i040/generated \
            tests/validation/i040_ns_synthesis_overlap_add_transfer_probe.c \
            build-i040/libaudio_pipeline.a -lm \
            -o build-i040/i040-probe
      - name: Materialize fresh I040 target public-development-v3 partitions
        run: |
          set -euo pipefail
          LOCK="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["lock_path"])')"
          BUILDER="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["builder_path"])')"
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py \
            --lock "$LOCK" --root "$DEV_ROOT" \
            --output /tmp/i040-development-v3-materialization.json
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            python3 "$BUILDER" \
              --lock "$LOCK" \
              --materialization /tmp/i040-development-v3-materialization.json \
              --data-root "$DEV_ROOT" \
              --output "/tmp/i040-target-$seed" \
              --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
          done
      - name: Evaluate candidate-zero synthesis-overlap-add transfer
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i040-out
          mkdir -p i040-out/evidence
          target_args=()
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            target_args+=(--target-corpus "/tmp/i040-target-$seed/corpus.json")
          done
          set +e
          python3 tests/validation/i040_ns_synthesis_overlap_add_transfer_decomposition.py \
            --probe build-i040/i040-probe \
            --contract "$CONTRACT" \
            "${target_args[@]}" \
            --output i040-out/evidence/result.json \
            > i040-out/evidence/evaluate.stdout \
            2> i040-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > i040-out/evidence/evaluate.exit-code
          cp "$CONTRACT" i040-out/evidence/contract.json
          cp /tmp/i040-development-v3-materialization.json i040-out/evidence/materialization.json
          sha256sum build-i040/i040-probe | awk '{print $1}' > i040-out/evidence/probe.sha256
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            sha256sum "/tmp/i040-target-$seed/corpus.json"
          done > i040-out/evidence/corpora.sha256
          printf 'main_sha=%s\n' "$GITHUB_SHA" > i040-out/evidence/build-info.txt
          summary_rc=0
          if test -f i040-out/evidence/result.json; then
            set +e
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i040-out/evidence/result.json').read_text())
          Path('i040-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_authority':r['fresh_diagnostic_authority'],
                  'shipping_mirror':r['shipping_mirror'],
                  'transfer_invariants':r['transfer_invariants'],
                  'coverage':r['coverage'],
                  'synthesis_overlap_add_transfer':r['synthesis_overlap_add_transfer'],
                  'interpretation_boundary':r['interpretation_boundary'],
              },indent=2,sort_keys=True)+'\n')
          PY
            summary_rc=$?
            set -e
          fi
          (
            cd i040-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | \
              while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          if test "$summary_rc" -ne 0; then
            echo "I040 summary packaging failed after evaluator rc=$rc" >&2
            exit "$summary_rc"
          fi
          exit "$rc"
      - name: Enforce synthesis-overlap-add-diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i040-out/evidence/result.json').read_text())
          assert r['decision']=='NS_SYNTHESIS_OVERLAP_ADD_TRANSFER_DECOMPOSED_REVIEW_REQUIRED'
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['shipping_mirror']['vad_active_mismatch_frames']==0
          assert r['shipping_mirror']['noise_rms_bitwise_mismatch_frames']==0
          assert r['shipping_mirror']['max_noise_rms_reconstruction_gap_db']==0
          assert r['transfer_invariants']['max_post_ns_partition_energy_share_gap'] <= 2e-05
          assert r['transfer_invariants']['max_predicted_post_ns_partition_energy_share_gap'] <= 2e-05
          assert r['transfer_invariants']['max_suppression_attenuation_identity_gap_db'] <= 2e-05
          assert r['transfer_invariants']['max_predicted_suppressed_power_excess_db'] <= 2e-05
          assert r['transfer_invariants']['max_synthesis_output_abs_sample_delta'] <= 2e-05
          assert r['transfer_invariants']['max_synthesis_output_rmse'] <= 5e-06
          assert list(r['synthesis_overlap_add_transfer']['global_fixed_horizons'])==['1','2','4','8']
          b=r['interpretation_boundary']
          assert b['exact_shipping_order_all_bin_accumulation'] is True
          assert b['bitwise_noise_rms_reconstruction_required'] is True
          assert b['fixed_low_speech_high_partitions_only'] is True
          assert b['pre_ns_power_uses_existing_analysis_spectrum'] is True
          assert b['suppression_gain_formula_mirrors_shipping_full_mode'] is True
          assert b['fixed_ns_floor_unchanged'] is True
          assert b['predicted_suppressed_power_is_observation_only'] is True
          assert b['inverse_fft_operation_order_mirrors_shipping'] is True
          assert b['synthesis_window_operation_order_mirrors_shipping'] is True
          assert b['overlap_add_state_is_diagnostic_only_and_mirrors_shipping'] is True
          assert b['predicted_synthesized_output_reanalysis_uses_same_fixed_domains'] is True
          assert b['post_ns_reanalysis_uses_same_fixed_spectral_partitions'] is True
          assert b['no_domain_or_spectral_band_selection'] is True
          assert b['no_window_or_overlap_add_selection'] is True
          assert b['no_estimator_selection'] is True
          assert b['no_ns_floor_or_suppression_gain_tuning'] is True
          assert b['no_source_candidate'] is True
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i040-out/evidence/summary.json; then
            cat i040-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I040 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i040-ns-synthesis-overlap-add-transfer-${{ github.run_id }}
          path: i040-out/
          retention-days: 90
          if-no-files-found: error
