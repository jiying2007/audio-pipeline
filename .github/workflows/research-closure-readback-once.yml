name: Research cleanup source readback (one-time)
on:
  push:
    branches: [audit/research-closure-readback-20261106]
    paths: [.github/workflows/research-closure-readback-once.yml]
permissions:
  contents: read
jobs:
  source-readback:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: a2b50f86883ef30518d38c1e3d4bebde2db31d3c
          path: audio-pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/kws-pipeline
          ref: 85b3d22c38e58b743f42bd45a885577055bae597
          path: kws-pipeline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: jiying2007/kws-data
          ref: 8d453edffefec06fe2a5767f02006e86e91aa8e3
          path: kws-data
          persist-credentials: false
      - name: Read tracked source only without executing repository code
        run: |
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,subprocess,zipfile
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'closure-readback'
          out.mkdir()
          pins={'audio-pipeline':'a2b50f86883ef30518d38c1e3d4bebde2db31d3c','kws-pipeline':'85b3d22c38e58b743f42bd45a885577055bae597','kws-data':'8d453edffefec06fe2a5767f02006e86e91aa8e3'}
          prefixes=('.github/','scripts/','tools/','governance/','configs/','automation/','docs/','src/','include/','cmake/','lab/','validation/')
          suffixes={'.py','.md','.sh','.json','.yml','.yaml','.toml','.txt','.c','.h','.cmake','.ini','.cfg'}
          total=0
          manifest={'scope':'read-only source audit; not acoustic or device qualification','repositories':{}}
          with zipfile.ZipFile(out/'current-surfaces.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name,sha in pins.items():
                  root=pathlib.Path(name)
                  def git(*args): return subprocess.check_output(['git','-C',name,*args])
                  if git('rev-parse','HEAD').decode().strip()!=sha: raise SystemExit('source moved')
                  tree=git('rev-parse','HEAD^{tree}').decode().strip()
                  rows=[]
                  for raw in git('ls-tree','-rz','HEAD').split(b'\0'):
                      if not raw: continue
                      meta,path=raw.split(b'\t',1)
                      mode,kind,blob=meta.decode().split()
                      path=path.decode()
                      row={'path':path,'mode':mode,'type':kind,'git_blob':blob}
                      p=root/path
                      selected=(path.startswith(prefixes) or '/' not in path or path.startswith(('tests/test_research','tests/test_archived')))
                      if selected and mode in ('100644','100755') and p.suffix.lower() in suffixes and p.stat().st_size<=2*1024*1024:
                          data=p.read_bytes()
                          if hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()!=blob: raise SystemExit('source bytes changed')
                          try: data.decode('utf-8')
                          except UnicodeError: rows.append(row); continue
                          total+=len(data)
                          if total>128*1024*1024: raise SystemExit('snapshot size bound')
                          archive.writestr(name+'/'+path,data)
                          row.update(included=True,bytes=len(data),sha256=hashlib.sha256(data).hexdigest())
                      rows.append(row)
                  manifest['repositories'][name]={'commit':sha,'tree':tree,'files':rows}
                  print(name,sha,'tracked',len(rows),'snapshot',sum(r.get('included',False) for r in rows))
          manifest['included_bytes']=total
          manifest['archive_sha256']=hashlib.sha256((out/'current-surfaces.zip').read_bytes()).hexdigest()
          (out/'source-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-cleanup-source-readback
          path: ${{ runner.temp }}/closure-readback/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1
