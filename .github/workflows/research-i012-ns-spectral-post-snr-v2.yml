name: Research I012 NS Spectral Post-SNR v2
run-name: "i012-spectral-post-snr-v2 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i012-ns-spectral-post-snr-v2.json'
      - '.github/research/continuous-optimization/development-v4/i012-ns-spectral-post-snr-v2-result.json'
      - 'tests/validation/i012_ns_spectral_post_snr_v2_probe.c'
      - 'tests/validation/i012_ns_spectral_post_snr_v2.py'
      - '.github/workflows/research-i012-ns-spectral-post-snr-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i012-ns-spectral-post-snr-v2.json
  RESULT: .github/research/continuous-optimization/development-v4/i012-ns-spectral-post-snr-v2-result.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate consumed I012 contract, tooling and reviewed result
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i012_ns_spectral_post_snr_v2.py
          python3 tests/validation/i012_ns_spectral_post_snr_v2.py --self-test
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m json.tool "$RESULT" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i012-ns-spectral-post-snr-v2.json'
          ).read_text())
          result = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i012-ns-spectral-post-snr-v2-result.json'
          ).read_text())

          assert contract['investigation_id'] == 'i012-ns-spectral-post-snr-v2'
          assert contract['authority'] == 'RESEARCH_DIAGNOSTIC_ONLY'
          assert contract['source_base_sha'] == '61ff84f1e38b1c928bbb1ea9efae006e33779465'
          assert contract['fresh_diagnostic_authority']['seeds'] == [191123, 201123, 211123]
          assert contract['budget'] == {
              'candidate_limit': 0,
              'confirmation_limit': 0,
              'diagnostic_execution_limit': 1,
          }
          assert contract['parameter_search_allowed'] is False
          assert contract['threshold_tuning_allowed'] is False
          assert contract['promotion_allowed'] is False
          assert contract['shipping_source_change_allowed'] is False
          assert all(value is False for value in contract['authority_boundary'].values())

          assert result['status'] == 'CLOSED_DIAGNOSTIC_ONLY'
          assert result['authority'] == contract['authority']
          assert result['source_base_sha'] == contract['source_base_sha']
          assert result['decision'] == (
              'NS_SPECTRAL_POST_SNR_INFORMATION_GAIN_NOT_SUPPORTED_REVIEW_REQUIRED'
          )
          assert result['reviewed_decision'] == (
              'SPECTRAL_INFORMATION_GAIN_INSUFFICIENT_KEEP_BASELINE'
          )
          execution = result['authoritative_execution']
          assert execution['workflow_run_id'] == 35958701243
          assert execution['artifact_id'] == 10791920720
          assert execution['artifact_digest'] == (
              'sha256:3b0ddb18ba895a791d37afede84de02cf90b8791836e616f8e853f17f351e174'
          )
          assert execution['internal_sha256s_verified'] == 9

          fresh = result['fresh_authority']
          assert fresh['seeds'] == [191123, 201123, 211123]
          assert fresh['diagnostic_execution_limit'] == 1
          assert fresh['diagnostic_execution_consumed'] == 1
          assert fresh['candidate_limit_consumed'] == 0
          assert fresh['confirmation_limit_consumed'] == 0
          assert fresh['parameter_search_performed'] is False
          assert fresh['threshold_tuning_performed'] is False
          assert fresh['feature_mapping_selected'] is False

          integrity = result['input_integrity']
          assert integrity['input_violations'] == 0
          assert integrity['max_floor_spectral_snr_delta_db'] == 0.0
          assert integrity['max_floor_speech_probability_delta'] == 0.0

          summary = result['summary']
          assert summary['combined_spectral_snr_auc'] == 0.634354858778151
          assert summary['combined_upstream_speech_probability_auc'] == 0.5684108912944299
          assert summary['combined_auc_gain_over_upstream'] == 0.06594396748372111
          assert summary['combined_auc_gate_pass'] is False
          assert summary['auc_gain_gate_pass'] is True
          assert summary['per_seed_auc_gate_pass'] is True

          assert all(
              item['spectral_snr_auc'] >= 0.60
              for item in result['per_seed']
          )
          assert all(
              item['nonstationary_spectral_snr_auc'] < 0.60
              for item in result['per_seed']
          )
          assert all(value is False for value in result['authority_boundary'].values())
          PY
          git cat-file -e "61ff84f1e38b1c928bbb1ea9efae006e33779465^{commit}"

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i012-spectral-post-snr-v2-contract

      - name: Compile retained test-only internal spectral probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i012-v2-contract             -DCMAKE_BUILD_TYPE=Release             -DAP_BUILD_BENCH=OFF             -DAP_STRICT_WARNINGS=ON
          cmake --build build-i012-v2-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i012-v2-contract/generated             tests/validation/i012_ns_spectral_post_snr_v2_probe.c             build-i012-v2-contract/libaudio_pipeline.a -lm             -o build-i012-v2-contract/i012_ns_spectral_post_snr_v2_probe
