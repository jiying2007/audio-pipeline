name: Research I032 NS Upstream Target Causal Noise Scale Observability v1
run-name: "i032-target-causal-noise-scale / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i032-ns-upstream-target-causal-noise-scale-observability-v1.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i032_ns_upstream_target_causal_noise_scale_observability.py'
      - 'tests/validation/test_i032_one_shot_guard.py'
      - '.github/workflows/research-i032-ns-upstream-target-causal-noise-scale-observability-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i032-target-causal-noise-scale-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i032-ns-upstream-target-causal-noise-scale-observability-v1.json
  DEV_ROOT: /tmp/audio-pipeline-i032-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I032 target causal noise-scale contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i032_ns_upstream_target_causal_noise_scale_observability.py
          python3 tests/validation/i032_ns_upstream_target_causal_noise_scale_observability.py --self-test
          python3 tests/validation/test_i032_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i032-ns-upstream-target-causal-noise-scale-observability-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='CANDIDATE_ZERO_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'

          a=c['fresh_diagnostic_authority']
          donor=a['donor_seeds']
          target=a['target_seeds']
          assert len(donor)==3 and len(target)==3
          assert len(set(donor))==3 and len(set(target))==3
          assert set(donor).isdisjoint(target)
          assert a['diagnostic_execution_limit']==1
          assert a['candidate_limit']==0
          assert a['confirmation_limit']==0

          shipping=c['fixed_shipping_semantics']
          assert shipping['causal_noise_scale_field']=='ns_noise_rms_dbfs'
          assert 'ap_ns_process' in shipping['causal_noise_scale_provenance']

          proxy=c['causal_proxy_semantics']
          assert proxy['causal'] is True
          assert proxy['prior_reference_threshold']==8
          assert proxy['may_use_future_frames_for_proxy'] is False

          benchmark=c['retrospective_benchmark_semantics']
          assert benchmark['reference_frames']==8
          assert benchmark['strictly_post_target'] is True
          assert 'retrospective' in benchmark['role']

          fidelity=c['fidelity_hypothesis']
          assert fidelity['maximum_median_absolute_error_db']==3.0
          assert fidelity['maximum_p90_absolute_error_db']==6.0
          assert fidelity['percentile_definition']=='nearest-rank'

          assoc=c['descriptive_transfer_association']
          assert assoc['authority']=='descriptive only'
          assert assoc['may_select_normalization_mapping'] is False
          assert assoc['may_select_candidate'] is False

          assert all(value is False for value in c['authority_boundary'].values())

          predecessor=Path(c['predecessor']['i031_closure'])
          prior=json.loads(predecessor.read_text())
          assert prior['status']==c['predecessor']['required_status']
          assert prior['decision']==c['predecessor']['required_decision']
          assert prior['reviewed_decision']==c['predecessor']['required_reviewed_decision']
          assert prior['proposed_followup_hypothesis']['id']==c['predecessor']['required_followup_id']
          assert prior['proposed_followup_hypothesis']['authority']==c['predecessor']['required_followup_authority']

          def blob(p):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+str(p)],text=True).strip()

          assert blob(predecessor)==c['predecessor']['i031_closure_blob_sha']
          assert blob(Path(c['dataset_authority']['lock_path']))==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(Path(c['dataset_authority']['builder_path']))==c['dataset_authority']['builder_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['probe_path']))==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['evaluator_path']))==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']

          probe=Path(c['diagnostic_inputs']['probe_path']).read_text()
          assert '"ns_noise_rms_dbfs"' in probe
          assert '(double)ns_result.noise_rms_dbfs' in probe
          assert 'ap_ns_process(&ns_state' in probe

          for seed in donor+target:
              pattern=rf'(^|[^0-9]){seed}([^0-9]|$)'
              result=subprocess.run(
                  ['git','grep','-n','-E',pattern,'--','.github','tests','validation','docs'],
                  stdout=subprocess.PIPE,text=True,check=False)
              assert result.returncode in (0,1)
              matches=[
                  line for line in result.stdout.splitlines()
                  if line and line.split(':',1)[0] != str(path)
              ]
              assert not matches, (
                  f'I032 seed is not fresh: {seed}\n'+'\n'.join(matches))
          PY
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i032-target-causal-noise-scale-contract
      - name: Compile frozen I025 dual-mirror probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i032-contract \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i032-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i032-contract/generated \
            tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c \
            build-i032-contract/libaudio_pipeline.a -lm \
            -o build-i032-contract/i032-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I032 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i032-ns-upstream-target-causal-noise-scale-observability-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I032 diagnostic requires first-attempt trusted main dispatch')

          def pages(endpoint):
              raw=subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint],text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value

          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I032 run not visible; fail closed')

          consuming={
              'Materialize fresh I032 donor and target public-development-v3 partitions',
              'Evaluate candidate-zero target causal noise-scale observability',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts<1:
                  raise SystemExit('invalid prior I032 attempt count')
              for run_attempt in range(1,attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs'
                      '?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if (
                                  step.get('name') in consuming
                                  and step.get('conclusion')!='skipped'
                              ):
                                  raise SystemExit(
                                      f'I032 one-shot authority already consumed by run {run_id}')
          print('I032 one-shot authority: fresh')
          PY
      - name: Bind frozen I032 inputs and unchanged shipping source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.loads(Path('.github/research/continuous-optimization/development-v4/i032-ns-upstream-target-causal-noise-scale-observability-v1.json').read_text())
          def blob(path):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+path],text=True).strip()
          assert blob(c['predecessor']['i031_closure'])==c['predecessor']['i031_closure_blob_sha']
          assert blob(c['dataset_authority']['lock_path'])==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(c['dataset_authority']['builder_path'])==c['dataset_authority']['builder_git_blob_sha']
          assert blob(c['diagnostic_inputs']['probe_path'])==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(c['diagnostic_inputs']['evaluator_path'])==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']
          PY
          SOURCE_BASE="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["source_base_sha"])')"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD -- \
            src/enhance/ap_noise_tracker.c \
            src/enhance/ap_noise_tracker.h \
            src/enhance/ap_ns.c \
            src/enhance/ap_vad.c \
            src/modules/ap_vad_module.c \
            src/modules/ap_ns_module.c \
            include/audio_pipeline/audio_modules.h \
            src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i032-target-causal-noise-scale
      - name: Build frozen I025 dual-mirror probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i032 \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i032 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i032/generated \
            tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c \
            build-i032/libaudio_pipeline.a -lm \
            -o build-i032/i032-probe
      - name: Materialize fresh I032 donor and target public-development-v3 partitions
        run: |
          set -euo pipefail
          LOCK="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["lock_path"])')"
          BUILDER="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["builder_path"])')"
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py \
            --lock "$LOCK" --root "$DEV_ROOT" \
            --output /tmp/i032-development-v3-materialization.json
          for role in donor target; do
            for seed in $(ROLE="$role" python3 -c 'import json,os; c=json.load(open(os.environ["CONTRACT"])); print(*c["fresh_diagnostic_authority"][os.environ["ROLE"]+"_seeds"])'); do
              python3 "$BUILDER" \
                --lock "$LOCK" \
                --materialization /tmp/i032-development-v3-materialization.json \
                --data-root "$DEV_ROOT" \
                --output "/tmp/i032-$role-$seed" \
                --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
            done
          done
      - name: Evaluate candidate-zero target causal noise-scale observability
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i032-out
          mkdir -p i032-out/evidence
          donor_args=()
          target_args=()
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["donor_seeds"])'); do
            donor_args+=(--donor-corpus "/tmp/i032-donor-$seed/corpus.json")
          done
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            target_args+=(--target-corpus "/tmp/i032-target-$seed/corpus.json")
          done
          set +e
          python3 tests/validation/i032_ns_upstream_target_causal_noise_scale_observability.py \
            --probe build-i032/i032-probe \
            --contract "$CONTRACT" \
            "${donor_args[@]}" \
            "${target_args[@]}" \
            --output i032-out/evidence/result.json \
            > i032-out/evidence/evaluate.stdout \
            2> i032-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > i032-out/evidence/evaluate.exit-code
          cp "$CONTRACT" i032-out/evidence/contract.json
          cp /tmp/i032-development-v3-materialization.json i032-out/evidence/materialization.json
          sha256sum build-i032/i032-probe | awk '{print $1}' > i032-out/evidence/probe.sha256
          for role in donor target; do
            ROLE="$role" python3 - <<'PY'
          import json,os
          c=json.load(open(os.environ["CONTRACT"]))
          for seed in c["fresh_diagnostic_authority"][os.environ["ROLE"]+"_seeds"]:
              print(f"{os.environ['ROLE']} {seed}")
          PY
          done | while read -r role seed; do
            sha256sum "/tmp/i032-$role-$seed/corpus.json"
          done > i032-out/evidence/corpora.sha256
          printf 'main_sha=%s\n' "$GITHUB_SHA" > i032-out/evidence/build-info.txt
          if test -f i032-out/evidence/result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i032-out/evidence/result.json').read_text())
          Path('i032-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_authority':r['fresh_diagnostic_authority'],
                  'shipping_mirror':r['shipping_mirror'],
                  'coverage':r['coverage'],
                  'fidelity':r['fidelity'],
                  'fidelity_hypothesis':r['fidelity_hypothesis'],
                  'descriptive_donor_transfer_association':
                      r['descriptive_donor_transfer_association'],
                  'interpretation_boundary':r['interpretation_boundary'],
              },indent=2,sort_keys=True)+'\n')
          PY
          fi
          (
            cd i032-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | \
              while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          exit "$rc"
      - name: Enforce observability-diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i032-out/evidence/result.json').read_text())
          assert r['decision']=='NS_UPSTREAM_TARGET_CAUSAL_NOISE_SCALE_OBSERVABILITY_DECOMPOSED_REVIEW_REQUIRED'
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['shipping_mirror']['vad_active_mismatch_frames']==0
          b=r['interpretation_boundary']
          assert b['causal_proxy_is_shipping_ns_noise_rms_dbfs'] is True
          assert b['proxy_captured_at_first_pre_ready_speech_target_frame'] is True
          assert b['later_benchmark_uses_only_post_target_reference_frames'] is True
          assert b['later_benchmark_is_retrospective_only'] is True
          assert b['i029_i030_donor_selection_frozen'] is True
          assert b['frozen_independent_component_median_donor_control'] is True
          assert b['no_joint_aggregation_operator_evaluated'] is True
          assert b['no_noise_scale_normalization_mapping'] is True
          assert b['matching_metadata_development_only_not_shippable'] is True
          assert b['no_reference_source_candidate_selected'] is True
          assert b['no_shipping_candidate'] is True
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i032-out/evidence/summary.json; then
            cat i032-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I032 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i032-ns-upstream-target-causal-noise-scale-${{ github.run_id }}
          path: i032-out/
          retention-days: 90
          if-no-files-found: error
