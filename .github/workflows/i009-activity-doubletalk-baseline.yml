name: I009 Activity Double-Talk Baseline

on:
  pull_request:
    paths:
      - 'docs/program/iterations/I009-inherited-double-talk-evidence.json'
      - 'docs/program/iterations/I009-activity-doubletalk-baseline.json'
      - 'tests/validation/i009_activity_doubletalk_baseline.py'
      - '.github/workflows/i009-activity-doubletalk-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: dd3e541c740640412c9b8b76c77cee269563e5b8
      PYTHONPATH: tests/validation:validation/tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate candidate-zero contract and exact delta
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i009_activity_doubletalk_baseline.py
          PYTHONPATH=tests/validation:validation/tools python3 tests/validation/i009_activity_doubletalk_baseline.py --self-test
          python3 -m json.tool docs/program/iterations/I009-inherited-double-talk-evidence.json >/dev/null
          python3 -m json.tool docs/program/iterations/I009-activity-doubletalk-baseline.json >/dev/null
          python3 scripts/program.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/I009-activity-doubletalk-baseline.json').read_text())
          i=json.loads(Path('docs/program/iterations/I009-inherited-double-talk-evidence.json').read_text())
          assert c['schema_version']==1 and c['iteration_id']=='I009'
          assert c['phase']=='activity-double-talk-baseline'
          assert c['root_cause_id']=='activity-double-talk-ratio-admission'
          assert c['base_sha']=='dd3e541c740640412c9b8b76c77cee269563e5b8'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['seeds']==[17109,27109,37109]
          assert c['scenarios']==['near-far-doubletalk','near-far-weak-near']
          assert c['frozen_gate']['min_double_talk_fraction_on_near_active']==0.35
          assert all(v is False for v in c['authority'].values())
          assert c['product_qualification']=='DEFERRED_BY_SCOPE'
          assert i['authority']=='already-observed-regression-root-cause-context-only'
          assert i['may_be_independent_confirmation'] is False
          assert i['may_be_candidate_selection_data'] is False
          assert i['may_authorize_threshold_search'] is False
          assert i['root_cause_differential']['classification_distribution']=={
              'DT_SMOOTHED_RATIO_GATE_LIMIT':3,
              'DT_BOTH_RATIO_GATES_LIMIT':3,
              'DT_INSTANT_RATIO_GATE_LIMIT':0,
              'DT_NOT_EXPLAINED_BY_CURRENT_RATIO_GATES':0,
          }
          PY
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(docs/program/iterations/I009-inherited-double-talk-evidence\.json|docs/program/iterations/I009-activity-doubletalk-baseline\.json|tests/validation/i009_activity_doubletalk_baseline\.py|\.github/workflows/i009-activity-doubletalk-baseline\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          test "${{ github.event.pull_request.base.sha }}" = "$BASE_SHA"
          git diff --quiet "$BASE_SHA" HEAD -- src include CMakeLists.txt

      - name: Prepare immutable current main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exact-base
          git worktree add --detach exact-base "$BASE_SHA"
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p exact-base/docs/program/iterations exact-base/tests/validation
          cp docs/program/iterations/I009-inherited-double-talk-evidence.json exact-base/docs/program/iterations/
          cp docs/program/iterations/I009-activity-doubletalk-baseline.json exact-base/docs/program/iterations/
          cp tests/validation/i009_activity_doubletalk_baseline.py exact-base/tests/validation/
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"
          test -z "$(git -C exact-base diff --name-only -- src include CMakeLists.txt)"

      - name: Execute fresh Development Activity baseline
        shell: bash
        working-directory: exact-base
        run: |
          set -euo pipefail
          rm -rf i009-activity-doubletalk-evidence
          PYTHONPATH=tests/validation:validation/tools \
            python3 tests/validation/i009_activity_doubletalk_baseline.py \
              --contract docs/program/iterations/I009-activity-doubletalk-baseline.json \
              --inherited docs/program/iterations/I009-inherited-double-talk-evidence.json \
              --i006-contract docs/program/iterations/I006-baseline.json \
              --output i009-activity-doubletalk-evidence | tee i009-activity-doubletalk-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i009-activity-doubletalk-evidence/baseline-result.json').read_text())
          assert r['schema_version']==1 and r['iteration_id']=='I009'
          assert r['source_sha']=='dd3e541c740640412c9b8b76c77cee269563e5b8'
          assert r['authority']=='fresh-development-candidate-zero-measurement-only'
          assert r['candidate_limit']==0 and r['confirmation_limit']==0
          assert r['candidate_search_performed'] is False
          assert r['threshold_tuning_performed'] is False
          assert r['shipping_source_changed'] is False and r['promotion_allowed'] is False
          assert r['fresh_development_seeds']==[17109,27109,37109]
          assert r['inherited_i006_seeds_reused'] is False
          assert r['aggregate']['partitions']==6
          assert r['decision'] in ('BASELINE_ADEQUATE_NO_SEARCH','MEASURED_GAP_REVIEW_REQUIRED','INPUT_INVALID_REVIEW_REQUIRED')
          assert r['product_qualification']=='DEFERRED_BY_SCOPE'
          if r['decision']=='INPUT_INVALID_REVIEW_REQUIRED':
              raise SystemExit('I009 input/source preconditions invalid; fail closed')
          PY

      - name: Freeze I009 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=exact-base/i009-activity-doubletalk-evidence
          if test -d "$out"; then
            cp docs/program/iterations/I009-inherited-double-talk-evidence.json "$out/inherited-context.json"
            cp docs/program/iterations/I009-activity-doubletalk-baseline.json "$out/contract.json"
            cp tests/validation/i009_activity_doubletalk_baseline.py "$out/evaluator.py"
            cp tests/validation/i006_agc_root_cause_probe.c "$out/probe.c"
            printf '%s\n' "$BASE_SHA" > "$out/base-sha.txt"
            git rev-parse HEAD > "$out/research-head.txt"
            if test -f exact-base/i009-activity-doubletalk-summary.json; then
              cp exact-base/i009-activity-doubletalk-summary.json "$out/execution-summary.json"
            fi
            find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
          fi

      - name: Publish I009 summary
        if: always()
        shell: bash
        run: |
          result=exact-base/i009-activity-doubletalk-evidence/baseline-result.json
          if test -f "$result"; then
            RESULT="$result" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['RESULT']).read_text())
          a=r['aggregate']
          print('## I009 Activity double-talk baseline')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Exact main: `{r['source_sha']}`")
          print(f"- Fresh Development partitions: `{a['partitions']}`")
          print(f"- Gate-failure partitions: `{a['gate_failure_partitions']}`")
          print(f"- DT fraction range: `{a['double_talk_fraction_range'][0]:.4f}..{a['double_talk_fraction_range'][1]:.4f}`")
          print(f"- Classification distribution: `{a['double_talk_classification_distribution']}`")
          print('- Candidate/confirmation consumed: `0/0`.')
          print('- Threshold tuning / shipping source change: `false/false`.')
          print('- Product Qualification: `DEFERRED_BY_SCOPE`.')
          PY
          fi

      - name: Upload I009 Activity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: i009-activity-doubletalk-baseline-${{ github.run_id }}
          path: exact-base/i009-activity-doubletalk-evidence/
          retention-days: 90
          if-no-files-found: error
