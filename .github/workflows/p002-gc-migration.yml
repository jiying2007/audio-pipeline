name: P002 GC Migration

on:
  push:
    branches: [governance/p002-governance-fix-v1]
    paths:
      - .github/program/p002_patch_gc.py
      - .github/workflows/p002-gc-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: governance/p002-governance-fix-v1
          fetch-depth: 0
      - name: Apply and validate GC active-dependency migration
        run: |
          set -euo pipefail
          python3 .github/program/p002_patch_gc.py
          python3 scripts/research_registry.py --self-test
          python3 -m json.tool .github/research/evidence-index.json >/dev/null
          git diff --check
          git diff --exit-code 699c1f604611b5018ab3cb7a712ed1a8942cedcb -- src include CMakeLists.txt
      - name: Commit only GC production changes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/research_registry.py .github/research/evidence-index.json
          git diff --cached --quiet && exit 0
          git commit -m 'governance: block research GC on active dependencies'
          git push origin HEAD:governance/p002-governance-fix-v1
