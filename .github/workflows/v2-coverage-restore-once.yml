name: V2 Coverage Restore Once

on:
  push:
    branches: [feat/v2-hard-cut-cleanup]

permissions:
  contents: write

concurrency:
  group: v2-coverage-restore-once
  cancel-in-progress: false

jobs:
  restore:
    if: "${{ github.event.head_commit.message != 'test!: restore v2 behavioral coverage gate' }}"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: feat/v2-hard-cut-cleanup
      - name: Register v2 control-plane contract tests
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')

          pipeline_anchor = '''        add_executable(ap_contract_tests tests/test_contracts.c)\n        target_link_libraries(ap_contract_tests PRIVATE audio_pipeline)\n        add_test(NAME ap_contract_tests COMMAND ap_contract_tests)\n'''
          pipeline_block = pipeline_anchor + '''        add_executable(ap_pipeline_control_tests tests/test_pipeline_controls.c)\n        target_link_libraries(ap_pipeline_control_tests PRIVATE audio_pipeline)\n        add_test(NAME ap_pipeline_control_tests COMMAND ap_pipeline_control_tests)\n'''
          if 'ap_pipeline_control_tests' not in text:
              if text.count(pipeline_anchor) != 1:
                  raise SystemExit('pipeline test registration anchor mismatch')
              text = text.replace(pipeline_anchor, pipeline_block, 1)

          runtime_anchor = '''        add_executable(ap_runtime_tests tests/test_runtime.c)\n        target_link_libraries(ap_runtime_tests PRIVATE audio_pipeline_runtime)\n        add_test(NAME ap_runtime_tests COMMAND ap_runtime_tests)\n'''
          runtime_block = runtime_anchor + '''        add_executable(ap_runtime_extended_tests tests/test_runtime_extended.c)\n        target_link_libraries(ap_runtime_extended_tests PRIVATE audio_pipeline_runtime)\n        add_test(NAME ap_runtime_extended_tests COMMAND ap_runtime_extended_tests)\n'''
          if 'ap_runtime_extended_tests' not in text:
              if text.count(runtime_anchor) != 1:
                  raise SystemExit('runtime test registration anchor mismatch')
              text = text.replace(runtime_anchor, runtime_block, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          grep -q 'ap_pipeline_control_tests' CMakeLists.txt
          grep -q 'ap_runtime_extended_tests' CMakeLists.txt
      - name: Enforce restored v2 coverage before commit
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/check-architecture.sh
          cmake -S . -B build-v2-coverage-strict -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-v2-coverage-strict --parallel
          ctest --test-dir build-v2-coverage-strict --output-on-failure
          cmake -S . -B build-v2-coverage -DCMAKE_BUILD_TYPE=Debug -DAP_BUILD_BENCH=OFF \
            -DCMAKE_C_FLAGS='--coverage -O0 -g' -DCMAKE_EXE_LINKER_FLAGS='--coverage'
          cmake --build build-v2-coverage --parallel
          ctest --test-dir build-v2-coverage --output-on-failure
          gcovr --root . --filter 'src/' --exclude 'tests/' --fail-under-line 90 --print-summary
          sh scripts/check-abi-contract.sh
      - name: Commit restored coverage and remove migrator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-coverage-restore-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test!: restore v2 behavioral coverage gate'
          git push origin HEAD:feat/v2-hard-cut-cleanup
