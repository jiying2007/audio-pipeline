name: Research Pure-Far DTD Evidence Closure V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/pure-far-dtd-evidence-closure-v1.json'
      - '.github/workflows/research-pure-far-dtd-evidence-closure-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/pure-far-dtd-evidence-closure-v1.json'
      - '.github/workflows/research-pure-far-dtd-evidence-closure-v1.yml'

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate closure scope and authority
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          p = Path('.github/research/continuous-optimization/development-v3/pure-far-dtd-evidence-closure-v1.json')
          m = json.loads(p.read_text())
          assert m['schema_version'] == 1
          assert m['investigation_id'] == 'pure-far-dtd-evidence-closure-v1'
          assert m['status'] == 'CLOSED_DIAGNOSTIC_PLATEAU'
          assert m['candidate_budget'] == 0
          base = m['governance_base_sha']
          assert base == 'af00c6642598290006db929fddb9f809313953aa'
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'], check=True)
          changed = subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'], text=True).splitlines()
          allowed = {
            '.github/research/continuous-optimization/development-v3/pure-far-dtd-evidence-closure-v1.json',
            '.github/workflows/research-pure-far-dtd-evidence-closure-v1.yml',
          }
          assert changed and set(changed) <= allowed, changed
          fresh = m['fresh_main_closure']
          assert fresh == {
            'pr': 242,
            'sha': base,
            'diagnostic_run_id': 35192472921,
            'diagnostic_run_number': 2,
            'diagnostic_artifact_id': 10484986069,
            'diagnostic_artifact_digest': 'sha256:34b21172c83cded29b666aec4c2f5693c9b65246229742293183b711cb5a95ee',
            'hosted_real_aec_run_id': 35192472908,
            'hosted_real_aec_run_number': 807,
            'hosted_real_audio_run_id': 35192472939,
            'hosted_real_audio_run_number': 812,
            'verify_run_id': 35192473328,
            'verify_run_number': 1012,
            'release_run_id': 35192796528,
            'release_run_number': 997,
            'fresh_main_closed': True,
          }
          assert m['shipping_baseline'] == {
            'version': 'v2.3.16',
            'sha': '57e4c64adc1cf06819e46e24e275ecd746d5f17f',
            'unchanged': True,
          }
          assert m['output_authority'] == {
            'research_diagnostic_only': True,
            'candidate_selection': False,
            'tuning': False,
            'automatic_main_mutation': False,
            'shipping': False,
            'hil': False,
            'product_certification': False,
          }
          closure = json.loads(Path('.github/research/continuous-optimization/development-v3/doubletalk-onset-admission-v1-closure.json').read_text())
          assert closure['status'] == 'CLOSED_KEEP_BASELINE'
          assert closure['candidate']['budget_remaining'] == 0
          assert len(m['confirmed_software_mechanism']) >= 6
          assert len(m['remaining_unknowns']) >= 3
          assert len(m['rejected_explanations_as_primary_cause']) >= 7
          print({'base': base, 'head': subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(), 'changed': changed})
          print('pure-far DTD evidence closure: PASS')
          PY
