name: Research I032 NS Upstream Target Causal Noise Scale Observability v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i032-ns-upstream-target-causal-noise-scale-observability-v1.json'
      - '.github/research/continuous-optimization/development-v4/i032-ns-upstream-target-causal-noise-scale-observability-v1-result.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i032_ns_upstream_target_causal_noise_scale_observability.py'
      - 'tests/validation/test_i032_one_shot_guard.py'
      - 'tests/validation/test_i032_retirement.py'
      - 'tests/validation/data/i032-consumed-workflow.yml'
      - 'validation/research/evidence/i032-36688937963/**'
      - '.github/workflows/research-i032-ns-upstream-target-causal-noise-scale-observability-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I032 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool             .github/research/continuous-optimization/development-v4/i032-ns-upstream-target-causal-noise-scale-observability-v1-result.json >/dev/null
          python3 -m py_compile             tests/validation/i032_ns_upstream_target_causal_noise_scale_observability.py             tests/validation/test_i032_one_shot_guard.py             tests/validation/test_i032_retirement.py
          python3 tests/validation/i032_ns_upstream_target_causal_noise_scale_observability.py --self-test
          python3 tests/validation/test_i032_one_shot_guard.py
          python3 tests/validation/test_i032_retirement.py
