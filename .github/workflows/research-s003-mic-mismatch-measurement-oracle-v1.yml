name: Research S003 Mic Mismatch Measurement Oracle v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-mic-mismatch-measurement-domain-oracle-v1.json'
      - 'docs/program/iterations/S003-mic-mismatch-measurement-domain-oracle-v1-result.json'
      - 'validation/failure-replay/catalog.json'
      - 'validation/failure-replay/entries/s003-mic-gain-delay-mismatch-v1.json'
      - 'validation/failure-replay/README.md'
      - 'tests/validation/data/s003-mic-mismatch-measurement-oracle-consumed-workflow.yml'
      - 'tests/validation/test_s003_mic_mismatch_measurement_oracle_retirement.py'
      - 'tests/validation/test_s003_slr31_retirement.py'
      - 'tests/validation/test_s003_cross_source_retirement.py'
      - '.github/workflows/research-s003-mic-mismatch-measurement-oracle-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate reviewed terminal evidence
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-mic-mismatch-measurement-domain-oracle-v1.json >/dev/null
          python3 -m json.tool             docs/program/iterations/S003-mic-mismatch-measurement-domain-oracle-v1-result.json >/dev/null
          python3 -m json.tool validation/failure-replay/catalog.json >/dev/null
          python3 -m json.tool             validation/failure-replay/entries/s003-mic-gain-delay-mismatch-v1.json >/dev/null
          python3 -m py_compile             tests/validation/test_s003_mic_mismatch_measurement_oracle_retirement.py             tests/validation/test_s003_slr31_retirement.py             tests/validation/test_s003_cross_source_retirement.py
          python3 tests/validation/test_s003_mic_mismatch_measurement_oracle_retirement.py
          python3 tests/validation/test_s003_slr31_retirement.py
          python3 tests/validation/test_s003_cross_source_retirement.py
