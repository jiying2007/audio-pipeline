name: I007 BF Health Baseline

on:
  pull_request:
    paths:
      - 'docs/program/iterations/I007-bf-health-baseline.json'
      - 'tests/validation/i007_bf_health_corpus.py'
      - 'tests/validation/i007_bf_health_probe.c'
      - 'tests/validation/i007_bf_health_baseline.py'
      - '.github/workflows/i007-bf-health-baseline.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: dd15a956e52e9bc04fe103c62163c6cfa870b57b
      PYTHONPATH: tests/validation:validation/tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate frozen candidate-zero contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i007_bf_health_corpus.py tests/validation/i007_bf_health_baseline.py
          PYTHONPATH=tests/validation:validation/tools python3 tests/validation/i007_bf_health_corpus.py --self-test
          PYTHONPATH=tests/validation:validation/tools python3 tests/validation/i007_bf_health_baseline.py --self-test
          python3 -m json.tool docs/program/iterations/I007-bf-health-baseline.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/program/iterations/I007-bf-health-baseline.json').read_text())
          assert c['schema_version'] == 1 and c['iteration_id'] == 'I007'
          assert c['phase'] == 'bf-health-baseline-measurement'
          assert c['base_sha'] == 'dd15a956e52e9bc04fe103c62163c6cfa870b57b'
          assert c['candidate_limit'] == 0 and c['confirmation_limit'] == 0
          assert c['promotion_allowed'] is False and c['shipping_source_change_allowed'] is False
          assert c['seeds'] == [1707, 2707, 3707]
          assert c['frontends'] == ['bf-only', 'hpf-bf']
          assert len(c['scenarios']) == 8
          assert all(value is False for value in c['authority'].values())
          assert c['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(docs/program/iterations/I007-bf-health-baseline\.json|tests/validation/i007_bf_health_corpus\.py|tests/validation/i007_bf_health_probe\.c|tests/validation/i007_bf_health_baseline\.py|\.github/workflows/i007-bf-health-baseline\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 5

      - name: Prepare immutable reviewed-main worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exact-base
          git worktree add --detach exact-base "$BASE_SHA"
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p exact-base/docs/program/iterations exact-base/tests/validation
          cp docs/program/iterations/I007-bf-health-baseline.json exact-base/docs/program/iterations/
          cp tests/validation/i007_bf_health_corpus.py exact-base/tests/validation/
          cp tests/validation/i007_bf_health_probe.c exact-base/tests/validation/
          cp tests/validation/i007_bf_health_baseline.py exact-base/tests/validation/
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"

      - name: Execute exact-main candidate-zero BF health measurement
        shell: bash
        working-directory: exact-base
        run: |
          set -euo pipefail
          rm -rf i007-bf-health-evidence
          PYTHONPATH=tests/validation:validation/tools \
            python3 tests/validation/i007_bf_health_baseline.py \
              --contract docs/program/iterations/I007-bf-health-baseline.json \
              --output i007-bf-health-evidence | tee i007-bf-health-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('i007-bf-health-evidence/baseline-result.json').read_text())
          assert r['schema_version'] == 1 and r['iteration_id'] == 'I007'
          assert r['source_sha'] == 'dd15a956e52e9bc04fe103c62163c6cfa870b57b'
          assert r['authority'] == 'candidate-zero-current-main-bf-health-only'
          assert r['candidate_limit'] == 0 and r['confirmation_limit'] == 0
          assert r['shipping_source_changed'] is False
          assert r['candidate_search_performed'] is False
          assert r['promotion_allowed'] is False
          assert r['aggregate']['case_partitions'] == 48
          assert r['decision'] in ('BASELINE_ADEQUATE_NO_SEARCH', 'MEASURED_GAP_REVIEW_REQUIRED', 'INPUT_INVALID_REVIEW_REQUIRED')
          assert r['candidate_decision'] == 'NOT_AN_ACOUSTIC_CANDIDATE'
          assert r['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY

      - name: Freeze evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=exact-base/i007-bf-health-evidence
          if test -d "$out"; then
            cp docs/program/iterations/I007-bf-health-baseline.json "$out/contract.json"
            cp tests/validation/i007_bf_health_corpus.py "$out/corpus-generator.py"
            cp tests/validation/i007_bf_health_probe.c "$out/probe.c"
            cp tests/validation/i007_bf_health_baseline.py "$out/evaluator.py"
            printf '%s\n' "$BASE_SHA" > "$out/base-sha.txt"
            git rev-parse HEAD > "$out/research-head.txt"
            if test -f exact-base/i007-bf-health-summary.json; then
              cp exact-base/i007-bf-health-summary.json "$out/execution-summary.json"
            fi
            find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
          fi

      - name: Publish BF health summary
        if: always()
        shell: bash
        run: |
          result=exact-base/i007-bf-health-evidence/baseline-result.json
          if test -f "$result"; then
            RESULT="$result" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT']).read_text())
          print('## I007 candidate-zero BF health baseline')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Exact reviewed main: `{r['source_sha']}`")
          print(f"- Partitions: `{r['aggregate']['case_partitions']}`")
          print(f"- Gate-failure partitions: `{r['aggregate']['gate_failure_partitions']}`")
          print(f"- Failure counts: `{r['aggregate']['failure_counts']}`")
          print('- Candidate/confirmation consumed: `0/0`.')
          print('- Shipping DSP changed: `false`.')
          print('- Product qualification: `DEFERRED_BY_SCOPE`.')
          PY
          fi

      - name: Upload I007 BF health evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: i007-bf-health-${{ github.run_id }}
          path: exact-base/i007-bf-health-evidence/
          retention-days: 90
          if-no-files-found: error
