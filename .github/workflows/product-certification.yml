name: Product Certification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source ref to certify
        required: true
        default: main
      sku:
        description: Shipping SKU id; must match policy.sku
        required: true
        default: cortex-a32-low
      policy_path:
        description: Shipping-approved certification policy in repository
        required: true
        default: certification/policies/cortex-a32-low-shipping.json
      corpus_manifest:
        description: Absolute path to real product corpus manifest on DUT
        required: true
      acoustic_json:
        description: Absolute path to real product acoustic result JSON on DUT
        required: true
      capture_device:
        required: true
        default: hw:0,0
      playback_device:
        required: true
        default: hw:0,0
      farend_pcm:
        description: Absolute path to real far-end PCM on DUT
        required: true
      sample_rate:
        required: true
        default: '16000'
      mic_channels:
        required: true
        default: '2'
      dsp_cpu:
        required: true
        default: '1'
      ambient_c:
        required: true
        default: '25'
      power_input:
        description: Live target power-sensor path
        required: true
      power_scale:
        required: true
        default: '1000000'
      benchmark_seconds:
        required: true
        default: '120'
      soak_seconds:
        description: Must satisfy policy minimum; formal shipping policy requires 72h
        required: true
        default: '259200'
      shipping_cc:
        description: Absolute path to exact shipping C compiler on audio-builder
        required: true
      shipping_sysroot:
        description: Absolute path to exact shipping sysroot on audio-builder
        required: true
      shipping_toolchain_root:
        description: Root of exact shipping toolchain on audio-builder
        required: true
      shipping_cflags:
        description: Exact shipping C flags
        required: true
      shipping_cmake_args_json:
        description: JSON array of exact reviewed SKU CMake arguments
        required: true

permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write

concurrency:
  group: product-certification-${{ inputs.sku }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      required_soak_seconds: ${{ steps.policy.outputs.required_soak_seconds }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve immutable source revision
        id: resolve
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate shipping policy before hardware allocation
        id: policy
        env:
          SKU: ${{ inputs.sku }}
          POLICY: ${{ inputs.policy_path }}
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          repo = Path.cwd().resolve()
          policy_base = (repo / 'certification' / 'policies').resolve()
          raw_policy = Path(os.environ['POLICY'])
          if raw_policy.is_absolute() or raw_policy.suffix != '.json':
              raise SystemExit('policy_path must be a repository-relative JSON policy')
          policy_path = (repo / raw_policy).resolve()
          if policy_base != policy_path.parent and policy_base not in policy_path.parents:
              raise SystemExit('policy_path must stay under certification/policies')
          policy = json.loads(policy_path.read_text())
          if policy.get('shipping_approved') is not True:
              raise SystemExit('policy is not shipping_approved')
          if policy.get('sku') != os.environ['SKU']:
              raise SystemExit('policy.sku does not match requested SKU')
          pid = str(policy.get('policy_id', ''))
          if pid.startswith('example-') or 'not-for-shipping' in pid:
              raise SystemExit('example/not-for-shipping policy rejected')
          required = int(float(policy['min_soak_hours']) * 3600)
          if int(os.environ['SOAK_SECONDS']) < required:
              raise SystemExit(f'soak_seconds below policy minimum: {required}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'required_soak_seconds={required}\n')
          print(f"shipping policy={pid} minimum_soak_seconds={required}")
          PY

  build-shipping:
    needs: resolve
    runs-on: [self-hosted, linux, audio-builder]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Verify exact builder inputs
        env:
          CC: ${{ inputs.shipping_cc }}
          SYSROOT: ${{ inputs.shipping_sysroot }}
          TOOLCHAIN_ROOT: ${{ inputs.shipping_toolchain_root }}
          CFLAGS: ${{ inputs.shipping_cflags }}
          CMAKE_ARGS_JSON: ${{ inputs.shipping_cmake_args_json }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ needs.resolve.outputs.sha }}'
          test -x "$CC"
          test -d "$SYSROOT"
          test -d "$TOOLCHAIN_ROOT"
          test -n "$CFLAGS"
          python3 - <<'PY'
          import json, os
          args = json.loads(os.environ['CMAKE_ARGS_JSON'])
          if not isinstance(args, list) or not args or not all(isinstance(item, str) and item for item in args):
              raise SystemExit('shipping_cmake_args_json must be a non-empty JSON array of non-empty strings')
          forbidden = (
              '-DCMAKE_C_COMPILER=', '-DCMAKE_SYSROOT=', '-DCMAKE_FIND_ROOT_PATH=',
              '-DCMAKE_FIND_ROOT_PATH_MODE_', '-DCMAKE_C_FLAGS=', '-DCMAKE_BUILD_TYPE=',
          )
          bad = [item for item in args if item.startswith(forbidden)]
          if bad:
              raise SystemExit(f'SKU CMake arguments may not override enforced shipping boundaries: {bad}')
          print(f'validated {len(args)} exact SKU CMake arguments')
          PY
          "$CC" --version | head -n 1
      - name: Build exact shipping binaries
        env:
          CC: ${{ inputs.shipping_cc }}
          SYSROOT: ${{ inputs.shipping_sysroot }}
          CFLAGS: ${{ inputs.shipping_cflags }}
          CMAKE_ARGS_JSON: ${{ inputs.shipping_cmake_args_json }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t extra < <(python3 -c 'import json,os,sys; [sys.stdout.write(item + "\0") for item in json.loads(os.environ["CMAKE_ARGS_JSON"])]')
          cmake -S . -B build-shipping "${extra[@]}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_SYSROOT="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_C_FLAGS="$CFLAGS" -DAP_BUILD_ALSA_EXAMPLE=ON \
            -DAP_BUILD_TESTS=OFF -DAP_BUILD_EXAMPLES=ON -DAP_BUILD_BENCH=ON
          cmake --build build-shipping --parallel --target ap_bench ap_build_info_dump ap_alsa_runtime_duplex
      - name: Seal builder binary and toolchain identity
        env:
          CC: ${{ inputs.shipping_cc }}
          SYSROOT: ${{ inputs.shipping_sysroot }}
          TOOLCHAIN_ROOT: ${{ inputs.shipping_toolchain_root }}
          CFLAGS: ${{ inputs.shipping_cflags }}
          CMAKE_ARGS_JSON: ${{ inputs.shipping_cmake_args_json }}
        run: |
          set -euo pipefail
          mkdir -p shipping-bundle/bin
          cp build-shipping/ap_bench build-shipping/ap_build_info_dump build-shipping/ap_alsa_runtime_duplex shipping-bundle/bin/
          cp build-shipping/CMakeCache.txt shipping-bundle/
          printf '%s\n' "$CMAKE_ARGS_JSON" > shipping-bundle/shipping-cmake-args.json
          python3 tools/certification_provenance.py snapshot \
            --stage build --revision '${{ needs.resolve.outputs.sha }}' \
            --runner-name "$RUNNER_NAME" --runner-arch "$RUNNER_ARCH" \
            --binary shipping-bundle/bin/ap_bench \
            --binary shipping-bundle/bin/ap_build_info_dump \
            --binary shipping-bundle/bin/ap_alsa_runtime_duplex \
            --compiler "$CC" --sysroot "$SYSROOT" --toolchain-root "$TOOLCHAIN_ROOT" \
            --cflags "$CFLAGS" --cmake-args-json "$CMAKE_ARGS_JSON" \
            --output shipping-bundle/build-provenance.json
          (cd shipping-bundle && sha256sum bin/* CMakeCache.txt shipping-cmake-args.json build-provenance.json > SHA256SUMS)
      - name: Upload exact shipping build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shipping-build-${{ needs.resolve.outputs.sha }}
          path: shipping-bundle
          retention-days: 7
          if-no-files-found: error

  certify-dut:
    needs: [resolve, build-shipping]
    runs-on: [self-hosted, linux, audio-target]
    timeout-minutes: 4380
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: shipping-build-${{ needs.resolve.outputs.sha }}
          path: shipping-build
      - name: Verify and deploy exact builder artifact
        run: |
          set -euo pipefail
          (cd shipping-build && sha256sum -c SHA256SUMS)
          deploy="/tmp/audio-pipeline-cert-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}"
          rm -rf "$deploy"
          mkdir -p "$deploy"
          cp shipping-build/bin/* "$deploy/"
          chmod 0755 "$deploy"/*
          echo "DEPLOY_DIR=$deploy" >> "$GITHUB_ENV"
          python3 tools/certification_provenance.py snapshot \
            --stage deployed --revision '${{ needs.resolve.outputs.sha }}' \
            --runner-name "$RUNNER_NAME" --runner-arch "$RUNNER_ARCH" \
            --binary "$deploy/ap_bench" --binary "$deploy/ap_build_info_dump" \
            --binary "$deploy/ap_alsa_runtime_duplex" \
            --output /tmp/deployed-provenance.json
          "$deploy/ap_build_info_dump" | tee /tmp/deployed-build-info.txt
      - name: Collect real target benchmark evidence
        env:
          AMBIENT_C: ${{ inputs.ambient_c }}
          POWER_INPUT: ${{ inputs.power_input }}
          POWER_SCALE: ${{ inputs.power_scale }}
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          MIC_CHANNELS: ${{ inputs.mic_channels }}
          DSP_CPU: ${{ inputs.dsp_cpu }}
          BENCHMARK_SECONDS: ${{ inputs.benchmark_seconds }}
        run: |
          set -euo pipefail
          python3 tools/target_evidence.py benchmark \
            --binary "$DEPLOY_DIR/ap_bench" --output /tmp/benchmark.json \
            --seconds "$BENCHMARK_SECONDS" --idle-seconds 30 --dsp-cpu "$DSP_CPU" \
            --sample-rate "$SAMPLE_RATE" --mic-channels "$MIC_CHANNELS" \
            --ambient-c "$AMBIENT_C" --power-input "$POWER_INPUT" \
            --power-scale "$POWER_SCALE" --require-sensors
      - name: Run real product route certification soak
        env:
          CAPTURE: ${{ inputs.capture_device }}
          PLAYBACK: ${{ inputs.playback_device }}
          FAREND: ${{ inputs.farend_pcm }}
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          MIC_CHANNELS: ${{ inputs.mic_channels }}
          DSP_CPU: ${{ inputs.dsp_cpu }}
          SOAK_SECONDS: ${{ inputs.soak_seconds }}
          POWER_INPUT: ${{ inputs.power_input }}
          POWER_SCALE: ${{ inputs.power_scale }}
        run: |
          set -euo pipefail
          test "$SOAK_SECONDS" -ge '${{ needs.resolve.outputs.required_soak_seconds }}'
          python3 tools/target_evidence.py route-soak \
            --binary "$DEPLOY_DIR/ap_alsa_runtime_duplex" --output /tmp/soak.json \
            --capture-device "$CAPTURE" --playback-device "$PLAYBACK" \
            --farend "$FAREND" --seconds "$SOAK_SECONDS" \
            --sample-rate "$SAMPLE_RATE" --mic-channels "$MIC_CHANNELS" --dsp-cpu "$DSP_CPU" \
            --max-xruns 0 --max-overruns 0 \
            --power-input "$POWER_INPUT" --power-scale "$POWER_SCALE"
      - name: Bind build deployed and executed binary identity
        run: |
          set -euo pipefail
          python3 tools/certification_provenance.py snapshot \
            --stage executed --revision '${{ needs.resolve.outputs.sha }}' \
            --runner-name "$RUNNER_NAME" --runner-arch "$RUNNER_ARCH" \
            --binary "$DEPLOY_DIR/ap_bench" --binary "$DEPLOY_DIR/ap_build_info_dump" \
            --binary "$DEPLOY_DIR/ap_alsa_runtime_duplex" \
            --output /tmp/executed-provenance.json
          python3 tools/certification_provenance.py verify \
            --build shipping-build/build-provenance.json \
            --deployed /tmp/deployed-provenance.json \
            --executed /tmp/executed-provenance.json \
            --output /tmp/deployment-provenance.json
      - name: Assemble and validate v4 product certification
        env:
          SKU: ${{ inputs.sku }}
          POLICY: ${{ inputs.policy_path }}
          CORPUS: ${{ inputs.corpus_manifest }}
          ACOUSTIC: ${{ inputs.acoustic_json }}
          CAPTURE: ${{ inputs.capture_device }}
          PLAYBACK: ${{ inputs.playback_device }}
          SAMPLE_RATE: ${{ inputs.sample_rate }}
          MIC_CHANNELS: ${{ inputs.mic_channels }}
        run: |
          set -euo pipefail
          test -f "$CORPUS"
          test -f "$ACOUSTIC"
          rm -rf certification-out
          python3 tools/ap_certify.py \
            --sku "$SKU" --policy "$POLICY" --corpus-manifest "$CORPUS" \
            --benchmark-json /tmp/benchmark.json --acoustic-json "$ACOUSTIC" \
            --soak-json /tmp/soak.json --deployment-provenance /tmp/deployment-provenance.json \
            --output-dir certification-out --capture-device "$CAPTURE" --playback-device "$PLAYBACK" \
            --sample-rate "$SAMPLE_RATE" --mic-channels "$MIC_CHANNELS" \
            --build-info-bin "$DEPLOY_DIR/ap_build_info_dump" \
            --binary "$DEPLOY_DIR/ap_bench" --binary "$DEPLOY_DIR/ap_alsa_runtime_duplex" \
            --cmake-cache shipping-build/CMakeCache.txt
          python3 certification/validate_record.py certification-out/record.json \
            --policy "$POLICY" --corpus-manifest "$CORPUS" \
            --evidence-manifest certification-out/evidence-manifest.json
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -czf certification-out.tar.gz certification-out
          sha256sum certification-out.tar.gz | tee certification-out.tar.gz.sha256
      - name: Attest certification evidence bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: certification-out.tar.gz
      - name: Upload certification transport artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-certification-${{ inputs.sku }}-${{ needs.resolve.outputs.sha }}
          path: |
            certification-out.tar.gz
            certification-out.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Clean deployment directory
        if: always()
        run: rm -rf "${DEPLOY_DIR:-/tmp/audio-pipeline-cert-missing}"

  archive:
    needs: [resolve, certify-dut]
    runs-on: [self-hosted, linux, certification-archive]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: product-certification-${{ inputs.sku }}-${{ needs.resolve.outputs.sha }}
          path: certification-transport
      - name: Require immutable product-lifecycle archive backend
        run: |
          set -euo pipefail
          (cd certification-transport && sha256sum -c certification-out.tar.gz.sha256)
          test -x /usr/local/bin/audio-pipeline-cert-archive
          /usr/local/bin/audio-pipeline-cert-archive \
            --input certification-transport/certification-out.tar.gz \
            --sha256 "$(sha256sum certification-transport/certification-out.tar.gz | awk '{print $1}')" \
            --retention-class product-lifecycle \
            --output archive-receipt.json
          python3 certification/validate_archive_receipt.py \
            --receipt archive-receipt.json \
            --bundle certification-transport/certification-out.tar.gz
      - name: Attest lifecycle archive receipt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: archive-receipt.json
      - name: Upload archive receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certification-archive-receipt-${{ inputs.sku }}-${{ needs.resolve.outputs.sha }}
          path: archive-receipt.json
          retention-days: 90
          if-no-files-found: error
