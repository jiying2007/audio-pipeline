name: E001 Activation Preflight
run-name: e001-activation-preflight ${{ inputs.release_tag }} ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact immutable software release source SHA to activate
        required: true
        type: string
      release_tag:
        description: Immutable release tag bound to source_sha
        required: true
        default: v2.3.13
        type: string
      extended_data_root:
        description: Optional Extended Real data root on audio-validation; blank resolves AUDIO_PIPELINE_LAB_DATA_ROOT or $HOME/audio-validation-extended
        required: false
        default: ''
        type: string
      shipping_cc:
        description: Absolute exact shipping C compiler on audio-builder
        required: true
        type: string
      shipping_sysroot:
        description: Absolute exact shipping sysroot on audio-builder
        required: true
        type: string
      shipping_toolchain_root:
        description: Absolute exact shipping toolchain root on audio-builder
        required: true
        type: string
      board_manifest:
        description: Optional absolute board manifest on audio-target; blank resolves AUDIO_PIPELINE_LAB_BOARD or XDG/HOME
        required: false
        default: ''
        type: string
      archive_command:
        description: Immutable certification archive backend on certification-archive
        required: true
        default: /usr/local/bin/audio-pipeline-cert-archive
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: e001-activation-preflight-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Bind exact immutable E001 release baseline and activation controls
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          HIL_ENABLED: ${{ vars.HIL_ENABLED }}
          EXTENDED_REAL_ENABLED: ${{ vars.EXTENDED_REAL_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha must be a 40-character commit SHA' >&2; exit 2; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'release_tag must be semantic vX.Y.Z' >&2; exit 2; }
          test "$HIL_ENABLED" = true || { echo 'E001 activation requires HIL_ENABLED=true' >&2; exit 2; }
          test "$EXTENDED_REAL_ENABLED" = true || { echo 'E001 activation requires EXTENDED_REAL_ENABLED=true' >&2; exit 2; }
          SOURCE_SHA=${SOURCE_SHA,,}
          python3 - <<'PY'
          import json, os
          contract = json.load(open('docs/program/iterations/E001-readiness.json'))
          baseline = contract['software_baseline']
          if baseline['source_sha'] != os.environ['SOURCE_SHA'].lower():
              raise SystemExit('source_sha does not match committed E001 software baseline')
          if baseline['release'] != os.environ['RELEASE_TAG']:
              raise SystemExit('release_tag does not match committed E001 software baseline')
          if baseline.get('immutable_required') is not True:
              raise SystemExit('E001 baseline must require immutable release')
          PY
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.immutable')" = true
          gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" > /tmp/e001-runners.json
          python3 - <<'PY'
          import json
          required = {'audio-validation', 'audio-builder', 'audio-target', 'certification-archive'}
          data = json.load(open('/tmp/e001-runners.json'))
          online = set()
          for runner in data.get('runners', []):
              if runner.get('status') != 'online':
                  continue
              labels = {item.get('name') for item in runner.get('labels', [])}
              for role in required:
                  if {'self-hosted', 'linux', role} <= labels:
                      online.add(role)
          missing = sorted(required - online)
          if missing:
              raise SystemExit(f'E001 trusted runner roles not online: {missing}')
          print(f'E001 online trusted runner roles: {sorted(online)}')
          PY
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  validation:
    needs: resolve
    runs-on: [self-hosted, linux, audio-validation]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Preflight audio-validation for Extended Real
        env:
          INPUT_DATA_ROOT: ${{ inputs.extended_data_root }}
        shell: bash
        run: |
          set -euo pipefail
          DATA_ROOT=$INPUT_DATA_ROOT
          if [ -z "$DATA_ROOT" ]; then DATA_ROOT=${AUDIO_PIPELINE_LAB_DATA_ROOT:-$HOME/audio-validation-extended}; fi
          case "$DATA_ROOT" in /*) ;; *) echo 'extended_data_root must resolve absolute' >&2; exit 2 ;; esac
          python3 tools/runner_preflight.py \
            --role audio-validation \
            --source-revision '${{ needs.resolve.outputs.sha }}' \
            --data-root "$DATA_ROOT" \
            --extended-catalog "$GITHUB_WORKSPACE/validation/extended.datasets.lock.json" \
            --require-command ffmpeg \
            --writable-path "$GITHUB_WORKSPACE" \
            --output runner-readiness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e001-preflight-audio-validation-${{ github.run_id }}
          path: runner-readiness.json
          retention-days: 90
          if-no-files-found: warn

  builder:
    needs: resolve
    runs-on: [self-hosted, linux, audio-builder]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Preflight exact shipping builder
        env:
          CC: ${{ inputs.shipping_cc }}
          SYSROOT: ${{ inputs.shipping_sysroot }}
          TOOLCHAIN_ROOT: ${{ inputs.shipping_toolchain_root }}
        run: |
          set -euo pipefail
          python3 tools/runner_preflight.py \
            --role audio-builder \
            --source-revision '${{ needs.resolve.outputs.sha }}' \
            --shipping-cc "$CC" --shipping-sysroot "$SYSROOT" \
            --shipping-toolchain-root "$TOOLCHAIN_ROOT" \
            --writable-path "$GITHUB_WORKSPACE" \
            --output runner-readiness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e001-preflight-audio-builder-${{ github.run_id }}
          path: runner-readiness.json
          retention-days: 90
          if-no-files-found: warn

  target:
    needs: resolve
    runs-on: [self-hosted, linux, audio-target]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Preflight isolated audio-target without executing hardware tests
        env:
          INPUT_BOARD: ${{ inputs.board_manifest }}
        shell: bash
        run: |
          set -euo pipefail
          BOARD=$INPUT_BOARD
          if [ -z "$BOARD" ]; then BOARD=${AUDIO_PIPELINE_LAB_BOARD:-${XDG_CONFIG_HOME:-$HOME/.config}/audio-pipeline/board.json}; fi
          case "$BOARD" in /*) ;; *) echo 'board_manifest must resolve absolute' >&2; exit 2 ;; esac
          test -f "$BOARD"
          python3 tools/runner_preflight.py \
            --role audio-target \
            --source-revision '${{ needs.resolve.outputs.sha }}' \
            --board-manifest "$BOARD" \
            --require-command cmake --require-command cc \
            --require-command arecord --require-command aplay \
            --writable-path /tmp \
            --output runner-readiness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e001-preflight-audio-target-${{ github.run_id }}
          path: runner-readiness.json
          retention-days: 90
          if-no-files-found: warn

  archive:
    needs: resolve
    runs-on: [self-hosted, linux, certification-archive]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Preflight immutable certification archive
        env:
          ARCHIVE_COMMAND: ${{ inputs.archive_command }}
        run: |
          set -euo pipefail
          python3 tools/runner_preflight.py \
            --role certification-archive \
            --source-revision '${{ needs.resolve.outputs.sha }}' \
            --archive-command "$ARCHIVE_COMMAND" \
            --writable-path "$GITHUB_WORKSPACE" \
            --output runner-readiness.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: e001-preflight-certification-archive-${{ github.run_id }}
          path: runner-readiness.json
          retention-days: 90
          if-no-files-found: warn

  aggregate:
    if: always() && needs.resolve.result == 'success'
    needs: [resolve, validation, builder, target, archive]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e001-preflight-audio-validation-${{ github.run_id }}
          path: preflight/audio-validation
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e001-preflight-audio-builder-${{ github.run_id }}
          path: preflight/audio-builder
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e001-preflight-audio-target-${{ github.run_id }}
          path: preflight/audio-target
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e001-preflight-certification-archive-${{ github.run_id }}
          path: preflight/certification-archive
      - name: Aggregate exact-release trusted infrastructure readiness
        run: |
          set -euo pipefail
          python3 .github/program/e001_activation_preflight.py \
            --source-sha '${{ needs.resolve.outputs.sha }}' \
            --release-tag '${{ needs.resolve.outputs.tag }}' \
            --control-source-sha '${{ github.sha }}' \
            --report audio-validation=preflight/audio-validation/runner-readiness.json \
            --report audio-builder=preflight/audio-builder/runner-readiness.json \
            --report audio-target=preflight/audio-target/runner-readiness.json \
            --report certification-archive=preflight/certification-archive/runner-readiness.json \
            --output e001-activation-preflight.json
          cat e001-activation-preflight.json >> "$GITHUB_STEP_SUMMARY"
      - name: Seal aggregate preflight evidence
        run: |
          set -euo pipefail
          mkdir -p e001-activation-evidence
          cp e001-activation-preflight.json e001-activation-evidence/
          cp -R preflight e001-activation-evidence/
          (cd e001-activation-evidence && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e001-activation-preflight-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}
          path: e001-activation-evidence
          retention-days: 90
          if-no-files-found: error
      - name: Enforce all trusted roles READY
        run: |
          python3 - <<'PY'
          import json
          result = json.load(open('e001-activation-preflight.json'))
          if result['result'] != 'E001_TRUSTED_INFRASTRUCTURE_READY':
              raise SystemExit(f"trusted infrastructure not ready: {result['result']}")
          PY
