name: Apply v1.5 test intelligence ordinary contracts

on:
  push:
    branches: [feat/test-intelligence-v1.5.0]
    paths:
      - tools/apply_v15_test_intelligence.py
      - .github/workflows/apply-v15-test-intelligence.yml
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  apply:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply ordinary patches
        run: python3 tools/apply_v15_test_intelligence.py
      - name: Self-test and strict build
        run: |
          set -euo pipefail
          python3 -m py_compile tools/target_evidence.py
          python3 tools/target_evidence.py --self-test
          cmake -S . -B build-v15-apply -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON -DAP_BUILD_ALSA_EXAMPLE=ON
          cmake --build build-v15-apply --parallel
          ctest --test-dir build-v15-apply --output-on-failure
          ./build-v15-apply/ap_metamorphic_tests
          grep -q '^project(audio_pipeline VERSION 1.5.0 LANGUAGES C)$' CMakeLists.txt
          git -C "$GITHUB_WORKSPACE" diff --check
      - name: Commit consumed ordinary patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm tools/apply_v15_test_intelligence.py
          git add CMakeLists.txt examples/alsa_runtime_duplex.c tools/target_evidence.py tests/test_metamorphic.c
          if git diff --cached --quiet; then
            echo 'no ordinary v1.5 patch changes'
            exit 0
          fi
          git commit -m 'test: add metamorphic and accelerated route fault contracts'
          git push origin HEAD:feat/test-intelligence-v1.5.0
