name: Research S003 AEC Transition Recovery Latency v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-transition-recovery-latency-v1.json'
      - 'docs/program/iterations/S003-aec-metric-safe-evidence-v1-result.json'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/aec_metric_safe_evidence.py'
      - 'validation/tools/aec_transition_recovery_latency.py'
      - 'validation/policies/validation-aec-transition-development.json'
      - '.github/workflows/research-s003-aec-transition-recovery-latency-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-transition-recovery-latency-v1.json'
      - 'docs/program/iterations/S003-aec-metric-safe-evidence-v1-result.json'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/aec_metric_safe_evidence.py'
      - 'validation/tools/aec_transition_recovery_latency.py'
      - 'validation/policies/validation-aec-transition-development.json'
      - '.github/workflows/research-s003-aec-transition-recovery-latency-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-s003-aec-transition-recovery-latency-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-transition-recovery

      - name: Validate candidate-zero recovery contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-transition-recovery-latency-v1.json >/dev/null
          python3 -m py_compile             validation/tools/build_aec_transition_corpus.py             validation/tools/aec_metric_safe_evidence.py             validation/tools/aec_transition_recovery_latency.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_transition_recovery_latency.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-transition-recovery-latency-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-metric-safe-evidence-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_MEASUREMENT_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['promotion_allowed'] is False and c['shipping_change_allowed'] is False
          assert c['corpus']['fresh_seeds']==[10507,10607]
          assert c['corpus']['target_cases']==[
              'echo-path-change','speaker-acoustic-gain-step','render-level-step'
          ]
          m=c['measurement']
          assert m['window_ms']==100
          assert m['pre_baseline_ms']==[-1000,-200]
          assert abs(m['recovery_excess_db']-3.01029995664)<1e-12
          assert m['continuous_hold_ms']==300
          assert m['search_ms']==[0,2500]
          assert c['preregistered_rules']['censored_is_valid_evidence_not_ci_failure'] is True
          assert c['preregistered_rules']['no_recovery_time_pass_fail_threshold'] is True
          assert c['preregistered_rules']['no_parameter_search'] is True
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['reviewed_validity']['performance_threshold_established'] is False
          assert p['reviewed_validity']['algorithm_pass_fail_verdict']=='NOT_AUTHORIZED'
          print('S003 AEC recovery measurement authority: PASS')
          PY

      - name: Build fixed canonical processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-aec-recovery             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-aec-recovery --target ap_process_pcm --parallel

      - name: Run fresh recovery measurements
        run: |
          set -euo pipefail
          out=s003-aec-recovery-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-transition-recovery-latency-v1.json

          for seed in 10507 10607; do
            corpus="/tmp/s003-aec-recovery-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            python3 validation/tools/build_aec_transition_corpus.py               --output "$corpus" --seed "$seed" --seconds 6

            python3 validation/tools/run_validation.py               --source-revision '${{ github.sha }}'               --corpus "$corpus/corpus.json"               --policy validation/policies/validation-aec-transition-development.json               --dataset-lock validation/datasets.lock.json               --processor build-s003-aec-recovery/ap_process_pcm               --output "$seed_out/canonical-report.json"               --evidence-manifest "$seed_out/evidence-manifest.json"

            PYTHONPATH=validation/tools             python3 validation/tools/aec_transition_recovery_latency.py run               --corpus "$corpus/corpus.json"               --report "$seed_out/canonical-report.json"               --processor build-s003-aec-recovery/ap_process_pcm               --contract "$contract"               --output "$seed_out/recovery-latency.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools           python3 validation/tools/aec_transition_recovery_latency.py aggregate             --contract "$contract"             --input "$out/10507/recovery-latency.json"             --input "$out/10607/recovery-latency.json"             --output "$out/cross-seed-recovery-summary.json"

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish recovery evidence
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-recovery-out/cross-seed-recovery-summary.json').read_text())
          print('## S003 AEC transition recovery latency')
          print('')
          print('- Authority: **candidate-zero measurement only / non-shipping**')
          print('- Recovery definition: residual <= 2x pre-transition baseline for 300 ms continuously')
          print('- Search horizon: 0..2500 ms; censored is valid evidence')
          for item in r['cases']:
              values=[
                  'censored' if obs['censored'] else f"{obs['recovery_time_ms']} ms"
                  for obs in item['observations']
              ]
              peaks=[
                  round(obs['peak_excess_db_in_first_1000ms'],3)
                  for obs in item['observations']
              ]
              print(f"- `{item['case_id']}`: recovery=`{values}`, peak-excess-dB=`{peaks}`")
          print('- Algorithm performance verdict: **NOT_AUTHORIZED**')
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound recovery evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s003-aec-transition-recovery-latency-${{ github.run_id }}
          path: s003-aec-recovery-out/
          if-no-files-found: error
          retention-days: 30
