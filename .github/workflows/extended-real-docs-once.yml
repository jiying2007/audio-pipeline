name: Extended Real Docs One-Time Closure

on:
  push:
    branches: [feat/extended-real-validation-v2.1.0]

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/extended-real-validation-v2.1.0
          fetch-depth: 0
      - name: Apply documentation and contract closure
        run: |
          set -euo pipefail
          python3 tools/migrate_extended_real_docs_v2_1_0.py
          python3 -m py_compile \
            validation/tools/run_validation.py \
            validation/tools/split_holdout.py \
            validation/tools/extended_dataset_lock.py \
            validation/tools/prepare_extended_validation.py \
            validation/tools/build_extended_real_corpus.py \
            tools/runner_preflight.py
          python3 validation/tools/run_validation.py --self-test
          python3 validation/tools/split_holdout.py --self-test
          python3 validation/tools/extended_dataset_lock.py self-test
          python3 validation/tools/prepare_extended_validation.py self-test
          python3 validation/tools/build_extended_real_corpus.py --self-test
          python3 tools/runner_preflight.py --self-test
          python3 scripts/docs_consistency.py
          sh scripts/check-architecture.sh
          git diff --check
      - name: Strict build and CTest
        run: |
          set -euo pipefail
          cmake -S . -B build-v2.1-docs -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-v2.1-docs --parallel
          ctest --test-dir build-v2.1-docs --output-on-failure
      - name: Commit verified closure
        run: |
          set -euo pipefail
          rm tools/migrate_extended_real_docs_v2_1_0.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/extended-real-docs-once.yml'
          git diff --cached --check
          git commit -m 'validation: close extended-real automation and docs'
          git push origin HEAD:feat/extended-real-validation-v2.1.0
