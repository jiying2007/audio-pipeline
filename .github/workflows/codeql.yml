name: CodeQL

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          languages: c-cpp
          build-mode: manual
      - name: Build analyzed configuration
        run: |
          cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=RelWithDebInfo -DAP_BUILD_BENCH=OFF
          cmake --build build-codeql --parallel
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
