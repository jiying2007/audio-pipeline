name: Acoustic Candidate Hosted Blind Terminal Guard

on:
  pull_request:
    paths:
      - '.github/workflows/acoustic-candidate-hosted-blind.yml'
      - '.github/program/acoustic_candidate_request.py'
      - '.github/program/acoustic_candidate_request.json'
      - 'docs/program/evidence/acoustic-candidate-4a6a408bf0e3/hosted-blind-run-34802976289/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/acoustic-candidate-hosted-blind.yml'
      - '.github/program/acoustic_candidate_request.py'
      - '.github/program/acoustic_candidate_request.json'
      - 'docs/program/evidence/acoustic-candidate-4a6a408bf0e3/hosted-blind-run-34802976289/**'

permissions:
  contents: read

jobs:
  terminal-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate frozen request and terminal rejection evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/program/acoustic_candidate_request.py --self-test
          python3 .github/program/acoustic_candidate_request.py \
            --request .github/program/acoustic_candidate_request.json \
            --output /tmp/request.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('docs/program/evidence/acoustic-candidate-4a6a408bf0e3/hosted-blind-run-34802976289')
          terminal = json.loads((root / 'terminal.json').read_text(encoding='utf-8'))
          selected = json.loads((root / 'selected-cases.json').read_text(encoding='utf-8'))
          request = json.loads(Path('/tmp/request.json').read_text(encoding='utf-8'))

          def require(ok, message):
              if not ok:
                  raise SystemExit(message)

          require(terminal.get('schema_version') == 1, 'terminal schema drift')
          require(terminal.get('authority') == 'non-shipping-post-freeze-public-acoustic-qualification-terminal',
                  'terminal authority drift')
          require(terminal.get('decision') == 'HOSTED_BLIND_REJECTED_NON_SHIPPING' and terminal.get('terminal') is True,
                  'candidate must remain terminally rejected')

          candidate = terminal.get('candidate') or {}
          require(candidate.get('candidate_id') == request.get('candidate_id') == '4a6a408bf0e3',
                  'terminal candidate id drift')
          require(candidate.get('source_revision') == request.get('candidate_source_revision') ==
                  '73ae803047d5e7a6b54cdf58b4a28331ab0c2163', 'terminal candidate source drift')
          require(candidate.get('provenance_sha256') ==
                  request.get('provenance', {}).get('iteration_result_sha256') ==
                  '1f00ec48b1467fd39b13044ced41f1016818c5a24a2894799d83eb5e7082b6f2',
                  'terminal candidate provenance drift')
          require(candidate.get('tuning') == request.get('tuning') == {
              'aec_mu': 0.24,
              'ns_floor': 0.12,
              'agc_target_dbfs': -20.0,
              'limiter_dbfs': -2.0,
          }, 'terminal tuning drift')

          q = terminal.get('qualification') or {}
          require(q.get('infrastructure_revision') == '70f2c4fbad31da5294ec8734fe41d417c3c60301',
                  'terminal qualification infrastructure drift')
          require(q.get('workflow_run_id') == 34802976289 and q.get('workflow_run_number') == 2 and
                  q.get('job_id') == 103849218661 and q.get('job_conclusion') == 'failure',
                  'terminal workflow identity drift')
          require(q.get('first_authoritative_run') is True and q.get('retry_or_reselection_allowed') is False,
                  'terminal result must forbid retry/reselection')
          require(q.get('nonce_source') == 'github.run_id' and q.get('nonce') == '34802976289' and
                  q.get('secret_hmac') is False, 'terminal nonce semantics drift')
          require(q.get('source_repository') == 'microsoft/AEC-Challenge' and
                  q.get('source_revision') == '6c633d0a9d2a143a0e364899b91b06f127315b18',
                  'terminal dataset source drift')
          require(q.get('eligible_pairs_after_exclusion') == 296 and q.get('excluded_precommitted_paths') == 8,
                  'terminal selection population drift')
          require(q.get('selected_cases') == 12 and q.get('selected_static') == 6 and q.get('selected_movement') == 6,
                  'terminal selection balance drift')
          require(q.get('validation_result') == 'FAIL' and q.get('passed_cases') == 10 and
                  q.get('pass_rate') == 0.8333333333333334, 'terminal qualification result drift')
          require(q.get('scenario_pass_rate') == {
              'aec-farend-singletalk': 0.8333333333333334,
              'aec-farend-singletalk-movement': 0.8333333333333334,
          }, 'terminal scenario result drift')
          require(q.get('max_output_clip_fraction') == 0.0, 'terminal clipping evidence drift')
          require(q.get('failed_case_gate_counts') == {'max_output_rms_delta_db': 2},
                  'terminal failure gate drift')
          require(sorted(q.get('failed_case_gate_actuals_db', [])) ==
                  sorted([8.158716186215422, 4.308868732792071]), 'terminal failure values drift')

          evidence = terminal.get('evidence') or {}
          require(evidence == {
              'artifact_id': 10331914108,
              'artifact_archive_sha256': 'abf3f5c36ef3e7fad724db5e5c620fc3628eb83ca9341e8f863effb6ab5d4c10',
              'artifact_size_bytes': 42942507,
              'dynamic_holdout_lock_sha256': '3a0e48da21d42f10504dd495dfe5c326f6386289351037a52c8715f3e36361ac',
              'selection_sha256': '50d4f9547db6d9ae783955e56cee874fdf2688a50cc9d4f88758373685ac11d7',
              'blind_report_sha256': 'be0bf3a5867e395b3a52492a5abd07a4a49ea53afe4db80e77b4d50613a71416',
              'blind_evidence_manifest_sha256': 'a2442765734c67b3fc118528734b104b29dce7f536be34b810215f88d125116a',
              'candidate_identity_sha256': '447725c220b0e9f355602c4857af2bbde004ac57ea37d47d0f671259e1987471',
              'candidate_processor_sha256': '4b120d338160a9c1ff1dd00f866601a23cd1484dbf8e523dadb60934246a7431',
              'policy_id': 'validation-hosted-aec-smoke-v1',
              'policy_sha256': '73cf9e3a2dde7cd07b49f719710f3a9994e90365757c0a8a0b8ce3a9b15a5a35',
          }, 'terminal evidence identity drift')

          release = terminal.get('release_boundary') or {}
          require(release.get('shipping_release') == request.get('release_boundary', {}).get('shipping_release') == 'v2.3.16' and
                  release.get('shipping_release_source') == request.get('release_boundary', {}).get('shipping_release_source') ==
                  '57e4c64adc1cf06819e46e24e275ecd746d5f17f' and
                  release.get('shipping_aec_mu') == 0.22 and release.get('shipping_mutation_allowed') is False and
                  request.get('release_boundary', {}).get('shipping_mutation_allowed') is False,
                  'terminal shipping boundary drift')

          authority = terminal.get('authority_boundary') or {}
          require(authority == {
              'target_resource_qualification': 'NOT_EXECUTED',
              'pcr02_35mm_real_device': 'NOT_EXECUTED',
              'ssc305_hil': 'NOT_EXECUTED',
              'target_soak': 'NOT_EXECUTED',
              'product_certification': 'NOT_EXECUTED',
              'shipping_promotion': 'NOT_ADMITTED',
          }, 'terminal result acquired forbidden physical/shipping authority')

          cases = selected.get('cases') or []
          require(selected.get('schema_version') == 1 and selected.get('source_repository') == q['source_repository'] and
                  selected.get('source_revision') == q['source_revision'], 'selected-case source drift')
          require(len(cases) == 12 and len({case['id'] for case in cases}) == 12, 'selected-case identity drift')
          require(sum(case.get('movement') is False for case in cases) == 6 and
                  sum(case.get('movement') is True for case in cases) == 6, 'selected-case balance drift')
          require(sum(case.get('passed') is True for case in cases) == 10 and
                  sum(case.get('passed') is False for case in cases) == 2, 'selected-case pass count drift')
          failed = [case for case in cases if case.get('passed') is False]
          require({case.get('scenario') for case in failed} == {
              'aec-farend-singletalk', 'aec-farend-singletalk-movement'
          }, 'terminal failures must remain one per scenario')
          require(all(case.get('output_clip_fraction') == 0.0 for case in cases), 'selected-case clipping evidence drift')
          require(all(len(case.get('violations') or []) == 1 and
                      case['violations'][0].get('gate') == 'max_output_rms_delta_db' and
                      case['violations'][0].get('actual', 0) > 0.0 for case in failed),
                  'selected-case failure cause drift')
          require(sorted(case['output_rms_delta_db'] for case in failed) ==
                  sorted(q['failed_case_gate_actuals_db']), 'selected-case failure value mismatch')
          for case in cases:
              for role in ('mic', 'render'):
                  item = case.get(role) or {}
                  require(str(item.get('path', '')).startswith('datasets/test_set_icassp2022/farend-singletalk/'),
                          f"{case['id']} {role} path drift")
                  require(len(str(item.get('sha256', ''))) == 64 and int(item.get('size', 0)) > 0,
                          f"{case['id']} {role} binding drift")

          print(json.dumps({
              'decision': terminal['decision'],
              'candidate_id': candidate['candidate_id'],
              'first_authoritative_run': q['workflow_run_id'],
              'result': q['validation_result'],
              'passed_cases': q['passed_cases'],
              'total_cases': q['selected_cases'],
              'retry_or_reselection_allowed': q['retry_or_reselection_allowed'],
              'shipping_release': release['shipping_release'],
              'shipping_aec_mu': release['shipping_aec_mu'],
              'physical_authority': 'NONE',
          }, sort_keys=True))
          PY
      - name: Enforce terminal workflow has no requalification path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/acoustic-candidate-hosted-blind.yml').read_text(encoding='utf-8')
          forbidden = (
              'workflow_' + 'dispatch:',
              'repository_' + 'dispatch:',
              'git ' + 'clone',
              'lfs ' + 'pull',
              'run_' + 'validation.py',
              '--' + 'nonce',
              '\n  ' + 'qualify:',
              'gh ' + 'release',
              'git ' + 'push',
          )
          present = [token for token in forbidden if token in text]
          if present:
              raise SystemExit(f'terminal guard acquired forbidden requalification/mutation path: {present}')
          print('hosted blind terminal no-retry boundary: OK')
          PY
      - name: Publish terminal rejection summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Hosted blind candidate terminal state
          - Decision: `HOSTED_BLIND_REJECTED_NON_SHIPPING`
          - Candidate: `4a6a408bf0e3` / source `73ae803047d5e7a6b54cdf58b4a28331ab0c2163`
          - First authoritative run: `34802976289` — `FAIL`, 10/12 cases passed
          - Retry/reselection: **forbidden** for this frozen candidate
          - Shipping remains immutable `v2.3.16`, `aec_mu=0.22`
          - Target/HIL/PCR02/soak/Product Certification: **not executed; no authority claimed**
          EOF
