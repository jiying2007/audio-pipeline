name: Research S003 Speaker Gain NS Recovery Confirmation v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-speaker-gain-ns-recovery-extension-confirmation-v1.json'
      - 'docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1-result.json'
      - 'validation/tools/aec_speaker_gain_ns_recovery_confirmation.py'
      - 'validation/tools/aec_stage_recovery_decomposition.py'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'validation/policies/validation-s003-speaker-gain-ns-recovery-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-speaker-gain-ns-recovery-confirmation-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-speaker-gain-ns-recovery-extension-confirmation-v1.json'
      - 'docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1-result.json'
      - 'validation/tools/aec_speaker_gain_ns_recovery_confirmation.py'
      - 'validation/tools/aec_stage_recovery_decomposition.py'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'validation/policies/validation-s003-speaker-gain-ns-recovery-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-speaker-gain-ns-recovery-confirmation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-s003-speaker-gain-ns-recovery-confirmation-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confirm:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-speaker-gain-ns-confirm

      - name: Validate single-hypothesis confirmation contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-speaker-gain-ns-recovery-extension-confirmation-v1.json >/dev/null
          python3 -m json.tool             validation/policies/validation-s003-speaker-gain-ns-recovery-confirm.json >/dev/null
          python3 -m py_compile             validation/tools/aec_speaker_gain_ns_recovery_confirmation.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_speaker_gain_ns_recovery_confirmation.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-speaker-gain-ns-recovery-extension-confirmation-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-transition-stage-recovery-decomposition-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_SINGLE_HYPOTHESIS_CONFIRMATION'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['promotion_allowed'] is False and c['shipping_change_allowed'] is False
          assert c['corpus']['fresh_seeds']==[10907,11007]
          assert c['corpus']['profiles']==['prefix-res','prefix-ns','default']
          assert c['corpus']['cases_per_seed']==3
          assert c['hypothesis']['gate']=='ns_recovery_time_ms - res_recovery_time_ms >= 100'
          assert c['preregistered_rules']['no_ns_internal_parameter_search'] is True
          assert c['authority_boundary']['may_claim_ns_root_cause'] is False
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['reviewed_validity']['stable_stage_boundary_extension']['recovery_extension_ms']==[100,100]
          print('S003 speaker-gain NS confirmation authority: PASS')
          PY

      - name: Build test-only stage-prefix processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-ns-confirm             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-ns-confirm --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-ns-confirm/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-ns-confirm/libaudio_pipeline.a -lm             -o build-s003-ns-confirm/stage_prefix_process_pcm

      - name: Run fresh pairwise confirmation
        run: |
          set -euo pipefail
          out=s003-ns-confirm-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-speaker-gain-ns-recovery-extension-confirmation-v1.json

          for seed in 10907 11007; do
            corpus="/tmp/s003-ns-confirm-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            PYTHONPATH=validation/tools               python3 validation/tools/aec_speaker_gain_ns_recovery_confirmation.py build                 --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools               python3 validation/tools/stage_interaction_run.py                 --source-revision '${{ github.sha }}'                 --corpus "$corpus/corpus.json"                 --policy validation/policies/validation-s003-speaker-gain-ns-recovery-confirm.json                 --dataset-lock validation/datasets.lock.json                 --processor build-s003-ns-confirm/stage_prefix_process_pcm                 --output "$seed_out/canonical-stage-report.json"                 --evidence-manifest "$seed_out/evidence-manifest.json"                 --enforce

            PYTHONPATH=validation/tools               python3 validation/tools/aec_speaker_gain_ns_recovery_confirmation.py run                 --corpus "$corpus/corpus.json"                 --report "$seed_out/canonical-stage-report.json"                 --processor build-s003-ns-confirm/stage_prefix_process_pcm                 --contract "$contract"                 --output "$seed_out/confirmation.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools             python3 validation/tools/aec_speaker_gain_ns_recovery_confirmation.py aggregate               --contract "$contract"               --input "$out/10907/confirmation.json"               --input "$out/11007/confirmation.json"               --output "$out/cross-seed-confirmation.json"

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish confirmation outcome
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-ns-confirm-out/cross-seed-confirmation.json').read_text())
          print('## S003 speaker-gain RES→NS recovery confirmation')
          print('')
          print('- Authority: **candidate-zero single-hypothesis confirmation**')
          for obs in r['observations']:
              print(
                  f"- seed `{obs['seed']}`: RES=`{obs['res_recovery_time_ms']} ms`, "
                  f"NS=`{obs['ns_recovery_time_ms']} ms`, "
                  f"full=`{obs['full_recovery_time_ms']} ms`, "
                  f"NS-RES=`{obs['ns_minus_res_ms']} ms`, "
                  f"confirmed=`{obs['confirmed_on_seed']}`"
              )
          print(f"- Outcome: **{r['outcome']}**")
          print('- NS root-cause authority: **none**')
          print('- NS parameter-search authority: **none**')
          PY

      - name: Upload hash-bound confirmation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s003-speaker-gain-ns-recovery-confirmation-${{ github.run_id }}
          path: s003-ns-confirm-out/
          if-no-files-found: error
          retention-days: 30
