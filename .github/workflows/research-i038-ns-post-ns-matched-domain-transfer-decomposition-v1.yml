name: Research I038 NS Post-NS Matched Domain Transfer Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i038-ns-post-ns-matched-domain-transfer-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i038-ns-post-ns-matched-domain-transfer-decomposition-v1-result.json'
      - 'tests/validation/i038_ns_post_ns_matched_domain_transfer_probe.c'
      - 'tests/validation/i038_ns_post_ns_matched_domain_transfer_decomposition.py'
      - 'tests/validation/test_i038_one_shot_guard.py'
      - 'tests/validation/test_i038_retirement.py'
      - 'tests/validation/data/i038-consumed-workflow.yml'
      - 'validation/research/evidence/i038-36849477777/**'
      - '.github/workflows/research-i038-ns-post-ns-matched-domain-transfer-decomposition-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I038 authority, packaging defect and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i038-ns-post-ns-matched-domain-transfer-decomposition-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i038_ns_post_ns_matched_domain_transfer_decomposition.py \
            tests/validation/test_i038_one_shot_guard.py \
            tests/validation/test_i038_retirement.py
          python3 tests/validation/i038_ns_post_ns_matched_domain_transfer_decomposition.py --self-test
          python3 tests/validation/test_i038_one_shot_guard.py
          python3 tests/validation/test_i038_retirement.py
