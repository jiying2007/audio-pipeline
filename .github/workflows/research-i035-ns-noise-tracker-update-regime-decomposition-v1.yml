name: Research I035 NS Noise Tracker Update Regime Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i035-ns-noise-tracker-update-regime-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i035-ns-noise-tracker-update-regime-decomposition-v1-result.json'
      - 'tests/validation/i035_ns_noise_tracker_update_regime_probe.c'
      - 'tests/validation/i035_ns_noise_tracker_update_regime_decomposition.py'
      - 'tests/validation/test_i035_one_shot_guard.py'
      - 'tests/validation/test_i035_retirement.py'
      - 'tests/validation/data/i035-consumed-workflow.yml'
      - 'validation/research/evidence/i035-36795467909/**'
      - '.github/workflows/research-i035-ns-noise-tracker-update-regime-decomposition-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I035 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i035-ns-noise-tracker-update-regime-decomposition-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i035_ns_noise_tracker_update_regime_decomposition.py \
            tests/validation/test_i035_one_shot_guard.py \
            tests/validation/test_i035_retirement.py
          python3 tests/validation/i035_ns_noise_tracker_update_regime_decomposition.py --self-test
          python3 tests/validation/test_i035_one_shot_guard.py
          python3 tests/validation/test_i035_retirement.py
