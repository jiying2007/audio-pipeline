---
- name: Require operator-installed research toolchain inputs
  ansible.builtin.assert:
    that:
      - audio_builder_target_cc is defined
      - audio_builder_target_cc | length > 1
      - audio_builder_target_cc is match('^/')
      - audio_builder_target_sysroot is defined
      - audio_builder_target_sysroot | length > 1
      - audio_builder_target_sysroot is match('^/')
      - audio_builder_target_toolchain_root is defined
      - audio_builder_target_toolchain_root | length > 1
      - audio_builder_target_toolchain_root is match('^/')
    fail_msg: >-
      audio-builder requires absolute operator-installed research compiler,
      sysroot and toolchain-root paths. The lab role never downloads or invents
      a vendor research toolchain.

- name: Inspect research compiler
  ansible.builtin.stat:
    path: "{{ audio_builder_target_cc }}"
    follow: true
  register: audio_builder_cc_stat

- name: Inspect research sysroot
  ansible.builtin.stat:
    path: "{{ audio_builder_target_sysroot }}"
    follow: true
  register: audio_builder_sysroot_stat

- name: Inspect research toolchain root
  ansible.builtin.stat:
    path: "{{ audio_builder_target_toolchain_root }}"
    follow: true
  register: audio_builder_toolchain_stat

- name: Fail closed when research toolchain inputs are not usable
  ansible.builtin.assert:
    that:
      - audio_builder_cc_stat.stat.exists
      - audio_builder_cc_stat.stat.isreg
      - audio_builder_cc_stat.stat.executable
      - audio_builder_sysroot_stat.stat.exists
      - audio_builder_sysroot_stat.stat.isdir
      - audio_builder_toolchain_stat.stat.exists
      - audio_builder_toolchain_stat.stat.isdir
    fail_msg: >-
      audio-builder research compiler/sysroot/toolchain-root must already exist
      and be usable by the unprivileged runner account.

- name: Verify research compiler executes as the runner user
  ansible.builtin.command:
    argv: ["{{ audio_builder_target_cc }}", --version]
  changed_when: false
