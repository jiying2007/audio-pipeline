name: Apply Validation Corr V236

on:
  push:
    branches: [validation/refine-render-correlation-search-v2.3.6]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply exact anchored patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one anchor, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_one(
              'CMakeLists.txt',
              'project(audio_pipeline VERSION 2.3.5 LANGUAGES C)',
              'project(audio_pipeline VERSION 2.3.6 LANGUAGES C)',
          )

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if not text.startswith('# 2.3.5\n'):
              raise SystemExit('CHANGELOG top-version anchor drift')
          entry = '''# 2.3.6

          - Correct canonical render-correlation max-lag evaluation with a monotonic bounded hierarchical search so narrow broadband echo peaks cannot fall between sparse lag-grid points.
          - Preserve every pre-2.3.6 sparse-grid observation as a strict lower bound and keep `max_output_render_corr_ratio=1.20` unchanged; coarse/medium stages only locate candidate basins and final added scores still use `normalized_corr(..., stride=4)`.
          - Add deterministic broadband/colored arbitrary-delay regression coverage while preserving realtime DSP/runtime behavior, public API/ABI, dataset locks, acoustic thresholds and Product Certification authority.

          '''
          changelog.write_text(entry + text, encoding='utf-8')

          old_corr = '''def max_abs_corr(a: Sequence[int], b: Sequence[int], sample_rate: int) -> float:
              max_lag = max(1, sample_rate // 10)
              step = max(1, max_lag // 60)
              lags = list(range(-max_lag, max_lag + 1, step))
              if 0 not in lags:
                  lags.append(0)
              return max((normalized_corr(a, b, lag) for lag in lags), default=0.0)
          '''
          new_corr = '''def _corr_block_average(samples: Sequence[int], block: int) -> list[float]:
              count = len(samples) // block
              if count <= 0:
                  return []
              out = [0.0] * count
              inv = 1.0 / float(block)
              for index in range(count):
                  start = index * block
                  total = 0.0
                  for offset in range(start, start + block):
                      total += float(samples[offset])
                  out[index] = total * inv
              return out


          def _corr_top_nonlocal(scores: list[tuple[float, int]], limit: int, guard: int) -> list[int]:
              selected: list[int] = []
              for _score, lag in sorted(scores, reverse=True):
                  if all(abs(lag - prior) > guard for prior in selected):
                      selected.append(lag)
                      if len(selected) >= limit:
                          break
              return selected


          def max_abs_corr(a: Sequence[int], b: Sequence[int], sample_rate: int) -> float:
              max_lag = max(1, sample_rate // 10)
              sparse_step = max(1, max_lag // 60)
              sparse_lags = list(range(-max_lag, max_lag + 1, sparse_step))
              if 0 not in sparse_lags:
                  sparse_lags.append(0)

              # Retain the historical sparse search exactly as a strict lower bound.
              # Refinement can discover a missed peak but can never reduce an existing
              # correlation observation or weaken an established acceptance gate.
              best = max(
                  (normalized_corr(a, b, lag) for lag in sparse_lags),
                  default=0.0,
              )

              # Use ~2 ms block averages only to locate a few distinct lag basins.
              # These coarse scores never enter the reported metric.
              block = max(4, sample_rate // 500)
              aa = _corr_block_average(a, block)
              bb = _corr_block_average(b, block)
              if len(aa) < 64 or len(bb) < 64:
                  return best
              block_max = (max_lag + block - 1) // block
              coarse = [
                  (normalized_corr(aa, bb, lag, stride=1), lag)
                  for lag in range(-block_max, block_max + 1)
              ]
              coarse_lags = _corr_top_nonlocal(coarse, limit=3, guard=1)

              # Search every sample lag inside the selected basins with a cheaper
              # stride. This stage ranks candidates only; it is not a final score.
              medium: list[tuple[float, int]] = []
              for block_lag in coarse_lags:
                  center = block_lag * block
                  lo = max(-max_lag, center - block)
                  hi = min(max_lag, center + block)
                  for lag in range(lo, hi + 1):
                      medium.append((normalized_corr(a, b, lag, stride=32), lag))
              medium_lags = _corr_top_nonlocal(medium, limit=2, guard=2)

              # Final added scores use the original waveform and the canonical
              # stride=4 correlation, matching the historical metric definition.
              for center in medium_lags:
                  lo = max(-max_lag, center - 1)
                  hi = min(max_lag, center + 1)
                  for lag in range(lo, hi + 1):
                      score = normalized_corr(a, b, lag, stride=4)
                      if score > best:
                          best = score
              return best
          '''
          replace_one('validation/tools/run_validation_engine.py', old_corr, new_corr)

          old_self = '''    for _ in range(rate):
                  state = (1664525 * state + 1013904223) & 0xffffffff
                  broadband.append(((state >> 16) & 0xffff) - 32768)
              delayed = [0] * 137 + broadband[:-137]
          '''
          new_self = '''    for _ in range(rate):
                  state = (1664525 * state + 1013904223) & 0xffffffff
                  broadband.append(((state >> 16) & 0xffff) - 32768)

              colored = []
              colored_state = 0.0
              for sample in broadband:
                  colored_state = 0.82 * colored_state + 0.18 * float(sample)
                  colored.append(int(colored_state))

              corr_max_lag = max(1, rate // 10)
              corr_sparse_step = max(1, corr_max_lag // 60)
              corr_sparse_lags = list(range(-corr_max_lag, corr_max_lag + 1, corr_sparse_step))
              if 0 not in corr_sparse_lags:
                  corr_sparse_lags.append(0)
              for source, delay in ((broadband, 17), (broadband, 672), (colored, 829)):
                  shifted = [0] * delay + source[:-delay]
                  sparse = max(
                      (normalized_corr(shifted, source, lag) for lag in corr_sparse_lags),
                      default=0.0,
                  )
                  refined = max_abs_corr(shifted, source, rate)
                  assert refined + 1.0e-12 >= sparse, (delay, sparse, refined)
                  assert refined > 0.985, (delay, sparse, refined)

              delayed = [0] * 137 + broadband[:-137]
          '''
          replace_one('validation/tools/run_validation_engine.py', old_self, new_self)

          testing_anchor = '''This 81-case generated suite is regression evidence only. Public validation remains separately materialized/sealed on trusted `audio-validation` runners using Compact 100 / Full 160 profiles and optional HMAC blind holdout.

          ### Extended Real validation
          '''
          testing_repl = '''This 81-case generated suite is regression evidence only. Public validation remains separately materialized/sealed on trusted `audio-validation` runners using Compact 100 / Full 160 profiles and optional HMAC blind holdout.

          ### Render-correlation lag search

          AEC render-correlation metrics search the existing +/-100 ms lag window. Since v2.3.6 the evaluator retains every historical sparse-grid lag as a strict lower bound, then performs bounded coarse-to-sample-exact refinement so narrow broadband peaks between sparse grid points are not mistaken for weak input correlation. Coarse/medium scores only locate candidate basins; newly admitted final scores use the original waveform and canonical `normalized_corr(..., stride=4)`. The metric names and `max_output_render_corr_ratio` acceptance threshold are unchanged.

          ### Extended Real validation
          '''
          replace_one('docs/TESTING.md', testing_anchor, testing_repl)

          testing_zh_anchor = '''这 81 case 仅是 regression evidence。公共真实数据在独立 `audio-validation` runner 上按 Compact 100 / Full 160 profile 封存和执行，并可做 HMAC blind holdout。

          ### Extended Real 验证
          '''
          testing_zh_repl = '''这 81 case 仅是 regression evidence。公共真实数据在独立 `audio-validation` runner 上按 Compact 100 / Full 160 profile 封存和执行，并可做 HMAC blind holdout。

          ### Render-correlation lag 搜索

          AEC render-correlation 指标仍在既有 +/-100 ms lag 窗口内搜索。自 v2.3.6 起，evaluator 完整保留历史 sparse-grid lag 作为严格下界，再使用受限的 coarse-to-sample-exact refinement，避免窄带宽峰值落在 sparse grid 点之间时被误判为输入相关性很弱。coarse/medium 分数只用于定位候选 basin；新增的最终分数仍在原始波形上使用 canonical `normalized_corr(..., stride=4)`。指标名称以及 `max_output_render_corr_ratio` 接受阈值均不改变。

          ### Extended Real 验证
          '''
          replace_one('docs/TESTING.zh-CN.md', testing_zh_anchor, testing_zh_repl)
          PY

          python3 -m py_compile validation/tools/run_validation_engine.py validation/tools/run_validation.py
          python3 validation/tools/run_validation.py --self-test
          python3 scripts/ci_impact.py --self-test
          python3 scripts/docs_consistency.py --self-test
          python3 scripts/docs_consistency.py
          grep -q 'project(audio_pipeline VERSION 2.3.6 LANGUAGES C)' CMakeLists.txt
          test "$(head -n1 CHANGELOG.md)" = '# 2.3.6'
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_apply-validation-corr-v236.yml
          git add CMakeLists.txt CHANGELOG.md docs/TESTING.md docs/TESTING.zh-CN.md validation/tools/run_validation_engine.py
          git diff --cached --check
          git commit -m 'validation: refine render correlation lag search for 2.3.6'
          git push origin HEAD:validation/refine-render-correlation-search-v2.3.6
