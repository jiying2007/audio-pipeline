name: Research I036 NS Noise Estimate Aggregation Domain Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i036-ns-noise-estimate-aggregation-domain-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i036-ns-noise-estimate-aggregation-domain-decomposition-v1-result.json'
      - 'tests/validation/i036_ns_noise_estimate_aggregation_domain_probe.c'
      - 'tests/validation/i036_ns_noise_estimate_aggregation_domain_decomposition.py'
      - 'tests/validation/test_i036_one_shot_guard.py'
      - 'tests/validation/test_i036_retirement.py'
      - 'tests/validation/data/i036-consumed-workflow.yml'
      - 'validation/research/evidence/i036-36803529573/**'
      - '.github/workflows/research-i036-ns-noise-estimate-aggregation-domain-decomposition-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed invalid I036 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i036-ns-noise-estimate-aggregation-domain-decomposition-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i036_ns_noise_estimate_aggregation_domain_decomposition.py \
            tests/validation/test_i036_one_shot_guard.py \
            tests/validation/test_i036_retirement.py
          python3 tests/validation/i036_ns_noise_estimate_aggregation_domain_decomposition.py --self-test
          python3 tests/validation/test_i036_one_shot_guard.py
          python3 tests/validation/test_i036_retirement.py
