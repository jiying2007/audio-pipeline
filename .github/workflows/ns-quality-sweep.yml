name: Apply isolated NS validation contract

on:
  push:
    branches: [validation/v1.3.0]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply and prove isolated NS validation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Offline processor: case-local capture topology for module validation.
          replace_once(
              'examples/process_pcm.c',
              '            "[--capture-only] [--metrics-jsonl FILE] "\n',
              '            "[--capture-only] [--capture-profile default|ns-isolated] [--metrics-jsonl FILE] "\n')
          replace_once(
              'examples/process_pcm.c',
              '    int capture_only = 0;\n    int arg = 1;\n',
              '    int capture_only = 0;\n    const char *capture_profile = "default";\n    int arg = 1;\n')
          replace_once(
              'examples/process_pcm.c',
              '        } else if (strcmp(argv[arg], "--capture-only") == 0) {\n            capture_only = 1;\n        } else if (strcmp(argv[arg], "--metrics-jsonl") == 0) {\n',
              '        } else if (strcmp(argv[arg], "--capture-only") == 0) {\n            capture_only = 1;\n        } else if (strcmp(argv[arg], "--capture-profile") == 0) {\n            if (++arg >= argc ||\n                (strcmp(argv[arg], "default") != 0 && strcmp(argv[arg], "ns-isolated") != 0)) {\n                usage(argv[0]);\n                return 2;\n            }\n            capture_profile = argv[arg];\n        } else if (strcmp(argv[arg], "--metrics-jsonl") == 0) {\n')
          replace_once(
              'examples/process_pcm.c',
              '    if ((!capture_only && argc - arg != 3) || (capture_only && argc - arg != 2)) {\n        usage(argv[0]);\n        return 2;\n    }\n',
              '    if ((!capture_only && argc - arg != 3) || (capture_only && argc - arg != 2) ||\n        (!capture_only && strcmp(capture_profile, "default") != 0)) {\n        usage(argv[0]);\n        return 2;\n    }\n')
          replace_once(
              'examples/process_pcm.c',
              '    if (capture_only) {\n        cfg.stages &= ~(AP_STAGE_SYNC | AP_STAGE_AEC | AP_STAGE_RES);\n        cfg.enable_delay_tracking = 0u;\n        cfg.enable_clock_drift_compensation = 0u;\n    }\n',
              '    if (capture_only) {\n        cfg.stages &= ~(AP_STAGE_SYNC | AP_STAGE_AEC | AP_STAGE_RES);\n        cfg.enable_delay_tracking = 0u;\n        cfg.enable_clock_drift_compensation = 0u;\n        if (strcmp(capture_profile, "ns-isolated") == 0)\n            cfg.stages = AP_STAGE_NS | AP_STAGE_VAD;\n    }\n')

          # Evaluator: noise-only attenuation is computed only on stable non-speech frames.
          replace_once(
              'validation/tools/run_validation.py',
              'def load_labels(path: Path) -> list[int]:\n',
              '''def noise_only_attenuation_db(input_samples: Sequence[int], output: Sequence[int],\n                              labels: list[int], rate: int,\n                              output_delay_samples: int) -> tuple[float | None, int]:\n    frame = rate // 100\n    input_energy = 0.0\n    output_energy = 0.0\n    used_frames = 0\n    sample_count = 0\n    for frame_index in range(1, len(labels) - 1):\n        if labels[frame_index - 1] or labels[frame_index] or labels[frame_index + 1]:\n            continue\n        input_start = frame_index * frame\n        output_start = input_start + output_delay_samples\n        if output_start < 0:\n            continue\n        count = min(frame, len(input_samples) - input_start, len(output) - output_start)\n        if count <= 0:\n            continue\n        for offset in range(count):\n            x = float(input_samples[input_start + offset])\n            y = float(output[output_start + offset])\n            input_energy += x * x\n            output_energy += y * y\n        used_frames += 1\n        sample_count += count\n    if sample_count < frame or input_energy <= 1.0e-12:\n        return None, used_frames\n    return 10.0 * math.log10((input_energy + 1.0e-12) / (output_energy + 1.0e-12)), used_frames\n\n\ndef load_labels(path: Path) -> list[int]:\n''')
          replace_once(
              'validation/tools/run_validation.py',
              '    if render_raw is None:\n        command += ["--capture-only", str(mic_raw), str(output_path)]\n',
              '    if render_raw is None:\n        profile = case.get("processor_profile", "default")\n        if profile not in {"default", "ns-isolated"}:\n            raise ValueError(f"unsupported processor_profile: {profile}")\n        command += ["--capture-profile", profile, "--capture-only", str(mic_raw), str(output_path)]\n')
          replace_once(
              'validation/tools/run_validation.py',
              '        "min_vad_f1": ("vad_f1", "min"),\n',
              '        "min_vad_f1": ("vad_f1", "min"),\n        "min_noise_only_attenuation_db": ("noise_only_attenuation_db", "min"),\n')
          replace_once(
              'validation/tools/run_validation.py',
              '    labels_path = resolve(corpus_path, case.get("vad_labels"))\n    if labels_path is not None:\n        metrics["vad_f1"] = vad_f1(load_labels(labels_path), trace)\n',
              '''    labels_path = resolve(corpus_path, case.get("vad_labels"))\n    if labels_path is not None:\n        labels = load_labels(labels_path)\n        metrics["vad_f1"] = vad_f1(labels, trace)\n        declared_latency_ms = int(trace[0].get("algorithmic_latency_ms", 0)) if trace else 0\n        output_delay = int(metrics.get("output_alignment_samples", declared_latency_ms * rate // 1000) or 0)\n        attenuation, noise_frames = noise_only_attenuation_db(mic0, output, labels, rate, output_delay)\n        metrics["noise_only_attenuation_db"] = attenuation\n        metrics["noise_only_frames"] = noise_frames\n''')
          replace_once(
              'validation/tools/run_validation.py',
              '    if not ids or len(set(ids)) != len(ids) or any(not item for item in ids):\n        raise ValueError("case_id values must be non-empty and unique")\n',
              '    if not ids or len(set(ids)) != len(ids) or any(not item for item in ids):\n        raise ValueError("case_id values must be non-empty and unique")\n    invalid_profiles = sorted({case.get("processor_profile", "default") for case in corpus.get("cases", [])} - {"default", "ns-isolated"})\n    if invalid_profiles:\n        raise ValueError(f"invalid processor_profile values: {invalid_profiles}")\n')
          replace_once(
              'validation/tools/run_validation.py',
              '    assert vad_f1([0, 1, 1, 0], [{"vad_active": 0}, {"vad_active": 1}, {"vad_active": 1}, {"vad_active": 0}]) == 1.0\n',
              '''    assert vad_f1([0, 1, 1, 0], [{"vad_active": 0}, {"vad_active": 1}, {"vad_active": 1}, {"vad_active": 0}]) == 1.0\n    noise_in = [1000, -1000] * 320\n    noise_out = [500, -500] * 320\n    attenuation, used = noise_only_attenuation_db(noise_in, noise_out, [0, 0, 0, 0], rate, 0)\n    assert used == 2 and attenuation is not None and 5.9 < attenuation < 6.2\n''')

          # Deterministic smoke case explicitly validates the NS module, not HPF/AGC composition.
          replace_once(
              'validation/tools/build_validation_corpus.py',
              '             control: dict | None = None) -> None:\n',
              '             control: dict | None = None, processor_profile: str = "default") -> None:\n')
          replace_once(
              'validation/tools/build_validation_corpus.py',
              '        "control": control or {},\n        "expected": expected or {},\n',
              '        "control": control or {},\n        "processor_profile": processor_profile,\n        "expected": expected or {},\n')
          replace_once(
              'validation/tools/build_validation_corpus.py',
              '    add_case(cases, output, "ns-stationary", "ns-stationary", mix(clean, stationary), 1,\n             clean=clean, labels=labels,\n             expected={"min_near_si_sdr_improvement_db": -3.0, "min_vad_f1": 0.20})\n',
              '    add_case(cases, output, "ns-stationary", "ns-stationary", mix(clean, stationary), 1,\n             clean=clean, labels=labels, processor_profile="ns-isolated",\n             expected={"min_near_si_sdr_improvement_db": -3.0, "min_noise_only_attenuation_db": 1.0, "min_vad_f1": 0.20})\n')

          # Public DNS cases use the same isolated NS topology; data remains externally sealed.
          replace_once(
              'validation/tools/build_public_corpus.py',
              '            "control": {}, "expected": {}, "source": source\n',
              '            "control": {}, "processor_profile": "ns-isolated", "expected": {}, "source": source\n')

          # Schema makes the case-local processing contract explicit and auditable.
          schema_path = Path('validation/corpus.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          props = schema['properties']['cases']['items']['properties']
          props['processor_profile'] = {'enum': ['default', 'ns-isolated']}
          schema_path.write_text(json.dumps(schema, indent=2, sort_keys=False) + '\n', encoding='utf-8')

          # Document why module isolation is used and what the effectiveness gate means.
          readme = Path('validation/README.md')
          text = readme.read_text(encoding='utf-8')
          marker = '## Blind holdout\n'
          section = '''## Case-local processor profiles\n\nValidation cases may declare `processor_profile`. The default profile exercises the normal capture graph. `ns-isolated` runs only NS + VAD so NS preservation is not contaminated by HPF or AGC transforms. NS cases with deterministic VAD labels additionally measure `noise_only_attenuation_db` on stable non-speech frames after declared-latency alignment; a positive gate proves the suppressor is not a no-op while SI-SDR protects near-end fidelity.\n\n'''
          if marker not in text:
              raise SystemExit('validation README insertion marker not found')
          if section not in text:
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text, encoding='utf-8')
          PY

          python3 -m py_compile validation/tools/*.py
          python3 validation/tools/run_validation.py --self-test
          python3 -m json.tool validation/corpus.schema.json >/dev/null
          rm -rf build-ns-contract /tmp/ap-validation-contract
          cmake -S . -B build-ns-contract -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-ns-contract --target ap_process_pcm --parallel
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-validation-contract --seed 1307
          python3 validation/tools/run_validation.py \
            --corpus /tmp/ap-validation-contract/corpus.json \
            --policy validation/policies/validation-smoke.json \
            --dataset-lock validation/datasets.lock.json \
            --processor ./build-ns-contract/ap_process_pcm \
            --output /tmp/ap-validation-contract/report.json \
            --evidence-manifest /tmp/ap-validation-contract/evidence-manifest.json \
            --enforce
          python3 - <<'PY'
          import json
          report = json.load(open('/tmp/ap-validation-contract/report.json'))
          case = next(c for c in report['cases'] if c['case_id'] == 'ns-stationary')
          print(json.dumps({'summary': report['summary'], 'ns_metrics': case['metrics'], 'ns_violations': case['violations']}, sort_keys=True))
          assert report['validation_result'] == 'PASS'
          assert report['summary']['passed_cases'] == 8
          assert case['metrics']['near_si_sdr_improvement_db'] >= -3.0
          assert case['metrics']['noise_only_attenuation_db'] >= 1.0
          PY
          git diff --check
          git rm .github/workflows/ns-quality-sweep.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "validation: isolate NS quality and effectiveness gates"
          git push origin HEAD:validation/v1.3.0
