name: Fix Hosted Validation Import Once

on:
  push:
    branches:
      - codex/github-hosted-blind
    paths:
      - .github/workflows/fix-hosted-validation-import-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/github-hosted-blind
          fetch-depth: 0
      - name: Fix relocated hosted-validation import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/research-candidate-blind-qualification.yml')
          text = path.read_text(encoding='utf-8')
          old = "sys.path.insert(0, 'validation/tools')\n          import prepare_github_hosted_full_validation as hosted"
          new = "sys.path.insert(0, '.github/research/continuous-optimization/hosted-validation')\n          import prepare_full_validation as hosted"
          if old not in text:
              raise SystemExit('expected old hosted-validation import not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-hosted-validation-import-once.yml
          git diff --check
      - name: Commit fix and retire one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ci): import relocated hosted validation helper'
          git push origin HEAD:codex/github-hosted-blind
