name: Research I014 NS Upstream Component Decomposition v1
run-name: "i014-upstream-component-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i014-ns-upstream-component-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i014-ns-upstream-component-decomposition-v1-result.json'
      - 'tests/validation/i014_ns_upstream_component_probe.c'
      - 'tests/validation/i014_ns_upstream_component_decomposition.py'
      - '.github/workflows/research-i014-ns-upstream-component-decomposition-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i014-ns-upstream-component-decomposition-v1.json
  RESULT: .github/research/continuous-optimization/development-v4/i014-ns-upstream-component-decomposition-v1-result.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate consumed I014 contract, tooling and reviewed result
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i014_ns_upstream_component_decomposition.py
          python3 tests/validation/i014_ns_upstream_component_decomposition.py --self-test
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m json.tool "$RESULT" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i014-ns-upstream-component-decomposition-v1.json'
          ).read_text())
          result = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i014-ns-upstream-component-decomposition-v1-result.json'
          ).read_text())

          assert contract['investigation_id'] == 'i014-ns-upstream-component-decomposition-v1'
          assert contract['authority'] == 'RESEARCH_DIAGNOSTIC_ONLY'
          assert contract['source_base_sha'] == 'ce6aa15067cf2cffc272f55cfd7c7aaf2698e0cf'
          assert contract['fresh_diagnostic_authority']['seeds'] == [251123, 261123, 271123]
          assert contract['budget'] == {
              'candidate_limit': 0,
              'confirmation_limit': 0,
              'diagnostic_execution_limit': 1,
          }
          assert contract['parameter_search_allowed'] is False
          assert contract['threshold_tuning_allowed'] is False
          assert contract['promotion_allowed'] is False
          assert contract['shipping_source_change_allowed'] is False
          assert all(value is False for value in contract['authority_boundary'].values())

          assert result['status'] == 'CLOSED_DIAGNOSTIC_ONLY'
          assert result['authority'] == contract['authority']
          assert result['source_base_sha'] == contract['source_base_sha']
          assert result['decision'] == (
              'NS_UPSTREAM_COMPONENT_SYNERGY_SUPPORTED_REVIEW_REQUIRED'
          )
          assert result['reviewed_decision'] == (
              'NONSTATIONARY_UPSTREAM_COMPONENT_SYNERGY_SUPPORTED_NO_MAPPING'
          )

          execution = result['authoritative_execution']
          assert execution['workflow_run_id'] == 35986904552
          assert execution['artifact_id'] == 10803045008
          assert execution['artifact_digest'] == (
              'sha256:633312d8e8f3620653aa7e8c085c858841b10350c615ec536747fc2e43c21c46'
          )
          assert execution['internal_sha256s_verified'] == 9

          fresh = result['fresh_authority']
          assert fresh['seeds'] == [251123, 261123, 271123]
          assert fresh['diagnostic_execution_limit'] == 1
          assert fresh['diagnostic_execution_consumed'] == 1
          assert fresh['candidate_limit_consumed'] == 0
          assert fresh['confirmation_limit_consumed'] == 0
          assert fresh['parameter_search_performed'] is False
          assert fresh['threshold_tuning_performed'] is False
          assert fresh['component_reweighting_performed'] is False
          assert fresh['feature_mapping_selected'] is False

          integrity = result['input_integrity']
          assert integrity['input_violations'] == 0
          assert integrity['shipping_mirror_mismatch_frames'] == 0
          assert integrity['max_shipping_mirror_probability_delta'] == 0.0
          assert integrity['max_floor_shipping_probability_delta'] == 0.0

          summary = result['summary']
          assert summary['combined_nonstationary_shipping_gap_auc'] == 0.6435718136949939
          assert summary['combined_nonstationary_mean_suppression_auc'] == 0.5574899423499647
          assert summary['combined_nonstationary_concentration_auc'] == 0.4940749035709842
          assert summary['nonstationary_shipping_auc_gain_over_mean_suppression'] == 0.0860818713450292
          assert summary['nonstationary_shipping_auc_gain_over_concentration'] == 0.14949691012400973
          assert summary['all_synergy_gates_pass'] is True
          assert all(
              item['nonstationary_shipping_gap_auc'] >= 0.60
              for item in result['per_seed']
          )
          assert all(
              item['stationary_shipping_gap_auc'] < 0.50
              for item in result['per_seed']
          )
          assert all(value is False for value in result['authority_boundary'].values())
          PY
          git cat-file -e "ce6aa15067cf2cffc272f55cfd7c7aaf2698e0cf^{commit}"

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i014-upstream-component-contract

      - name: Compile retained test-only I014 exact-mirror probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i014-contract             -DCMAKE_BUILD_TYPE=Release             -DAP_BUILD_BENCH=OFF             -DAP_STRICT_WARNINGS=ON
          cmake --build build-i014-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i014-contract/generated             tests/validation/i014_ns_upstream_component_probe.c             build-i014-contract/libaudio_pipeline.a -lm             -o build-i014-contract/i014_ns_upstream_component_probe
