name: Quality

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build and install SDK
        run: |
          cmake -S . -B build-sdk -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sdk --parallel
          cmake --install build-sdk --prefix "$PWD/stage"
      - name: Consume with find_package
        run: |
          cmake -S tests/consumer -B build-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel
          ./build-consumer/audio_pipeline_consumer
      - name: Consume with pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig:$PWD/stage/lib64/pkgconfig"
          cc tests/consumer/consumer.c -o /tmp/audio-pipeline-pc \
            $(pkg-config --cflags --libs audio-pipeline)
          /tmp/audio-pipeline-pc

  sku-memory-rom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify SKU pipeline RAM pruning
        run: |
          cmake --preset composition-full
          cmake --preset composition-low
          cmake --preset composition-tiny
          cmake --preset composition-raw
          for p in full low tiny raw; do
            cmake --build "build/composition-$p" --target ap_state_size --parallel
          done
          full=$(./build/composition-full/ap_state_size)
          low=$(./build/composition-low/ap_state_size)
          tiny=$(./build/composition-tiny/ap_state_size)
          raw=$(./build/composition-raw/ap_state_size)
          echo "pipeline_state_bytes full=$full low=$low tiny=$tiny raw=$raw"
          test "$low" -lt "$full"
          test "$tiny" -lt "$low"
          test "$raw" -lt "$tiny"
      - name: Verify final consumer ELF pruning
        run: |
          common="-DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-ffunction-sections\ -fdata-sections -DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections"
          eval cmake -S . -B build/elf-full $common -DAP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          eval cmake -S . -B build/elf-voice $common -DAP_MODULES=RESAMPLER,HPF,BF,NS,AGC,VAD
          eval cmake -S . -B build/elf-raw $common -DAP_MODULES=RESAMPLER
          for p in full voice raw; do cmake --build "build/elf-$p" --target ap_consumer_smoke --parallel; done
          elf_bytes() { size "$1" | awk 'NR==2 {print $1+$2+$3}'; }
          full=$(elf_bytes build/elf-full/ap_consumer_smoke)
          voice=$(elf_bytes build/elf-voice/ap_consumer_smoke)
          raw=$(elf_bytes build/elf-raw/ap_consumer_smoke)
          echo "consumer_elf_bytes full=$full voice=$voice raw=$raw"
          test "$voice" -lt "$full"
          test "$raw" -lt "$voice"
      - name: Verify runtime queue/envelope RAM pruning
        run: |
          cmake -S . -B build/rt-full -DCMAKE_BUILD_TYPE=Release -DAP_RUNTIME_QUEUE_DEPTH=8
          cmake -S . -B build/rt-tiny -DCMAKE_BUILD_TYPE=Release \
            -DAP_RUNTIME_QUEUE_DEPTH=4 -DAP_BUILD_MAX_IO_RATE_HZ=16000 \
            -DAP_BUILD_MAX_INTERNAL_RATE_HZ=8000 -DAP_BUILD_MAX_MIC_CHANNELS=1 \
            -DAP_BUILD_MAX_DELAY_MS=120 -DAP_BUILD_MAX_AEC_TAIL_MS=48 \
            -DAP_MODULES=RESAMPLER,HPF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          cmake --build build/rt-full --parallel
          cmake --build build/rt-tiny --parallel
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-full/generated \
            build/rt-full/libaudio_pipeline_runtime.a build/rt-full/libaudio_pipeline.a -lm -pthread -o /tmp/rt-full
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-tiny/generated \
            build/rt-tiny/libaudio_pipeline_runtime.a build/rt-tiny/libaudio_pipeline.a -lm -pthread -o /tmp/rt-tiny
          full=$(/tmp/rt-full)
          tiny=$(/tmp/rt-tiny)
          echo "runtime_state_bytes full=$full tiny=$tiny"
          test "$tiny" -lt "$full"

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure TSan runtime contract
        env:
          CC: clang
        run: >-
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF
          -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -O1'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'
      - name: Build runtime tests
        run: cmake --build build-tsan --target ap_runtime_tests --parallel
      - name: Race-check worker/control-plane metrics
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ./build-tsan/ap_runtime_tests

  qemu-exec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cortex-a7-neon
            compiler: arm-linux-gnueabihf-gcc
            toolchain: cmake/toolchains/arm-linux-gnueabihf.cmake
            cflags: -O2 -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard
            simd: NEON
            qemu: qemu-arm -cpu cortex-a7 -L /usr/arm-linux-gnueabihf
          - name: aarch64-neon
            compiler: aarch64-linux-gnu-gcc
            toolchain: cmake/toolchains/aarch64-linux-gnu.cmake
            cflags: -O2 -march=armv8-a
            simd: NEON
            qemu: qemu-aarch64 -cpu cortex-a53 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install cross runtime
        run: >-
          sudo apt-get update && sudo apt-get install -y qemu-user
          gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu
          libc6-dev-armhf-cross libc6-dev-arm64-cross
      - name: Configure executable contract
        env:
          CC: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build/qemu-${{ matrix.name }}
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS='${{ matrix.cflags }}'
          -DAP_SIMD_BACKEND=${{ matrix.simd }}
          -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DAP_BUILD_TESTS=ON
      - name: Build executable contracts
        run: >-
          cmake --build build/qemu-${{ matrix.name }} --parallel
          --target ap_module_tests ap_contract_tests ap_fft_tests ap_resampler_tests ap_runtime_tests
      - name: Execute under QEMU
        run: |
          Q='${{ matrix.qemu }}'
          $Q ./build/qemu-${{ matrix.name }}/ap_module_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_contract_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_fft_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_resampler_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_runtime_tests

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install coverage tooling
        run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Configure coverage build
        env:
          CC: gcc
        run: >-
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_BENCH=OFF
          -DCMAKE_C_FLAGS='--coverage -O0 -g'
          -DCMAKE_EXE_LINKER_FLAGS='--coverage'
      - name: Run tests and enforce coverage
        run: |
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
          gcovr --root . --filter 'src/' --exclude 'tests/' \
            --fail-under-line 90 --print-summary

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install analyzer
        run: sudo apt-get update && sudo apt-get install -y clang-tools
      - name: Configure
        env:
          CC: clang
        run: >-
          cmake -S . -B build-analysis -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_TESTS=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF
      - name: Scan build
        run: scan-build --status-bugs cmake --build build-analysis --parallel

  acoustic-eval-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate evaluation harness
        run: python3 eval/run_eval.py --self-test
