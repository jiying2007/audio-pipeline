name: Stage Research Cron Retirement Patch

on:
  push:
    branches: [governance/retire-stage-research-cron]
    paths:
      - '.github/workflows/stage-research-cron-retirement-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: governance/retire-stage-research-cron
          fetch-depth: 0
      - name: Remove only autonomous research schedules
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = {
              '.github/workflows/aec-motion-tuning.yml': "13 20 * * 2,5",
              '.github/workflows/agc-stage-tuning.yml': "17 21 * * 6",
              '.github/workflows/ns-stage-tuning.yml': "41 20 * * 6",
              '.github/workflows/ami-vad-microset-discovery.yml': "13 20 * * 6",
              '.github/workflows/vad-operating-point-selector.yml': "29 21 * * 6",
              '.github/workflows/vad-hangover-counterfactual.yml': "41 20 * * 6",
              '.github/workflows/vad-strong-weak-refresh.yml': "53 20 * * 6",
          }
          for name, cron in targets.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              needle = f"  schedule:\n    - cron: '{cron}'\n"
              assert text.count(needle) == 1, (name, 'unexpected schedule contract')
              updated = text.replace(needle, '', 1)
              assert '\n  schedule:' not in updated, (name, 'schedule remained')
              assert '\n  pull_request:' in updated, (name, 'PR regression trigger missing')
              assert '\n  workflow_dispatch:' in updated, (name, 'manual trigger missing')
              assert '\n  push:' not in updated, (name, 'autonomous push trigger present')
              path.write_text(updated, encoding='utf-8')
          PY
          git diff --check
          git diff -- .github/workflows/aec-motion-tuning.yml \
            .github/workflows/agc-stage-tuning.yml \
            .github/workflows/ns-stage-tuning.yml \
            .github/workflows/ami-vad-microset-discovery.yml \
            .github/workflows/vad-operating-point-selector.yml \
            .github/workflows/vad-hangover-counterfactual.yml \
            .github/workflows/vad-strong-weak-refresh.yml
      - name: Commit exact patch and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/stage-research-cron-retirement-patch.yml
          git add \
            .github/workflows/aec-motion-tuning.yml \
            .github/workflows/agc-stage-tuning.yml \
            .github/workflows/ns-stage-tuning.yml \
            .github/workflows/ami-vad-microset-discovery.yml \
            .github/workflows/vad-operating-point-selector.yml \
            .github/workflows/vad-hangover-counterfactual.yml \
            .github/workflows/vad-strong-weak-refresh.yml
          git diff --cached --check
          git commit -m 'ci: retire autonomous stage research schedules'
          git push origin HEAD:governance/retire-stage-research-cron
