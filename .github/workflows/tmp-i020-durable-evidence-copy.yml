name: Temporary I020 Durable Evidence Copier

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-i020-durable-evidence-copy.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: tmp-i020-durable-evidence-copy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  copy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/i020-durable-evidence-archive'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      ROOT: validation/research/evidence/i020-blind-baseline-invalid-36304120808-36324803945
      MANIFEST: .github/research/continuous-optimization/development-v4/i020-blind-baseline-invalid-durable-evidence-v1.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Bind copy authority to trusted main manifest
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git show "origin/main:$MANIFEST")" = "$(cat "$MANIFEST")"
          test "$(jq -r .status "$MANIFEST")" = FROZEN_ARCHIVE_MANIFEST
          test "$(jq -r .authority_boundary.archive_copy_only "$MANIFEST")" = true
          test ! -e "$ROOT"

      - name: Download exact sealed artifacts
        run: |
          set -euo pipefail
          mkdir -p /tmp/i020-source /tmp/i020-resume
          for spec in             '10927016997 sha256:eafc16de6a8984a25eca8cc383ca8ceb0d6291d63adf09ee6159397e6fe11fe8 source'             '10934232488 sha256:dc212b9a0067b1ab7bf813abbe64999b84247c5d3199a7ca6044ea61dea15b3c resume'
          do
            set -- $spec
            id=$1 digest=$2 name=$3
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" > "/tmp/$name-meta.json"
            test "$(jq -r .expired "/tmp/$name-meta.json")" = false
            test "$(jq -r .digest "/tmp/$name-meta.json")" = "$digest"
            curl --fail --silent --show-error --location               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip"               --output "/tmp/$name.zip"
            test "sha256:$(sha256sum "/tmp/$name.zip" | awk '{print $1}')" = "$digest"
            unzip -q "/tmp/$name.zip" -d "/tmp/i020-$name"
          done

      - name: Copy only manifest-listed exact bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          manifest=json.loads(Path(os.environ['MANIFEST']).read_text())
          root=Path(os.environ['ROOT'])
          root.mkdir(parents=True,exist_ok=False)
          groups=(
              (manifest['source_partition_artifact'],Path('/tmp/i020-source')),
              (manifest['same_partition_resume_artifact'],Path('/tmp/i020-resume')),
          )
          expected=[]
          for group,source_root in groups:
              for item in group['members']:
                  src=source_root/item['source_path']
                  dst=root/item['archive_name']
                  data=src.read_bytes()
                  if len(data)!=int(item['bytes']):
                      raise SystemExit(f"size mismatch: {src}")
                  digest=hashlib.sha256(data).hexdigest()
                  if digest!=item['sha256']:
                      raise SystemExit(f"sha mismatch: {src}")
                  if dst.exists():
                      raise SystemExit(f"duplicate archive name: {dst}")
                  dst.write_bytes(data)
                  expected.append(item['archive_name'])
          actual=sorted(p.name for p in root.iterdir() if p.is_file())
          if actual!=sorted(expected):
              raise SystemExit(f"archive set mismatch: {actual}")
          print(json.dumps({"files":actual,"bytes":sum(p.stat().st_size for p in root.iterdir())}))
          PY

      - name: Commit exact archive bytes only
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = ""
          mapfile -t untracked < <(git ls-files --others --exclude-standard "$ROOT")
          test "${#untracked[@]}" -eq 11
          git add "$ROOT"
          mapfile -t staged < <(git diff --cached --name-only)
          test "${#staged[@]}" -eq 11
          printf '%s\n' "${staged[@]}" | grep -qv "^$ROOT/" && exit 2 || true
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'research(i020): copy trusted blind evidence bytes'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
