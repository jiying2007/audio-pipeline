name: Release

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  pull-requests: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_sha: ${{ steps.release_identity.outputs.release_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Verify exact release SHA
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
      - name: Require live repository governance before release
        env:
          GH_TOKEN: ${{ secrets.REPOSITORY_GOVERNANCE_TOKEN }}
          REPOSITORY_METADATA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo "REPOSITORY_GOVERNANCE_TOKEN is required with repository Administration(read)." >&2
            exit 1
          }
          python3 scripts/github_governance.py \
            --repository "$GITHUB_REPOSITORY" --output /tmp/repository-governance.json
      - name: Require merged PR lineage for release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/commits/$VERIFIED_SHA/pulls" > /tmp/release-prs.json
          python3 - <<'PY'
          import json
          prs = json.load(open('/tmp/release-prs.json'))
          eligible = [p for p in prs if p.get('merged_at') and p.get('base', {}).get('ref') == 'main']
          if not eligible:
              raise SystemExit('release SHA has no merged PR targeting main; direct-push releases are forbidden')
          print('release_prs=' + ','.join('#' + str(p['number']) for p in eligible))
          PY
      - name: Resolve project version and source epoch
        id: version
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(sed -n 's/^project(audio_pipeline VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          epoch=$(git show -s --format=%ct "$VERIFIED_SHA")
          test -n "$epoch"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
      - name: Check existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify existing immutable release identity
        if: steps.existing.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python3 .github/program/existing_release_identity.py --self-test
          work=/tmp/existing-release-identity
          rm -rf "$work"
          mkdir -p "$work"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$work/release.json"
          ref_json=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")
          object_type=$(jq -r '.object.type' <<<"$ref_json")
          object_sha=$(jq -r '.object.sha' <<<"$ref_json")
          while [ "$object_type" = tag ]; do
            tag_json=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha")
            object_type=$(jq -r '.object.type' <<<"$tag_json")
            object_sha=$(jq -r '.object.sha' <<<"$tag_json")
          done
          test "$object_type" = commit
          git merge-base --is-ancestor "$object_sha" "$VERIFIED_SHA"
          gh release download "$TAG"             --pattern "audio-pipeline-${TAG}-release-manifest.json"             --pattern SHA256SUMS             --dir "$work"
          python3 .github/program/existing_release_identity.py             --release-json "$work/release.json"             --manifest "$work/audio-pipeline-${TAG}-release-manifest.json"             --sha256s "$work/SHA256SUMS"             --tag "$TAG" --version "$VERSION"             --tag-peel-sha "$object_sha" --verified-sha "$VERIFIED_SHA"             --release-source-is-ancestor             --output "$work/result.json"
          cat "$work/result.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Download exact Verify conservative delivery evidence
        if: steps.existing.outputs.release != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ssc305-delivery-profiles-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: verified-delivery
      - name: Download exact Verify non-DUT endurance evidence
        if: steps.existing.outputs.release != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: non-dut-engineering-endurance-${{ github.event.workflow_run.id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: verified-endurance
      - name: Verify and preserve reference SDK and engineering evidence
        if: steps.existing.outputs.release != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
        run: |
          set -euo pipefail
          python3 scripts/ssc305_delivery.py self-test
          python3 scripts/ssc305_delivery.py verify --output verified-delivery/reference \
            --source-revision "$VERIFIED_SHA" --artifact-class reference-armhf-sdk-not-shipping-bsp
          python3 scripts/ssc305_delivery.py verify --output verified-endurance \
            --source-revision "$VERIFIED_SHA" --artifact-class host-engineering-not-product-soak
          cp verified-delivery/reference/reference-armhf-sdk.tar.gz "audio-pipeline-${TAG}-reference-armhf-sdk.tar.gz"
          cp verified-delivery/reference/reference-armhf.spdx.json "audio-pipeline-${TAG}-reference-armhf.spdx.json"
          # Evidence includes its sealed SDK bytes for independent complete verification.
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C verified-delivery/reference -cf - . | gzip -n > "audio-pipeline-${TAG}-reference-armhf-evidence.tar.gz"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C verified-endurance -cf - . | gzip -n > "audio-pipeline-${TAG}-engineering-endurance.tar.gz"
      - name: Build, test and install SDK
        if: steps.existing.outputs.release != 'true'
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          cmake --build build-release --parallel
          ctest --test-dir build-release --output-on-failure
          cmake --install build-release --prefix "$PWD/stage"
      - name: Run deterministic release validation smoke
        if: steps.existing.outputs.release != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 validation/tools/build_validation_corpus.py --output validation-smoke --seed 1307
          cp validation-smoke/corpus.json "audio-pipeline-${TAG}-validation-smoke-corpus.json"
          python3 validation/tools/run_validation.py \
            --corpus validation-smoke/corpus.json \
            --policy validation/policies/validation-smoke.json \
            --dataset-lock validation/datasets.lock.json \
            --processor ./build-release/ap_process_pcm \
            --source-revision "$VERIFIED_SHA" \
            --output "audio-pipeline-${TAG}-validation-smoke.json" \
            --evidence-manifest "audio-pipeline-${TAG}-validation-smoke-evidence.json" \
            --enforce
      - name: Generate SPDX SBOM
        if: steps.existing.outputs.release != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          python3 tools/generate_spdx_sbom.py \
            --root stage \
            --name audio-pipeline \
            --version "$VERSION" \
            --revision "$VERIFIED_SHA" \
            --created-epoch "$SOURCE_DATE_EPOCH" \
            --output "audio-pipeline-${TAG}.spdx.json"
      - name: Package reproducible SDK/source and checksums
        if: steps.existing.outputs.release != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFY_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_DATE_EPOCH: ${{ steps.version.outputs.epoch }}
          HIL_ENABLED: ${{ vars.HIL_ENABLED }}
          EXTENDED_REAL_ENABLED: ${{ vars.EXTENDED_REAL_ENABLED }}
        run: |
          find stage -exec touch -d "@$SOURCE_DATE_EPOCH" {} +
          package_sdk() {
            out=$1
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" \
              --owner=0 --group=0 --numeric-owner --format=gnu \
              -C stage -cf - . | gzip -n > "$out"
          }
          package_source() {
            out=$1
            git archive --format=tar \
              --prefix="audio-pipeline-${TAG}-source/" \
              "$VERIFIED_SHA" | gzip -n > "$out"
          }
          package_sdk "audio-pipeline-${TAG}-sdk.tar.gz"
          package_sdk /tmp/sdk-repeat.tar.gz
          cmp "audio-pipeline-${TAG}-sdk.tar.gz" /tmp/sdk-repeat.tar.gz
          package_source "audio-pipeline-${TAG}-source.tar.gz"
          package_source /tmp/source-repeat.tar.gz
          cmp "audio-pipeline-${TAG}-source.tar.gz" /tmp/source-repeat.tar.gz
          python3 scripts/release_manifest.py --self-test
          python3 scripts/release_manifest.py \
            --version "$VERSION" --tag "$TAG" \
            --source-sha "$VERIFIED_SHA" --verify-run-id "$VERIFY_RUN_ID" \
            --prs-json /tmp/release-prs.json \
            --hil-enabled "$HIL_ENABLED" --extended-real-enabled "$EXTENDED_REAL_ENABLED" \
            --asset "audio-pipeline-${TAG}-sdk.tar.gz" \
            --asset "audio-pipeline-${TAG}-source.tar.gz" \
            --asset "audio-pipeline-${TAG}.spdx.json" \
            --asset "audio-pipeline-${TAG}-reference-armhf-sdk.tar.gz" \
            --asset "audio-pipeline-${TAG}-reference-armhf.spdx.json" \
            --asset "audio-pipeline-${TAG}-reference-armhf-evidence.tar.gz" \
            --asset "audio-pipeline-${TAG}-engineering-endurance.tar.gz" \
            --asset "audio-pipeline-${TAG}-validation-smoke-corpus.json" \
            --asset "audio-pipeline-${TAG}-validation-smoke.json" \
            --asset "audio-pipeline-${TAG}-validation-smoke-evidence.json" \
            --output "audio-pipeline-${TAG}-release-manifest.json"
          sha256sum \
            "audio-pipeline-${TAG}-sdk.tar.gz" \
            "audio-pipeline-${TAG}-source.tar.gz" \
            "audio-pipeline-${TAG}.spdx.json" \
            "audio-pipeline-${TAG}-reference-armhf-sdk.tar.gz" \
            "audio-pipeline-${TAG}-reference-armhf.spdx.json" \
            "audio-pipeline-${TAG}-reference-armhf-evidence.tar.gz" \
            "audio-pipeline-${TAG}-engineering-endurance.tar.gz" \
            "audio-pipeline-${TAG}-validation-smoke-corpus.json" \
            "audio-pipeline-${TAG}-validation-smoke.json" \
            "audio-pipeline-${TAG}-validation-smoke-evidence.json" \
            "audio-pipeline-${TAG}-release-manifest.json" > SHA256SUMS
      - name: Attest release build provenance
        if: steps.existing.outputs.release != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            audio-pipeline-${{ steps.version.outputs.tag }}-sdk.tar.gz
            audio-pipeline-${{ steps.version.outputs.tag }}-source.tar.gz
            audio-pipeline-${{ steps.version.outputs.tag }}.spdx.json
            audio-pipeline-${{ steps.version.outputs.tag }}-reference-armhf-sdk.tar.gz
            audio-pipeline-${{ steps.version.outputs.tag }}-reference-armhf.spdx.json
            audio-pipeline-${{ steps.version.outputs.tag }}-reference-armhf-evidence.tar.gz
            audio-pipeline-${{ steps.version.outputs.tag }}-engineering-endurance.tar.gz
            audio-pipeline-${{ steps.version.outputs.tag }}-validation-smoke-corpus.json
            audio-pipeline-${{ steps.version.outputs.tag }}-validation-smoke.json
            audio-pipeline-${{ steps.version.outputs.tag }}-validation-smoke-evidence.json
            audio-pipeline-${{ steps.version.outputs.tag }}-release-manifest.json
            SHA256SUMS
      - name: Attest SDK SBOM
        if: steps.existing.outputs.release != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: audio-pipeline-${{ steps.version.outputs.tag }}-sdk.tar.gz
          sbom-path: audio-pipeline-${{ steps.version.outputs.tag }}.spdx.json
      - name: Attest reference armhf SDK SBOM
        if: steps.existing.outputs.release != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: audio-pipeline-${{ steps.version.outputs.tag }}-reference-armhf-sdk.tar.gz
          sbom-path: audio-pipeline-${{ steps.version.outputs.tag }}-reference-armhf.spdx.json
      - name: Create exact-SHA release tag
        if: steps.existing.outputs.release != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n1 "$TAG")" = "$VERIFIED_SHA"
          else
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "$TAG" -m "audio-pipeline $TAG" "$VERIFIED_SHA"
            git push origin "$TAG"
          fi
      - name: Create draft GitHub Release with complete asset set
        if: steps.existing.outputs.release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" --draft --verify-tag --generate-notes \
            "audio-pipeline-${TAG}-sdk.tar.gz" \
            "audio-pipeline-${TAG}-source.tar.gz" \
            "audio-pipeline-${TAG}.spdx.json" \
            "audio-pipeline-${TAG}-reference-armhf-sdk.tar.gz" \
            "audio-pipeline-${TAG}-reference-armhf.spdx.json" \
            "audio-pipeline-${TAG}-reference-armhf-evidence.tar.gz" \
            "audio-pipeline-${TAG}-engineering-endurance.tar.gz" \
            "audio-pipeline-${TAG}-validation-smoke-corpus.json" \
            "audio-pipeline-${TAG}-validation-smoke.json" \
            "audio-pipeline-${TAG}-validation-smoke-evidence.json" \
            "audio-pipeline-${TAG}-release-manifest.json" \
            SHA256SUMS
      - name: Publish complete release
        if: steps.existing.outputs.release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
      - name: Require immutable published release
        if: steps.existing.outputs.release != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.immutable')
          if [ "$immutable" != true ]; then
            echo "Published release is mutable despite the preflight governance gate." >&2
            exit 1
          fi
          echo "immutable_release=$TAG"

      - name: Resolve immutable release identity for convergence
        id: release_identity
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          release_sha=$(git rev-list -n1 "$TAG")
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "invalid immutable release SHA for $TAG: $release_sha" >&2
            exit 1
          }
          git merge-base --is-ancestor "$release_sha" "$VERIFIED_SHA"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "release_identity=$TAG@$release_sha"
      - name: Trigger exact-SHA post-release HIL
        if: steps.existing.outputs.release != 'true' && vars.HIL_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=hil-post-release \
            -f "client_payload[release_ref]=$VERIFIED_SHA" \
            -f "client_payload[tag]=$TAG"
      - name: Trigger exact-SHA post-release Extended Real validation
        if: steps.existing.outputs.release != 'true' && vars.EXTENDED_REAL_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=extended-real-post-release \
            -f "client_payload[release_ref]=$VERIFIED_SHA" \
            -f "client_payload[tag]=$TAG"
  convergence:
    needs: release
    if: needs.release.result == 'success'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Trigger post-release qualification convergence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: |
          set -euo pipefail
          test -n "$TAG"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          artifact="post-release-qualification-$TAG"
          finalized=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$artifact&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | length')
          if [ "$finalized" != 0 ]; then
            echo "post-release qualification already finalized: $TAG"
            exit 0
          fi
          gh workflow run post-release-qualification-summary.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "source_sha=$RELEASE_SHA" \
            -f "tag=$TAG"
