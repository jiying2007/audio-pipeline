name: Acoustic Candidate Qualification

on:
  pull_request:
    paths:
      - '.github/workflows/acoustic-candidate-qualification.yml'
      - '.github/program/acoustic_candidate.py'
      - '.github/program/acoustic_candidate_request.py'
      - '.github/program/acoustic_candidate_request.json'
  workflow_dispatch:
    inputs:
      data_root:
        description: Public dataset cache root on isolated audio-validation runner
        required: true
        default: /opt/audio-validation-data
        type: string
      seal_path:
        description: Local dataset seal JSON path on runner
        required: true
        default: /opt/audio-validation-data/datasets.seal.json
        type: string
      dns_data_root:
        description: Official DNS5 clean/noise WAV root; blank uses the pinned cache default
        required: false
        default: ''
        type: string
      aec_limit:
        required: true
        default: '60'
        type: string
      derived_limit:
        required: true
        default: '20'
        type: string
      dns_limit:
        required: true
        default: '60'
        type: string
      holdout_percent:
        description: Repository-external HMAC blind holdout percentage
        required: true
        default: '20'
        type: choice
        options: ['20', '30']

permissions:
  contents: read

concurrency:
  group: acoustic-candidate-qualification-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Candidate identity and request contract self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/program/acoustic_candidate.py --self-test
          python3 .github/program/acoustic_candidate_request.py --self-test
          python3 .github/program/acoustic_candidate_request.py \
            --request .github/program/acoustic_candidate_request.json \
            --output /tmp/acoustic-candidate-request.json
      - name: Enforce canonical non-shipping boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/acoustic-candidate-qualification.yml').read_text(encoding='utf-8')
          required = (
              'non-shipping-acoustic-candidate-qualification',
              'acoustic_candidate_request.json',
              'AP_VALIDATION_HOLDOUT_KEY',
              '--blind-summary-only',
              'source/validation/tools/run_validation.py',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'candidate qualification contract missing: {missing}')
          forbidden_inputs = tuple(
              'inputs.' + name for name in (
                  'source_sha', 'candidate_id', 'provenance_sha256',
                  'aec_mu', 'ns_floor', 'agc_target_dbfs', 'limiter_dbfs',
              )
          )
          present_inputs = [item for item in forbidden_inputs if item in text]
          if present_inputs:
              raise SystemExit(f'candidate identity must come only from qualification request: {present_inputs}')
          forbidden = ('git ' + 'push', 'gh ' + 'release', 'git ' + 'tag', 'sed ' + '-i')
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'candidate qualification workflow contains shipping mutation primitive: {present}')
          print('candidate qualification workflow boundary: OK')
          PY

  resolve:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      infra_sha: ${{ steps.infra.outputs.sha }}
      candidate_id: ${{ steps.request.outputs.candidate_id }}
      provenance_sha256: ${{ steps.request.outputs.provenance_sha256 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Bind current-main qualification infrastructure revision
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          sha=$(git rev-parse HEAD)
          main_sha=$(git rev-parse origin/main)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          test "$sha" = "$main_sha" || {
            echo "candidate qualification must dispatch from current main: head=$sha main=$main_sha" >&2
            exit 1
          }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Resolve frozen qualification request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/program/acoustic_candidate_request.py \
            --request .github/program/acoustic_candidate_request.json \
            --env-output /tmp/acoustic-candidate-request.env \
            --output /tmp/acoustic-candidate-request.json
          set -a
          . /tmp/acoustic-candidate-request.env
          set +a
          git fetch --no-tags origin "$AP_CANDIDATE_SOURCE_SHA"
          git cat-file -e "$AP_CANDIDATE_SOURCE_SHA^{commit}"
          git cat-file -e "$AP_CANDIDATE_SOURCE_SHA:validation/tools/run_validation.py"
          git cat-file -e "$AP_CANDIDATE_SOURCE_SHA:validation/datasets.lock.json"
          echo "source_sha=$AP_CANDIDATE_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_id=$AP_ACOUSTIC_CANDIDATE_ID" >> "$GITHUB_OUTPUT"
          echo "provenance_sha256=$AP_CANDIDATE_PROVENANCE_SHA256" >> "$GITHUB_OUTPUT"

  qualify-blind:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: [self-hosted, linux, audio-validation]
    steps:
      - name: Checkout qualification infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.infra_sha }}
          fetch-depth: 0
          path: infra
      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Record exact revisions and preflight isolated runner
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          SEAL: ${{ inputs.seal_path }}
          DNS_ROOT: ${{ inputs.dns_data_root }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '${{ needs.resolve.outputs.source_sha }}'
          test "$(git -C infra rev-parse HEAD)" = '${{ needs.resolve.outputs.infra_sha }}'
          mkdir -p candidate-out
          printf '%s\n' '${{ needs.resolve.outputs.source_sha }}' > candidate-out/source-revision.txt
          printf '%s\n' '${{ needs.resolve.outputs.infra_sha }}' > candidate-out/qualification-infra-revision.txt
          cp infra/.github/program/acoustic_candidate_request.json candidate-out/qualification-request.json
          python3 infra/.github/program/acoustic_candidate_request.py \
            --request infra/.github/program/acoustic_candidate_request.json \
            --output candidate-out/qualification-request-normalized.json
          args=(
            --role audio-validation
            --source-revision '${{ needs.resolve.outputs.source_sha }}'
            --data-root "$DATA_ROOT" --seal "$SEAL"
            --writable-path "$GITHUB_WORKSPACE" --output candidate-out/runner-preflight.json
          )
          if [ -n "$DNS_ROOT" ]; then args+=(--dns-data-root "$DNS_ROOT"); fi
          python3 source/tools/runner_preflight.py "${args[@]}"
          test -z "$(git -C source status --porcelain=v1)"
          test -z "$(git -C infra status --porcelain=v1)"
      - name: Verify full sealed public cache
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          SEAL: ${{ inputs.seal_path }}
          DNS_ROOT: ${{ inputs.dns_data_root }}
        shell: bash
        run: |
          set -euo pipefail
          args=(verify --profile full --root "$DATA_ROOT" --seal "$SEAL")
          if [ -n "$DNS_ROOT" ]; then args+=(--dns-data-root "$DNS_ROOT"); fi
          python3 source/validation/tools/prepare_public_validation.py "${args[@]}" > candidate-out/dataset-verification.json
      - name: Build exact offline candidate processor
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-candidate -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON \
            -DAP_BUILD_SOURCE_REVISION='${{ needs.resolve.outputs.source_sha }}'
          cmake --build build-candidate --target ap_process_pcm ap_build_info_dump --parallel
          sha256sum build-candidate/ap_process_pcm | tee ../candidate-out/processor.sha256
          build-candidate/ap_build_info_dump | tee ../candidate-out/build-info.txt
          ${CC:-cc} --version | head -n 1 | tee ../candidate-out/compiler.txt
      - name: Seal and verify fixed candidate identity
        shell: bash
        run: |
          set -euo pipefail
          python3 infra/.github/program/acoustic_candidate_request.py \
            --request infra/.github/program/acoustic_candidate_request.json \
            --env-output /tmp/acoustic-candidate-request.env
          set -a
          . /tmp/acoustic-candidate-request.env
          set +a
          test "$AP_CANDIDATE_SOURCE_SHA" = '${{ needs.resolve.outputs.source_sha }}'
          test "$AP_ACOUSTIC_CANDIDATE_ID" = '${{ needs.resolve.outputs.candidate_id }}'
          test "$AP_CANDIDATE_PROVENANCE_SHA256" = '${{ needs.resolve.outputs.provenance_sha256 }}'
          python3 infra/.github/program/acoustic_candidate.py \
            --source-revision "$AP_CANDIDATE_SOURCE_SHA" \
            --provenance-sha256 "$AP_CANDIDATE_PROVENANCE_SHA256" \
            --candidate-id "$AP_ACOUSTIC_CANDIDATE_ID" \
            --aec-mu "$AP_TUNING_AEC_MU" --ns-floor "$AP_TUNING_NS_FLOOR" \
            --agc-target-dbfs "$AP_TUNING_AGC_TARGET_DBFS" --limiter-dbfs "$AP_TUNING_LIMITER_DBFS" \
            --processor source/build-candidate/ap_process_pcm \
            --wrapper candidate-out/candidate-processor \
            --output candidate-out/candidate-identity.json
      - name: Build full public validation corpus
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          SEAL: ${{ inputs.seal_path }}
          DNS_ROOT: ${{ inputs.dns_data_root }}
          AEC_LIMIT: ${{ inputs.aec_limit }}
          DERIVED_LIMIT: ${{ inputs.derived_limit }}
          DNS_LIMIT: ${{ inputs.dns_limit }}
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --data-root "$DATA_ROOT" --seal "$SEAL" --output candidate-out/public
            --aec-limit "$AEC_LIMIT" --derived-limit "$DERIVED_LIMIT" --dns-limit "$DNS_LIMIT"
          )
          if [ -n "$DNS_ROOT" ]; then args+=(--dns-data-root "$DNS_ROOT"); fi
          python3 source/validation/tools/build_full_public_corpus.py "${args[@]}"
      - name: Partition repository-external blind holdout
        env:
          AP_VALIDATION_HOLDOUT_KEY: ${{ secrets.AP_VALIDATION_HOLDOUT_KEY }}
          HOLDOUT: ${{ inputs.holdout_percent }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AP_VALIDATION_HOLDOUT_KEY" || { echo 'AP_VALIDATION_HOLDOUT_KEY is required; blind qualification fails closed' >&2; exit 1; }
          python3 source/validation/tools/split_holdout.py \
            --corpus candidate-out/public/corpus.json \
            --validation-output candidate-out/public/corpus-validation.json \
            --blind-output candidate-out/public/corpus-blind.json \
            --holdout-percent "$HOLDOUT"
      - name: Run fixed candidate on visible validation partition
        shell: bash
        run: |
          set -euo pipefail
          python3 source/validation/tools/run_validation.py \
            --source-revision '${{ needs.resolve.outputs.source_sha }}' \
            --corpus candidate-out/public/corpus-validation.json \
            --policy source/validation/policies/validation-full-partition.json \
            --dataset-lock source/validation/datasets.lock.json \
            --processor candidate-out/candidate-processor \
            --output candidate-out/validation-report.json \
            --evidence-manifest candidate-out/validation-evidence-manifest.json --enforce
      - name: Run fixed candidate on blind holdout with summary-only report
        shell: bash
        run: |
          set -euo pipefail
          python3 source/validation/tools/run_validation.py \
            --source-revision '${{ needs.resolve.outputs.source_sha }}' \
            --corpus candidate-out/public/corpus-blind.json \
            --policy source/validation/policies/validation-full-blind.json \
            --dataset-lock source/validation/datasets.lock.json \
            --processor candidate-out/candidate-processor \
            --output candidate-out/blind-report.json \
            --evidence-manifest candidate-out/blind-evidence-manifest.json \
            --blind-summary-only --enforce
      - name: Classify candidate qualification without promotion authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('candidate-out')
          identity = json.loads((root/'candidate-identity.json').read_text(encoding='utf-8'))
          request = json.loads((root/'qualification-request-normalized.json').read_text(encoding='utf-8'))
          visible = json.loads((root/'validation-report.json').read_text(encoding='utf-8'))
          blind = json.loads((root/'blind-report.json').read_text(encoding='utf-8'))
          def sha(path): return hashlib.sha256(path.read_bytes()).hexdigest()
          if identity['authority'] != 'non-shipping-acoustic-candidate-qualification':
              raise SystemExit('invalid candidate authority')
          if identity['source_revision'] != request['candidate_source_revision']:
              raise SystemExit('candidate source/request mismatch')
          if identity['provenance_sha256'] != request['provenance']['iteration_result_sha256']:
              raise SystemExit('candidate provenance/request mismatch')
          if visible.get('validation_result') != 'PASS' or blind.get('validation_result') != 'PASS':
              raise SystemExit('fixed candidate did not pass visible+blind validation policies')
          summary = {
              'schema_version': 1,
              'authority': 'non-shipping-acoustic-candidate-qualification',
              'decision': 'BLIND_QUALIFIED_NON_SHIPPING',
              'candidate_id': identity['candidate_id'],
              'source_revision': identity['source_revision'],
              'qualification_infra_revision': (root/'qualification-infra-revision.txt').read_text().strip(),
              'qualification_request_sha256': sha(root/'qualification-request.json'),
              'processor_sha256': identity['processor_sha256'],
              'provenance_sha256': identity['provenance_sha256'],
              'tuning': identity['tuning'],
              'validation_report_sha256': sha(root/'validation-report.json'),
              'blind_report_sha256': sha(root/'blind-report.json'),
              'remaining_required': [
                  'same-candidate target CPU/RSS/latency evidence',
                  'PCR02 35 mm real-device acoustic evidence',
                  'same-candidate SSC305 HIL and soak evidence',
                  'shipping-hardware product certification',
                  'separate reviewed release-bearing shipping change',
              ],
              'rule': 'Blind qualification is candidate evidence only; it never mutates or promotes shipping defaults.',
          }
          (root/'qualification-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps(summary, sort_keys=True))
          PY
      - name: Seal candidate evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate-out
          find candidate-out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > /tmp/candidate-SHA256SUMS
          mv /tmp/candidate-SHA256SUMS candidate-out/SHA256SUMS
      - name: Upload candidate qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acoustic-candidate-${{ needs.resolve.outputs.candidate_id }}-${{ github.run_id }}
          path: candidate-out/
          if-no-files-found: error
          retention-days: 90
