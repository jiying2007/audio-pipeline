name: Probe Development Archives Once

on:
  push:
    branches: [codex/multidataset-development-v2]
    paths:
      - '.github/workflows/probe-development-archives-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Download and hash pinned development archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dev-archives
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          items = [
            ('openslr-slr31-train-clean-5', 'https://www.openslr.org/resources/31/train-clean-5.tar.gz'),
            ('openslr-slr26-sim-rir-16k', 'https://www.openslr.org/resources/26/sim_rir_16k.zip'),
            ('demand-dkitchen-16k', 'https://zenodo.org/records/1227121/files/DKITCHEN_16k.zip?download=1'),
            ('demand-straffic-16k', 'https://zenodo.org/records/1227121/files/STRAFFIC_16k.zip?download=1'),
          ]
          out=[]
          for ident,url in items:
              path=Path('/tmp/dev-archives')/f'{ident}.bin'
              subprocess.run(['curl','--fail','--location','--retry','4','--retry-delay','3','--silent','--show-error',url,'-o',str(path)],check=True)
              size=path.stat().st_size
              sha=subprocess.check_output(['sha256sum',str(path)],text=True).split()[0]
              out.append({'id':ident,'url':url,'bytes':size,'sha256':sha})
          Path('/tmp/development-archive-lock.json').write_text(json.dumps({'schema_version':1,'lock_id':'audio-pipeline-public-development-v2','archives':out},indent=2,sort_keys=True)+'\n')
          print(Path('/tmp/development-archive-lock.json').read_text())
          PY
      - name: Upload tiny archive identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: development-archive-lock-${{ github.run_id }}
          path: /tmp/development-archive-lock.json
          if-no-files-found: error
          retention-days: 7
