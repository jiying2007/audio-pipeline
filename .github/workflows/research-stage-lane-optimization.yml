name: Research Stage Lane Optimization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/stage-lanes-v1.json'
      - '.github/research/continuous-optimization/*_stage_lane_v1.py'
      - '.github/workflows/research-stage-lane-optimization.yml'
      - '.github/program/maintenance_workflow_contract.py'
      - 'validation/tuning/search-spaces/ns-stage-v1.json'
      - 'validation/tuning/search-spaces/agc-stage-v1.json'
      - 'validation/tools/build_ns_tuning_corpus.py'
      - 'validation/tools/build_stage_validation_corpus.py'
      - 'tests/validation/build_bf_sensitivity_sweep.py'
      - 'tests/validation/build_bf_hard_fault_sweep.py'
      - 'tests/validation/build_agc_bf_validation_corpus.py'
      - 'tests/validation/vad_operating_point_selector.py'
      - 'tests/validation/agc_dynamics_diagnostic.py'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Stage research lane to execute'
        required: true
        type: choice
        default: all
        options: [all, bf, ns, vad, agc]

permissions:
  contents: read

concurrency:
  group: research-stage-lanes-${{ github.ref }}-${{ inputs.lane || 'contract' }}
  cancel-in-progress: true

env:
  STAGE_LANES: .github/research/continuous-optimization/stage-lanes-v1.json
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Validate stage lane tooling and authority
        run: |
          set -euo pipefail
          python3 -m py_compile             .github/research/continuous-optimization/bf_stage_lane_v1.py             .github/research/continuous-optimization/ns_stage_lane_v1.py             .github/research/continuous-optimization/vad_stage_lane_v1.py             .github/research/continuous-optimization/agc_stage_lane_v1.py
          python3 -m json.tool "$STAGE_LANES" >/dev/null
          python3 .github/research/continuous-optimization/bf_stage_lane_v1.py --self-test
          python3 .github/research/continuous-optimization/ns_stage_lane_v1.py --self-test
          python3 .github/research/continuous-optimization/vad_stage_lane_v1.py --self-test
          python3 .github/research/continuous-optimization/agc_stage_lane_v1.py --self-test
          python3 .github/program/maintenance_workflow_contract.py --self-test --check
      - name: Enforce four-lane selection boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('.github/research/continuous-optimization/stage-lanes-v1.json').read_text())
          assert m['program_id']=='bf-ns-vad-agc-stage-lanes-v1'
          assert m['authority']=='RESEARCH_STAGE_SELECTION_ONLY'
          assert m['source_baseline']=={
              'main_sha':'a21ec6892c24db30796f82bc63eb5566a0e62047',
              'shipping_tag':'v2.3.16',
              'shipping_source_sha':'57e4c64adc1cf06819e46e24e275ecd746d5f17f',
              'shipping_aec_mu':0.22,
          }
          g=m['global_rules']
          assert g['selection_roles']==['development']
          assert g['reject_only_roles']==['validation','shadow']
          assert g['blind_feedback_to_selection'] is False
          assert g['product_external_feedback_to_selection'] is False
          assert g['automatic_main_mutation'] is False
          assert g['automatic_shipping_promotion'] is False
          assert g['source_candidate_authority'] is False
          lanes={x['lane_id']:x for x in m['lanes']}
          assert set(lanes)=={'bf','ns','vad','agc'}
          assert lanes['bf']['development_seeds']==[1711,1811]
          assert lanes['ns']['development_seeds']==[1721,1821]
          assert lanes['vad']['development_seeds']==[1731,1831]
          assert lanes['agc']['development_seeds']==[1741,1841]
          assert lanes['vad']['frozen_shipping_thresholds']=={'local':0.45,'ns_assisted':0.35}
          assert lanes['ns']['algorithm_variants']==['ema','mcra']
          assert lanes['bf']['next_gate']=='separate-source-candidate-review'
          assert lanes['vad']['next_gate']=='separate-source-candidate-review'
          assert lanes['agc']['next_gate']=='separate-source-candidate-review'
          assert lanes['ns']['next_gate']=='stage-composition-development'
          assert m['composition']['status']=='BLOCKED_UNTIL_ALL_LANES_HAVE_HASH_BOUND_EXECUTABLE_WINNERS'
          assert m['composition']['validation_and_shadow_reject_only'] is True
          assert all('aec' not in x['lane_id'] for x in m['lanes'])
          closure=json.loads(Path(
              '.github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6-closure.json'
          ).read_text())
          assert closure['status']=='CLOSED_TERMINAL_VISIBLE_REJECT'
          assert closure['candidate_budget']==0
          matched=json.loads(Path(
              '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-resolution-v1.json'
          ).read_text())
          assert matched['candidate_budget']==0
          assert matched['state']['hardware_execution_authorized'] is False
          print('stage lane authority contract: PASS')
          PY

  bf:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && (inputs.lane == 'bf' || inputs.lane == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      executable_bound: ${{ steps.result.outputs.executable_bound }}
      next_gate: ${{ steps.result.outputs.next_gate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-ccache
        with: {namespace: research-stage-bf}
      - name: Build exact shipping BF baseline processor
        run: |
          cmake -S . -B build-stage-bf -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-stage-bf --target ap_process_pcm --parallel
      - name: Materialize fixed BF development validation shadow corpora
        run: |
          set -euo pipefail
          for seed in 1711 1811 2711 3711; do
            python3 tests/validation/build_bf_sensitivity_sweep.py --output "/tmp/bf-sensitivity-$seed" --seed "$seed"
            python3 tests/validation/build_bf_hard_fault_sweep.py --output "/tmp/bf-hard-$seed" --seed "$seed"
          done
      - name: Run BF algorithm and parameter lane
        run: |
          python3 .github/research/continuous-optimization/bf_stage_lane_v1.py             --processor build-stage-bf/ap_process_pcm             --development-sensitivity /tmp/bf-sensitivity-1711/corpus.json             --development-sensitivity /tmp/bf-sensitivity-1811/corpus.json             --development-hard-fault /tmp/bf-hard-1711/corpus.json             --development-hard-fault /tmp/bf-hard-1811/corpus.json             --validation-sensitivity /tmp/bf-sensitivity-2711/corpus.json             --validation-hard-fault /tmp/bf-hard-2711/corpus.json             --shadow-sensitivity /tmp/bf-sensitivity-3711/corpus.json             --shadow-hard-fault /tmp/bf-hard-3711/corpus.json             --output stage-lanes-out/bf/result.json
      - name: Enforce BF non-shipping result
        id: result
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('stage-lanes-out/bf/result.json').read_text())
          assert r['authority']=='research-stage-selection-only' and r['lane_id']=='bf'
          assert r['decision'] in {'KEEP_BASELINE','REJECT_CANDIDATE','FROZEN_STAGE_RESEARCH_CANDIDATE'}
          assert r['shipping_authority'] is False and r['automatic_main_mutation'] is False
          if r['decision']=='FROZEN_STAGE_RESEARCH_CANDIDATE':
              assert r['executable_binding']['bound'] is False
              assert r['next_gate']=='separate-source-candidate-review'
          else:
              assert r['executable_binding']['bound'] is True
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"decision={r['decision']}\n")
              f.write(f"executable_bound={str(r['executable_binding']['bound']).lower()}\n")
              f.write(f"next_gate={r.get('next_gate') or 'none'}\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage-lane-bf-${{ github.run_id }}
          path: stage-lanes-out/bf/
          retention-days: 30

  ns:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && (inputs.lane == 'ns' || inputs.lane == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      executable_bound: ${{ steps.result.outputs.executable_bound }}
      next_gate: ${{ steps.result.outputs.next_gate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-ccache
        with: {namespace: research-stage-ns}
      - name: Build exact EMA and MCRA processors
        run: |
          set -euo pipefail
          cmake -S . -B build-stage-ns-ema -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON -DAP_NS_ESTIMATOR=EMA
          cmake --build build-stage-ns-ema --target ap_process_pcm --parallel
          cmake -S . -B build-stage-ns-mcra -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON -DAP_NS_ESTIMATOR=MCRA
          cmake --build build-stage-ns-mcra --target ap_process_pcm --parallel
      - name: Materialize fixed NS partitions
        run: |
          for seed in 1721 1821 2721 3721; do
            python3 validation/tools/build_ns_tuning_corpus.py --output "/tmp/ns-stage-$seed" --seed "$seed"
          done
      - name: Run exact NS algorithm then parameter lane
        run: |
          python3 .github/research/continuous-optimization/ns_stage_lane_v1.py             --repo-root .             --ema-processor build-stage-ns-ema/ap_process_pcm             --mcra-processor build-stage-ns-mcra/ap_process_pcm             --development-corpus /tmp/ns-stage-1721/corpus.json             --development-corpus /tmp/ns-stage-1821/corpus.json             --validation-corpus /tmp/ns-stage-2721/corpus.json             --shadow-corpus /tmp/ns-stage-3721/corpus.json             --policy validation/policies/validation-ns-stage-tuning.json             --dataset-lock validation/datasets.lock.json             --search-space validation/tuning/search-spaces/ns-stage-v1.json             --output-dir stage-lanes-out/ns
      - name: Enforce NS non-shipping result
        id: result
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('stage-lanes-out/ns/ns-stage-lane-result.json').read_text())
          assert r['authority']=='research-stage-selection-only' and r['lane_id']=='ns'
          assert r['decision'] in {'KEEP_BASELINE','REJECT_CANDIDATE','FROZEN_STAGE_RESEARCH_CANDIDATE'}
          assert r['executable_binding']['bound'] is True
          assert r['shipping_authority'] is False and r['automatic_main_mutation'] is False
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"decision={r['decision']}\n")
              f.write("executable_bound=true\n")
              f.write(f"next_gate={r.get('next_gate') or 'none'}\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage-lane-ns-${{ github.run_id }}
          path: stage-lanes-out/ns/
          retention-days: 30

  vad:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && (inputs.lane == 'vad' || inputs.lane == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      executable_bound: ${{ steps.result.outputs.executable_bound }}
      next_gate: ${{ steps.result.outputs.next_gate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-ccache
        with: {namespace: research-stage-vad}
      - name: Build exact probability-trace processor
        run: |
          cmake -S . -B build-stage-vad -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-stage-vad --target ap_process_pcm --parallel
      - name: Materialize fixed VAD/NS trace partitions
        run: |
          for seed in 1731 1831 2731 3731; do
            python3 validation/tools/build_stage_validation_corpus.py --output "/tmp/vad-stage-$seed" --seed "$seed" --seconds 4
          done
      - name: Run VAD policy algorithm lane
        run: |
          python3 .github/research/continuous-optimization/vad_stage_lane_v1.py             --processor build-stage-vad/ap_process_pcm             --development-corpus /tmp/vad-stage-1731/corpus.json             --development-corpus /tmp/vad-stage-1831/corpus.json             --validation-corpus /tmp/vad-stage-2731/corpus.json             --shadow-corpus /tmp/vad-stage-3731/corpus.json             --output stage-lanes-out/vad/result.json
      - name: Enforce VAD non-shipping result
        id: result
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('stage-lanes-out/vad/result.json').read_text())
          assert r['authority']=='research-stage-selection-only' and r['lane_id']=='vad'
          assert r['threshold_search_performed'] is False
          assert r['frozen_thresholds']=={'local':0.45,'ns_assisted':0.35}
          assert r['shipping_authority'] is False and r['automatic_main_mutation'] is False
          if r['decision']=='FROZEN_STAGE_RESEARCH_CANDIDATE':
              assert r['executable_binding']['bound'] is False
              assert r['next_gate']=='separate-source-candidate-review'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"decision={r['decision']}\n")
              f.write(f"executable_bound={str(r['executable_binding']['bound']).lower()}\n")
              f.write(f"next_gate={r.get('next_gate') or 'none'}\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage-lane-vad-${{ github.run_id }}
          path: stage-lanes-out/vad/
          retention-days: 30

  agc:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && (inputs.lane == 'agc' || inputs.lane == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      decision: ${{ steps.result.outputs.decision }}
      executable_bound: ${{ steps.result.outputs.executable_bound }}
      next_gate: ${{ steps.result.outputs.next_gate }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Materialize fixed AGC dynamics partitions
        run: |
          for seed in 1741 1841 2741 3741; do
            python3 tests/validation/build_agc_bf_validation_corpus.py --output "/tmp/agc-stage-$seed" --seed "$seed"
          done
      - name: Run AGC algorithm then runtime parameter lane
        run: |
          python3 .github/research/continuous-optimization/agc_stage_lane_v1.py             --development-corpus /tmp/agc-stage-1741/corpus.json             --development-corpus /tmp/agc-stage-1841/corpus.json             --validation-corpus /tmp/agc-stage-2741/corpus.json             --shadow-corpus /tmp/agc-stage-3741/corpus.json             --search-space validation/tuning/search-spaces/agc-stage-v1.json             --output stage-lanes-out/agc/result.json
      - name: Enforce AGC non-shipping result
        id: result
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('stage-lanes-out/agc/result.json').read_text())
          assert r['authority']=='research-stage-selection-only' and r['lane_id']=='agc'
          assert r['shipping_authority'] is False and r['automatic_main_mutation'] is False
          if r['decision']=='FROZEN_STAGE_RESEARCH_CANDIDATE':
              assert r['executable_binding']['bound'] is False
              assert r['next_gate']=='separate-source-candidate-review'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write(f"decision={r['decision']}\n")
              f.write(f"executable_bound={str(r['executable_binding']['bound']).lower()}\n")
              f.write(f"next_gate={r.get('next_gate') or 'none'}\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: stage-lane-agc-${{ github.run_id }}
          path: stage-lanes-out/agc/
          retention-days: 30

  composition-readiness:
    needs: [bf, ns, vad, agc]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.lane == 'all'
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate executable composition readiness
        env:
          BF_DECISION: ${{ needs.bf.outputs.decision }}
          BF_BOUND: ${{ needs.bf.outputs.executable_bound }}
          NS_DECISION: ${{ needs.ns.outputs.decision }}
          NS_BOUND: ${{ needs.ns.outputs.executable_bound }}
          VAD_DECISION: ${{ needs.vad.outputs.decision }}
          VAD_BOUND: ${{ needs.vad.outputs.executable_bound }}
          AGC_DECISION: ${{ needs.agc.outputs.decision }}
          AGC_BOUND: ${{ needs.agc.outputs.executable_bound }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import os
          lanes={}
          for name in ('BF','NS','VAD','AGC'):
              lanes[name.lower()]={'decision':os.environ[f'{name}_DECISION'],
                                   'executable_bound':os.environ[f'{name}_BOUND']=='true'}
          ready=all(x['executable_bound'] for x in lanes.values())
          print('## Stage-lane composition readiness')
          for name,row in lanes.items():
              print(f"- {name}: decision=`{row['decision']}`, executable_bound=`{row['executable_bound']}`")
          print(f"- Composition executable-ready: `{ready}`")
          if not ready:
              print('- BLOCKED: one or more emulator winners require separate source-candidate implementation/review.')
          else:
              print('- READY FOR A SEPARATE development-only composition run; validation/shadow remain reject-only.')
          print('- No composition or shipping mutation is performed by this readiness step.')
          PY
