name: V2 Hardening Docs Once

on:
  push:
    branches: [feat/v2-hard-cut-cleanup]

permissions:
  contents: write

jobs:
  sync:
    if: "${{ github.event.head_commit.message != 'docs!: close v2 SSC305 hardening contracts' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: feat/v2-hard-cut-cleanup
      - name: Synchronize v2 hardening contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def repl(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: replacement anchor count={text.count(old)} for {old[:90]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          repl('docs/API_CONTRACT.md',
               'The generated installed `audio_pipeline_build.h` is the compile-time capability source of truth. The single `ap_build_info()` API returns one complete immutable `ap_build_info_t` containing semantic version, module mask, geometry, selected AEC/NS/SIMD/resampler backends, fast-math state, source revision, compiler/target/build identity and configuration SHA-256.',
               'The generated installed `audio_pipeline_build.h` is the compile-time capability source of truth. The single `ap_build_info()` API returns one complete immutable `ap_build_info_t` containing semantic version, module mask, geometry, selected AEC/NS/SIMD/resampler backends, fast-math state, the effective BF direction-tracking capability, source revision, compiler/target/build identity and configuration SHA-256. `AP_BUILD_BF_DIRECTION_TRACKING` and `ap_build_info_t.bf_direction_tracking` report the effective compiled capability rather than requiring a product to infer it from CMake arguments.')
          repl('docs/API_CONTRACT.md',
               'AP_RUNTIME_QUEUE_DEPTH\n```',
               'AP_RUNTIME_QUEUE_DEPTH\nAP_ENABLE_BF_DIRECTION_TRACKING=ON|OFF\n```')
          repl('docs/API_CONTRACT.md',
               'A sufficiently large timestamp/correlation delay jump is treated as a route jump and resets stale AEC convergence state.',
               'Correlation-based delay updates are ambiguity-gated. Small delay/drift corrections require the winning peak to be separated from non-local competitors; a large correlation route-change candidate must remain consistent for three search epochs before it is committed and stale AEC convergence is reset. Trusted hardware timestamps and explicit application path-change notifications remain authoritative and are not delayed by the correlation confirmation policy.')
          repl('docs/API_CONTRACT.md',
               'After `ap_runtime_start()`, the worker is the sole owner of the supplied pipeline until stop/deinit.',
               'After `ap_runtime_start()`, the worker is the sole owner of the supplied pipeline until stop/deinit. If `ap_runtime_options_t.lock_memory` is enabled, the runtime performs best-effort bounded `mlock()` only on the caller-owned runtime and pipeline arenas and releases those locks on stop. The SDK never invokes process-global `mlockall()`; worker-stack prefaulting and process-wide realtime memory policy remain product responsibilities.')
          repl('docs/API_CONTRACT.md',
               'AP_ENABLE_FAST_MATH=ON|OFF\n```',
               'AP_ENABLE_FAST_MATH=ON|OFF\nAP_ENABLE_BF_DIRECTION_TRACKING=ON|OFF\n```')

          repl('docs/DIAGNOSTICS.md',
               '`ap_runtime_receive_event()` exposes fixed-size `ap_event_t` records covering runtime lifecycle, RT affinity/priority/mlock failures, queue pressure, output drops, DSP deadline misses, missing/underrun render reference, delay jumps, stream discontinuities, echo-path changes, AEC reset/convergence, ERLE collapse, pipeline failures, CPU migration observations and runtime quality transitions.',
               '`ap_runtime_receive_event()` exposes fixed-size `ap_event_t` records covering runtime lifecycle, RT affinity/priority/bounded-memory-lock failures, queue pressure, output drops, DSP deadline misses, missing/underrun render reference, delay jumps, stream discontinuities, echo-path changes, AEC reset/convergence, ERLE collapse, pipeline failures, CPU migration observations and runtime quality transitions. Stepwise overload transitions keep their dedicated event kinds; a direct multi-level downward transition such as `FULL -> SAFE` emits `AP_EVENT_QUALITY_DEGRADED`, while upward transitions emit `AP_EVENT_QUALITY_RECOVERED`.')

          repl('docs/DSP_DESIGN.md',
               'The two-mic frontend uses a low-cost delay-and-sum geometry with optional direction tracking. It is selected only for two-microphone configurations. SAFE quality bypasses tracking/beamforming work in the high-level graph.',
               'The two-mic frontend uses a low-cost delay-and-sum geometry with optional compile-time direction tracking. It is selected only for two-microphone configurations. `AP_ENABLE_BF_DIRECTION_TRACKING` controls whether adaptive tracking is physically enabled; the effective result is exported as `AP_BUILD_BF_DIRECTION_TRACKING` and in build info. SAFE quality bypasses tracking/beamforming work in the high-level graph. The conservative `ssc305-cortex-a32-low` product preset keeps fixed broadside delay/sum BF by disabling direction tracking until real render-active, motor-noise and far-field evidence justifies enabling it.')
          repl('docs/DSP_DESIGN.md',
               'The search compares **squared normalized correlation**, so candidate ranking and the acceptance threshold are equivalent to absolute normalized correlation without performing `sqrtf` for every candidate.\n\nLarge correlation jumps are emitted as route-jump events.',
               'The search compares **squared normalized correlation**, so candidate ranking and the acceptance threshold are equivalent to absolute normalized correlation without performing `sqrtf` for every candidate. Correlation updates are ambiguity-gated: small corrections require the winning peak to be separated from non-local competitors, preventing periodic playback tones from driving sample slips. Large correlation route-change candidates must remain consistent for three consecutive search epochs before they are committed.\n\nConfirmed large correlation jumps are emitted as route-jump events.')

          repl('docs/PORTING.md',
               'AP_ENABLE_FAST_MATH\n```',
               'AP_ENABLE_FAST_MATH\nAP_ENABLE_BF_DIRECTION_TRACKING\n```')
          repl('docs/PORTING.md',
               'Do not copy Cortex-A32 `-mcpu/-mfpu` flags into an A7 BSP.',
               'Do not copy Cortex-A32 `-mcpu/-mfpu` flags into an A7 BSP. `ssc305-cortex-a32-low` is the conservative SSC305 product starting profile: 16 kHz/2-mic geometry, 60 ms maximum delay, 64 ms AEC tail, runtime queue depth 4 and fixed broadside delay/sum BF. Adaptive BF direction tracking remains available in generic builds but is disabled in this preset until real render-active/motor/far-field corpus evidence supports enabling it.')
          repl('docs/PORTING.md',
               'Affinity/FIFO are optional product decisions; defaults do not assume CPU1 or realtime privilege.',
               'Affinity/FIFO are optional product decisions; defaults do not assume CPU1 or realtime privilege. `options.lock_memory=1` requests best-effort bounded locking of the caller-owned runtime and pipeline arenas only; the SDK does not call process-global `mlockall()`.')

          repl('README.md',
               'AP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD\n```',
               'AP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD\nAP_ENABLE_BF_DIRECTION_TRACKING=ON|OFF\n```')
          repl('README.md',
               '- Fast math: OFF by default.\n- Linux runtime:',
               '- Fast math: OFF by default.\n- BF direction tracking: explicit compile-time capability; the conservative `ssc305-cortex-a32-low` preset disables it and exports the effective state in build info.\n- Linux runtime:')
          repl('README.md',
               'Cross-build presets include generic ARMv7-A, Cortex-A7 scalar/NEON, Cortex-A32 NEON and AArch64 NEON.',
               'Cross-build presets include generic ARMv7-A, Cortex-A7 scalar/NEON, Cortex-A32 NEON, the conservative `ssc305-cortex-a32-low` product profile and AArch64 NEON.')

          repl('README.zh-CN.md',
               'AP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD\n```',
               'AP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD\nAP_ENABLE_BF_DIRECTION_TRACKING=ON|OFF\n```')
          repl('README.zh-CN.md',
               '- fast-math：默认关闭。\n- Linux Runtime：',
               '- fast-math：默认关闭。\n- BF direction tracking：显式编译期能力；保守的 `ssc305-cortex-a32-low` preset 默认关闭，并通过 build info 暴露最终生效状态。\n- Linux Runtime：')
          repl('README.zh-CN.md',
               'Arm presets 覆盖 generic ARMv7-A、Cortex-A7 scalar/NEON、Cortex-A32 NEON 和 AArch64 NEON。',
               'Arm presets 覆盖 generic ARMv7-A、Cortex-A7 scalar/NEON、Cortex-A32 NEON、保守的 `ssc305-cortex-a32-low` 产品配置和 AArch64 NEON。')

          repl('CHANGELOG.md',
               '- Migrate native tests, fuzz targets, benchmarks, diagnostics, installed-SDK consumers and the real ALSA/HIL runtime path to the single v2 API.\n- No DSP algorithm, acoustic threshold, resource envelope, HIL trust boundary or shipping certification threshold changes are introduced by the v2 API cleanup.',
               '- Migrate native tests, fuzz targets, benchmarks, diagnostics, installed-SDK consumers and the real ALSA/HIL runtime path to the single v2 API.\n- Harden SYNC correlation tracking against ambiguous periodic peaks and require three consistent observations before committing a large correlation-only route jump; trusted timestamps and explicit path-change notifications remain authoritative.\n- Reset all time-dependent pipeline state on declared stream discontinuity and add metamorphic coverage that the post-discontinuity algorithm state matches a fresh pipeline.\n- Replace process-global runtime `mlockall()` with best-effort bounded locking of the caller-owned runtime/pipeline arenas and expose direct multi-level quality downgrades through `AP_EVENT_QUALITY_DEGRADED`.\n- Add the conservative `ssc305-cortex-a32-low` 16 kHz/2-mic/60 ms-delay/64 ms-AEC-tail/queue-4 profile, make BF direction tracking an explicit build capability, and export its effective state through generated build info.\n- Restore v2 control-plane behavioral coverage with dedicated pipeline-control/runtime-extended tests; the integrated hardening pre-commit gate measured 92.8% source line coverage without lowering the 90% requirement.\n- No acoustic acceptance threshold, HIL trust boundary or shipping-certification threshold is relaxed by this release; real product evidence remains separate from hosted software verification.')
          PY
          git diff --check
          python3 scripts/docs_consistency.py
          sh scripts/check-architecture.sh
      - name: Commit documentation closure and remove migrator
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-hardening-docs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs!: close v2 SSC305 hardening contracts'
          git push origin HEAD:feat/v2-hard-cut-cleanup
