name: Audio Quality Gates

on:
  workflow_call:
    inputs:
      run_extended:
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: audio-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bandlimited-boundary:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: audio-bandlimited
      - name: Configure bandlimited default
        run: >-
          cmake -S . -B build-audio -DCMAKE_BUILD_TYPE=Release
          -DAP_RESAMPLER_MODE=BANDLIMITED -DAP_ENABLE_LINUX_RUNTIME=OFF
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build quality contracts
        run: cmake --build build-audio --parallel
      - name: Run resampler and acoustic-path contracts
        run: ctest --test-dir build-audio --output-on-failure -R 'ap_resampler_tests|ap_contract_tests|ap_drift_res_tests'
      - name: Verify certification evidence validator
        run: python3 certification/validate_record.py --self-test

  validation-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: validation-smoke
      - name: Validate canonical validation framework and pinned public source contract
        run: |
          python3 -m py_compile validation/tools/*.py scripts/validation_reproducer.py scripts/ci_failure.py
          python3 validation/tools/authority.py --self-test
          python3 validation/tools/dataset_lock.py self-test
          python3 validation/tools/dataset_lock.py validate --lock validation/datasets.lock.json
          python3 validation/tools/build_public_corpus.py --self-test
          python3 validation/tools/run_validation.py --self-test
          python3 validation/tools/tuning_iteration.py --self-test
          python3 scripts/validation_reproducer.py --self-test
      - name: Configure offline validation processor
        run: >-
          cmake -S . -B build-validation-smoke -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build offline validation processor
        run: cmake --build build-validation-smoke --target ap_process_pcm --parallel
      - name: Verify deterministic corpus bytes
        run: |
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-validation-1307 --seed 1307
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-validation-1307-repeat --seed 1307
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [Path('/tmp/ap-validation-1307/corpus.json'), Path('/tmp/ap-validation-1307-repeat/corpus.json')]:
              corpus = json.loads(path.read_text())
              assert corpus['generator']['name'] == 'build_validation_corpus.py'
              assert corpus['generator']['version'] == 3
              assert corpus['tier'] == 'regression'
              assert len(corpus['cases']) >= 24
          PY
          diff -u /tmp/ap-validation-1307/corpus.json /tmp/ap-validation-1307-repeat/corpus.json
          (cd /tmp/ap-validation-1307 && find cases -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/seed-1307-a.sha256
          (cd /tmp/ap-validation-1307-repeat && find cases -type f -print0 | sort -z | xargs -0 sha256sum) > /tmp/seed-1307-b.sha256
          diff -u /tmp/seed-1307-a.sha256 /tmp/seed-1307-b.sha256
      - name: Enforce deterministic regression seed matrix
        run: |
          set -euo pipefail
          for seed in 1307 2307 3307; do
            root="/tmp/ap-validation-$seed"
            if [ "$seed" != 1307 ]; then
              python3 validation/tools/build_validation_corpus.py --output "$root" --seed "$seed"
            fi
            python3 validation/tools/run_validation.py \
              --corpus "$root/corpus.json" \
              --policy validation/policies/validation-smoke.json \
              --dataset-lock validation/datasets.lock.json \
              --processor ./build-validation-smoke/ap_process_pcm \
              --output "$root/report.json" \
              --evidence-manifest "$root/evidence-manifest.json" \
              --enforce
            python3 - "$root/report.json" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          print(json.dumps({"corpus_id": report["corpus_id"], **report["summary"]}, sort_keys=True))
          assert report["tier"] == "regression"
          assert report["summary"]["cases"] >= 24
          assert report["validation_result"] == "PASS"
          PY
          done
      - name: Enforce bounded acoustic tuning iteration
        run: |
          set -euo pipefail
          python3 validation/tools/authority.py \
            --development-corpus /tmp/ap-validation-1307/corpus.json \
            --validation-corpus /tmp/ap-validation-2307/corpus.json \
            --shadow-corpus /tmp/ap-validation-3307/corpus.json
          python3 validation/tools/tuning_iteration.py \
            --processor ./build-validation-smoke/ap_process_pcm \
            --development-corpus /tmp/ap-validation-1307/corpus.json \
            --validation-corpus /tmp/ap-validation-2307/corpus.json \
            --shadow-corpus /tmp/ap-validation-3307/corpus.json \
            --policy validation/policies/validation-smoke.json \
            --dataset-lock validation/datasets.lock.json \
            --search-space validation/tuning/search-spaces/call-pr-smoke-v1.json \
            --output-dir /tmp/ap-tuning-pr
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/ap-tuning-pr/iteration-result.json').read_text())
          assert result['authority'] == 'non-shipping-acoustic-iteration'
          assert result['search_space']['candidate_count'] <= 8
          baseline_dev = next(item for item in result['development_ranking'] if item['label'] == 'baseline')
          assert baseline_dev['validation_result'] == 'PASS'
          assert result['validation']['baseline']['validation_result'] == 'PASS'
          assert result['shadow']['baseline']['validation_result'] == 'PASS'
          if result['decision'] == 'ACOUSTIC_CANDIDATE':
              assert not result['validation']['regression_violations']
              assert not result['shadow']['regression_violations']
          print(json.dumps({
              'decision': result['decision'],
              'iteration_id': result['iteration_id'],
              'selected': result['selected'],
          }, sort_keys=True))
          PY
      - name: Upload tuning iteration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: required-acoustic-tuning-${{ github.run_id }}
          path: /tmp/ap-tuning-pr/
          retention-days: 30
          if-no-files-found: warn
      - name: Package failed validation reproducer
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for seed in 1307 2307 3307; do
            root="/tmp/ap-validation-$seed"
            test -f "$root/report.json" || continue
            if python3 - "$root/report.json" <<'PY'
          import json, sys
          raise SystemExit(0 if json.load(open(sys.argv[1]))['validation_result'] != 'PASS' else 1)
          PY
            then
              found=true
              python3 scripts/ci_failure.py \
                --output "$root/failure-classification.json" validation --report "$root/report.json"
              python3 scripts/validation_reproducer.py \
                --corpus "$root/corpus.json" \
                --report "$root/report.json" \
                --destination "/tmp/ap-validation-reproducer-$seed" \
                --processor ./build-validation-smoke/ap_process_pcm
            fi
          done
          $found || exit 0
      - name: Upload failed validation reproducer
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-reproducer-${{ github.run_id }}
          path: |
            /tmp/ap-validation-reproducer-*
            /tmp/ap-validation-*/failure-classification.json
          retention-days: 30
          if-no-files-found: warn

  diagnostics-replay:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: diagnostics-replay
      - name: Configure realtime diagnostics build
        run: >-
          cmake -S . -B build-diag -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build runtime and offline processor
        run: cmake --build build-diag --parallel
      - name: Build deterministic APD fixture generator
        run: |
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror tests/generate_diag_dump.c \
            -Iinclude -Ibuild-diag/generated \
            build-diag/libaudio_pipeline_runtime.a build-diag/libaudio_pipeline.a \
            -lm -pthread -o /tmp/ap_diag_dump_fixture
      - name: Generate inspect extract and replay dump
        run: |
          /tmp/ap_diag_dump_fixture /tmp/test.apd
          python3 tools/apdump.py info /tmp/test.apd > /tmp/dump-info.json
          python3 tools/apdump.py extract /tmp/test.apd --output-dir /tmp/apd-extract
          python3 tools/apreplay.py /tmp/test.apd --processor ./build-diag/ap_process_pcm --require-bit-exact
      - name: Run runtime continuity and diagnostics contracts
        run: ctest --test-dir build-diag --output-on-failure -R 'ap_runtime_tests'

  fast-fallback:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: audio-fast-resampler
      - name: Configure explicit FAST fallback
        run: >-
          cmake -S . -B build-fast -DCMAKE_BUILD_TYPE=Release
          -DAP_RESAMPLER_MODE=FAST -DAP_ENABLE_LINUX_RUNTIME=OFF
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build and run fixed-ratio regression contracts
        run: |
          cmake --build build-fast --parallel
          ctest --test-dir build-fast --output-on-failure -R 'ap_resampler_tests|ap_contract_tests'

  timestamp-route-contract:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: audio-timestamp-route
      - name: Configure full sync/AEC graph
        run: >-
          cmake -S . -B build-sync -DCMAKE_BUILD_TYPE=Release
          -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build and validate synchronization/reset semantics
        run: |
          cmake --build build-sync --parallel
          ctest --test-dir build-sync --output-on-failure -R 'ap_contract_tests|ap_realtime_tests|ap_drift_res_tests'
