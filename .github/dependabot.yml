version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-non-major:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /lab
    schedule:
      interval: weekly
    # Lab dependency changes are release-bearing and must land with SemVer +
    # CHANGELOG. Disable ordinary version-update PRs; Dependabot security
    # updates remain independently available when repository security updates
    # are enabled and must be converted into a versioned release PR.
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
