name: Research Double-Talk Temporal Route V2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/doubletalk-temporal-route-v2.json'
      - '.github/research/continuous-optimization/doubletalk_temporal_route_v2.py'
      - '.github/workflows/research-doubletalk-temporal-route-v2.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/doubletalk-temporal-route-v2.json'
      - '.github/research/continuous-optimization/doubletalk_temporal_route_v2.py'
      - '.github/workflows/research-doubletalk-temporal-route-v2.yml'

permissions:
  contents: read

concurrency:
  group: research-doubletalk-temporal-route-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind diagnostic to exact source and research-only scope
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/'
              'doubletalk-temporal-route-v2.json'
          ).read_text())
          base = manifest['governance_base_sha']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}...HEAD'], text=True
          ).splitlines()
          allowed = {
              '.github/research/continuous-optimization/development-v3/doubletalk-temporal-route-v2.json',
              '.github/research/continuous-optimization/doubletalk_temporal_route_v2.py',
              '.github/workflows/research-doubletalk-temporal-route-v2.yml',
          }
          assert changed and set(changed) <= allowed, changed
          print({'base': base, 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                 'changed': changed})
          PY

      - name: Validate candidate-zero authority and predecessor closure
        run: |
          set -euo pipefail
          python3 -m py_compile .github/research/continuous-optimization/doubletalk_temporal_route_v2.py
          python3 .github/research/continuous-optimization/doubletalk_temporal_route_v2.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/'
              'doubletalk-temporal-route-v2.json'
          ).read_text())
          predecessor = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/'
              'doubletalk-origin-disambiguation-v1.json'
          ).read_text())
          closure = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/'
              'doubletalk-onset-admission-v1-closure.json'
          ).read_text())

          assert manifest['status'] == 'DIAGNOSTIC_ONLY'
          assert manifest['candidate_budget'] == 0
          assert manifest['governance_base_sha'] == '7654979fd2664954ba6780e5d69caa1029cf1d8f'
          pred = manifest['predecessor']
          assert pred['investigation_id'] == 'doubletalk-origin-disambiguation-v1'
          assert pred['pr'] == 230
          assert pred['fresh_main_sha'] == '7654979fd2664954ba6780e5d69caa1029cf1d8f'
          assert pred['origin_run_id'] == 35091183285
          assert pred['origin_artifact_id'] == 10444720713
          assert pred['origin_artifact_digest'] == 'sha256:f41650a2663e4b40dd52188b4255fd37289a7f41959ed7c48dfb5fe2398c4f9e'
          assert pred['verify_run_id'] == 35091183506 and pred['verify_run_number'] == 969
          assert pred['release_run_id'] == 35091576907 and pred['release_run_number'] == 954
          assert pred['fresh_main_closed'] is True
          assert predecessor['candidate_budget'] == 0
          assert predecessor['status'] == 'DIAGNOSTIC_ONLY'
          assert closure['status'] == 'CLOSED_KEEP_BASELINE'
          assert closure['candidate']['budget_remaining'] == 0
          assert closure['shipping'] == {
              'version': 'v2.3.16',
              'commit_sha': '57e4c64adc1cf06819e46e24e275ecd746d5f17f',
              'changed_by_candidate': False,
          }
          assert manifest['synthetic_temporal_probe']['selection_threshold'] is None
          assert manifest['real_temporal_crosscheck']['selection_threshold'] is None
          assert manifest['real_temporal_crosscheck']['classification_performed'] is False
          assert manifest['output_authority'] == {
              'research_diagnostic_only': True,
              'candidate_selection': False,
              'tuning': False,
              'automatic_main_mutation': False,
              'shipping': False,
              'hil': False,
              'product_certification': False,
          }
          print('temporal-route v2 candidate-zero authority: PASS')
          PY

      - name: Validate deterministic source generators
        run: |
          set -euo pipefail
          python3 -m py_compile \
            validation/tools/build_validation_corpus.py \
            validation/tools/build_aec_motion_corpus.py
          python3 validation/tools/build_aec_motion_corpus.py --self-test

      - name: Build unchanged baseline processor
        run: |
          set -euo pipefail
          cmake -S . -B build-temporal-route-v2 \
            -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF \
            -DAP_STRICT_WARNINGS=ON
          cmake --build build-temporal-route-v2 --target ap_process_pcm ap_build_info_dump --parallel
          mkdir -p doubletalk-temporal-route-v2-out/evidence
          build-temporal-route-v2/ap_build_info_dump > doubletalk-temporal-route-v2-out/build-info.txt
          sha256sum build-temporal-route-v2/ap_process_pcm > doubletalk-temporal-route-v2-out/processor.sha256

      - name: Build exposed deterministic synthetic corpora
        run: |
          set -euo pipefail
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-temporal-validation-1307 --seed 1307 --seconds 4
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-temporal-validation-1407 --seed 1407 --seconds 4
          python3 validation/tools/build_aec_motion_corpus.py --output /tmp/ap-temporal-motion-4107 --seed 4107 --seconds 4
          python3 validation/tools/build_aec_motion_corpus.py --output /tmp/ap-temporal-motion-4207 --seed 4207 --seconds 4

      - name: Materialize exact hash-bound Hosted Real AEC cross-check
        run: |
          set -euo pipefail
          rm -rf /tmp/audio-pipeline-aec-challenge
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/AEC-Challenge.git \
            /tmp/audio-pipeline-aec-challenge
          cd /tmp/audio-pipeline-aec-challenge
          git -c advice.detachedHead=false checkout --detach 6c633d0a9d2a143a0e364899b91b06f127315b18
          test "$(git rev-parse HEAD)" = "6c633d0a9d2a143a0e364899b91b06f127315b18"
          include=$(python3 - "$GITHUB_WORKSPACE/validation/hosted_aec.datasets.lock.json" <<'PY'
          import json, sys
          lock = json.load(open(sys.argv[1]))
          print(','.join(item[role]['path'] for item in lock['cases'] for role in ('mic', 'render')))
          PY
          )
          unset GIT_LFS_SKIP_SMUDGE
          git lfs pull --include="$include" --exclude=""

      - name: Run fixed-geometry temporal route diagnostic
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/doubletalk_temporal_route_v2.py \
            --processor build-temporal-route-v2/ap_process_pcm \
            --manifest .github/research/continuous-optimization/development-v3/doubletalk-temporal-route-v2.json \
            --validation-corpus /tmp/ap-temporal-validation-1307/corpus.json \
            --validation-corpus /tmp/ap-temporal-validation-1407/corpus.json \
            --motion-corpus /tmp/ap-temporal-motion-4107/corpus.json \
            --motion-corpus /tmp/ap-temporal-motion-4207/corpus.json \
            --real-lock validation/hosted_aec.datasets.lock.json \
            --real-root /tmp/audio-pipeline-aec-challenge \
            --output doubletalk-temporal-route-v2-out/evidence

      - name: Enforce evidence shape without deriving a boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path(
              'doubletalk-temporal-route-v2-out/evidence/temporal-route-result.json'
          ).read_text())
          assert result['status'] == 'DIAGNOSTIC_ONLY'
          assert result['authority'] == 'research-diagnostic-only'
          assert result['candidate_budget'] == 0
          assert result['selection_performed'] is False
          assert result['tuning_performed'] is False
          synthetic = result['synthetic']
          assert synthetic['cohort_counts'] == {
              'near_end_onset': 16,
              'echo_path_change': 2,
              'continuous_motion': 16,
              'stationary_far_control': 8,
          }
          assert len(synthetic['records']) == 42
          assert all(len(row['trajectory']['windows']) == 7 for row in synthetic['records'])
          assert all([w['relative_center_frame'] for w in row['trajectory']['windows']] ==
                     [-12, -8, -4, 0, 4, 8, 12] for row in synthetic['records'])
          moving = [row for row in synthetic['records'] if row['cohort'] == 'continuous_motion']
          stationary = [row for row in synthetic['records'] if row['cohort'] == 'stationary_far_control']
          assert all(abs(row['ground_truth']['direct_delay_delta_samples']) < 1e-9 for row in moving + stationary)
          assert all(row['ground_truth']['reflection_delay_drift_max_samples'] > 0.0 for row in moving)
          assert all(abs(row['ground_truth']['reflection_delay_drift_max_samples']) < 1e-9 for row in stationary)

          real = result['real_unlabeled_crosscheck']
          assert real['source_revision'] == '6c633d0a9d2a143a0e364899b91b06f127315b18'
          assert len(real['cases']) == 4
          assert sum(bool(row['movement']) for row in real['cases']) == 2
          assert sum(not bool(row['movement']) for row in real['cases']) == 2
          assert all(len(row['trajectory']['windows']) >= 2 for row in real['cases'])
          forbidden = {'classification', 'decision', 'selected', 'threshold'}
          for row in real['cases']:
              assert forbidden.isdisjoint(row.keys())
              assert forbidden.isdisjoint(row['trajectory'].keys())
              assert forbidden.isdisjoint(row['trajectory']['shape'].keys())

          summary = Path('doubletalk-temporal-route-v2-out/summary.md')
          with summary.open('w', encoding='utf-8') as fh:
              fh.write('## Double-talk temporal route v2\n\n')
              fh.write('- Authority: `research-diagnostic-only`\n')
              fh.write('- Candidate budget: `0`\n')
              fh.write('- Selection/tuning/classification: `false`\n')
              fh.write('- Temporal geometry: fixed; no search performed\n')
              for cohort, values in synthetic['summary'].items():
                  fh.write(f'\n### synthetic_{cohort}\n')
                  for key, value in values.items():
                      fh.write(f'- {key}: `{value}`\n')
              for group, values in real['summary'].items():
                  fh.write(f'\n### real_unlabeled_{group}\n')
                  for key, value in values.items():
                      fh.write(f'- {key}: `{value}`\n')
          print(json.dumps({
              'synthetic': synthetic['summary'],
              'real_unlabeled': real['summary'],
          }, indent=2, sort_keys=True))
          PY
          cat doubletalk-temporal-route-v2-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Seal research diagnostic evidence
        run: |
          set -euo pipefail
          cp .github/research/continuous-optimization/development-v3/doubletalk-temporal-route-v2.json \
            doubletalk-temporal-route-v2-out/manifest.json
          git rev-parse HEAD > doubletalk-temporal-route-v2-out/source-sha.txt
          sha256sum validation/hosted_aec.datasets.lock.json > doubletalk-temporal-route-v2-out/hosted-aec-lock.sha256
          find doubletalk-temporal-route-v2-out -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > doubletalk-temporal-route-v2-out/SHA256SUMS

      - name: Upload research diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doubletalk-temporal-route-v2-${{ github.run_id }}
          path: doubletalk-temporal-route-v2-out/
          if-no-files-found: error
          retention-days: 30
