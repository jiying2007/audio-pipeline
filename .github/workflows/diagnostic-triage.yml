name: Diagnostic Triage

on:
  pull_request:
    paths:
      - 'include/audio_pipeline/audio_diag.h'
      - 'include/audio_pipeline/audio_runtime.h'
      - 'include/audio_pipeline/audio_pipeline.h'
      - 'src/platform/linux/ap_runtime.c'
      - 'examples/process_pcm.c'
      - 'tools/apdump.py'
      - 'tools/apreplay.py'
      - 'tests/generate_diag_dump.c'
      - 'tests/diagnostics/**'
      - 'docs/DIAGNOSTICS.md'
      - '.github/workflows/diagnostic-triage.yml'
  push:
    branches: [main]
    paths:
      - 'include/audio_pipeline/audio_diag.h'
      - 'include/audio_pipeline/audio_runtime.h'
      - 'include/audio_pipeline/audio_pipeline.h'
      - 'src/platform/linux/ap_runtime.c'
      - 'examples/process_pcm.c'
      - 'tools/apdump.py'
      - 'tools/apreplay.py'
      - 'tests/generate_diag_dump.c'
      - 'tests/diagnostics/**'
      - 'docs/DIAGNOSTICS.md'
      - '.github/workflows/diagnostic-triage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-triage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: diagnostic-triage

      - name: Validate repository diagnostic harness
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/apdump.py \
            tools/apreplay.py \
            tests/diagnostics/aptriage.py \
            tests/diagnostics/apdiagnose.py \
            tests/diagnostics/fault_injection_contract.py
          python3 tests/diagnostics/aptriage.py --self-test
          python3 tests/diagnostics/apdiagnose.py --self-test
          python3 tests/diagnostics/apdiagnose.py \
            tests/diagnostics/fixtures/reasoning-candidate.json \
            --reference tests/diagnostics/fixtures/reasoning-reference.json \
            --output-dir /tmp/reasoning-fixture
          test -s /tmp/reasoning-fixture/diagnosis.json
          test -s /tmp/reasoning-fixture/comparison.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          diagnosis = json.loads(Path('/tmp/reasoning-fixture/diagnosis.json').read_text())
          comparison = json.loads(Path('/tmp/reasoning-fixture/comparison.json').read_text())
          assert diagnosis['recording_trigger'] is None
          assert diagnosis['first_fault']['kind'] == 'delay_jump'
          assert diagnosis['top_hypothesis']['hypothesis'] == 'sync-reference-path'
          assert diagnosis['candidate_chains'][0]['name'] == 'delay-instability-to-aec-loss'
          assert diagnosis['causal_proof'] is False
          assert 'delay_jump' in comparison['new_anomaly_kinds']
          assert comparison['summary_delta']['aec_converged_frames'] == -60
          assert comparison['comparison_geometry']['frames_equal'] is False
          assert comparison['comparison_geometry']['metrics_frames_equal'] is False
          assert comparison['raw_count_comparability']['aec_converged_frames']['directly_comparable'] is False
          assert abs(comparison['normalized_metrics']['aec_converged_ratio']['delta']) < 1e-12
          assert abs(comparison['normalized_metrics']['far_end_active_ratio']['delta']) < 1e-12
          assert comparison['warnings']
          PY

      - name: Configure diagnostics build
        run: >-
          cmake -S . -B build-diag -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON

      - name: Build runtime and offline processor
        run: cmake --build build-diag --parallel

      - name: Build deterministic APD fixture generators and identity probe
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror tests/generate_diag_dump.c \
            -Iinclude -Ibuild-diag/generated \
            build-diag/libaudio_pipeline_runtime.a build-diag/libaudio_pipeline.a \
            -lm -pthread -o /tmp/ap_diag_dump_fixture
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            tests/diagnostics/generate_fault_dump.c \
            -Iinclude -Ibuild-diag/generated \
            build-diag/libaudio_pipeline_runtime.a build-diag/libaudio_pipeline.a \
            -lm -pthread -o /tmp/ap_diag_fault_fixture
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            tests/diagnostics/build_identity_probe.c \
            -Iinclude -Ibuild-diag/generated \
            build-diag/libaudio_pipeline.a \
            -lm -o /tmp/ap_build_identity_probe
          /tmp/ap_build_identity_probe > /tmp/processor-build-info.json
          python3 -m json.tool /tmp/processor-build-info.json >/dev/null

      - name: Generate, replay, triage and diagnose APD fixture
        run: |
          set -euo pipefail
          /tmp/ap_diag_dump_fixture /tmp/test.apd
          python3 tools/apdump.py info /tmp/test.apd > /tmp/dump-info.json
          python3 tools/apdump.py extract /tmp/test.apd --output-dir /tmp/apd-extract
          python3 tools/apreplay.py /tmp/test.apd \
            --processor ./build-diag/ap_process_pcm \
            --output-pcm /tmp/replay-output.pcm \
            --require-bit-exact > /tmp/replay.json
          python3 tests/diagnostics/aptriage.py /tmp/test.apd \
            --processor ./build-diag/ap_process_pcm \
            --processor-build-info /tmp/processor-build-info.json \
            --require-build-identity-match \
            --output-dir /tmp/apd-triage \
            --require-bit-exact \
            --stage-counterfactuals
          python3 tests/diagnostics/apdiagnose.py /tmp/apd-triage/triage.json \
            --output-dir /tmp/apd-diagnosis
          test -s /tmp/apd-triage/extracted/metrics.jsonl
          test -s /tmp/apd-triage/extracted/metrics.csv
          test -s /tmp/apd-triage/analysis.json
          test -s /tmp/apd-triage/triage.json
          test -s /tmp/apd-triage/summary.md
          test -s /tmp/apd-diagnosis/diagnosis.json
          test -s /tmp/apd-diagnosis/diagnosis.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          replay = json.loads(Path('/tmp/replay.json').read_text())
          triage = json.loads(Path('/tmp/apd-triage/triage.json').read_text())
          diagnosis = json.loads(Path('/tmp/apd-diagnosis/diagnosis.json').read_text())
          assert replay['comparison']['bit_exact'] is True
          assert triage['status'] == 'PASS'
          assert triage['authority'] == 'repository-internal-diagnostic-only'
          assert triage['header']['trigger_event'] == 50
          assert triage['analysis']['summary']['metrics_frames'] == 1
          identity = triage['build_identity']
          assert identity['authority'] == 'repository-internal-build-identity-subset-only'
          assert identity['status'] == 'MATCH'
          assert identity['shared_fields_match'] is True
          assert identity['mismatches'] == []
          assert identity['shared_fields'] == ['version', 'module_mask', 'aec_backend', 'ns_estimator', 'simd_backend', 'resampler_mode']
          assert identity['require_match'] is True
          assert identity['exact_source_config_match_authoritative'] is False
          assert identity['processor_provenance']['source_revision']
          assert identity['processor_provenance']['config_digest']
          replay_authority = triage['replay_authority']
          assert replay_authority['authority'] == 'repository-internal-replay-interpretation-only'
          assert replay_authority['mode'] == 'pcm-only'
          assert replay_authority['state_replay'] is False
          assert replay_authority['runtime_metadata_state_present'] is False
          assert replay_authority['runtime_metadata_flags'] == []
          assert replay_authority['comparison_present'] is True
          assert replay_authority['bit_exact'] is True
          assert replay_authority['classification'] == 'pcm-only-replay-check'
          assert replay_authority['whole_incident_equivalence_authoritative'] is False
          assert 'bf-isolated' in triage['stage_counterfactuals']
          assert triage['stage_counterfactuals']['bf-isolated']['returncode'] == 0
          assert diagnosis['authority'] == 'repository-internal-heuristic-diagnostic-only'
          assert diagnosis['recording_trigger']['event'] == 50
          assert diagnosis['recording_trigger']['name'] == 'diag_triggered'
          assert diagnosis['recording_trigger']['source'] == 'apd-header'
          assert diagnosis['recording_trigger']['relation'] == 'recording-trigger-context-only'
          assert diagnosis['recording_trigger']['causal_proof'] is False
          assert diagnosis['first_fault'] is None
          assert diagnosis['top_hypothesis'] is None
          assert diagnosis['causal_proof'] is False
          PY

      - name: Prove build identity mismatch fails closed without changing replay
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          source = json.loads(Path('/tmp/processor-build-info.json').read_text())
          source['module_mask'] = int(source['module_mask']) ^ 1
          Path('/tmp/processor-build-info-tampered.json').write_text(
              json.dumps(source, indent=2, sort_keys=True) + '\n'
          )
          PY
          set +e
          python3 tests/diagnostics/aptriage.py /tmp/test.apd \
            --processor ./build-diag/ap_process_pcm \
            --processor-build-info /tmp/processor-build-info-tampered.json \
            --require-build-identity-match \
            --output-dir /tmp/apd-triage-identity-mismatch
          rc=$?
          set -e
          test "$rc" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          triage = json.loads(Path('/tmp/apd-triage-identity-mismatch/triage.json').read_text())
          assert triage['status'] == 'FAIL'
          assert triage['replay']['comparison']['bit_exact'] is True
          identity = triage['build_identity']
          assert identity['status'] == 'MISMATCH'
          assert identity['shared_fields_match'] is False
          assert identity['require_match'] is True
          assert identity['exact_source_config_match_authoritative'] is False
          assert len(identity['mismatches']) == 1
          assert identity['mismatches'][0]['field'] == 'module_mask'
          PY

      - name: Run real runtime fault-to-diagnosis contract
        run: |
          set -euo pipefail
          python3 tests/diagnostics/fault_injection_contract.py \
            --generator /tmp/ap_diag_fault_fixture \
            --processor ./build-diag/ap_process_pcm \
            --processor-build-info /tmp/processor-build-info.json \
            --work-dir /tmp/fault-injection
          test -s /tmp/fault-injection/fault-injection-summary.json

      - name: Run runtime continuity and diagnostics contracts
        run: ctest --test-dir build-diag --output-on-failure -R 'ap_runtime_tests'

      - name: Upload diagnostic triage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-triage-${{ github.run_id }}
          path: |
            /tmp/test.apd
            /tmp/dump-info.json
            /tmp/apd-extract/
            /tmp/replay.json
            /tmp/replay-output.pcm
            /tmp/processor-build-info.json
            /tmp/processor-build-info-tampered.json
            /tmp/apd-triage/
            /tmp/apd-triage-identity-mismatch/
            /tmp/apd-diagnosis/
            /tmp/reasoning-fixture/
            /tmp/fault-injection/
          retention-days: 30
          if-no-files-found: warn
