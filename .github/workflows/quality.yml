  frontend-spatial-effects:
    if: inputs.run_extended
    runs-on: ubuntu-24.04
    # Allow frozen source acquisition, BF/AEC+Activity and negative readback.
    # Hard ceiling remains finite; no acoustic gates or retry limits change.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Qualify admitted speech and fixed spatial weights
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user
          # Keep source acquisition + fixed spatial-weight evidence in its own
          # bounded job so hosted-runner/network variance cannot consume the
          # BF/AEC-order + Activity validation budget.
          mkdir -p fe-spatial/toolchain
          cat > fe-spatial/toolchain/arm-preflight.c <<'C'
          #include <math.h>
          #include <stdlib.h>
          int main(void) {
              volatile double x = 0.5;
              double y = sin(x);
              return isfinite(y) && y > 0.0 && y < 1.0 ? EXIT_SUCCESS : EXIT_FAILURE;
          }
          C
          dpkg-query -W gcc-arm-linux-gnueabihf libc6-dev-armhf-cross qemu-user > fe-spatial/toolchain/packages.txt
          arm-linux-gnueabihf-gcc --version > fe-spatial/toolchain/compiler.txt
          arm-linux-gnueabihf-gcc -std=c11 -O2 -Wall -Wextra -Werror \
            fe-spatial/toolchain/arm-preflight.c -lm -o fe-spatial/toolchain/arm-preflight \
            > fe-spatial/toolchain/link.log 2>&1
          arm-linux-gnueabihf-readelf -h fe-spatial/toolchain/arm-preflight > fe-spatial/toolchain/elf-header.txt
          qemu-arm -L /usr/arm-linux-gnueabihf fe-spatial/toolchain/arm-preflight \
            > fe-spatial/toolchain/execution.log 2>&1
          echo 'ARM_LINK_AND_QEMU_PASS' >> fe-spatial/toolchain/execution.log
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py --self-test
          python3 tests/validation/frontend_evolution/speech_source.py --speaker-offset 8 --output fe-spatial/source
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py \
            --source fe-spatial/source --output fe-spatial/effects --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py \
            --output fe-spatial/effects --execution-source "$GITHUB_SHA" --verify
          python3 tests/validation/frontend_evolution/speech_spatial_weights.py \
            --output fe-spatial/effects --execution-source "$GITHUB_SHA" --negative-evidence
          # Reuse the already-installed Arm/QEMU toolchain in this bounded job
          # instead of downloading it a second time in the downstream Activity job.
          python3 tests/validation/frontend_evolution/bf_aec_order.py --self-test
          python3 tests/validation/frontend_evolution/bf_aec_order.py \
            --source fe-spatial/effects/data --output fe-spatial/order --execution-source "$GITHUB_SHA" --require-arm
          python3 tests/validation/frontend_evolution/bf_aec_order.py \
            --output fe-spatial/order --execution-source "$GITHUB_SHA" --verify --require-arm
          python3 tests/validation/frontend_evolution/bf_aec_order.py \
            --output fe-spatial/order --execution-source "$GITHUB_SHA" --negative-evidence
          # Activity also builds/runs its AArch32 controls. Execute it while the
