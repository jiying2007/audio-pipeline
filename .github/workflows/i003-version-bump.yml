name: I003 exact release metadata bump

on:
  push:
    branches:
      - feat/i003-incumbent-qualified-sync
    paths:
      - '.github/workflows/i003-version-bump.yml'

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/i003-incumbent-qualified-sync
          fetch-depth: 0
      - name: Apply exact SemVer and changelog update, then remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          old = 'project(audio_pipeline VERSION 2.3.12 LANGUAGES C)'
          new = 'project(audio_pipeline VERSION 2.3.13 LANGUAGES C)'
          if text.count(old) != 1 or new in text:
              raise SystemExit('unexpected CMake version state')
          cmake.write_text(text.replace(old, new, 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          body = changelog.read_text(encoding='utf-8')
          if body.startswith('# 2.3.13\n'):
              raise SystemExit('2.3.13 changelog already present')
          prefix = '''# 2.3.13

- Implement the I003-frozen `incumbent-qualified` Sync delay selector: prefer a qualified local correlation peak within +/-64 samples of the incumbent before falling back to the existing global route search, reducing late-reflection route capture without adding state or public configuration.
- Preserve the existing three-confirmation large-route fallback and timestamp path, and add deterministic weak-direct/strong-late-reflection coverage that requires causal-route retention while still accepting a genuine 40 ms -> 80 ms route change.
- Keep the public v2 API/ABI and Sync state layout unchanged. Promotion remains gated on engineering/resource/shadow validation and fresh fixed-candidate confirmation; previously observed geometry/Hosted data stay regression-only and product qualification remains deferred by scope.

'''
          changelog.write_text(prefix + body, encoding='utf-8')

          Path('.github/workflows/i003-version-bump.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt CHANGELOG.md .github/workflows/i003-version-bump.yml
          git diff --cached --quiet && { echo 'no staged changes' >&2; exit 1; }
          git commit -m 'chore: prepare v2.3.13 release metadata'
          git push origin HEAD:feat/i003-incumbent-qualified-sync
