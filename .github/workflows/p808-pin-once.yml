name: P808 Pin One-Time

on:
  push:
    branches: [feat/v2.1.1-auto-real-closure]
    paths: [.github/workflows/p808-pin-once.yml]

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned CC-BY real clips and print immutable digests
        env:
          REV: 83b5ce8c3c8654a74fbae2d6171e11018636a5a8
        run: |
          set -euo pipefail
          mkdir p808
          base="https://raw.githubusercontent.com/microsoft/P.808/$REV"
          curl --fail --location --silent --show-error "$base/src/P808Template/assets/clips/math/math1.wav" -o p808/math1.wav
          curl --fail --location --silent --show-error "$base/src/P808Template/assets/clips/math/math2.wav" -o p808/math2.wav
          curl --fail --location --silent --show-error "$base/src/P808Template/assets/clips/environment_test/40S_female1.wav" -o p808/40S_female1.wav
          curl --fail --location --silent --show-error "$base/src/P808Template/assets/clips/environment_test/40S_male1.wav" -o p808/40S_male1.wav
          sha256sum p808/*.wav
          python3 - <<'PY'
          import hashlib, wave
          from pathlib import Path
          expected_git = {
              'math1.wav':'e3d670be723dae3687f742c4e69b25c910d95416',
              'math2.wav':'5c2d32c44f2cbc725a3759ef6c1f8deeecfa4ff6',
              '40S_female1.wav':'5066be4dd623b0edfe0176bc100cfeeb71cb1066',
              '40S_male1.wav':'9e8137fa15f3c8faa0535c4e15a334c040fabc5e',
          }
          for path in sorted(Path('p808').glob('*.wav')):
              data=path.read_bytes()
              blob=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
              assert blob == expected_git[path.name], (path, blob)
              with wave.open(str(path),'rb') as w:
                  print(f'PIN {path.name} sha256={hashlib.sha256(data).hexdigest()} git_blob={blob} channels={w.getnchannels()} rate={w.getframerate()} width={w.getsampwidth()} frames={w.getnframes()}')
          PY
