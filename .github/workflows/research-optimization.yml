name: Research Optimization

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/**'
      - 'validation/research/README.md'
      - 'validation/tools/tuning_iteration.py'
      - 'validation/tuning/**'
      - '.github/workflows/research-optimization.yml'
  workflow_dispatch:
    inputs:
      execute_bounded_search:
        description: 'Run the bounded multi-seed research search after contract checks'
        required: true
        type: boolean
        default: false
      search_space:
        description: 'Runtime-safe bounded parameter search space'
        required: true
        type: choice
        default: 'validation/tuning/search-spaces/call-pr-smoke-v1.json'
        options:
          - 'validation/tuning/search-spaces/call-pr-smoke-v1.json'
          - 'validation/tuning/search-spaces/call-v1.json'

permissions:
  contents: read

concurrency:
  group: research-optimization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: validation/tools:.github/research/continuous-optimization
      RESEARCH_REGISTRY: .github/research/continuous-optimization/dataset-registry.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate research optimization authority and tooling
        run: |
          set -euo pipefail
          python3 -m py_compile validation/tools/*.py .github/research/continuous-optimization/*.py
          python3 -m py_compile .github/research/continuous-optimization/development-v2/*.py
          python3 .github/research/continuous-optimization/development-v2/prepare.py --self-test
          python3 .github/research/continuous-optimization/development-v2/build_corpus.py --self-test
          python3 validation/tools/build_aec_motion_corpus.py --self-test
          python3 -m json.tool .github/research/continuous-optimization/development-v2/development.lock.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v2/policy.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v2/search-space.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v3/search-space.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v3/fine-aec-v4.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v3/doubletalk-case-guard-v5.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6-origin.json >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6-closure.json >/dev/null
          python3 -m json.tool "$RESEARCH_REGISTRY" >/dev/null
          python3 -m json.tool .github/research/continuous-optimization/dataset-registry.schema.json >/dev/null
          python3 validation/tools/authority.py --self-test
          python3 validation/tools/tuning_iteration.py --self-test
          python3 .github/research/continuous-optimization/research_dataset_registry.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          import research_dataset_registry as registry
          root = Path('.').resolve()
          path = root / '.github/research/continuous-optimization/dataset-registry.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          summary = registry.validate_registry(payload, root)
          print(json.dumps({'result': 'PASS', **summary}, sort_keys=True))
          PY
          python3 .github/research/continuous-optimization/failure_mining.py --self-test
          python3 .github/research/continuous-optimization/research_optimizer.py --self-test
          python3 .github/research/continuous-optimization/research_optimizer_v3.py --self-test
          python3 .github/research/continuous-optimization/research_optimizer_v5.py --self-test
      - name: Enforce blocker-aware v3 contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('.github/research/continuous-optimization/development-v3/search-space.json')
          space = json.loads(path.read_text())
          assert space['search_space_id'] == 'call-multidataset-blocker-aware-v3'
          assert space['strategy'] == 'cartesian'
          assert space['max_candidates'] == 18
          assert space['parameters'] == {
              'aec_mu': [0.22, 0.36, 0.44],
              'ns_floor': [0.08, 0.12, 0.16],
              'agc_target_dbfs': [-20.0, -18.0],
              'limiter_dbfs': [-2.0],
          }
          metrics = {item['name']: item for item in space['objective']['metrics']}
          assert metrics['median_output_render_corr_reduction']['datasets'] == [
              'synthetic-regression', 'aec-motion-regression'
          ]
          assert metrics['p10_output_render_corr_reduction']['minimum_units'] == 4
          assert metrics['min_vad_f1']['datasets'] == ['synthetic-regression']
          assert metrics['min_vad_f1']['minimum_units'] == 2
          assert all(
              'synthetic-regression' in item.get('datasets', ['synthetic-regression'])
              for item in space['objective']['metrics']
          )
          print('blocker-aware v3 search contract: PASS')
          PY
      - name: Enforce fine-AEC v4 contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          v3 = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/search-space.json'
          ).read_text())
          v4 = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/fine-aec-v4.json'
          ).read_text())
          assert v4['search_space_id'] == 'call-multidataset-fine-aec-v4'
          assert v4['strategy'] == 'cartesian'
          assert v4['max_candidates'] == 8
          assert v4['baseline'] == v3['baseline']
          assert v4['parameters'] == {
              'aec_mu': [0.22, 0.26, 0.28, 0.30],
              'ns_floor': [0.12],
              'agc_target_dbfs': [-20.0, -18.0],
              'limiter_dbfs': [-2.0],
          }
          assert v4['objective'] == v3['objective']
          print('fine-AEC v4 search contract: PASS')
          PY
      - name: Enforce double-talk case guard v5 contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          v4 = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/fine-aec-v4.json'
          ).read_text())
          v5 = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/doubletalk-case-guard-v5.json'
          ).read_text())
          assert v5['search_space_id'] == 'call-multidataset-doubletalk-case-guard-v5'
          assert v5['strategy'] == 'cartesian'
          assert v5['max_candidates'] == 8
          assert v5['baseline'] == v4['baseline']
          assert v5['parameters'] == v4['parameters']
          assert v5['objective']['minimum_improvement_score'] == v4['objective']['minimum_improvement_score']
          assert v5['objective']['metrics'] == v4['objective']['metrics']
          case_ids = [
              'aec-doubletalk',
              'stress-doubletalk-quiet',
              'stress-doubletalk-nominal',
              'stress-doubletalk-strong',
          ]
          assert v5['objective']['case_delta_gates'] == [
              {
                  'metric': 'vad_f1',
                  'stat': 'min',
                  'minimum_delta': -0.03,
                  'case_ids': case_ids,
              },
              {
                  'metric': 'vad_recall',
                  'stat': 'min',
                  'minimum_delta': -0.03,
                  'case_ids': case_ids,
              },
              {
                  'metric': 'near_si_sdr_improvement_db',
                  'stat': 'p10',
                  'minimum_delta': -0.50,
                  'case_ids': case_ids,
              },
          ]
          print('double-talk case guard v5 search contract: PASS')
          PY
          python3 - <<'PY'
          import json
          from pathlib import Path
          closure=json.loads(Path(
              '.github/research/continuous-optimization/development-v3/doubletalk-case-guard-v5-closure.json'
          ).read_text())
          assert closure['status']=='CLOSED_KEEP_BASELINE'
          assert closure['decision']=='KEEP_BASELINE'
          assert 'Do not rerun or refine' in closure['closure_rule']
          print('double-talk case guard v5 execution authority: CLOSED')
          PY
      - name: Enforce AEC boundary refinement v6 contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          v5 = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/doubletalk-case-guard-v5.json'
          ).read_text())
          v6 = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6.json'
          ).read_text())
          assert v6['search_space_id'] == 'call-multidataset-aec-boundary-refinement-v6'
          assert v6['strategy'] == 'cartesian'
          assert v6['max_candidates'] == 4
          assert v6['baseline'] == v5['baseline']
          assert v6['parameters'] == {
              'aec_mu': [0.22, 0.23, 0.25, 0.26],
              'ns_floor': [0.12],
              'agc_target_dbfs': [-20.0],
              'limiter_dbfs': [-2.0],
          }
          assert 0.24 not in v6['parameters']['aec_mu']
          assert v6['objective'] == v5['objective']
          origin = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6-origin.json'
          ).read_text())
          assert origin['authority'] == 'DEVELOPMENT_SELECTION_LINEAGE_ONLY'
          assert origin['predecessor'] == {
              'workflow': 'Research Algorithm Parameter Optimization',
              'run_id': 35301640608,
              'source_sha': '7b7b6325063c3cc503fc8a6d052199ab50eb4c24',
              'artifact_id': 10530995129,
              'artifact_name': 'research-algorithm-parameter-35301640608',
              'artifact_digest': 'sha256:94d57293b2ceea738f788c1ced866a74da7a46ec627d67b2c579059135853d70',
              'decision': 'KEEP_BASELINE',
              'status': 'NO_RESEARCH_CANDIDATE',
          }
          assert origin['selected_baseline']['algorithm_id'] == 'mdf-ema'
          assert origin['selected_baseline']['tuning'] == v6['baseline']
          boundary = origin['closest_nonterminal_boundary']
          assert boundary['tuning_candidate_id'] == '296836888950'
          assert boundary['tuning'] == {
              'aec_mu': 0.26,
              'ns_floor': 0.12,
              'agc_target_dbfs': -20.0,
              'limiter_dbfs': -2.0,
          }
          assert boundary['nonterminal_violation_count'] == 1
          assert boundary['violation']['gate'] == 'case_delta_regression'
          assert boundary['violation']['metric'] == 'vad_recall'
          assert boundary['violation']['unit'] == 'synthetic-development-1407'
          assert abs(float(boundary['violation']['actual_delta']) - (-0.051851851851851816)) < 1e-12
          assert float(boundary['violation']['minimum_delta']) == -0.03
          assert origin['terminal_exclusion'] == {
              'tuning_candidate_id': '4a6a408bf0e3',
              'aec_mu': 0.24,
              'reason': 'terminally rejected candidate; source-independent reuse is forbidden',
          }
          assert origin['next_search']['aec_mu'] == v6['parameters']['aec_mu']
          assert origin['next_search']['ns_floor'] == v6['parameters']['ns_floor']
          assert origin['next_search']['agc_target_dbfs'] == v6['parameters']['agc_target_dbfs']
          assert origin['next_search']['limiter_dbfs'] == v6['parameters']['limiter_dbfs']
          assert origin['next_search']['objective_and_gates'] == 'unchanged_from_doubletalk_case_guard_v5'
          assert origin['feedback_boundary'] == {
              'development_only': True,
              'validation_used_for_selection': False,
              'shadow_used_for_selection': False,
              'blind_used_for_selection': False,
              'product_external_used_for_selection': False,
          }
          assert origin['automatic_search_space_mutation'] is False
          assert origin['automatic_main_mutation'] is False
          assert origin['shipping_authority'] is False
          closure = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6-closure.json'
          ).read_text())
          assert closure['hypothesis_id'] == 'multidataset-aec-boundary-refinement-v6'
          assert closure['status'] == 'CLOSED_TERMINAL_VISIBLE_REJECT'
          assert closure['decision'] == 'TERMINAL_REJECT'
          assert closure['candidate_budget'] == 0
          assert closure['search_space']['path'] == (
              '.github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6.json'
          )
          assert closure['search_space']['rerun_authorized'] is False
          assert closure['research_selection']['candidate_id'] == '6f5f432da36f'
          assert closure['research_selection']['research_candidate_id'] == '2d13a2b08ce52a19'
          assert closure['authoritative_qualification']['run_id'] == 35309295432
          assert closure['authoritative_qualification']['visible_result'] == 'FAIL'
          assert closure['authoritative_qualification']['blind_result'] is None
          assert closure['authoritative_qualification']['failed_stage'] == 'visible-validation'
          assert closure['authoritative_qualification']['terminal_candidate'] is True
          assert closure['terminalization']['pr'] == 258
          assert closure['terminalization']['main_sha'] == 'b3c351e2efbf88a34769224d82d25ddff015c944'
          assert closure['terminalization']['retry_authorized'] is False
          assert closure['terminalization']['resume_authorized'] is False
          assert closure['terminalization']['new_holdout_authorized'] is False
          assert closure['feedback_boundary'] == {
              'visible_validation_is_reject_only': True,
              'visible_metrics_may_shape_future_optimizer_search': False,
              'blind_data_consumed': False,
              'blind_data_may_shape_future_optimizer_search': False,
          }
          next_step = closure['next_authorized_step']
          assert next_step['name'] == 'matched-gain-chain-factor-plan-lab-binding-v1'
          assert next_step['may_create_algorithm_candidate'] is False
          assert next_step['may_run_parameter_search'] is False
          assert next_step['may_execute_hardware'] is False
          assert next_step['candidate_budget'] == 0
          print('AEC boundary refinement v6 search contract: PASS / CLOSED')
          PY
      - name: Enforce immutable shipping and no-promotion boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          registry = json.loads(Path(os.environ['RESEARCH_REGISTRY']).read_text())
          assert registry['shipping_baseline'] == {
              'tag': 'v2.3.16',
              'source_sha': '57e4c64adc1cf06819e46e24e275ecd746d5f17f',
              'frozen': True,
          }
          assert registry['output_authority'] == {
              'candidate_status': 'FROZEN_RESEARCH_CANDIDATE',
              'next_gate': 'validation-grade-blind',
              'shipping_authority': False,
              'hil_authority': False,
              'product_certification_authority': False,
              'automatic_main_mutation': False,
          }
          rejected = {(item['candidate_id'], item['source_sha']) for item in registry['terminal_candidates']}
          assert ('4a6a408bf0e3', '73ae803047d5e7a6b54cdf58b4a28331ab0c2163') in rejected
          terminal_ids = {item['candidate_id'] for item in registry['terminal_candidates']}
          assert '4a6a408bf0e3' in terminal_ids
          assert '542ae198199b' in terminal_ids
          assert '64814f0762bd' in terminal_ids
          assert '070c825e2ed7' in terminal_ids
          public_validation = next(item for item in registry['datasets'] if item['id'] == 'public-validation')
          assert public_validation['selection_roles'] == [] and public_validation['frozen_holdout'] is True
          public_development = next(item for item in registry['datasets'] if item['id'] == 'public-development-diverse')
          assert public_development['selection_roles'] == ['development']
          assert public_development['evaluation_roles'] == [] and public_development['frozen_holdout'] is False
          assert public_development['identity_value'] == 'audio-pipeline-public-development-v2'
          motion = next(item for item in registry['datasets'] if item['id'] == 'aec-motion-regression')
          assert motion['source_kind'] == 'synthetic'
          assert motion['selection_roles'] == ['development']
          assert motion['evaluation_roles'] == []
          assert motion['frozen_holdout'] is False
          assert motion['may_promote_shipping'] is False
          product = next(item for item in registry['datasets'] if item['id'] == 'pcr02-product-external')
          assert product['selection_roles'] == [] and product['evaluation_roles'] == []
          print('research optimization authority boundary: PASS')
          PY

  bounded-search:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && inputs.execute_bounded_search
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEARCH_SPACE: ${{ inputs.search_space }}
      PYTHONPATH: validation/tools:.github/research/continuous-optimization:.github/research/continuous-optimization/development-v2
      RESEARCH_REGISTRY: .github/research/continuous-optimization/dataset-registry.json
      DEV_LOCK: .github/research/continuous-optimization/development-v2/development.lock.json
      DEV_POLICY: .github/research/continuous-optimization/development-v2/policy.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Enforce live bounded-search scope
        run: |
          set -euo pipefail
          case "$SEARCH_SPACE" in
            validation/tuning/search-spaces/call-pr-smoke-v1.json|validation/tuning/search-spaces/call-v1.json)
              ;;
            .github/research/continuous-optimization/development-v2/*|.github/research/continuous-optimization/development-v3/*)
              echo "historical development search space is closed/superseded and may not be rerun: $SEARCH_SPACE" >&2
              exit 2
              ;;
            *)
              echo "unregistered research search space: $SEARCH_SPACE" >&2
              exit 2
              ;;
          esac
      - name: Initialize development workspace
        run: |
          set -euo pipefail
          echo "DEV_ROOT=$RUNNER_TEMP/audio-pipeline-development-v2" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: research-optimization
      - name: Install public development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - name: Build exact offline tuning processor
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cmake -S . -B build-research-opt -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-research-opt --target ap_process_pcm --parallel
      - name: Build independent multi-seed partitions
        run: |
          set -euo pipefail
          for seed in 1307 1407 2307 2407 3307 3407; do
            python3 validation/tools/build_validation_corpus.py --output "/tmp/ap-research-$seed" --seed "$seed"
          done
      - name: Materialize diverse public development partitions
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/development-v2/prepare.py \
            --lock "$DEV_LOCK" --root "$DEV_ROOT" --output /tmp/development-v2-materialization.json
          for seed in 1507 1607; do
            python3 .github/research/continuous-optimization/development-v2/build_corpus.py \
              --lock "$DEV_LOCK" \
              --materialization /tmp/development-v2-materialization.json \
              --data-root "$DEV_ROOT" \
              --output "/tmp/development-v2-$seed" \
              --seed "$seed" --mix-limit 40 --noise-limit 12 --clean-limit 12
          done
      - name: Materialize exact run specification
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          search_space = os.environ['SEARCH_SPACE']
          evaluations = []
          for role, seeds in [('development', [1307, 1407]), ('validation', [2307, 2407]), ('shadow', [3307, 3407])]:
              for seed in seeds:
                  evaluations.append({
                      'evaluation_id': f'synthetic-{role}-{seed}',
                      'dataset_id': 'synthetic-regression',
                      'role': role,
                      'seed': seed,
                      'corpus': f'/tmp/ap-research-{seed}/corpus.json',
                      'dataset_lock': 'validation/datasets.lock.json',
                      'policy': 'validation/policies/validation-smoke.json',
                  })
          for seed in [1507, 1607]:
              evaluations.append({
                  'evaluation_id': f'public-development-{seed}',
                  'dataset_id': 'public-development-diverse',
                  'role': 'development',
                  'seed': seed,
                  'corpus': f'/tmp/development-v2-{seed}/corpus.json',
                  'dataset_lock': '.github/research/continuous-optimization/development-v2/development.lock.json',
                  'policy': '.github/research/continuous-optimization/development-v2/policy.json',
              })
          assert search_space in {
              'validation/tuning/search-spaces/call-pr-smoke-v1.json',
              'validation/tuning/search-spaces/call-v1.json',
          }
          hypothesis_id = 'bounded-runtime-safe-tuning'
          minimum_seeds = 4
          maximum_pareto = 16
          spec = {
              'schema_version': 1,
              'experiment_id': f"github-{os.environ['GITHUB_RUN_ID']}",
              'hypothesis_id': hypothesis_id,
              'source_sha': os.environ['GITHUB_SHA'],
              'search_space': search_space,
              'policy': {
                  'minimum_development_score': 0.05,
                  'minimum_development_unit_score': 0.0,
                  'minimum_distinct_development_seeds': minimum_seeds,
                  'maximum_pareto_candidates': maximum_pareto,
              },
              'evaluations': evaluations,
          }
          Path('/tmp/research-run.json').write_text(json.dumps(spec, indent=2, sort_keys=True) + '\n')
          PY
      - name: Run multi-seed Pareto optimization and generalization gates
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/research_optimizer_v3.py \
            --processor build-research-opt/ap_process_pcm \
            --run-spec /tmp/research-run.json \
            --registry "$RESEARCH_REGISTRY" \
            --output-dir research-optimization-out
      - name: Mine failures into advisory curriculum
        if: always()
        run: |
          set -euo pipefail
          if [ -d research-optimization-out/reports ]; then
            mapfile -d '' reports < <(find research-optimization-out/reports -type f -name '*.json' ! -name '*.evidence.json' -print0 | sort -z)
            if [ "${#reports[@]}" -gt 0 ]; then
              python3 .github/research/continuous-optimization/failure_mining.py "${reports[@]}" --output research-optimization-out/failure-curriculum.json
            fi
          fi
      - name: Enforce frozen research-only output
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('research-optimization-out/optimization-result.json').read_text())
          registry = json.loads(Path(os.environ['RESEARCH_REGISTRY']).read_text())
          terminal_ids = {item['candidate_id'] for item in registry['terminal_candidates']}
          assert result['authority'] == 'research-only-data-driven-optimization'
          assert result['decision'] in {'KEEP_BASELINE', 'REJECT_CANDIDATE', 'FREEZE_RESEARCH_CANDIDATE'}
          assert result['status'] in {'NO_RESEARCH_CANDIDATE', 'RESEARCH_CANDIDATE_REJECTED', 'FROZEN_RESEARCH_CANDIDATE'}
          assert result['selected']['candidate_id'] not in terminal_ids
          assert result['automatic_shipping_promotion'] is False
          assert result['automatic_main_mutation'] is False
          assert result['output_authority']['shipping_authority'] is False
          assert result['output_authority']['hil_authority'] is False
          assert result['output_authority']['product_certification_authority'] is False
          if result['status'] == 'FROZEN_RESEARCH_CANDIDATE':
              assert result['next_gate'] == 'validation-grade-blind'
          path = result['search_space']['path']
          assert path in {
              'validation/tuning/search-spaces/call-pr-smoke-v1.json',
              'validation/tuning/search-spaces/call-v1.json',
          }
          datasets = {item['dataset_id'] for item in result['development']['units']}
          assert {'synthetic-regression', 'public-development-diverse'} <= datasets
          assert 'aec-motion-regression' not in datasets
          print(json.dumps({
              'decision': result['decision'],
              'status': result['status'],
              'selected': result['selected']['research_candidate_id'],
              'next_gate': result['next_gate'],
          }, sort_keys=True))
          PY
      - name: Publish research optimization summary
        if: always()
        run: |
          if [ -f research-optimization-out/optimization-result.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('research-optimization-out/optimization-result.json').read_text())
          print('## Data-driven research optimization')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Status: `{r['status']}`")
          print(f"- Selected research candidate: `{r['selected']['research_candidate_id']}`")
          print(f"- Tuning ID: `{r['selected']['candidate_id']}`")
          print(f"- Development score: `{r['selected']['development_score']:.6f}`")
          print(f"- Worst development unit: `{r['selected']['worst_development_unit_score']:.6f}`")
          print(f"- Generalization gates: `{len(r['generalization_gates'])}`")
          print(f"- Gate violations: `{len(r['gate_violations'])}`")
          print('- Authority: research only. No shipping/HIL/Product Certification/main-mutation authority.')
          PY
          fi
      - name: Upload hash-bound research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-optimization-${{ github.run_id }}
          path: |
            /tmp/research-run.json
            /tmp/development-v2-materialization.json
            research-optimization-out/
          if-no-files-found: error
          retention-days: 30