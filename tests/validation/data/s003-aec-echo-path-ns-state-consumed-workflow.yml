name: Research S003 AEC Echo-Path NS State Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-echo-path-ns-state-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1-result.json'
      - 'validation/tools/aec_echo_path_ns_state_decomposition.py'
      - 'validation/tools/aec_echo_path_res_ns_confirmation.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/policies/validation-s003-echo-path-res-ns-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_echo_path_ns_state_probe.c'
      - '.github/workflows/research-s003-aec-echo-path-ns-state-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-echo-path-ns-state-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1-result.json'
      - 'validation/tools/aec_echo_path_ns_state_decomposition.py'
      - 'validation/tools/aec_echo_path_res_ns_confirmation.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/policies/validation-s003-echo-path-res-ns-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_echo_path_ns_state_probe.c'
      - '.github/workflows/research-s003-aec-echo-path-ns-state-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s003-aec-echo-path-ns-state-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-echo-ns-state

      - name: Validate candidate-zero state contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-echo-path-ns-state-decomposition-v1.json >/dev/null
          python3 -m py_compile             validation/tools/aec_echo_path_ns_state_decomposition.py             validation/tools/aec_echo_path_res_ns_confirmation.py             validation/tools/aec_recovery_rebaseline_100w50s.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_echo_path_ns_state_decomposition.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path

          c=json.loads(Path('docs/program/iterations/S003-aec-echo-path-ns-state-decomposition-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-echo-path-res-ns-recovery-extension-confirmation-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_INTERNAL_STATE_OBSERVATION_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['corpus']['fresh_seeds']==[13507,13607,13707,13807]
          assert c['corpus']['profiles']==['prefix-res','prefix-ns','default']
          assert c['measurement']['geometry_id']=='100w-50s'
          assert c['preregistered_rules']['extension_reproduction_is_applicability_condition'] is True
          assert c['preregistered_rules']['non_reproduction_is_valid_evidence'] is True
          assert c['preregistered_rules']['require_probe_output_bitwise_equivalence'] is True
          assert c['preregistered_rules']['no_state_threshold_fitting'] is True
          assert c['preregistered_rules']['no_state_family_ranking'] is True
          assert c['preregistered_rules']['no_ns_parameter_search'] is True
          assert c['authority_boundary']['may_claim_ns_root_cause'] is False
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['mechanical_result']['confirmed_seed_count']==4
          assert p['reviewed_validity']['ns_root_cause_proven'] is False
          print('S003 echo-path NS state authority: PASS')
          PY

      - name: Build fixed processors and internal-state probe
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-ns-state             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_EXPORT_COMPILE_COMMANDS=ON             -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-ns-state --target audio_pipeline --parallel

          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-ns-state/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-ns-state/libaudio_pipeline.a -lm             -o build-s003-ns-state/stage_prefix_process_pcm

          python3 - <<'PY' > /tmp/s003-ns-state-defs.txt
          import json, shlex
          from pathlib import Path

          db=json.loads(Path('build-s003-ns-state/compile_commands.json').read_text())
          matches=[
              row for row in db
              if 'audio_pipeline.dir' in row.get('command','')
              or 'audio_pipeline.dir' in ' '.join(row.get('arguments',[]))
          ]
          if not matches:
              raise SystemExit('audio_pipeline compile command not found')
          row=matches[0]
          args=row.get('arguments') or shlex.split(row['command'])
          defs=[]
          for arg in args:
              if arg.startswith('-D') and arg not in defs:
                  defs.append(arg)
          required=[
              'AP_BUILD_STAGE_AEC=1','AP_BUILD_STAGE_RES=1',
              'AP_BUILD_STAGE_NS=1','AP_BUILD_STAGE_SYNC=1',
          ]
          joined=' '.join(defs)
          for item in required:
              if item not in joined:
                  raise SystemExit(f'missing required compile define: {item}')
          print('\n'.join(defs))
          PY
          mapfile -t AP_DEFS < /tmp/s003-ns-state-defs.txt
          cc -std=c11 -Wall -Wextra -Werror             "${AP_DEFS[@]}"             -Iinclude -Isrc -Ibuild-s003-ns-state/generated             tests/validation/s003_aec_echo_path_ns_state_probe.c             build-s003-ns-state/libaudio_pipeline.a -lm             -o build-s003-ns-state/s003_aec_echo_path_ns_state_probe

      - name: Run fresh NS state observations
        run: |
          set -euo pipefail
          out=s003-aec-ns-state-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-echo-path-ns-state-decomposition-v1.json

          for seed in 13507 13607 13707 13807; do
            corpus="/tmp/s003-aec-ns-state-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            PYTHONPATH=validation/tools               python3 validation/tools/aec_echo_path_res_ns_confirmation.py build                 --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools               python3 validation/tools/stage_interaction_run.py                 --source-revision '${{ github.sha }}'                 --corpus "$corpus/corpus.json"                 --policy validation/policies/validation-s003-echo-path-res-ns-confirm.json                 --dataset-lock validation/datasets.lock.json                 --processor build-s003-ns-state/stage_prefix_process_pcm                 --output "$seed_out/canonical-report.json"                 --evidence-manifest "$seed_out/evidence-manifest.json"                 --enforce

            PYTHONPATH=validation/tools               python3 validation/tools/aec_echo_path_ns_state_decomposition.py run                 --corpus "$corpus/corpus.json"                 --report "$seed_out/canonical-report.json"                 --processor build-s003-ns-state/stage_prefix_process_pcm                 --state-probe build-s003-ns-state/s003_aec_echo_path_ns_state_probe                 --contract "$contract"                 --trace-output "$seed_out/ns-state-trace.jsonl"                 --output "$seed_out/state-receipt.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools             python3 validation/tools/aec_echo_path_ns_state_decomposition.py aggregate               --contract "$contract"               --input "$out/13507/state-receipt.json"               --input "$out/13607/state-receipt.json"               --input "$out/13707/state-receipt.json"               --input "$out/13807/state-receipt.json"               --output "$out/cross-seed-state-summary.json"

          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('s003-aec-ns-state-out/cross-seed-state-summary.json').read_text())
          assert result['probe_output_bitwise_equivalent_all_seeds'] is True
          print({
              'applicable_seed_count':result['applicable_seed_count'],
              'non_applicable_seeds':result['non_applicable_seeds'],
              'extension_ms_by_seed':result['extension_ms_by_seed'],
          })
          PY

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish NS state evidence
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-ns-state-out/cross-seed-state-summary.json').read_text())
          print('## S003 echo-path NS state decomposition')
          print('')
          print('- Authority: **candidate-zero internal-state observation only**')
          print(f"- Probe bitwise-equivalent: `{r['probe_output_bitwise_equivalent_all_seeds']}`")
          print(f"- Applicable fresh seeds: `{r['applicable_seed_count']}/4`")
          print(f"- RES→NS extension: `{r['extension_ms_by_seed']}`")
          for metric in (
              'residual_gain_mean_after',
              'noise_estimate_mean_after',
              'noise_estimate_abs_update_fraction_of_previous_sum',
              'overlap_rms_after',
              'noise_rms_dbfs',
          ):
              vals=r['boundary_state_deltas'][metric]
              if vals:
                  print(f"- {metric} NS-boundary minus RES-boundary: " +
                        ', '.join(f"`{x['seed']}={x['ns_minus_res']:.6g}`" for x in vals))
          print('- State-family ranking: **NOT_AUTHORIZED**')
          print('- NS root-cause authority: **none**')
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound state evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s003-aec-echo-path-ns-state-${{ github.run_id }}
          path: s003-aec-ns-state-out/
          if-no-files-found: error
          retention-days: 30
