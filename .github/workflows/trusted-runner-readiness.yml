name: Trusted Runner Readiness

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact source ref whose runner contract should be checked
        required: true
        default: main
        type: string
      role:
        description: Trusted self-hosted runner role
        required: true
        type: choice
        options: [audio-validation, audio-builder, audio-target, certification-archive]
      data_root:
        description: audio-validation sealed cache root
        required: false
        default: /opt/audio-validation-data
        type: string
      seal_path:
        description: audio-validation dataset seal
        required: false
        default: /opt/audio-validation-data/datasets.seal.json
        type: string
      dns_data_root:
        description: Optional Full-validation DNS materialization root
        required: false
        default: ''
        type: string
      shipping_cc:
        description: audio-builder exact shipping compiler
        required: false
        default: ''
        type: string
      shipping_sysroot:
        description: audio-builder exact shipping sysroot
        required: false
        default: ''
        type: string
      shipping_toolchain_root:
        description: audio-builder exact toolchain root
        required: false
        default: ''
        type: string
      board_manifest:
        description: audio-target board manifest when available
        required: false
        default: /etc/audio-pipeline/board.json
        type: string
      corpus_manifest:
        description: Optional real product corpus manifest on audio-target
        required: false
        default: ''
        type: string
      acoustic_json:
        description: Optional real product acoustic result JSON on audio-target
        required: false
        default: ''
        type: string
      farend_file:
        description: Optional real far-end PCM on audio-target
        required: false
        default: ''
        type: string
      power_input:
        description: Optional live power-sensor path on audio-target
        required: false
        default: ''
        type: string
      archive_command:
        description: certification-archive immutable backend command
        required: false
        default: /usr/local/bin/audio-pipeline-cert-archive
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-runner-readiness-${{ inputs.role }}
  cancel-in-progress: false

jobs:
  validation:
    if: inputs.role == 'audio-validation'
    runs-on: [self-hosted, linux, audio-validation]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check audio-validation readiness
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          SEAL: ${{ inputs.seal_path }}
          DNS_ROOT: ${{ inputs.dns_data_root }}
        run: |
          set -euo pipefail
          args=(
            --role audio-validation
            --data-root "$DATA_ROOT" --seal "$SEAL"
            --writable-path "$GITHUB_WORKSPACE"
            --output runner-readiness.json
          )
          if [ -n "$DNS_ROOT" ]; then args+=(--dns-data-root "$DNS_ROOT"); fi
          python3 tools/runner_preflight.py "${args[@]}"
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-audio-validation-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90

  builder:
    if: inputs.role == 'audio-builder'
    runs-on: [self-hosted, linux, audio-builder]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check audio-builder readiness
        env:
          CC: ${{ inputs.shipping_cc }}
          SYSROOT: ${{ inputs.shipping_sysroot }}
          TOOLCHAIN_ROOT: ${{ inputs.shipping_toolchain_root }}
        run: |
          set -euo pipefail
          python3 tools/runner_preflight.py \
            --role audio-builder \
            --shipping-cc "$CC" \
            --shipping-sysroot "$SYSROOT" \
            --shipping-toolchain-root "$TOOLCHAIN_ROOT" \
            --writable-path "$GITHUB_WORKSPACE" \
            --output runner-readiness.json
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-audio-builder-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90

  target:
    if: inputs.role == 'audio-target'
    runs-on: [self-hosted, linux, audio-target]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check audio-target readiness
        env:
          BOARD: ${{ inputs.board_manifest }}
          CORPUS: ${{ inputs.corpus_manifest }}
          ACOUSTIC: ${{ inputs.acoustic_json }}
          FAREND: ${{ inputs.farend_file }}
          POWER: ${{ inputs.power_input }}
        run: |
          set -euo pipefail
          args=(--role audio-target --writable-path /tmp --output runner-readiness.json)
          if [ -n "$BOARD" ]; then args+=(--board-manifest "$BOARD"); fi
          if [ -n "$CORPUS" ]; then args+=(--corpus-manifest "$CORPUS"); fi
          if [ -n "$ACOUSTIC" ]; then args+=(--acoustic-json "$ACOUSTIC"); fi
          if [ -n "$FAREND" ]; then args+=(--farend-file "$FAREND"); fi
          if [ -n "$POWER" ]; then args+=(--power-input "$POWER"); fi
          python3 tools/runner_preflight.py "${args[@]}"
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-audio-target-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90

  archive:
    if: inputs.role == 'certification-archive'
    runs-on: [self-hosted, linux, certification-archive]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check certification-archive readiness
        env:
          ARCHIVE_COMMAND: ${{ inputs.archive_command }}
        run: |
          set -euo pipefail
          python3 tools/runner_preflight.py \
            --role certification-archive \
            --archive-command "$ARCHIVE_COMMAND" \
            --writable-path "$GITHUB_WORKSPACE" \
            --output runner-readiness.json
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-certification-archive-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90
