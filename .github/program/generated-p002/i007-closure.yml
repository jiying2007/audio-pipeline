name: I007 Closure

on:
  pull_request:
    paths:
      - 'docs/program/iterations/I007-closure.json'

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PROGRAM_BASE: af9601b7805c8543feddc34c71a555c8abc6b672
      SHIPPING_SHA: d82cb6d2be76497d1d66dd16da00924411207046
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate exact closure delta and committed program
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool docs/program/iterations/I007-closure.json >/dev/null
          python3 scripts/program.py --self-test
          python3 scripts/program.py check >/dev/null
          changed="$(git diff --name-only "$PROGRAM_BASE"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(docs/program/plan\.json|docs/program/iterations/I007-closure\.json|scripts/program\.py|\.github/workflows/i007-closure\.yml)$'
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 4
          test "${{ github.event.pull_request.base.sha }}" = "$PROGRAM_BASE"

      - name: Validate terminal I007 contract and shipping boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/I007-closure.json').read_text())
          p=json.loads(Path('docs/program/plan.json').read_text())
          i007=next(t for t in p['tasks'] if t['id']=='I007')
          assert c['schema_version']==1 and c['iteration_id']=='I007'
          assert c['state']=='CLOSED_KEEP_BASELINE' and c['lane']=='acoustic'
          assert c['root_cause_id']=='bf-soft-health-wind-reverb-admission-selection'
          assert c['closed_from_main_sha']=='af9601b7805c8543feddc34c71a555c8abc6b672'
          assert c['shipping_baseline']=={
              'release':'v2.3.12',
              'source_sha':'d82cb6d2be76497d1d66dd16da00924411207046',
              'unchanged':True,
          }
          r=c['root_cause']
          assert r['run_id']==34028010442 and r['artifact_id']==9987677794
          assert r['artifact_digest']=='sha256:38a6b4838d212b1ebbf46548715e3e918cf04ecd9edd0aa92ab473e1abb2d9a9'
          assert r['internal_sha256s_verified']==343 and r['partitions']==24
          assert r['explained']==24 and r['unexplained']==0
          assert r['candidate_limit_consumed']==0 and r['confirmation_limit_consumed']==0
          w=c['bounded_candidates']['wind']
          assert w['candidate_id']=='wind-roughness-directed-hard-selection-v1'
          assert w['pr']==113 and w['pr_closed'] is True and w['pr_merged'] is False
          assert w['head_sha']=='bf62bbbeca353cf54c2075eb806bbf07fabac7b8'
          assert w['run_id']==34028699391 and w['artifact_id']==9987898553
          assert w['artifact_digest']=='sha256:eba06e39e49a2a4620f59decfed6e0dbddb40869eae0f853a55d0bcc87a1d1aa'
          assert w['internal_sha256s_verified']==288 and w['candidate_limit']==w['candidate_limit_consumed']==1
          assert w['confirmation_limit_consumed']==0 and w['decision']=='KEEP_BASELINE_CANDIDATE_REJECTED'
          assert w['base_gate_failure_partitions']==24 and w['candidate_gate_failure_partitions']==19
          assert w['target_failed_partitions']==7 and w['hard_fault_regression_result']=='FAIL'
          v=c['bounded_candidates']['reverb']
          assert v['candidate_id']=='reverb-equal-energy-decorrelated-single-v1'
          assert v['pr']==114 and v['pr_closed'] is True and v['pr_merged'] is False
          assert v['head_sha']=='6dba87f2f35e20fac4203e4f99c816ae8147bab4'
          assert v['run_id']==34028778900 and v['artifact_id']==9987923038
          assert v['artifact_digest']=='sha256:5e6702fb6312a1ce3daa32e8e67fa6f7e170d7b4acf35974e3b36c2585ff0234'
          assert v['internal_sha256s_verified']==288 and v['candidate_limit']==v['candidate_limit_consumed']==1
          assert v['confirmation_limit_consumed']==0 and v['decision']=='KEEP_BASELINE_CANDIDATE_REJECTED'
          assert v['base_gate_failure_partitions']==24 and v['candidate_gate_failure_partitions']==12
          assert v['target_failed_partitions']==0 and v['non_target_regressions']==2
          assert v['hard_fault_regression_result']=='FAIL'
          assert c['closure_decision']=={
              'allow_combined_wind_reverb_candidate':False,
              'allow_second_reverb_candidate':False,
              'allow_second_wind_candidate':False,
              'consume_confirmation':False,
              'create_release':False,
              'future_I007_candidate_requires_new_root_cause_and_budget_decision':True,
              'keep_baseline':True,
              'merge_shipping_candidate':False,
          }
          assert c['authority_boundary']=={
              'dut_hil':'DEFERRED_BY_SCOPE','hardware_collection':False,
              'product_qualification':'DEFERRED_BY_SCOPE','release_created':False,
              'shipping_source_changed':False,'software_candidate_promoted':False,
          }
          assert i007['status']=='CLOSED' and i007['handler'] is None
          assert i007['contract']=='docs/program/iterations/I007-closure.json'
          assert len(i007['evidence'])==3
          assert p['baseline']['software_release']=='v2.3.12'
          assert p['baseline']['source_sha']=='d82cb6d2be76497d1d66dd16da00924411207046'
          assert p['product_qualification']=='DEFERRED_BY_SCOPE'
          PY
          git cat-file -e "$SHIPPING_SHA^{commit}"
          git cat-file -e "$PROGRAM_BASE^{commit}"
          git diff --quiet "$SHIPPING_SHA" "$PROGRAM_BASE" -- src include CMakeLists.txt

      - name: Verify rejected PR facts from GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']
          def get(url):
              req=urllib.request.Request(url, headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          for number, head in [
              (113,'bf62bbbeca353cf54c2075eb806bbf07fabac7b8'),
              (114,'6dba87f2f35e20fac4203e4f99c816ae8147bab4'),
          ]:
              pr=get(f'https://api.github.com/repos/jiying2007/audio-pipeline/pulls/{number}')
              assert pr['state']=='closed' and pr['merged_at'] is None
              assert pr['head']['sha']==head
          PY

      - name: Reverify frozen root-cause and candidate artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifact-check
          mkdir -p artifact-check
          verify_artifact() {
            id="$1"; digest="$2"; prefix="$3"; count="$4"; name="$5"
            mkdir -p "artifact-check/$name/unpacked" "artifact-check/$name/checkroot/$prefix"
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" \
              -o "artifact-check/$name.zip"
            echo "$digest  artifact-check/$name.zip" | sha256sum -c -
            unzip -q "artifact-check/$name.zip" -d "artifact-check/$name/unpacked"
            cp -a "artifact-check/$name/unpacked/." "artifact-check/$name/checkroot/$prefix/"
            sums="artifact-check/$name/checkroot/$prefix/SHA256SUMS"
            test -f "$sums"
            (cd "artifact-check/$name/checkroot" && sha256sum -c "$prefix/SHA256SUMS" >"/tmp/$name-sha.log")
            test "$(wc -l <"/tmp/$name-sha.log")" -eq "$count"
          }
          verify_artifact 9987677794 38a6b4838d212b1ebbf46548715e3e918cf04ecd9edd0aa92ab473e1abb2d9a9 exact-base/i007-bf-root-cause-evidence 343 root-cause
          verify_artifact 9987898553 eba06e39e49a2a4620f59decfed6e0dbddb40869eae0f853a55d0bcc87a1d1aa candidate-evidence 288 wind
          verify_artifact 9987923038 5e6702fb6312a1ce3daa32e8e67fa6f7e170d7b4acf35974e3b36c2585ff0234 candidate-evidence 288 reverb

      - name: Publish terminal closure summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## I007 terminal closure
          - State: `CLOSED_KEEP_BASELINE`
          - Root cause: `24/24` explained; artifact reverified `343/343`.
          - Wind candidate: rejected; artifact reverified `288/288`; PR #113 closed/unmerged.
          - Reverb candidate: rejected; artifact reverified `288/288`; PR #114 closed/unmerged.
          - Candidate budgets: wind `1/1`, reverb `1/1`; confirmation `0`.
          - Combined/second candidate authority: `false`.
          - Shipping: `v2.3.12` unchanged; release: `false`.
          - Product Qualification / DUT-HIL: `DEFERRED_BY_SCOPE`.
          EOF
