name: I005 VAD Candidate-Zero Baseline

on:
  pull_request:
    paths:
      - 'docs/program/iterations/I005-baseline.json'
      - 'docs/program/iterations/I005-baseline-result.json'
      - 'tests/validation/i005_vad_baseline_measurement.py'
      - '.github/workflows/i005-vad-baseline.yml'

permissions:
  contents: read

concurrency:
  group: i005-vad-baseline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: fec515eb759fb62ef61b44cb86fc83cbb1fbbffb
      PYTHONPATH: validation/tools:tests/validation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate frozen measurement contract and research-only scope
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i005_vad_baseline_measurement.py
          python3 tests/validation/i005_vad_baseline_measurement.py --self-test
          python3 -m json.tool docs/program/iterations/I005-baseline.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/program/iterations/I005-baseline.json').read_text())
          assert c['schema_version'] == 1 and c['iteration_id'] == 'I005'
          assert c['phase'] == 'baseline-measurement'
          assert c['root_cause_id'] == 'vad-event-onset-release-baseline'
          assert c['base_sha'] == 'fec515eb759fb62ef61b44cb86fc83cbb1fbbffb'
          assert c['candidate_limit'] == 0 and c['confirmation_limit'] == 0
          assert c['promotion_allowed'] is False
          assert c['shipping_profile'] == 'ns-isolated'
          assert c['diagnostic_profile'] == 'vad-isolated'
          assert c['public_source']['meeting'] == 'ES2005b'
          assert c['public_source']['role'] == 'development-exposed'
          assert c['synthetic_farfield']['seeds'] == [15107, 25107, 35107]
          assert all(value is False for value in c['authority'].values())
          assert c['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY
          changed="$(git diff --name-only "$BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          allowed='^(\.github/workflows/i005-vad-baseline\.yml|docs/program/iterations/I005-baseline\.json|docs/program/iterations/I005-baseline-result\.json|tests/validation/i005_vad_baseline_measurement\.py)$'
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          test -z "$unexpected"
          count="$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)"
          test "$count" -eq 3 -o "$count" -eq 4
          printf '%s\n' "$changed" | grep -Fx 'docs/program/iterations/I005-baseline.json'
          printf '%s\n' "$changed" | grep -Fx 'tests/validation/i005_vad_baseline_measurement.py'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/i005-vad-baseline.yml'
          if test -f docs/program/iterations/I005-baseline-result.json; then
            echo 'sealed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'sealed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Validate terminal sealed result without re-executing measurement
        if: steps.contract.outputs.sealed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          r = json.loads(Path('docs/program/iterations/I005-baseline-result.json').read_text())
          assert r['schema_version'] == 1 and r['iteration_id'] == 'I005'
          assert r['phase'] == 'baseline-measurement-reviewed'
          assert r['root_cause_id'] == 'vad-event-onset-release-baseline'
          assert r['source_sha'] == 'fec515eb759fb62ef61b44cb86fc83cbb1fbbffb'
          assert r['decision'] in {
              'BASELINE_ADEQUATE_NO_SEARCH',
              'MEASURED_GAP_REVIEW_REQUIRED',
              'INPUT_OR_LABEL_INVALID_REVIEW_REQUIRED',
          }
          assert r['candidate_limit_consumed'] == 0
          assert r['confirmation_limit_consumed'] == 0
          assert r['candidate_decision'] == 'NOT_AN_ACOUSTIC_CANDIDATE'
          assert r['threshold_tuning_performed'] is False
          assert r['hangover_tuning_performed'] is False
          assert r['candidate_search_performed'] is False
          assert r['promotion_allowed'] is False
          a = r['authoritative_execution']
          assert isinstance(a['workflow_run_id'], int) and a['workflow_run_id'] > 0
          assert isinstance(a['artifact_id'], int) and a['artifact_id'] > 0
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', a['artifact_digest'])
          assert a['internal_sha256s_verified'] > 0
          assert r['public_source']['meeting'] == 'ES2005b'
          assert r['public_source']['role'] == 'development-exposed'
          assert r['public_source']['future_independent_confirmation'] is False
          assert r['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY
          rm -rf i005-vad-baseline-evidence
          mkdir -p i005-vad-baseline-evidence
          cp docs/program/iterations/I005-baseline-result.json i005-vad-baseline-evidence/committed-result.json
          printf '%s\n' 'SEALED_REVIEW_REPLAY_NO_BASELINE_EXECUTION' > i005-vad-baseline-evidence/replay-mode.txt
          find i005-vad-baseline-evidence -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > i005-vad-baseline-evidence/SHA256SUMS

      - name: Prepare exact-base detached worktree
        if: steps.contract.outputs.sealed == 'false'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exact-base
          git worktree add --detach exact-base "$BASE_SHA"
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"
          mkdir -p exact-base/docs/program/iterations exact-base/tests/validation
          cp docs/program/iterations/I005-baseline.json exact-base/docs/program/iterations/I005-baseline.json
          cp tests/validation/i005_vad_baseline_measurement.py exact-base/tests/validation/i005_vad_baseline_measurement.py
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"

      - name: Build exact shipping baseline processor
        if: steps.contract.outputs.sealed == 'false'
        working-directory: exact-base
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/i005_vad_baseline_measurement.py --self-test
          cmake -S . -B build-i005-baseline \
            -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF \
            -DAP_STRICT_WARNINGS=ON
          cmake --build build-i005-baseline --target ap_process_pcm --parallel

      - name: Execute candidate-zero public plus far-field baseline
        if: steps.contract.outputs.sealed == 'false'
        working-directory: exact-base
        shell: bash
        run: |
          set -euo pipefail
          rm -rf i005-vad-baseline-evidence
          PYTHONPATH=validation/tools:tests/validation \
          python3 tests/validation/i005_vad_baseline_measurement.py \
            --contract docs/program/iterations/I005-baseline.json \
            --processor build-i005-baseline/ap_process_pcm \
            --output i005-vad-baseline-evidence \
            | tee i005-vad-baseline-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('i005-vad-baseline-evidence/baseline-result.json').read_text())
          assert r['schema_version'] == 1 and r['iteration_id'] == 'I005'
          assert r['source_sha'] == 'fec515eb759fb62ef61b44cb86fc83cbb1fbbffb'
          assert r['authority'] == 'candidate-zero-development-baseline-only'
          assert r['candidate_limit'] == 0 and r['confirmation_limit'] == 0
          assert r['threshold_tuning_performed'] is False
          assert r['hangover_tuning_performed'] is False
          assert r['candidate_search_performed'] is False
          assert r['promotion_allowed'] is False
          assert r['candidate_decision'] == 'NOT_AN_ACOUSTIC_CANDIDATE'
          assert r['decision'] in {
              'BASELINE_ADEQUATE_NO_SEARCH',
              'MEASURED_GAP_REVIEW_REQUIRED',
              'INPUT_OR_LABEL_INVALID_REVIEW_REQUIRED',
          }
          assert r['product_qualification'] == 'DEFERRED_BY_SCOPE'
          pub = r['public_source']['aggregate']
          syn = r['synthetic_farfield']['aggregate']
          assert set(pub) == {'ns-isolated', 'vad-isolated'}
          assert set(syn) == {'ns-isolated', 'vad-isolated'}
          assert len(r['public_source']['materialized_windows']) == 3
          assert len(r['synthetic_farfield']['cases']) == 9
          PY
          cp ../docs/program/iterations/I005-baseline.json i005-vad-baseline-evidence/contract.json
          cp ../tests/validation/i005_vad_baseline_measurement.py i005-vad-baseline-evidence/evaluator.py
          printf '%s\n' "$BASE_SHA" > i005-vad-baseline-evidence/base-sha.txt
          git -C .. rev-parse HEAD > i005-vad-baseline-evidence/research-head.txt
          cp i005-vad-baseline-summary.json i005-vad-baseline-evidence/execution-summary.json
          find i005-vad-baseline-evidence -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > i005-vad-baseline-evidence/SHA256SUMS

      - name: Publish I005 baseline summary
        if: always()
        shell: bash
        run: |
          result='exact-base/i005-vad-baseline-evidence/baseline-result.json'
          if test -f "$result"; then
            RESULT="$result" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT']).read_text())
          shipping = 'ns-isolated'
          local = 'vad-isolated'
          real = r['public_source']['aggregate'][shipping]
          syn = r['synthetic_farfield']['aggregate'][shipping]
          print('## I005 candidate-zero VAD baseline')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Gate failures: `{len(r['gate_failures'])}`")
          print(f"- ES2005b frame F1 / recall / FPR: `{real['frame']['f1']:.4f}` / `{real['frame']['recall']:.4f}` / `{real['frame']['false_positive_rate']:.4f}`")
          print(f"- ES2005b event recall: `{real['event']['event_recall']:.4f}`")
          print(f"- Synthetic frame F1 / recall / FPR: `{syn['frame']['f1']:.4f}` / `{syn['frame']['recall']:.4f}` / `{syn['frame']['false_positive_rate']:.4f}`")
          print(f"- Synthetic event recall: `{syn['event']['event_recall']:.4f}`")
          print(f"- Synthetic onset p95: `{syn['event']['onset_delay_p95_ms']}` ms")
          print(f"- Synthetic release p95: `{syn['event']['release_tail_p95_ms']}` ms")
          print(f"- NS-minus-local real event recall: `{r['evidence_path_diagnostic']['real_ns_minus_local_event_recall']:+.4f}`")
          print('- Candidate/confirmation budget consumed: `0/0`.')
          print('- ES2005b is exposed Development and cannot become future independent confirmation.')
          print('- Product qualification: `DEFERRED_BY_SCOPE`.')
          PY
          elif test -f i005-vad-baseline-evidence/committed-result.json; then
            echo '## I005 candidate-zero VAD baseline' >> "$GITHUB_STEP_SUMMARY"
            echo '- Terminal mode: `SEALED_REVIEW_REPLAY_NO_BASELINE_EXECUTION`' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sealed I005 baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i005-vad-baseline-${{ github.run_id }}
          path: |
            exact-base/i005-vad-baseline-evidence/
            i005-vad-baseline-evidence/
          retention-days: 90
          if-no-files-found: error
