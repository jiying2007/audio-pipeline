name: Acoustic Tuning Search

on:
  workflow_dispatch:
    inputs:
      search_space:
        description: CALL tuning search space
        required: true
        default: call-v1.json
        type: choice
        options:
          - call-v1.json
          - call-interaction-v1.json
          - call-interaction-3d-v1.json
          - call-aec-limiter-v1.json

permissions:
  contents: read

concurrency:
  group: acoustic-tuning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iterate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEARCH_SPACE: validation/tuning/search-spaces/${{ inputs.search_space }}
      EXPECTED_MAX_CANDIDATES: '32'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: acoustic-tuning-search
      - name: Validate iteration and authority contracts
        run: |
          set -euo pipefail
          python3 -m py_compile validation/tools/*.py
          python3 validation/tools/authority.py --self-test
          python3 validation/tools/tuning_iteration.py --self-test
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'validation/tools')
          import tuning_iteration_engine as engine
          spaces_dir = Path('validation/tuning/search-spaces')
          # Every space on disk is validated with the engine's own validator. A space
          # nobody remembered to list below is therefore still validated instead of
          # silently skipped, which is what a hand-written enumeration used to do.
          # Every call-* space is pinned to its strategy (including call-pr-smoke-v1,
          # which the PR smoke workflow exercises rather than this one), and a new
          # call-* space fails closed until it is listed here. The space actually
          # dispatched must itself be a pinned name, so adding a dropdown option
          # without pinning it fails closed too. AGC/limiter level-changing
          # paired frontier work belongs in Audio Quality Evaluation, where
          # near_projection_gain_db makes target-level preservation explicit.
          expected_strategy = {
              'call-pr-smoke-v1.json': 'one-at-a-time',
              'call-v1.json': 'one-at-a-time',
              'call-interaction-v1.json': 'cartesian',
              'call-interaction-3d-v1.json': 'cartesian',
              'call-aec-limiter-v1.json': 'cartesian',
          }
          call_spaces = {p.name for p in spaces_dir.glob('call-*.json')}
          assert call_spaces == set(expected_strategy), (call_spaces, set(expected_strategy))
          for path in sorted(spaces_dir.glob('*.json')):
              space = json.loads(path.read_text())
              assert space['schema_version'] == 1
              assert set(space['baseline']) == {'aec_mu', 'ns_floor', 'agc_target_dbfs', 'limiter_dbfs'}
              engine.validate_search_space(space)
              # Validation probes ordinary axes against the baseline and validates
              # complete paired tuples for paired strategy. Materialise every
              # committed space here too so cross-product/paired tuning constraints
              # and each space's max_candidates fail at the gate.
              engine.generate_candidates(space)
          for name, strategy in expected_strategy.items():
              space = json.loads((spaces_dir / name).read_text())
              assert space['strategy'] == strategy, (name, space['strategy'], strategy)
          selected_name = Path(os.environ['SEARCH_SPACE']).name
          assert selected_name in expected_strategy, (selected_name, sorted(expected_strategy))
          selected = json.loads(Path(os.environ['SEARCH_SPACE']).read_text())
          assert selected['max_candidates'] <= int(os.environ['EXPECTED_MAX_CANDIDATES'])
          PY
      - name: Configure offline tuning processor
        run: >-
          cmake -S . -B build-tuning -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build offline tuning processor
        run: cmake --build build-tuning --target ap_process_pcm --parallel
      - name: Build independent deterministic partitions
        run: |
          set -euo pipefail
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-tuning-1307 --seed 1307
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-tuning-2307 --seed 2307
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-tuning-3307 --seed 3307
          python3 validation/tools/authority.py \
            --development-corpus /tmp/ap-tuning-1307/corpus.json \
            --validation-corpus /tmp/ap-tuning-2307/corpus.json \
            --shadow-corpus /tmp/ap-tuning-3307/corpus.json
      - name: Enforce canonical baseline partitions
        run: |
          set -euo pipefail

          validate_partition() {
            seed=$1
            root="/tmp/ap-tuning-$seed"
            python3 validation/tools/run_validation.py \
              --corpus "$root/corpus.json" \
              --policy validation/policies/validation-smoke.json \
              --dataset-lock validation/datasets.lock.json \
              --processor build-tuning/ap_process_pcm \
              --output "$root/baseline-report.json" \
              --evidence-manifest "$root/baseline-evidence.json" \
              --enforce
          }

          validate_partition 1307 > /tmp/ap-tuning-1307.baseline.log 2>&1 &
          pid_1307=$!
          validate_partition 2307 > /tmp/ap-tuning-2307.baseline.log 2>&1 &
          pid_2307=$!

          status=0
          if ! wait "$pid_1307"; then status=1; fi
          if ! wait "$pid_2307"; then status=1; fi
          if ! validate_partition 3307 > /tmp/ap-tuning-3307.baseline.log 2>&1; then status=1; fi

          for seed in 1307 2307 3307; do
            echo "===== baseline partition $seed ====="
            cat "/tmp/ap-tuning-$seed.baseline.log"
          done
          test "$status" -eq 0

      - name: Search development and replay validation plus shadow
        run: |
          set -euo pipefail
          python3 validation/tools/tuning_iteration.py \
            --processor build-tuning/ap_process_pcm \
            --development-corpus /tmp/ap-tuning-1307/corpus.json \
            --validation-corpus /tmp/ap-tuning-2307/corpus.json \
            --shadow-corpus /tmp/ap-tuning-3307/corpus.json \
            --policy validation/policies/validation-smoke.json \
            --dataset-lock validation/datasets.lock.json \
            --search-space "$SEARCH_SPACE" \
            --candidate-jobs 2 \
            --holdout-jobs 2 \
            --baseline-development-report /tmp/ap-tuning-1307/baseline-report.json \
            --baseline-validation-report /tmp/ap-tuning-2307/baseline-report.json \
            --baseline-shadow-report /tmp/ap-tuning-3307/baseline-report.json \
            --output-dir tuning-out
      - name: Enforce baseline health and evidence authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('tuning-out/iteration-result.json').read_text())
          assert result['authority'] == 'non-shipping-acoustic-iteration'
          assert result['decision'] in {'KEEP_BASELINE', 'REJECT_CANDIDATE', 'ACOUSTIC_CANDIDATE'}
          assert result['search_space']['candidate_count'] <= int(os.environ['EXPECTED_MAX_CANDIDATES'])
          assert result['search_space']['candidate_jobs'] == 2
          assert result['search_space']['holdout_jobs'] == 2
          assert result['search_space']['baseline_reports_reused'] is True
          assert set(result['bindings']['reused_baseline_reports']) == {'development', 'validation', 'shadow'}
          baseline_dev = next(item for item in result['development_ranking'] if item['label'] == 'baseline')
          assert baseline_dev['elapsed_s'] == 0.0
          assert result['bindings']['partitions']['development']['generator_seed'] == 1307
          assert result['bindings']['partitions']['validation']['generator_seed'] == 2307
          assert result['bindings']['partitions']['shadow']['generator_seed'] == 3307
          assert baseline_dev['validation_result'] == 'PASS'
          assert result['validation']['baseline']['validation_result'] == 'PASS'
          assert result['shadow']['baseline']['validation_result'] == 'PASS'
          if result['decision'] == 'ACOUSTIC_CANDIDATE':
              assert not result['validation']['regression_violations']
              assert not result['shadow']['regression_violations']
          print(json.dumps({
              'decision': result['decision'],
              'iteration_id': result['iteration_id'],
              'selected': result['selected'],
              'promotion_required': result['promotion_required'],
          }, sort_keys=True))
          PY
      - name: Publish iteration summary
        if: always()
        shell: bash
        run: |
          if [ -f tuning-out/iteration-result.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r = json.loads(Path('tuning-out/iteration-result.json').read_text())
          print('## Acoustic tuning search')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Iteration: `{r['iteration_id']}`")
          print(f"- Search space: `{os.environ['SEARCH_SPACE']}`")
          print(f"- Candidate count: `{r['search_space']['candidate_count']}`")
          print(f"- Selected: `{r['selected']['label']}`")
          print(f"- Development score: `{r['selected']['development_score']:.4f}`")
          sensitivity = r['selected']['development_adjacent_sensitivity']
          print(
              f"- Adjacent coverage: `{sensitivity['evaluated_neighbor_count']}/{sensitivity['neighbor_slot_count']}` evaluated; "
              f"compliant `{sensitivity['compliant_neighbor_count']}`, "
              f"violating `{sensitivity['violating_neighbor_count']}`, "
              f"unobserved `{sensitivity['unobserved_neighbor_count']}`, "
              f"complete `{str(sensitivity['complete_neighbor_coverage']).lower()}`"
          )
          margins = [
              f"{item['metric']}/{item['stat']}={item['binding_margin']:.6g}"
              for item in r['selected']['development_case_delta_summary']
              if item.get('binding_margin') is not None
          ]
          if margins:
              print(f"- Development gate margins: `{' ; '.join(margins)}`")
          print('- Authority: non-shipping candidate only; blind + target + HIL + certification remain mandatory.')
          PY
          fi
      - name: Upload hash-bound tuning evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acoustic-tuning-${{ github.run_id }}
          path: tuning-out/
          if-no-files-found: warn
          retention-days: 30
