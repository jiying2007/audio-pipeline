name: Research Candidate Blind Qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/candidates/**'
      - '.github/research/continuous-optimization/research_candidate_blind.py'
      - '.github/workflows/research-candidate-blind-qualification.yml'
      - '.github/program/maintenance_workflow_contract.py'
      - 'validation/github-hosted-public-minimal.lock.json'
      - 'validation/research/README.md'
      - 'validation/authority.json'
      - 'validation/policies/validation-full-partition.json'
      - 'validation/policies/validation-full-blind.json'
      - 'validation/tools/prepare_github_hosted_full_validation.py'
      - 'validation/tools/build_full_public_corpus.py'
      - 'validation/tools/split_holdout.py'
      - 'validation/tools/run_validation.py'
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Committed frozen research-candidate manifest
        required: true
        default: '.github/research/continuous-optimization/candidates/f5ad7c495d7f67d6.json'
        type: string
      aec_limit:
        required: true
        default: '60'
        type: string
      derived_limit:
        required: true
        default: '20'
        type: string
      dns_limit:
        required: true
        default: '60'
        type: string
      holdout_percent:
        description: Repository-external HMAC blind holdout percentage
        required: true
        default: '20'
        type: choice
        options: ['20', '30']

permissions:
  contents: read
  actions: read

concurrency:
  group: research-candidate-blind-${{ github.event_name }}-${{ inputs.candidate_manifest || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: validation/tools:.github/research/continuous-optimization
      RESEARCH_REGISTRY: .github/research/continuous-optimization/dataset-registry.json
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate blind-candidate tooling and committed manifests
        run: |
          set -euo pipefail
          python3 -m py_compile .github/research/continuous-optimization/research_candidate_blind.py
          python3 .github/research/continuous-optimization/research_candidate_blind.py --self-test
          python3 -m py_compile validation/tools/prepare_github_hosted_full_validation.py
          python3 validation/tools/prepare_github_hosted_full_validation.py --self-test
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, 'validation/tools')
          import prepare_github_hosted_full_validation as hosted
          hosted.validate_archive_lock(json.load(open('validation/github-hosted-public-minimal.lock.json')))
          print('github-hosted public archive lock: PASS')
          PY
          shopt -s nullglob
          manifests=(.github/research/continuous-optimization/candidates/*.json)
          test "${#manifests[@]}" -gt 0
          for manifest in "${manifests[@]}"; do
            python3 .github/research/continuous-optimization/research_candidate_blind.py \
              --manifest "$manifest" --registry "$RESEARCH_REGISTRY" --check
          done
          python3 .github/program/maintenance_workflow_contract.py --self-test --check
      - name: Enforce manual blind and non-shipping boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/research-candidate-blind-qualification.yml')
          text = path.read_text(encoding='utf-8')
          required = (
              'pull_request:', 'workflow_dispatch:', 'AP_VALIDATION_HOLDOUT_KEY',
              '--blind-summary-only', 'BLIND_QUALIFIED_NON_SHIPPING',
              'artifact_digest', 'research_candidate_id', 'target_execution_authority',
              'prepare_github_hosted_full_validation.py',
              'github-hosted-public-minimal.lock.json',
              '${{ runner.temp }}/audio-validation-data',
          )
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'blind qualification contract missing: {missing}')
          forbidden = (
              '\n  push:', '\n  schedule:', 'git ' + 'push', 'git ' + 'tag', 'gh ' + 'release',
              'runs-on: [self-hosted', '/opt/audio-validation-data',
          )
          present = [item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'blind qualification gained forbidden trigger/mutation: {present}')
          print('research candidate blind boundary: PASS')
          PY

  resolve:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    outputs:
      infra_sha: ${{ steps.resolve.outputs.infra_sha }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      candidate_id: ${{ steps.resolve.outputs.candidate_id }}
      research_candidate_id: ${{ steps.resolve.outputs.research_candidate_id }}
      artifact_id: ${{ steps.resolve.outputs.artifact_id }}
      artifact_digest: ${{ steps.resolve.outputs.artifact_digest }}
      artifact_name: ${{ steps.resolve.outputs.artifact_name }}
      research_run_id: ${{ steps.resolve.outputs.research_run_id }}
      manifest_path: ${{ steps.resolve.outputs.manifest_path }}
    env:
      GH_TOKEN: ${{ github.token }}
      RESEARCH_REGISTRY: .github/research/continuous-optimization/dataset-registry.json
      CANDIDATE_MANIFEST: ${{ inputs.candidate_manifest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve exact protected-main candidate and provenance
        id: resolve
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main' || { echo 'manual blind qualification must dispatch from main' >&2; exit 1; }
          git fetch --no-tags origin main
          infra_sha=$(git rev-parse HEAD)
          test "$infra_sha" = "$(git rev-parse origin/main)"
          case "$CANDIDATE_MANIFEST" in
            .github/research/continuous-optimization/candidates/*.json) ;;
            *) echo 'candidate_manifest must stay under the committed candidates directory' >&2; exit 1 ;;
          esac
          test -f "$CANDIDATE_MANIFEST"
          python3 .github/research/continuous-optimization/research_candidate_blind.py \
            --manifest "$CANDIDATE_MANIFEST" --registry "$RESEARCH_REGISTRY" --check
          eval "$(python3 - "$CANDIDATE_MANIFEST" <<'PY'
          import json, shlex, sys
          m=json.load(open(sys.argv[1]))
          p=m['research_provenance']
          values={
              'SOURCE_SHA':m['source_sha'], 'CANDIDATE_ID':m['candidate_id'],
              'RESEARCH_CANDIDATE_ID':m['research_candidate_id'],
              'ARTIFACT_ID':str(p['artifact_id']), 'ARTIFACT_DIGEST':p['artifact_digest'],
              'ARTIFACT_NAME':p['artifact_name'], 'RESEARCH_RUN_ID':str(p['run_id']),
          }
          for key,value in values.items(): print(f'{key}={shlex.quote(value)}')
          PY
          )"
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "$infra_sha" || {
            echo 'candidate source must be an ancestor of qualification infrastructure main' >&2; exit 1;
          }
          {
            echo "infra_sha=$infra_sha"
            echo "source_sha=$SOURCE_SHA"
            echo "candidate_id=$CANDIDATE_ID"
            echo "research_candidate_id=$RESEARCH_CANDIDATE_ID"
            echo "artifact_id=$ARTIFACT_ID"
            echo "artifact_digest=$ARTIFACT_DIGEST"
            echo "artifact_name=$ARTIFACT_NAME"
            echo "research_run_id=$RESEARCH_RUN_ID"
            echo "manifest_path=$CANDIDATE_MANIFEST"
          } >> "$GITHUB_OUTPUT"
      - name: Verify exact Research Optimization artifact and selected result
        env:
          ARTIFACT_ID: ${{ steps.resolve.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ steps.resolve.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ steps.resolve.outputs.artifact_name }}
          RESEARCH_RUN_ID: ${{ steps.resolve.outputs.research_run_id }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          MANIFEST_PATH: ${{ steps.resolve.outputs.manifest_path }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > /tmp/research-artifact.json
          test "$(jq -r .name /tmp/research-artifact.json)" = "$ARTIFACT_NAME"
          test "$(jq -r .expired /tmp/research-artifact.json)" = false
          test "$(jq -r .workflow_run.id /tmp/research-artifact.json)" = "$RESEARCH_RUN_ID"
          test "$(jq -r .workflow_run.head_sha /tmp/research-artifact.json)" = "$SOURCE_SHA"
          test "$(jq -r .digest /tmp/research-artifact.json)" = "$ARTIFACT_DIGEST"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output /tmp/research-artifact.zip
          test "sha256:$(sha256sum /tmp/research-artifact.zip | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          rm -rf /tmp/research-artifact && mkdir -p /tmp/research-artifact
          unzip -q /tmp/research-artifact.zip -d /tmp/research-artifact
          result=$(find /tmp/research-artifact -type f -path '*/research-optimization-out/optimization-result.json' -print -quit)
          test -n "$result"
          python3 .github/research/continuous-optimization/research_candidate_blind.py \
            --manifest "$MANIFEST_PATH" --registry "$RESEARCH_REGISTRY" \
            --optimization-result "$result" --check

  qualify-blind:
    if: github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_ROOT: ${{ runner.temp }}/audio-validation-data
      SEAL: ${{ runner.temp }}/audio-validation-data/datasets.seal.json
      DNS_ROOT: ${{ runner.temp }}/audio-validation-data/DNS-Challenge/datasets_fullband
      AEC_LIMIT: ${{ inputs.aec_limit }}
      DERIVED_LIMIT: ${{ inputs.derived_limit }}
      DNS_LIMIT: ${{ inputs.dns_limit }}
      HOLDOUT: ${{ inputs.holdout_percent }}
    steps:
      - name: Checkout qualification infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.infra_sha }}
          fetch-depth: 0
          path: infra
      - name: Checkout exact candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Rebind exact candidate provenance on GitHub-hosted runner
        env:
          ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.resolve.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.resolve.outputs.artifact_name }}
          RESEARCH_RUN_ID: ${{ needs.resolve.outputs.research_run_id }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
          MANIFEST_PATH: ${{ needs.resolve.outputs.manifest_path }}
        run: |
          set -euo pipefail
          test "$(git -C infra rev-parse HEAD)" = '${{ needs.resolve.outputs.infra_sha }}'
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p candidate-out provenance
          cp "infra/$MANIFEST_PATH" candidate-out/candidate-manifest.json
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > candidate-out/research-artifact-metadata.json
          test "$(jq -r .name candidate-out/research-artifact-metadata.json)" = "$ARTIFACT_NAME"
          test "$(jq -r .workflow_run.id candidate-out/research-artifact-metadata.json)" = "$RESEARCH_RUN_ID"
          test "$(jq -r .workflow_run.head_sha candidate-out/research-artifact-metadata.json)" = "$SOURCE_SHA"
          test "$(jq -r .digest candidate-out/research-artifact-metadata.json)" = "$ARTIFACT_DIGEST"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output provenance/research-artifact.zip
          test "sha256:$(sha256sum provenance/research-artifact.zip | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          unzip -q provenance/research-artifact.zip -d provenance/unpacked
          result=$(find provenance/unpacked -type f -path '*/research-optimization-out/optimization-result.json' -print -quit)
          test -n "$result"
          cp "$result" candidate-out/optimization-result.json
          python3 infra/.github/research/continuous-optimization/research_candidate_blind.py \
            --manifest candidate-out/candidate-manifest.json \
            --registry infra/.github/research/continuous-optimization/dataset-registry.json \
            --optimization-result candidate-out/optimization-result.json --check
      - name: Bootstrap hash-bound full public cache on GitHub-hosted runner
        run: |
          set -euo pipefail
          python3 infra/validation/tools/prepare_github_hosted_full_validation.py \
            --source-root source \
            --data-root "$DATA_ROOT" \
            --seal "$SEAL" \
            --archive-lock infra/validation/github-hosted-public-minimal.lock.json \
            --output candidate-out/github-hosted-cache.json
      - name: Preflight GitHub-hosted audio-validation environment
        run: |
          set -euo pipefail
          python3 source/tools/runner_preflight.py \
            --role audio-validation \
            --source-revision '${{ needs.resolve.outputs.source_sha }}' \
            --data-root "$DATA_ROOT" --seal "$SEAL" --dns-data-root "$DNS_ROOT" \
            --require-command gh --require-command jq --require-command curl \
            --require-command sha256sum --require-command unzip \
            --writable-path "$GITHUB_WORKSPACE" \
            --output candidate-out/runner-preflight.json
          test -z "$(git -C source status --porcelain=v1)"
          test -z "$(git -C infra status --porcelain=v1)"
      - name: Verify full sealed public cache
        run: |
          set -euo pipefail
          python3 source/validation/tools/prepare_public_validation.py verify \
            --profile full --root "$DATA_ROOT" --seal "$SEAL" --dns-data-root "$DNS_ROOT" \
            > candidate-out/dataset-verification.json
      - name: Build exact offline candidate processor
        working-directory: source
        run: |
          set -euo pipefail
          cmake -S . -B build-candidate -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON \
            -DAP_BUILD_SOURCE_REVISION='${{ needs.resolve.outputs.source_sha }}'
          cmake --build build-candidate --target ap_process_pcm ap_build_info_dump --parallel
          sha256sum build-candidate/ap_process_pcm | tee ../candidate-out/processor.sha256
          build-candidate/ap_build_info_dump | tee ../candidate-out/build-info.txt
          ${CC:-cc} --version | head -n 1 | tee ../candidate-out/compiler.txt
      - name: Seal fixed frozen candidate identity
        run: |
          set -euo pipefail
          python3 infra/.github/research/continuous-optimization/research_candidate_blind.py \
            --manifest candidate-out/candidate-manifest.json \
            --registry infra/.github/research/continuous-optimization/dataset-registry.json \
            --optimization-result candidate-out/optimization-result.json \
            --processor source/build-candidate/ap_process_pcm \
            --wrapper candidate-out/candidate-processor \
            --identity-output candidate-out/candidate-identity.json \
            --seal-identity
      - name: Build full public validation corpus
        run: |
          set -euo pipefail
          python3 source/validation/tools/build_full_public_corpus.py \
            --data-root "$DATA_ROOT" --seal "$SEAL" --dns-data-root "$DNS_ROOT" \
            --output candidate-out/public \
            --aec-limit "$AEC_LIMIT" --derived-limit "$DERIVED_LIMIT" --dns-limit "$DNS_LIMIT"
      - name: Partition repository-external blind holdout
        env:
          AP_VALIDATION_HOLDOUT_KEY: ${{ secrets.AP_VALIDATION_HOLDOUT_KEY }}
        run: |
          set -euo pipefail
          test -n "$AP_VALIDATION_HOLDOUT_KEY" || {
            echo 'AP_VALIDATION_HOLDOUT_KEY is required; blind qualification fails closed' >&2; exit 1;
          }
          python3 source/validation/tools/split_holdout.py \
            --corpus candidate-out/public/corpus.json \
            --validation-output candidate-out/public/corpus-validation.json \
            --blind-output candidate-out/public/corpus-blind.json \
            --holdout-percent "$HOLDOUT"
      - name: Run exact frozen candidate on visible validation partition
        working-directory: source
        run: |
          set -euo pipefail
          python3 validation/tools/run_validation.py \
            --source-revision '${{ needs.resolve.outputs.source_sha }}' \
            --corpus ../candidate-out/public/corpus-validation.json \
            --policy validation/policies/validation-full-partition.json \
            --dataset-lock validation/datasets.lock.json \
            --processor ../candidate-out/candidate-processor \
            --output ../candidate-out/validation-report.json \
            --evidence-manifest ../candidate-out/validation-evidence-manifest.json --enforce
      - name: Run exact frozen candidate on blind holdout with summary-only report
        working-directory: source
        run: |
          set -euo pipefail
          python3 validation/tools/run_validation.py \
            --source-revision '${{ needs.resolve.outputs.source_sha }}' \
            --corpus ../candidate-out/public/corpus-blind.json \
            --policy validation/policies/validation-full-blind.json \
            --dataset-lock validation/datasets.lock.json \
            --processor ../candidate-out/candidate-processor \
            --output ../candidate-out/blind-report.json \
            --evidence-manifest ../candidate-out/blind-evidence-manifest.json \
            --blind-summary-only --enforce
      - name: Classify fixed candidate without promotion authority
        if: always()
        id: classify
        run: |
          set +e
          python3 infra/.github/research/continuous-optimization/research_candidate_blind.py \
            --classify --identity candidate-out/candidate-identity.json \
            --visible-report candidate-out/validation-report.json \
            --blind-report candidate-out/blind-report.json \
            --qualification-output candidate-out/qualification-summary.json
          rc=$?
          cat candidate-out/qualification-summary.json >> "$GITHUB_STEP_SUMMARY" || true
          exit "$rc"
      - name: Seal candidate blind evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p candidate-out
          printf '%s\n' '${{ needs.resolve.outputs.infra_sha }}' > candidate-out/qualification-infra-revision.txt
          printf '%s\n' '${{ needs.resolve.outputs.source_sha }}' > candidate-out/source-revision.txt
          find candidate-out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum \
            > /tmp/candidate-SHA256SUMS
          mv /tmp/candidate-SHA256SUMS candidate-out/SHA256SUMS
      - name: Upload hash-bound blind qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: research-candidate-blind-${{ needs.resolve.outputs.research_candidate_id }}-${{ github.run_id }}
          path: candidate-out/
          if-no-files-found: error
          retention-days: 90
