version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-non-major:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major

  - package-ecosystem: pip
    directory: /lab
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      lab-python-patch:
        patterns:
          - '*'
        update-types:
          - patch
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
