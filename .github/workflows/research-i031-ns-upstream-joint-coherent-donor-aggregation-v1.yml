name: Research I031 NS Upstream Joint-Coherent Donor Aggregation v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i031-ns-upstream-joint-coherent-donor-aggregation-v1.json'
      - '.github/research/continuous-optimization/development-v4/i031-ns-upstream-joint-coherent-donor-aggregation-v1-result.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i031_ns_upstream_joint_coherent_donor_aggregation.py'
      - 'tests/validation/test_i031_one_shot_guard.py'
      - 'tests/validation/test_i031_retirement.py'
      - 'tests/validation/data/i031-consumed-workflow.yml'
      - 'validation/research/evidence/i031-36666717040/**'
      - '.github/workflows/research-i031-ns-upstream-joint-coherent-donor-aggregation-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I031 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i031-ns-upstream-joint-coherent-donor-aggregation-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i031_ns_upstream_joint_coherent_donor_aggregation.py \
            tests/validation/test_i031_one_shot_guard.py \
            tests/validation/test_i031_retirement.py
          python3 tests/validation/i031_ns_upstream_joint_coherent_donor_aggregation.py --self-test
          python3 tests/validation/test_i031_one_shot_guard.py
          python3 tests/validation/test_i031_retirement.py
