name: Research Matched Gain-Chain Factor Plan Lab Binding V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.schema.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.template.json'
      - '.github/research/continuous-optimization/validate_matched_gain_chain_lab_binding.py'
      - '.github/workflows/research-matched-gain-chain-factor-plan-lab-binding-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.schema.json'
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.template.json'
      - '.github/research/continuous-optimization/validate_matched_gain_chain_lab_binding.py'
      - '.github/workflows/research-matched-gain-chain-factor-plan-lab-binding-v1.yml'

permissions:
  contents: read

jobs:
  validate-binding:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Validate reusable lab-binding contract
        shell: bash
        run: |
          set -euo pipefail
          validator=.github/research/continuous-optimization/validate_matched_gain_chain_lab_binding.py
          python3 -m py_compile "$validator"
          python3 "$validator" --self-test
          python3 "$validator" > /tmp/lab-binding-result.json
          cat /tmp/lab-binding-result.json

      - name: Enforce pull-request mutation boundary
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess

          base = '${{ github.event.pull_request.base.sha }}'
          head = '${{ github.event.pull_request.head.sha }}'
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', base, head],
                  text=True,
              ).splitlines()
          )
          binding = '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.json'
          allowed = {
              binding,
              '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.schema.json',
              '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-lab-binding-v1.template.json',
              '.github/research/continuous-optimization/validate_matched_gain_chain_lab_binding.py',
              '.github/workflows/research-matched-gain-chain-factor-plan-lab-binding-v1.yml',
          }
          assert changed and changed <= allowed, sorted(changed)
          if binding in changed:
              assert changed == {binding}, (
                  'A real lab binding PR may change only the binding manifest; '
                  'validator/schema/template/workflow changes require a separate PR'
              )
          PY

      - name: Publish authority boundary
        shell: bash
        run: |
          {
            echo '## Matched gain-chain lab binding'
            echo '- Local check: `python3 .github/research/continuous-optimization/validate_matched_gain_chain_lab_binding.py --require-binding`'
            echo '- Scope: exact lab metadata and provenance only.'
            echo '- Hardware execution: **not authorized**.'
            echo '- Audio-pipeline execution / DTD / quality computation: **not authorized**.'
            echo '- Algorithm or tuning candidate creation: **not authorized**.'
            echo '- Shipping / HIL / Product Certification authority: **unchanged**.'
          } >> "$GITHUB_STEP_SUMMARY"
