name: Research I022 VAD Low Local Evidence Disagreement Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i022-vad-low-local-evidence-disagreement-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i022-vad-low-local-evidence-disagreement-decomposition-v1-result.json'
      - 'tests/validation/i022_vad_low_local_disagreement_probe.c'
      - 'tests/validation/i022_vad_low_local_disagreement_decomposition.py'
      - 'tests/validation/test_i022_one_shot_guard.py'
      - 'tests/validation/test_i022_retirement.py'
      - 'tests/validation/data/i022-consumed-workflow.yml'
      - 'validation/research/evidence/i022-36432159733/**'
      - '.github/workflows/research-i022-vad-low-local-evidence-disagreement-decomposition-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I022 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 tests/validation/i022_vad_low_local_disagreement_decomposition.py --self-test
          python3 tests/validation/test_i022_one_shot_guard.py
          python3 tests/validation/test_i022_retirement.py
