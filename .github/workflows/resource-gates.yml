name: Resource Gates

on:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: resource-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sku-hard-ceilings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: resource-sku
      - name: Build representative pipeline SKUs
        run: |
          cmake --preset composition-full
          cmake --preset composition-low
          cmake --preset composition-tiny
          cmake --preset composition-raw
          for p in full low tiny raw; do cmake --build "build/composition-$p" --target ap_state_size --parallel; done
      - name: Enforce absolute pipeline RAM ceilings
        run: |
          set -euo pipefail
          full=$(./build/composition-full/ap_state_size)
          low=$(./build/composition-low/ap_state_size)
          tiny=$(./build/composition-tiny/ap_state_size)
          raw=$(./build/composition-raw/ap_state_size)
          echo "pipeline_state_bytes full=$full low=$low tiny=$tiny raw=$raw"
          test "$full" -le 80000
          test "$low" -le 50000
          test "$tiny" -le 28000
          test "$raw" -le 2048
          test "$low" -lt "$full"
          test "$tiny" -lt "$low"
          test "$raw" -lt "$tiny"
          printf 'P_FULL=%s\nP_LOW=%s\nP_TINY=%s\nP_RAW=%s\n' \
            "$full" "$low" "$tiny" "$raw" > /tmp/resource-pipeline.env
      - name: Enforce runtime RAM ceilings
        run: |
          set -euo pipefail
          cmake -S . -B build/rt-full -DCMAKE_BUILD_TYPE=Release -DAP_RUNTIME_QUEUE_DEPTH=8
          cmake -S . -B build/rt-tiny -DCMAKE_BUILD_TYPE=Release \
            -DAP_RUNTIME_QUEUE_DEPTH=4 -DAP_BUILD_MAX_IO_RATE_HZ=16000 \
            -DAP_BUILD_MAX_INTERNAL_RATE_HZ=8000 -DAP_BUILD_MAX_MIC_CHANNELS=1 \
            -DAP_BUILD_MAX_DELAY_MS=120 -DAP_BUILD_MAX_AEC_TAIL_MS=48 \
            -DAP_MODULES=RESAMPLER,HPF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          cmake --build build/rt-full --parallel
          cmake --build build/rt-tiny --parallel
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-full/generated \
            build/rt-full/libaudio_pipeline_runtime.a build/rt-full/libaudio_pipeline.a -lm -pthread -o /tmp/rt-full
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-tiny/generated \
            build/rt-tiny/libaudio_pipeline_runtime.a build/rt-tiny/libaudio_pipeline.a -lm -pthread -o /tmp/rt-tiny
          full=$(/tmp/rt-full)
          tiny=$(/tmp/rt-tiny)
          echo "runtime_state_bytes full=$full tiny=$tiny"
          test "$full" -le 32768
          test "$tiny" -le 8192
          test "$tiny" -lt "$full"
          printf 'R_FULL=%s\nR_TINY=%s\n' "$full" "$tiny" > /tmp/resource-runtime.env
      - name: Enforce resource baseline single source
        run: |
          set -euo pipefail
          python3 scripts/resource_baseline.py --self-test
          . /tmp/resource-pipeline.env
          . /tmp/resource-runtime.env
          python3 scripts/resource_baseline.py \
            --full "$P_FULL" --low "$P_LOW" --tiny "$P_TINY" --raw "$P_RAW" \
            --runtime-full "$R_FULL" --runtime-tiny "$R_TINY" \
            --json-output /tmp/resource-baseline.json \
            --markdown-output /tmp/RESOURCE_BASELINE.md
          diff -u ci/resource-baseline.json /tmp/resource-baseline.json
          diff -u docs/generated/RESOURCE_BASELINE.md /tmp/RESOURCE_BASELINE.md
      - name: Enforce final consumer ELF pruning
        run: |
          common="-DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-ffunction-sections\ -fdata-sections -DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections"
          eval cmake -S . -B build/elf-full $common -DAP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          eval cmake -S . -B build/elf-voice $common -DAP_MODULES=RESAMPLER,HPF,BF,NS,AGC,VAD
          eval cmake -S . -B build/elf-raw $common -DAP_MODULES=RESAMPLER
          for p in full voice raw; do cmake --build "build/elf-$p" --target ap_consumer_smoke --parallel; done
          elf_bytes() { size "$1" | awk 'NR==2 {print $1+$2+$3}'; }
          full=$(elf_bytes build/elf-full/ap_consumer_smoke)
          voice=$(elf_bytes build/elf-voice/ap_consumer_smoke)
          raw=$(elf_bytes build/elf-raw/ap_consumer_smoke)
          echo "consumer_elf_bytes full=$full voice=$voice raw=$raw"
          test "$voice" -lt "$full"
          test "$raw" -lt "$voice"
          test $((full - voice)) -ge 64
          test $((voice - raw)) -ge 64

  cortex-a32-rom:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:2b36ae460830199972a6f5ba094f7eb9ae7e1bf1e6f87dc04bcd7c915dbc6d3c
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: cortex-a32-rom
      - name: Build Cortex-A32 full and tiny pipeline libraries
        run: |
          common="-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/arm-linux-gnueabihf.cmake -DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_TESTS=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-O2\ -mcpu=cortex-a32\ -mfpu=neon-vfpv4\ -mfloat-abi=hard\ -ffunction-sections\ -fdata-sections"
          eval cmake -S . -B build/arm-full $common -DAP_SIMD_BACKEND=NEON \
            -DAP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          eval cmake -S . -B build/arm-tiny $common -DAP_SIMD_BACKEND=NEON \
            -DAP_BUILD_MAX_IO_RATE_HZ=16000 -DAP_BUILD_MAX_INTERNAL_RATE_HZ=8000 \
            -DAP_BUILD_MAX_MIC_CHANNELS=1 -DAP_BUILD_MAX_DELAY_MS=120 \
            -DAP_BUILD_MAX_AEC_TAIL_MS=48 \
            -DAP_MODULES=RESAMPLER,HPF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          cmake --build build/arm-full --target audio_pipeline --parallel
          cmake --build build/arm-tiny --target audio_pipeline --parallel
      - name: Link representative Cortex-A32 pipeline graphs
        run: |
          common="-O2 -mcpu=cortex-a32 -mfpu=neon-vfpv4 -mfloat-abi=hard -ffunction-sections -fdata-sections -Wl,--gc-sections"
          # shellcheck disable=SC2086
          arm-linux-gnueabihf-gcc $common -Iinclude -Ibuild/arm-full/generated \
            tests/rom_probe.c build/arm-full/libaudio_pipeline.a -lm -o /tmp/rom-full
          # shellcheck disable=SC2086
          arm-linux-gnueabihf-gcc $common -Iinclude -Ibuild/arm-tiny/generated \
            tests/rom_probe.c build/arm-tiny/libaudio_pipeline.a -lm -o /tmp/rom-tiny
      - name: Enforce Cortex-A32 ROM envelopes and physical module pruning
        run: |
          rom_bytes() { arm-linux-gnueabihf-size "$1" | awk 'NR==2 {print $1+$2}'; }
          full=$(rom_bytes /tmp/rom-full)
          tiny=$(rom_bytes /tmp/rom-tiny)
          echo "cortex_a32_pipeline_rom_bytes full=$full tiny=$tiny"
          test "$full" -le 40960
          test "$tiny" -le 40960
          arm-linux-gnueabihf-nm /tmp/rom-full | grep -q 'ap_beamformer'
          if arm-linux-gnueabihf-nm /tmp/rom-tiny | grep -q 'ap_beamformer'; then
            echo "TINY Cortex-A32 ROM unexpectedly retains beamformer symbols" >&2
            exit 3
          fi
          ccache --show-stats
