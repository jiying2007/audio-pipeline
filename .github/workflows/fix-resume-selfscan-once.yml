name: Fix Resume Self Scan Once

on:
  push:
    branches: [codex/blind-resume-metrics-fix]
    paths:
      - '.github/workflows/fix-resume-selfscan-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/blind-resume-metrics-fix
          fetch-depth: 0
      - name: Remove contract self matches
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              '.github/workflows/research-candidate-blind-resume.yml',
              '.github/workflows/research-candidate-blind-qualification.yml',
          ):
              p=Path(name); t=p.read_text()
              t=t.replace("'split_holdout.py'", "'split_' + 'holdout.py'")
              t=t.replace("'secrets.token_hex'", "'secrets.' + 'token_hex'")
              t=t.replace("'AP_EPHEMERAL_HOLDOUT_KEY'", "'AP_EPHEMERAL_' + 'HOLDOUT_KEY'")
              t=t.replace("'\\n  push:'", "'\\n  ' + 'push:'")
              t=t.replace("'\\n  schedule:'", "'\\n  ' + 'schedule:'")
              t=t.replace("'git push'", "'git ' + 'push'")
              t=t.replace("'gh release'", "'gh ' + 'release'")
              p.write_text(t)
          PY
          python3 - <<'PY'
          import yaml
          from pathlib import Path
          for name in ('.github/workflows/research-candidate-blind-resume.yml',
                       '.github/workflows/research-candidate-blind-qualification.yml'):
              yaml.safe_load(open(name))
          text=Path('.github/workflows/research-candidate-blind-resume.yml').read_text()
          forbidden=('split_'+'holdout.py','secrets.'+'token_hex','AP_EPHEMERAL_'+'HOLDOUT_KEY',
                     '\n  '+'push:','\n  '+'schedule:','git '+'push','gh '+'release')
          # Exclude the contract source itself by checking operational lines only.
          operational='\n'.join(line for line in text.splitlines() if 'forbidden=' not in line and 'present=' not in line)
          # String-splitting keeps exact forbidden markers out of workflow source entirely.
          present=[x for x in forbidden if x in operational]
          if present: raise SystemExit(f'operational resume boundary violated: {present}')
          print('resume self-scan fix: PASS')
          PY
      - name: Commit clean self-scan fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-resume-selfscan-once.yml
          git add .github/workflows/research-candidate-blind-resume.yml \
            .github/workflows/research-candidate-blind-qualification.yml
          git diff --cached --check
          git commit -m 'fix(validation): avoid resume contract self matches'
          git rev-parse HEAD
          git push origin HEAD:codex/blind-resume-metrics-fix
