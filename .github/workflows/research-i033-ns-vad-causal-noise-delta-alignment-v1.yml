name: Research I033 NS VAD Causal Noise Delta Alignment v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i033-ns-vad-causal-noise-delta-alignment-v1.json'
      - '.github/research/continuous-optimization/development-v4/i033-ns-vad-causal-noise-delta-alignment-v1-result.json'
      - 'tests/validation/i033_ns_vad_causal_noise_delta_probe.c'
      - 'tests/validation/i033_ns_vad_causal_noise_delta_alignment.py'
      - 'tests/validation/test_i033_one_shot_guard.py'
      - 'tests/validation/test_i033_retirement.py'
      - 'tests/validation/data/i033-consumed-workflow.yml'
      - 'validation/research/evidence/i033-36719045384/**'
      - '.github/workflows/research-i033-ns-vad-causal-noise-delta-alignment-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I033 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool .github/research/continuous-optimization/development-v4/i033-ns-vad-causal-noise-delta-alignment-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i033_ns_vad_causal_noise_delta_alignment.py \
            tests/validation/test_i033_one_shot_guard.py \
            tests/validation/test_i033_retirement.py
          python3 tests/validation/i033_ns_vad_causal_noise_delta_alignment.py --self-test
          python3 tests/validation/test_i033_one_shot_guard.py
          python3 tests/validation/test_i033_retirement.py
