name: Research I024 VAD Disagreement Feature Separability v1
run-name: "i024-vad-disagreement-feature-separability / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i024-vad-disagreement-feature-separability-v1.json'
      - 'tests/validation/i023_vad_upstream_local_disagreement_risk_probe.c'
      - 'tests/validation/i024_vad_disagreement_feature_separability.py'
      - 'tests/validation/test_i024_one_shot_guard.py'
      - '.github/workflows/research-i024-vad-disagreement-feature-separability-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i024-vad-disagreement-feature-separability-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i024-vad-disagreement-feature-separability-v1.json
  DEV_ROOT: /tmp/audio-pipeline-i024-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I024 candidate-zero separability contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i024_vad_disagreement_feature_separability.py
          python3 tests/validation/i024_vad_disagreement_feature_separability.py --self-test
          python3 tests/validation/test_i024_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i024-vad-disagreement-feature-separability-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='RESEARCH_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          seeds=c['fresh_diagnostic_authority']['seeds']
          assert len(seeds)==3 and len(set(seeds))==3
          assert all(type(seed) is int and seed > 0 for seed in seeds)
          assert c['fresh_diagnostic_authority']['diagnostic_execution_limit']==1
          assert c['fresh_diagnostic_authority']['candidate_limit']==0
          assert c['fresh_diagnostic_authority']['confirmation_limit']==0
          assert c['dataset_authority']['role']=='development'
          assert c['dataset_authority']['validation_holdout_consumed'] is False
          assert c['separability_statistics']['model_fitting'] is False
          assert c['separability_statistics']['feature_selection'] is False
          assert c['separability_statistics']['threshold_search'] is False
          assert c['feature_registry']['temporal_context']['future_frames_used'] is False
          assert c['feature_registry']['temporal_context']['learned_weights'] is False
          assert all(value is False for value in c['authority_boundary'].values())

          predecessor=Path(c['predecessor']['i023_closure'])
          prior=json.loads(predecessor.read_text())
          assert prior['status']==c['predecessor']['required_i023_status']
          assert prior['reviewed_decision']==c['predecessor']['required_i023_reviewed_decision']

          def blob(p):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+str(p)],text=True).strip()

          assert blob(predecessor)==c['predecessor']['i023_closure_blob_sha']
          assert blob(Path(c['dataset_authority']['lock_path']))==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(Path(c['dataset_authority']['builder_path']))==c['dataset_authority']['builder_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['probe_path']))==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['evaluator_path']))==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']

          expected_numeric={
              'upstream_margin','ratio_db','crest_db','raw_probability',
              'pre_blend_probability','shipping_probability','pre_hangover',
              'upstream_margin_mean3','upstream_margin_min3','ratio_db_mean3',
              'pre_blend_probability_mean3','disagreement_run_length',
          }
          assert set(c['feature_registry']['numeric_features'])==expected_numeric
          assert c['feature_registry']['categorical_features']==['noise_update_kind']

          for seed in seeds:
              pattern=rf'(^|[^0-9]){seed}([^0-9]|$)'
              result=subprocess.run(
                  ['git','grep','-n','-E',pattern,'--','.github','tests','validation','docs'],
                  stdout=subprocess.PIPE,text=True,check=False)
              assert result.returncode in (0,1)
              matches=[
                  line for line in result.stdout.splitlines()
                  if line and line.split(':',1)[0] != str(path)
              ]
              assert not matches, (
                  f'I024 seed is not fresh: {seed}\n'+'\n'.join(matches))
          PY
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i024-vad-disagreement-feature-separability-contract
      - name: Compile frozen shared shipping-mirror probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i024-contract             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i024-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i024-contract/generated             tests/validation/i023_vad_upstream_local_disagreement_risk_probe.c             build-i024-contract/libaudio_pipeline.a -lm             -o build-i024-contract/i024-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I024 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i024-vad-disagreement-feature-separability-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I024 diagnostic requires first-attempt trusted main dispatch')

          def pages(endpoint):
              raw=subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint],text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value

          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I024 run not visible; fail closed')

          consuming={
              'Materialize fresh public-development-v3 partitions',
              'Evaluate candidate-zero feature separability',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts < 1:
                  raise SystemExit('invalid prior I024 attempt count')
              for run_attempt in range(1,attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs'
                      '?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if step.get('name') in consuming and step.get('conclusion') != 'skipped':
                                  raise SystemExit(
                                      f'I024 one-shot authority already consumed by run {run_id}')
          print('I024 one-shot authority: fresh')
          PY
      - name: Bind frozen diagnostic inputs and unchanged shipping source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.loads(Path('.github/research/continuous-optimization/development-v4/i024-vad-disagreement-feature-separability-v1.json').read_text())
          def blob(path):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+path],text=True).strip()
          assert blob(c['predecessor']['i023_closure'])==c['predecessor']['i023_closure_blob_sha']
          assert blob(c['dataset_authority']['lock_path'])==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(c['dataset_authority']['builder_path'])==c['dataset_authority']['builder_git_blob_sha']
          assert blob(c['diagnostic_inputs']['probe_path'])==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(c['diagnostic_inputs']['evaluator_path'])==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']
          PY
          SOURCE_BASE="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["source_base_sha"])')"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD --             src/enhance/ap_vad.c             src/modules/ap_vad_module.c             src/modules/ap_ns_module.c             include/audio_pipeline/audio_modules.h             src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i024-vad-disagreement-feature-separability
      - name: Build frozen shared shipping-mirror probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i024             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i024 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i024/generated             tests/validation/i023_vad_upstream_local_disagreement_risk_probe.c             build-i024/libaudio_pipeline.a -lm             -o build-i024/i024-probe
      - name: Materialize fresh public-development-v3 partitions
        run: |
          set -euo pipefail
          LOCK="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["lock_path"])')"
          BUILDER="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["builder_path"])')"
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py             --lock "$LOCK" --root "$DEV_ROOT"             --output /tmp/i024-development-v3-materialization.json
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["seeds"])'); do
            python3 "$BUILDER"               --lock "$LOCK"               --materialization /tmp/i024-development-v3-materialization.json               --data-root "$DEV_ROOT"               --output "/tmp/i024-public-dev-$seed"               --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
          done
      - name: Evaluate candidate-zero feature separability
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i024-out
          mkdir -p i024-out/evidence
          corpus_args=()
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["seeds"])'); do
            corpus_args+=(--corpus "/tmp/i024-public-dev-$seed/corpus.json")
          done
          set +e
          python3 tests/validation/i024_vad_disagreement_feature_separability.py             --probe build-i024/i024-probe             --contract "$CONTRACT"             "${corpus_args[@]}"             --output i024-out/evidence/result.json             > i024-out/evidence/evaluate.stdout             2> i024-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > i024-out/evidence/evaluate.exit-code
          cp "$CONTRACT" i024-out/evidence/contract.json
          cp /tmp/i024-development-v3-materialization.json i024-out/evidence/materialization.json
          sha256sum build-i024/i024-probe | awk '{print $1}' > i024-out/evidence/probe.sha256
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["seeds"])'); do
            sha256sum "/tmp/i024-public-dev-$seed/corpus.json"
          done > i024-out/evidence/corpora.sha256
          printf 'main_sha=%s\n' "$GITHUB_SHA" > i024-out/evidence/build-info.txt
          if test -f i024-out/evidence/result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i024-out/evidence/result.json').read_text())
          numeric={}
          for name,value in r['global']['numeric_features'].items():
              numeric[name]={
                  'signed_auc':value['signed_auc'],
                  'separability_auc':value['separability_auc'],
                  'direction':value['direction'],
                  'cross_domain_floor':r['cross_domain']['numeric_features'][name]['separability_auc_min'],
                  'cross_domain_median':r['cross_domain']['numeric_features'][name]['separability_auc_median'],
                  'cross_snr_floor':r['cross_snr']['numeric_features'][name]['separability_auc_min'],
              }
          Path('i024-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_seeds':r['fresh_diagnostic_seeds'],
                  'shipping_mirror':r['shipping_mirror'],
                  'population':{
                      'frames':r['global']['frames'],
                      'speech_frames':r['global']['speech_frames'],
                      'noise_frames':r['global']['noise_frames'],
                  },
                  'numeric_features':numeric,
                  'noise_update_kind_tv':r['global']['categorical_features']['noise_update_kind']['total_variation_distance'],
                  'interpretation_boundary':r['interpretation_boundary'],
              },indent=2,sort_keys=True)+'\n')
          PY
          fi
          (
            cd i024-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort |               while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          exit "$rc"
      - name: Enforce diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i024-out/evidence/result.json').read_text())
          assert r['decision'] in {
              'VAD_DISAGREEMENT_FEATURE_SEPARABILITY_PROFILED_REVIEW_REQUIRED',
              'VAD_DISAGREEMENT_NOT_REPRODUCED_REVIEW_REQUIRED',
          }
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['shipping_mirror']['active_mismatch_frames']==0
          assert r['interpretation_boundary']['no_model_fitting'] is True
          assert r['interpretation_boundary']['no_feature_selection'] is True
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i024-out/evidence/summary.json; then
            cat i024-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I024 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i024-vad-disagreement-feature-separability-${{ github.run_id }}
          path: i024-out/
          retention-days: 90
          if-no-files-found: error
