name: Research Development Dataset Source Vetting

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-candidate.json'
      - '.github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-source-vetting-receipt.json'
      - 'tests/validation/frontend_evolution/realman_val_csv_d1.py'
      - 'tests/validation/frontend_evolution/realman_scene_tree_d2_s0.py'
      - 'tests/validation/frontend_evolution/realman_single_archive_d2_s1.py'
      - 'tests/validation/frontend_evolution/realman_flac_quartets_d2_s2.py'
      - 'tests/validation/frontend_evolution/realman_pcm_md5_d2_s3.py'
      - 'tests/validation/frontend_evolution/realman_s2_frozen_anchor_d2_s3.json'
      - 'docs/research/frontend-evolution-v1/REALMAN_FLAC_QUARTETS_D2_S2.md'
      - 'docs/research/frontend-evolution-v1/REALMAN_PCM_MD5_D2_S3.md'
      - 'docs/research/frontend-evolution-v1/REALMAN_ARCHIVE_D2_S1.md'
      - 'docs/research/frontend-evolution-v1/REALMAN_SCENE_ARCHIVE_D2_S0.md'
      - 'docs/research/frontend-evolution-v1/REALMAN_VAL_CSV_D1.md'
      - '.github/workflows/research-development-dataset-source-vetting.yml'

  push:
    branches: [main]
    paths:
      - 'tests/validation/frontend_evolution/realman_single_archive_d2_s1.py'
      - 'tests/validation/frontend_evolution/realman_flac_quartets_d2_s2.py'
      - 'tests/validation/frontend_evolution/realman_pcm_md5_d2_s3.py'
      - 'tests/validation/frontend_evolution/realman_s2_frozen_anchor_d2_s3.json'
      - 'docs/research/frontend-evolution-v1/REALMAN_FLAC_QUARTETS_D2_S2.md'
      - 'docs/research/frontend-evolution-v1/REALMAN_PCM_MD5_D2_S3.md'
      - 'docs/research/frontend-evolution-v1/REALMAN_ARCHIVE_D2_S1.md'
      - 'tests/validation/frontend_evolution/realman_scene_tree_d2_s0.py'
      - 'docs/research/frontend-evolution-v1/REALMAN_SCENE_ARCHIVE_D2_S0.md'
      - 'tests/validation/frontend_evolution/realman_val_csv_d1.py'
      - 'docs/research/frontend-evolution-v1/REALMAN_VAL_CSV_D1.md'
      - '.github/workflows/research-development-dataset-source-vetting.yml'

permissions:
  contents: read

concurrency:
  group: research-development-dataset-source-vetting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Validate source-vetting contract and reusable receipt
        id: receipt
        run: |
          set -euo pipefail
          CANDIDATE=.github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-candidate.json
          RECEIPT=.github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-source-vetting-receipt.json
          python3 -m json.tool "$CANDIDATE" >/dev/null
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          candidate_path=Path('.github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-candidate.json')
          receipt_path=Path('.github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-source-vetting-receipt.json')
          c=json.loads(candidate_path.read_text())
          assert c['authority']=='SOURCE_VETTING_ONLY'
          assert c['upstream']['doi']=='10.5281/zenodo.1227121'
          assert c['upstream']['license']=='CC-BY-SA-3.0'
          assert c['admission']['selection_use_before_sha256_lock'] is False
          assert c['admission']['validation_or_blind_role'] is False
          assert c['admission']['shipping_authority'] is False
          files=c['candidate_files']
          assert [x['category'] for x in files]==[
            'domestic','office','public','transportation','nature']
          assert len({x['name'] for x in files})==5
          assert all(re.fullmatch(r'[0-9a-f]{32}', x['md5']) for x in files)
          if receipt_path.exists():
              r=json.loads(receipt_path.read_text())
              assert r['candidate_id']==c['candidate_id']
              assert r['authority']=='SOURCE_VETTING_ONLY'
              assert r['selection_authorized'] is False
              expected={(x['name'],x['category'],x['md5']) for x in files}
              actual={(x['name'],x['category'],x['md5']) for x in r['files']}
              assert actual==expected
              assert len(r['files'])==5
              assert all(int(x['bytes'])>0 for x in r['files'])
              assert all(re.fullmatch(r'[0-9a-f]{64}', x['sha256']) for x in r['files'])
              assert len({x['sha256'] for x in r['files']})==5
          PY
          if test -f "$RECEIPT"; then
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reuse=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reuse already reviewed hash receipt without redownloading archives
        if: steps.receipt.outputs.reuse == 'true'
        run: |
          set -euo pipefail
          mkdir -p demand-v3-vetting
          cp .github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-source-vetting-receipt.json             demand-v3-vetting/receipt.json
          sha256sum demand-v3-vetting/receipt.json > demand-v3-vetting/SHA256SUMS

      - name: Download exact upstream archives and compute SHA256
        if: steps.receipt.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          CANDIDATE=.github/research/continuous-optimization/development-v3/demand-domain-expansion-v3-candidate.json
          mkdir -p /tmp/demand-v3-vetting demand-v3-vetting
          : > demand-v3-vetting/hashes.tsv
          jq -c '.candidate_files[]' "$CANDIDATE" | while read -r row; do
            name=$(jq -r .name <<<"$row")
            category=$(jq -r .category <<<"$row")
            expected_md5=$(jq -r .md5 <<<"$row")
            url="https://zenodo.org/records/1227121/files/$name?download=1"
            path="/tmp/demand-v3-vetting/$name"
            curl -L --fail --retry 3 --retry-delay 2 --connect-timeout 30 \
              --max-time 420 -o "$path" "$url"
            actual_md5=$(md5sum "$path" | awk '{print $1}')
            test "$actual_md5" = "$expected_md5" || {
              echo "MD5 mismatch for $name" >&2
              exit 1
            }
            actual_sha256=$(sha256sum "$path" | awk '{print $1}')
            actual_bytes=$(stat -c %s "$path")
            printf '%s\t%s\t%s\t%s\t%s\n' \
              "$name" "$category" "$actual_bytes" "$actual_md5" "$actual_sha256" \
              >> demand-v3-vetting/hashes.tsv
            rm -f "$path"
          done

      - name: Seal new source-vetting receipt
        if: steps.receipt.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          rows=[]
          with Path('demand-v3-vetting/hashes.tsv').open() as f:
              for row in csv.reader(f, delimiter='\t'):
                  rows.append({
                    'name':row[0],
                    'category':row[1],
                    'bytes':int(row[2]),
                    'md5':row[3],
                    'sha256':row[4],
                  })
          assert len(rows)==5
          assert len({x['sha256'] for x in rows})==5
          receipt={
            'schema_version':1,
            'candidate_id':'public-development-demand-domain-expansion-v3',
            'authority':'SOURCE_VETTING_ONLY',
            'upstream_record':'https://zenodo.org/records/1227121',
            'doi':'10.5281/zenodo.1227121',
            'files':rows,
            'selection_authorized':False,
            'next_step':'review receipt then create SHA256-pinned development-v3 lock',
          }
          Path('demand-v3-vetting/receipt.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          PY
          sha256sum demand-v3-vetting/receipt.json > demand-v3-vetting/SHA256SUMS

      - name: Upload source-vetting receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demand-domain-expansion-v3-source-vetting-${{ github.run_id }}
          path: demand-v3-vetting/
          retention-days: 30
          if-no-files-found: error

  realman-val-csv-d1q:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Limit D1 execution to changed source research paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq '^(tests/validation/frontend_evolution/realman_val_csv_d1\.py|docs/research/frontend-evolution-v1/REALMAN_VAL_CSV_D1\.md|\.github/workflows/research-development-dataset-source-vetting\.yml)$' <<< "$changed"; then
            echo 'd1=true' >> "$GITHUB_OUTPUT"
          else
            echo 'd1=false' >> "$GITHUB_OUTPUT"
          fi

      - name: D1 offline parser, origin and budget negatives
        if: steps.scope.outputs.d1 == 'true'
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_source_metadata_d0.py --check
          python3 tests/validation/frontend_evolution/realman_val_csv_d1.py self-test

      - name: Confirm frozen original D1 block and separate D1Q metadata-only diagnostic
        id: intake
        if: steps.scope.outputs.d1 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realman-d1-evidence "$RUNNER_TEMP/realman-val-d1"
          set +e
          python3 tests/validation/frontend_evolution/realman_val_csv_d1.py admit \
            --workspace "$RUNNER_TEMP/realman-val-d1" \
            --receipt realman-d1-evidence/receipt.json > realman-d1-evidence/fetch.log 2>&1
          original_d1_rc=$?
          set -e
          test "$original_d1_rc" -eq 1
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("realman-d1-evidence/receipt.json").read_text(encoding="utf-8"))
          assert r["decision"] == "REALMAN_VAL_CSV_SOURCE_ADMISSION_BLOCKED"
          assert r["failure_code"] == "CSV_SCHEMA_MISMATCH"
          assert r["csv_bytes_verified"] is False
          assert r["audio_bytes_admitted"] is False and r["shipping_authority"] is False
          assert r["dataset_revision"] == "fea47505cae8041f4b652b0954ba61c77d2b6df1"
          assert [(x["family"],x["bytes"],x["sha256"]) for x in r["files"]] == [
              ("static",667203,"1f0be80d4ab1cc023e7599bf7e564f84acaf36ccad73fd59c992cc9e853f1233"),
              ("moving",2458884,"542f04d011c2b6fbdd49bfa51c423942fe854e7e0615fb1f67954c762ad20bf5"),
          ]
          assert r["blocked_sources"] == [{
              "family":"static", "failure_code":"CSV_SCHEMA_MISMATCH",
              "parse_failure_reason":"nonpositive source distance"}]
          q=r["d1q_preview"]
          assert q["decision"] == "REALMAN_D1Q_SCENE_QUARANTINE_METADATA_DIAGNOSTIC_ONLY"
          assert q["original_d1_source_admitted"] is False and q["audio_bytes_admitted"] is False
          assert q["doa_scores_reported"] is False and q["shipping_authority"] is False
          assert q["excluded_whole_scene"] == "Car-Electric"
          assert q["static"]["original_row_count"] == 3762
          assert q["static"]["quarantined_whole_scene_rows"] == 544
          assert q["static"]["retained_row_count"] == 3218
          assert q["static"]["disclosed_invalid_distance_rows"] == 544
          assert q["moving"]["original_row_count"] == 2909
          assert q["moving"]["quarantined_whole_scene_rows"] == 0
          assert q["moving"]["retained_row_count"] == 2909
          assert q["static"]["retained_scene_count"] == 13
          assert q["moving"]["retained_scene_count"] == 13
          assert len(q["common_retained_label_scenes"]) == 13
          print("D1_ORIGINAL_BLOCK_PRESERVED_AND_D1Q_METADATA_DIAGNOSTIC_ONLY")
          PY

      - name: Independently rehash and reparse ephemeral CSV evidence
        if: always() && steps.intake.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_val_csv_d1.py verify \
            --workspace "$RUNNER_TEMP/realman-val-d1" \
            --receipt realman-d1-evidence/receipt.json > realman-d1-evidence/verify.log 2>&1

      - name: Seal source receipt and two logs with SHA256SUMS
        if: always() && steps.intake.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cd realman-d1-evidence
          sha256sum receipt.json fetch.log verify.log > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain original D1 BLOCKED and D1Q diagnostic evidence
        if: always() && steps.intake.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realman-val-csv-d1q-${{ github.run_id }}
          path: realman-d1-evidence/
          retention-days: 30
          if-no-files-found: error

  realman-scene-archive-d2-s0:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Scope pinned directory research to D2-S0 source paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq '^(tests/validation/frontend_evolution/realman_scene_tree_d2_s0\.py|docs/research/frontend-evolution-v1/REALMAN_SCENE_ARCHIVE_D2_S0\.md|\.github/workflows/research-development-dataset-source-vetting\.yml)$' <<< "$changed"; then
            echo 'd2=true' >> "$GITHUB_OUTPUT"
          else
            echo 'd2=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Offline tree-URL, parser, source and receipt negatives
        if: steps.scope.outputs.d2 == 'true'
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_scene_tree_d2_s0.py self-test

      - name: Read only exact-revision scene RAR tree JSON metadata
        id: collect
        if: steps.scope.outputs.d2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realman-d2-s0-evidence "$RUNNER_TEMP/realman-d2-s0"
          python3 tests/validation/frontend_evolution/realman_scene_tree_d2_s0.py collect \
            --workspace "$RUNNER_TEMP/realman-d2-s0" \
            --receipt realman-d2-s0-evidence/receipt.json > realman-d2-s0-evidence/collect.log 2>&1

      - name: Independently verify raw provider JSON and canonical receipt
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_scene_tree_d2_s0.py verify \
            --workspace "$RUNNER_TEMP/realman-d2-s0" \
            --receipt realman-d2-s0-evidence/receipt.json > realman-d2-s0-evidence/verify.log 2>&1

      - name: Seal source metadata receipt and two independent logs
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cd realman-d2-s0-evidence
          sha256sum receipt.json collect.log verify.log > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain pinned tree source metadata and failure evidence only
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realman-scene-archive-d2-s0-${{ github.run_id }}
          path: realman-d2-s0-evidence/
          retention-days: 30
          if-no-files-found: error

  realman-one-archive-d2-s1:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Scope byte feasibility to one new research file set
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only HEAD^1 HEAD)"
          # S2 reuses S1's exact hash-checked downloader, so on a S2-only
          # change it executes one source transfer, not two concurrent 447MB pulls.
          if grep -Eq '^(tests/validation/frontend_evolution/realman_flac_quartets_d2_s2\.py|docs/research/frontend-evolution-v1/REALMAN_FLAC_QUARTETS_D2_S2\.md|tests/validation/frontend_evolution/realman_pcm_md5_d2_s3\.py|tests/validation/frontend_evolution/realman_s2_frozen_anchor_d2_s3\.json|docs/research/frontend-evolution-v1/REALMAN_PCM_MD5_D2_S3\.md)$' <<< "$changed" &&
             ! grep -Eq '^(tests/validation/frontend_evolution/realman_single_archive_d2_s1\.py|docs/research/frontend-evolution-v1/REALMAN_ARCHIVE_D2_S1\.md)$' <<< "$changed"; then
            echo 'd2s1=false' >> "$GITHUB_OUTPUT"
          elif grep -Eq '^(tests/validation/frontend_evolution/realman_single_archive_d2_s1\.py|docs/research/frontend-evolution-v1/REALMAN_ARCHIVE_D2_S1\.md|\.github/workflows/research-development-dataset-source-vetting\.yml)$' <<< "$changed"; then
            echo 'd2s1=true' >> "$GITHUB_OUTPUT"
          else
            echo 'd2s1=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Offline immutable URL, budget, digest, and receipt tamper tests
        if: steps.scope.outputs.d2s1 == 'true'
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_scene_tree_d2_s0.py self-test
          python3 tests/validation/frontend_evolution/realman_single_archive_d2_s1.py self-test

      - name: Stream exactly one pinned Gym RAR into runner ephemeral storage
        id: collect
        if: steps.scope.outputs.d2s1 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realman-d2-s1-evidence "$RUNNER_TEMP/realman-d2-s1"
          python3 tests/validation/frontend_evolution/realman_single_archive_d2_s1.py collect \
            --workspace "$RUNNER_TEMP/realman-d2-s1" \
            --receipt realman-d2-s1-evidence/receipt.json > realman-d2-s1-evidence/collect.log 2>&1

      - name: Independently rehash exact archive bytes and audit receipt
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_single_archive_d2_s1.py verify \
            --workspace "$RUNNER_TEMP/realman-d2-s1" \
            --receipt realman-d2-s1-evidence/receipt.json > realman-d2-s1-evidence/verify.log 2>&1

      - name: Destroy ephemeral RAR bytes before evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/realman-d2-s1/Gym.rar"
          test ! -f "$RUNNER_TEMP/realman-d2-s1/Gym.rar"

      - name: Seal two independent logs and source-hash receipt
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cd realman-d2-s1-evidence
          sha256sum receipt.json collect.log verify.log > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain metadata and bounded negative evidence; never RAR or FLAC
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realman-one-archive-d2-s1-${{ github.run_id }}
          path: realman-d2-s1-evidence/
          retention-days: 30
          if-no-files-found: error

  realman-flac-quartets-d2-s2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Scope precise S2 original FLAC research to changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq '^(tests/validation/frontend_evolution/realman_flac_quartets_d2_s2\.py|docs/research/frontend-evolution-v1/REALMAN_FLAC_QUARTETS_D2_S2\.md)$' <<< "$changed"; then
            echo 's2=true' >> "$GITHUB_OUTPUT"
          else
            echo 's2=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Source guard + FLAC STREAMINFO offline negative regression
        if: steps.scope.outputs.s2 == 'true'
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_single_archive_d2_s1.py self-test
          python3 tests/validation/frontend_evolution/realman_flac_quartets_d2_s2.py self-test

      - name: Read exactly eight preregistered original FLAC members on fresh RAR
        id: collect
        if: steps.scope.outputs.s2 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realman-d2-s2-evidence "$RUNNER_TEMP/realman-d2-s2"
          python3 tests/validation/frontend_evolution/realman_flac_quartets_d2_s2.py collect \
            --workspace "$RUNNER_TEMP/realman-d2-s2" \
            --receipt realman-d2-s2-evidence/receipt.json > realman-d2-s2-evidence/collect.log 2>&1

      - name: Independently verify original archive + eight FLAC streaminfo/readbacks
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_flac_quartets_d2_s2.py verify \
            --workspace "$RUNNER_TEMP/realman-d2-s2" \
            --receipt realman-d2-s2-evidence/receipt.json > realman-d2-s2-evidence/verify.log 2>&1

      - name: Delete all ephemeral archive and original FLAC bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          rm -f "$RUNNER_TEMP/realman-d2-s2/Gym.rar"
          rm -f "$RUNNER_TEMP/realman-d2-s2/"{static,moving}-ch{1,3,5,7}.flac
          test ! -f "$RUNNER_TEMP/realman-d2-s2/Gym.rar"
          for role in static moving; do
            for ch in 1 3 5 7; do
              test ! -f "$RUNNER_TEMP/realman-d2-s2/$role-ch$ch.flac"
            done
          done

      - name: Seal metadata-only FLAC receipt and independent logs
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cd realman-d2-s2-evidence
          sha256sum receipt.json collect.log verify.log > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain research source-only evidence without RAR FLAC PCM CSV
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realman-flac-quartets-d2-s2-${{ github.run_id }}
          path: realman-d2-s2-evidence/
          retention-days: 30
          if-no-files-found: error

  realman-pcm-integrity-d2-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Scope frozen original decoded PCM study to new S3 paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          changed="$(git diff --name-only HEAD^1 HEAD)"
          if grep -Eq '^(tests/validation/frontend_evolution/realman_pcm_md5_d2_s3\.py|tests/validation/frontend_evolution/realman_s2_frozen_anchor_d2_s3\.json|docs/research/frontend-evolution-v1/REALMAN_PCM_MD5_D2_S3\.md)$' <<< "$changed"; then
            echo 's3=true' >> "$GITHUB_OUTPUT"
          else
            echo 's3=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Offline S1/S2 provenance guards and S3 PCM integrity negatives
        if: steps.scope.outputs.s3 == 'true'
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_single_archive_d2_s1.py self-test
          python3 tests/validation/frontend_evolution/realman_flac_quartets_d2_s2.py self-test
          python3 tests/validation/frontend_evolution/realman_pcm_md5_d2_s3.py self-test

      - name: Download only frozen Gym RAR and independently decode 8 original FLAC PCM streams
        id: collect
        if: steps.scope.outputs.s3 == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p realman-d2-s3-evidence "$RUNNER_TEMP/realman-d2-s3"
          python3 tests/validation/frontend_evolution/realman_pcm_md5_d2_s3.py collect \
            --workspace "$RUNNER_TEMP/realman-d2-s3" \
            --receipt realman-d2-s3-evidence/receipt.json > realman-d2-s3-evidence/collect.log 2>&1

      - name: Independent full original archive, FLAC and decoded PCM readback
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/realman_pcm_md5_d2_s3.py verify \
            --workspace "$RUNNER_TEMP/realman-d2-s3" \
            --receipt realman-d2-s3-evidence/receipt.json > realman-d2-s3-evidence/verify.log 2>&1

      - name: Delete all ephemeral original archive, FLAC and any intermediate bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNNER_TEMP"
          case "$RUNNER_TEMP" in
            /*) ;;
            *) exit 1 ;;
          esac
          if test -e "$RUNNER_TEMP/realman-d2-s3"; then
            test -d "$RUNNER_TEMP/realman-d2-s3"
            rm -rf -- "$RUNNER_TEMP/realman-d2-s3"
          fi
          test ! -e "$RUNNER_TEMP/realman-d2-s3"
          if test -d realman-d2-s3-evidence; then
            test "$(find realman-d2-s3-evidence -type f ! -name receipt.json ! -name collect.log ! -name verify.log ! -name SHA256SUMS | wc -l)" -eq 0
          fi

      - name: Seal metadata-only receipt and two independent execution logs
        if: always() && steps.collect.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          cd realman-d2-s3-evidence
          sha256sum receipt.json collect.log verify.log > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Retain only source-integrity receipt and logs for 30 days
        if: always() && steps.collect.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: realman-pcm-integrity-d2-s3-${{ github.run_id }}
          path: realman-d2-s3-evidence/
          retention-days: 30
          if-no-files-found: error


