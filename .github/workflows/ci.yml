name: CI

on:
  workflow_call:
    inputs:
      composition_matrix:
        type: string
        required: false
        default: '["composition-low","composition-tiny","composition-voice-frontend","composition-raw","composition-aec-only","composition-ns-only","composition-activity-only","composition-fast-resampler"]'
      arm_matrix:
        type: string
        required: false
        default: '["armv7a-scalar","cortex-a7-scalar","cortex-a7-neon","cortex-a32-neon","aarch64-neon"]'
      run_composition:
        type: boolean
        required: false
        default: true
      run_arm:
        type: boolean
        required: false
        default: true
      run_perf:
        type: boolean
        required: false
        default: true
      run_extended:
        type: boolean
        required: false
        default: true
      run_alsa:
        type: boolean
        required: false
        default: true
      run_aec_backend:
        type: boolean
        required: false
        default: true
      run_ns_backend:
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_TOOLCHAIN_IMAGE: ghcr.io/jiying2007/audio-pipeline-ci@sha256:4106ce8c0aa63d87ad233d87a51d23b2098dc526e9604ae6fd9d08ec5c3069db

jobs:
  composition-contract:
    if: inputs.run_composition
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(inputs.composition_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: composition-${{ matrix.preset }}
      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build ${{ matrix.preset }}
        run: cmake --build build/${{ matrix.preset }} --parallel
      - name: Test ${{ matrix.preset }}
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - name: Install composition SDK
        run: |
          prefix="$PWD/stage/${{ matrix.preset }}"
          cmake --install build/${{ matrix.preset }} --prefix "$prefix"
          test -f "$prefix/lib/libaudio_pipeline.a"
          test -f "$prefix/include/audio_pipeline/audio_types.h"
          test -f "$prefix/include/audio_pipeline/audio_modules.h"
          test -f "$prefix/include/audio_pipeline/audio_pipeline_build.h"
          case "${{ matrix.preset }}" in
            composition-aec-only|composition-ns-only|composition-activity-only)
              test ! -e "$prefix/include/audio_pipeline/audio_pipeline.h" ;;
            *) test -f "$prefix/include/audio_pipeline/audio_pipeline.h" ;;
          esac
          ccache --show-stats

  composition-size-contract:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: composition-size
      - name: Configure representative graphs
        run: |
          cmake --preset composition-full
          cmake --preset composition-low
          cmake --preset composition-tiny
          cmake --preset composition-raw
      - name: Build state-size probes
        run: |
          for p in full low tiny raw; do cmake --build "build/composition-$p" --target ap_state_size --parallel; done
      - name: Verify physical RAM pruning
        run: |
          full=$(./build/composition-full/ap_state_size)
          low=$(./build/composition-low/ap_state_size)
          tiny=$(./build/composition-tiny/ap_state_size)
          raw=$(./build/composition-raw/ap_state_size)
          echo "pipeline_state_bytes full=$full low=$low tiny=$tiny raw=$raw"
          test "$low" -lt "$full"
          test "$tiny" -lt "$low"
          test "$raw" -lt "$tiny"

  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: native-${{ matrix.compiler }}
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install SDK smoke
        run: |
          cmake --install build --prefix "$PWD/stage"
          test -f stage/lib/libaudio_pipeline.a
          test -f stage/lib/libaudio_pipeline_runtime.a
          test -f stage/include/audio_pipeline/audio_types.h
          test -f stage/include/audio_pipeline/audio_pipeline.h
          test -f stage/include/audio_pipeline/audio_modules.h
          test -f stage/include/audio_pipeline/audio_pipeline_build.h
          test -f stage/include/audio_pipeline/audio_runtime.h
      - name: Benchmark smoke
        run: ./build/ap_bench 2 0.35 9000 active
      - name: Idle benchmark smoke
        run: ./build/ap_bench 2 0.35 9000 idle
      - name: Runtime benchmark smoke
        run: ./build/ap_runtime_bench 1 0 0.99 -1
      - name: Cache statistics
        run: ccache --show-stats

  perf-compare:
    if: inputs.run_perf && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: perf-gcc
      - name: Same-runner main vs candidate
        env:
          CC: gcc
        run: sh scripts/compare-perf.sh origin/main 7 20
      - name: Same-runner isolated NS paths
        env:
          CC: gcc
        run: sh scripts/compare-ns-perf.sh origin/main 7 50000
      - name: Same-runner boundary resampler paths
        env:
          CC: gcc
        run: sh scripts/compare-resampler-perf.sh origin/main 7 100000

  runtime-perf-compare:
    if: inputs.run_perf && inputs.run_extended && github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: runtime-perf-gcc
      - name: Same-runner runtime main vs candidate
        env:
          CC: gcc
        run: sh scripts/compare-runtime-perf.sh origin/main 7 100000 10000

  backend-nlms:
    if: inputs.run_aec_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: backend-nlms
      - name: Configure NLMS backend
        env:
          CC: clang
        run: >-
          cmake -S . -B build-nlms -DCMAKE_BUILD_TYPE=Release
          -DAP_AEC_BACKEND=NLMS -DAP_ENABLE_LINUX_RUNTIME=OFF
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build and test
        run: |
          cmake --build build-nlms --parallel
          ctest --test-dir build-nlms --output-on-failure

  backend-ns-mcra:
    if: inputs.run_ns_backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: backend-ns-mcra
      - name: Configure MCRA noise estimator
        env:
          CC: clang
        run: >-
          cmake -S . -B build-ns-mcra -DCMAKE_BUILD_TYPE=Release
          -DAP_NS_ESTIMATOR=MCRA -DAP_ENABLE_LINUX_RUNTIME=OFF
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build and test
        run: |
          cmake --build build-ns-mcra --parallel
          ctest --test-dir build-ns-mcra --output-on-failure

  fast-math-contract:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: fast-math
      - name: Configure explicit fast-math policy
        env:
          CC: gcc
        run: >-
          cmake -S . -B build-fast -DCMAKE_BUILD_TYPE=Release
          -DAP_ENABLE_FAST_MATH=ON -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF
      - name: Build and test
        run: |
          cmake --build build-fast --parallel
          ctest --test-dir build-fast --output-on-failure

  sanitizers:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: asan-ubsan
      - name: Configure ASan/UBSan
        env:
          CC: clang
        run: >-
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DAP_BUILD_BENCH=OFF
          -DCMAKE_C_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Build and test
        run: |
          cmake --build build-san --parallel
          ctest --test-dir build-san --output-on-failure

  fuzz-smoke:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: fuzz-smoke
      - name: Configure libFuzzer
        env:
          CC: clang
        run: >-
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_FUZZ=ON -DAP_BUILD_TESTS=OFF -DAP_BUILD_BENCH=OFF
          -DAP_BUILD_EXAMPLES=OFF -DAP_ENABLE_LINUX_RUNTIME=OFF
      - name: Build and fuzz smoke
        run: |
          cmake --build build-fuzz --target ap_fuzz --parallel
          ./build-fuzz/ap_fuzz -runs=2000 -max_len=4096

  alsa-compile:
    if: inputs.run_alsa
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:4106ce8c0aa63d87ad233d87a51d23b2098dc526e9604ae6fd9d08ec5c3069db
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: alsa-clang
      - name: Configure ALSA examples
        env:
          CC: clang
        run: >-
          cmake -S . -B build-alsa -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_ALSA_EXAMPLE=ON -DAP_BUILD_TESTS=OFF -DAP_BUILD_BENCH=OFF
          -DAP_STRICT_WARNINGS=ON
      - name: Build ALSA examples
        run: cmake --build build-alsa --target ap_alsa_duplex ap_alsa_runtime_duplex --parallel

  arm-cross:
    if: inputs.run_arm
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:4106ce8c0aa63d87ad233d87a51d23b2098dc526e9604ae6fd9d08ec5c3069db
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(inputs.arm_matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: arm-${{ matrix.preset }}
      - name: Configure ${{ matrix.preset }}
        run: cmake --preset ${{ matrix.preset }}
      - name: Build ${{ matrix.preset }}
        run: cmake --build build/${{ matrix.preset }} --parallel
      - name: Cache statistics
        run: ccache --show-stats
