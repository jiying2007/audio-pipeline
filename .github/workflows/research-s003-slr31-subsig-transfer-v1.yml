name: Research S003 SLR31 Subsignature Transfer v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json'
      - 'docs/program/iterations/S003-cross-source-artifact-exclusion-v1-result.json'
      - 'docs/program/iterations/S001.json'
      - '.github/research/continuous-optimization/development-data-v3/development.lock.json'
      - 'validation/tools/build_slr31_subsig_transfer_corpus.py'
      - 'validation/tools/slr31_subsig_transfer.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'validation/tools/stage_interaction_attribution.py'
      - 'validation/policies/validation-s003-slr31-subsig-transfer.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-slr31-subsig-transfer-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json'
      - 'docs/program/iterations/S003-cross-source-artifact-exclusion-v1-result.json'
      - 'docs/program/iterations/S001.json'
      - '.github/research/continuous-optimization/development-data-v3/development.lock.json'
      - 'validation/tools/build_slr31_subsig_transfer_corpus.py'
      - 'validation/tools/slr31_subsig_transfer.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'validation/tools/stage_interaction_attribution.py'
      - 'validation/policies/validation-s003-slr31-subsig-transfer.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - '.github/workflows/research-s003-slr31-subsig-transfer-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-s003-slr31-subsig-transfer-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-slr31-subsig-transfer

      - name: Validate candidate-zero contract and source lock
        run: |
          set -euo pipefail
          python3 -m json.tool docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json >/dev/null
          python3 -m json.tool validation/policies/validation-s003-slr31-subsig-transfer.json >/dev/null
          python3 -m py_compile             validation/tools/build_slr31_subsig_transfer_corpus.py             validation/tools/slr31_subsig_transfer.py             validation/tools/stage_interaction_run.py             validation/tools/stage_interaction_attribution.py
          python3 validation/tools/build_slr31_subsig_transfer_corpus.py --self-test
          python3 validation/tools/slr31_subsig_transfer.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json').read_text())
          prior=json.loads(Path('docs/program/iterations/S003-cross-source-artifact-exclusion-v1-result.json').read_text())
          lock=json.loads(Path('.github/research/continuous-optimization/development-data-v3/development.lock.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_DIAGNOSTIC_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['promotion_allowed'] is False and c['shipping_change_allowed'] is False
          assert c['fresh_seeds']==[9307,9407]
          assert c['microset']['utterance_count']==8
          assert c['preregistered_evidence_rules']['minimum_reproduced_utterances_per_seed']==6
          assert c['authority_boundary']['may_open_s004'] is False
          assert prior['status']==c['predecessor']['required_status']
          assert prior['s004_review']['open'] is False
          matches=[x for x in lock['archives'] if x['id']==c['public_source']['archive_id']]
          assert len(matches)==1
          src=matches[0]
          for key in ('bytes','sha256','license','usage_class'):
              assert src[key]==c['public_source'][f'archive_{key}' if key in ('bytes','sha256') else key],(key,src[key])
          assert src['role']==c['public_source']['archive_role']
          print('S003 SLR31 authority and source lock: PASS')
          PY

      - name: Download and verify exact SLR31 clean-speech archive
        run: |
          set -euo pipefail
          mkdir -p /tmp/s003-slr31
          python3 - <<'PY'
          import hashlib,json,shutil,tarfile,urllib.request
          from pathlib import Path

          c=json.loads(Path('docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json').read_text())
          lock=json.loads(Path(c['public_source']['lock_path']).read_text())
          src=next(x for x in lock['archives'] if x['id']==c['public_source']['archive_id'])
          archive=Path('/tmp/s003-slr31/source.tar.gz')
          req=urllib.request.Request(src['url'],headers={'User-Agent':'audio-pipeline-s003-slr31/1'})
          h=hashlib.sha256()
          size=0
          with urllib.request.urlopen(req,timeout=240) as response, archive.open('wb') as out:
              while True:
                  chunk=response.read(1024*1024)
                  if not chunk: break
                  size += len(chunk)
                  h.update(chunk)
                  out.write(chunk)
          assert size==src['bytes'],(size,src['bytes'])
          assert h.hexdigest()==src['sha256'],h.hexdigest()
          extract=Path('/tmp/s003-slr31/extracted')
          extract.mkdir()
          with tarfile.open(archive,'r:gz') as tf:
              members=tf.getmembers()
              for member in members:
                  p=Path(member.name)
                  assert not p.is_absolute() and '..' not in p.parts,member.name
                  assert not member.issym() and not member.islnk(),member.name
              tf.extractall(extract,members=members)
          flacs=list(extract.rglob('*.flac'))
          assert len(flacs)>=8,len(flacs)
          print({'archive_bytes':size,'sha256':h.hexdigest(),'flac_files':len(flacs)})
          PY
          command -v ffmpeg
          ffmpeg -version | head -n 1

      - name: Build test-only stage-prefix processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-slr31             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-slr31 --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-slr31/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-slr31/libaudio_pipeline.a -lm             -o build-s003-slr31/stage_prefix_process_pcm

      - name: Run fresh SLR31 stage-prefix diagnostics
        run: |
          set -euo pipefail
          out=s003-slr31-out
          mkdir -p "$out"
          archive_sha=47805806c8b15f7549f3c51bd6b7da72ec0128a34d32830c8014a88658c0292d

          for seed in 9307 9407; do
            corpus="/tmp/s003-slr31-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"
            python3 validation/tools/build_slr31_subsig_transfer_corpus.py               --source-root /tmp/s003-slr31/extracted               --archive-sha256 "$archive_sha"               --output "$corpus"               --seed "$seed"

            python3 validation/tools/stage_interaction_run.py               --source-revision '${{ github.sha }}'               --corpus "$corpus/corpus.json"               --policy validation/policies/validation-s003-slr31-subsig-transfer.json               --dataset-lock .github/research/continuous-optimization/development-data-v3/development.lock.json               --source-manifest "$corpus/source-manifest.json"               --processor build-s003-slr31/stage_prefix_process_pcm               --output "$seed_out/report.json"               --evidence-manifest "$seed_out/evidence-manifest.json"               --enforce

            python3 validation/tools/stage_interaction_attribution.py               --corpus "$corpus/corpus.json"               --report "$seed_out/report.json"               --watch-contract docs/program/iterations/S001.json               --output-dir "$seed_out"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
            cp "$corpus/source-manifest.json" "$seed_out/source-manifest.json"
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('s003-slr31-out/9307/source-manifest.json').read_text())
          b=json.loads(Path('s003-slr31-out/9407/source-manifest.json').read_text())
          pa=[(x['relative_path'],x['speaker_id'],x['sha256']) for x in a['selected']]
          pb=[(x['relative_path'],x['speaker_id'],x['sha256']) for x in b['selected']]
          assert pa==pb
          assert len(pa)==8 and len({x[1] for x in pa})==8
          print({'microset':pa})
          PY

      - name: Aggregate stable subsignature transfer
        run: |
          set -euo pipefail
          python3 validation/tools/slr31_subsig_transfer.py             --contract docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json             --attribution s003-slr31-out/9307/stage-interaction-attribution.json             --attribution s003-slr31-out/9407/stage-interaction-attribution.json             --output s003-slr31-out/slr31-subsig-transfer.json

          cp docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json             s003-slr31-out/contract.json
          git rev-parse HEAD > s003-slr31-out/source-sha.txt
          find s003-slr31-out -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > s003-slr31-out/SHA256SUMS

      - name: Publish diagnostic outcome
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-slr31-out/slr31-subsig-transfer.json').read_text())
          print('## S003 SLR31 public clean-speech subsignature transfer')
          print('')
          print('- Authority: **candidate-zero / diagnostic-only / non-shipping**')
          print(f"- Source family: `{r['source_family']}`")
          print(f"- Fresh seeds: `{r['fresh_seeds']}`")
          print(f"- Required subsignature: `{r['required_subsignature']}`")
          for failure_id,item in r['failures'].items():
              counts=[x['subsignature_reproduced_utterances'] for x in item['per_seed']]
              print(f"- `{failure_id}`: repeated=`{item['second_public_family_repetition_satisfied']}`, counts=`{counts}`")
              for obs in item['per_seed']:
                  print(f"  - seed `{obs['seed']}`: stages `{obs['first_observable_stage_distribution']}`")
          print(f"- Multiple-public-dataset blocker satisfied: `{r['multiple_public_dataset_repetition_blocker_satisfied']}`")
          print('- S004 candidate authority: **none**')
          PY

      - name: Upload hash-bound diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: s003-slr31-subsig-transfer-${{ github.run_id }}
          path: s003-slr31-out/
          if-no-files-found: error
          retention-days: 30
