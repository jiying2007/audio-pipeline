name: Temporary Run Corrected Tail-aware Selector

on:
  push:
    branches: [opt/aec-motion-multiseed-iteration]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: opt/aec-motion-multiseed-iteration
          fetch-depth: 0
      - name: Execute corrected selector patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/tmp-aec-tail-aware-selection.yml').read_text().splitlines()
          start = src.index("          python3 - <<'PY'") + 1
          end = src.index("          PY", start)
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[start:end]) + '\n'
          old = '{"case_id": "a", "metrics": {"corr": 0.09, "erle": 11.0}}'
          new = '{"case_id": "a", "metrics": {"corr": 0.096, "erle": 11.0}}'
          if body.count(old) != 1:
              raise SystemExit('self-test fixture anchor drift')
          Path('/tmp/tail-aware-patch.py').write_text(body.replace(old, new))
          PY
          python3 /tmp/tail-aware-patch.py
          git diff --check
          python3 -m py_compile validation/tools/tuning_iteration_engine.py
          python3 validation/tools/tuning_iteration.py --self-test
          python3 validation/tools/aec_motion_tuning.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          s = json.loads(Path('validation/tuning/search-spaces/aec-motion-v1.json').read_text())
          assert s['search_space_id'] == 'aec-motion-runtime-safe-v4'
          assert len(s['objective']['case_delta_gates']) == 3
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add validation/tools/tuning_iteration_engine.py validation/tuning/search-spaces/aec-motion-v1.json
          git commit -m 'validation: make motion selection tail aware'
          git push origin HEAD:opt/aec-motion-multiseed-iteration
