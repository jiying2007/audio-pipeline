---
- name: Install audio-target controller packages in dedicated system mode
  become: true
  ansible.builtin.apt:
    name: [alsa-utils, openssh-client, usbutils]
    state: present
  when: lab_system_mode | bool

- name: Validate ordinary-user target controller tools
  ansible.builtin.shell: |
    set -eu
    for cmd in arecord aplay ssh lsusb; do command -v "$cmd" >/dev/null || exit 1; done
  args:
    executable: /bin/sh
  changed_when: false
  when: not (lab_system_mode | bool)

- name: Add HIL service account to hardware access groups in system mode
  become: true
  ansible.builtin.user:
    name: "{{ lab_service_user }}"
    groups: audio,dialout
    append: true
  when: lab_system_mode | bool

- name: Create board/fixture/evidence directories
  become: "{{ lab_system_mode | bool }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ lab_effective_user if (lab_system_mode | bool) else omit }}"
    group: "{{ lab_service_user if (lab_system_mode | bool) else omit }}"
    mode: '0750'
  loop:
    - "{{ lab_audio_target_config_root }}"
    - "{{ lab_audio_target_fixture_root }}"
    - "{{ lab_state_root }}/hil"
    - "{{ lab_log_root }}/hil"

- name: Install reviewed board manifest when supplied
  become: "{{ lab_system_mode | bool }}"
  ansible.builtin.copy:
    src: "{{ audio_target_board_manifest_src }}"
    dest: "{{ lab_audio_target_config_root }}/board.json"
    owner: "{{ 'root' if (lab_system_mode | bool) else omit }}"
    group: "{{ lab_service_user if (lab_system_mode | bool) else omit }}"
    mode: '0640'
  when: audio_target_board_manifest_src | default('') | length > 0

- name: Report explicit board-manifest requirement
  ansible.builtin.debug:
    msg: "No board manifest installed. Put a reviewed product manifest at {{ lab_audio_target_config_root }}/board.json before readiness/HIL."
  when: audio_target_board_manifest_src | default('') | length == 0
