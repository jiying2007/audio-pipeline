name: I009 Closure Migration

on:
  push:
    branches:
      - governance/i009-close-keep-baseline
    paths:
      - '.github/workflows/i009-closure-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: governance/i009-close-keep-baseline
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact I009 terminal migration
        shell: bash
        run: |
          set -euo pipefail
          # Temporary helper applies current-tree structural anchors and deletes itself after validation.
          python3 scripts/i009_closure_migrate.py
          python3 -m json.tool docs/program/plan.json >/dev/null
          python3 -m json.tool docs/program/iterations/I009-closure.json >/dev/null
          python3 scripts/program.py --self-test
          python3 scripts/program.py check >/dev/null
          git diff --check
          rm .github/workflows/i009-closure-migration.yml scripts/i009_closure_migrate.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/program/plan.json scripts/program.py .github/workflows/i009-closure-migration.yml scripts/i009_closure_migrate.py
          git commit -m 'program: close I009 after bounded Activity candidate rejection'
          git push origin HEAD:governance/i009-close-keep-baseline
