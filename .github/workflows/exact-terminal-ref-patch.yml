name: Exact Terminal Ref Patch

on:
  push:
    branches:
      - governance/close-149-head-gc
    paths:
      - '.github/workflows/exact-terminal-ref-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: governance/close-149-head-gc
          fetch-depth: 0
      - name: Add exact-name terminal GC exception for merged PR 149 head
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/program/terminal_branch_gc.py')
          text = path.read_text()
          old = '''    prefixes = data.get("allowed_prefixes")\n    require(isinstance(prefixes, list) and prefixes, "allowed_prefixes must be non-empty")\n    require(all(isinstance(item, str) and item.endswith("/") for item in prefixes),\n            "invalid allowed prefix")\n\n    records = data.get("branches")\n'''
          new = '''    prefixes = data.get("allowed_prefixes")\n    require(isinstance(prefixes, list) and prefixes, "allowed_prefixes must be non-empty")\n    require(all(isinstance(item, str) and item.endswith("/") for item in prefixes),\n            "invalid allowed prefix")\n    exact_names = data.get("allowed_exact_names", [])\n    require(isinstance(exact_names, list), "allowed_exact_names must be a list")\n    require(all(isinstance(item, str) and item and item != "main" for item in exact_names),\n            "invalid exact branch exception")\n    require(len(set(exact_names)) == len(exact_names), "duplicate exact branch exception")\n    require(all(not any(item.startswith(prefix) for prefix in prefixes) for item in exact_names),\n            "exact branch exceptions must remain outside allowed prefixes")\n\n    records = data.get("branches")\n'''
          if text.count(old) != 1:
              raise SystemExit('prefix validation anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''        require(any(branch.startswith(prefix) for prefix in prefixes),\n                f"branch outside allowed prefixes: {branch}")\n'''
          new = '''        require(any(branch.startswith(prefix) for prefix in prefixes) or branch in exact_names,\n                f"branch outside allowed prefixes and exact exceptions: {branch}")\n'''
          if text.count(old) != 1:
              raise SystemExit('record prefix anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''        require(isinstance(sha, str) and SHA_RE.fullmatch(sha) is not None,\n                f"invalid expected SHA: {branch}")\n\n    authority = data.get("authority_boundary")\n'''
          new = '''        require(isinstance(sha, str) and SHA_RE.fullmatch(sha) is not None,\n                f"invalid expected SHA: {branch}")\n    require(set(exact_names).issubset(seen), "exact branch exception missing pinned branch record")\n\n    authority = data.get("authority_boundary")\n'''
          if text.count(old) != 1:
              raise SystemExit('post-record anchor not found exactly once')
          text = text.replace(old, new, 1)

          old = '''    validate_contract(sample)\n    for mutation in (\n'''
          new = '''    validate_contract(sample)\n    exact = json.loads(json.dumps(sample))\n    exact["allowed_exact_names"] = ["codex/one-off"]\n    exact["branches"].append({"name": "codex/one-off", "expected_sha": "b" * 40})\n    validate_contract(exact)\n    unlisted = json.loads(json.dumps(exact))\n    unlisted["allowed_exact_names"] = []\n    try:\n        validate_contract(unlisted)\n    except ValueError:\n        pass\n    else:\n        raise AssertionError("unlisted exact-name branch exception accepted")\n    for mutation in (\n'''
          if text.count(old) != 1:
              raise SystemExit('self-test anchor not found exactly once')
          path.write_text(text.replace(old, new, 1))

          contract = Path('docs/program/terminal-branch-gc.json')
          text = contract.read_text()
          old = '''    "validation/"\n  ],\n  "branches": [\n'''
          new = '''    "validation/"\n  ],\n  "allowed_exact_names": [\n    "codex/maintenance-research-trigger-contract"\n  ],\n  "branches": [\n    {"name": "codex/maintenance-research-trigger-contract", "expected_sha": "3a6ac360056a838dbb4802856de934856142d7e9"},\n'''
          if text.count(old) != 1:
              raise SystemExit('terminal GC contract insertion anchor not found exactly once')
          contract.write_text(text.replace(old, new, 1))
          PY
          python3 .github/program/terminal_branch_gc.py --self-test
          python3 -m json.tool docs/program/terminal-branch-gc.json >/dev/null
          python3 - <<'PY'
          import json
          c=json.load(open('docs/program/terminal-branch-gc.json'))
          assert c['allowed_exact_names'] == ['codex/maintenance-research-trigger-contract']
          r=[x for x in c['branches'] if x['name']=='codex/maintenance-research-trigger-contract']
          assert r == [{'name':'codex/maintenance-research-trigger-contract','expected_sha':'3a6ac360056a838dbb4802856de934856142d7e9'}]
          PY
          rm .github/workflows/exact-terminal-ref-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/program/terminal_branch_gc.py docs/program/terminal-branch-gc.json .github/workflows/exact-terminal-ref-patch.yml
          git diff --cached --check
          git commit -m 'governance: register exact PR 149 head for GC'
          git push origin HEAD:governance/close-149-head-gc
