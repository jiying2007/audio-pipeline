name: Stage v2.2.3 User-Mode Workflow Defaults Once

on:
  push:
    branches: [fix/user-mode-workflow-defaults-v2.2.3]
    paths: [.github/workflows/user-mode-workflow-defaults-v2.2.3-once.yml]

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/user-mode-workflow-defaults-v2.2.3
          fetch-depth: 0

      - name: Generate v2.2.3 candidate and workflow exports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {actual}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('CMakeLists.txt', 'project(audio_pipeline VERSION 2.2.2 LANGUAGES C)', 'project(audio_pipeline VERSION 2.2.3 LANGUAGES C)')
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          if not text.startswith('# 2.2.2\n'):
              raise SystemExit('unexpected CHANGELOG head')
          changelog.write_text(
              '# 2.2.3\n\n'
              '- Align trusted self-hosted workflow defaults with the ordinary-user laboratory model so blank inputs resolve on the runner under HOME instead of requiring `/opt` or `/etc`.\n'
              '- Extended Real now resolves a blank data root to `$HOME/audio-validation-extended`; HIL/Product Certification and target readiness resolve a blank board manifest to `$HOME/.config/audio-pipeline/board.json`; legacy public-validation readiness resolves its blank root/seal below `$HOME/audio-validation-data`.\n'
              '- Preserve explicit absolute overrides for dedicated system-mode labs. No DSP/API/ABI, acoustic/resource/HIL thresholds, dataset hashes/licenses or certification authority changed.\n\n' + text,
              encoding='utf-8')

          replace('lab/README.md', '''sudo -u audio-ci /opt/audio-lab/venv/bin/python lab/scripts/labctl.py verify-profile \\
  --profile commercial-core \\
  --data-root $HOME/audio-validation-extended \\
  --source-revision "$SHA"''', '''$HOME/.local/share/audio-pipeline-lab/venv/bin/python lab/scripts/labctl.py verify-profile \\
  --profile commercial-core \\
  --source-revision "$SHA"''')
          replace('lab/README.md', '''EXTENDED_REAL_ENABLED=true
EXTENDED_REAL_DATA_ROOT=$HOME/audio-validation-extended''', '''EXTENDED_REAL_ENABLED=true
# Optional override only; leave EXTENDED_REAL_DATA_ROOT unset for $HOME/audio-validation-extended.''')

          # Extended Real: blank input resolves on the self-hosted runner, not on the hosted dispatcher.
          replace('.github/workflows/validation-extended-real.yml', '''      data_root:
        description: Caller-materialized extended-real dataset root on audio-validation runner
        required: true
        default: /opt/audio-validation-extended
        type: string''', '''      data_root:
        description: Optional absolute dataset root; blank uses $HOME/audio-validation-extended on audio-validation runner
        required: false
        default: ''
        type: string''')
          replace('.github/workflows/validation-extended-real.yml', '''      - name: Bind exact revision and runner readiness
        env:
          DATA_ROOT: ${{ inputs.data_root }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)''', '''      - name: Bind exact revision and runner readiness
        env:
          INPUT_DATA_ROOT: ${{ inputs.data_root }}
        run: |
          set -euo pipefail
          DATA_ROOT=${INPUT_DATA_ROOT:-$HOME/audio-validation-extended}
          case "$DATA_ROOT" in /*) ;; *) echo 'data_root must be absolute or blank' >&2; exit 2 ;; esac
          echo "DATA_ROOT=$DATA_ROOT" >> "$GITHUB_ENV"
          revision=$(git rev-parse HEAD)''')
          replace('.github/workflows/validation-extended-real.yml', '''          printf '%s\\n' "$revision" > extended-out/source-revision.txt
          python3 tools/runner_preflight.py''', '''          printf '%s\\n' "$revision" > extended-out/source-revision.txt
          printf '%s\\n' "$DATA_ROOT" > extended-out/data-root.txt
          python3 tools/runner_preflight.py''')
          replace('.github/workflows/validation-extended-real.yml', '''      - name: Validate license catalog and scan immutable source manifest
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          PROFILE: ${{ inputs.profile }}''', '''      - name: Validate license catalog and scan immutable source manifest
        env:
          PROFILE: ${{ inputs.profile }}''')
          replace('.github/workflows/validation-extended-real.yml', '''      - name: Build extended-real corpus from hash-bound sources
        env:
          DATA_ROOT: ${{ inputs.data_root }}
          DIRECT_LIMIT: ${{ inputs.direct_limit }}''', '''      - name: Build extended-real corpus from hash-bound sources
        env:
          DIRECT_LIMIT: ${{ inputs.direct_limit }}''')

          # HIL: blank board input resolves to the ordinary user's reviewed board manifest.
          replace('.github/workflows/hil-soak.yml', '''      board_manifest:
        description: Board-local JSON manifest path
        required: true
        default: /etc/audio-pipeline/board.json
        type: string''', '''      board_manifest:
        description: Optional absolute board-local JSON manifest; blank uses $HOME/.config/audio-pipeline/board.json on audio-target
        required: false
        default: ''
        type: string''')
          replace('.github/workflows/hil-soak.yml', '          board=${INPUT_BOARD:-/etc/audio-pipeline/board.json}', '          board=${INPUT_BOARD:-$HOME/.config/audio-pipeline/board.json}')

          # Formal product certification: same target-side default, while explicit system paths remain allowed.
          replace('.github/workflows/product-certification.yml', '''      board_manifest:
        description: Absolute path to the DUT board manifest
        required: true
        default: /etc/audio-pipeline/board.json''', '''      board_manifest:
        description: Optional absolute DUT board manifest; blank uses $HOME/.config/audio-pipeline/board.json on audio-target
        required: false
        default: '' ''')
          replace('.github/workflows/product-certification.yml', '''      - name: Preflight exact audio-target runner and product inputs
        env:
          BOARD: ${{ inputs.board_manifest }}
          CORPUS: ${{ inputs.corpus_manifest }}''', '''      - name: Preflight exact audio-target runner and product inputs
        env:
          INPUT_BOARD: ${{ inputs.board_manifest }}
          CORPUS: ${{ inputs.corpus_manifest }}''')
          replace('.github/workflows/product-certification.yml', '''        run: |
          set -euo pipefail
          python3 tools/runner_preflight.py \\
            --role audio-target \\
            --source-revision '${{ needs.resolve.outputs.sha }}' \\
            --board-manifest "$BOARD" --corpus-manifest "$CORPUS"''', '''        run: |
          set -euo pipefail
          BOARD=${INPUT_BOARD:-$HOME/.config/audio-pipeline/board.json}
          case "$BOARD" in /*) ;; *) echo 'board_manifest must be absolute or blank' >&2; exit 2 ;; esac
          python3 tools/runner_preflight.py \\
            --role audio-target \\
            --source-revision '${{ needs.resolve.outputs.sha }}' \\
            --board-manifest "$BOARD" --corpus-manifest "$CORPUS"''')

          # Trusted readiness defaults follow the same user-mode paths.
          replace('.github/workflows/trusted-runner-readiness.yml', '''      data_root:
        description: audio-validation sealed cache root
        required: false
        default: /opt/audio-validation-data
        type: string
      seal_path:
        description: audio-validation dataset seal
        required: false
        default: /opt/audio-validation-data/datasets.seal.json
        type: string''', '''      data_root:
        description: Optional public-validation cache root; blank uses $HOME/audio-validation-data on audio-validation
        required: false
        default: ''
        type: string
      seal_path:
        description: Optional public-validation dataset seal; blank uses <resolved-data-root>/datasets.seal.json
        required: false
        default: ''
        type: string''')
          replace('.github/workflows/trusted-runner-readiness.yml', '''      board_manifest:
        description: audio-target board manifest when available
        required: false
        default: /etc/audio-pipeline/board.json
        type: string''', '''      board_manifest:
        description: Optional audio-target board manifest; blank uses $HOME/.config/audio-pipeline/board.json
        required: false
        default: ''
        type: string''')
          replace('.github/workflows/trusted-runner-readiness.yml', '''        env:
          DATA_ROOT: ${{ inputs.data_root }}
          SEAL: ${{ inputs.seal_path }}
          DNS_ROOT: ${{ inputs.dns_data_root }}
        run: |
          set -euo pipefail
          args=(''', '''        env:
          INPUT_DATA_ROOT: ${{ inputs.data_root }}
          INPUT_SEAL: ${{ inputs.seal_path }}
          DNS_ROOT: ${{ inputs.dns_data_root }}
        run: |
          set -euo pipefail
          DATA_ROOT=${INPUT_DATA_ROOT:-$HOME/audio-validation-data}
          SEAL=${INPUT_SEAL:-$DATA_ROOT/datasets.seal.json}
          args=(''')
          replace('.github/workflows/trusted-runner-readiness.yml', '''        env:
          BOARD: ${{ inputs.board_manifest }}
          CORPUS: ${{ inputs.corpus_manifest }}''', '''        env:
          INPUT_BOARD: ${{ inputs.board_manifest }}
          CORPUS: ${{ inputs.corpus_manifest }}''')
          replace('.github/workflows/trusted-runner-readiness.yml', '''        run: |
          set -euo pipefail
          args=(--role audio-target --source-revision '${{ needs.resolve.outputs.sha }}' --writable-path /tmp --output runner-readiness.json)
          if [ -n "$BOARD" ]; then args+=(--board-manifest "$BOARD"); fi''', '''        run: |
          set -euo pipefail
          BOARD=${INPUT_BOARD:-$HOME/.config/audio-pipeline/board.json}
          args=(--role audio-target --source-revision '${{ needs.resolve.outputs.sha }}' --writable-path /tmp --output runner-readiness.json)
          args+=(--board-manifest "$BOARD")''')

          # Permanent fail-closed contract: ordinary-user default paths may not regress.
          p = Path('scripts/docs_consistency.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''    if read(root, "lab/requirements-ansible.txt").strip() != "ansible-core==2.19.12":
        errors.append("lab Ansible dependency pin drift")
'''
          insert = anchor + '''    workflow_contracts = {
        ".github/workflows/validation-extended-real.yml": (
            "DATA_ROOT=${INPUT_DATA_ROOT:-$HOME/audio-validation-extended}",
            "default: /opt/audio-validation-extended",
        ),
        ".github/workflows/hil-soak.yml": (
            "board=${INPUT_BOARD:-$HOME/.config/audio-pipeline/board.json}",
            "default: /etc/audio-pipeline/board.json",
        ),
        ".github/workflows/product-certification.yml": (
            "BOARD=${INPUT_BOARD:-$HOME/.config/audio-pipeline/board.json}",
            "default: /etc/audio-pipeline/board.json",
        ),
        ".github/workflows/trusted-runner-readiness.yml": (
            "DATA_ROOT=${INPUT_DATA_ROOT:-$HOME/audio-validation-data}",
            "default: /opt/audio-validation-data",
        ),
    }
    for rel, (required, forbidden) in workflow_contracts.items():
        workflow = read(root, rel)
        if required not in workflow:
            errors.append(f"{rel}: missing ordinary-user workflow default contract")
        if forbidden in workflow:
            errors.append(f"{rel}: stale system-mode path remains a workflow default: {forbidden}")
    readiness = read(root, ".github/workflows/trusted-runner-readiness.yml")
    if "SEAL=${INPUT_SEAL:-$DATA_ROOT/datasets.seal.json}" not in readiness:
        errors.append("trusted runner readiness missing HOME-relative public seal default")
    if "BOARD=${INPUT_BOARD:-$HOME/.config/audio-pipeline/board.json}" not in readiness:
        errors.append("trusted runner readiness missing ordinary-user board default")
'''
          if text.count(anchor) != 1:
              raise SystemExit('docs_consistency anchor drift')
          p.write_text(text.replace(anchor, insert), encoding='utf-8')
          PY

          mkdir -p workflow-export
          cp .github/workflows/validation-extended-real.yml workflow-export/validation-extended-real.yml
          cp .github/workflows/hil-soak.yml workflow-export/hil-soak.yml
          cp .github/workflows/product-certification.yml workflow-export/product-certification.yml
          cp .github/workflows/trusted-runner-readiness.yml workflow-export/trusted-runner-readiness.yml

      - name: Validate generated candidate before publishing exports
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile lab/scripts/labctl.py scripts/docs_consistency.py
          python3 lab/scripts/labctl.py self-test
          python3 scripts/docs_consistency.py --self-test
          python3 scripts/docs_consistency.py
          python3 validation/tools/extended_dataset_lock.py validate --catalog validation/extended.datasets.lock.json >/tmp/catalog.json
          ruby -e 'require "yaml"; ARGV.each { |f| YAML.load_file(f); puts "yaml ok: #{f}" }' \
            .github/workflows/validation-extended-real.yml \
            .github/workflows/hil-soak.yml \
            .github/workflows/product-certification.yml \
            .github/workflows/trusted-runner-readiness.yml
          ./scripts/check-architecture.sh
          cmake -S . -B build-v223 -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-v223 --parallel
          ctest --test-dir build-v223 --output-on-failure

      - name: Push non-workflow candidate and validated workflow byte exports
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- \
            .github/workflows/validation-extended-real.yml \
            .github/workflows/hil-soak.yml \
            .github/workflows/product-certification.yml \
            .github/workflows/trusted-runner-readiness.yml
          git config user.name jiying2007
          git config user.email 33591504+jiying2007@users.noreply.github.com
          git add CMakeLists.txt CHANGELOG.md lab/README.md scripts/docs_consistency.py workflow-export
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m 'release: v2.2.3 ordinary-user workflow defaults'
          git push origin HEAD:fix/user-mode-workflow-defaults-v2.2.3
