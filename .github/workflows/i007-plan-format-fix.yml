name: I007 Plan Format Fix

on:
  push:
    branches:
      - governance/i007-close-keep-baseline
    paths:
      - '.github/workflows/i007-plan-format-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      PROGRAM_BASE: af9601b7805c8543feddc34c71a555c8abc6b672
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Restore plan formatting and replace only I007 block
        shell: bash
        run: |
          set -euo pipefail
          git show "$PROGRAM_BASE:docs/program/plan.json" > /tmp/plan.base.json
          python3 - <<'PY'
          from pathlib import Path
          path=Path('/tmp/plan.base.json')
          text=path.read_text()
          old='''    {\n      "id": "I007", "priority": 70, "status": "PLANNED", "lane": "acoustic",\n      "title": "BF wind, motion, phase mismatch and reverberant health evidence beyond the released hard-fault fixture",\n      "depends_on": ["P001"], "handler": null, "contract": null,\n      "exit": "Frontend-equivalent oracle, fault-specific health selection, exact-base non-target protection and recovery",\n      "evidence": []\n    },\n'''
          new='''    {\n      "id": "I007", "priority": 70, "status": "CLOSED", "lane": "acoustic",\n      "title": "BF wind, motion, phase mismatch and reverberant health evidence beyond the released hard-fault fixture",\n      "depends_on": ["P001"], "handler": null, "contract": "docs/program/iterations/I007-closure.json",\n      "exit": "Exact-main BF health baseline/root cause is archived; the independently bounded wind and reverb structural candidates are both rejected by frozen target/non-target and established hard-fault gates; no confirmation is consumed and v2.3.12 remains shipping",\n      "evidence": [\n        {"source_sha": "88e59917d0f7cc75d88c647a41d2a186509bdd13", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34028010442", "meaning": "I007 candidate-zero root-cause differential: artifact 9987677794 / digest 38a6b483... independently verified 343/343; final reviewed attribution 24/24 explained, candidate/confirmation 0/0."},\n        {"source_sha": "bf62bbbeca353cf54c2075eb806bbf07fabac7b8", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34028699391", "meaning": "Single authorized wind candidate: artifact 9987898553 / digest eba06e39... independently verified 288/288; 24->19 failures but 7/12 wind targets remain failing and hard-fault/soft-control gate fails; PR #113 closed unmerged."},\n        {"source_sha": "6dba87f2f35e20fac4203e4f99c816ae8147bab4", "url": "https://github.com/jiying2007/audio-pipeline/actions/runs/34028778900", "meaning": "Single authorized reverb candidate: artifact 9987923038 / digest 5e6702fb... independently verified 288/288; 12/12 reverb targets pass but two wind regressions and broad hard-fault recovery/coverage regressions reject the candidate; PR #114 closed unmerged."}\n      ]\n    },\n'''
          if text.count(old) != 1:
              raise SystemExit('I007 plan anchor drift')
          Path('docs/program/plan.json').write_text(text.replace(old,new,1))
          PY
          python3 scripts/program.py --self-test
          git diff --check
      - name: Commit minimal plan diff and remove fixer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/i007-plan-format-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/program/plan.json .github/workflows/i007-plan-format-fix.yml
          git commit -m 'program: minimize I007 closure plan delta'
          git push origin HEAD:governance/i007-close-keep-baseline
