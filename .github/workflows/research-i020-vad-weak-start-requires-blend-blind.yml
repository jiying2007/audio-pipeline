name: Research I020 Source-Patch Blind Qualification
run-name: "i020-source-patch-blind / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json'
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.patch'
      - '.github/research/continuous-optimization/research_code_candidate_blind.py'
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1-result.json'
      - 'tests/validation/test_i020_code_candidate_blind_one_shot.py'
      - '.github/workflows/research-i020-vad-weak-start-requires-blend-blind.yml'
      - '.github/research/continuous-optimization/hosted-validation/**'
      - 'validation/authority.json'
      - 'validation/datasets.lock.json'
      - 'validation/policies/validation-full-partition.json'
      - 'validation/policies/validation-full-blind.json'
      - 'validation/tools/build_full_public_corpus.py'
      - 'validation/tools/prepare_public_validation.py'
      - 'validation/tools/split_holdout.py'
      - 'validation/tools/run_validation*.py'
      - 'validation/tools/stage_profile_support.py'
      - 'validation/tools/render_corr_exact.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-i020-source-patch-blind-${{ github.ref }}
  cancel-in-progress: false

env:
  MANIFEST: .github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json
  REGISTRY: .github/research/continuous-optimization/dataset-registry.json
  SOURCE_BASE_SHA: 57e4c64adc1cf06819e46e24e275ecd746d5f17f
  AEC_LIMIT: '60'
  DERIVED_LIMIT: '20'
  DNS_LIMIT: '60'
  HOLDOUT: '20'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate frozen source-patch blind contract
        run: |
          set -euo pipefail
          python3 -m py_compile .github/research/continuous-optimization/research_code_candidate_blind.py
          python3 .github/research/continuous-optimization/research_code_candidate_blind.py --self-test
          python3 tests/validation/test_i020_code_candidate_blind_one_shot.py
          python3 .github/research/continuous-optimization/research_code_candidate_blind.py             --manifest "$MANIFEST" --registry "$REGISTRY" --repo-root . --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path(
            '.github/research/continuous-optimization/development-v4/'
            'i020-vad-weak-start-requires-blend-v1-result.json').read_text())
          manifest=json.loads(Path(
            '.github/research/continuous-optimization/code-candidates/'
            'i020-vad-weak-start-requires-blend-v1.json').read_text())
          assert result['status']=='FROZEN_RESEARCH_CANDIDATE'
          assert result['next_gate']=='validation-grade-blind'
          assert result['decision']=='FROZEN_RESEARCH_CANDIDATE_REVIEW_REQUIRED'
          assert result['fresh_authority']['rerun_allowed'] is False
          assert result['authoritative_execution']['run_id']==36283565997
          assert result['authoritative_execution']['artifact_id']==10920075810
          assert manifest['research_candidate_id']==result['research_candidate_id']
          assert manifest['patch']=={
            'path': result['candidate_patch']['path'],
            'sha256': result['candidate_patch']['sha256'],
            'allowed_paths': result['candidate_patch']['allowed_paths'],
          }
          assert manifest['blind_contract']['holdout_percent']==20
          PY

      - name: Prove patch applies only to the frozen shipping source
        run: |
          set -euo pipefail
          patch_path=$(jq -r .patch.path "$MANIFEST")
          patch_sha=$(jq -r .patch.sha256 "$MANIFEST")
          test "$(sha256sum "$patch_path" | awk '{print $1}')" = "$patch_sha"
          git cat-file -e "$SOURCE_BASE_SHA^{commit}"
          rm -rf /tmp/i020-blind-patch-check
          git worktree add --detach /tmp/i020-blind-patch-check "$SOURCE_BASE_SHA"
          git -C /tmp/i020-blind-patch-check apply --check "$GITHUB_WORKSPACE/$patch_path"
          git -C /tmp/i020-blind-patch-check apply "$GITHUB_WORKSPACE/$patch_path"
          test "$(git -C /tmp/i020-blind-patch-check diff --name-only)" = "src/enhance/ap_vad.c"
          cmake -S /tmp/i020-blind-patch-check -B /tmp/i020-blind-contract-build             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON             -DAP_BUILD_SOURCE_REVISION="$SOURCE_BASE_SHA"
          cmake --build /tmp/i020-blind-contract-build --target ap_process_pcm --parallel

      - name: Enforce manual-only qualification surface
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/research-i020-vad-weak-start-requires-blend-blind.yml').read_text()
          assert '\n  push:' not in text
          assert '\n  schedule:' not in text
          assert "if: github.event_name == 'workflow_dispatch'" in text
          assert 'secrets.token_hex(32)' in text
          assert '--blind-summary-only' in text
          assert 'BLIND_QUALIFIED_NON_SHIPPING' in Path(
            '.github/research/continuous-optimization/research_code_candidate_blind.py'
          ).read_text()
          PY

  qualify-blind:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout qualification infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: infra

      - name: Enforce one-shot I020 blind execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          python3 - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          if os.environ['GITHUB_RUN_ATTEMPT']!='1':
              raise SystemExit('I020 blind rerun forbidden; preserve the first blind partition')
          workflow='research-i020-vad-weak-start-requires-blend-blind.yml'

          def collection(endpoint,key):
              pages=json.loads(subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint],text=True))
              return [item for page in pages for item in page[key]]

          runs=collection(
              f'repos/{repo}/actions/workflows/{workflow}/runs'
              '?event=workflow_dispatch&branch=main&per_page=100','workflow_runs')
          if not any(int(item['id'])==current for item in runs):
              raise SystemExit('I020 blind current run not visible before partition')

          consuming={
              'Partition run-ephemeral blind holdout',
              'Run candidate on blind holdout with summary-only report',
          }
          consumed=set()
          for item in runs:
              run_id=int(item['id'])
              if run_id==current: continue
              attempts=int(item['run_attempt'])
              if attempts<1:
                  raise SystemExit('I020 blind invalid historical attempt count')
              for attempt in range(1,attempts+1):
                  jobs=collection(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{attempt}'
                      '/jobs?per_page=100','jobs')
                  for job in jobs:
                      if job.get('conclusion')=='skipped': continue
                      steps=job.get('steps')
                      if not isinstance(steps,list):
                          raise SystemExit('I020 blind missing historical step collection')
                      for step in steps:
                          if (
                              step.get('name') in consuming
                              and step.get('conclusion')!='skipped'
                              and step.get('status') not in {'queued','pending','waiting'}
                          ):
                              consumed.add(run_id)
                  if run_id in consumed: break
          if consumed:
              raise SystemExit(
                  'I020 blind authority already consumed by run(s): '
                  + ','.join(str(x) for x in sorted(consumed)))
          print('one-shot I020 blind guard: PASS')
          PY

      - name: Resolve frozen candidate and development artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C infra rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_SHA" = "$(git -C infra rev-parse origin/main)"
          python3 infra/.github/research/continuous-optimization/research_code_candidate_blind.py             --manifest "infra/$MANIFEST" --registry "infra/$REGISTRY"             --repo-root infra --check
          eval "$(python3 - <<'PY'
          import json, shlex
          m=json.load(open('infra/.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json'))
          p=m['research_provenance']
          values={
            'PATCH_PATH':m['patch']['path'],
            'PATCH_SHA256':m['patch']['sha256'],
            'RESEARCH_RUN_ID':str(p['run_id']),
            'ARTIFACT_ID':str(p['artifact_id']),
            'ARTIFACT_NAME':p['artifact_name'],
            'ARTIFACT_DIGEST':p['artifact_digest'],
            'RESULT_SHA256':p['result_sha256'],
            'DEVELOPMENT_INFRA_SHA':p['development_infra_sha'],
          }
          for k,v in values.items(): print(f'{k}={shlex.quote(v)}')
          PY
          )"
          git -C infra cat-file -e "$SOURCE_BASE_SHA^{commit}"
          git -C infra merge-base --is-ancestor "$SOURCE_BASE_SHA" "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"             > /tmp/i020-development-artifact.json
          test "$(jq -r .name /tmp/i020-development-artifact.json)" = "$ARTIFACT_NAME"
          test "$(jq -r .expired /tmp/i020-development-artifact.json)" = false
          test "$(jq -r .workflow_run.id /tmp/i020-development-artifact.json)" = "$RESEARCH_RUN_ID"
          test "$(jq -r .workflow_run.head_sha /tmp/i020-development-artifact.json)" = "$DEVELOPMENT_INFRA_SHA"
          test "$(jq -r .digest /tmp/i020-development-artifact.json)" = "$ARTIFACT_DIGEST"
          mkdir -p provenance candidate-out
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip"             --output provenance/i020-development.zip
          test "sha256:$(sha256sum provenance/i020-development.zip | awk '{print $1}')" = "$ARTIFACT_DIGEST"
          unzip -q provenance/i020-development.zip -d provenance/development
          test -f provenance/development/result.json
          test "$(sha256sum provenance/development/result.json | awk '{print $1}')" = "$RESULT_SHA256"
          cp "infra/$MANIFEST" candidate-out/candidate-manifest.json
          cp /tmp/i020-development-artifact.json candidate-out/development-artifact-metadata.json
          python3 infra/.github/research/continuous-optimization/research_code_candidate_blind.py             --manifest candidate-out/candidate-manifest.json             --registry "infra/$REGISTRY" --repo-root infra             --development-result provenance/development/result.json --check
          {
            echo "PATCH_PATH=$PATCH_PATH"
            echo "PATCH_SHA256=$PATCH_SHA256"
          } >> "$GITHUB_ENV"

      - name: Checkout exact shipping baseline source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: source-baseline

      - name: Checkout exact candidate base source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: source-candidate

      - name: Apply exact frozen source patch
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/infra/$PATCH_PATH"
          test "$(sha256sum "$patch" | awk '{print $1}')" = "$PATCH_SHA256"
          test "$(git -C source-baseline rev-parse HEAD)" = "$SOURCE_BASE_SHA"
          test "$(git -C source-candidate rev-parse HEAD)" = "$SOURCE_BASE_SHA"
          git -C source-candidate apply --check "$patch"
          git -C source-candidate apply "$patch"
          test "$(git -C source-candidate diff --name-only)" = "src/enhance/ap_vad.c"
          test -z "$(git -C source-baseline status --porcelain=v1)"

      - name: Initialize GitHub-hosted validation paths
        run: |
          set -euo pipefail
          {
            echo "DATA_ROOT=$RUNNER_TEMP/audio-validation-data"
            echo "SEAL=$RUNNER_TEMP/audio-validation-data/datasets.seal.json"
            echo "DNS_ROOT=$RUNNER_TEMP/audio-validation-data/DNS-Challenge/datasets_fullband"
          } >> "$GITHUB_ENV"

      - name: Bootstrap hash-bound full public cache
        run: |
          set -euo pipefail
          python3 infra/.github/research/continuous-optimization/hosted-validation/prepare_full_validation.py             --source-root infra --data-root "$DATA_ROOT" --seal "$SEAL"             --archive-lock infra/.github/research/continuous-optimization/hosted-validation/public-minimal.lock.json             --aec-limit "$AEC_LIMIT"             --progress-output candidate-out/github-hosted-progress.json             --output candidate-out/github-hosted-cache.json

      - name: Preflight GitHub-hosted validation environment
        run: |
          set -euo pipefail
          python3 infra/tools/runner_preflight.py             --role audio-validation --source-revision "$SOURCE_BASE_SHA"             --data-root "$DATA_ROOT" --seal "$SEAL" --dns-data-root "$DNS_ROOT"             --require-command gh --require-command jq --require-command curl             --require-command sha256sum --require-command unzip             --writable-path "$GITHUB_WORKSPACE"             --output candidate-out/runner-preflight.json
          python3 infra/validation/tools/prepare_public_validation.py verify             --lock infra/validation/datasets.lock.json             --profile full --root "$DATA_ROOT" --seal "$SEAL" --dns-data-root "$DNS_ROOT"             > candidate-out/dataset-verification.json
          test -z "$(git -C infra status --porcelain=v1)"
          test -z "$(git -C source-baseline status --porcelain=v1)"
          test "$(git -C source-candidate diff --name-only)" = "src/enhance/ap_vad.c"

      - name: Build exact baseline and patched candidate processors
        run: |
          set -euo pipefail
          rm -rf /tmp/i020-baseline-build /tmp/i020-candidate-build
          cmake -S source-baseline -B /tmp/i020-baseline-build             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON             -DAP_BUILD_SOURCE_REVISION="$SOURCE_BASE_SHA"
          cmake --build /tmp/i020-baseline-build --target ap_process_pcm ap_build_info_dump --parallel
          cmake -S source-candidate -B /tmp/i020-candidate-build             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON             -DAP_BUILD_SOURCE_REVISION="$SOURCE_BASE_SHA"
          cmake --build /tmp/i020-candidate-build --target ap_process_pcm ap_build_info_dump --parallel
          sha256sum /tmp/i020-baseline-build/ap_process_pcm > candidate-out/baseline-processor.sha256
          sha256sum /tmp/i020-candidate-build/ap_process_pcm > candidate-out/candidate-processor.sha256
          /tmp/i020-baseline-build/ap_build_info_dump > candidate-out/baseline-build-info.txt
          /tmp/i020-candidate-build/ap_build_info_dump > candidate-out/candidate-build-info.txt
          ${CC:-cc} --version | head -n 1 > candidate-out/compiler.txt
          python3 infra/.github/research/continuous-optimization/research_code_candidate_blind.py             --manifest candidate-out/candidate-manifest.json             --registry "infra/$REGISTRY" --repo-root infra             --baseline-processor /tmp/i020-baseline-build/ap_process_pcm             --candidate-processor /tmp/i020-candidate-build/ap_process_pcm             --identity-output candidate-out/candidate-identity.json --seal-identity

      - name: Create strict metrics JSON proxies
        run: |
          set -euo pipefail
          python3 infra/.github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py --self-test
          cat > candidate-out/baseline-processor-json <<'PYPROXY'
          #!/usr/bin/env python3
          import os, sys
          from pathlib import Path
          root=Path(__file__).resolve().parent.parent
          helper=root/'infra'/'.github'/'research'/'continuous-optimization'/'hosted-validation'/'metrics_jsonl_proxy.py'
          audit=root/'candidate-out'/'baseline-metrics-jsonl-canonicalization.jsonl'
          os.execv(sys.executable,[sys.executable,str(helper),'--processor','/tmp/i020-baseline-build/ap_process_pcm','--audit',str(audit),'--',*sys.argv[1:]])
          PYPROXY
          cat > candidate-out/candidate-processor-json <<'PYPROXY'
          #!/usr/bin/env python3
          import os, sys
          from pathlib import Path
          root=Path(__file__).resolve().parent.parent
          helper=root/'infra'/'.github'/'research'/'continuous-optimization'/'hosted-validation'/'metrics_jsonl_proxy.py'
          audit=root/'candidate-out'/'candidate-metrics-jsonl-canonicalization.jsonl'
          os.execv(sys.executable,[sys.executable,str(helper),'--processor','/tmp/i020-candidate-build/ap_process_pcm','--audit',str(audit),'--',*sys.argv[1:]])
          PYPROXY
          chmod 700 candidate-out/baseline-processor-json candidate-out/candidate-processor-json

      - name: Build full public validation corpus
        run: |
          set -euo pipefail
          python3 infra/validation/tools/build_full_public_corpus.py             --lock infra/validation/datasets.lock.json             --data-root "$DATA_ROOT" --seal "$SEAL" --dns-data-root "$DNS_ROOT"             --output candidate-out/public             --aec-limit "$AEC_LIMIT" --derived-limit "$DERIVED_LIMIT" --dns-limit "$DNS_LIMIT"

      - name: Generate run-ephemeral blind holdout key
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, secrets
          from pathlib import Path
          key=secrets.token_hex(32)
          print(f'::add-mask::{key}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'AP_EPHEMERAL_HOLDOUT_KEY={key}\n')
          Path('candidate-out/holdout-key-origin.json').write_text(json.dumps({
              'schema_version':1,
              'origin':'github-hosted-run-ephemeral',
              'generator':'python.secrets.token_hex(32)',
              'key_persisted':False,
              'key_fingerprint':hashlib.sha256(key.encode()).hexdigest()[:16],
              'github_run_id':os.environ['GITHUB_RUN_ID'],
              'github_run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
          },indent=2,sort_keys=True)+'\n')
          PY

      - name: Partition run-ephemeral blind holdout
        run: |
          set -euo pipefail
          cleanup() {
            unset AP_EPHEMERAL_HOLDOUT_KEY || true
            printf 'AP_EPHEMERAL_HOLDOUT_KEY=\n' >> "$GITHUB_ENV"
          }
          trap cleanup EXIT
          test -n "$AP_EPHEMERAL_HOLDOUT_KEY"
          python3 infra/validation/tools/split_holdout.py             --corpus candidate-out/public/corpus.json             --validation-output candidate-out/public/corpus-validation.json             --blind-output candidate-out/public/corpus-blind.json             --holdout-percent "$HOLDOUT" --key-env AP_EPHEMERAL_HOLDOUT_KEY
          python3 - <<'PY'
          import json
          v=len(json.load(open('candidate-out/public/corpus-validation.json'))['cases'])
          b=len(json.load(open('candidate-out/public/corpus-blind.json'))['cases'])
          print(f'paired blind partition admission: visible={v} blind={b}')
          if v < 100 or b < 16: raise SystemExit(2)
          PY

      - name: Run shipping baseline on visible validation partition
        run: |
          set -euo pipefail
          python3 infra/validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus candidate-out/public/corpus-validation.json             --policy infra/validation/policies/validation-full-partition.json             --dataset-lock infra/validation/datasets.lock.json             --processor candidate-out/baseline-processor-json             --output candidate-out/baseline-visible-report.json             --evidence-manifest candidate-out/baseline-visible-evidence.json

      - name: Run candidate on visible validation partition
        run: |
          set -euo pipefail
          python3 infra/validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus candidate-out/public/corpus-validation.json             --policy infra/validation/policies/validation-full-partition.json             --dataset-lock infra/validation/datasets.lock.json             --processor candidate-out/candidate-processor-json             --output candidate-out/candidate-visible-report.json             --evidence-manifest candidate-out/candidate-visible-evidence.json             --source-manifest candidate-out/candidate-manifest.json

      - name: Run shipping baseline on blind holdout with summary-only report
        run: |
          set -euo pipefail
          python3 infra/validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus candidate-out/public/corpus-blind.json             --policy infra/validation/policies/validation-full-blind.json             --dataset-lock infra/validation/datasets.lock.json             --processor candidate-out/baseline-processor-json             --output candidate-out/baseline-blind-report.json             --evidence-manifest candidate-out/baseline-blind-evidence.json             --blind-summary-only

      - name: Run candidate on blind holdout with summary-only report
        run: |
          set -euo pipefail
          python3 infra/validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus candidate-out/public/corpus-blind.json             --policy infra/validation/policies/validation-full-blind.json             --dataset-lock infra/validation/datasets.lock.json             --processor candidate-out/candidate-processor-json             --output candidate-out/candidate-blind-report.json             --evidence-manifest candidate-out/candidate-blind-evidence.json             --source-manifest candidate-out/candidate-manifest.json             --blind-summary-only

      - name: Classify paired source-patch blind qualification
        if: always()
        run: |
          set +e
          python3 infra/.github/research/continuous-optimization/research_code_candidate_blind.py             --manifest candidate-out/candidate-manifest.json             --registry "infra/$REGISTRY" --repo-root infra             --classify --identity candidate-out/candidate-identity.json             --baseline-visible candidate-out/baseline-visible-report.json             --candidate-visible candidate-out/candidate-visible-report.json             --baseline-blind candidate-out/baseline-blind-report.json             --candidate-blind candidate-out/candidate-blind-report.json             --qualification-output candidate-out/qualification-summary.json
          rc=$?
          cat candidate-out/qualification-summary.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          exit "$rc"

      - name: Seal source-patch blind evidence
        if: always()
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > candidate-out/qualification-infra-revision.txt
          printf '%s\n' "$SOURCE_BASE_SHA" > candidate-out/source-base-revision.txt
          find candidate-out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum             > /tmp/i020-blind-SHA256SUMS
          mv /tmp/i020-blind-SHA256SUMS candidate-out/SHA256SUMS

      - name: Upload hash-bound source-patch blind evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i020-source-patch-blind-${{ github.run_id }}
          path: candidate-out/
          if-no-files-found: error
          retention-days: 90
