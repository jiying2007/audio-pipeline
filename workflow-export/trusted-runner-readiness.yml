name: Trusted Runner Readiness

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA whose runner contract should be checked
        required: true
        type: string
      role:
        description: Trusted self-hosted runner role
        required: true
        type: choice
        options: [audio-validation, audio-builder, audio-target, certification-archive]
      data_root:
        description: Optional public-validation cache root; blank uses $HOME/audio-validation-data on audio-validation
        required: false
        default: ''
        type: string
      seal_path:
        description: Optional public-validation dataset seal; blank uses <resolved-data-root>/datasets.seal.json
        required: false
        default: ''
        type: string
      dns_data_root:
        description: Optional Full-validation DNS materialization root
        required: false
        default: ''
        type: string
      shipping_cc:
        description: audio-builder exact shipping compiler
        required: false
        default: ''
        type: string
      shipping_sysroot:
        description: audio-builder exact shipping sysroot
        required: false
        default: ''
        type: string
      shipping_toolchain_root:
        description: audio-builder exact toolchain root
        required: false
        default: ''
        type: string
      board_manifest:
        description: Optional audio-target board manifest; blank uses $HOME/.config/audio-pipeline/board.json
        required: false
        default: ''
        type: string
      corpus_manifest:
        description: Optional real product corpus manifest on audio-target
        required: false
        default: ''
        type: string
      acoustic_json:
        description: Optional real product acoustic result JSON on audio-target
        required: false
        default: ''
        type: string
      farend_file:
        description: Optional real far-end PCM on audio-target
        required: false
        default: ''
        type: string
      power_input:
        description: Optional live power-sensor path on audio-target
        required: false
        default: ''
        type: string
      archive_command:
        description: certification-archive immutable backend command
        required: false
        default: /usr/local/bin/audio-pipeline-cert-archive
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-runner-readiness-${{ inputs.role }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Validate exact source commit SHA
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "source_sha must be a 40-character commit SHA" >&2; exit 1; }
          git fetch --no-tags origin "$SOURCE_SHA"
          git cat-file -e "$SOURCE_SHA^{commit}"
          echo "sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

  validation:
    needs: resolve
    if: inputs.role == 'audio-validation'
    runs-on: [self-hosted, linux, audio-validation]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Check audio-validation readiness
        env:
          INPUT_DATA_ROOT: ${{ inputs.data_root }}
          INPUT_SEAL: ${{ inputs.seal_path }}
          DNS_ROOT: ${{ inputs.dns_data_root }}
        run: |
          set -euo pipefail
          DATA_ROOT=${INPUT_DATA_ROOT:-$HOME/audio-validation-data}
          SEAL=${INPUT_SEAL:-$DATA_ROOT/datasets.seal.json}
          args=(
            --role audio-validation
            --source-revision '${{ needs.resolve.outputs.sha }}'
            --data-root "$DATA_ROOT" --seal "$SEAL"
            --writable-path "$GITHUB_WORKSPACE"
            --output runner-readiness.json
          )
          if [ -n "$DNS_ROOT" ]; then args+=(--dns-data-root "$DNS_ROOT"); fi
          python3 tools/runner_preflight.py "${args[@]}"
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-audio-validation-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90

  builder:
    needs: resolve
    if: inputs.role == 'audio-builder'
    runs-on: [self-hosted, linux, audio-builder]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Check audio-builder readiness
        env:
          CC: ${{ inputs.shipping_cc }}
          SYSROOT: ${{ inputs.shipping_sysroot }}
          TOOLCHAIN_ROOT: ${{ inputs.shipping_toolchain_root }}
        run: |
          set -euo pipefail
          python3 tools/runner_preflight.py \
            --role audio-builder \
            --source-revision '${{ needs.resolve.outputs.sha }}' \
            --shipping-cc "$CC" \
            --shipping-sysroot "$SYSROOT" \
            --shipping-toolchain-root "$TOOLCHAIN_ROOT" \
            --writable-path "$GITHUB_WORKSPACE" \
            --output runner-readiness.json
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-audio-builder-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90

  target:
    needs: resolve
    if: inputs.role == 'audio-target'
    runs-on: [self-hosted, linux, audio-target]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Check audio-target readiness
        env:
          INPUT_BOARD: ${{ inputs.board_manifest }}
          CORPUS: ${{ inputs.corpus_manifest }}
          ACOUSTIC: ${{ inputs.acoustic_json }}
          FAREND: ${{ inputs.farend_file }}
          POWER: ${{ inputs.power_input }}
        run: |
          set -euo pipefail
          BOARD=${INPUT_BOARD:-$HOME/.config/audio-pipeline/board.json}
          args=(--role audio-target --source-revision '${{ needs.resolve.outputs.sha }}' --writable-path /tmp --output runner-readiness.json)
          args+=(--board-manifest "$BOARD")
          if [ -n "$CORPUS" ]; then args+=(--corpus-manifest "$CORPUS"); fi
          if [ -n "$ACOUSTIC" ]; then args+=(--acoustic-json "$ACOUSTIC"); fi
          if [ -n "$FAREND" ]; then args+=(--farend-file "$FAREND"); fi
          if [ -n "$POWER" ]; then args+=(--power-input "$POWER"); fi
          python3 tools/runner_preflight.py "${args[@]}"
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-audio-target-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90

  archive:
    needs: resolve
    if: inputs.role == 'certification-archive'
    runs-on: [self-hosted, linux, certification-archive]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - name: Check certification-archive readiness
        env:
          ARCHIVE_COMMAND: ${{ inputs.archive_command }}
        run: |
          set -euo pipefail
          python3 tools/runner_preflight.py \
            --role certification-archive \
            --source-revision '${{ needs.resolve.outputs.sha }}' \
            --archive-command "$ARCHIVE_COMMAND" \
            --writable-path "$GITHUB_WORKSPACE" \
            --output runner-readiness.json
      - name: Upload readiness report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-readiness-certification-archive-${{ github.run_id }}
          path: runner-readiness.json
          if-no-files-found: error
          retention-days: 90
