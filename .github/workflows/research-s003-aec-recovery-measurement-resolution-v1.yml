name: Research S003 AEC Recovery Measurement Resolution v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-recovery-measurement-resolution-v1.json'
      - 'docs/program/iterations/S003-aec-recovery-measurement-resolution-v1-result.json'
      - 'tests/validation/data/s003-aec-recovery-measurement-resolution-consumed-workflow.yml'
      - 'tests/validation/test_s003_aec_recovery_resolution_retirement.py'
      - '.github/workflows/research-s003-aec-recovery-measurement-resolution-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate reviewed terminal evidence
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-recovery-measurement-resolution-v1.json >/dev/null
          python3 -m json.tool             docs/program/iterations/S003-aec-recovery-measurement-resolution-v1-result.json >/dev/null
          python3 -m py_compile             tests/validation/test_s003_aec_recovery_resolution_retirement.py
          python3 tests/validation/test_s003_aec_recovery_resolution_retirement.py
