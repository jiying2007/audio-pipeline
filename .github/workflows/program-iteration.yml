permissions:
  contents: read

concurrency:
  group: program-archive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate terminal program archive contracts
        run: |
          set -euo pipefail
          python3 scripts/program.py --self-test
          python3 scripts/program.py check
          python3 .github/program/promotion_governance.py --self-test
          python3 .github/program/terminal_workflow_retirement.py --self-test --check
          python3 .github/program/maintenance_workflow_contract.py --self-test --check
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path('docs/program/plan.json').read_text())
          tasks = plan.get('tasks', [])
          ready = [task.get('id') for task in tasks if task.get('status') == 'READY']
          assert ready == [], f'terminal program unexpectedly regained READY tasks: {ready}'
          assert plan.get('hardware_collection') is False
          assert plan.get('auto_promote') is False
          assert plan.get('product_qualification') == 'DEFERRED_BY_SCOPE'
          external = [task for task in tasks if task.get('id') == 'E001']
          assert len(external) == 1 and external[0].get('status') == 'DEFERRED'
          print('program archive contract: terminal software program; E001 remains external/deferred')
          PY
