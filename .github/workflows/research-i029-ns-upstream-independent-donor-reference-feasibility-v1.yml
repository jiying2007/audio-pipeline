name: Research I029 NS Upstream Independent Donor Reference Feasibility v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i029-ns-upstream-independent-donor-reference-feasibility-v1.json'
      - '.github/research/continuous-optimization/development-v4/i029-ns-upstream-independent-donor-reference-feasibility-v1-result.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i029_ns_upstream_independent_donor_reference_feasibility.py'
      - 'tests/validation/test_i029_one_shot_guard.py'
      - 'tests/validation/test_i029_retirement.py'
      - 'tests/validation/data/i029-consumed-workflow.yml'
      - 'validation/research/evidence/i029-36595080698/**'
      - '.github/workflows/research-i029-ns-upstream-independent-donor-reference-feasibility-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I029 authority and reviewed donor closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i029-ns-upstream-independent-donor-reference-feasibility-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i029_ns_upstream_independent_donor_reference_feasibility.py \
            tests/validation/test_i029_one_shot_guard.py \
            tests/validation/test_i029_retirement.py
          python3 tests/validation/i029_ns_upstream_independent_donor_reference_feasibility.py --self-test
          python3 tests/validation/test_i029_one_shot_guard.py
          python3 tests/validation/test_i029_retirement.py
