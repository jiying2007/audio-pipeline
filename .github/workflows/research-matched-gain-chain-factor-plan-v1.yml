name: Research Matched Gain-Chain Factor Plan V1

on:
  pull_request:
    paths:
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-v1.json'
      - '.github/workflows/research-matched-gain-chain-factor-plan-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-v1.json'
      - '.github/workflows/research-matched-gain-chain-factor-plan-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 2

      - name: Enforce two-file research-only scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="HEAD^"
          fi
          mapfile -t files < <(git diff --name-only "$BASE" HEAD)
          [[ ${#files[@]} -eq 2 ]]
          printf '%s
' "${files[@]}" | sort > /tmp/actual
          cat > /tmp/expected <<'EOF'
.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-v1.json
.github/workflows/research-matched-gain-chain-factor-plan-v1.yml
EOF
          sort -o /tmp/expected /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Validate pre-capture factor plan remains fail-closed
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path('.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-v1.json').read_text())
          assert p['authority'] == 'PRECAPTURE_PLAN_ONLY'
          assert p['candidate_budget'] == 0
          assert p['base_main_sha'] == 'a7c33bd20eda4a752082b44a34f959acba81f308'
          assert p['state']['freeze_complete'] is False
          assert p['state']['hardware_execution_authorized'] is False
          d = p['fixed_design']
          assert d['design_type'] == '3x3_full_factorial_with_3_replicates'
          assert d['total_captures'] == 27
          assert d['varying_factors']['playback_digital_gain_db'] == [-12,-6,0]
          assert d['varying_factors']['capture_digital_gain_db'] == [-12,-6,0]
          assert d['randomization_seed'] == 20260918
          assert len(d['capture_order']) == 27
          assert len({tuple(x) for x in d['capture_order']}) == 27
          expected = {(a,b,r) for a in (-12,-6,0) for b in (-12,-6,0) for r in (1,2,3)}
          assert {tuple(x) for x in d['capture_order']} == expected
          assert p['unresolved_required']
          assert set(p['unresolved_required'].values()) == {'UNRESOLVED_REQUIRED'}
          n = p['next_authorized_step']
          assert n['scope'] == 'fill_exact_precapture_fields_only'
          assert n['may_modify_factor_levels'] is False
          assert n['may_modify_capture_order'] is False
          assert n['may_execute_hardware'] is False
          assert n['may_run_audio_pipeline'] is False
          assert n['may_compute_dtd_or_quality_result'] is False
          assert n['pilot_capture_requires_separate_explicit_authorization'] is True
          assert p['shipping_immutable'] == {
              'version':'v2.3.16',
              'sha':'57e4c64adc1cf06819e46e24e275ecd746d5f17f'
          }

      - name: Enforce contract integrity requirements
        shell: python
        run: |
          import json
          from pathlib import Path
          p = json.loads(Path('.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-v1.json').read_text())
          i = p['integrity']
          assert all(i[k] is True for k in ['raw_audio_hash_required','config_hash_required','rir_hash_required','capture_order_recorded','failed_runs_retained'])
          assert i['result_dependent_recapture'] is False
          assert i['post_hoc_case_exclusion'] is False
          prohibited = set(p['prohibited'])
          for item in ['hardware capture execution','gain normalization','Activity/VAD/DTD threshold changes','source candidate creation','HIL authority','Product Certification authority','release authority','shipping authority']:
              assert item in prohibited
