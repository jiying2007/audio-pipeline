name: I004 EMA Burst Candidate Search

on:
  pull_request:
    paths:
      - 'docs/program/iterations/I004-burst-candidate-search.json'
      - 'tests/validation/i004_ns_burst_candidate_search.py'
      - '.github/workflows/i004-ns-burst-candidate-search.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: i004-ns-burst-candidate-search-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i004-ns-burst-candidate-search

      - name: Validate bounded search contract and research-only scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='c425252e43e88ec0a9f8f440fb8cbf4f0c908b18'
          python3 -m py_compile tests/validation/i004_ns_burst_candidate_search.py
          python3 tests/validation/i004_ns_burst_candidate_search.py --self-test
          python3 -m json.tool docs/program/iterations/I004-burst-candidate-search.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('docs/program/iterations/I004-burst-candidate-search.json').read_text())
          assert contract['base_sha'] == 'c425252e43e88ec0a9f8f440fb8cbf4f0c908b18'
          assert contract['candidate_limit'] == 2
          assert contract['confirmation_limit'] == 0
          assert contract['candidate_variants'] == [
              'continuous-confidence-schedule',
              'rise-only-midconfidence-protection',
          ]
          assert contract['winner_policy'] == 'exactly-one-eligible'
          assert contract['promotion_allowed'] is False
          assert all(value is False for value in contract['authority'].values())
          PY
          changed="$(git diff --name-only "$BASE"...HEAD)"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx 'docs/program/iterations/I004-burst-candidate-search.json'
          printf '%s\n' "$changed" | grep -Fx 'tests/validation/i004_ns_burst_candidate_search.py'
          printf '%s\n' "$changed" | grep -Fx '.github/workflows/i004-ns-burst-candidate-search.yml'

      - name: Execute exact-base two-candidate source experiment
        shell: bash
        run: |
          set -euo pipefail
          BASE='c425252e43e88ec0a9f8f440fb8cbf4f0c908b18'
          rm -rf /tmp/i004-burst-exact-base i004-burst-search-evidence
          git worktree add --detach /tmp/i004-burst-exact-base "$BASE"
          cp tests/validation/i004_ns_burst_candidate_search.py \
            /tmp/i004-burst-exact-base/tests/validation/i004_ns_burst_candidate_search.py
          cp docs/program/iterations/I004-burst-candidate-search.json \
            /tmp/i004-burst-exact-base/docs/program/iterations/I004-burst-candidate-search.json
          (
            cd /tmp/i004-burst-exact-base
            test "$(git rev-parse HEAD)" = "$BASE"
            python3 tests/validation/i004_ns_burst_candidate_search.py \
              --contract docs/program/iterations/I004-burst-candidate-search.json \
              --output "$GITHUB_WORKSPACE/i004-burst-search-evidence"
          )

      - name: Seal and enforce search evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p i004-burst-search-evidence
          cp docs/program/iterations/I004-burst-candidate-search.json i004-burst-search-evidence/contract.json
          git rev-parse HEAD > i004-burst-search-evidence/research-head.txt
          printf '%s\n' 'c425252e43e88ec0a9f8f440fb8cbf4f0c908b18' > i004-burst-search-evidence/base-sha.txt
          if test -f i004-burst-search-evidence/candidate-search-result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('i004-burst-search-evidence/candidate-search-result.json').read_text())
          assert result['source_sha'] == 'c425252e43e88ec0a9f8f440fb8cbf4f0c908b18'
          assert result['candidate_limit'] == 2
          assert result['confirmation_limit'] == 0
          assert result['candidate_variants_consumed'] == 2
          assert result['ns_floor_tuning_performed'] is False
          assert result['backend_search_performed'] is False
          assert result['checked_out_source_modified'] is False
          assert result['promotion_allowed'] is False
          assert result['decision'] in {
              'FREEZE_UNIQUE_CANDIDATE',
              'KEEP_BASELINE_NO_ELIGIBLE_CANDIDATE',
              'INCONCLUSIVE_MULTIPLE_ELIGIBLE_CANDIDATES',
          }
          if result['decision'] == 'FREEZE_UNIQUE_CANDIDATE':
              assert len(result['eligible_candidates']) == 1
              assert result['winner'] == result['eligible_candidates'][0]
          else:
              assert result['winner'] is None
          PY
          fi
          find i004-burst-search-evidence -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > i004-burst-search-evidence/SHA256SUMS

      - name: Publish search summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print('## I004 EMA burst-protection bounded source search')
          path = Path('i004-burst-search-evidence/candidate-search-result.json')
          if not path.exists():
              print('- Result: `NO_FINAL_RESULT` (tool/infrastructure failure)')
          else:
              r = json.loads(path.read_text())
              print(f"- Decision: **{r['decision']}**")
              print(f"- Winner: `{r['winner']}`")
              print(f"- Eligible: `{r['eligible_candidates']}`")
              print('- Candidate budget consumed: `2/2`')
              print('- Confirmation consumed: `0`')
              for item in r['candidates']:
                  e = item['eligibility']
                  print(f"- `{item['variant']}`: eligible `{e['eligible']}`, burst delta `{e['burst_speech_si_sdr_delta_db']:.3f}` dB, failures `{e['failures']}`")
          PY

      - name: Upload sealed candidate-search evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i004-burst-candidate-search-${{ github.run_id }}
          path: i004-burst-search-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Fail only on missing final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f i004-burst-search-evidence/candidate-search-result.json
