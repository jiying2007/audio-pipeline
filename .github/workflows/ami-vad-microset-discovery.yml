name: AMI VAD Microset Research

on:
  pull_request:
    paths:
      - 'src/enhance/ap_vad.c'
      - 'src/enhance/ap_ns.c'
      - 'tests/validation/discover_ami_vad_microset.py'
      - 'tests/validation/ami_vad_microset_eval.py'
      - 'tests/validation/vad_fusion_diagnostic.py'
      - 'tests/validation/vad_fusion_probe.c'
      - 'tests/validation/data/ami_vad_microset.lock.json'
      - '.github/workflows/ami-vad-microset-discovery.yml'
  schedule:
    - cron: '13 20 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ami-vad-microset-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: validation/tools:tests/validation
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: ami-vad-microset-research
      - name: Validate research contracts offline
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tests/validation/discover_ami_vad_microset.py \
            tests/validation/ami_vad_microset_eval.py \
            tests/validation/vad_fusion_diagnostic.py
          python3 tests/validation/discover_ami_vad_microset.py --self-test
          python3 tests/validation/ami_vad_microset_eval.py --self-test
          python3 tests/validation/vad_fusion_diagnostic.py --self-test
          python3 -m json.tool tests/validation/data/ami_vad_microset.lock.json >/dev/null
      - name: Re-discover pinned AMI external-timing identities
        run: |
          set -euo pipefail
          mkdir -p ami-vad-research-out
          python3 tests/validation/discover_ami_vad_microset.py \
            --output ami-vad-research-out/discovery.json \
            | tee ami-vad-research-out/discovery-summary.json
      - name: Bind discovery to frozen research lock
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path('ami-vad-research-out/discovery.json').read_text())
          lock = json.loads(Path('tests/validation/data/ami_vad_microset.lock.json').read_text())
          assert d['authority'] == 'research-discovery-only'
          assert lock['authority'] == 'research-external-timing-only'
          assert d['dataset']['meeting'] == lock['dataset']['meeting'] == 'ES2003a'
          assert d['dataset']['license'] == lock['dataset']['license'] == 'CC-BY-4.0'
          assert d['transport_mirror'] == lock['transport_mirror']
          audio = d['audio']
          pinned = lock['audio']
          assert audio['path'] == pinned['path']
          assert audio['size_bytes'] == pinned['size_bytes']
          assert audio['tree_object_id'] == pinned['tree_object_id']
          assert audio['lfs_sha256'] == pinned['lfs_sha256']
          assert audio['xet_hash'] == pinned['xet_hash']
          for key in ('audio_format', 'channels', 'sample_rate_hz', 'bits_per_sample', 'byte_rate', 'block_align', 'data_offset', 'data_size'):
              assert audio['wav'][key] == pinned['wav'][key]
          assert abs(audio['duration_s'] - pinned['wav']['duration_s']) < 1e-9
          discovered_annotations = {x['speaker']: x for x in d['annotations']['files']}
          for item in lock['annotations']:
              current = discovered_annotations[item['speaker']]
              for key in ('path', 'sha256', 'size_bytes', 'segments'):
                  assert current[key] == item[key]
          discovered_windows = {x['window_id']: x for x in d['window_plan']}
          for item in lock['windows']:
              current = discovered_windows[item['window_id']]
              assert current['start_s'] == item['start_s']
              assert current['end_s'] == item['end_s']
              assert abs(current['activity_fraction'] - item['activity_fraction']) < 1e-9
              assert current['audio_range']['start_byte'] == item['start_byte']
              assert current['audio_range']['end_byte'] == item['end_byte']
              assert current['audio_range']['length_bytes'] == item['length_bytes']
              assert current['audio_range']['sha256'] == item['sha256']
          PY
      - name: Configure exact research processor
        run: >-
          cmake -S . -B build-ami-vad -DCMAKE_BUILD_TYPE=Release
          -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
      - name: Build exact research processor
        run: cmake --build build-ami-vad --target ap_process_pcm --parallel
      - name: Build internal VAD fusion probe
        run: |
          set -euo pipefail
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_VAD=1 \
            -Ibuild-ami-vad/generated -Iinclude -Isrc \
            tests/validation/vad_fusion_probe.c \
            build-ami-vad/libaudio_pipeline.a -lm -lpthread \
            -o build-ami-vad/vad_fusion_probe
      - name: Compare shipping and research NS-assisted thresholds
        run: |
          set -euo pipefail
          python3 tests/validation/ami_vad_microset_eval.py \
            --processor build-ami-vad/ap_process_pcm \
            --lock tests/validation/data/ami_vad_microset.lock.json \
            --output ami-vad-research-out/qualification.json \
            | tee ami-vad-research-out/qualification-summary.json
      - name: Decompose NS processing upstream fusion and hangover
        run: |
          set -euo pipefail
          python3 tests/validation/vad_fusion_diagnostic.py \
            --processor build-ami-vad/ap_process_pcm \
            --probe build-ami-vad/vad_fusion_probe \
            --lock tests/validation/data/ami_vad_microset.lock.json \
            --output ami-vad-research-out/fusion-diagnostic.json \
            | tee ami-vad-research-out/fusion-diagnostic-summary.json
      - name: Enforce research-only evidence integrity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('ami-vad-research-out/qualification.json').read_text())
          d = json.loads(Path('ami-vad-research-out/fusion-diagnostic.json').read_text())
          assert r['schema_version'] == 1
          assert r['authority'] == 'research-external-timing-vad-qualification'
          assert r['decision'] in {'SUPPORT', 'MIXED', 'CONTRADICTED'}
          assert r['source']['meeting'] == 'ES2003a'
          assert r['source']['license'] == 'CC-BY-4.0'
          assert r['operating_points'] == {
              'shipping_ns_threshold': 0.35,
              'research_ns_threshold': 0.30,
              'hangover_frames': 8,
          }
          assert len(r['annotations']) == 4
          assert len(r['windows']) == 3
          assert [w['window_id'] for w in r['windows']] == ['ES2003a-w1', 'ES2003a-w2', 'ES2003a-w3']
          assert all(w['frames'] >= 1900 for w in r['windows'])
          assert r['aggregate']['frames'] >= 5700
          assert 0.0 < r['aggregate']['activity_fraction'] < 1.0
          assert 'cannot directly change shipping thresholds' in r['promotion_boundary']
          assert d['schema_version'] == 1
          assert d['authority'] == 'research-vad-fusion-causal-diagnostic'
          assert d['shipping_contract']['ns_floor'] == 0.12
          assert d['shipping_contract']['decision_threshold'] == 0.35
          assert len(d['windows']) == 3
          for window in d['windows']:
              fidelity = window['probe_fidelity']
              assert fidelity['active_mismatches'] == 0
              assert fidelity['max_probability_error'] <= fidelity['tolerance']
          assert d['low_activity_window']['window_id'] == 'ES2003a-w2'
          assert d['low_activity_window']['dominant_false_positive_category'] in {
              'raw_local_already_high', 'ns_processing_added', 'upstream_fusion_added', 'hangover_only'
          }
          PY
      - name: Publish AMI research summary
        if: always()
        run: |
          if [ -f ami-vad-research-out/qualification.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('ami-vad-research-out/qualification.json').read_text())
          b = r['aggregate']['baseline']
          c = r['aggregate']['candidate']
          x = r['aggregate']['deltas']
          print('## AMI external-timing real-VAD research')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Aggregate activity fraction: `{r['aggregate']['activity_fraction']:.3f}`")
          print(f"- Recall: `{b['recall']:.4f} -> {c['recall']:.4f}` (`{x['recall_delta']:+.4f}`)")
          print(f"- F1: `{b['f1']:.4f} -> {c['f1']:.4f}` (`{x['f1_delta']:+.4f}`)")
          print(f"- FPR: `{b['false_positive_rate']:.4f} -> {c['false_positive_rate']:.4f}` (`{x['fpr_delta']:+.4f}`)")
          print(f"- Research score: `{x['score']:+.4f}`")
          for w in r['windows']:
              delta = w['deltas']
              print(
                  f"- {w['window_id']} activity `{w['activity_fraction']:.3f}`: "
                  f"recall `{delta['recall']:+.4f}`, F1 `{delta['f1']:+.4f}`, FPR `{delta['false_positive_rate']:+.4f}`"
              )
          diag = Path('ami-vad-research-out/fusion-diagnostic.json')
          if diag.exists():
              d = json.loads(diag.read_text())
              low = d['low_activity_window']
              print(
                  f"- Low-activity false-positive dominant counterfactual: "
                  f"`{low['dominant_false_positive_category']}` (`{low['dominant_fraction']:.3f}` of FP-active frames)"
              )
              categories = d['aggregate_false_positive_attribution']['categories']
              for name, item in categories.items():
                  print(f"- aggregate {name}: `{item['fraction_of_false_positive_active_frames']:.3f}` of FP-active frames")
          print('- Authority: research-only external transcription timing; SUPPORT is not shipping authorization.')
          PY
          fi
      - name: Upload hash-bound AMI research evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ami-vad-microset-research-${{ github.run_id }}
          path: ami-vad-research-out/
          retention-days: 30
          if-no-files-found: warn
