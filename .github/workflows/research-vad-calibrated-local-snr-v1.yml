name: Research VAD Calibrated Local SNR v1
run-name: "vad-calibrated-local-snr-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/vad-calibrated-local-snr-v1.json'
      - '.github/research/continuous-optimization/development-v4/vad-calibrated-local-snr-v1-result.json'
      - 'tests/validation/vad_calibrated_local_snr_probe.c'
      - 'tests/validation/vad_calibrated_local_snr.py'
      - '.github/workflows/research-vad-calibrated-local-snr-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-vad-calibrated-local-snr-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/vad-calibrated-local-snr-v1.json
  RESULT: .github/research/continuous-optimization/development-v4/vad-calibrated-local-snr-v1-result.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate consumed counterfactual contract, tooling and reviewed result
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/vad_calibrated_local_snr.py
          python3 tests/validation/vad_calibrated_local_snr.py --self-test
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m json.tool "$RESULT" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'vad-calibrated-local-snr-v1.json'
          ).read_text())
          result = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'vad-calibrated-local-snr-v1-result.json'
          ).read_text())

          assert contract['authority'] == 'DIAGNOSTIC_ONLY_FIXED_COUNTERFACTUAL'
          assert contract['source_base_sha'] == '1b262387af2b0af07f22917f3bcef300fbb74aac'
          assert contract['fresh_diagnostic_authority']['seeds'] == [161123, 171123, 181123]
          assert contract['budget'] == {
              'candidate_limit': 0,
              'confirmation_limit': 0,
              'diagnostic_execution_limit': 1,
          }
          assert contract['fresh_diagnostic_authority']['candidate_value_search'] is False
          assert contract['fresh_diagnostic_authority']['threshold_search'] is False
          assert all(value is False for value in contract['authority_boundary'].values())

          fixed = contract['fixed_counterfactual']
          assert fixed['calibrated_noise_reference']['scale_offset_db'] == 32.16113097315181
          assert fixed['threshold_changes'] is False
          assert fixed['hold_changes'] is False
          assert fixed['blend_changes'] is False
          assert fixed['shipping_source_mutation'] is False
          assert fixed['public_api_mutation'] is False

          assert result['status'] == 'CLOSED_DIAGNOSTIC_ONLY'
          assert result['authority'] == contract['authority']
          assert result['source_base_sha'] == contract['source_base_sha']
          assert result['decision'] == 'CALIBRATED_LOCAL_SNR_REGRESSION_REVIEW_REQUIRED'
          assert result['reviewed_decision'] == (
              'DIRECT_CALIBRATED_LOCAL_SNR_REPLACEMENT_REJECTED_KEEP_SHIPPING_BASELINE'
          )

          execution = result['authoritative_execution']
          assert execution['workflow_run_id'] == 35948820088
          assert execution['artifact_id'] == 10788040667
          assert execution['artifact_digest'] == (
              'sha256:22ebe69a2d164d29b006aa01fb64e8b72d00c377eeb5e0f4a1e8828040b61ec9'
          )
          assert execution['internal_sha256s_verified'] == 9
          assert execution['result_sha256'] == (
              'b42fcf7dc6d44584cad797dc4efb42f43991ca6ea530b24b2a71b2a578533f35'
          )

          fresh = result['fresh_authority']
          assert fresh['seeds'] == [161123, 171123, 181123]
          assert fresh['diagnostic_execution_limit'] == 1
          assert fresh['diagnostic_execution_consumed'] == 1
          assert fresh['candidate_limit_consumed'] == 0
          assert fresh['confirmation_limit_consumed'] == 0
          assert fresh['threshold_search_performed'] is False
          assert fresh['candidate_search_performed'] is False

          integrity = result['input_integrity']
          assert integrity['mirror_probability_mismatch_frames'] == 0
          assert integrity['mirror_active_mismatch_frames'] == 0
          assert integrity['floor_probability_mismatch_frames'] == 0
          assert integrity['floor_active_mismatch_frames'] == 0
          assert integrity['max_floor_noise_reference_delta_db'] == 0.0
          assert integrity['max_floor_upstream_probability_delta'] == 0.0
          assert integrity['input_violations'] == 0

          aggregate = result['aggregate']
          assert aggregate['shipping_recall'] == 0.8185185185185185
          assert aggregate['counterfactual_recall'] == 0.5012345679012346
          assert aggregate['lost_speech_frames'] == 524
          assert aggregate['gained_speech_frames'] == 10
          assert aggregate['shipping_false_positive_rate'] == 0.2222222222222222
          assert aggregate['counterfactual_false_positive_rate'] == 0.19747474747474747

          regressions = result['partition_regressions']
          assert [row['seed'] for row in regressions] == [161123, 171123, 181123]
          assert all(row['recall_drop'] > row['allowed_recall_drop'] for row in regressions)

          assert result['reviewed_interpretation']['direct_replacement_supported'] is False
          assert result['reviewed_interpretation']['shipping_baseline_retained'] is True
          assert all(value is False for value in result['authority_boundary'].values())
          PY
          git cat-file -e "1b262387af2b0af07f22917f3bcef300fbb74aac^{commit}"

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: vad-calibrated-local-snr-contract

      - name: Compile retained test-only counterfactual probe
        run: |
          set -euo pipefail
          cmake -S . -B build-vad-cal-snr-contract             -DCMAKE_BUILD_TYPE=Release             -DAP_BUILD_BENCH=OFF             -DAP_STRICT_WARNINGS=ON
          cmake --build build-vad-cal-snr-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -Iinclude -Ibuild-vad-cal-snr-contract/generated             tests/validation/vad_calibrated_local_snr_probe.c             build-vad-cal-snr-contract/libaudio_pipeline.a -lm             -o build-vad-cal-snr-contract/vad_calibrated_local_snr_probe
