name: Release v2.2.5 Closure Once

on:
  push:
    branches:
      - release/v2.2.5-lab-runtime-closure
    paths:
      - .github/workflows/release-v2.2.5-closure-once.yml

permissions:
  contents: write

jobs:
  closure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/v2.2.5-lab-runtime-closure
          fetch-depth: 0
      - name: Prove exact base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = c6d4d5a73d63eac0aa1eb87e4cd065a51ee79bad
          test "$(git merge-base HEAD origin/main)" = c6d4d5a73d63eac0aa1eb87e4cd065a51ee79bad
          test "$(git diff --name-only origin/main...HEAD)" = '.github/workflows/release-v2.2.5-closure-once.yml'
          grep -q '^project(audio_pipeline VERSION 2.2.4 ' CMakeLists.txt
      - name: Materialize v2.2.5 release metadata
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^project(audio_pipeline VERSION 2\.2\.4 /project(audio_pipeline VERSION 2.2.5 /' CMakeLists.txt
          {
            printf '%s\n' '# 2.2.5' ''
            printf '%s\n' '- Seal the permanent ordinary-user laboratory runtime admission gate into an immutable release: required full verification now executes real `audio-validation` and `audio-target` provisioning under fresh Ubuntu accounts with no sudo/admin membership.'
            printf '%s\n' '- Preserve v2.2.3/v2.2.4 runner-local dataset, board-manifest, readiness and Product Certification defaults while versioning the current required-gate source state so `main`, tag and immutable Release no longer diverge.'
            printf '%s\n' '- No DSP/API/ABI behavior, dataset hashes/licenses, acoustic/resource/HIL thresholds or Product Certification authority changed.' ''
            cat CHANGELOG.md
          } > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md
          grep -q '^# 2.2.5$' CHANGELOG.md
      - name: Validate governance and laboratory contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/scripts/labctl.py self-test
          python3 tools/runner_preflight.py --self-test
          python3 tools/ap_certify.py --self-test
          python3 scripts/docs_consistency.py
          bash scripts/check-architecture.sh
      - name: Strict build and complete CTest
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-v225 -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-v225 --parallel 2
          ctest --test-dir build-v225 --output-on-failure
      - name: Commit v2.2.5 metadata only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CMakeLists.txt CHANGELOG.md
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = 'CHANGELOG.md CMakeLists.txt '
          git commit -m 'release: v2.2.5 Lab Runtime Admission Closure'
          git push origin HEAD:release/v2.2.5-lab-runtime-closure
