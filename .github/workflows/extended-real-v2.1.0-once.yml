name: Extended Real v2.1.0 One-Time Migration

on:
  push:
    branches: [feat/extended-real-validation-v2.1.0]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: feat/extended-real-validation-v2.1.0
      - name: Apply evaluator migration
        run: |
          set -euo pipefail
          python3 tools/migrate_extended_real_v2_1_0.py
      - name: Validate Python and contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            validation/tools/run_validation.py \
            validation/tools/split_holdout.py \
            validation/tools/extended_dataset_lock.py \
            validation/tools/prepare_extended_validation.py \
            validation/tools/build_extended_real_corpus.py
          python3 validation/tools/run_validation.py --self-test
          python3 validation/tools/split_holdout.py --self-test
          python3 validation/tools/extended_dataset_lock.py self-test
          python3 validation/tools/prepare_extended_validation.py self-test
          python3 validation/tools/build_extended_real_corpus.py --self-test
          python3 scripts/docs_consistency.py
          sh scripts/check-architecture.sh
          git diff --check
      - name: Strict build and CTest
        run: |
          set -euo pipefail
          cmake -S . -B build-v2.1.0 -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-v2.1.0 --parallel
          ctest --test-dir build-v2.1.0 --output-on-failure
      - name: Commit validated migration
        run: |
          set -euo pipefail
          rm tools/migrate_extended_real_v2_1_0.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A ':!.github/workflows/extended-real-v2.1.0-once.yml'
          git diff --cached --check
          git commit -m 'validation: extend real-data evaluator and blind gates'
          git push origin HEAD:feat/extended-real-validation-v2.1.0
