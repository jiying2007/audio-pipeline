name: Research I025 NS Upstream Disagreement Noise Source Decomposition v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i025-ns-upstream-disagreement-noise-source-decomposition-v1.json'
      - '.github/research/continuous-optimization/development-v4/i025-ns-upstream-disagreement-noise-source-decomposition-v1-result.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_decomposition.py'
      - 'tests/validation/test_i025_one_shot_guard.py'
      - 'tests/validation/test_i025_retirement.py'
      - 'tests/validation/data/i025-consumed-workflow.yml'
      - 'validation/research/evidence/i025-36516678401/**'
      - '.github/workflows/research-i025-ns-upstream-disagreement-noise-source-decomposition-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I025 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool             .github/research/continuous-optimization/development-v4/i025-ns-upstream-disagreement-noise-source-decomposition-v1-result.json >/dev/null
          python3 -m py_compile             tests/validation/i025_ns_upstream_disagreement_noise_source_decomposition.py             tests/validation/test_i025_one_shot_guard.py             tests/validation/test_i025_retirement.py
          python3 tests/validation/i025_ns_upstream_disagreement_noise_source_decomposition.py --self-test
          python3 tests/validation/test_i025_one_shot_guard.py
          python3 tests/validation/test_i025_retirement.py
