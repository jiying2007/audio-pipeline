name: Research Double-Talk Onset Diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/doubletalk-case-guard-v5-closure.json'
      - '.github/research/continuous-optimization/development-v3/doubletalk-onset-diagnostic-v1.json'
      - '.github/research/continuous-optimization/research_optimizer_v5.py'
      - '.github/research/continuous-optimization/doubletalk_onset_diagnostic.py'
      - '.github/workflows/research-doubletalk-onset-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/doubletalk-case-guard-v5-closure.json'
      - '.github/research/continuous-optimization/development-v3/doubletalk-onset-diagnostic-v1.json'
      - '.github/research/continuous-optimization/research_optimizer_v5.py'
      - '.github/research/continuous-optimization/doubletalk_onset_diagnostic.py'
      - '.github/workflows/research-doubletalk-onset-diagnostic.yml'

permissions:
  contents: read

jobs:
  doubletalk-onset-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Bind diagnostic to exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Validate diagnostic-only authority and closure
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/doubletalk_onset_diagnostic.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path

          closure = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/'
              'doubletalk-case-guard-v5-closure.json'
          ).read_text())
          manifest = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/'
              'doubletalk-onset-diagnostic-v1.json'
          ).read_text())

          assert closure['status'] == 'CLOSED_KEEP_BASELINE'
          assert closure['decision'] == 'KEEP_BASELINE'
          assert closure['run_id'] == 35069696052
          assert closure['artifact']['id'] == 10436805396
          assert closure['artifact']['digest'] == (
              'sha256:0237bc87f2ac096060c3e1dbcccb1451f03187142864ff1e6d009175e4fc12a2'
          )
          assert closure['source_sha'] == 'aeedc6c95a78c74454f79eaa6e166b21ccb27571'
          assert closure['evidence_summary']['eligible_nonbaseline_candidates'] == 0
          assert closure['next_action'].startswith('development-only')

          assert manifest['status'] == 'DIAGNOSTIC_ONLY'
          assert manifest['candidate_budget'] == 0
          assert manifest['development_seeds'] == [1307, 1407]
          assert manifest['output_authority'] == {
              'candidate_selection': False,
              'hil': False,
              'product_certification': False,
              'research_diagnostic_only': True,
              'shipping': False,
          }
          base = manifest['profiles']['baseline']
          probe = manifest['profiles']['high_mu_probe']
          assert base['aec_mu'] == 0.22 and probe['aec_mu'] == 0.30
          for key in ('ns_floor', 'agc_target_dbfs', 'limiter_dbfs'):
              assert base[key] == probe[key]
          print('double-talk diagnostic authority: PASS')
          PY

      - name: Build exact offline processor
        run: |
          set -euo pipefail
          cmake -S . -B build-dt-diagnostic \
            -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_BENCH=OFF \
            -DAP_STRICT_WARNINGS=ON
          cmake --build build-dt-diagnostic --target ap_process_pcm --parallel

      - name: Build deterministic development corpora
        run: |
          set -euo pipefail
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-dt-1307 --seed 1307
          python3 validation/tools/build_validation_corpus.py --output /tmp/ap-dt-1407 --seed 1407

      - name: Run development-only onset diagnostic
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/doubletalk_onset_diagnostic.py \
            --processor build-dt-diagnostic/ap_process_pcm \
            --manifest .github/research/continuous-optimization/development-v3/doubletalk-onset-diagnostic-v1.json \
            --corpus /tmp/ap-dt-1307/corpus.json \
            --corpus /tmp/ap-dt-1407/corpus.json \
            --output doubletalk-onset-diagnostic-out/result.json

      - name: Enforce pre-AEC detector invariance and publish summary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          result = json.loads(Path('doubletalk-onset-diagnostic-out/result.json').read_text())
          assert result['authority'] == 'research-diagnostic-only'
          assert result['candidate_budget'] == 0

          grouped = defaultdict(dict)
          for row in result['records']:
              grouped[(row['corpus'], row['case_id'])][row['profile']] = row

          missing_dt = 0
          delayed_dt = 0
          total_segments = 0
          for key, profiles in grouped.items():
              assert set(profiles) == {'baseline', 'high_mu_probe'}, key
              base = profiles['baseline']['segments']
              probe = profiles['high_mu_probe']['segments']
              assert len(base) == len(probe)
              for bseg, pseg in zip(base, probe):
                  total_segments += 1
                  assert bseg['near_onset_frame'] == pseg['near_onset_frame']
                  assert bseg['first_double_talk_frame'] == pseg['first_double_talk_frame']
                  assert bseg['double_talk_onset_delay_frames'] == pseg['double_talk_onset_delay_frames']
                  if bseg['first_double_talk_frame'] is None:
                      missing_dt += 1
                  elif (bseg['double_talk_onset_delay_frames'] or 0) > 0:
                      delayed_dt += 1

          summary = {
              'authority': result['authority'],
              'candidate_budget': 0,
              'case_profile_pairs': len(grouped),
              'near_segments': total_segments,
              'segments_without_double_talk_detection': missing_dt,
              'segments_with_positive_double_talk_delay': delayed_dt,
          }
          Path('doubletalk-onset-diagnostic-out/summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          with Path('doubletalk-onset-diagnostic-out/summary.md').open('w') as fh:
              fh.write('## Double-talk onset diagnostic\n')
              for key, value in summary.items():
                  fh.write(f'- {key}: `{value}`\n')
          print(json.dumps(summary, sort_keys=True))
          PY
          cat doubletalk-onset-diagnostic-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: doubletalk-onset-diagnostic-${{ github.run_id }}
          path: doubletalk-onset-diagnostic-out/
          if-no-files-found: error
          retention-days: 30
