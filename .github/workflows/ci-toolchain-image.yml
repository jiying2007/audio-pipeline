name: CI Toolchain Image

on:
  pull_request:
    branches: [main]
    paths:
      - ci/Dockerfile
      - ci/toolchain-smoke.sh
      - .github/workflows/ci-toolchain-image.yml
  push:
    branches: [main]
    paths:
      - ci/Dockerfile
      - ci/toolchain-smoke.sh
      - .github/workflows/ci-toolchain-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-toolchain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build the exact proposed Dockerfile
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull -f ci/Dockerfile -t ap-ci-candidate .
      - name: Execute native and Arm emulation tests in the candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-image-candidate"
          docker run --rm -e SOURCE_SHA \
            -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/ci-image-candidate:/evidence" \
            -w /workspace ap-ci-candidate sh ci/toolchain-smoke.sh /evidence
      - name: Preserve the original candidate execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-candidate-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/ci-image-candidate/
          if-no-files-found: error

  build-and-verify:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Login to GHCR
        shell: bash
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build the main candidate
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/jiying2007/audio-pipeline-ci:ci-${GITHUB_SHA}"
          docker build --pull -f ci/Dockerfile -t "$image" .
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Execute native and Arm tests before publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ci-image/before-publish"
          docker run --rm -e SOURCE_SHA \
            -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/ci-image/before-publish:/evidence" \
            -w /workspace "$IMAGE" sh ci/toolchain-smoke.sh /evidence
      - name: Publish the SHA tag
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE" | tee "$RUNNER_TEMP/ci-image/push.log"
          ref=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          [[ "$ref" =~ ^ghcr.io/jiying2007/audio-pipeline-ci@sha256:[0-9a-f]{64}$ ]]
          digest=${ref##*@}
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$ref" > "$RUNNER_TEMP/ci-image/published-reference.txt"
      - name: Pull the digest and execute all four profiles again
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/jiying2007/audio-pipeline-ci@${{ steps.publish.outputs.digest }}"
          docker pull "$ref"
          mkdir -p "$RUNNER_TEMP/ci-image/digest-readback"
          docker run --rm -e SOURCE_SHA \
            -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/ci-image/digest-readback:/evidence" \
            -w /workspace "$ref" sh ci/toolchain-smoke.sh /evidence
          cmp "$RUNNER_TEMP/ci-image/before-publish/receipt.json" \
              "$RUNNER_TEMP/ci-image/digest-readback/receipt.json"
      - name: Advance the stable pointer after verified digest readback
        shell: bash
        run: |
          set -euo pipefail
          ref="ghcr.io/jiying2007/audio-pipeline-ci@${{ steps.publish.outputs.digest }}"
          stable=ghcr.io/jiying2007/audio-pipeline-ci:ci-latest
          docker tag "$ref" "$stable"
          docker push "$stable" | tee "$RUNNER_TEMP/ci-image/stable-push.log"
          echo "Qualified reference: $ref" >> "$GITHUB_STEP_SUMMARY"
          echo 'Consumer digests require a separate reviewed change.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve original build and digest execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image-qualified-${{ github.sha }}
          path: ${{ runner.temp }}/ci-image/
          if-no-files-found: error
