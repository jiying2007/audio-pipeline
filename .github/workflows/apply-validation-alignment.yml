name: Apply validation alignment correction

on:
  push:
    branches: [validation/v1.3.0]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply staged alignment correction when present
        run: |
          if [ ! -f scripts/apply_validation_alignment.py ]; then
            echo "alignment updater already consumed"
            exit 0
          fi
          python3 scripts/apply_validation_alignment.py
          python3 validation/tools/run_validation.py --self-test
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A validation/tools/run_validation.py scripts/apply_validation_alignment.py
          git commit -m "validation: align reference metrics to processor latency"
          git push origin HEAD:validation/v1.3.0
