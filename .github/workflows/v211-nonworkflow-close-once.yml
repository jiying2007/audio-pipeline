name: V2.1.1 Non-Workflow Closure One-Time

on:
  push:
    branches: [feat/v2.1.1-auto-real-closure]
    paths: [.github/workflows/v211-nonworkflow-close-once.yml]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/v2.1.1-auto-real-closure
          fetch-depth: 0
      - name: Apply version and documentation closure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CMakeLists.txt'); t=p.read_text(); t=t.replace('project(audio_pipeline VERSION 2.1.0 LANGUAGES C)','project(audio_pipeline VERSION 2.1.1 LANGUAGES C)',1); p.write_text(t)
          p=Path('CHANGELOG.md'); t=p.read_text()
          if not t.startswith('# 2.1.1'):
              p.write_text('# 2.1.1\n\n- Make post-release Extended Real automation reliable through the explicit `extended-real-post-release` repository-dispatch channel.\n- Add a required hosted real-audio smoke using four exact-revision SHA-256-pinned CC-BY-4.0 Microsoft P.808 clips.\n- Verify upstream SHA-256/Git blob identity, WAV geometry, stereo-to-mono materialization, 48 kHz boundary resampling, processor safety and hash-bound evidence on every PR/main Verify.\n- Hosted real smoke remains validation evidence only; Extended Real, DUT HIL and 72 h Product Certification remain separate higher-trust gates.\n\n'+t)
          sections={
            'README.md':'Hosted CI also runs a required **Microsoft P.808 real-audio smoke** on four exact-revision CC-BY-4.0 clips. Inputs are SHA-256/Git-blob pinned, never stored in Git, and exercise stereo-to-mono materialization plus 48 kHz boundary resampling. This is validation-grade safety evidence, not far-field or product-certified evidence.',
            'README.zh-CN.md':'Hosted CI 还会强制运行 **Microsoft P.808 真实音频 smoke**：4 个 CC-BY-4.0 clip 固定到 exact revision，并校验 SHA-256/Git blob；不把音频提交进 Git，同时覆盖 stereo-to-mono materialization 与 48 kHz 边界重采样。这只是 validation-grade safety evidence，不代表远场或 product-certified 证据。',
            'docs/TESTING.md':'## Hosted real-audio smoke\n\nEvery PR and `main` Verify runs four SHA-pinned CC-BY-4.0 Microsoft P.808 clips on GitHub-hosted Linux. The gate verifies upstream bytes, WAV geometry, materialization, processor identity, clipping/DC/RMS safety and hash-bound evidence. It is required by `summary` but does not replace Extended Real, DUT HIL or Product Certification.',
            'docs/TESTING.zh-CN.md':'## Hosted 真实音频 smoke\n\n每个 PR 与 `main` Verify 都在 GitHub-hosted Linux 上处理 4 个 SHA 固定的 CC-BY-4.0 Microsoft P.808 clip，验证上游字节、WAV 几何、materialization、processor identity、clipping/DC/RMS safety 与 hash-bound evidence。该 gate 是 required `summary` 的一部分，但不能替代 Extended Real、DUT HIL 或 Product Certification。',
            'validation/README.md':'## Hosted real-audio smoke\n\n`hosted_real.datasets.lock.json` pins four small CC-BY-4.0 Microsoft P.808 WAVs to an exact upstream revision and SHA-256. `Verify` downloads them on GitHub-hosted Linux, rechecks SHA-256 and Git blob identity, materializes mono PCM, and enforces `validation-hosted-real-smoke.json` through the canonical evaluator. Raw third-party audio remains outside this repository.'
          }
          for name,section in sections.items():
              p=Path(name); text=p.read_text(); marker=section.splitlines()[0]
              if marker not in text: p.write_text(text.rstrip()+"\n\n"+section+"\n")
          PY
      - name: Validate workflows contracts docs and pinned real audio
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; ARGV.each { |p| Psych.parse_file(p) or abort(p) }' .github/workflows/*.yml
          python3 -m py_compile validation/tools/*.py
          sh scripts/check-architecture.sh
          python3 scripts/docs_consistency.py
          cmake -S . -B build-v211 -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-v211 --target ap_process_pcm ap_build_info_dump --parallel
          root=/tmp/ap-hosted-real-final
          python3 validation/tools/build_hosted_real_corpus.py build --lock validation/hosted_real.datasets.lock.json --output "$root"
          python3 validation/tools/run_validation.py --corpus "$root/corpus.json" --policy validation/policies/validation-hosted-real-smoke.json --dataset-lock validation/hosted_real.datasets.lock.json --source-manifest "$root/source-manifest.json" --processor ./build-v211/ap_process_pcm --source-revision "$(git rev-parse HEAD)" --output "$root/report.json" --evidence-manifest "$root/evidence.json" --enforce
          git diff --check
      - name: Commit verified non-workflow closure
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt CHANGELOG.md README.md README.zh-CN.md docs/TESTING.md docs/TESTING.zh-CN.md validation/README.md
          git commit -m 'release: finalize v2.1.1 real-data documentation'
          git push origin HEAD:feat/v2.1.1-auto-real-closure
