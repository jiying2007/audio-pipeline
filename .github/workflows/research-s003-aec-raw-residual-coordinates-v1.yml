name: Research S003 AEC Raw Residual Coordinates v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-joint-geometry-confirmation-v1-result.json'
      - 'validation/tools/aec_residual_raw_coordinate_decomposition.py'
      - 'validation/tools/aec_residual_energy_trajectory.py'
      - 'validation/tools/aec_res_gain_contribution_decomposition.py'
      - 'validation/policies/validation-s003-res-gain-contribution.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_residual_geometry_probe.c'
      - '.github/workflows/research-s003-aec-raw-residual-coordinates-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-joint-geometry-confirmation-v1-result.json'
      - 'validation/tools/aec_residual_raw_coordinate_decomposition.py'
      - 'validation/tools/aec_residual_energy_trajectory.py'
      - 'validation/tools/aec_res_gain_contribution_decomposition.py'
      - 'validation/policies/validation-s003-res-gain-contribution.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_residual_geometry_probe.c'
      - '.github/workflows/research-s003-aec-raw-residual-coordinates-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s003-aec-raw-residual-coordinates-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-raw-residual-coordinates

      - name: Validate candidate-zero raw-coordinate contract
        run: |
          set -euo pipefail
          python3 -m json.tool docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1.json >/dev/null
          python3 -m py_compile             validation/tools/aec_residual_raw_coordinate_decomposition.py             validation/tools/aec_residual_energy_trajectory.py             validation/tools/aec_res_gain_contribution_decomposition.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_residual_raw_coordinate_decomposition.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-joint-geometry-confirmation-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_RAW_COORDINATE_ANALYSIS_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['corpus']['fresh_seeds']==[18707,18807,18907,19007,19107,19207,19307,19407]
          assert c['corpus']['analysis_profile']=='prefix-aec'
          assert c['measurement']['geometry_id']=='100w-50s'
          assert c['raw_coordinates']['identity']=='R = M + E - 2*C'
          assert set(c['counterfactuals'])=={'freeze_M','freeze_E','freeze_C'}
          assert c['physical_validity']['required_for_counterfactual_interpretation'] is True
          assert c['physical_validity']['invalid_policy'].startswith('counterfactual is marked physically_inadmissible')
          assert c['preregistered_rules']['no_reference_adjustment_after_results'] is True
          assert c['preregistered_rules']['no_coordinate_scale_search'] is True
          assert c['preregistered_rules']['no_invalid_value_clamping_except_roundoff_within_declared_tolerance'] is True
          assert c['preregistered_rules']['no_filter_weight_inspection'] is True
          assert c['preregistered_rules']['no_tap_inspection'] is True
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['reviewed_validity']['joint_geometry_change_is_repeatable_mechanical_contributor'] is True
          assert p['reviewed_validity']['q_root_cause_proven'] is False
          assert p['reviewed_validity']['rho_root_cause_proven'] is False
          print('S003 raw residual-coordinate authority: PASS')
          PY

      - name: Build fixed processor and existing test-only residual probe
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-raw-coordinates             -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON             -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-raw-coordinates --target audio_pipeline --parallel

          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-raw-coordinates/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-raw-coordinates/libaudio_pipeline.a -lm             -o build-s003-raw-coordinates/stage_prefix_process_pcm

          python3 - <<'PY' > /tmp/s003-raw-coordinate-defs.txt
          import json,shlex
          from pathlib import Path
          db=json.loads(Path('build-s003-raw-coordinates/compile_commands.json').read_text())
          matches=[row for row in db if 'audio_pipeline.dir' in row.get('command','') or 'audio_pipeline.dir' in ' '.join(row.get('arguments',[]))]
          if not matches: raise SystemExit('audio_pipeline compile command not found')
          row=matches[0]; args=row.get('arguments') or shlex.split(row['command'])
          defs=[]
          for arg in args:
              if arg.startswith('-D') and arg not in defs: defs.append(arg)
          for item in ['AP_BUILD_STAGE_AEC=1','AP_BUILD_STAGE_SYNC=1']:
              if item not in ' '.join(defs): raise SystemExit(f'missing required compile define: {item}')
          print('\n'.join(defs))
          PY
          mapfile -t AP_DEFS < /tmp/s003-raw-coordinate-defs.txt
          cc -std=c11 -Wall -Wextra -Werror "${AP_DEFS[@]}"             -Iinclude -Isrc -Ibuild-s003-raw-coordinates/generated             tests/validation/s003_aec_residual_geometry_probe.c             build-s003-raw-coordinates/libaudio_pipeline.a -lm             -o build-s003-raw-coordinates/s003_aec_residual_geometry_probe

      - name: Run fresh raw-coordinate counterfactuals
        run: |
          set -euo pipefail
          out=s003-aec-raw-coordinate-out
          mkdir -p "$out"
          raw_contract=docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1.json
          geometry_contract=docs/program/iterations/S003-aec-residual-energy-trajectory-decomposition-v1.json

          for seed in 18707 18807 18907 19007 19107 19207 19307 19407; do
            corpus="/tmp/s003-aec-raw-coordinate-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            PYTHONPATH=validation/tools               python3 validation/tools/aec_res_gain_contribution_decomposition.py build                 --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools               python3 validation/tools/stage_interaction_run.py                 --source-revision '${{ github.sha }}'                 --corpus "$corpus/corpus.json"                 --policy validation/policies/validation-s003-res-gain-contribution.json                 --dataset-lock validation/datasets.lock.json                 --processor build-s003-raw-coordinates/stage_prefix_process_pcm                 --output "$seed_out/canonical-report.json"                 --evidence-manifest "$seed_out/evidence-manifest.json"                 --enforce

            PYTHONPATH=validation/tools               python3 validation/tools/aec_residual_energy_trajectory.py run                 --corpus "$corpus/corpus.json"                 --report "$seed_out/canonical-report.json"                 --processor build-s003-raw-coordinates/stage_prefix_process_pcm                 --probe build-s003-raw-coordinates/s003_aec_residual_geometry_probe                 --contract "$geometry_contract"                 --trace-output "$seed_out/residual-geometry-trace.jsonl"                 --output "$seed_out/residual-geometry-receipt.json"

            PYTHONPATH=validation/tools               python3 validation/tools/aec_residual_raw_coordinate_decomposition.py run                 --corpus "$corpus/corpus.json"                 --receipt "$seed_out/residual-geometry-receipt.json"                 --trace "$seed_out/residual-geometry-trace.jsonl"                 --contract "$raw_contract"                 --output "$seed_out/raw-coordinate-receipt.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools             python3 validation/tools/aec_residual_raw_coordinate_decomposition.py aggregate               --contract "$raw_contract"               --input "$out/18707/raw-coordinate-receipt.json"               --input "$out/18807/raw-coordinate-receipt.json"               --input "$out/18907/raw-coordinate-receipt.json"               --input "$out/19007/raw-coordinate-receipt.json"               --input "$out/19107/raw-coordinate-receipt.json"               --input "$out/19207/raw-coordinate-receipt.json"               --input "$out/19307/raw-coordinate-receipt.json"               --input "$out/19407/raw-coordinate-receipt.json"               --output "$out/cross-seed-raw-coordinate-summary.json"

          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-raw-coordinate-out/cross-seed-raw-coordinate-summary.json').read_text())
          print({
              'standard_aec_recovery_ms':r['standard_aec_recovery_ms'],
              'raw_coordinate_summary':r['raw_coordinate_summary'],
          })
          PY

          cp "$raw_contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish raw-coordinate evidence
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-raw-coordinate-out/cross-seed-raw-coordinate-summary.json').read_text())
          print('## S003 AEC raw residual-coordinate decomposition')
          print('')
          print('- Authority: **candidate-zero raw-coordinate analysis only**')
          print(f"- Standard AEC recovery: `{r['standard_aec_recovery_ms']}`")
          for name,item in r['raw_coordinate_summary'].items():
              print(
                  f"- `{name}`: admissible=`{item['admissible_seed_count']}/8`, "
                  f"inadmissible=`{item['inadmissible_seed_count']}/8`, "
                  f"shifts=`{item['recovery_shift_vs_actual_ms']}`"
              )
          print('- Raw-coordinate root-cause attribution: **NOT_AUTHORIZED**')
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound raw-coordinate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s003-aec-raw-residual-coordinates-${{ github.run_id }}
          path: s003-aec-raw-coordinate-out/
          if-no-files-found: error
          retention-days: 30
