name: Research S003 AEC Echo-Path RES-Side Variability v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-echo-path-res-side-recovery-variability-v1.json'
      - 'docs/program/iterations/S003-aec-echo-path-recovery-sign-variability-v1-result.json'
      - 'validation/tools/aec_echo_path_res_side_variability.py'
      - 'validation/tools/aec_echo_path_res_ns_confirmation.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/policies/validation-s003-echo-path-res-ns-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_echo_path_res_state_probe.c'
      - '.github/workflows/research-s003-aec-echo-path-res-side-variability-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-echo-path-res-side-recovery-variability-v1.json'
      - 'docs/program/iterations/S003-aec-echo-path-recovery-sign-variability-v1-result.json'
      - 'validation/tools/aec_echo_path_res_side_variability.py'
      - 'validation/tools/aec_echo_path_res_ns_confirmation.py'
      - 'validation/tools/aec_recovery_rebaseline_100w50s.py'
      - 'validation/policies/validation-s003-echo-path-res-ns-confirm.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_echo_path_res_state_probe.c'
      - '.github/workflows/research-s003-aec-echo-path-res-side-variability-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s003-aec-echo-path-res-side-variability-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-echo-res-side

      - name: Validate candidate-zero RES-side contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-echo-path-res-side-recovery-variability-v1.json >/dev/null
          python3 -m py_compile             validation/tools/aec_echo_path_res_side_variability.py             validation/tools/aec_echo_path_res_ns_confirmation.py             validation/tools/aec_recovery_rebaseline_100w50s.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_echo_path_res_side_variability.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-echo-path-res-side-recovery-variability-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-echo-path-recovery-sign-variability-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_RES_SIDE_OBSERVATION_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['corpus']['fresh_seeds']==[14707,14807,14907,15007,15107,15207,15307,15407]
          assert c['corpus']['profiles']==['prefix-res','prefix-ns','default']
          assert c['measurement']['geometry_id']=='100w-50s'
          assert c['res_probe']['fixed_transition_relative_snapshots_ms']==[0,50,100,150,200,250,300,400]
          assert c['preregistered_rules']['retain_all_sign_classes'] is True
          assert c['preregistered_rules']['non_positive_sign_is_valid_evidence'] is True
          assert c['preregistered_rules']['no_sign_bucket_selection_for_candidate'] is True
          assert c['preregistered_rules']['no_res_state_threshold_fitting'] is True
          assert c['preregistered_rules']['no_state_family_ranking'] is True
          assert c['preregistered_rules']['no_root_cause_selection'] is True
          assert c['preregistered_rules']['no_res_parameter_search'] is True
          assert c['authority_boundary']['may_claim_res_root_cause'] is False
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['reviewed_validity']['non_positive_seed_is_res_side_delay'] is True
          print('S003 echo-path RES-side variability authority: PASS')
          PY

      - name: Build fixed processors and test-only RES state probe
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-res-side             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_EXPORT_COMPILE_COMMANDS=ON             -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-res-side --target audio_pipeline --parallel

          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-res-side/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-res-side/libaudio_pipeline.a -lm             -o build-s003-res-side/stage_prefix_process_pcm

          python3 - <<'PY' > /tmp/s003-res-side-defs.txt
          import json, shlex
          from pathlib import Path
          db=json.loads(Path('build-s003-res-side/compile_commands.json').read_text())
          matches=[
              row for row in db
              if 'audio_pipeline.dir' in row.get('command','')
              or 'audio_pipeline.dir' in ' '.join(row.get('arguments',[]))
          ]
          if not matches:
              raise SystemExit('audio_pipeline compile command not found')
          row=matches[0]
          args=row.get('arguments') or shlex.split(row['command'])
          defs=[]
          for arg in args:
              if arg.startswith('-D') and arg not in defs:
                  defs.append(arg)
          required=[
              'AP_BUILD_STAGE_AEC=1','AP_BUILD_STAGE_RES=1','AP_BUILD_STAGE_SYNC=1',
          ]
          joined=' '.join(defs)
          for item in required:
              if item not in joined:
                  raise SystemExit(f'missing required compile define: {item}')
          print('\n'.join(defs))
          PY
          mapfile -t AP_DEFS < /tmp/s003-res-side-defs.txt
          cc -std=c11 -Wall -Wextra -Werror             "${AP_DEFS[@]}"             -Iinclude -Isrc -Ibuild-s003-res-side/generated             tests/validation/s003_aec_echo_path_res_state_probe.c             build-s003-res-side/libaudio_pipeline.a -lm             -o build-s003-res-side/s003_aec_echo_path_res_state_probe

      - name: Run fresh RES-side variability observations
        run: |
          set -euo pipefail
          out=s003-aec-res-side-out
          mkdir -p "$out"
          contract=docs/program/iterations/S003-aec-echo-path-res-side-recovery-variability-v1.json

          for seed in 14707 14807 14907 15007 15107 15207 15307 15407; do
            corpus="/tmp/s003-aec-res-side-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            PYTHONPATH=validation/tools               python3 validation/tools/aec_echo_path_res_ns_confirmation.py build                 --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools               python3 validation/tools/stage_interaction_run.py                 --source-revision '${{ github.sha }}'                 --corpus "$corpus/corpus.json"                 --policy validation/policies/validation-s003-echo-path-res-ns-confirm.json                 --dataset-lock validation/datasets.lock.json                 --processor build-s003-res-side/stage_prefix_process_pcm                 --output "$seed_out/canonical-report.json"                 --evidence-manifest "$seed_out/evidence-manifest.json"                 --enforce

            PYTHONPATH=validation/tools               python3 validation/tools/aec_echo_path_res_side_variability.py run                 --corpus "$corpus/corpus.json"                 --report "$seed_out/canonical-report.json"                 --processor build-s003-res-side/stage_prefix_process_pcm                 --res-probe build-s003-res-side/s003_aec_echo_path_res_state_probe                 --contract "$contract"                 --trace-output "$seed_out/res-state-trace.jsonl"                 --output "$seed_out/res-side-receipt.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools             python3 validation/tools/aec_echo_path_res_side_variability.py aggregate               --contract "$contract"               --input "$out/14707/res-side-receipt.json"               --input "$out/14807/res-side-receipt.json"               --input "$out/14907/res-side-receipt.json"               --input "$out/15007/res-side-receipt.json"               --input "$out/15107/res-side-receipt.json"               --input "$out/15207/res-side-receipt.json"               --input "$out/15307/res-side-receipt.json"               --input "$out/15407/res-side-receipt.json"               --output "$out/cross-seed-res-side-summary.json"

          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-res-side-out/cross-seed-res-side-summary.json').read_text())
          assert r['probe_output_bitwise_equivalent_all_seeds'] is True
          print({
              'sign_distribution':r['sign_distribution'],
              'extension_ms_by_seed':r['extension_ms_by_seed'],
          })
          PY

          cp "$contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish RES-side evidence
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-res-side-out/cross-seed-res-side-summary.json').read_text())
          print('## S003 echo-path RES-side recovery variability')
          print('')
          print('- Authority: **candidate-zero RES-side observation only**')
          print(f"- Probe bitwise-equivalent: `{r['probe_output_bitwise_equivalent_all_seeds']}`")
          print(f"- Sign distribution: `{r['sign_distribution']}`")
          print(f"- NS-minus-RES ms by seed: `{r['extension_ms_by_seed']}`")
          print('- State-family ranking: **NOT_AUTHORIZED**')
          print('- RES root-cause attribution: **NOT_AUTHORIZED**')
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound RES-side evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s003-aec-echo-path-res-side-${{ github.run_id }}
          path: s003-aec-res-side-out/
          if-no-files-found: error
          retention-days: 30
