name: Research I037 NS Aggregation Exact Order Recovery v1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i037-ns-noise-estimate-aggregation-exact-order-recovery-v1.json'
      - '.github/research/continuous-optimization/development-v4/i037-ns-noise-estimate-aggregation-exact-order-recovery-v1-result.json'
      - 'tests/validation/i037_ns_noise_estimate_aggregation_exact_order_probe.c'
      - 'tests/validation/i037_ns_noise_estimate_aggregation_exact_order_recovery.py'
      - 'tests/validation/test_i037_one_shot_guard.py'
      - 'tests/validation/test_i037_retirement.py'
      - 'tests/validation/data/i037-consumed-workflow.yml'
      - 'validation/research/evidence/i037-36824635292/**'
      - '.github/workflows/research-i037-ns-noise-estimate-aggregation-exact-order-recovery-v1.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate consumed I037 authority and reviewed closure
        run: |
          set -euo pipefail
          python3 -m json.tool \
            .github/research/continuous-optimization/development-v4/i037-ns-noise-estimate-aggregation-exact-order-recovery-v1-result.json >/dev/null
          python3 -m py_compile \
            tests/validation/i037_ns_noise_estimate_aggregation_exact_order_recovery.py \
            tests/validation/test_i037_one_shot_guard.py \
            tests/validation/test_i037_retirement.py
          python3 tests/validation/i037_ns_noise_estimate_aggregation_exact_order_recovery.py --self-test
          python3 tests/validation/test_i037_one_shot_guard.py
          python3 tests/validation/test_i037_retirement.py
