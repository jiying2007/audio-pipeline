name: Research S003 AEC Residual Scale-Geometry v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-residual-scale-geometry-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1-result.json'
      - 'validation/tools/aec_residual_scale_geometry_decomposition.py'
      - 'validation/tools/aec_residual_energy_trajectory.py'
      - 'validation/tools/aec_res_gain_contribution_decomposition.py'
      - 'validation/policies/validation-s003-res-gain-contribution.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_residual_geometry_probe.c'
      - '.github/workflows/research-s003-aec-residual-scale-geometry-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/iterations/S003-aec-residual-scale-geometry-decomposition-v1.json'
      - 'docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1-result.json'
      - 'validation/tools/aec_residual_scale_geometry_decomposition.py'
      - 'validation/tools/aec_residual_energy_trajectory.py'
      - 'validation/tools/aec_res_gain_contribution_decomposition.py'
      - 'validation/policies/validation-s003-res-gain-contribution.json'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'tests/validation/s003_aec_residual_geometry_probe.c'
      - '.github/workflows/research-s003-aec-residual-scale-geometry-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s003-aec-residual-scale-geometry-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: s003-aec-residual-scale-geometry

      - name: Validate candidate-zero scale-geometry contract
        run: |
          set -euo pipefail
          python3 -m json.tool             docs/program/iterations/S003-aec-residual-scale-geometry-decomposition-v1.json >/dev/null
          python3 -m py_compile             validation/tools/aec_residual_scale_geometry_decomposition.py             validation/tools/aec_residual_energy_trajectory.py             validation/tools/aec_res_gain_contribution_decomposition.py
          PYTHONPATH=validation/tools             python3 validation/tools/aec_residual_scale_geometry_decomposition.py self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('docs/program/iterations/S003-aec-residual-scale-geometry-decomposition-v1.json').read_text())
          p=json.loads(Path('docs/program/iterations/S003-aec-residual-geometry-raw-coordinate-decomposition-v1-result.json').read_text())
          assert c['authority']=='CANDIDATE_ZERO_SCALE_GEOMETRY_ANALYSIS_ONLY'
          assert c['candidate_limit']==0 and c['confirmation_limit']==0
          assert c['corpus']['fresh_seeds']==[19507,19607,19707,19807,19907,20007,20107,20207]
          assert c['corpus']['analysis_profile']=='prefix-aec'
          assert c['measurement']['geometry_id']=='100w-50s'
          assert c['factorization']['equation']=='R = M * G'
          assert c['factorization']['exact_relation_to_normalized_geometry']=='G = 1 + q - 2*rho*sqrt(q)'
          assert set(c['counterfactuals'])=={'actual','freeze_geometry','freeze_scale'}
          assert c['factorization']['invalid_values_clamped'] is False
          assert c['validity_gates']['no_invalid_value_clamping'] is True
          assert c['validity_gates']['no_reference_adjustment_after_results'] is True
          assert c['preregistered_rules']['no_scale_factor_sweep'] is True
          assert c['preregistered_rules']['no_geometry_factor_sweep'] is True
          assert c['preregistered_rules']['no_filter_weight_inspection'] is True
          assert c['preregistered_rules']['no_tap_inspection'] is True
          assert c['preregistered_rules']['no_aec_mu_search'] is True
          assert c['authority_boundary']['may_open_s004'] is False
          assert p['status']==c['predecessor']['required_status']
          assert p['reviewed_validity']['raw_M_E_C_are_independently_manipulable_coordinates_for_this_signal_geometry'] is False
          print('S003 residual scale-geometry authority: PASS')
          PY

      - name: Build fixed processor and validated residual probe
        run: |
          set -euo pipefail
          cmake -S . -B build-s003-scale-geometry             -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON             -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003-scale-geometry --target audio_pipeline --parallel

          cc -std=c11 -Wall -Wextra -Werror             -Iinclude -Ibuild-s003-scale-geometry/generated             tests/validation/stage_prefix_process_pcm.c             build-s003-scale-geometry/libaudio_pipeline.a -lm             -o build-s003-scale-geometry/stage_prefix_process_pcm

          python3 - <<'PY' > /tmp/s003-scale-geometry-defs.txt
          import json,shlex
          from pathlib import Path
          db=json.loads(Path('build-s003-scale-geometry/compile_commands.json').read_text())
          matches=[row for row in db if 'audio_pipeline.dir' in row.get('command','') or 'audio_pipeline.dir' in ' '.join(row.get('arguments',[]))]
          if not matches:
              raise SystemExit('audio_pipeline compile command not found')
          row=matches[0]
          args=row.get('arguments') or shlex.split(row['command'])
          defs=[]
          for arg in args:
              if arg.startswith('-D') and arg not in defs:
                  defs.append(arg)
          for item in ['AP_BUILD_STAGE_AEC=1','AP_BUILD_STAGE_SYNC=1']:
              if item not in ' '.join(defs):
                  raise SystemExit(f'missing required compile define: {item}')
          print('\n'.join(defs))
          PY
          mapfile -t AP_DEFS < /tmp/s003-scale-geometry-defs.txt
          cc -std=c11 -Wall -Wextra -Werror             "${AP_DEFS[@]}"             -Iinclude -Isrc -Ibuild-s003-scale-geometry/generated             tests/validation/s003_aec_residual_geometry_probe.c             build-s003-scale-geometry/libaudio_pipeline.a -lm             -o build-s003-scale-geometry/s003_aec_residual_geometry_probe

      - name: Run fresh scale-geometry counterfactuals
        run: |
          set -euo pipefail
          out=s003-aec-scale-geometry-out
          mkdir -p "$out"
          scale_contract=docs/program/iterations/S003-aec-residual-scale-geometry-decomposition-v1.json
          geometry_contract=docs/program/iterations/S003-aec-residual-energy-trajectory-decomposition-v1.json

          for seed in 19507 19607 19707 19807 19907 20007 20107 20207; do
            corpus="/tmp/s003-aec-scale-geometry-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"

            PYTHONPATH=validation/tools               python3 validation/tools/aec_res_gain_contribution_decomposition.py build                 --output "$corpus" --seed "$seed" --seconds 6

            PYTHONPATH=validation/tools               python3 validation/tools/stage_interaction_run.py                 --source-revision '${{ github.sha }}'                 --corpus "$corpus/corpus.json"                 --policy validation/policies/validation-s003-res-gain-contribution.json                 --dataset-lock validation/datasets.lock.json                 --processor build-s003-scale-geometry/stage_prefix_process_pcm                 --output "$seed_out/canonical-report.json"                 --evidence-manifest "$seed_out/evidence-manifest.json"                 --enforce

            PYTHONPATH=validation/tools               python3 validation/tools/aec_residual_energy_trajectory.py run                 --corpus "$corpus/corpus.json"                 --report "$seed_out/canonical-report.json"                 --processor build-s003-scale-geometry/stage_prefix_process_pcm                 --probe build-s003-scale-geometry/s003_aec_residual_geometry_probe                 --contract "$geometry_contract"                 --trace-output "$seed_out/residual-geometry-trace.jsonl"                 --output "$seed_out/residual-geometry-receipt.json"

            PYTHONPATH=validation/tools               python3 validation/tools/aec_residual_scale_geometry_decomposition.py run                 --corpus "$corpus/corpus.json"                 --receipt "$seed_out/residual-geometry-receipt.json"                 --trace "$seed_out/residual-geometry-trace.jsonl"                 --contract "$scale_contract"                 --output "$seed_out/scale-geometry-receipt.json"

            cp "$corpus/corpus.json" "$seed_out/corpus.json"
          done

          PYTHONPATH=validation/tools             python3 validation/tools/aec_residual_scale_geometry_decomposition.py aggregate               --contract "$scale_contract"               --input "$out/19507/scale-geometry-receipt.json"               --input "$out/19607/scale-geometry-receipt.json"               --input "$out/19707/scale-geometry-receipt.json"               --input "$out/19807/scale-geometry-receipt.json"               --input "$out/19907/scale-geometry-receipt.json"               --input "$out/20007/scale-geometry-receipt.json"               --input "$out/20107/scale-geometry-receipt.json"               --input "$out/20207/scale-geometry-receipt.json"               --output "$out/cross-seed-scale-geometry-summary.json"

          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-scale-geometry-out/cross-seed-scale-geometry-summary.json').read_text())
          print({
              'standard_aec_recovery_ms':r['standard_aec_recovery_ms'],
              'scale_geometry_summary':r['scale_geometry_summary'],
          })
          PY

          cp "$scale_contract" "$out/contract.json"
          git rev-parse HEAD > "$out/source-sha.txt"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z |             xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish scale-geometry evidence
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r=json.loads(Path('s003-aec-scale-geometry-out/cross-seed-scale-geometry-summary.json').read_text())
          print('## S003 AEC residual scale-geometry decomposition')
          print('')
          print('- Authority: **candidate-zero scale/geometry analysis only**')
          print(f"- Standard AEC recovery: `{r['standard_aec_recovery_ms']}`")
          for name,item in r['scale_geometry_summary'].items():
              print(
                  f"- `{name}`: admissible=`{item['admissible_seed_count']}/8`, "
                  f"recovery=`{item['recovery_time_ms']}`, "
                  f"shift=`{item['recovery_shift_vs_actual_ms']}`"
              )
          print('- Scale/geometry root-cause attribution: **NOT_AUTHORIZED**')
          print('- Candidate authority: **none**')
          PY

      - name: Upload hash-bound scale-geometry evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: s003-aec-residual-scale-geometry-${{ github.run_id }}
          path: s003-aec-scale-geometry-out/
          if-no-files-found: error
          retention-days: 30
