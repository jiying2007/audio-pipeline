name: Apply Builder Lock Once

on:
  push:
    branches:
      - codex/github-hosted-blind
    paths:
      - .github/research/continuous-optimization/hosted-validation/patch_builder_lock_once.py
      - .github/workflows/apply-builder-lock-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/github-hosted-blind
          fetch-depth: 0
      - name: Bind frozen builder lock explicitly
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/hosted-validation/patch_builder_lock_once.py
          rm .github/research/continuous-optimization/hosted-validation/patch_builder_lock_once.py
          rm .github/workflows/apply-builder-lock-once.yml
          git diff --check
          grep -F -- '--lock source/validation/datasets.lock.json' .github/workflows/github-hosted-full-cache-probe.yml
          grep -F -- '--lock source/validation/datasets.lock.json' .github/workflows/research-candidate-blind-qualification.yml
      - name: Commit fix and retire one-shot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(validation): bind frozen corpus builder dataset lock'
          git push origin HEAD:codex/github-hosted-blind
