name: Temporary v2315 scenario summary patch

on:
  push:
    branches:
      - release/validation-scenario-summary

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: release/validation-scenario-summary
          fetch-depth: 0
      - name: Apply exact scenario summary patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          engine = Path('validation/tools/run_validation_engine.py')
          text = engine.read_text(encoding='utf-8')
          if 'SCENARIO_SUMMARY_METRICS = (' not in text:
              anchor = '''    return values[lower] * (1.0 - fraction) + values[upper] * fraction\n\ndef load_revision'''
              if text.count(anchor) != 1:
                  raise SystemExit(f'percentile anchor count={text.count(anchor)}')
              insert = '''    return values[lower] * (1.0 - fraction) + values[upper] * fraction\n\n\nSCENARIO_SUMMARY_METRICS = (\n    "near_si_sdr_improvement_db",\n    "noise_only_attenuation_db",\n    "speech_active_attenuation_db",\n    "erle_db",\n    "output_render_corr_reduction",\n    "vad_f1",\n    "vad_recall",\n    "vad_false_positive_rate",\n    "output_clip_fraction",\n    "output_dc_offset_dbfs",\n)\n\n\ndef metric_distribution(cases: list[dict], name: str) -> dict | None:\n    values = sorted(\n        float(case["metrics"][name])\n        for case in cases\n        if case.get("metrics", {}).get(name) is not None\n    )\n    if not values:\n        return None\n    if len(values) == 1:\n        p10 = values[0]\n    else:\n        position = 0.10 * (len(values) - 1)\n        lower = int(math.floor(position))\n        upper = int(math.ceil(position))\n        fraction = position - lower\n        p10 = values[lower] if lower == upper else (\n            values[lower] * (1.0 - fraction) + values[upper] * fraction\n        )\n    return {\n        "count": len(values),\n        "min": values[0],\n        "p10": p10,\n        "median": statistics.median(values),\n        "max": values[-1],\n    }\n\n\ndef scenario_metric_summary(by_scenario: dict[str, list[dict]]) -> dict[str, dict]:\n    result: dict[str, dict] = {}\n    for scenario, group in sorted(by_scenario.items()):\n        metrics = {}\n        for name in SCENARIO_SUMMARY_METRICS:\n            distribution = metric_distribution(group, name)\n            if distribution is not None:\n                metrics[name] = distribution\n        result[scenario] = {\n            "cases": len(group),\n            "passed_cases": sum(1 for case in group if case["passed"]),\n            "metrics": metrics,\n        }\n    return result\n\n\ndef load_revision'''
              text = text.replace(anchor, insert, 1)

              summary_anchor = '''        "scenario_pass_rate": scenario_pass_rate,\n        "dimension_values": dimension_values,'''
              summary_new = '''        "scenario_pass_rate": scenario_pass_rate,\n        "scenario_metrics": scenario_metric_summary(by_scenario),\n        "dimension_values": dimension_values,'''
              if text.count(summary_anchor) != 1:
                  raise SystemExit(f'summary anchor count={text.count(summary_anchor)}')
              text = text.replace(summary_anchor, summary_new, 1)

              test_anchor = '''    assert summary["scenario_pass_rate"]["a"] == 0.5 and not violations\n    print("validation evaluator self-test: OK")'''
              test_new = '''    assert summary["scenario_pass_rate"]["a"] == 0.5 and not violations\n    scenario_summary = scenario_metric_summary({\n        "speech": [\n            {"passed": True, "metrics": {"near_si_sdr_improvement_db": 1.0, "vad_f1": 0.8}},\n            {"passed": True, "metrics": {"near_si_sdr_improvement_db": 3.0, "vad_f1": 0.9}},\n        ],\n        "echo": [\n            {"passed": True, "metrics": {"erle_db": 20.0, "output_render_corr_reduction": 0.5}},\n        ],\n    })\n    assert scenario_summary["speech"]["cases"] == 2\n    assert scenario_summary["speech"]["metrics"]["near_si_sdr_improvement_db"]["median"] == 2.0\n    assert scenario_summary["speech"]["metrics"]["vad_f1"]["count"] == 2\n    assert "erle_db" not in scenario_summary["speech"]["metrics"]\n    assert scenario_summary["echo"]["metrics"]["erle_db"]["median"] == 20.0\n    assert "near_si_sdr_improvement_db" not in scenario_summary["echo"]["metrics"]\n    print("validation evaluator self-test: OK")'''
              if text.count(test_anchor) != 1:
                  raise SystemExit(f'self-test anchor count={text.count(test_anchor)}')
              text = text.replace(test_anchor, test_new, 1)
              engine.write_text(text, encoding='utf-8')

          cmake = Path('CMakeLists.txt')
          cmake_text = cmake.read_text(encoding='utf-8')
          old_version = 'project(audio_pipeline VERSION 2.3.14 LANGUAGES C)'
          new_version = 'project(audio_pipeline VERSION 2.3.15 LANGUAGES C)'
          if old_version in cmake_text:
              if cmake_text.count(old_version) != 1:
                  raise SystemExit('CMake version anchor is ambiguous')
              cmake.write_text(cmake_text.replace(old_version, new_version, 1), encoding='utf-8')
          elif new_version not in cmake_text:
              raise SystemExit('CMake version is neither 2.3.14 nor 2.3.15')

          changelog = Path('CHANGELOG.md')
          body = changelog.read_text(encoding='utf-8')
          if not body.startswith('# 2.3.15\n'):
              if not body.startswith('# 2.3.14\n'):
                  raise SystemExit('CHANGELOG head is neither 2.3.14 nor 2.3.15')
              entry = '''# 2.3.15\n\n- Add additive scenario-aware validation summaries so each acoustic scenario reports only the quality metrics actually materialized for its cases, with count/min/p10/median/max distributions instead of forcing engineers to interpret heterogeneous corpus-wide aggregates alone.\n- Preserve every existing corpus-wide summary field and every case/aggregate acoustic gate unchanged; `scenario_metrics` is diagnostic evidence only and cannot approve or reject a candidate. Self-tests require metric applicability to remain isolated between speech and echo scenarios.\n- This maintenance release changes validation evidence/reporting only. Realtime DSP, public API/ABI, algorithm defaults, acoustic thresholds, dataset authority, HIL and Product Qualification authority are unchanged.\n\n'''
              changelog.write_text(entry + body, encoding='utf-8')
          PY
          python3 validation/tools/run_validation.py --self-test
          python3 scripts/ci_impact.py --self-test
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add validation/tools/run_validation_engine.py CMakeLists.txt CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'patch already applied'
            exit 0
          fi
          git commit -m 'release: add scenario-aware validation summaries for v2.3.15'
          git push origin HEAD:release/validation-scenario-summary
