name: BF Hard Mic Fault Discovery

on:
  pull_request:
    paths:
      - 'src/frontend/ap_beamformer.c'
      - 'src/frontend/ap_frontend.h'
      - 'tests/validation/bf_hard_fault_probe.c'
      - 'tests/validation/build_bf_hard_fault_sweep.py'
      - 'tests/validation/bf_hard_fault_evaluate.py'
      - 'tests/validation/bf_hard_fault_summary.py'
      - 'validation/tools/build_validation_corpus.py'
      - '.github/workflows/bf-hard-mic-fault-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bf-hard-mic-fault-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate discovery contracts
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tests/validation/build_bf_hard_fault_sweep.py \
            tests/validation/bf_hard_fault_evaluate.py \
            tests/validation/bf_hard_fault_summary.py
          python3 tests/validation/build_bf_hard_fault_sweep.py --self-test
          python3 tests/validation/bf_hard_fault_evaluate.py --self-test
          python3 tests/validation/bf_hard_fault_summary.py --self-test

      - name: Build exact-source BF probe
        run: |
          set -euo pipefail
          mkdir -p build-bf-hard-fault
          cc -std=c11 -O2 -Wall -Wextra -Werror -Isrc \
            tests/validation/bf_hard_fault_probe.c \
            src/frontend/ap_beamformer.c \
            -lm -o build-bf-hard-fault/bf_hard_fault_probe

      - name: Measure three independent hard-fault partitions
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          mkdir -p bf-hard-fault-out
          for seed in 1307 2307 3307; do
            root="/tmp/ap-bf-hard-fault-${seed}"
            out="bf-hard-fault-out/${seed}"
            mkdir -p "$out"
            python3 tests/validation/build_bf_hard_fault_sweep.py \
              --output "$root" --seed "$seed"
            python3 tests/validation/bf_hard_fault_evaluate.py \
              --probe build-bf-hard-fault/bf_hard_fault_probe \
              --corpus "$root/corpus.json" \
              --output "$out/report.json" | tee "$out/measurement.txt"
          done

      - name: Aggregate hard-fault evidence
        env:
          PYTHONPATH: validation/tools:tests/validation
        run: |
          set -euo pipefail
          python3 tests/validation/bf_hard_fault_summary.py \
            --report bf-hard-fault-out/1307/report.json \
            --report bf-hard-fault-out/2307/report.json \
            --report bf-hard-fault-out/3307/report.json \
            --output bf-hard-fault-out/summary.json | tee bf-hard-fault-out/summary.txt
          {
            echo '## BF hard microphone fault discovery'
            echo '```text'
            cat bf-hard-fault-out/summary.txt
            echo '```'
            echo
            echo 'This workflow is diagnostic-regression-only. Negative evidence is preserved and does not silently change shipping DSP.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload BF hard-fault evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bf-hard-mic-fault-discovery-${{ github.run_id }}
          path: bf-hard-fault-out/
          if-no-files-found: warn
          retention-days: 30
