name: Quality

on:
  workflow_call:
    inputs:
      run_abi:
        type: boolean
        required: false
        default: true
      run_extended:
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abi-contract:
    if: inputs.run_abi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Prove missing public ABI baseline fails closed
        run: |
          set -euo pipefail
          set +e
          sh scripts/check-abi-contract.sh v0.0.0-missing-contract-baseline > /tmp/missing-abi-baseline.log 2>&1
          rc=$?
          set -e
          test "$rc" -eq 6
          grep -q 'unable to fetch required baseline tag' /tmp/missing-abi-baseline.log
      - name: Enforce public API/ABI contract
        run: sh scripts/check-abi-contract.sh

  sdk-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: quality-sdk
      - name: Build and install SDK
        run: |
          cmake -S . -B build-sdk -DCMAKE_BUILD_TYPE=Release
          cmake --build build-sdk --parallel
          cmake --install build-sdk --prefix "$PWD/stage"
      - name: Consume with find_package
        run: |
          cmake -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build build-consumer --parallel
          ./build-consumer/audio_pipeline_consumer
      - name: Consume with pkg-config
        run: |
          export PKG_CONFIG_PATH="$PWD/stage/lib/pkgconfig:$PWD/stage/lib64/pkgconfig"
          cc tests/consumer/consumer.c -o /tmp/audio-pipeline-pc $(pkg-config --cflags --libs audio-pipeline)
          /tmp/audio-pipeline-pc

  sku-memory-rom:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: quality-size
      - name: Verify SKU pipeline RAM pruning
        run: |
          cmake --preset composition-full
          cmake --preset composition-low
          cmake --preset composition-tiny
          cmake --preset composition-raw
          for p in full low tiny raw; do cmake --build "build/composition-$p" --target ap_state_size --parallel; done
          full=$(./build/composition-full/ap_state_size)
          low=$(./build/composition-low/ap_state_size)
          tiny=$(./build/composition-tiny/ap_state_size)
          raw=$(./build/composition-raw/ap_state_size)
          echo "pipeline_state_bytes full=$full low=$low tiny=$tiny raw=$raw"
          test "$low" -lt "$full"
          test "$tiny" -lt "$low"
          test "$raw" -lt "$tiny"
      - name: Verify final consumer ELF pruning
        run: |
          common="-DCMAKE_BUILD_TYPE=Release -DAP_ENABLE_LINUX_RUNTIME=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DCMAKE_C_FLAGS=-ffunction-sections\ -fdata-sections -DCMAKE_EXE_LINKER_FLAGS=-Wl,--gc-sections"
          eval cmake -S . -B build/elf-full $common -DAP_MODULES=RESAMPLER,HPF,BF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          eval cmake -S . -B build/elf-voice $common -DAP_MODULES=RESAMPLER,HPF,BF,NS,AGC,VAD
          eval cmake -S . -B build/elf-raw $common -DAP_MODULES=RESAMPLER
          for p in full voice raw; do cmake --build "build/elf-$p" --target ap_consumer_smoke --parallel; done
          elf_bytes() { size "$1" | awk 'NR==2 {print $1+$2+$3}'; }
          full=$(elf_bytes build/elf-full/ap_consumer_smoke)
          voice=$(elf_bytes build/elf-voice/ap_consumer_smoke)
          raw=$(elf_bytes build/elf-raw/ap_consumer_smoke)
          echo "consumer_elf_bytes full=$full voice=$voice raw=$raw"
          test "$voice" -lt "$full"
          test "$raw" -lt "$voice"
      - name: Verify runtime queue/envelope RAM pruning
        run: |
          cmake -S . -B build/rt-full -DCMAKE_BUILD_TYPE=Release -DAP_RUNTIME_QUEUE_DEPTH=8
          cmake -S . -B build/rt-tiny -DCMAKE_BUILD_TYPE=Release \
            -DAP_RUNTIME_QUEUE_DEPTH=4 -DAP_BUILD_MAX_IO_RATE_HZ=16000 \
            -DAP_BUILD_MAX_INTERNAL_RATE_HZ=8000 -DAP_BUILD_MAX_MIC_CHANNELS=1 \
            -DAP_BUILD_MAX_DELAY_MS=120 -DAP_BUILD_MAX_AEC_TAIL_MS=48 \
            -DAP_MODULES=RESAMPLER,HPF,SYNC,ACTIVITY,AEC,RES,NS,AGC,VAD
          cmake --build build/rt-full --parallel
          cmake --build build/rt-tiny --parallel
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-full/generated \
            build/rt-full/libaudio_pipeline_runtime.a build/rt-full/libaudio_pipeline.a -lm -pthread -o /tmp/rt-full
          cc tests/print_runtime_state.c -Iinclude -Ibuild/rt-tiny/generated \
            build/rt-tiny/libaudio_pipeline_runtime.a build/rt-tiny/libaudio_pipeline.a -lm -pthread -o /tmp/rt-tiny
          full=$(/tmp/rt-full)
          tiny=$(/tmp/rt-tiny)
          echo "runtime_state_bytes full=$full tiny=$tiny"
          test "$tiny" -lt "$full"

  thread-sanitizer:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: tsan
      - name: Configure TSan runtime contract
        env:
          CC: clang
        run: >-
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF
          -DCMAKE_C_FLAGS='-fsanitize=thread -fno-omit-frame-pointer -O1'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=thread'
      - name: Build runtime tests
        run: >-
          cmake --build build-tsan --parallel --target
          ap_runtime_tests ap_runtime_extended_tests ap_runtime_interleaving_tests
      - name: Race-check runtime ownership, snapshots and control progress
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: >-
          ctest --test-dir build-tsan --output-on-failure
          -R '^ap_runtime(_extended|_interleaving)?_tests$'

  qemu-exec:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:db214be9b1eb6d0b979811003f0fbd510a9adbee099a3e7fd7e8b2edcc481d50
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cortex-a7-neon
            compiler: arm-linux-gnueabihf-gcc
            toolchain: cmake/toolchains/arm-linux-gnueabihf.cmake
            cflags: -O2 -mcpu=cortex-a7 -mfpu=neon-vfpv4 -mfloat-abi=hard
            simd: NEON
            qemu: qemu-arm -cpu cortex-a7 -L /usr/arm-linux-gnueabihf
          - name: aarch64-neon
            compiler: aarch64-linux-gnu-gcc
            toolchain: cmake/toolchains/aarch64-linux-gnu.cmake
            cflags: -O2 -march=armv8-a
            simd: NEON
            qemu: qemu-aarch64 -cpu cortex-a53 -L /usr/aarch64-linux-gnu
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: qemu-${{ matrix.name }}
      - name: Configure executable contract
        env:
          CC: ${{ matrix.compiler }}
        run: >-
          cmake -S . -B build/qemu-${{ matrix.name }}
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_FLAGS='${{ matrix.cflags }}' -DAP_SIMD_BACKEND=${{ matrix.simd }}
          -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF -DAP_BUILD_TESTS=ON
      - name: Build executable contracts
        run: >-
          cmake --build build/qemu-${{ matrix.name }} --parallel
          --target ap_module_tests ap_contract_tests ap_fft_tests ap_resampler_tests ap_runtime_tests
      - name: Execute under QEMU
        run: |
          Q='${{ matrix.qemu }}'
          $Q ./build/qemu-${{ matrix.name }}/ap_module_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_contract_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_fft_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_resampler_tests
          $Q ./build/qemu-${{ matrix.name }}/ap_runtime_tests

  coverage:
    if: inputs.run_extended
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:db214be9b1eb6d0b979811003f0fbd510a9adbee099a3e7fd7e8b2edcc481d50
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: coverage
      - name: Configure coverage build
        env:
          CC: gcc
        run: >-
          cmake -S . -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DAP_BUILD_BENCH=OFF
          -DCMAKE_C_FLAGS='--coverage -O0 -g' -DCMAKE_EXE_LINKER_FLAGS='--coverage'
      - name: Run tests and enforce coverage
        run: |
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
          gcovr --root . --filter 'src/' --exclude 'tests/' --fail-under-line 90 --print-summary

  static-analysis:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:db214be9b1eb6d0b979811003f0fbd510a9adbee099a3e7fd7e8b2edcc481d50
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: scan-build
      - name: Configure
        env:
          CC: clang
        run: >-
          cmake -S . -B build-analysis -DCMAKE_BUILD_TYPE=Debug
          -DAP_BUILD_TESTS=OFF -DAP_BUILD_BENCH=OFF -DAP_BUILD_EXAMPLES=OFF
      - name: Scan build
        run: scan-build --status-bugs cmake --build build-analysis --parallel

  acoustic-validation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate canonical acoustic validation contracts
        run: |
          python3 validation/tools/authority.py --self-test
          python3 validation/tools/run_validation.py --self-test
          python3 validation/tools/tuning_iteration.py --self-test

  frontend-reference:
    if: inputs.run_extended
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ghcr.io/jiying2007/audio-pipeline-ci@sha256:db214be9b1eb6d0b979811003f0fbd510a9adbee099a3e7fd7e8b2edcc481d50
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: xiph/speexdsp
          ref: 7a158783df74efe7c2d1c6ee8363c1e695c71226
          path: .fe-speexdsp
          persist-credentials: false
      - name: Verify pristine SpeexDSP source bytes without executing them
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/speexdsp_source.py \
            --source .fe-speexdsp --output fe-speex-source
          python3 tests/validation/frontend_evolution/speexdsp_source.py \
            --output fe-speex-source --verify
          python3 tests/validation/frontend_evolution/speexdsp_source.py \
            --output fe-speex-source --negative-evidence
      - name: Preserve SpeexDSP source-preflight bytes and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-speex-source-${{ github.run_id }}
          path: fe-speex-source/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: dpirch/libfvad
          ref: 532ab666c20d3cfda38bca63abbb0f152706c369
          path: .fe-libfvad
          persist-credentials: false
      - name: Qualify actual pinned VAD reference without shipping promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/test_libfvad_reference.py
          baseline="$RUNNER_TEMP/fe-b0-${{ github.run_id }}"
          mkdir "$baseline"
          git -c safe.directory="$PWD" archive 37a1792861a89c815bec462f819f3deac7d29b09 | tar -x -C "$baseline"
          python3 tests/validation/frontend_evolution/libfvad_reference.py compare \
            --source .fe-libfvad --baseline "$baseline" --output fe-reference --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/libfvad_reference.py verify \
            --output fe-reference --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/test_libfvad_reference.py --evidence fe-reference
      - name: Qualify first-party native 1/2/4-mic research array
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/array_qualification.py --self-test
          python3 tests/validation/frontend_evolution/array_qualification.py \
            --output fe-array --execution-source "$GITHUB_SHA" --require-arm
          python3 tests/validation/frontend_evolution/array_qualification.py \
            --output fe-array --execution-source "$GITHUB_SHA" --verify --require-arm
          python3 tests/validation/frontend_evolution/array_qualification.py \
            --output fe-array --execution-source "$GITHUB_SHA" --negative-evidence
      - name: Preserve native-array engineering evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-array-${{ github.run_id }}
          path: fe-array/
          if-no-files-found: error
          retention-days: 30
      - name: Qualify FE06 fixed synthetic four-mic hard-fault suggestions
        id: fe06
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/mic_fault_control.py --self-test
          python3 tests/validation/frontend_evolution/mic_fault_control.py \
            --output fe-mic-fault --execution-source "$GITHUB_SHA" --require-arm
          python3 tests/validation/frontend_evolution/mic_fault_control.py \
            --output fe-mic-fault --execution-source "$GITHUB_SHA" --verify --require-arm --replay
      - name: Preserve FE06 non-shipping engineering evidence and failures
        if: always() && (steps.fe06.outcome == 'success' || steps.fe06.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-mic-fault-${{ github.run_id }}
          path: fe-mic-fault/
          if-no-files-found: error
          retention-days: 30
      - name: Qualify FE08 exact-source C1/C2/C4 component resource profile
        id: fe08
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/array_resource_qualification.py --self-test
          python3 tests/validation/frontend_evolution/array_resource_qualification.py \
            --output fe-array-resource --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/array_resource_qualification.py \
            --output fe-array-resource --execution-source "$GITHUB_SHA" --verify
      - name: Preserve FE08 hosted resource characterizations and failures
        if: always() && (steps.fe08.outcome == 'success' || steps.fe08.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-array-resource-${{ github.run_id }}
          path: fe-array-resource/
          if-no-files-found: error
          retention-days: 30
      - name: Qualify FE09 research C2/C4 bridge against real 2.x mono SDK
        id: fe09_r0
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/array_sdk_bridge_r0.py --self-test
          python3 tests/validation/frontend_evolution/array_sdk_bridge_r0.py \
            --collect --output fe09-bridge --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/array_sdk_bridge_r0.py \
            --verify --output fe09-bridge --execution-source "$GITHUB_SHA"
      - name: Retain FE09 C2/C4 to mono SDK research-only metadata
        if: always() && (steps.fe09_r0.outcome == 'success' || steps.fe09_r0.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-fe09-sdk-bridge-${{ github.run_id }}
          path: fe09-bridge/
          if-no-files-found: error
          retention-days: 30
      - name: Qualify FE09 R2A one-core noninstalled C1/C2/C4 ABI draft
        id: fe09_r2a
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/fe09_array_sdk_draft_qualification_r2a.py --self-test
          python3 tests/validation/frontend_evolution/fe09_array_sdk_draft_qualification_r2a.py \
            --collect --output fe09-r2a --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/fe09_array_sdk_draft_qualification_r2a.py \
            --verify --output fe09-r2a --execution-source "$GITHUB_SHA"
      - name: Retain FE09 R2A research-only ABI prototype evidence and failures
        if: always() && (steps.fe09_r2a.outcome == 'success' || steps.fe09_r2a.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-fe09-r2a-abi-${{ github.run_id }}
          path: fe09-r2a/
          if-no-files-found: error
          retention-days: 30
      - name: Qualify FE09 B1A noninstalled 16kHz separate N-mic/render ingress
        id: fe09_b1a
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/fe09_b1a_ingress_qualification.py --self-test
          python3 tests/validation/frontend_evolution/fe09_b1a_ingress_qualification.py \
            --collect --output fe09-b1a --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/fe09_b1a_ingress_qualification.py \
            --verify --output fe09-b1a --execution-source "$GITHUB_SHA"
      - name: Retain FE09 B1A identity-ingress research evidence and failures
        if: always() && (steps.fe09_b1a.outcome == 'success' || steps.fe09_b1a.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-fe09-b1a-ingress-${{ github.run_id }}
          path: fe09-b1a/
          if-no-files-found: error
          retention-days: 30
      - name: Qualify FE09 B1B-S0 actual first-party 16-32-48k N-mic and render SRC
        id: fe09_b1b0
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/fe09_b1b0_src_qualification.py --self-test
          python3 tests/validation/frontend_evolution/fe09_b1b0_src_qualification.py \
            --collect --output fe09-b1b0 --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/fe09_b1b0_src_qualification.py \
            --verify --output fe09-b1b0 --execution-source "$GITHUB_SHA"
      - name: Retain FE09 B1B-S0 SRC ownership research evidence and failures
        if: always() && (steps.fe09_b1b0.outcome == 'success' || steps.fe09_b1b0.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-fe09-b1b0-src-${{ github.run_id }}
          path: fe09-b1b0/
          if-no-files-found: error
          retention-days: 30
      - name: Qualify FE09 B1B-S1 single first-party BF behind 16-32-48k N+render SRC
        id: fe09_b1b1
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/fe09_b1b1_single_bf_qualification.py --self-test
          python3 tests/validation/frontend_evolution/fe09_b1b1_single_bf_qualification.py \
            --collect --output fe09-b1b1 --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/fe09_b1b1_single_bf_qualification.py \
            --verify --output fe09-b1b1 --execution-source "$GITHUB_SHA"
      - name: Retain FE09 B1B-S1 nonshipping single-array BF evidence and failures
        if: always() && (steps.fe09_b1b1.outcome == 'success' || steps.fe09_b1b1.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-fe09-b1b1-single-bf-${{ github.run_id }}
          path: fe09-b1b1/
          if-no-files-found: error
          retention-days: 30

      - name: Qualify FE09 R2B2-S1 private C1/C2/C4 SPSC ingress plus first-party SRC/BF
        id: fe09_b2s1
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/validation/frontend_evolution/fe09_runtime_source_boundary.py s1 --self-test
          python3 tests/validation/frontend_evolution/fe09_runtime_source_boundary.py s1 \
            --collect --output fe09-b2s1 --execution-source "$GITHUB_SHA"
          python3 tests/validation/frontend_evolution/fe09_runtime_source_boundary.py s1 \
            --verify --output fe09-b2s1 --execution-source "$GITHUB_SHA"
      - name: Retain FE09 R2B2-S1 private queue+first-party BF evidence and failures
        if: always() && (steps.fe09_b2s1.outcome == 'success' || steps.fe09_b2s1.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-fe09-b2s1-private-queue-${{ github.run_id }}
          path: fe09-b2s1/
          if-no-files-found: error
          retention-days: 30

      - name: Download retained B2-S1 evidence from this exact Actions run
        if: steps.fe09_b2s1.outcome == 'success'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: frontend-fe09-b2s1-private-queue-${{ github.run_id }}
