name: Finalize product certification v2

on:
  push:
    branches: [feat/product-certification-v2]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply final certification contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/product-certification-v2"
          python3 - <<'PY'
          import json
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Build configuration digest must include normalized backend selections.
          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          start = text.index('set(AP_BUILD_SOURCE_REVISION "" CACHE STRING')
          marker = 'string(SHA256 AP_BUILD_CONFIG_DIGEST "${_AP_CONFIG_IDENTITY}")\n\n'
          end = text.index(marker, start) + len(marker)
          block = text[start:end]
          text = text[:start] + text[end:]
          insert = 'string(TOUPPER "${AP_RESAMPLER_MODE}" AP_RESAMPLER_MODE)\n\n'
          if insert not in text:
              raise SystemExit('resampler normalization anchor missing')
          text = text.replace(insert, insert + block, 1)
          cmake.write_text(text, encoding='utf-8')

          # New benchmark collector always measures the actual product route geometry.
          replace_once(
              'tools/target_evidence.py',
              '    if args.seconds < 1 or args.idle_seconds < 1:\n        raise SystemExit("benchmark durations must be >= 1")\n    active_cmd = [\n        str(args.binary), str(args.seconds), str(args.max_rtf),\n        str(args.max_p99_us), "active",\n    ]\n    idle_cmd = [str(args.binary), str(args.idle_seconds), "0", "0", "idle"]\n',
              '    if args.seconds < 1 or args.idle_seconds < 1:\n        raise SystemExit("benchmark durations must be >= 1")\n    if args.sample_rate not in _SUPPORTED_RATES or args.mic_channels not in (1, 2):\n        raise SystemExit("invalid benchmark route geometry")\n    active_cmd = [\n        str(args.binary), str(args.seconds), str(args.max_rtf),\n        str(args.max_p99_us), "active", str(args.sample_rate), str(args.mic_channels),\n    ]\n    idle_cmd = [\n        str(args.binary), str(args.idle_seconds), "0", "0", "idle",\n        str(args.sample_rate), str(args.mic_channels),\n    ]\n')
          replace_once(
              'tools/target_evidence.py',
              '        "kind": "target-benchmark",\n        "command": active_cmd,\n        "performance": performance,\n',
              '        "kind": "target-benchmark",\n        "command": active_cmd,\n        "route": {"sample_rate_hz": args.sample_rate, "mic_channels": args.mic_channels},\n        "performance": performance,\n')
          replace_once(
              'tools/target_evidence.py',
              '    b.add_argument("--dsp-cpu", type=int, default=1)\n    b.add_argument("--ambient-c", type=float, required=True)\n',
              '    b.add_argument("--dsp-cpu", type=int, default=1)\n    b.add_argument("--sample-rate", type=int, default=16000)\n    b.add_argument("--mic-channels", type=int, default=2)\n    b.add_argument("--ambient-c", type=float, required=True)\n')

          # Product workflow passes the same real route geometry to benchmark and soak.
          replace_once(
              '.github/workflows/product-certification.yml',
              '            --max-rtf 0.40 --max-p99-us 9000 --dsp-cpu "$DSP_CPU" \\\n            --ambient-c "$AMBIENT" --power-input "$POWER" \\\n',
              '            --max-rtf 0.40 --max-p99-us 9000 --dsp-cpu "$DSP_CPU" \\\n            --sample-rate "${{ inputs.sample_rate }}" --mic-channels "${{ inputs.mic_channels }}" \\\n            --ambient-c "$AMBIENT" --power-input "$POWER" \\\n')

          # JSON schema remains backward compatible with v2 while documenting v3 fields.
          schema_path = Path('certification/record.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          build_props = schema['properties']['build']['properties']
          build_props.update({
              'source_revision': {'type': 'string', 'pattern': '^[A-Fa-f0-9]{40}$'},
              'config_digest': {'type': 'string', 'pattern': '^[A-Fa-f0-9]{64}$'},
              'compiler_id': {'type': 'string', 'minLength': 1},
              'compiler_version': {'type': 'string', 'minLength': 1},
              'target_triple': {'type': 'string', 'minLength': 1},
              'build_type': {'type': 'string', 'minLength': 1},
              'binary_sha256': {
                  'type': 'object', 'minProperties': 1,
                  'additionalProperties': {'type': 'string', 'pattern': '^[A-Fa-f0-9]{64}$'},
              },
          })
          artifact_props = schema['properties']['artifacts']['properties']
          artifact_props['evidence_manifest'] = {'type': 'string', 'minLength': 1}
          artifact_props['binary_sha256'] = {
              'type': 'object', 'minProperties': 1,
              'additionalProperties': {'type': 'string', 'pattern': '^[A-Fa-f0-9]{64}$'},
          }
          then_props = schema['allOf'][0]['then']['properties']
          then_props['schema_version'] = {'enum': [2, 3]}
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')

          # Keep target evidence collectors in the normal hosted quality contract.
          replace_once(
              '.github/workflows/audio-quality-gates.yml',
              '      - name: Verify certification evidence validator\n        run: python3 certification/validate_record.py --self-test\n',
              '      - name: Verify certification evidence and target collectors\n        run: |\n          python3 -m py_compile certification/validate_record.py tools/ap_certify.py tools/target_evidence.py\n          python3 certification/validate_record.py --self-test\n          python3 tools/ap_certify.py --self-test\n          python3 tools/target_evidence.py --self-test\n')

          # Document the release and replace obsolete synthetic-soak wrapper guidance.
          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          section = '''# 1.4.0\n\n- Add additive build identity v2 with exact source revision, compiler, target triple, build type and SHA-256 configuration digest while preserving the frozen 1.x `ap_build_info_t` layout.\n- Make `ap_bench` route-geometry aware so target CPU/latency evidence measures the shipping sample rate and microphone count instead of an implicit 16 kHz/2-mic graph.\n- Turn Product Certification into an `audio-target` self-hosted measurement workflow: exact target build, DSP benchmark, RSS/thermal/power sampling, real ALSA-route soak, immutable evidence packaging and strict policy validation.\n- Upgrade new certification records to schema v3 with certification-binary hashes and materialized evidence size/SHA-256 revalidation; historical v2 records remain accepted.\n- Make real ALSA route soak expose XRUN recovery, queue/drop/overrun/failure and runtime p50/p95/p99/critical telemetry; synthetic runtime soak is no longer accepted as product-route evidence.\n- Keep private real-product acoustic results and corpus manifests external; the workflow refuses to manufacture hosted acoustic evidence or substitute missing power/thermal measurements.\n\n'''
          if not text.startswith('# 1.4.0\n'):
              changelog.write_text(section + text, encoding='utf-8')

          performance = Path('docs/PERFORMANCE.md')
          text = performance.read_text(encoding='utf-8')
          old = '''## Target wrappers\n\n```bash\n./scripts/run-target-benchmark.sh ./build/ap_bench 120 0.40 9000 1\n./scripts/run-target-soak.sh ./build/ap_runtime_bench 28800 0 0.999 1\n```\n\nThe soak defaults to 8 h.\n'''
          new = '''## Target certification collectors\n\nTarget CPU/latency evidence is generated with the actual shipping route geometry, while the soak uses the real ALSA capture/playback path:\n\n```bash\npython3 tools/target_evidence.py benchmark --binary ./build/ap_bench \\\n  --output benchmark.json --seconds 120 --idle-seconds 30 --dsp-cpu 1 \\\n  --sample-rate 16000 --mic-channels 2 --ambient-c 25 \\\n  --power-input /path/to/live_power --power-scale 1000000 --require-sensors\n\npython3 tools/target_evidence.py route-soak --binary ./build/ap_alsa_runtime_duplex \\\n  --output soak.json --capture-device hw:0,0 --playback-device hw:0,0 \\\n  --farend /path/to/farend.pcm --seconds 28800 --dsp-cpu 1 \\\n  --sample-rate 16000 --mic-channels 2 --max-xruns 0 --max-overruns 0 \\\n  --power-input /path/to/live_power --power-scale 1000000\n```\n\nThe default product soak is 8 h. `ap_runtime_bench` remains a synthetic runtime regression tool and is not accepted as real product-route soak evidence.\n'''
          if old not in text:
              raise SystemExit('performance target wrapper section not found')
          performance.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev
          python3 -m py_compile tools/*.py certification/*.py
          python3 certification/validate_record.py --self-test
          python3 tools/ap_certify.py --self-test
          python3 tools/target_evidence.py --self-test
          python3 -m json.tool certification/record.schema.json >/dev/null
          python3 -m json.tool certification/policy.schema.json >/dev/null

          rm -rf build-final build-ema build-mcra build-alsa
          cmake -S . -B build-final -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-final --parallel
          ctest --test-dir build-final --output-on-failure
          ./build-final/ap_bench 1 0 0 active 8000 1 >/tmp/bench-8k.txt
          ./build-final/ap_bench 1 0 0 active 48000 2 >/tmp/bench-48k.txt
          grep -q 'sample_rate_hz=8000 mic_channels=1' /tmp/bench-8k.txt
          grep -q 'sample_rate_hz=48000 mic_channels=2' /tmp/bench-48k.txt

          cmake -S . -B build-alsa -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_ALSA_EXAMPLE=ON -DAP_STRICT_WARNINGS=ON
          cmake --build build-alsa --parallel --target ap_alsa_runtime_duplex ap_build_info_dump

          cmake -S . -B build-ema -DCMAKE_BUILD_TYPE=Release -DAP_NS_ESTIMATOR=EMA -DAP_STRICT_WARNINGS=ON
          cmake --build build-ema --target ap_build_info_dump --parallel
          cmake -S . -B build-mcra -DCMAKE_BUILD_TYPE=Release -DAP_NS_ESTIMATOR=MCRA -DAP_STRICT_WARNINGS=ON
          cmake --build build-mcra --target ap_build_info_dump --parallel
          ema=$(./build-ema/ap_build_info_dump | sed -n 's/^config_digest=//p')
          mcra=$(./build-mcra/ap_build_info_dump | sed -n 's/^config_digest=//p')
          test "${#ema}" -eq 64
          test "${#mcra}" -eq 64
          test "$ema" != "$mcra"

          git diff --check
          git rm .github/workflows/finalize-product-cert-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt tools/target_evidence.py certification/record.schema.json \
            .github/workflows/product-certification.yml .github/workflows/audio-quality-gates.yml \
            CHANGELOG.md docs/PERFORMANCE.md
          git commit -m "certification: finalize target product evidence v3"
          git push origin HEAD:feat/product-certification-v2
