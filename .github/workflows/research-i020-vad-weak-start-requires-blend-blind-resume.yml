name: Research I020 Source-Patch Blind Same-Partition Resume
run-name: "i020-source-patch-blind-resume / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/hosted-validation/resume_code_candidate_blind.py'
      - '.github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py'
      - '.github/research/continuous-optimization/research_code_candidate_blind.py'
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json'
      - '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.patch'
      - '.github/workflows/research-i020-vad-weak-start-requires-blend-blind-resume.yml'
      - '.github/workflows/research-i020-vad-weak-start-requires-blend-blind.yml'
      - 'validation/authority.json'
      - 'validation/datasets.lock.json'
      - 'validation/policies/validation-full-partition.json'
      - 'validation/policies/validation-full-blind.json'
      - 'validation/tools/run_validation*.py'
      - 'validation/tools/stage_profile_support.py'
      - 'validation/tools/render_corr_exact.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-i020-source-patch-blind-resume-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_RUN_ID: '36304120808'
  SOURCE_ARTIFACT_ID: '10927016997'
  SOURCE_ARTIFACT_NAME: 'i020-source-patch-blind-36304120808'
  SOURCE_ARTIFACT_DIGEST: 'sha256:eafc16de6a8984a25eca8cc383ca8ceb0d6291d63adf09ee6159397e6fe11fe8'
  ORIGINAL_QUALIFICATION_INFRA_SHA: '99ba1bf6844be910bc851f5449fb4f2388984977'
  SOURCE_BASE_SHA: '57e4c64adc1cf06819e46e24e275ecd746d5f17f'
  MANIFEST: '.github/research/continuous-optimization/code-candidates/i020-vad-weak-start-requires-blend-v1.json'
  REGISTRY: '.github/research/continuous-optimization/dataset-registry.json'
  AEC_LIMIT: '60'

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate same-partition resume tooling
        run: |
          set -euo pipefail
          python3 -m py_compile             .github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py             .github/research/continuous-optimization/hosted-validation/resume_code_candidate_blind.py             .github/research/continuous-optimization/research_code_candidate_blind.py
          python3 .github/research/continuous-optimization/hosted-validation/resume_incomplete_blind.py --self-test
          python3 .github/research/continuous-optimization/hosted-validation/resume_code_candidate_blind.py --self-test
          python3 .github/research/continuous-optimization/research_code_candidate_blind.py --self-test
          python3 .github/research/continuous-optimization/research_code_candidate_blind.py             --manifest "$MANIFEST" --registry "$REGISTRY" --repo-root . --check

      - name: Enforce no repartition or new blind key
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/research-i020-vad-weak-start-requires-blend-blind-resume.yml')
          text=path.read_text()
          forbidden=(
              'split_' + 'holdout.py',
              'secrets.' + 'token_hex',
              'AP_EPHEMERAL_' + 'HOLDOUT_KEY',
              'Generate run-ephemeral blind holdout ' + 'key',
              'Partition run-ephemeral blind ' + 'holdout',
              '\n  push:',
              '\n  schedule:',
              'git ' + 'push',
              'gh ' + 'release',
          )
          present=[item for item in forbidden if item in text]
          if present:
              raise SystemExit(f'same-partition resume gained forbidden behavior: {present}')
          required=(
              'SOURCE_RUN_ID: \'36304120808\'',
              'SOURCE_ARTIFACT_ID: \'10927016997\'',
              'sha256:eafc16de6a8984a25eca8cc383ca8ceb0d6291d63adf09ee6159397e6fe11fe8',
              'resume_code_candidate_blind.py',
              'partition_changed',
              'new_holdout_key_generated',
              'working-directory: infra',
              '--blind-summary-only',
          )
          missing=[item for item in required if item not in text]
          if missing:
              raise SystemExit(f'same-partition resume contract missing: {missing}')
          print('I020 same-partition resume boundary: PASS')
          PY

      - name: Prove canonical evaluator did not drift since consumed partition
        run: |
          set -euo pipefail
          git cat-file -e "$ORIGINAL_QUALIFICATION_INFRA_SHA^{commit}"
          git diff --exit-code "$ORIGINAL_QUALIFICATION_INFRA_SHA" HEAD --             validation/authority.json             validation/datasets.lock.json             validation/policies/validation-full-partition.json             validation/policies/validation-full-blind.json             validation/tools/run_validation.py             validation/tools/run_validation_engine.py             validation/tools/stage_profile_support.py             validation/tools/render_corr_exact.py             .github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py             .github/research/continuous-optimization/hosted-validation/prepare_full_validation.py

      - name: Prove resume uses evaluator from its canonical repository root
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/research-i020-vad-weak-start-requires-blend-blind-resume.yml').read_text()
          for name in (
              'Run shipping baseline on saved visible partition',
              'Run candidate on saved visible partition',
              'Run shipping baseline on saved blind partition',
              'Run candidate on saved blind partition',
          ):
              start=text.index('      - name: '+name)
              end=text.find('\n      - name:', start+1)
              block=text[start:] if end < 0 else text[start:end]
              assert 'working-directory: infra' in block
              assert 'python3 validation/tools/run_validation.py' in block
          PY

  resume:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout resume and qualification infrastructure
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
          path: infra

      - name: Bind current main and unchanged qualification semantics
        run: |
          set -euo pipefail
          git -C infra fetch --no-tags origin main
          test "$(git -C infra rev-parse HEAD)" = "$(git -C infra rev-parse origin/main)"
          git -C infra cat-file -e "$ORIGINAL_QUALIFICATION_INFRA_SHA^{commit}"
          git -C infra diff --exit-code "$ORIGINAL_QUALIFICATION_INFRA_SHA" HEAD --             validation/authority.json             validation/datasets.lock.json             validation/policies/validation-full-partition.json             validation/policies/validation-full-blind.json             validation/tools/run_validation.py             validation/tools/run_validation_engine.py             validation/tools/stage_profile_support.py             validation/tools/render_corr_exact.py             .github/research/continuous-optimization/hosted-validation/metrics_jsonl_proxy.py             .github/research/continuous-optimization/hosted-validation/prepare_full_validation.py
          python3 infra/.github/research/continuous-optimization/research_code_candidate_blind.py             --manifest "infra/$MANIFEST" --registry "infra/$REGISTRY"             --repo-root infra --check

      - name: Download and verify exact consumed blind artifact
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID"             > source-artifact-metadata.json
          test "$(jq -r .name source-artifact-metadata.json)" = "$SOURCE_ARTIFACT_NAME"
          test "$(jq -r .expired source-artifact-metadata.json)" = false
          test "$(jq -r .workflow_run.id source-artifact-metadata.json)" = "$SOURCE_RUN_ID"
          test "$(jq -r .workflow_run.head_sha source-artifact-metadata.json)" = "$ORIGINAL_QUALIFICATION_INFRA_SHA"
          test "$(jq -r .digest source-artifact-metadata.json)" = "$SOURCE_ARTIFACT_DIGEST"
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip"             --output source-artifact.zip
          test "sha256:$(sha256sum source-artifact.zip | awk '{print $1}')" = "$SOURCE_ARTIFACT_DIGEST"
          rm -rf candidate-out
          mkdir -p candidate-out
          unzip -q source-artifact.zip -d candidate-out
          sha256sum -c candidate-out/SHA256SUMS
          test "$(cat candidate-out/qualification-infra-revision.txt)" = "$ORIGINAL_QUALIFICATION_INFRA_SHA"
          test "$(cat candidate-out/source-base-revision.txt)" = "$SOURCE_BASE_SHA"
          test "$(jq -r .decision candidate-out/qualification-summary.json)" =             BLIND_QUALIFICATION_INCOMPLETE_NON_SHIPPING
          test "$(jq -r .failed_stage candidate-out/qualification-summary.json)" = evidence-incomplete
          test "$(jq -r .github_run_id candidate-out/holdout-key-origin.json)" = "$SOURCE_RUN_ID"
          test "$(jq -r .key_persisted candidate-out/holdout-key-origin.json)" = false
          test "$(jq -r .key_fingerprint candidate-out/holdout-key-origin.json)" = ebeec484da932ee7

      - name: Initialize and materialize exact public cache
        run: |
          set -euo pipefail
          DATA_ROOT="$RUNNER_TEMP/audio-validation-data"
          {
            echo "DATA_ROOT=$DATA_ROOT"
            echo "SEAL=$DATA_ROOT/datasets.seal.json"
            echo "DNS_ROOT=$DATA_ROOT/DNS-Challenge/datasets_fullband"
          } >> "$GITHUB_ENV"
          python3 infra/.github/research/continuous-optimization/hosted-validation/prepare_full_validation.py             --source-root infra --data-root "$DATA_ROOT"             --seal "$DATA_ROOT/datasets.seal.json"             --archive-lock infra/.github/research/continuous-optimization/hosted-validation/public-minimal.lock.json             --aec-limit "$AEC_LIMIT"             --progress-output resume-out/github-hosted-progress.json             --output resume-out/github-hosted-cache.json

      - name: Rebind exact saved partition without repartitioning
        run: |
          set -euo pipefail
          python3 infra/.github/research/continuous-optimization/hosted-validation/resume_code_candidate_blind.py             --evidence candidate-out             --manifest "infra/$MANIFEST"             --data-root "$DATA_ROOT"             --visible-output candidate-out/public/corpus-validation-resume.json             --blind-output candidate-out/public/corpus-blind-resume.json             --receipt-output resume-out/resume-partition-receipt.json
          test "$(jq -r .partition_changed resume-out/resume-partition-receipt.json)" = false
          test "$(jq -r .new_holdout_key_generated resume-out/resume-partition-receipt.json)" = false
          test "$(jq -r .candidate_or_policy_changed resume-out/resume-partition-receipt.json)" = false
          test "$(jq -r .blind_key_fingerprint resume-out/resume-partition-receipt.json)" = ebeec484da932ee7
          test "$(jq -r .visible_case_count resume-out/resume-partition-receipt.json)" = 130
          test "$(jq -r .blind_case_count resume-out/resume-partition-receipt.json)" = 30

      - name: Checkout exact shipping baseline source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: source-baseline

      - name: Checkout exact candidate base source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.SOURCE_BASE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          path: source-candidate

      - name: Rebuild exact baseline and patched candidate processors
        run: |
          set -euo pipefail
          patch=$(jq -r .patch.path "infra/$MANIFEST")
          patch_sha=$(jq -r .patch.sha256 "infra/$MANIFEST")
          test "$(sha256sum "infra/$patch" | awk '{print $1}')" = "$patch_sha"
          git -C source-candidate apply --check "$GITHUB_WORKSPACE/infra/$patch"
          git -C source-candidate apply "$GITHUB_WORKSPACE/infra/$patch"
          test "$(git -C source-candidate diff --name-only)" = src/enhance/ap_vad.c
          test -z "$(git -C source-baseline status --porcelain=v1)"
          test "$(${CC:-cc} --version | head -n 1)" = "$(cat candidate-out/compiler.txt)"

          rm -rf /tmp/i020-baseline-build /tmp/i020-candidate-build
          cmake -S source-baseline -B /tmp/i020-baseline-build             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON             -DAP_BUILD_SOURCE_REVISION="$SOURCE_BASE_SHA"
          cmake --build /tmp/i020-baseline-build --target ap_process_pcm ap_build_info_dump --parallel
          cmake -S source-candidate -B /tmp/i020-candidate-build             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON             -DAP_BUILD_SOURCE_REVISION="$SOURCE_BASE_SHA"
          cmake --build /tmp/i020-candidate-build --target ap_process_pcm ap_build_info_dump --parallel

          test "$(sha256sum /tmp/i020-baseline-build/ap_process_pcm | awk '{print $1}')" =             "$(awk '{print $1}' candidate-out/baseline-processor.sha256)"
          test "$(sha256sum /tmp/i020-candidate-build/ap_process_pcm | awk '{print $1}')" =             "$(awk '{print $1}' candidate-out/candidate-processor.sha256)"
          /tmp/i020-baseline-build/ap_build_info_dump > resume-out/baseline-build-info.txt
          /tmp/i020-candidate-build/ap_build_info_dump > resume-out/candidate-build-info.txt
          cmp -s resume-out/baseline-build-info.txt candidate-out/baseline-build-info.txt
          cmp -s resume-out/candidate-build-info.txt candidate-out/candidate-build-info.txt
          chmod 700 candidate-out/baseline-processor-json candidate-out/candidate-processor-json

      - name: Run shipping baseline on saved visible partition
        working-directory: infra
        run: |
          set -euo pipefail
          python3 validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus ../candidate-out/public/corpus-validation-resume.json             --policy validation/policies/validation-full-partition.json             --dataset-lock validation/datasets.lock.json             --processor ../candidate-out/baseline-processor-json             --output ../resume-out/baseline-visible-report.json             --evidence-manifest ../resume-out/baseline-visible-evidence.json
          test -s ../resume-out/baseline-visible-report.json

      - name: Run candidate on saved visible partition
        working-directory: infra
        run: |
          set -euo pipefail
          python3 validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus ../candidate-out/public/corpus-validation-resume.json             --policy validation/policies/validation-full-partition.json             --dataset-lock validation/datasets.lock.json             --processor ../candidate-out/candidate-processor-json             --output ../resume-out/candidate-visible-report.json             --evidence-manifest ../resume-out/candidate-visible-evidence.json             --source-manifest "$MANIFEST"
          test -s ../resume-out/candidate-visible-report.json

      - name: Run shipping baseline on saved blind partition
        working-directory: infra
        run: |
          set -euo pipefail
          python3 validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus ../candidate-out/public/corpus-blind-resume.json             --policy validation/policies/validation-full-blind.json             --dataset-lock validation/datasets.lock.json             --processor ../candidate-out/baseline-processor-json             --output ../resume-out/baseline-blind-report.json             --evidence-manifest ../resume-out/baseline-blind-evidence.json             --blind-summary-only
          test -s ../resume-out/baseline-blind-report.json

      - name: Run candidate on saved blind partition
        working-directory: infra
        run: |
          set -euo pipefail
          python3 validation/tools/run_validation.py             --source-revision "$SOURCE_BASE_SHA"             --corpus ../candidate-out/public/corpus-blind-resume.json             --policy validation/policies/validation-full-blind.json             --dataset-lock validation/datasets.lock.json             --processor ../candidate-out/candidate-processor-json             --output ../resume-out/candidate-blind-report.json             --evidence-manifest ../resume-out/candidate-blind-evidence.json             --source-manifest "$MANIFEST"             --blind-summary-only
          test -s ../resume-out/candidate-blind-report.json

      - name: Classify same frozen candidate on same partition
        id: classify
        run: |
          set +e
          python3 infra/.github/research/continuous-optimization/research_code_candidate_blind.py             --manifest "infra/$MANIFEST" --registry "infra/$REGISTRY"             --repo-root infra --classify             --identity candidate-out/candidate-identity.json             --baseline-visible resume-out/baseline-visible-report.json             --candidate-visible resume-out/candidate-visible-report.json             --baseline-blind resume-out/baseline-blind-report.json             --candidate-blind resume-out/candidate-blind-report.json             --qualification-output resume-out/qualification-summary.json
          rc=$?
          set -e
          test -s resume-out/qualification-summary.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          cat resume-out/qualification-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Seal same-partition resume evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p resume-out
          cp source-artifact-metadata.json resume-out/source-artifact-metadata.json
          printf '%s\n' "$SOURCE_RUN_ID" > resume-out/source-run-id.txt
          printf '%s\n' "$SOURCE_ARTIFACT_ID" > resume-out/source-artifact-id.txt
          printf '%s\n' "$SOURCE_ARTIFACT_DIGEST" > resume-out/source-artifact-digest.txt
          printf '%s\n' "$ORIGINAL_QUALIFICATION_INFRA_SHA" > resume-out/original-qualification-infra-revision.txt
          printf '%s\n' "$(git -C infra rev-parse HEAD)" > resume-out/resume-infra-revision.txt
          find resume-out -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum             > resume-out/SHA256SUMS

      - name: Upload hash-bound same-partition resume evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i020-source-patch-blind-resume-${{ github.run_id }}
          path: resume-out/
          if-no-files-found: error
          retention-days: 90

      - name: Enforce qualification result
        if: always()
        run: |
          set -euo pipefail
          test -s resume-out/qualification-summary.json || exit 2
          decision=$(jq -r .decision resume-out/qualification-summary.json)
          case "$decision" in
            BLIND_QUALIFIED_NON_SHIPPING) exit 0 ;;
            BLIND_REJECTED_NON_SHIPPING) exit 1 ;;
            BLIND_BASELINE_INVALID_REVIEW_REQUIRED|BLIND_QUALIFICATION_INCOMPLETE_NON_SHIPPING) exit 2 ;;
            *) exit 2 ;;
          esac
