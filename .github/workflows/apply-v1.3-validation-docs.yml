name: Apply v1.3 validation docs

on:
  push:
    branches: [validation/v1.3.0]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply staged documentation update when present
        run: |
          if [ ! -f scripts/apply_validation_docs.py ]; then
            echo "documentation updater already consumed"
            exit 0
          fi
          python3 scripts/apply_validation_docs.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A CMakeLists.txt CHANGELOG.md README.md README.zh-CN.md THIRD_PARTY.md scripts/apply_validation_docs.py
          git commit -m "release: document validation-grade self-validation v1.3.0"
          git push origin HEAD:validation/v1.3.0
