name: GitHub Hosted DNS5 Probe

on:
  push:
    branches:
      - codex/github-hosted-dns5-probe
    paths:
      - .github/workflows/github-hosted-dns5-probe.yml

permissions:
  contents: read

jobs:
  dns-archives:
    runs-on: ubuntu-latest
    steps:
      - name: Measure runner and pinned public-data archive sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.request
          urls = {
              "dns_clean_vocalset": "https://dns4public.blob.core.windows.net/dns4archive/datasets_fullband/clean_fullband/datasets_fullband.clean_fullband.VocalSet_48kHz_mono_000_NA_NA.tar.bz2",
              "dns_noise_freesound_001": "https://dnschallengepublic.blob.core.windows.net/dns5archive/V5_training_dataset/noise_fullband/datasets_fullband.noise_fullband.freesound_001.tar.bz2",
              "openslr_slr28": "https://www.openslr.org/resources/28/rirs_noises.zip",
          }
          rows = []
          for name, url in urls.items():
              req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "audio-pipeline-ci-probe"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  length = int(response.headers.get("Content-Length", "0") or 0)
                  rows.append({"name": name, "bytes": length, "mib": round(length / 1024 / 1024, 2), "status": response.status})
          print(json.dumps(rows, sort_keys=True))
          PY
          df -h /
      - name: Download, hash and inspect minimal official DNS5 archives
        shell: bash
        run: |
          set -euo pipefail
          clean_url='https://dns4public.blob.core.windows.net/dns4archive/datasets_fullband/clean_fullband/datasets_fullband.clean_fullband.VocalSet_48kHz_mono_000_NA_NA.tar.bz2'
          noise_url='https://dnschallengepublic.blob.core.windows.net/dns5archive/V5_training_dataset/noise_fullband/datasets_fullband.noise_fullband.freesound_001.tar.bz2'
          mkdir -p /tmp/dns5-minimal/extracted
          curl --fail --silent --show-error --location --retry 3 "$clean_url" -o /tmp/dns5-minimal/clean.tar.bz2
          curl --fail --silent --show-error --location --retry 3 "$noise_url" -o /tmp/dns5-minimal/noise.tar.bz2
          clean_sha=$(sha256sum /tmp/dns5-minimal/clean.tar.bz2 | awk '{print $1}')
          noise_sha=$(sha256sum /tmp/dns5-minimal/noise.tar.bz2 | awk '{print $1}')
          tar -xjf /tmp/dns5-minimal/clean.tar.bz2 -C /tmp/dns5-minimal/extracted
          tar -xjf /tmp/dns5-minimal/noise.tar.bz2 -C /tmp/dns5-minimal/extracted
          clean_count=$(find /tmp/dns5-minimal/extracted -type f -iname '*.wav' -path '*clean_fullband*' | wc -l | tr -d ' ')
          noise_count=$(find /tmp/dns5-minimal/extracted -type f -iname '*.wav' -path '*noise_fullband*' | wc -l | tr -d ' ')
          test "$clean_count" -ge 32
          test "$noise_count" -ge 32
          printf 'clean_sha256=%s\nnoise_sha256=%s\nclean_wavs=%s\nnoise_wavs=%s\n' \
            "$clean_sha" "$noise_sha" "$clean_count" "$noise_count"
          df -h /

  compact-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Bootstrap and verify pinned AEC plus SLR28 cache
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/audio-validation-data
          seal=$root/datasets.seal.json
          python3 validation/tools/prepare_public_validation.py prepare \
            --profile compact --root "$root" --seal "$seal" --allow-large-downloads \
            > /tmp/compact-prepare.json
          python3 validation/tools/prepare_public_validation.py verify \
            --profile compact --root "$root" --seal "$seal" \
            > /tmp/compact-verify.json
          python3 - <<'PY'
          import json
          for path in ('/tmp/compact-prepare.json','/tmp/compact-verify.json'):
              data=json.load(open(path))
              print(json.dumps({
                  'profile': data['profile'],
                  'lock_sha256': data['lock_sha256'],
                  'datasets': data['datasets'],
              }, sort_keys=True))
          PY
          du -sh "$root"
          df -h /
