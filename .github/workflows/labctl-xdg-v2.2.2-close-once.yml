name: Labctl XDG v2.2.2 Closure One-Time

on:
  push:
    branches: [fix/labctl-xdg-v2.2.2]
    paths: [.github/workflows/labctl-xdg-v2.2.2-close-once.yml]

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: fix/labctl-xdg-v2.2.2
          fetch-depth: 0

      - name: Fix labctl path-resolution self-test contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lab/scripts/labctl.py')
          text = path.read_text(encoding='utf-8')
          old = '''USER_HOME = Path.home()\nXDG_DATA_HOME = Path(os.environ.get("XDG_DATA_HOME", USER_HOME / ".local/share")).expanduser()\nXDG_CACHE_HOME = Path(os.environ.get("XDG_CACHE_HOME", USER_HOME / ".cache")).expanduser()\nXDG_STATE_HOME = Path(os.environ.get("XDG_STATE_HOME", USER_HOME / ".local/state")).expanduser()\nXDG_CONFIG_HOME = Path(os.environ.get("XDG_CONFIG_HOME", USER_HOME / ".config")).expanduser()\nDEFAULT_DATA_ROOT = Path(os.environ.get("AUDIO_PIPELINE_LAB_DATA_ROOT", USER_HOME / "audio-validation-extended")).expanduser()\nDEFAULT_CACHE_ROOT = Path(os.environ.get("AUDIO_PIPELINE_LAB_CACHE_ROOT", XDG_CACHE_HOME / "audio-pipeline-lab/datasets")).expanduser()\nDEFAULT_STATE_ROOT = Path(os.environ.get("AUDIO_PIPELINE_LAB_STATE_ROOT", XDG_STATE_HOME / "audio-pipeline-lab")).expanduser()\nDEFAULT_BOARD = Path(os.environ.get("AUDIO_PIPELINE_LAB_BOARD", XDG_CONFIG_HOME / "audio-pipeline/board.json")).expanduser()\n'''
          new = '''def resolve_user_paths(env: dict[str, str] | None = None, user_home: Path | None = None) -> tuple[Path, Path, Path, Path, Path, Path, Path, Path, Path]:\n    values = os.environ if env is None else env\n    home = (Path.home() if user_home is None else user_home).expanduser()\n    xdg_data = Path(values.get("XDG_DATA_HOME", str(home / ".local/share"))).expanduser()\n    xdg_cache = Path(values.get("XDG_CACHE_HOME", str(home / ".cache"))).expanduser()\n    xdg_state = Path(values.get("XDG_STATE_HOME", str(home / ".local/state"))).expanduser()\n    xdg_config = Path(values.get("XDG_CONFIG_HOME", str(home / ".config"))).expanduser()\n    data_root = Path(values.get("AUDIO_PIPELINE_LAB_DATA_ROOT", str(home / "audio-validation-extended"))).expanduser()\n    cache_root = Path(values.get("AUDIO_PIPELINE_LAB_CACHE_ROOT", str(xdg_cache / "audio-pipeline-lab/datasets"))).expanduser()\n    state_root = Path(values.get("AUDIO_PIPELINE_LAB_STATE_ROOT", str(xdg_state / "audio-pipeline-lab"))).expanduser()\n    board = Path(values.get("AUDIO_PIPELINE_LAB_BOARD", str(xdg_config / "audio-pipeline/board.json"))).expanduser()\n    return home, xdg_data, xdg_cache, xdg_state, xdg_config, data_root, cache_root, state_root, board\n\n\n(USER_HOME, XDG_DATA_HOME, XDG_CACHE_HOME, XDG_STATE_HOME, XDG_CONFIG_HOME,\n DEFAULT_DATA_ROOT, DEFAULT_CACHE_ROOT, DEFAULT_STATE_ROOT, DEFAULT_BOARD) = resolve_user_paths()\n'''
          if old not in text:
              raise SystemExit('labctl default-path block drifted')
          text = text.replace(old, new, 1)

          old_test = '''    assert str(DEFAULT_DATA_ROOT).startswith(str(USER_HOME))\n    assert str(DEFAULT_CACHE_ROOT).startswith(str(USER_HOME))\n    assert str(DEFAULT_STATE_ROOT).startswith(str(USER_HOME))\n    assert str(DEFAULT_BOARD).startswith(str(USER_HOME))\n'''
          new_test = '''    fake_home = Path("/tmp/audio-pipeline-selftest-home")\n    resolved = resolve_user_paths({}, fake_home)\n    assert resolved[5] == fake_home / "audio-validation-extended"\n    assert resolved[6] == fake_home / ".cache/audio-pipeline-lab/datasets"\n    assert resolved[7] == fake_home / ".local/state/audio-pipeline-lab"\n    assert resolved[8] == fake_home / ".config/audio-pipeline/board.json"\n    xdg = resolve_user_paths({\n        "XDG_DATA_HOME": "/mnt/ap-xdg-data",\n        "XDG_CACHE_HOME": "/mnt/ap-xdg-cache",\n        "XDG_STATE_HOME": "/mnt/ap-xdg-state",\n        "XDG_CONFIG_HOME": "/mnt/ap-xdg-config",\n    }, fake_home)\n    assert xdg[1] == Path("/mnt/ap-xdg-data")\n    assert xdg[6] == Path("/mnt/ap-xdg-cache/audio-pipeline-lab/datasets")\n    assert xdg[7] == Path("/mnt/ap-xdg-state/audio-pipeline-lab")\n    assert xdg[8] == Path("/mnt/ap-xdg-config/audio-pipeline/board.json")\n    explicit = resolve_user_paths({\n        "AUDIO_PIPELINE_LAB_DATA_ROOT": "/data/ap-real",\n        "AUDIO_PIPELINE_LAB_CACHE_ROOT": "/data/ap-cache",\n        "AUDIO_PIPELINE_LAB_STATE_ROOT": "/data/ap-state",\n        "AUDIO_PIPELINE_LAB_BOARD": "/data/ap-config/board.json",\n    }, fake_home)\n    assert explicit[5:] == (Path("/data/ap-real"), Path("/data/ap-cache"), Path("/data/ap-state"), Path("/data/ap-config/board.json"))\n    for current in (DEFAULT_DATA_ROOT, DEFAULT_CACHE_ROOT, DEFAULT_STATE_ROOT, DEFAULT_BOARD):\n        assert current.is_absolute()\n'''
          if old_test not in text:
              raise SystemExit('labctl self-test path block drifted')
          text = text.replace(old_test, new_test, 1)
          path.write_text(text, encoding='utf-8')

          cmake = Path('CMakeLists.txt')
          ctext = cmake.read_text(encoding='utf-8')
          if 'VERSION 2.2.1' not in ctext:
              raise SystemExit('unexpected project version')
          cmake.write_text(ctext.replace('VERSION 2.2.1', 'VERSION 2.2.2', 1), encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          if not current.startswith('# 2.2.1'):
              raise SystemExit('unexpected changelog head')
          changelog.write_text('''# 2.2.2\n\n- Fix `labctl.py self-test` so XDG and `AUDIO_PIPELINE_LAB_*` path overrides are treated as supported configuration instead of being rejected for living outside `Path.home()`.\n- Refactor user-path resolution into a deterministic helper and self-test plain HOME defaults, XDG overrides and explicit laboratory-root overrides independently.\n- Keep ordinary-user Ansible deployment, dataset acquisition semantics, validation authority, DSP/API/ABI and certification thresholds unchanged.\n\n''' + current, encoding='utf-8')
          PY

      - name: Validate path contracts including foreign XDG roots
        shell: bash
        run: |
          set -euo pipefail
          python3 lab/scripts/labctl.py self-test
          env \
            XDG_DATA_HOME=/tmp/foreign-xdg/data \
            XDG_CACHE_HOME=/tmp/foreign-xdg/cache \
            XDG_STATE_HOME=/tmp/foreign-xdg/state \
            XDG_CONFIG_HOME=/tmp/foreign-xdg/config \
            python3 lab/scripts/labctl.py self-test
          env \
            AUDIO_PIPELINE_LAB_DATA_ROOT=/tmp/ap-data \
            AUDIO_PIPELINE_LAB_CACHE_ROOT=/tmp/ap-cache \
            AUDIO_PIPELINE_LAB_STATE_ROOT=/tmp/ap-state \
            AUDIO_PIPELINE_LAB_BOARD=/tmp/ap-board/board.json \
            python3 lab/scripts/labctl.py self-test
          python3 scripts/docs_consistency.py

      - name: Prove SDK remains healthy
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B /tmp/ap-build -DCMAKE_BUILD_TYPE=Release -DAP_WARNINGS_AS_ERRORS=ON
          cmake --build /tmp/ap-build -j2
          ctest --test-dir /tmp/ap-build --output-on-failure

      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/scripts/labctl.py CMakeLists.txt CHANGELOG.md
          git diff --cached --check
          git commit -m 'lab: fix XDG-aware ordinary-user path validation'
          git push origin HEAD:fix/labctl-xdg-v2.2.2
