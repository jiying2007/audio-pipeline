name: HIL Research Soak (manual, exact-source)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA to test
        required: true
        type: string
      tier:
        description: Soak tier
        required: true
        default: accelerated-pr
        type: choice
        options: [accelerated-pr, research-1h, research-8h, research-24h, research-72h]
      board_manifest:
        description: Optional board-local JSON manifest; blank resolves AUDIO_PIPELINE_LAB_BOARD or XDG/HOME user-mode path
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: hil-research-${{ inputs.tier }}-${{ inputs.source_sha }}
  cancel-in-progress: false

jobs:
  availability:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.policy.outputs.run }}
    steps:
      - name: Enforce HIL availability policy
        id: policy
        env:
          EVENT_NAME: ${{ github.event_name }}
          HIL_ENABLED: ${{ vars.HIL_ENABLED }}
          MANUAL_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            echo "HIL_RESEARCH_MANUAL_ONLY: no scheduled/release dispatch" >&2
            exit 2
          fi
          [[ "$MANUAL_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a 40-character commit SHA" >&2; exit 1; }
          if [ "$HIL_ENABLED" != true ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "HIL_REQUIRED_BUT_DISABLED: manual scientific experiment requires an actual isolated audio-target runner and HIL_ENABLED=true." >&2
            exit 1
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

  soak:
    needs: availability
    if: needs.availability.outputs.run == 'true'
    runs-on: [self-hosted, linux, audio-target]
    timeout-minutes: 4380
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Resolve exact revision tier and board route authority
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_EVENT_SHA: ${{ inputs.source_sha }}
          INPUT_TIER: ${{ inputs.tier }}
          INPUT_BOARD: ${{ inputs.board_manifest }}
        run: |
          set -euo pipefail
          board=$INPUT_BOARD
          if [ -z "$board" ]; then
            board=${AUDIO_PIPELINE_LAB_BOARD:-${XDG_CONFIG_HOME:-$HOME/.config}/audio-pipeline/board.json}
          fi
          case "$board" in
            /*) ;;
            *) echo "HIL board manifest must resolve to an absolute path: $board" >&2; exit 1 ;;
          esac
          case "$board" in *$'\n'*|*$'\r'*) echo 'HIL board manifest contains a newline' >&2; exit 1 ;; esac
          test "$EVENT_NAME" = workflow_dispatch
          tier=$INPUT_TIER
          case "$tier" in
            accelerated-pr) seconds=600; fault=accelerated; max_xruns=5; max_overruns=5 ;;
            research-1h) seconds=3600; fault=none; max_xruns=0; max_overruns=0 ;;
            research-8h) seconds=28800; fault=none; max_xruns=0; max_overruns=0 ;;
            research-24h) seconds=86400; fault=none; max_xruns=0; max_overruns=0 ;;
            research-72h) seconds=259200; fault=none; max_xruns=0; max_overruns=0 ;;
            *) exit 2 ;;
          esac
          revision=$(git rev-parse HEAD)
          test "$revision" = "$EXPECTED_EVENT_SHA"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          python3 tools/hil_board.py metadata --board "$board" > /tmp/hil-board.json
          export BOARD="$board" TIER="$tier" SECONDS="$seconds" FAULT="$fault" MAX_XRUNS="$max_xruns" MAX_OVERRUNS="$max_overruns"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib
          import json
          import os
          from pathlib import Path

          board_path = Path(os.environ['BOARD'])
          board_bytes = board_path.read_bytes()
          board = json.load(open('/tmp/hil-board.json', encoding='utf-8'))
          configured = board['route']

          labels = board.get('runner_labels')
          required_labels = {'self-hosted', 'linux', 'audio-target'}
          if not isinstance(labels, list) or not required_labels.issubset(set(map(str, labels))):
              raise SystemExit('HIL board manifest must bind self-hosted/linux/audio-target runner labels')

          def text(value, default=''):
              if value is None:
                  return default
              return str(value)

          route = {
              'capture': text(configured['capture_device']),
              'playback': text(configured.get('playback_device'), 'none') or 'none',
              'farend': text(configured.get('farend_file')),
              'rate': text(configured['sample_rate_hz']),
              'mics': text(configured['mic_channels']),
              'cpu': text(configured['dsp_cpu']),
              'power': text(board.get('power_sensor')),
              'power_scale': text(board.get('power_scale', 1000000)),
          }
          authority = {
              'schema_version': 1,
              'authority': 'board-manifest-hil-route',
              'board_path': str(board_path),
              'board_sha256': hashlib.sha256(board_bytes).hexdigest(),
              'route': {
                  'capture_device': route['capture'],
                  'playback_device': None if route['playback'] == 'none' else route['playback'],
                  'farend_file': route['farend'] or None,
                  'sample_rate_hz': int(route['rate']),
                  'mic_channels': int(route['mics']),
                  'dsp_cpu': int(route['cpu']),
                  'power_sensor': route['power'] or None,
                  'power_scale': float(route['power_scale']),
              },
          }
          canonical = json.dumps(authority, sort_keys=True, separators=(',', ':')).encode('utf-8')
          authority['route_authority_sha256'] = hashlib.sha256(canonical).hexdigest()
          Path('/tmp/hil-route-authority.json').write_text(
              json.dumps(authority, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )

          values = {
              'board': str(board_path), 'tier': os.environ['TIER'],
              'seconds': os.environ['SECONDS'], 'fault': os.environ['FAULT'],
              'max_xruns': os.environ['MAX_XRUNS'], 'max_overruns': os.environ['MAX_OVERRUNS'],
              'board_sha256': authority['board_sha256'],
              'route_authority_sha256': authority['route_authority_sha256'],
              **route,
          }
          for key, value in values.items():
              if '\n' in value or '\r' in value:
                  raise SystemExit(f'invalid newline in HIL output {key}')
              print(f'{key}={value}')
          PY
          printf '%s\n' "$revision" | tee /tmp/hil-revision.txt
          test -z "$(git status --porcelain=v1)"
      - name: Preflight isolated audio-target runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ap-hil-evidence
          args=(
            --role audio-target
            --source-revision '${{ steps.route.outputs.revision }}'
            --board-manifest '${{ steps.route.outputs.board }}'
            --require-command cmake --require-command cc
            --writable-path /tmp
            --output /tmp/ap-hil-evidence/runner-preflight.json
          )
          if [ -n '${{ steps.route.outputs.farend }}' ]; then args+=(--farend-file '${{ steps.route.outputs.farend }}'); fi
          if [ -n '${{ steps.route.outputs.power }}' ]; then args+=(--power-input '${{ steps.route.outputs.power }}'); fi
          python3 tools/runner_preflight.py "${args[@]}"
      - name: Board preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ap-hil-evidence
          python3 tools/hil_board.py preflight \
            --board '${{ steps.route.outputs.board }}' \
            --output /tmp/ap-hil-evidence/preflight.json \
            --settle-seconds 120
          cp '${{ steps.route.outputs.board }}' /tmp/ap-hil-evidence/board.json
          cp /tmp/hil-route-authority.json /tmp/ap-hil-evidence/route-authority.json
          cp /tmp/hil-revision.txt /tmp/ap-hil-evidence/source-revision.txt
      - name: Build exact HIL runtime
        shell: bash
        run: |
          set -euo pipefail
          revision=$(cat /tmp/hil-revision.txt)
          cmake -S . -B build/hil -DCMAKE_BUILD_TYPE=Release \
            -DAP_BUILD_SOURCE_REVISION="$revision" \
            -DAP_BUILD_ALSA_EXAMPLE=ON -DAP_STRICT_WARNINGS=ON
          cmake --build build/hil --parallel --target ap_alsa_runtime_duplex ap_build_info_dump
          ./build/hil/ap_build_info_dump > /tmp/ap-hil-evidence/build-info.txt
      - name: Execute tiered route soak
        shell: bash
        run: |
          set -euo pipefail
          args=(
            route-soak
            --binary build/hil/ap_alsa_runtime_duplex
            --output /tmp/ap-hil-evidence/soak.json
            --capture-device '${{ steps.route.outputs.capture }}'
            --seconds '${{ steps.route.outputs.seconds }}'
            --dsp-cpu '${{ steps.route.outputs.cpu }}'
            --sample-rate '${{ steps.route.outputs.rate }}'
            --mic-channels '${{ steps.route.outputs.mics }}'
            --max-xruns '${{ steps.route.outputs.max_xruns }}'
            --max-overruns '${{ steps.route.outputs.max_overruns }}'
            --power-scale '${{ steps.route.outputs.power_scale }}'
            --fault-profile '${{ steps.route.outputs.fault }}'
          )
          if [ '${{ steps.route.outputs.playback }}' != none ]; then args+=(--playback-device '${{ steps.route.outputs.playback }}'); fi
          if [ -n '${{ steps.route.outputs.farend }}' ]; then args+=(--farend '${{ steps.route.outputs.farend }}'); fi
          if [ -n '${{ steps.route.outputs.power }}' ]; then args+=(--power-input '${{ steps.route.outputs.power }}'); fi
          python3 tools/target_evidence.py "${args[@]}"
      - name: Classify HIL evidence
        if: always()
        shell: bash
        env:
          TIER: ${{ steps.route.outputs.tier }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('/tmp/ap-hil-evidence')
          root.mkdir(parents=True, exist_ok=True)
          runner = json.loads((root/'runner-preflight.json').read_text()) if (root/'runner-preflight.json').exists() else None
          preflight = json.loads((root/'preflight.json').read_text()) if (root/'preflight.json').exists() else None
          authority = json.loads((root/'route-authority.json').read_text()) if (root/'route-authority.json').exists() else None
          soak = json.loads((root/'soak.json').read_text()) if (root/'soak.json').exists() else None
          route_match = False
          if authority is not None and soak is not None:
              expected = authority['route']
              actual = soak.get('route') or {}
              route_match = actual == {
                  'capture_device': expected['capture_device'],
                  'playback_device': expected['playback_device'],
                  'farend': expected['farend_file'],
                  'sample_rate_hz': expected['sample_rate_hz'],
                  'mic_channels': expected['mic_channels'],
                  'dsp_cpu': expected['dsp_cpu'],
              }
          if runner is None or runner.get('classification') != 'READY':
              category = 'INFRA_FAILURE'
          elif preflight is None or preflight.get('classification') != 'READY':
              category = 'INFRA_FAILURE'
          elif authority is None:
              category = 'INFRA_FAILURE'
          elif soak is None:
              category = 'HARDWARE_FAILURE'
          elif not route_match:
              category = 'INFRA_FAILURE'
          elif not soak['soak']['passed']:
              category = 'XRUN_FAILURE' if soak['soak']['xruns'] else 'HARDWARE_FAILURE'
          else:
              category = 'NONE'
          out = {
              'schema_version': 1,
              'category': category,
              'tier': os.environ.get('TIER') or None,
              'source_revision': Path('/tmp/hil-revision.txt').read_text().strip() if Path('/tmp/hil-revision.txt').exists() else None,
              'board_sha256': authority.get('board_sha256') if authority else None,
              'route_authority_sha256': authority.get('route_authority_sha256') if authority else None,
              'route_match': route_match,
          }
          (root/'classification.json').write_text(json.dumps(out, indent=2, sort_keys=True)+'\n')
          print(json.dumps(out, sort_keys=True))
          PY
      - name: Board cleanup
        if: always()
        continue-on-error: true
        run: >-
          python3 tools/hil_board.py cleanup
          --board '${{ steps.route.outputs.board }}'
          --output /tmp/ap-hil-evidence/cleanup.json
      - name: Seal HIL evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ap-hil-evidence
          cd /tmp/ap-hil-evidence
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload HIL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hil-${{ steps.route.outputs.tier || 'unresolved' }}-${{ github.run_id }}
          path: /tmp/ap-hil-evidence
          retention-days: 90
          if-no-files-found: error
