name: Apply ordinary product certification v2 contracts

on:
  push:
    branches: [feat/product-certification-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Apply and verify ordinary certification files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/product-certification-v2"
          echo '' | base64 -d > /tmp/apply-cert-v2.py
          python3 /tmp/apply-cert-v2.py

          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev
          python3 -m py_compile tools/*.py certification/*.py
          python3 certification/validate_record.py --self-test
          python3 tools/ap_certify.py --self-test
          python3 tools/target_evidence.py --self-test
          python3 -m json.tool certification/record.schema.json >/dev/null

          rm -rf build-cert-final build-cert-alsa build-cert-ema build-cert-mcra
          cmake -S . -B build-cert-final -DCMAKE_BUILD_TYPE=Release -DAP_STRICT_WARNINGS=ON
          cmake --build build-cert-final --parallel
          ctest --test-dir build-cert-final --output-on-failure
          ./build-cert-final/ap_bench 1 0 0 active 8000 1 | tee /tmp/bench-8k.txt
          ./build-cert-final/ap_bench 1 0 0 active 48000 2 | tee /tmp/bench-48k.txt
          grep -q 'sample_rate_hz=8000 mic_channels=1' /tmp/bench-8k.txt
          grep -q 'sample_rate_hz=48000 mic_channels=2' /tmp/bench-48k.txt

          cmake -S . -B build-cert-alsa -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_ALSA_EXAMPLE=ON -DAP_STRICT_WARNINGS=ON
          cmake --build build-cert-alsa --parallel --target ap_alsa_runtime_duplex ap_build_info_dump

          cmake -S . -B build-cert-ema -DCMAKE_BUILD_TYPE=Release -DAP_NS_ESTIMATOR=EMA -DAP_STRICT_WARNINGS=ON
          cmake --build build-cert-ema --target ap_build_info_dump --parallel
          cmake -S . -B build-cert-mcra -DCMAKE_BUILD_TYPE=Release -DAP_NS_ESTIMATOR=MCRA -DAP_STRICT_WARNINGS=ON
          cmake --build build-cert-mcra --target ap_build_info_dump --parallel
          ema=$(./build-cert-ema/ap_build_info_dump | sed -n 's/^config_digest=//p')
          mcra=$(./build-cert-mcra/ap_build_info_dump | sed -n 's/^config_digest=//p')
          test "${#ema}" -eq 64
          test "${#mcra}" -eq 64
          test "$ema" != "$mcra"

          git diff --check
          if git diff --quiet -- CMakeLists.txt certification/record.schema.json CHANGELOG.md docs/PERFORMANCE.md; then
            echo 'ordinary certification contracts already applied; no commit needed'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CMakeLists.txt certification/record.schema.json CHANGELOG.md docs/PERFORMANCE.md
          git commit -m "certification: finalize product evidence v3 contracts"
          git push origin HEAD:feat/product-certification-v2
