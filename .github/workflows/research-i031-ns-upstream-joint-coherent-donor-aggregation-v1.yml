name: Research I031 NS Upstream Joint-Coherent Donor Aggregation v1
run-name: "i031-joint-coherent-donor / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i031-ns-upstream-joint-coherent-donor-aggregation-v1.json'
      - 'tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c'
      - 'tests/validation/i031_ns_upstream_joint_coherent_donor_aggregation.py'
      - 'tests/validation/test_i031_one_shot_guard.py'
      - '.github/workflows/research-i031-ns-upstream-joint-coherent-donor-aggregation-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i031-joint-coherent-donor-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i031-ns-upstream-joint-coherent-donor-aggregation-v1.json
  DEV_ROOT: /tmp/audio-pipeline-i031-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I031 joint-coherent donor aggregation contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i031_ns_upstream_joint_coherent_donor_aggregation.py
          python3 tests/validation/i031_ns_upstream_joint_coherent_donor_aggregation.py --self-test
          python3 tests/validation/test_i031_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i031-ns-upstream-joint-coherent-donor-aggregation-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='CANDIDATE_ZERO_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'

          a=c['fresh_diagnostic_authority']
          donor=a['donor_seeds']
          target=a['target_seeds']
          assert len(donor)==3 and len(target)==3
          assert len(set(donor))==3 and len(set(target))==3
          assert set(donor).isdisjoint(target)
          assert all(type(seed) is int and seed>0 for seed in donor+target)
          assert a['diagnostic_execution_limit']==1
          assert a['candidate_limit']==0
          assert a['confirmation_limit']==0

          frozen=c['frozen_donor_selection']
          assert frozen['donor_select_k']==3
          assert frozen['same_noise_domain_required'] is True
          assert frozen['must_remain_ast_equivalent_to_i030'] is True
          assert frozen['may_change_k'] is False
          assert frozen['may_change_matching_rule'] is False
          assert frozen['may_change_negative_control_map'] is False
          assert frozen['negative_control_domain_map']=={
              'kitchen':'traffic',
              'traffic':'living',
              'living':'office',
              'office':'cafeteria',
              'cafeteria':'bus',
              'bus':'field',
              'field':'kitchen',
          }

          control=c['frozen_control_aggregation']
          assert control['id']=='independent-component-median-v1'
          assert control['may_change'] is False

          op=c['joint_coherent_operator']
          assert op['id']=='observed-frame-medoid-locator-v1'
          assert op['operator_count']==1
          assert op['expected_pooled_frame_count']==24
          assert op['preserves_observed_joint_identity'] is True
          assert op['search_across_operators'] is False
          assert op['deterministic_tie_break']==[
              'seed-bound donor case_key','frame_index'
          ]
          assert op['maximum_algebraic_inconsistency']==0.000001

          h=c['directional_hypothesis']
          assert h['primary_metric']=='gap_absolute_error'
          assert h['maximum_one_sided_sign_test_p']==0.01
          assert all(value is False for value in c['authority_boundary'].values())

          predecessor=Path(c['predecessor']['i030_closure'])
          prior=json.loads(predecessor.read_text())
          assert prior['status']==c['predecessor']['required_status']
          assert prior['decision']==c['predecessor']['required_decision']
          assert prior['reviewed_decision']==c['predecessor']['required_reviewed_decision']
          assert prior['proposed_followup_hypothesis']['id']==c['predecessor']['required_followup_id']
          assert prior['proposed_followup_hypothesis']['authority']==c['predecessor']['required_followup_authority']

          def blob(p):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+str(p)],text=True).strip()

          assert blob(predecessor)==c['predecessor']['i030_closure_blob_sha']
          assert blob(Path(c['dataset_authority']['lock_path']))==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(Path(c['dataset_authority']['builder_path']))==c['dataset_authority']['builder_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['probe_path']))==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['evaluator_path']))==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']

          for seed in donor+target:
              pattern=rf'(^|[^0-9]){seed}([^0-9]|$)'
              result=subprocess.run(
                  ['git','grep','-n','-E',pattern,'--','.github','tests','validation','docs'],
                  stdout=subprocess.PIPE,text=True,check=False)
              assert result.returncode in (0,1)
              matches=[
                  line for line in result.stdout.splitlines()
                  if line and line.split(':',1)[0] != str(path)
              ]
              assert not matches, (
                  f'I031 seed is not fresh: {seed}\n'+'\n'.join(matches))
          PY
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i031-joint-coherent-donor-contract
      - name: Compile frozen I025 dual-mirror probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i031-contract \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i031-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i031-contract/generated \
            tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c \
            build-i031-contract/libaudio_pipeline.a -lm \
            -o build-i031-contract/i031-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I031 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i031-ns-upstream-joint-coherent-donor-aggregation-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I031 diagnostic requires first-attempt trusted main dispatch')

          def pages(endpoint):
              raw=subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint],text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value

          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I031 run not visible; fail closed')

          consuming={
              'Materialize fresh I031 donor and target public-development-v3 partitions',
              'Evaluate candidate-zero joint-coherent donor aggregation',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts<1:
                  raise SystemExit('invalid prior I031 attempt count')
              for run_attempt in range(1,attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs'
                      '?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if (
                                  step.get('name') in consuming
                                  and step.get('conclusion')!='skipped'
                              ):
                                  raise SystemExit(
                                      f'I031 one-shot authority already consumed by run {run_id}')
          print('I031 one-shot authority: fresh')
          PY
      - name: Bind frozen I031 inputs and unchanged shipping source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.loads(Path('.github/research/continuous-optimization/development-v4/i031-ns-upstream-joint-coherent-donor-aggregation-v1.json').read_text())
          def blob(path):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+path],text=True).strip()
          assert blob(c['predecessor']['i030_closure'])==c['predecessor']['i030_closure_blob_sha']
          assert blob(c['dataset_authority']['lock_path'])==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(c['dataset_authority']['builder_path'])==c['dataset_authority']['builder_git_blob_sha']
          assert blob(c['diagnostic_inputs']['probe_path'])==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(c['diagnostic_inputs']['evaluator_path'])==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']
          PY
          SOURCE_BASE="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["source_base_sha"])')"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD -- \
            src/enhance/ap_noise_tracker.c \
            src/enhance/ap_noise_tracker.h \
            src/enhance/ap_ns.c \
            src/enhance/ap_vad.c \
            src/modules/ap_vad_module.c \
            src/modules/ap_ns_module.c \
            include/audio_pipeline/audio_modules.h \
            src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i031-joint-coherent-donor
      - name: Build frozen I025 dual-mirror probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i031 \
            -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i031 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror \
            -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1 \
            -Iinclude -Isrc -Ibuild-i031/generated \
            tests/validation/i025_ns_upstream_disagreement_noise_source_probe.c \
            build-i031/libaudio_pipeline.a -lm \
            -o build-i031/i031-probe
      - name: Materialize fresh I031 donor and target public-development-v3 partitions
        run: |
          set -euo pipefail
          LOCK="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["lock_path"])')"
          BUILDER="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["builder_path"])')"
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py \
            --lock "$LOCK" --root "$DEV_ROOT" \
            --output /tmp/i031-development-v3-materialization.json
          for role in donor target; do
            for seed in $(ROLE="$role" python3 -c 'import json,os; c=json.load(open(os.environ["CONTRACT"])); print(*c["fresh_diagnostic_authority"][os.environ["ROLE"]+"_seeds"])'); do
              python3 "$BUILDER" \
                --lock "$LOCK" \
                --materialization /tmp/i031-development-v3-materialization.json \
                --data-root "$DEV_ROOT" \
                --output "/tmp/i031-$role-$seed" \
                --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
            done
          done
      - name: Evaluate candidate-zero joint-coherent donor aggregation
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i031-out
          mkdir -p i031-out/evidence
          donor_args=()
          target_args=()
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["donor_seeds"])'); do
            donor_args+=(--donor-corpus "/tmp/i031-donor-$seed/corpus.json")
          done
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            target_args+=(--target-corpus "/tmp/i031-target-$seed/corpus.json")
          done
          set +e
          python3 tests/validation/i031_ns_upstream_joint_coherent_donor_aggregation.py \
            --probe build-i031/i031-probe \
            --contract "$CONTRACT" \
            "${donor_args[@]}" \
            "${target_args[@]}" \
            --output i031-out/evidence/result.json \
            > i031-out/evidence/evaluate.stdout \
            2> i031-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s\n' "$rc" > i031-out/evidence/evaluate.exit-code
          cp "$CONTRACT" i031-out/evidence/contract.json
          cp /tmp/i031-development-v3-materialization.json i031-out/evidence/materialization.json
          sha256sum build-i031/i031-probe | awk '{print $1}' > i031-out/evidence/probe.sha256
          for role in donor target; do
            ROLE="$role" python3 - <<'PY'
          import json,os
          c=json.load(open(os.environ["CONTRACT"]))
          for seed in c["fresh_diagnostic_authority"][os.environ["ROLE"]+"_seeds"]:
              print(f"{os.environ['ROLE']} {seed}")
          PY
          done | while read -r role seed; do
            sha256sum "/tmp/i031-$role-$seed/corpus.json"
          done > i031-out/evidence/corpora.sha256
          printf 'main_sha=%s\n' "$GITHUB_SHA" > i031-out/evidence/build-info.txt
          if test -f i031-out/evidence/result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i031-out/evidence/result.json').read_text())
          Path('i031-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_authority':r['fresh_diagnostic_authority'],
                  'shipping_mirror':r['shipping_mirror'],
                  'coverage':r['coverage'],
                  'comparison':r['comparison'],
                  'directional_hypothesis':r['directional_hypothesis'],
                  'max_joint_coherent_algebraic_inconsistency':
                      r['max_joint_coherent_algebraic_inconsistency'],
                  'interpretation_boundary':r['interpretation_boundary'],
              },indent=2,sort_keys=True)+'\n')
          PY
          fi
          (
            cd i031-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort | \
              while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          exit "$rc"
      - name: Enforce aggregation-diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i031-out/evidence/result.json').read_text())
          assert r['decision']=='NS_UPSTREAM_JOINT_COHERENT_DONOR_AGGREGATION_DECOMPOSED_REVIEW_REQUIRED'
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['shipping_mirror']['vad_active_mismatch_frames']==0
          assert r['max_joint_coherent_algebraic_inconsistency']<=1e-6
          b=r['interpretation_boundary']
          assert b['i029_i030_k3_matching_rule_frozen'] is True
          assert b['i029_i030_negative_control_map_frozen'] is True
          assert b['control_independent_component_median_frozen'] is True
          assert b['exactly_one_joint_coherent_operator'] is True
          assert b['joint_operator_returns_observed_frame'] is True
          assert b['joint_operator_unweighted_l1_locator'] is True
          assert b['deterministic_tie_break_case_key_then_frame_index'] is True
          assert b['matching_metadata_development_only_not_shippable'] is True
          assert b['same_target_future_frames_never_enter_donor_reference'] is True
          assert b['no_donor_rule_tuning'] is True
          assert b['no_operator_search'] is True
          assert b['no_component_counterfactual'] is True
          assert b['no_reference_source_candidate_selected'] is True
          assert b['no_shipping_candidate'] is True
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i031-out/evidence/summary.json; then
            cat i031-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I031 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i031-ns-upstream-joint-coherent-donor-${{ github.run_id }}
          path: i031-out/
          retention-days: 90
          if-no-files-found: error
