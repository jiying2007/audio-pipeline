name: Archive Rejected Blind Candidate Once

on:
  push:
    branches:
      - codex/archive-rejected-blind-candidate
    paths:
      - .github/research/continuous-optimization/archive_rejected_blind_once.py
      - .github/workflows/archive-rejected-blind-candidate-once.yml

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/archive-rejected-blind-candidate
          fetch-depth: 0
      - name: Archive terminal blind candidate
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/archive_rejected_blind_once.py
          rm .github/research/continuous-optimization/archive_rejected_blind_once.py
          rm .github/workflows/archive-rejected-blind-candidate-once.yml
          git diff --check
          python3 .github/research/continuous-optimization/research_candidate_blind.py --self-test
          python3 - <<'PY'
          import json
          from pathlib import Path
          cid='542ae198199b'
          active=Path('.github/research/continuous-optimization/candidates/f5ad7c495d7f67d6.json')
          archived=Path('.github/research/continuous-optimization/terminal-candidates/f5ad7c495d7f67d6.json')
          registry=json.load(open('.github/research/continuous-optimization/dataset-registry.json'))
          assert not active.exists()
          v=json.load(open(archived))
          assert v['status']=='BLIND_REJECTED_NON_SHIPPING' and v['terminal_candidate'] is True
          assert v['failed_stage']=='visible-validation' and v['visible_result']=='FAIL'
          assert sum(1 for x in registry['terminal_candidates'] if x['candidate_id']==cid)==1
          wf=Path('.github/workflows/research-candidate-blind-qualification.yml').read_text()
          assert "terminal-candidates/**" in wf and "dataset-registry.json" in wf
          assert 'test "${#manifests[@]}" -gt 0' not in wf
          print('terminal lifecycle post-patch contract: PASS')
          PY
      - name: Commit terminal lifecycle state and retire one-shot
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'governance(research): archive rejected blind candidate'
          git push origin HEAD:codex/archive-rejected-blind-candidate
