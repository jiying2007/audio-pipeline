name: Research Stage Source Candidate Evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/stage-lanes-v1-run-1.json'
      - '.github/research/continuous-optimization/source-candidates/**'
      - '.github/research/continuous-optimization/development-v3/bf-source-mapping-v1.json'
      - '.github/research/continuous-optimization/development-v3/ns-stage-lane-v1-closure.json'
      - '.github/research/continuous-optimization/stage_source_candidate_patch.py'
      - '.github/research/continuous-optimization/stage_source_candidate_evaluate.py'
      - '.github/workflows/research-stage-source-candidate-evaluation.yml'
      - '.github/program/maintenance_workflow_contract.py'
  workflow_dispatch:
    inputs:
      candidate:
        description: 'Frozen source candidate to evaluate'
        required: true
        type: choice
        default: all
        options: [all, vad, agc]

permissions:
  contents: read

concurrency:
  group: research-stage-source-candidate-${{ github.ref }}-${{ inputs.candidate || 'contract' }}
  cancel-in-progress: true

env:
  SOURCE_BASE_SHA: 2d0010fb284ac2dd89aa53e6cabd3efb0ca6db4e
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Validate source candidate contracts
        run: |
          set -euo pipefail
          python3 -m py_compile             .github/research/continuous-optimization/stage_source_candidate_patch.py             .github/research/continuous-optimization/stage_source_candidate_evaluate.py
          python3 .github/research/continuous-optimization/stage_source_candidate_patch.py --self-test
          python3 .github/research/continuous-optimization/stage_source_candidate_evaluate.py --self-test
          python3 .github/program/maintenance_workflow_contract.py --self-test --check
          python3 - <<'PY'
          import json
          from pathlib import Path
          run=json.loads(Path('.github/research/continuous-optimization/stage-lanes-v1-run-1.json').read_text())
          assert run['run_id']==35320921792
          assert run['source_sha']=='2d0010fb284ac2dd89aa53e6cabd3efb0ca6db4e'
          assert run['status']=='SUCCESS'
          assert run['composition']['executable_ready'] is False
          assert run['artifacts']['bf']['digest']=='sha256:c6a4c881d038813a38f99e7aceb97884459bab3f2d2e74678f6792ff9c8588f8'
          assert run['artifacts']['ns']['digest']=='sha256:f5c1d6f8347891917852f390a008387a5f0a37211e709a2e3383df48ac17296f'
          assert run['artifacts']['vad']['digest']=='sha256:204412606029f14d240cdcb404e6ff2355080927befcac68279d7e5de0a583ba'
          assert run['artifacts']['agc']['digest']=='sha256:b156565c2396a26b2d0060e864e114b7cbd0c1ff14f6f87971c16884cafec84b'

          vad=json.loads(Path('.github/research/continuous-optimization/source-candidates/vad-confidence-tiered-hold-v1.json').read_text())
          assert vad['authority']=='SOURCE_CANDIDATE_EVALUATION_ONLY'
          assert vad['candidate_budget']==1 and vad['confirmation_limit']==0
          assert vad['source_base_sha']==run['source_sha']
          assert vad['exact_source_change']['keep_thresholds']=={'local':0.45,'ns_assisted':0.35,'strong':0.50}
          assert vad['exact_source_change']['add_very_strong_threshold']==0.70
          assert vad['exact_source_change']['add_very_strong_hold_frames']==10
          assert vad['fresh_candidate_evaluation']['seeds']==[4751,5751,6751]
          assert vad['promotion']['automatic_main_mutation'] is False
          assert vad['promotion']['shipping'] is False

          agc=json.loads(Path('.github/research/continuous-optimization/source-candidates/agc-error-adaptive-release-v1.json').read_text())
          assert agc['authority']=='SOURCE_CANDIDATE_EVALUATION_ONLY'
          assert agc['candidate_budget']==1 and agc['confirmation_limit']==0
          assert agc['source_base_sha']==run['source_sha']
          exact=agc['exact_source_change']
          assert exact['attack_alpha']==0.25
          assert exact['normal_release_alpha']==0.015
          assert exact['fast_release_error_db']==3.0
          assert exact['fast_release_alpha']==0.05
          assert exact['max_gain_linear']==8.0
          assert exact['target_dbfs']==-20.0 and exact['limiter_dbfs']==-2.0
          assert agc['fresh_candidate_evaluation']['seeds']==[4761,5761,6761]
          assert agc['promotion']['automatic_main_mutation'] is False
          assert agc['promotion']['shipping'] is False

          bf=json.loads(Path('.github/research/continuous-optimization/development-v3/bf-source-mapping-v1.json').read_text())
          assert bf['authority']=='DIAGNOSTIC_ONLY' and bf['candidate_budget']==0
          assert bf['next_decision'].startswith('source-mapping diagnostic only')

          ns=json.loads(Path('.github/research/continuous-optimization/development-v3/ns-stage-lane-v1-closure.json').read_text())
          assert ns['status']=='CLOSED_KEEP_BASELINE_AFTER_REJECT'
          assert ns['candidate_budget']==0
          assert ns['evidence']['effective_winner']=={'algorithm':'ema','ns_floor':0.12}

          aec=json.loads(Path('.github/research/continuous-optimization/development-v3/aec-boundary-refinement-v6-closure.json').read_text())
          assert aec['status']=='CLOSED_TERMINAL_VISIBLE_REJECT' and aec['candidate_budget']==0
          matched=json.loads(Path('.github/research/continuous-optimization/development-v3/matched-gain-chain-factor-plan-resolution-v1.json').read_text())
          assert matched['candidate_budget']==0
          assert matched['state']['hardware_execution_authorized'] is False
          print('stage source candidate contract: PASS')
          PY

  vad:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && (inputs.candidate == 'vad' || inputs.candidate == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ccache
        with: {namespace: research-source-vad}
      - name: Materialize exact baseline and candidate worktrees
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_BASE_SHA^{commit}"
          git worktree add --detach /tmp/vad-source-base "$SOURCE_BASE_SHA"
          git worktree add --detach /tmp/vad-source-candidate "$SOURCE_BASE_SHA"
          python3 .github/research/continuous-optimization/stage_source_candidate_patch.py             --root /tmp/vad-source-candidate --candidate vad
          git -C /tmp/vad-source-base diff --exit-code
          test -n "$(git -C /tmp/vad-source-candidate diff -- src/enhance/ap_vad.c)"
          test -z "$(git -C /tmp/vad-source-candidate diff --name-only | grep -v '^src/enhance/ap_vad.c$' || true)"
      - name: Build exact base and frozen VAD candidate
        run: |
          set -euo pipefail
          cmake -S /tmp/vad-source-base -B /tmp/vad-build-base -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build /tmp/vad-build-base --target ap_process_pcm --parallel
          cmake -S /tmp/vad-source-candidate -B /tmp/vad-build-candidate -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build /tmp/vad-build-candidate --target ap_process_pcm --parallel
      - name: Materialize predeclared fresh VAD candidate corpora
        run: |
          set -euo pipefail
          for seed in 4751 5751 6751; do
            (cd /tmp/vad-source-base && PYTHONPATH=validation/tools               python3 validation/tools/build_stage_validation_corpus.py                 --output "/tmp/vad-source-$seed" --seed "$seed" --seconds 4)
          done
      - name: Evaluate exact VAD source candidate
        run: |
          python3 .github/research/continuous-optimization/stage_source_candidate_evaluate.py             --candidate vad             --base-processor /tmp/vad-build-base/ap_process_pcm             --candidate-processor /tmp/vad-build-candidate/ap_process_pcm             --corpus /tmp/vad-source-4751/corpus.json             --corpus /tmp/vad-source-5751/corpus.json             --corpus /tmp/vad-source-6751/corpus.json             --output stage-source-candidate-out/vad/result.json
      - name: Enforce VAD source-candidate authority
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage-source-candidate-out/vad/result.json').read_text())
          assert r['authority']=='source-candidate-evaluation-only'
          assert r['candidate_id']=='vad-confidence-tiered-hold-v1'
          assert r['shipping_authority'] is False
          assert r['automatic_main_mutation'] is False
          assert r['independent_confirmation_required_after_pass'] is True
          assert r['fresh_seeds']==[4751,5751,6751]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stage-source-candidate-vad-${{ github.run_id }}
          path: stage-source-candidate-out/vad/
          retention-days: 30
          if-no-files-found: warn

  agc:
    needs: contract
    if: github.event_name == 'workflow_dispatch' && (inputs.candidate == 'agc' || inputs.candidate == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-ccache
        with: {namespace: research-source-agc}
      - name: Materialize exact baseline and candidate worktrees
        run: |
          set -euo pipefail
          git cat-file -e "$SOURCE_BASE_SHA^{commit}"
          git worktree add --detach /tmp/agc-source-base "$SOURCE_BASE_SHA"
          git worktree add --detach /tmp/agc-source-candidate "$SOURCE_BASE_SHA"
          python3 .github/research/continuous-optimization/stage_source_candidate_patch.py             --root /tmp/agc-source-candidate --candidate agc
          git -C /tmp/agc-source-base diff --exit-code
          test -n "$(git -C /tmp/agc-source-candidate diff -- src/enhance/ap_agc.c)"
          test -z "$(git -C /tmp/agc-source-candidate diff --name-only | grep -v '^src/enhance/ap_agc.c$' || true)"
      - name: Build exact base and frozen AGC candidate probes
        run: |
          set -euo pipefail
          cmake -S /tmp/agc-source-base -B /tmp/agc-build-base -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build /tmp/agc-build-base --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -I/tmp/agc-source-base/include -I/tmp/agc-build-base/generated             /tmp/agc-source-base/tests/validation/agc_dynamics_probe.c             /tmp/agc-build-base/libaudio_pipeline.a -lm             -o /tmp/agc-build-base/agc_dynamics_probe

          cmake -S /tmp/agc-source-candidate -B /tmp/agc-build-candidate -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build /tmp/agc-build-candidate --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror             -I/tmp/agc-source-candidate/include -I/tmp/agc-build-candidate/generated             /tmp/agc-source-candidate/tests/validation/agc_dynamics_probe.c             /tmp/agc-build-candidate/libaudio_pipeline.a -lm             -o /tmp/agc-build-candidate/agc_dynamics_probe
      - name: Materialize predeclared fresh AGC candidate corpora
        run: |
          set -euo pipefail
          for seed in 4761 5761 6761; do
            (cd /tmp/agc-source-base && PYTHONPATH=validation/tools:tests/validation               python3 tests/validation/build_agc_bf_validation_corpus.py                 --output "/tmp/agc-source-$seed" --seed "$seed")
          done
      - name: Evaluate exact AGC source candidate
        run: |
          python3 .github/research/continuous-optimization/stage_source_candidate_evaluate.py             --candidate agc             --base-probe /tmp/agc-build-base/agc_dynamics_probe             --candidate-probe /tmp/agc-build-candidate/agc_dynamics_probe             --corpus /tmp/agc-source-4761/corpus.json             --corpus /tmp/agc-source-5761/corpus.json             --corpus /tmp/agc-source-6761/corpus.json             --output stage-source-candidate-out/agc/result.json
      - name: Enforce AGC source-candidate authority
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('stage-source-candidate-out/agc/result.json').read_text())
          assert r['authority']=='source-candidate-evaluation-only'
          assert r['candidate_id']=='agc-error-adaptive-release-v1'
          assert r['shipping_authority'] is False
          assert r['automatic_main_mutation'] is False
          assert r['independent_confirmation_required_after_pass'] is True
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stage-source-candidate-agc-${{ github.run_id }}
          path: stage-source-candidate-out/agc/
          retention-days: 30
          if-no-files-found: warn
