name: I006 AGC Max-Gain Candidate

on:
  pull_request:
    paths:
      - 'src/enhance/ap_agc.c'
      - 'tests/validation/i006_agc_max_gain_candidate.py'
      - '.github/workflows/i006-agc-max-gain-candidate.yml'

permissions:
  contents: read

concurrency:
  group: i006-agc-max-gain-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASE_SHA: 945344a29a826bbf5330baf3382cb3e34c8f4160
      PYTHONPATH: tests/validation:validation/tools
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate single pre-registered candidate contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i006_agc_max_gain_candidate.py
          python3 tests/validation/i006_agc_max_gain_candidate.py --self-test
          python3 -m json.tool docs/program/iterations/I006-max-gain-candidate-search.json >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('docs/program/iterations/I006-max-gain-candidate-search.json').read_text())
          assert c['schema_version'] == 1 and c['iteration_id'] == 'I006'
          assert c['phase'] == 'bounded-source-candidate-search'
          assert c['root_cause_id'] == 'noise-floor-max-gain-cap'
          assert c['base_sha'] == '945344a29a826bbf5330baf3382cb3e34c8f4160'
          assert c['candidate_limit'] == 1 and c['confirmation_limit'] == 0
          assert c['promotion_allowed'] is False
          assert len(c['candidate_variants']) == 1
          v = c['candidate_variants'][0]
          assert v['name'] == 'max-gain-cap-15db'
          assert v['candidate_max_gain_db'] == 15.0
          assert abs(v['candidate_max_gain_linear'] - 5.623413251903491) < 1e-12
          assert c['authority']['may_apply_exact_pre_registered_candidate'] is True
          for key in (
              'may_edit_checked_out_source', 'may_add_candidate', 'may_change_candidate_value',
              'may_tune_agc_target', 'may_tune_limiter', 'may_tune_attack_release',
              'may_tune_activity_thresholds', 'may_consume_confirmation', 'may_promote_release'):
              assert c['authority'][key] is False, key
          assert c['constraints']['same_exposed_development_data_is_not_confirmation'] is True
          assert c['constraints']['double_talk_gap_is_handed_to_I009'] is True
          assert c['constraints']['candidate_pass_requires_later_fresh_independent_confirmation'] is True
          assert c['constraints']['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY

      - name: Enforce exact candidate-only PR delta
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$PR_BASE_SHA"...HEAD)"
          printf '%s\n' "$changed"
          expected='^.github/workflows/i006-agc-max-gain-candidate\.yml$|^src/enhance/ap_agc\.c$|^tests/validation/i006_agc_max_gain_candidate\.py$'
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$expected" || true)"
          test -z "$unexpected"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          for path in \
            .github/workflows/i006-agc-max-gain-candidate.yml \
            src/enhance/ap_agc.c \
            tests/validation/i006_agc_max_gain_candidate.py; do
            printf '%s\n' "$changed" | grep -Fx "$path"
          done
          base_agc="$(git show "$BASE_SHA":src/enhance/ap_agc.c)"
          candidate_agc="$(cat src/enhance/ap_agc.c)"
          BASE_AGC="$base_agc" CANDIDATE_AGC="$candidate_agc" python3 - <<'PY'
          import os
          base = os.environ['BASE_AGC']
          cand = os.environ['CANDIDATE_AGC']
          old = '0.25f, 8.0f'
          new = '0.25f, 5.623413f'
          assert base.count(old) == 1
          assert cand == base.replace(old, new, 1)
          PY

      - name: Prepare immutable shipping-base worktree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf exact-base
          git worktree add --detach exact-base "$BASE_SHA"
          test "$(git -C exact-base rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Execute exact-base versus exact-candidate replay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf i006-max-gain-evidence
          PYTHONPATH=tests/validation:validation/tools \
          python3 tests/validation/i006_agc_max_gain_candidate.py \
            --contract docs/program/iterations/I006-max-gain-candidate-search.json \
            --baseline-contract docs/program/iterations/I006-baseline.json \
            --base-root exact-base \
            --output i006-max-gain-evidence \
            | tee i006-max-gain-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('i006-max-gain-evidence/candidate-result.json').read_text())
          assert r['schema_version'] == 1 and r['iteration_id'] == 'I006'
          assert r['phase'] == 'bounded-source-candidate-search'
          assert r['root_cause_id'] == 'noise-floor-max-gain-cap'
          assert r['base_sha'] == '945344a29a826bbf5330baf3382cb3e34c8f4160'
          assert r['candidate_limit'] == 1 and r['candidate_limit_consumed'] == 1
          assert r['confirmation_limit'] == 0 and r['confirmation_limit_consumed'] == 0
          assert r['promotion_allowed'] is False
          assert r['candidate'] == 'max-gain-cap-15db'
          assert len(r['cases']) == 18
          assert r['aggregate']['shipping_base_noise_floor_gain_failures'] == 6
          assert r['aggregate']['activity_drift_cases'] == 0
          assert r['decision'] in ('ELIGIBLE_FOR_FRESH_CONFIRMATION', 'KEEP_BASELINE_CANDIDATE_REJECTED')
          assert r['product_qualification'] == 'DEFERRED_BY_SCOPE'
          PY

      - name: Freeze replay evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out=i006-max-gain-evidence
          if test -d "$out"; then
            cp docs/program/iterations/I006-max-gain-candidate-search.json "$out/contract.json"
            cp docs/program/iterations/I006-baseline.json "$out/baseline-contract.json"
            cp tests/validation/i006_agc_max_gain_candidate.py "$out/evaluator.py"
            cp src/enhance/ap_agc.c "$out/candidate-ap_agc.c"
            git show "$BASE_SHA":src/enhance/ap_agc.c > "$out/base-ap_agc.c"
            printf '%s\n' "$BASE_SHA" > "$out/base-sha.txt"
            git rev-parse HEAD > "$out/candidate-head.txt"
            if test -f i006-max-gain-summary.json; then
              cp i006-max-gain-summary.json "$out/execution-summary.json"
            fi
            find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
              xargs -0 sha256sum > "$out/SHA256SUMS"
          fi

      - name: Publish candidate decision
        if: always()
        shell: bash
        run: |
          result='i006-max-gain-evidence/candidate-result.json'
          if test -f "$result"; then
            RESULT="$result" python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['RESULT']).read_text())
          print('## I006 single max-gain candidate')
          print(f"- Decision: `{r['decision']}`")
          print(f"- Shipping base: `{r['base_sha']}`")
          print(f"- Candidate head: `{r['candidate_head_sha']}`")
          print(f"- Base noise-floor gain failures reproduced: `{r['aggregate']['shipping_base_noise_floor_gain_failures']}/6`")
          print(f"- Candidate noise-floor gain passes: `{r['aggregate']['candidate_noise_floor_gain_passes']}/6`")
          print(f"- Candidate gate failures: `{r['aggregate']['candidate_gate_failures']}`")
          print(f"- Activity drift cases: `{r['aggregate']['activity_drift_cases']}`")
          print('- Candidate/confirmation consumed: `1/0`.')
          print('- Passing is not promotion authority; fresh independent confirmation remains mandatory.')
          print('- Product qualification: `DEFERRED_BY_SCOPE`.')
          PY
          fi

      - name: Upload I006 candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i006-agc-max-gain-${{ github.run_id }}
          path: i006-max-gain-evidence/
          retention-days: 90
          if-no-files-found: error
