name: Research Pure-Far Activity Ratio V1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json'
      - '.github/research/continuous-optimization/pure_far_activity_ratio_probe.c'
      - '.github/research/continuous-optimization/pure_far_activity_ratio_v1.py'
      - '.github/workflows/research-pure-far-activity-ratio-v1.yml'
  push:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json'
      - '.github/research/continuous-optimization/pure_far_activity_ratio_probe.c'
      - '.github/research/continuous-optimization/pure_far_activity_ratio_v1.py'
      - '.github/workflows/research-pure-far-activity-ratio-v1.yml'

permissions:
  contents: read

concurrency:
  group: research-pure-far-activity-ratio-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Bind diagnostic to exact source and research-only scope
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json'
          ).read_text())
          base = manifest['governance_base_sha']
          subprocess.run(['git', 'merge-base', '--is-ancestor', base, 'HEAD'], check=True)
          changed = subprocess.check_output(['git', 'diff', '--name-only', f'{base}...HEAD'], text=True).splitlines()
          allowed = {
              '.github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json',
              '.github/research/continuous-optimization/pure_far_activity_ratio_probe.c',
              '.github/research/continuous-optimization/pure_far_activity_ratio_v1.py',
              '.github/workflows/research-pure-far-activity-ratio-v1.yml',
          }
          assert changed and set(changed) <= allowed, changed
          print({'base': base, 'head': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                 'changed': changed})
          PY

      - name: Validate candidate-zero authority and closed predecessor
        run: |
          set -euo pipefail
          python3 -m py_compile .github/research/continuous-optimization/pure_far_activity_ratio_v1.py
          python3 .github/research/continuous-optimization/pure_far_activity_ratio_v1.py --self-test
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          manifest = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json'
          ).read_text())
          predecessor = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/same-guid-farend-doubletalk-paired-v1.json'
          ).read_text())
          closure = json.loads(Path(
              '.github/research/continuous-optimization/development-v3/doubletalk-onset-admission-v1-closure.json'
          ).read_text())
          assert manifest['status'] == 'DIAGNOSTIC_ONLY'
          assert manifest['candidate_budget'] == 0
          assert manifest['governance_base_sha'] == '5b86b180db6993a3bc501d939c78c5d29f2e8593'
          pred = manifest['predecessor']
          assert pred['investigation_id'] == 'same-guid-farend-doubletalk-paired-v1'
          assert pred['pr'] == 233
          assert pred['fresh_main_sha'] == '5b86b180db6993a3bc501d939c78c5d29f2e8593'
          assert pred['diagnostic_run_id'] == 35104265996 and pred['diagnostic_run_number'] == 2
          assert pred['diagnostic_artifact_id'] == 10449498176
          assert pred['diagnostic_artifact_digest'] == 'sha256:253450eaa914ebec82e681f20feaab897fe30edc144fbd7d6bb8b0e7694f7588'
          assert pred['hosted_real_aec_run_id'] == 35104265788 and pred['hosted_real_aec_run_number'] == 769
          assert pred['hosted_real_audio_run_id'] == 35104265907 and pred['hosted_real_audio_run_number'] == 774
          assert pred['verify_run_id'] == 35104266262 and pred['verify_run_number'] == 975
          assert pred['release_run_id'] == 35104752163 and pred['release_run_number'] == 960
          assert pred['fresh_main_closed'] is True
          assert predecessor['status'] == 'DIAGNOSTIC_ONLY' and predecessor['candidate_budget'] == 0
          assert closure['status'] == 'CLOSED_KEEP_BASELINE'
          assert closure['candidate']['budget_remaining'] == 0
          assert closure['shipping'] == {
              'version': 'v2.3.16',
              'commit_sha': '57e4c64adc1cf06819e46e24e275ecd746d5f17f',
              'changed_by_candidate': False,
          }
          lock = manifest['baseline_code_lock']
          for key in ('activity_source', 'pipeline_source', 'processor_source'):
              actual = subprocess.check_output(['git', 'rev-parse', f"HEAD:{lock[key]['path']}"], text=True).strip()
              assert actual == lock[key]['blob_sha'], (key, actual, lock[key]['blob_sha'])
          activity = Path('src/activity/ap_activity.c').read_text()
          pipeline = Path('src/core/ap_pipeline.c').read_text()
          processor = Path('examples/process_pcm.c').read_text()
          for text in (
              'const float alpha = value > old_value ? 0.35f : 0.08f;',
              'smoothed_ratio > s->double_talk_ratio',
              'instant_ratio > 0.90f * s->double_talk_ratio',
              'instant_ratio > 0.72f * s->double_talk_ratio',
          ):
              assert text in activity, text
          for text in (
              '#define AP_ACTIVITY_FAR_THRESHOLD 1.0e-7f',
              '#define AP_ACTIVITY_DT_RATIO 1.5f',
              '#define AP_ACTIVITY_HANGOVER 3u',
          ):
              assert text in pipeline, text
          assert 'ap_config_t cfg = ap_config_default(AP_PROFILE_CALL);' in processor
          assert 'if (channels == 1u) cfg.stages &= ~AP_STAGE_BF;' in processor
          assert manifest['observation_method']['selection_threshold'] is None
          assert manifest['output_authority'] == {
              'research_diagnostic_only': True,
              'candidate_selection': False,
              'tuning': False,
              'automatic_main_mutation': False,
              'shipping': False,
              'hil': False,
              'product_certification': False,
          }
          print('pure-far Activity ratio candidate-zero authority/code lock: PASS')
          PY

      - name: Build unchanged baseline and read-only internal probe
        run: |
          set -euo pipefail
          cmake -S . -B build-pure-far-activity-ratio \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DAP_BUILD_BENCH=OFF \
            -DAP_STRICT_WARNINGS=ON
          cmake --build build-pure-far-activity-ratio --target audio_pipeline ap_build_info_dump --parallel
          flags=build-pure-far-activity-ratio/CMakeFiles/audio_pipeline.dir/flags.make
          test -f "$flags"
          defs=$(sed -n 's/^C_DEFINES = //p' "$flags")
          incs=$(sed -n 's/^C_INCLUDES = //p' "$flags")
          echo "$defs" | grep -q -- '-DAP_BUILD_ACTIVITY=1'
          echo "$defs" | grep -q -- '-DAP_BUILD_STAGE_SYNC=1'
          echo "$defs" | grep -q -- '-DAP_BUILD_STAGE_AEC=1'
          compiler=$(sed -n 's/^CMAKE_C_COMPILER:FILEPATH=//p' build-pure-far-activity-ratio/CMakeCache.txt)
          if [ -z "$compiler" ]; then compiler=cc; fi
          # Intentional word splitting: these are CMake-generated compiler flags.
          "$compiler" $defs $incs \
            -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror \
            .github/research/continuous-optimization/pure_far_activity_ratio_probe.c \
            build-pure-far-activity-ratio/libaudio_pipeline.a -lm \
            -o build-pure-far-activity-ratio/pure_far_activity_ratio_probe
          mkdir -p pure-far-activity-ratio-v1-out/evidence
          build-pure-far-activity-ratio/ap_build_info_dump > pure-far-activity-ratio-v1-out/build-info.txt
          sha256sum build-pure-far-activity-ratio/libaudio_pipeline.a \
                    build-pure-far-activity-ratio/pure_far_activity_ratio_probe \
            > pure-far-activity-ratio-v1-out/binaries.sha256

      - name: Materialize exact hash-bound pure-far microset
        run: |
          set -euo pipefail
          rm -rf /tmp/audio-pipeline-aec-challenge-pure-far-ratio
          export GIT_LFS_SKIP_SMUDGE=1
          git clone --filter=blob:none --no-checkout \
            https://github.com/microsoft/AEC-Challenge.git \
            /tmp/audio-pipeline-aec-challenge-pure-far-ratio
          cd /tmp/audio-pipeline-aec-challenge-pure-far-ratio
          git -c advice.detachedHead=false checkout --detach 6c633d0a9d2a143a0e364899b91b06f127315b18
          test "$(git rev-parse HEAD)" = "6c633d0a9d2a143a0e364899b91b06f127315b18"
          test "$(git rev-parse HEAD:AECMOS/aecmos.py)" = "7423983e6da8515ec81b58a4e905c4b7bcd6fdff"
          python3 - "$GITHUB_WORKSPACE/.github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          manifest = json.load(open(sys.argv[1]))
          source = Path('AECMOS/aecmos.py').read_text(encoding='utf-8')
          assert "rating_fest_length = int(len(enh_sig) / 2)" in source
          assert "lpb_sig = lpb_sig[-rating_fest_length:]" in source
          assert "mic_sig = mic_sig[-rating_fest_length:]" in source
          for case in manifest['selection']['cases']:
              assert case['scenario'] == 'farend_singletalk'
              for role in ('lpb', 'mic'):
                  meta = case[role]
                  pointer = subprocess.check_output(['git', 'show', f"HEAD:{meta['path']}"], text=True)
                  lines = dict(line.split(' ', 1) for line in pointer.splitlines() if ' ' in line)
                  assert lines['oid'] == 'sha256:' + meta['sha256'], (meta['path'], lines)
                  assert int(lines['size']) == int(meta['size']), (meta['path'], lines)
          print({'lfs_pointer_lock': 'PASS', 'cases': [c['case_id'] for c in manifest['selection']['cases']]})
          PY
          include=$(python3 - "$GITHUB_WORKSPACE/.github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json" <<'PY'
          import json, sys
          manifest = json.load(open(sys.argv[1]))
          print(','.join(case[role]['path'] for case in manifest['selection']['cases'] for role in ('lpb', 'mic')))
          PY
          )
          unset GIT_LFS_SKIP_SMUDGE
          git lfs pull --include="$include" --exclude=""

      - name: Run pure-far Activity ratio diagnostic
        run: |
          set -euo pipefail
          python3 .github/research/continuous-optimization/pure_far_activity_ratio_v1.py \
            --probe build-pure-far-activity-ratio/pure_far_activity_ratio_probe \
            --manifest .github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json \
            --source-root /tmp/audio-pipeline-aec-challenge-pure-far-ratio \
            --output pure-far-activity-ratio-v1-out/evidence

      - name: Enforce evidence shape without deriving a boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          result = json.loads(Path(
              'pure-far-activity-ratio-v1-out/evidence/pure-far-activity-ratio-result.json'
          ).read_text())
          assert result['status'] == 'DIAGNOSTIC_ONLY'
          assert result['authority'] == 'research-diagnostic-only'
          assert result['candidate_budget'] == 0
          assert result['selection_performed'] is False
          assert result['threshold_search_performed'] is False
          assert result['tuning_performed'] is False
          assert result['existing_thresholds_are_observation_labels_only'] is True
          assert result['source_revision'] == '6c633d0a9d2a143a0e364899b91b06f127315b18'
          assert [case['case_id'] for case in result['cases']] == ['49II-farend', '7GT-farend']
          for case in result['cases']:
              metrics = case['metrics']
              for key in (
                  'far_end_fraction', 'double_talk_fraction', 'dt_on_evidence_fraction',
                  'dt_hold_evidence_fraction', 'aec_converged_fraction'
              ):
                  assert 0.0 <= metrics[key] <= 1.0, (case['case_id'], key, metrics[key])
              assert metrics['double_talk_given_far_fraction'] is None or 0.0 <= metrics['double_talk_given_far_fraction'] <= 1.0
              assert metrics['double_talk_hangover_max'] <= 3
              assert metrics['far_end_hangover_max'] <= 2
              # Reconstruction is independently cross-checked. Relative error can
              # spike near numerical zero, so require finite values here and keep
              # the exact maxima as descriptive evidence instead of tuning a bound.
              assert math.isfinite(metrics['mic_recovery_relative_error_max'])
              assert math.isfinite(metrics['reference_recovery_relative_error_max'])
          summary = Path('pure-far-activity-ratio-v1-out/summary.md')
          with summary.open('w', encoding='utf-8') as fh:
              fh.write('## Pure-far Activity ratio diagnostic v1\n\n')
              fh.write('- Authority: `research-diagnostic-only`\n')
              fh.write('- Candidate budget: `0`\n')
              fh.write('- Threshold search: `false`\n')
              fh.write('- Public API/DSP mutation: `false`\n')
              for case in result['cases']:
                  m = case['metrics']
                  fh.write(f"\n### {case['case_id']}\n")
                  for key in (
                      'far_end_fraction', 'double_talk_fraction', 'double_talk_given_far_fraction',
                      'dt_on_given_far_fraction', 'dt_hold_given_far_fraction',
                      'double_talk_current_dt_on_fraction', 'double_talk_current_dt_hold_fraction',
                      'double_talk_hangover_only_fraction', 'double_talk_active_run_count',
                      'double_talk_longest_active_run_ms', 'aec_converged_fraction',
                      'mic_recovery_relative_error_max', 'reference_recovery_relative_error_max'
                  ):
                      fh.write(f'- {key}: `{m[key]}`\n')
                  for group in ('far_frames_ratio', 'double_talk_frames_ratio', 'far_non_double_talk_frames_ratio'):
                      fh.write(f'- {group}: `{json.dumps(m[group], sort_keys=True)}`\n')
              fh.write('\n### descriptive_7GT_minus_49II\n')
              for key, value in sorted(result['descriptive_delta'].items()):
                  fh.write(f'- {key}: `{value}`\n')
          print(json.dumps(result['descriptive_delta'], indent=2, sort_keys=True))
          PY
          cat pure-far-activity-ratio-v1-out/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Seal research diagnostic evidence
        run: |
          set -euo pipefail
          cp .github/research/continuous-optimization/development-v3/pure-far-activity-ratio-v1.json \
            pure-far-activity-ratio-v1-out/manifest.json
          git rev-parse HEAD > pure-far-activity-ratio-v1-out/source-sha.txt
          {
            git rev-parse HEAD:src/activity/ap_activity.c
            git rev-parse HEAD:src/core/ap_pipeline.c
            git rev-parse HEAD:examples/process_pcm.c
          } > pure-far-activity-ratio-v1-out/baseline-code-blobs.txt
          (
            cd /tmp/audio-pipeline-aec-challenge-pure-far-ratio
            git rev-parse HEAD
            git rev-parse HEAD:AECMOS/aecmos.py
          ) > pure-far-activity-ratio-v1-out/upstream-source.txt
          find pure-far-activity-ratio-v1-out -type f ! -name SHA256SUMS -print0 | \
            sort -z | xargs -0 sha256sum > pure-far-activity-ratio-v1-out/SHA256SUMS

      - name: Upload research diagnostic evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pure-far-activity-ratio-v1-${{ github.run_id }}
          path: pure-far-activity-ratio-v1-out/
          if-no-files-found: error
          retention-days: 30
