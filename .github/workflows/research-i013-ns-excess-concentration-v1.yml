name: Research I013 NS Excess Concentration v1
run-name: "i013-excess-concentration-v1 / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i013-ns-excess-concentration-v1.json'
      - '.github/research/continuous-optimization/development-v4/i013-ns-excess-concentration-v1-result.json'
      - 'tests/validation/i013_ns_excess_concentration_probe.c'
      - 'tests/validation/i013_ns_excess_concentration.py'
      - '.github/workflows/research-i013-ns-excess-concentration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i013-ns-excess-concentration-v1.json
  RESULT: .github/research/continuous-optimization/development-v4/i013-ns-excess-concentration-v1-result.json
  PYTHONPATH: validation/tools:tests/validation

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Validate consumed I013 contract, tooling and reviewed result
        run: |
          set -euo pipefail
          python3 -m py_compile tests/validation/i013_ns_excess_concentration.py
          python3 tests/validation/i013_ns_excess_concentration.py --self-test
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m json.tool "$RESULT" >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i013-ns-excess-concentration-v1.json'
          ).read_text())
          result = json.loads(Path(
              '.github/research/continuous-optimization/development-v4/'
              'i013-ns-excess-concentration-v1-result.json'
          ).read_text())

          assert contract['investigation_id'] == 'i013-ns-excess-concentration-v1'
          assert contract['authority'] == 'RESEARCH_DIAGNOSTIC_ONLY'
          assert contract['source_base_sha'] == 'c65944d3b4a3671477fcb6450f4fec87632e6b23'
          assert contract['fresh_diagnostic_authority']['seeds'] == [221123, 231123, 241123]
          assert contract['budget'] == {
              'candidate_limit': 0,
              'confirmation_limit': 0,
              'diagnostic_execution_limit': 1,
          }
          assert contract['parameter_search_allowed'] is False
          assert contract['threshold_tuning_allowed'] is False
          assert contract['promotion_allowed'] is False
          assert contract['shipping_source_change_allowed'] is False
          assert all(value is False for value in contract['authority_boundary'].values())

          assert result['status'] == 'CLOSED_DIAGNOSTIC_ONLY'
          assert result['authority'] == contract['authority']
          assert result['source_base_sha'] == contract['source_base_sha']
          assert result['decision'] == (
              'NS_EXCESS_CONCENTRATION_INFORMATION_NOT_SUPPORTED_REVIEW_REQUIRED'
          )
          assert result['reviewed_decision'] == (
              'EXCESS_CONCENTRATION_NOT_SUPPORTED_KEEP_BASELINE'
          )
          execution = result['authoritative_execution']
          assert execution['workflow_run_id'] == 35962562558
          assert execution['artifact_id'] == 10793156629
          assert execution['artifact_digest'] == (
              'sha256:8e94b4ee1f287d5a310be18c5c0b1de0334f710e38af69a1e282f4cd8297d63c'
          )
          assert execution['internal_sha256s_verified'] == 9

          fresh = result['fresh_authority']
          assert fresh['seeds'] == [221123, 231123, 241123]
          assert fresh['diagnostic_execution_limit'] == 1
          assert fresh['diagnostic_execution_consumed'] == 1
          assert fresh['candidate_limit_consumed'] == 0
          assert fresh['confirmation_limit_consumed'] == 0
          assert fresh['parameter_search_performed'] is False
          assert fresh['threshold_tuning_performed'] is False
          assert fresh['feature_mapping_selected'] is False

          integrity = result['input_integrity']
          assert integrity['input_violations'] == 0
          assert integrity['max_floor_concentration_delta'] == 0.0
          assert integrity['max_floor_scalar_snr_delta_db'] == 0.0
          assert integrity['max_floor_speech_probability_delta'] == 0.0

          summary = result['summary']
          assert summary['combined_concentration_auc'] == 0.5490496039152254
          assert summary['combined_scalar_snr_auc'] == 0.6329608892206876
          assert summary['combined_nonstationary_concentration_auc'] == 0.5712919414375182
          assert summary['combined_nonstationary_scalar_snr_auc'] == 0.5778507735058687
          assert summary['combined_nonstationary_upstream_speech_probability_auc'] == 0.6315590394425781
          assert summary['combined_nonstationary_auc_gain_over_scalar_snr'] == -0.006558832068350506
          assert all(
              item['nonstationary_concentration_auc'] < 0.60
              for item in result['per_seed']
          )
          assert all(value is False for value in result['authority_boundary'].values())
          PY
          git cat-file -e "c65944d3b4a3671477fcb6450f4fec87632e6b23^{commit}"

      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i013-excess-concentration-contract

      - name: Compile retained test-only I013 probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i013-contract             -DCMAKE_BUILD_TYPE=Release             -DAP_BUILD_BENCH=OFF             -DAP_STRICT_WARNINGS=ON
          cmake --build build-i013-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i013-contract/generated             tests/validation/i013_ns_excess_concentration_probe.c             build-i013-contract/libaudio_pipeline.a -lm             -o build-i013-contract/i013_ns_excess_concentration_probe
