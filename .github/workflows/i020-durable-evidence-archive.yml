name: I020 Durable Evidence Archive

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/program/i020_durable_archive.py'
      - '.github/workflows/i020-durable-evidence-archive.yml'
      - 'tests/validation/test_i020_durable_archive.py'
      - '.github/research/continuous-optimization/development-v4/i020-blind-baseline-invalid-durable-evidence-v1.json'
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1-blind-review.json'
      - 'validation/research/evidence/i020-blind-baseline-invalid-36304120808-36324803945/**'
  push:
    branches: [main]
    paths:
      - '.github/program/i020_durable_archive.py'
      - '.github/workflows/i020-durable-evidence-archive.yml'
      - 'tests/validation/test_i020_durable_archive.py'
      - '.github/research/continuous-optimization/development-v4/i020-blind-baseline-invalid-durable-evidence-v1.json'
      - '.github/research/continuous-optimization/development-v4/i020-vad-weak-start-requires-blend-v1-blind-review.json'
      - 'validation/research/evidence/i020-blind-baseline-invalid-36304120808-36324803945/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: i020-durable-evidence-archive-trusted-main
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate frozen copy-only archive contract
        run: |
          set -euo pipefail
          python3 -m py_compile .github/program/i020_durable_archive.py
          python3 .github/program/i020_durable_archive.py --self-test
          python3 .github/program/i020_durable_archive.py --check
          python3 tests/validation/test_i020_durable_archive.py

  publish:
    needs: contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Reverify consumed artifacts and publish copy-only archive PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_WRITE_TOKEN: ${{ secrets.RESEARCH_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          python3 .github/program/i020_durable_archive.py             --publish             --output i020-durable-archive-out
      - name: Publish bounded status
        if: always()
        run: |
          if test -f i020-durable-archive-out/status.json; then
            cat i020-durable-archive-out/status.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve archive publication receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i020-durable-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: i020-durable-archive-out/
          retention-days: 90
          if-no-files-found: warn
