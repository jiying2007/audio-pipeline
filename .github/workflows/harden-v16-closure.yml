name: Harden v1.6 Closure

on:
  push:
    branches: [feat/product-assurance-v1.6.0]

permissions:
  contents: write

jobs:
  harden:
    if: github.repository == 'jiying2007/audio-pipeline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: feat/product-assurance-v1.6.0
          fetch-depth: 0
      - name: Harden closure contracts and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          cert = Path('.github/workflows/product-certification.yml')
          text = cert.read_text(encoding='utf-8')
          old = '''            -DCMAKE_C_COMPILER="$CC" -DCMAKE_SYSROOT="$SYSROOT" \\
            -DCMAKE_C_FLAGS="$CFLAGS" -DAP_BUILD_ALSA_EXAMPLE=ON \\
'''
          new = '''            -DCMAKE_C_COMPILER="$CC" -DCMAKE_SYSROOT="$SYSROOT" \\
            -DCMAKE_FIND_ROOT_PATH="$SYSROOT" \\
            -DCMAKE_FIND_ROOT_PATH_MODE_PROGRAM=NEVER \\
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \\
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY \\
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \\
            -DCMAKE_C_FLAGS="$CFLAGS" -DAP_BUILD_ALSA_EXAMPLE=ON \\
'''
          if new not in text:
              if old not in text:
                  raise SystemExit('product-certification CMake block not found')
              text = text.replace(old, new, 1)
              cert.write_text(text, encoding='utf-8')

          release = Path('.github/workflows/release.yml')
          text = release.read_text(encoding='utf-8')
          anchor = '''      - name: Require merged PR lineage for release SHA\n'''
          token_expr = '$' + '{{ secrets.REPOSITORY_GOVERNANCE_TOKEN }}'
          preflight = f'''      - name: Require live repository governance before release\n        env:\n          GH_TOKEN: {token_expr}\n        run: |\n          set -euo pipefail\n          test -n "$GH_TOKEN" || {{ echo "REPOSITORY_GOVERNANCE_TOKEN is required" >&2; exit 1; }}\n          python3 scripts/github_governance.py \\\n            --repository "$GITHUB_REPOSITORY" --output /tmp/repository-governance.json\n      - name: Require merged PR lineage for release SHA\n'''
          if 'Require live repository governance before release' not in text:
              if anchor not in text:
                  raise SystemExit('release lineage anchor not found')
              text = text.replace(anchor, preflight, 1)
              release.write_text(text, encoding='utf-8')

          schema_path = Path('certification/record.schema.json')
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          product_required = [
              'active_cpu_percent','p95_us','p99_us','deadline_misses','rss_kib',
              'xruns','overruns','input_full_events','output_drop_events'
          ]
          acoustic_required = [
              'corpus_revision','cases_total','cases_passed','far_end_erle_db',
              'aec_convergence_ms','double_talk_near_si_sdr_db',
              'noise_si_sdr_improvement_db','vad_f1','threshold_report'
          ]
          common_then = {
              'required': [
                  'policy','thermal_power','schema_version','policy_sha256',
                  'corpus_manifest_sha256','evidence_manifest_sha256',
                  'collector_version','toolchain_digest'
              ],
              'properties': {
                  'schema_version': {'enum': [2,3,4]},
                  'performance': {'required': product_required},
                  'acoustic': {'required': acoustic_required},
                  'thermal_power': {'required': ['ambient_c','max_soc_c','average_power_w']},
                  'soak': {
                      'required': ['hours','passed','xruns','deadline_misses','output_drop_events'],
                      'properties': {'hours': {'minimum': 8}, 'passed': {'const': True}},
                  },
                  'artifacts': {'required': ['result_json','benchmark_json','evidence_manifest','sha256']},
              },
          }
          v3plus_then = {
              'properties': {
                  'build': {'required': [
                      'source_revision','config_digest','compiler_id','compiler_version',
                      'target_triple','build_type','binary_sha256'
                  ]},
                  'soak': {'required': [
                      'xruns','deadline_misses','overruns','input_full_events',
                      'output_drop_events','failed_frames','p95_us','p99_us'
                  ]},
                  'artifacts': {'required': ['binary_sha256']},
              }
          }
          v4_then = {
              'required': ['deployment'],
              'properties': {
                  'deployment': {
                      'required': [
                          'source_revision','builder_runner','dut_runner','binary_sha256',
                          'toolchain','result'
                      ],
                      'properties': {'toolchain': {'required': [
                          'compiler_path','compiler_sha256','compiler_version',
                          'sysroot_path','sysroot_sha256','toolchain_root_path',
                          'toolchain_root_sha256','cflags'
                      ]}},
                  },
                  'artifacts': {'required': ['deployment_provenance','binary_sha256']},
              },
          }
          schema['allOf'] = [
              {
                  'if': {'properties': {'status': {'const': 'product-certified'}}, 'required': ['status']},
                  'then': common_then,
              },
              {
                  'if': {'properties': {'schema_version': {'enum': [3,4]}}, 'required': ['schema_version']},
                  'then': v3plus_then,
              },
              {
                  'if': {'properties': {'schema_version': {'const': 4}}, 'required': ['schema_version']},
                  'then': v4_then,
              },
          ]
          schema_path.write_text(json.dumps(schema, indent=2) + '\n', encoding='utf-8')
          PY
          python3 -m json.tool certification/record.schema.json >/dev/null
          python3 scripts/github_governance.py --self-test
          python3 certification/validate_record.py --self-test
          rm .github/workflows/harden-v16-closure.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/product-certification.yml .github/workflows/release.yml certification/record.schema.json .github/workflows/harden-v16-closure.yml
          git commit -m 'ci: harden shipping governance and cross-build isolation'
          git push origin HEAD:feat/product-assurance-v1.6.0
