name: Research I033 NS VAD Causal Noise Delta Alignment v1
run-name: "i033-causal-noise-delta / ${{ github.event_name }} / ${{ github.ref_name }}"

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/research/continuous-optimization/development-v4/i033-ns-vad-causal-noise-delta-alignment-v1.json'
      - 'tests/validation/i033_ns_vad_causal_noise_delta_probe.c'
      - 'tests/validation/i033_ns_vad_causal_noise_delta_alignment.py'
      - 'tests/validation/test_i033_one_shot_guard.py'
      - '.github/workflows/research-i033-ns-vad-causal-noise-delta-alignment-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-i033-causal-noise-delta-${{ github.ref }}
  cancel-in-progress: false

env:
  CONTRACT: .github/research/continuous-optimization/development-v4/i033-ns-vad-causal-noise-delta-alignment-v1.json
  DEV_ROOT: /tmp/audio-pipeline-i033-development-v3
  PYTHONPATH: validation/tools:tests/validation:.github/research/continuous-optimization/development-data-v3

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate I033 causal noise-delta contract
        run: |
          set -euo pipefail
          python3 -m json.tool "$CONTRACT" >/dev/null
          python3 -m py_compile tests/validation/i033_ns_vad_causal_noise_delta_alignment.py
          python3 tests/validation/i033_ns_vad_causal_noise_delta_alignment.py --self-test
          python3 tests/validation/test_i033_one_shot_guard.py
          python3 .github/research/continuous-optimization/development-data-v3/build_corpus.py --self-test
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py --self-test
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path

          path=Path('.github/research/continuous-optimization/development-v4/i033-ns-vad-causal-noise-delta-alignment-v1.json')
          c=json.loads(path.read_text())
          assert c['authority']=='CANDIDATE_ZERO_DIAGNOSTIC_ONLY'
          assert c['source_base_sha']=='57e4c64adc1cf06819e46e24e275ecd746d5f17f'

          a=c['fresh_diagnostic_authority']
          seeds=a['target_seeds']
          assert len(seeds)==6 and len(set(seeds))==6
          assert all(type(seed) is int and seed>0 for seed in seeds)
          assert a['diagnostic_execution_limit']==1
          assert a['candidate_limit']==0
          assert a['confirmation_limit']==0

          anchor=c['causal_anchor_semantics']
          assert anchor['require_at_least_one_prior_reference'] is True
          assert anchor['anchor_and_target_are_causal'] is True
          assert anchor['same_anchor_for_ns_and_local_deltas'] is True
          assert anchor['may_use_future_frames_for_anchor_or_target'] is False

          benchmark=c['retrospective_benchmark_semantics']
          assert benchmark['reference_frames']==8
          assert benchmark['strictly_post_target'] is True
          assert 'retrospective' in benchmark['role']

          h=c['delta_alignment_hypothesis']
          assert h['maximum_median_absolute_delta_error_db']==3.0
          assert h['maximum_p90_absolute_delta_error_db']==6.0
          assert h['percentile_definition']=='nearest-rank'

          g=c['diagnostic_gates']
          assert g['expected_target_cases']==252
          assert g['minimum_causal_target_cases']==100
          assert g['minimum_causal_anchor_cases']==35
          assert g['minimum_causal_anchor_coverage']==0.25
          assert g['minimum_post_target_benchmark_coverage']==0.80

          assert all(value is False for value in c['authority_boundary'].values())

          predecessor=Path(c['predecessor']['i032_closure'])
          prior=json.loads(predecessor.read_text())
          assert prior['status']==c['predecessor']['required_status']
          assert prior['decision']==c['predecessor']['required_decision']
          assert prior['reviewed_decision']==c['predecessor']['required_reviewed_decision']
          assert prior['proposed_followup_hypothesis']['id']==c['predecessor']['required_followup_id']
          assert prior['proposed_followup_hypothesis']['authority']==c['predecessor']['required_followup_authority']

          def blob(p):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+str(p)],text=True).strip()

          assert blob(predecessor)==c['predecessor']['i032_closure_blob_sha']
          assert blob(Path(c['dataset_authority']['lock_path']))==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(Path(c['dataset_authority']['builder_path']))==c['dataset_authority']['builder_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['probe_path']))==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(Path(c['diagnostic_inputs']['evaluator_path']))==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']

          probe=Path(c['diagnostic_inputs']['probe_path']).read_text()
          assert 'ns_noise_rms_dbfs' in probe
          assert 'post_ns_rms_dbfs' in probe
          assert '(double)ns_result.noise_rms_dbfs' in probe
          assert 'frame_rms_dbfs(ns_output, FRAME)' in probe
          assert 'ap_ns_process(&ns_state' in probe

          for seed in seeds:
              pattern=rf'(^|[^0-9]){seed}([^0-9]|$)'
              result=subprocess.run(
                  ['git','grep','-n','-E',pattern,'--','.github','tests','validation','docs'],
                  stdout=subprocess.PIPE,text=True,check=False)
              assert result.returncode in (0,1)
              matches=[
                  line for line in result.stdout.splitlines()
                  if line and line.split(':',1)[0] != str(path)
              ]
              assert not matches, (
                  f'I033 seed is not fresh: {seed}\n'+'\n'.join(matches))
          PY
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i033-causal-noise-delta-contract
      - name: Compile I033 causal noise-delta probe with strict warnings
        run: |
          set -euo pipefail
          cmake -S . -B build-i033-contract             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i033-contract --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i033-contract/generated             tests/validation/i033_ns_vad_causal_noise_delta_probe.c             build-i033-contract/libaudio_pipeline.a -lm             -o build-i033-contract/i033-probe

  diagnose:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce one-shot I033 diagnostic execution
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: research-i033-ns-vad-causal-noise-delta-alignment-v1.yml
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess

          repo=os.environ['GITHUB_REPOSITORY']
          current=int(os.environ['GITHUB_RUN_ID'])
          attempt=int(os.environ['GITHUB_RUN_ATTEMPT'])
          if os.environ.get('GITHUB_REF')!='refs/heads/main' or attempt!=1:
              raise SystemExit('I033 diagnostic requires first-attempt trusted main dispatch')

          def pages(endpoint):
              raw=subprocess.check_output(
                  ['gh','api','--paginate','--slurp',endpoint],text=True)
              value=json.loads(raw)
              if not isinstance(value,list):
                  raise SystemExit('unexpected GitHub API pagination shape')
              return value

          run_pages=pages(
              f'repos/{repo}/actions/workflows/{os.environ["WORKFLOW_FILE"]}/runs'
              '?event=workflow_dispatch&per_page=100')
          runs=[run for page in run_pages for run in page.get('workflow_runs',[])]
          if not any(int(run['id'])==current for run in runs):
              raise SystemExit('current I033 run not visible; fail closed')

          consuming={
              'Materialize fresh I033 target public-development-v3 partitions',
              'Evaluate candidate-zero NS/VAD causal noise-delta alignment',
          }
          for run in runs:
              run_id=int(run['id'])
              if run_id==current:
                  continue
              attempts=int(run.get('run_attempt') or 0)
              if attempts<1:
                  raise SystemExit('invalid prior I033 attempt count')
              for run_attempt in range(1,attempts+1):
                  job_pages=pages(
                      f'repos/{repo}/actions/runs/{run_id}/attempts/{run_attempt}/jobs'
                      '?per_page=100')
                  for page in job_pages:
                      for job in page.get('jobs',[]):
                          for step in job.get('steps',[]):
                              if (
                                  step.get('name') in consuming
                                  and step.get('conclusion')!='skipped'
                              ):
                                  raise SystemExit(
                                      f'I033 one-shot authority already consumed by run {run_id}')
          print('I033 one-shot authority: fresh')
          PY
      - name: Bind frozen I033 inputs and unchanged shipping source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          c=json.loads(Path('.github/research/continuous-optimization/development-v4/i033-ns-vad-causal-noise-delta-alignment-v1.json').read_text())
          def blob(path):
              return subprocess.check_output(
                  ['git','rev-parse','HEAD:'+path],text=True).strip()
          assert blob(c['predecessor']['i032_closure'])==c['predecessor']['i032_closure_blob_sha']
          assert blob(c['dataset_authority']['lock_path'])==c['dataset_authority']['dataset_lock_git_blob_sha']
          assert blob(c['dataset_authority']['builder_path'])==c['dataset_authority']['builder_git_blob_sha']
          assert blob(c['diagnostic_inputs']['probe_path'])==c['diagnostic_inputs']['probe_git_blob_sha']
          assert blob(c['diagnostic_inputs']['evaluator_path'])==c['diagnostic_inputs']['evaluator_git_blob_sha']
          assert hashlib.sha256(Path(c['dataset_authority']['lock_path']).read_bytes()).hexdigest()==c['dataset_authority']['dataset_lock_sha256']
          PY
          SOURCE_BASE="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["source_base_sha"])')"
          git cat-file -e "$SOURCE_BASE^{commit}"
          git diff --exit-code "$SOURCE_BASE"...HEAD --             src/enhance/ap_noise_tracker.c             src/enhance/ap_noise_tracker.h             src/enhance/ap_ns.c             src/enhance/ap_vad.c             src/modules/ap_vad_module.c             src/modules/ap_ns_module.c             include/audio_pipeline/audio_modules.h             src/enhance/ap_enhance.h
      - name: Install public-development decoder
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg >/dev/null
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: i033-causal-noise-delta
      - name: Build I033 causal noise-delta probe
        run: |
          set -euo pipefail
          cmake -S . -B build-i033             -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-i033 --target audio_pipeline --parallel
          ${CC:-cc} -std=c11 -O2 -Wall -Wextra -Werror             -DAP_BUILD_STAGE_NS=1 -DAP_BUILD_STAGE_RES=1 -DAP_BUILD_NS_EMA=1             -Iinclude -Isrc -Ibuild-i033/generated             tests/validation/i033_ns_vad_causal_noise_delta_probe.c             build-i033/libaudio_pipeline.a -lm             -o build-i033/i033-probe
      - name: Materialize fresh I033 target public-development-v3 partitions
        run: |
          set -euo pipefail
          LOCK="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["lock_path"])')"
          BUILDER="$(python3 -c 'import json,os; print(json.load(open(os.environ["CONTRACT"]))["dataset_authority"]["builder_path"])')"
          python3 .github/research/continuous-optimization/development-data-v3/prepare.py             --lock "$LOCK" --root "$DEV_ROOT"             --output /tmp/i033-development-v3-materialization.json
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            python3 "$BUILDER"               --lock "$LOCK"               --materialization /tmp/i033-development-v3-materialization.json               --data-root "$DEV_ROOT"               --output "/tmp/i033-target-$seed"               --seed "$seed" --mix-limit 28 --noise-limit 14 --clean-limit 14
          done
      - name: Evaluate candidate-zero NS/VAD causal noise-delta alignment
        id: evaluate
        run: |
          set -euo pipefail
          rm -rf i033-out
          mkdir -p i033-out/evidence
          target_args=()
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            target_args+=(--target-corpus "/tmp/i033-target-$seed/corpus.json")
          done
          set +e
          python3 tests/validation/i033_ns_vad_causal_noise_delta_alignment.py             --probe build-i033/i033-probe             --contract "$CONTRACT"             "${target_args[@]}"             --output i033-out/evidence/result.json             > i033-out/evidence/evaluate.stdout             2> i033-out/evidence/evaluate.stderr
          rc=$?
          set -e
          printf '%s
' "$rc" > i033-out/evidence/evaluate.exit-code
          cp "$CONTRACT" i033-out/evidence/contract.json
          cp /tmp/i033-development-v3-materialization.json i033-out/evidence/materialization.json
          sha256sum build-i033/i033-probe | awk '{print $1}' > i033-out/evidence/probe.sha256
          for seed in $(python3 -c 'import json,os; print(*json.load(open(os.environ["CONTRACT"]))["fresh_diagnostic_authority"]["target_seeds"])'); do
            sha256sum "/tmp/i033-target-$seed/corpus.json"
          done > i033-out/evidence/corpora.sha256
          printf 'main_sha=%s
' "$GITHUB_SHA" > i033-out/evidence/build-info.txt
          if test -f i033-out/evidence/result.json; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i033-out/evidence/result.json').read_text())
          Path('i033-out/evidence/summary.json').write_text(
              json.dumps({
                  'decision':r['decision'],
                  'invalid_reasons':r['invalid_reasons'],
                  'fresh_diagnostic_authority':r['fresh_diagnostic_authority'],
                  'shipping_mirror':r['shipping_mirror'],
                  'coverage':r['coverage'],
                  'delta_alignment':r['delta_alignment'],
                  'delta_alignment_hypothesis':r['delta_alignment_hypothesis'],
                  'interpretation_boundary':r['interpretation_boundary'],
              },indent=2,sort_keys=True)+'
')
          PY
          fi
          (
            cd i033-out/evidence
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f
' | sort |               while read -r file; do sha256sum "$file"; done > SHA256SUMS
          )
          exit "$rc"
      - name: Enforce delta-diagnostic-only authority
        if: steps.evaluate.outcome == 'success'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('i033-out/evidence/result.json').read_text())
          assert r['decision']=='NS_VAD_CAUSAL_NOISE_DELTA_ALIGNMENT_DECOMPOSED_REVIEW_REQUIRED'
          assert r['invalid_reasons']==[]
          assert r['diagnostic_execution_consumed']==1
          assert r['candidate_budget_consumed']==0
          assert r['confirmation_budget_consumed']==0
          assert r['shipping_mirror']['vad_active_mismatch_frames']==0
          b=r['interpretation_boundary']
          assert b['target_only_no_donor_selection'] is True
          assert b['causal_anchor_is_last_prior_ordinary_noise_reference'] is True
          assert b['target_is_first_pre_ready_speech_disagreement'] is True
          assert b['anchor_and_target_are_causal'] is True
          assert b['post_target_benchmark_is_retrospective_only'] is True
          assert b['same_anchor_used_for_ns_and_local_deltas'] is True
          assert b['ns_delta_uses_shipping_ns_noise_rms_dbfs'] is True
          assert b['local_delta_uses_post_ns_frame_rms_dbfs'] is True
          assert b['shipping_ns_vad_source_unchanged'] is True
          assert b['no_absolute_normalization_mapping'] is True
          assert b['no_vad_noise_state_refresh_rule'] is True
          assert b['no_threshold_search'] is True
          assert b['no_source_candidate'] is True
          assert b['no_shipping_candidate'] is True
          assert all(value is False for value in r['authority_boundary'].values())
          PY
      - name: Publish bounded diagnostic summary
        if: always()
        run: |
          if test -f i033-out/evidence/summary.json; then
            cat i033-out/evidence/summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload hash-bound I033 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: i033-ns-vad-causal-noise-delta-${{ github.run_id }}
          path: i033-out/
          retention-days: 90
          if-no-files-found: error
