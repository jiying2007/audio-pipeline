name: System Robustness v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/program/SYSTEM_ROBUSTNESS_V1.md'
      - 'docs/program/iterations/S00*.json'
      - 'validation/failure-replay/**'
      - 'validation/tools/build_system_robustness_corpus.py'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/build_dechorate_artifact_exclusion_corpus.py'
      - 'validation/tools/cross_source_artifact_exclusion.py'
      - 'validation/policies/validation-s003-dechorate-artifact-exclusion.json'
      - 'validation/tools/build_slr31_subsig_transfer_corpus.py'
      - 'validation/tools/slr31_subsig_transfer.py'
      - 'validation/tools/slr31_mic_mismatch_source_oracle.py'
      - 'validation/policies/validation-s003-slr31-subsig-transfer.json'
      - 'validation/tools/build_stage_interaction_corpus.py'
      - 'validation/tools/stage_interaction_attribution.py'
      - 'validation/tools/stage_interaction_consistency.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'validation/policies/validation-aec-transition-development.json'
      - 'validation/tools/system_robustness_attribution.py'
      - 'ci/ssc305-resource-profiles.json'
      - 'tests/validation/test_system_robustness_v1.py'
      - '.github/workflows/system-robustness-v1.yml'
  push:
    branches: [main]
    paths:
      - 'docs/program/SYSTEM_ROBUSTNESS_V1.md'
      - 'docs/program/iterations/S00*.json'
      - 'validation/failure-replay/**'
      - 'validation/tools/build_system_robustness_corpus.py'
      - 'validation/tools/build_aec_transition_corpus.py'
      - 'validation/tools/build_dechorate_artifact_exclusion_corpus.py'
      - 'validation/tools/cross_source_artifact_exclusion.py'
      - 'validation/policies/validation-s003-dechorate-artifact-exclusion.json'
      - 'validation/tools/build_slr31_subsig_transfer_corpus.py'
      - 'validation/tools/slr31_subsig_transfer.py'
      - 'validation/tools/slr31_mic_mismatch_source_oracle.py'
      - 'validation/policies/validation-s003-slr31-subsig-transfer.json'
      - 'validation/tools/build_stage_interaction_corpus.py'
      - 'validation/tools/stage_interaction_attribution.py'
      - 'validation/tools/stage_interaction_consistency.py'
      - 'validation/tools/stage_interaction_run.py'
      - 'tests/validation/stage_prefix_process_pcm.c'
      - 'validation/policies/validation-aec-transition-development.json'
      - 'validation/tools/system_robustness_attribution.py'
      - 'ci/ssc305-resource-profiles.json'
      - 'tests/validation/test_system_robustness_v1.py'
      - '.github/workflows/system-robustness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-robustness-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Freeze terminal NS lineage and candidate-zero authority
        run: |
          set -euo pipefail
          python3 -m py_compile \
            validation/tools/build_system_robustness_corpus.py \
            validation/tools/build_aec_transition_corpus.py \
            validation/tools/build_dechorate_artifact_exclusion_corpus.py \
            validation/tools/cross_source_artifact_exclusion.py \
            validation/tools/build_slr31_subsig_transfer_corpus.py \
            validation/tools/slr31_subsig_transfer.py \
            validation/tools/slr31_mic_mismatch_source_oracle.py \
            validation/tools/build_stage_interaction_corpus.py \
            validation/tools/stage_interaction_attribution.py \
            validation/tools/stage_interaction_consistency.py \
            validation/tools/stage_interaction_run.py \
            validation/tools/system_robustness_attribution.py \
            tests/validation/test_system_robustness_v1.py
          python3 tests/validation/test_system_robustness_v1.py
          python3 validation/tools/build_system_robustness_corpus.py --self-test
          python3 validation/tools/build_aec_transition_corpus.py --self-test
          python3 validation/tools/cross_source_artifact_exclusion.py --self-test
          python3 validation/tools/build_slr31_subsig_transfer_corpus.py --self-test
          python3 validation/tools/slr31_subsig_transfer.py --self-test
          python3 validation/tools/slr31_mic_mismatch_source_oracle.py self-test
          python3 validation/tools/build_stage_interaction_corpus.py --self-test
          for f in docs/program/iterations/S001.json docs/program/iterations/S002.json \
                   docs/program/iterations/S003.json \
                   docs/program/iterations/S003-cross-source-artifact-exclusion-v1.json \
                   docs/program/iterations/S003-public-clean-speech-subsig-transfer-v1.json \
                   docs/program/iterations/S003-mic-mismatch-measurement-domain-oracle-v1.json \
                   validation/failure-replay/schema-v1.json \
                   validation/policies/validation-s003-dechorate-artifact-exclusion.json \
                   validation/policies/validation-s003-slr31-subsig-transfer.json \
                   ci/ssc305-resource-profiles.json; do
            python3 -m json.tool "$f" >/dev/null
          done

  s001-perturbation-map:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        seed: [5307, 5407]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: system-robustness-s001-${{ matrix.seed }}
      - name: Build fixed shipping processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s001 -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s001 --target ap_process_pcm --parallel
      - name: Run candidate-zero perturbation map
        run: |
          set -euo pipefail
          root="/tmp/s001-${{ matrix.seed }}"
          out="system-robustness-out/s001-${{ matrix.seed }}"
          mkdir -p "$out"
          python3 validation/tools/build_system_robustness_corpus.py \
            --output "$root" --seed '${{ matrix.seed }}' --seconds 5
          python3 validation/tools/run_validation.py \
            --source-revision '${{ github.sha }}' \
            --corpus "$root/corpus.json" \
            --policy validation/policies/validation-smoke.json \
            --dataset-lock validation/datasets.lock.json \
            --processor build-s001/ap_process_pcm \
            --output "$out/report.json" \
            --evidence-manifest "$out/evidence-manifest.json"
          python3 validation/tools/system_robustness_attribution.py \
            --corpus "$root/corpus.json" --report "$out/report.json" --output-dir "$out" \
            --watch-contract docs/program/iterations/S001.json
          cp "$root/corpus.json" "$out/corpus.json"
          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"
      - name: Publish S001 summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          seed='${{ matrix.seed }}'
          root=Path(f'system-robustness-out/s001-{seed}')
          report=json.loads((root/'report.json').read_text())
          heat=json.loads((root/'failure-heatmap.json').read_text())
          replay=json.loads((root/'failure-replay-index.json').read_text())
          print(f"## S001 seed {seed}")
          print("- Authority: candidate-zero / regression-only / non-shipping")
          print(f"- Validation result: {report['validation_result']}")
          watch=json.loads((root/'diagnostic-watch.json').read_text())
          print(f"- Failure replay entries: {len(replay['failures'])}")
          print(f"- Diagnostic degradations: {watch['diagnostic_degradation_count']}")
          print(f"- Policy failures: {watch['policy_failure_count']}")
          print(f"- Families: {len(heat['families'])}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-robustness-s001-${{ matrix.seed }}-${{ github.run_id }}
          path: system-robustness-out/s001-${{ matrix.seed }}/
          if-no-files-found: error
          retention-days: 30

  s002-aec-transition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: system-robustness-s002
      - name: Run AEC transition and continuous-motion decomposition without tuning
        run: |
          set -euo pipefail
          python3 validation/tools/build_aec_transition_corpus.py --self-test
          python3 validation/tools/build_aec_motion_corpus.py --self-test
          cmake -S . -B build-s002 -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s002 --target ap_process_pcm --parallel

          transition_root=/tmp/s002-transition
          motion_root=/tmp/s002-motion
          out=system-robustness-out/s002
          mkdir -p "$out/transition" "$out/motion"

          python3 validation/tools/build_aec_transition_corpus.py \
            --output "$transition_root" --seed 6307 --seconds 6
          python3 validation/tools/run_validation.py \
            --source-revision '${{ github.sha }}' \
            --corpus "$transition_root/corpus.json" \
            --policy validation/policies/validation-aec-transition-development.json \
            --dataset-lock validation/datasets.lock.json \
            --processor build-s002/ap_process_pcm \
            --output "$out/transition/report.json" \
            --evidence-manifest "$out/transition/evidence-manifest.json"
          cp "$transition_root/corpus.json" "$out/transition/corpus.json"

          python3 validation/tools/build_aec_motion_corpus.py \
            --output "$motion_root" --seed 6107 --seconds 8
          python3 validation/tools/run_validation.py \
            --source-revision '${{ github.sha }}' \
            --corpus "$motion_root/corpus.json" \
            --policy validation/policies/validation-aec-motion-development.json \
            --dataset-lock validation/datasets.lock.json \
            --processor build-s002/ap_process_pcm \
            --output "$out/motion/report.json" \
            --evidence-manifest "$out/motion/evidence-manifest.json"
          cp "$motion_root/corpus.json" "$out/motion/corpus.json"
          cp "$motion_root/source-manifest.json" "$out/motion/source-manifest.json"

          find "$out" -type f -print0 | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Publish S002 summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root=Path("system-robustness-out/s002")
          transition=json.loads((root/"transition/report.json").read_text())
          motion=json.loads((root/"motion/report.json").read_text())
          print("## S002 AEC transition decomposition")
          print("- Authority: candidate-zero / development-only / non-shipping")
          print(f"- Transition cases: {len(transition['cases'])}; result: {transition['validation_result']}")
          print(f"- Motion cases: {len(motion['cases'])}; result: {motion['validation_result']}")
          print("- Parameter search: none")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-robustness-s002-${{ github.run_id }}
          path: system-robustness-out/s002/
          if-no-files-found: error
          retention-days: 30

  s003-stage-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-ccache
        with:
          namespace: system-robustness-s003
      - name: Build diagnostic stage-prefix processor
        run: |
          set -euo pipefail
          cmake -S . -B build-s003 -DCMAKE_BUILD_TYPE=Release -DAP_BUILD_BENCH=OFF -DAP_STRICT_WARNINGS=ON
          cmake --build build-s003 --target audio_pipeline --parallel
          cc -std=c11 -Wall -Wextra -Werror \
            -Iinclude -Ibuild-s003/generated \
            tests/validation/stage_prefix_process_pcm.c \
            build-s003/libaudio_pipeline.a -lm \
            -o build-s003/stage_prefix_process_pcm
      - name: Run fresh cross-stage interaction replays
        run: |
          set -euo pipefail
          out=system-robustness-out/s003
          mkdir -p "$out"

          for seed in 7307 7407; do
            root="/tmp/s003-stage-$seed"
            seed_out="$out/$seed"
            mkdir -p "$seed_out"
            python3 validation/tools/build_stage_interaction_corpus.py \
              --output "$root" --seed "$seed" --seconds 6
            python3 validation/tools/stage_interaction_run.py \
              --source-revision '${{ github.sha }}' \
              --corpus "$root/corpus.json" \
              --policy validation/policies/validation-smoke.json \
              --dataset-lock validation/datasets.lock.json \
              --processor build-s003/stage_prefix_process_pcm \
              --output "$seed_out/report.json" \
              --evidence-manifest "$seed_out/evidence-manifest.json"
            python3 validation/tools/stage_interaction_attribution.py \
              --corpus "$root/corpus.json" \
              --report "$seed_out/report.json" \
              --watch-contract docs/program/iterations/S001.json \
              --output-dir "$seed_out"
            cp "$root/corpus.json" "$seed_out/corpus.json"
          done

          python3 validation/tools/stage_interaction_consistency.py \
            --attribution "$out/7307/stage-interaction-attribution.json" \
            --attribution "$out/7407/stage-interaction-attribution.json" \
            --output "$out/stage-interaction-consistency.json"
          find "$out" -type f ! -name SHA256SUMS -print0 | sort -z | \
            xargs -0 sha256sum > "$out/SHA256SUMS"
      - name: Publish S003 summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root=Path("system-robustness-out/s003")
          consistency=json.loads((root/"stage-interaction-consistency.json").read_text())
          print("## S003 stage-interaction attribution")
          print("- Authority: candidate-zero / observation-only / non-shipping")
          print(f"- Fresh seeds: {consistency['seeds']}")
          print(f"- Base cases: {consistency['summary']['case_count']}")
          print(f"- Consistent first-stage cases: {consistency['summary']['consistent_first_stage_count']}")
          print(f"- Repeated non-null stages: {consistency['summary']['repeated_non_null_stage_count']}")
          print(f"- S004 stage-consistency preconditions: {consistency['summary']['s004_stage_consistency_precondition_count']}")
          print("- Root-cause authority: none")
          print("- S004 candidate authority: none")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-robustness-s003-${{ github.run_id }}
          path: system-robustness-out/s003/
          if-no-files-found: error
          retention-days: 30
